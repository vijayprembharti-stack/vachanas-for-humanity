nt même, a définitivement aboli la vitalité de son existence passée.\n\nLa portée spirituelle de ce poème réside dans l'affirmation que l'union avec la Conscience pure dissout à jamais l'identité ancienne, rendant tout retour à l'état antérieur d'attachement et d'illusion impossible."}},{"no":1171,"o":"ಕೆಚ್ಚಿಲ್ಲದ ಮರನ ಕ್ರಿಮಿ ಇಂಬುಗೊಂಬಂತೆ,\n ಒಡೆಯನಿಲ್ಲದ ಮನೆಯ ಶುನಕ ಸಂಚುಗೊಂಬಂತೆ,\n ನೃಪತಿಯಿಲ್ಲದ ದೇಶವ ಮನ್ನೆಯರಿಂಬುಗೊಂಬಂತೆ,\n ನಿಮ್ಮ ನೆನಹಿಲ್ಲದ ಶರೀರ[ವು]\n ಭೂತ ಪ್ರೇತ ಪಿಶಾಚಿಗಳಿಂಬುಗೊಂಬಂತೆ\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"Like worms making their abode in a tree without heartwood,\nlike a dog prowling into a house without a master,\nlike chieftains seizing a land without a king,\na body devoid of your remembrance\nis like an abode taken over by ghosts, spirits, and demons,\nO Chennamallikarjuna.","hi":"सारहीन वृक्ष में जैसे कीड़े आश्रय लेते हैं,\nस्वामीहीन घर में जैसे कुत्ते घात लगाते हैं,\nराजाहीन देश को जैसे सामंत अपने वश में कर लेते हैं,\nआपके स्मरण से रहित शरीर\nभूत, प्रेत और पिशाचों के आश्रय लेने के समान है,\nहे चेन्नमल्लिकार्जुन।","mr":"गाभा नसलेल्या झाडाला किड्यांनी थारा करावा त्याप्रमाणे,\nमालक नसलेल्या घरात कुत्र्याने दबा धरावा त्याप्रमाणे,\nराजा नसलेला देश सरदारांनी बळकावावा त्याप्रमाणे,\nतुमचे स्मरण नसलेले शरीर\nभूत, प्रेत, पिशाच्चांनी व्यापून टाकावे त्याप्रमाणे असते,\nहे चेन्नमल्लिकार्जुना.","fr":"Comme les vers prennent demeure dans un arbre sans cœur,\ncomme un chien rôde dans une maison sans maître,\ncomme les seigneurs vassaux prennent demeure dans un pays sans roi,\nle corps privé de votre souvenir\nest tel celui où prennent demeure les esprits, les revenants et les démons,\nÔ Chennamallikarjuna."},"m":{"en":"This Vachana illustrates the spiritual vulnerability of a human life that lacks constant remembrance of the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nThrough vivid metaphors, it observes how anything devoid of its core strength or rightful master is quickly overrun by destructive forces—just as insects hollow out a tree lacking solid heartwood, stray dogs take over an abandoned house, and petty chieftains seize a kingdom without a sovereign.\n\nSimilarly, when the human body and mind are devoid of divine awareness, they lose their inner anchor and vitality.\n\nSuch an unguarded existence easily falls prey to base instincts, restless desires, and negative tendencies, which the Vachana symbolically compares to ghosts, spirits, and demons taking possession of an empty vessel.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस शरीर और मन में परमतत्त्व का निरंतर स्मरण नहीं होता, वह अपनी आंतरिक शक्ति और सार्थकता खोकर अवांछित विकारों का निवास बन जाता है।\n\nयहाँ तीन सटीक दृष्टांतों के माध्यम से यह समझाया गया है कि जैसे सारहीन वृक्ष में कीड़े लग जाते हैं, स्वामी के बिना घर में कुत्ते डेरा डाल लेते हैं और राजा विहीन देश पर सामंत या उपद्रवी लोग अधिकार कर लेते हैं।\n\nउसी प्रकार, चन्नमल्लिकार्जुन रूपी निराकार परम सत्य की स्मृति से रहित मानव देह भी भूत, प्रेत और पिशाच जैसी तामसिक वृत्तियों और निकृष्ट भावों के अधीन हो जाती है।\n\nइस वचन का आध्यात्मिक महत्त्व यह स्पष्ट करना है कि मनुष्य के भीतर शुद्ध चैतन्य की जागृत स्मृति ही वह मूल तत्व है, जो उसके जीवन को नकारात्मक और आसुरी वृत्तियों के प्रभाव से सुरक्षित रखती है।","mr":"चन्नमल्लिकार्जुन या नावाने संबोधल्या जाणाऱ्या परमतत्त्वाचे स्मरण नसलेल्या मानवी जीवनाची व शरीराची अवस्था कशी होते, हे या वचनातून प्रभावी उदाहरणांनी स्पष्ट केले आहे.\n\nज्याप्रमाणे आतील गाभा नसलेल्या पोकळ झाडामध्ये कीटक घर करतात, मालक नसलेल्या रिकाम्या घरात कुत्री शिरतात आणि राजा नसलेल्या देशाचा ताबा सामंत किंवा इतर अधिकारी घेतात, तशीच अवस्था परमतत्त्वाच्या स्मरणाशिवाय जगणाऱ्या माणसाची होते.\n\nअशा चैतन्यहीन आणि जागृती नसलेल्या शरीरावर भूत, प्रेत व पिशाच्च यांसारख्या अनिष्ट प्रवृत्ती ताबा मिळवतात, असे सांगून हे वचन आंतरिक आध्यात्मिक स्मरणाचे महत्त्व अधोरेखित करते.","fr":"Ce vachana met en lumière la vulnérabilité de l'être humain lorsque son esprit est dépourvu de la conscience constante de la Réalité suprême sans forme, invoquée ici sous le nom de Channamallikarjuna.\n\nPour illustrer cette vérité, le texte recourt à trois images frappantes : un arbre sans cœur de bois solide devient la proie des insectes, une demeure sans maître est envahie par les chiens errants, et un royaume sans souverain tombe sous l'emprise de chefs rivaux.\n\nDe la même manière, un corps privé du souvenir vivant du Principe absolu perd sa force intérieure et devient le refuge d'influences négatives et tourmentées, comparées symboliquement aux spectres et aux esprits malfaisants (Bhuta, Preta et Pishachi).\n\nLa portée spirituelle de ce vachana réside ainsi dans l'affirmation que seule la présence intérieure de la Conscience pure constitue le véritable cœur, le maître et le souverain capables de préserver l'intégrité de l'être."}},{"no":1172,"o":"ಕೆಡದಿರೇ ಕೆಡದಿರೇ, ಮೃಡನಡಿಯ ಹಿಡಿಯಿರೇ.\n ದೃಢವಲ್ಲ ನೋಡಿರೆ ಸಂಸಾರಸುಖವು.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಬರೆದ ಅಕ್ಷರವು ತೊಡೆಯದ ಮುನ್ನ\n ಬೇಗ ಬೇಗ ಶಿವಶರಣೆನ್ನಿ.","t":{"en":"Do not be ruined, do not be ruined; take hold of the feet of Mrida.\nLook, the pleasures of worldly life are not lasting.\nBefore the letters written by Chennamallikarjuna are wiped away,\nquickly, quickly say \"Shiva Sharana\".","hi":"नष्ट मत होओ, नष्ट मत होओ, मृड के चरण पकड़ो।\nदेखो, संसार का सुख दृढ़ नहीं है।\nचेन्नमल्लिकार्जुन के लिखे अक्षर के मिटने से पहले,\nशीघ्र-शीघ्र 'शिवशरण' कहो।","mr":"नाश पावू नका, नाश पावू नका; मृडाचे चरण धरा.\nपाहा, संसारसुख शाश्वत नाही.\nचेन्नमल्लिकार्जुनाने लिहिलेली अक्षरे पुसून जाण्यापूर्वी,\nलवकर लवकर शिवशरण म्हणा.","fr":"Ne vous perdez pas, ne vous perdez pas, saisissez les pieds de Mrida.\nVoyez, le bonheur de l'existence mondaine n'est point durable.\nAvant que les lettres inscrites par Chennamallikarjuna ne s'effacent,\nhâtez-vous, hâtez-vous de dire « Shiva Sharana »."},"m":{"en":"This Vachana sounds an urgent call against wasting human life in the pursuit of fleeting worldly pleasures.\n\nIt reminds us that material happiness is inherently unstable and impermanent, urging seekers instead to take refuge in the compassionate Supreme Reality.\n\nUsing the metaphor of an inscription written by Channamallikarjuna that will eventually be erased, the Vachana highlights the finite nature of our allotted lifespan.\n\nBefore the inevitable end arrives and time runs out, it calls upon individuals to awaken immediately and dedicate themselves to the path of Shiva-consciousness.","hi":"इस वचन का केंद्रीय संदेश यह है कि मनुष्य को अज्ञानता में भटककर अपना जीवन नष्ट नहीं करना चाहिए, बल्कि कल्याणकारी परमतत्त्व के मार्ग को अपनाना चाहिए।\n\nयह वचन स्पष्ट करता है कि सांसारिक सुख स्थायी या सुदृढ़ नहीं हैं, इसलिए उनके भ्रम में उलझे रहना व्यर्थ है।\n\nनिराकार परमतत्त्व चन्नमल्लिकार्जुन द्वारा निर्धारित जीवन की अवधि समाप्त होने से पहले ही, मनुष्य को बिना किसी विलंब के शिव-तत्त्व की शरण में चले जाना चाहिए।\n\nअतः इस वचन का आध्यात्मिक महत्त्व यह है कि नश्वर जीवन के समाप्त होने से पूर्व ही मनुष्य को सचेत होकर परम सत्य के प्रति समर्पित हो जाना चाहिए।","mr":"हे वचन आपल्याला या जाणिवेकडे घेऊन जाते की मानवाने आपले मौल्यवान जीवन वाया न घालवता वेळीच शिवतत्त्वाचा आश्रय घेतला पाहिजे.\n\nसंसारातील सर्व सुखे ही तात्पुरती, क्षणभंगुर आणि अस्थिर आहेत, हे वास्तव यात स्पष्टपणे मांडले आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाने ललाटावर लिहिलेले आयुष्याचे अक्षर पुसले जाण्यापूर्वीच म्हणजेच मृत्यू येण्यापूर्वी आपण सावध झाले पाहिजे.\n\nआयुष्य संपण्याआधीच कोणताही विलंब न लावता तत्काळ शिवशरणांच्या मार्गाचा स्वीकार करून परम सत्याशी एकरूप व्हावे, असा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana lance un appel pressant à ne pas se perdre dans l'illusion et à chercher refuge auprès de la Réalité suprême.\n\nIl met en lumière le caractère éphémère et instable des plaisirs de l'existence mondaine, sur lesquels nul ne peut véritablement s'appuyer.\n\nAvant que le temps imparti à la vie humaine — évoqué par les lettres du destin inscrites par Channamallikarjuna, la Conscience absolue — ne s'efface, il est essentiel de s'éveiller.\n\nLe texte exhorte ainsi à se tourner sans tarder vers la voie spirituelle en prenant immédiatement refuge dans le Principe divin."}},{"no":1173,"o":"ಕೊಳಲ ದನಿಗೆ ಸರ್ಪ ತಲೆದೂಗಿದಡೇನು,\n ಒಳಗಣ ವಿಷದ ಬಯಕೆ ಬಿಡದನ್ನಕ್ಕ?\n ಹಾಡಿದಡೇನು, ಕೇಳಿದಡೇನು,\n ತನ್ನಲುಳ್ಳ ಅವಗುಣ ಬಿಡದನ್ನಕ್ಕ?\n ಒಳಗನರಿದು ಹೊರಗೆ ಮರೆದವರ\n ನೀ ಎನಗೆ ತೋರಯ್ಯಾ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"What if a serpent sways its head to the sound of the flute,\nso long as it does not give up the craving of the venom within?\nWhat if one sings, what if one listens,\nso long as one does not give up the faults within oneself?\nThose who have realized the within and forgotten the without—\nshow them to me, O Chennamallikarjuna.","hi":"बाँसुरी की धुन पर सर्प सिर हिलाए तो क्या,\nजब तक भीतर के विष की लालसा न छोड़े?\nगाने से क्या, सुनने से क्या,\nजब तक अपने भीतर का अवगुण न छोड़े?\nभीतर को जानकर बाहर को भूलनेवालों को,\nतुम मुझे दिखाओ, हे चेन्नमल्लिकार्जुन।","mr":"बासरीच्या सुरावर सर्पाने मान डोलवली म्हणून काय झाले,\nआतल्या विषाची लालसा जोवर सुटत नाही तोवर?\nगायले म्हणून काय झाले, ऐकले म्हणून काय झाले,\nआपल्यात असलेले अवगुण जोवर सुटत नाहीत तोवर?\nआतले जाणून बाह्य जग विसरलेल्यांना\nतू मला दाखव रे, हे चेन्नमल्लिकार्जुना।","fr":"Qu'importe si le serpent balance la tête au son de la flûte,\ntant qu'il ne quitte pas le désir du venin qui est en lui ?\nQu'importe que l'on chante, qu'importe que l'on écoute,\ntant que l'on ne quitte pas les défauts qui sont en soi ?\nCeux qui ont pris conscience de l'intérieur et oublié l'extérieur,\nmontre-les-moi, Ô Seigneur, Ô Chennamallikarjuna."},"m":{"en":"This Vachana highlights the futility of outward spiritual expressions when they are not accompanied by genuine inner transformation.\n\nUsing the vivid image of a cobra swaying to the melody of a flute while still retaining its inner craving for venom, the Vachana points out that external appreciation of beauty or spirituality means nothing if one's underlying toxic tendencies remain unchanged.\n\nSimilarly, merely singing devotional songs or listening to spiritual discourses is pointless until a person consciously sheds their own inner flaws and vices.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana expresses a deep longing to encounter truly realized souls who have awakened to their inner truth (Arivu) and transcended mere external appearances and worldly distractions.","hi":"इस वचन का केंद्रीय भाव यह है कि जब तक मनुष्य अपने भीतर के दोषों और अवगुणों का त्याग नहीं करता, तब तक केवल बाहरी रूप से भक्ति के गीत गाना या सुनना निरर्थक है।\n\nजिस प्रकार बांसुरी की मधुर धुन पर साँप अपना फन तो हिलाता है, किंतु अपने भीतर के विष और डसने की प्रवृत्ति को नहीं छोड़ता, उसी प्रकार आंतरिक शुद्धि के बिना बाहरी आध्यात्मिक आचरण निष्फल होता है।\n\nयहाँ परमतत्त्व चन्नमल्लिकार्जुन को संबोधित करते हुए ऐसे सच्चे साधकों के दर्शन की आकांक्षा व्यक्त की गई है, जिन्होंने अपने अंतर्मन के सत्य को जानकर बाहरी आडंबरों और सांसारिक विस्मृतियों को पूरी तरह त्याग दिया है।","mr":"हे वचन बाह्य भक्तीचा दिखावा आणि आंतरिक शुद्धी यातील महत्त्वाचा भेद स्पष्ट करते.\n\nज्याप्रमाणे पुंगीच्या स्वरावर नाग कितीही डोलला तरी त्याच्या आतील विष टाकण्याची वृत्ती सुटत नाही, त्याचप्रमाणे स्वतःमधील दोष आणि अवगुण सोडल्याशिवाय केवळ भक्तीगीते गाणे किंवा ती ऐकणे निरर्थक ठरते.\n\nआध्यात्मिक प्रगतीसाठी केवळ बाह्य आचरण पुरेसे नसून, मनातील विकार आणि वाईट प्रवृत्तींचा त्याग करणे आवश्यक आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाला स्मरून, ज्यांनी स्वतःचे अंतरंग पूर्णपणे जाणले आहे आणि बाह्य जगाचा विसर पाडला आहे, अशा खऱ्या आत्मज्ञानी साधकांचे दर्शन घडवण्याची आर्तता या वचनातून व्यक्त होते.","fr":"Ce vachana met en lumière la futilité d'une dévotion purement extérieure lorsqu'elle ne s'accompagne pas d'une véritable transformation intérieure.\n\nÀ travers la métaphore du serpent qui ondule au son de la flûte sans jamais renoncer à son venin, le texte rappelle que chanter des hymnes ou écouter des enseignements spirituels reste vain tant que l'on ne se libère pas de ses propres défauts.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce poème exprime l'aspiration profonde à rencontrer les êtres éveillés qui ont connu la vérité intérieure et se sont détachés des apparences du monde extérieur."}},{"no":1174,"o":"ಕೋಲ ತುದಿಯ ಕೋಡಗದಂತೆ,\n ನೇಣ ತುದಿಯ ಬೊಂಬೆಯಂತೆ,\n ಆಡಿದೆನಯ್ಯಾ ನೀನಾಡಿಸಿದಂತೆ,\n ಆನು ನುಡಿದೆನಯ್ಯಾ ನೀ ನುಡಿಸಿದಂತೆ,\n ಆನು ಇದ್ದೆನಯ್ಯಾ ನೀನು ಇರಿಸಿದಂತೆ,\n ಜಗದ ಯಂತ್ರವಾಹಕ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಸಾಕೆಂಬನ್ನಕ್ಕ.","t":{"en":"Like a monkey at the tip of a pole,\nlike a puppet at the end of a string,\nI danced, O Lord, just as you made me dance,\nI spoke, O Lord, just as you made me speak,\nI remained, O Lord, just as you made me remain,\nuntil Chennamallikarjuna, the mover of the machine of the world, says, \"Enough.\"","hi":"डंडे के सिरे के बंदर के समान,\nडोरी के सिरे की कठपुतली के समान,\nमैं नाची हे स्वामी, जैसे तुमने नचाया,\nमैं बोली हे स्वामी, जैसे तुमने बुलवाया,\nमैं रही हे स्वामी, जैसे तुमने रखा,\nजग के यंत्रवाहक चेन्नमल्लिकार्जुन के 'बस' कहने तक।","mr":"काठीच्या टोकावरील माकडाप्रमाणे,\nदोरीच्या टोकावरील बाहुलीप्रमाणे,\nमी नाचले हे प्रभो, तू नाचवलेस तसे,\nमी बोलले हे प्रभो, तू बोलवलेस तसे,\nमी राहिले हे प्रभो, तू ठेवलेस तसे,\nजगाचा यंत्रवाहक चेन्नमल्लिकार्जुन 'पुरे' म्हणेल तोपर्यंत।","fr":"Comme un singe au bout d'un bâton,\ncomme une marionnette au bout d'une corde,\nj'ai dansé, ô Seigneur, comme tu m'as fait danser ;\nj'ai parlé, ô Seigneur, comme tu m'as fait parler ;\nj'ai demeuré, ô Seigneur, comme tu m'as fait demeurer,\njusqu'à ce que Chennamallikarjuna, le moteur de la mécanique du monde, dise : « C'est assez. »"},"m":{"en":"This Vachana expresses a state of complete ego-dissolution, where the seeker realizes that individual actions, speech, and existence are entirely governed by the Formless Supreme Consciousness.\n\nThrough the vivid metaphors of a monkey dancing at the end of a stick and a puppet moving at the end of a string, the Vachana illustrates how human agency is ultimately an instrument directed by a higher cosmic rhythm.\n\nAddressing the Supreme Reality as Channamallikarjuna, the prime mover of the universe's mechanism, the seeker relinquishes all sense of personal doership and abides in total alignment with the Absolute until it deems the journey complete.","hi":"इस वचन का केंद्रीय भाव यह है कि मनुष्य का संपूर्ण अस्तित्व और उसकी सभी क्रियाएँ निराकार परमतत्त्व के संचालन के अधीन हैं।\n\nजिस प्रकार लाठी के सिरे पर बंधा हुआ बंदर या डोरी के सिरे से बंधी हुई कठपुतली नचाने वाले के इशारे पर ही नाचती है, उसी प्रकार साधक भी स्वयं को उस परम चैतन्य के हाथों का एक माध्यम मात्र मानता है।\n\nसाधक का बोलना, चलना और किसी भी स्थिति में रहना सब कुछ उसी परम सत्य की प्रेरणा से होता है, जिसमें व्यक्तिगत अहंकार या कर्तापन का कोई स्थान नहीं है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि जब तक संपूर्ण जगत् के सूत्रधार चन्नमल्लिकार्जुन स्वयं 'बस' नहीं कह देते, तब तक साधक उनकी इच्छा के अनुसार ही अपने जीवन की प्रत्येक भूमिका का निर्वहन करता रहता है।","mr":"या वचनाचा मुख्य आशय असा आहे की, मानवी जीवनातील प्रत्येक हालचाल, वाणी आणि अस्तित्व हे सर्वस्वी विश्वाचे नियमन करणाऱ्या परमतत्त्वाच्या प्रेरणेवर अवलंबून आहे.\n\nकाठीच्या टोकावर नाचणाऱ्या माकडाप्रमाणे किंवा दोरीच्या टोकावर हालणाऱ्या कळसूत्री बाहुलीप्रमाणे, साधक स्वतःला चन्नमल्लिकार्जुन या निराकार परमतत्त्वाच्या हातातील एक माध्यम मानतो.\n\nजगाचा यंत्रचालक असलेले हे परम चैतन्य जसे नाचवते, जसे बोलवते आणि ज्या स्थितीत ठेवते, अगदी तसेच आणि तोवरच आपले जीवन चालते, ही संपूर्ण अहंकारशून्यतेची व शरणागतीची जाणीव या वचनातून व्यक्त होते.","fr":"Ce vachana exprime un effacement complet de l'ego individuel devant la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna.\n\nÀ travers les images saisissantes du singe au bout d'un bâton et de la marionnette au bout d'un fil, le texte illustre que chaque mouvement, chaque parole et chaque état de l'existence dépendent entièrement de ce principe absolu qui anime l'univers.\n\nL'être humain reconnaît ainsi n'avoir aucune autonomie propre dans ses actes ou dans sa demeure, vivant exactement selon l'impulsion qui lui est donnée par le moteur cosmique du monde.\n\nLa portée spirituelle de ce poème réside dans l'acceptation sereine de cette dynamique universelle, qui se poursuit jusqu'à l'instant où la Conscience suprême elle-même décide que le jeu de l'existence touche à sa fin."}},{"no":1175,"o":"ಗಂಗೆಯೊಡನಾಡಿದ ಘಟ್ಟ ಬೆಟ್ಟಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಅಗ್ನಿಯೊಡನಾಡಿದ ಕಾಷô್ಠಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಯೋತಿಯೊಡನಾಡಿದ ಕತ್ತಲೆ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಞಾನಿಯೊಡನಾಡಿದ ಅಜ್ಞಾನಿ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಎಲೆ ಪರಶಿವಮೂರ್ತಿ ಹರನೆ, ನಿಮ್ಮ ಜಂಗಮಲಿಂಗದೊಡನಾಡಿ\n ಎನ್ನ ಭವಾದಿ ಭವಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಾ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ","t":{"en":"Behold the undoing of the ridges and hills that kept company with the Ganga, O brothers.\nBehold the undoing of the logs of wood that kept company with the fire, O brothers.\nBehold the undoing of the darkness that kept company with the light, O brothers.\nBehold the undoing of the ignorant one who kept company with the wise, O brothers.\nO Hara, embodiment of Supreme Shiva, having kept company with your *Jangamalinga*,\nbehold the undoing of all my births and cycles of birth, O Chennamallikarjuna.","hi":"गंगा के संग रमण करनेवाले घाटों और पर्वतों के नष्ट होने की दशा तो देखिए, हे भाई!\nअग्नि के संग रमण करनेवाली लकड़ियों के नष्ट होने की दशा तो देखिए, हे भाई!\nज्योति के संग रमण करनेवाले अंधकार के नष्ट होने की दशा तो देखिए, हे भाई!\nज्ञानी के संग रमण करनेवाले अज्ञानी के नष्ट होने की दशा तो देखिए, हे भाई!\nहे परशिवमूर्ति हर, आपके जंगमलिंग के संग रमण करके,\nमेरे भवादि भवों के नष्ट होने की दशा तो देखिए, हे चेन्नमल्लिकार्जुन!","mr":"गंगेशी संगत केलेल्या घाट आणि डोंगरांचा झालेला नाश पहा हो!\nअग्नीशी संगत केलेल्या काष्ठांचा झालेला नाश पहा हो!\nज्योतीशी संगत केलेल्या अंधाराचा झालेला नाश पहा हो!\nज्ञानी पुरुषाशी संगत केलेल्या अज्ञानी जीवाचा झालेला नाश पहा हो!\nहे परशिवमूर्ती हरा, तुमच्या जंगमलिंगाशी संगत करून\nमाझ्या जन्मोजन्मीच्या भवांचा झालेला नाश पहा, हे चेन्नमल्लिकार्जुना!","fr":"Voyez, mes frères, la ruine qu'ont subie les berges et les collines qui se sont mêlées au Gange.\nVoyez, mes frères, la ruine qu'a subie le bois qui s'est mêlé au feu.\nVoyez, mes frères, la ruine qu'ont subie les ténèbres qui se sont mêlées à la lumière.\nVoyez, mes frères, la ruine qu'a subie l'ignorant qui s'est mêlé au sage.\nÔ Hara, incarnation de Parashiva, après m'être mêlée à votre *Jangamalinga*,\nvoyez la ruine qu'ont subie le cycle de mes existences et toutes mes renaissances, Ô Chennamallikarjuna !"},"m":{"en":"This Vachana illustrates the profound transformative power of spiritual association through a series of striking metaphors, showing how contact with a higher force completely dissolves the lower state.\n\nJust as rocks and hills are worn away by the flowing Ganga, dry wood is consumed by fire, darkness vanishes in the presence of light, and an ignorant person loses their ignorance in the company of the wise, this seeming \"ruin\" is actually a total transformation into something higher.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana culminates in the realization that through intimate communion with the Jangamalinga—the enlightened spiritual seekers who embody dynamic divine consciousness—the seeker's own cycle of worldly existence and inner limitations has been completely eradicated.","hi":"इस वचन का केंद्रीय भाव यह है कि श्रेष्ठ और पावन सत्ता के संपर्क में आने से जड़ता, अंधकार और अज्ञान के पुराने अस्तित्व का पूर्णतः रूपांतरण हो जाता है।\n\nजिस प्रकार गंगा के प्रवाह के संपर्क में आने से विशाल पहाड़ और चट्टानें कटकर अपना कठोर रूप खो देती हैं, अग्नि के स्पर्श से लकड़ी का अस्तित्व मिटकर स्वयं अग्निमय हो जाता है, और ज्योति के संग से अंधकार समाप्त हो जाता है।\n\nउसी प्रकार, एक ज्ञानी के सान्निध्य में रहने से अज्ञानी व्यक्ति का अज्ञान नष्ट हो जाता है और वह स्वयं ज्ञानस्वरूप बन जाता है।\n\nचन्नमल्लिकार्जुन के रूप में संबोधित निराकार परमतत्त्व के प्रति यह वचन स्पष्ट करता है कि जागृत चेतना और आध्यात्मिक ज्ञान के जीवंत स्वरूप 'जंगमलिंग' के संग में रहने से साधक के जन्म-मरण (भव) के सारे बंधन सदा के लिए मिट जाते हैं।","mr":"हे वचन स्पष्ट करते की, सत्य आणि चैतन्याच्या संपर्कात आल्याने मूळचे जड व मर्यादित अस्तित्व कसे पूर्णपणे बदलून जाते.\n\nज्याप्रमाणे गंगेच्या प्रवाहाशी संगत केल्याने घाट आणि पर्वत झिजून जातात, अग्नीच्या संपर्काने लाकूड भस्म होते आणि प्रकाशाच्या सान्निध्यात अंधार नाहीसा होतो, त्याचप्रमाणे ज्ञानी व्यक्तीच्या सहवासात अज्ञानाचा नाश होतो.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, वरवर पाहता हा विनाश वाटत असला, तरी प्रत्यक्षात तो अज्ञान आणि जडत्वाचा अंत असून उच्च पातळीवरील रूपांतरण आहे.\n\nचन्नमल्लिकार्जुन या परमतत्त्वाच्या अनुभूतीमध्ये, जंगमरूपी जागृत आणि गतिशील चैतन्यतत्त्वाच्या सहवासाने साधकाचे जन्म-मरणरूपी सर्व भवबंधने कायमची नष्ट होतात, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le pouvoir de transformation radicale qu’exerce le contact avec la sagesse spirituelle, illustré par une série de métaphores naturelles saisissantes.\n\nTout comme les montagnes s’érodent au passage impétueux du fleuve, le bois se consume dans le feu et l’obscurité se dissipe devant la lumière, l’ignorance s’anéantit entièrement en présence d’un être éveillé.\n\nLe texte qualifie paradoxalement cette dissolution de « ruine », soulignant ainsi que la perte de sa forme première au contact d’une force supérieure est en réalité une transmutation libératrice.\n\nEn s’adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce poème montre que la communion avec le Jangamalinga, c’est-à-dire le guide spirituel incarnant la conscience dynamique, détruit définitivement le cycle des existences mondaines."}},{"no":1176,"o":"ಗಗನದ ಗುಂಪ ಚಂದ್ರಮ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ಹದ್ದು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ನದಿಯ ಗುಂಪ ತಾವರೆ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದ ಹೊನ್ನಾವರಿಕೆ ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಪುಷ್ಪದ ಪರಿಮಳವ ತುಂಬಿ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ನೊರಜು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಯ್ಯಾ, ನಿಮ್ಮ ಶರಣರ ನಿಲವ ನೀವೆ ಬಲ್ಲಿರಲ್ಲದೆ\n ಈ ಕೋಣನ ಮೈಮೇಲಣ ಸೊಳ್ಳೆಗಳೆತ್ತ ಬಲ್ಲವಯ್ಯಾ?","t":{"en":"Only the moon knows the depth of the sky;\nhow could the vulture hovering on the fringes know it, O Lord?\nOnly the lotus knows the depth of the river;\nhow could the golden-cassia growing on the bank know it, O Lord?\nOnly the bee knows the fragrance of the flower;\nhow could the gnat flitting around its edge know it, O Lord?\nO Lord Chennamallikarjuna, only you know the stature of your *Sharanas*;\nhow could these mosquitoes upon the body of a buffalo ever know it, O Lord?","hi":"गगन की गहराई चंद्रमा ही जानता है,\nकिंतु किनारे पर मँडरानेवाली चील क्या जाने, हे स्वामी?\nनदी की गहराई कमल ही जानता है,\nकिंतु किनारे पर उगनेवाली जंगली घास क्या जाने, हे स्वामी?\nपुष्प की सुगंध भँवरा ही जानता है,\nकिंतु बाहर भिनभिनानेवाला भुनगा क्या जाने, हे स्वामी?\nहे चेन्नमल्लिकार्जुन स्वामी, आपके शरणों की स्थिति आप ही जानते हैं,\nभैंसे के शरीर पर बैठे ये मच्छर भला कहाँ जान सकते हैं, हे स्वामी?","mr":"गगनाची खोली चंद्रच जाणतो,\nकडेला भटकणारी घार जाणेल का, हे स्वामी?\nनदीची खोली कमळच जाणते,\nकाठावर उगवलेले तरवडाचे झुडूप जाणेल का, हे स्वामी?\nपुष्पाचा परिमळ भ्रमरच जाणतो,\nआसपास भिरभिरणारे चिलट जाणेल का, हे स्वामी?\nहे प्रभो चेन्नमल्लिकार्जुना, तुमच्या शरणांची स्थिती तुम्हीच जाणता,\nया रेड्याच्या अंगावरील डास ती कोठून जाणतील, हे स्वामी?","fr":"Seule la lune connaît la profondeur du ciel ;\nle milan qui plane à la lisière pourrait-il la connaître, ô Seigneur ?\nSeul le lotus connaît la profondeur du fleuve ;\nl'herbe sauvage qui croît sur la rive pourrait-elle la connaître, ô Seigneur ?\nSeul le bourdon connaît le parfum de la fleur ;\nle moucheron qui rôde tout autour pourrait-il le connaître, ô Seigneur ?\nÔ Seigneur Chennamallikarjuna, vous seul connaissez la haute stature de vos *Sharanas* ;\ncomment ces moustiques sur le dos d'un buffle pourraient-ils donc la connaître, ô Seigneur ?"},"m":{"en":"This Vachana explains that the profound inner stature of true Sharanas can only be recognized by those who possess deep spiritual intimacy and elevated consciousness, rather than by those who remain on the periphery of existence.\n\nThrough vivid contrasts from nature, the Vachana illustrates that just as only the moon truly experiences the vastness of the sky rather than a vulture hovering at its edge, only the lotus knows the depth of the river rather than a weed growing on the bank, and only the bee savors the fragrance of a flower rather than a gnat buzzing nearby, superficial minds cannot grasp higher truths.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana emphasizes that only the Absolute itself truly comprehends the exalted spiritual state of the Sharanas.\n\nIn contrast, ordinary people who remain immersed in gross, worldly attachments—likened to mosquitoes clinging to the body of a buffalo—are entirely incapable of recognizing or understanding the transcendent nature of the enlightened ones.","hi":"यह वचन स्पष्ट करता है कि उच्च आध्यात्मिक सत्य और शरणों की अंतःस्थिति को केवल वही समझ सकता है जो स्वयं उस गहराई से जुड़ा हो, न कि बाहरी और सतही दृष्टि रखने वाले लोग।\n\nजिस प्रकार आकाश की गहराई को चंद्रमा, नदी की थाह को कमल और फूल की सुगंध को भँवरा ही जान सकता है, किंतु किनारे पर मंडराने वाली चील, तट की घास या साधारण मक्खी उस मर्म को नहीं समझ सकती।\n\nउसी प्रकार, भैंसे के शरीर पर भिनभिनाने वाले मच्छरों के समान तुच्छ और सांसारिक वृत्तियों में उलझे हुए अज्ञानी लोग शरणों की आध्यात्मिक ऊँचाई को जानने में सर्वथा असमर्थ हैं।\n\nइस वचन का मूल भाव यह है कि सच्चे शरणों की आंतरिक अवस्था और उनके आध्यात्मिक गौरव को केवल चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व ही पूर्ण रूप से जान सकता है।","mr":"हे वचन स्पष्ट करते की, उच्च आध्यात्मिक सत्य आणि अंतर्मुख अनुभवाची खोली समजण्यासाठी तशीच उच्च पातळीची पात्रता व सूक्ष्म जाणीव असणे आवश्यक असते.\n\nज्याप्रमाणे आकाशाचा अथांग विस्तार चंद्रालाच ठाऊक असतो पण खाली भटकणाऱ्या गिधाडाला नाही, नदीची खोली कमळाला कळते पण काठावरच्या तणाला नाही, आणि फुलाचा सुगंध भ्रमरालाच समजतो पण आजूबाजूच्या चिलटांना नाही, त्याप्रमाणे बाह्य व उथळ वृत्तीच्या लोकांना आध्यात्मिक गाभ्याचे आकलन होऊ शकत नाही.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाशी एकरूप झालेल्या आणि त्याच्याशी थेट आंतरिक नाते जोडलेल्या शरणांनाच परमतत्त्व खऱ्या अर्थाने जाणू शकते.\n\nसंसारातील अज्ञानात आणि अत्यंत खालच्या पातळीवरच्या विकारांत गुरफटलेल्या संकुचित वृत्तीच्या माणसांना शरणांच्या या उदात्त आध्यात्मिक स्थितीची ओळख कधीच पटू शकत नाही, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que l'état spirituel élevé et la profondeur intérieure des Sharanas ne peuvent être compris par les esprits superficiels ou attachés aux basses préoccupations du monde.\n\nÀ travers une série d'images poétiques issues de la nature, le texte montre que seule la lune connaît l'immensité du ciel, non le vautour qui plane à la lisière ; seul le lotus connaît la profondeur du fleuve, non la mauvaise herbe poussant sur la rive ; et seul le bourdon apprécie le parfum de la fleur, non le moucheron qui vole aux alentours.\n\nCes contrastes illustrent qu'il faut partager l'essence et l'élévation d'une réalité pour en saisir véritablement la profondeur et la valeur.\n\nAinsi, en s'adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce vachana affirme que seule la Conscience pure connaît véritablement la stature spirituelle des Sharanas, tandis que les êtres absorbés par la grossièreté matérielle, comparés aux moustiques posés sur le dos d'un buffle, demeurent incapables de la percevoir."}},{"no":1177,"o":"ಗಿರಿಯಲಲ್ಲದೆ ಹುಲ್ಲುಮೊರಡಿಯಲ್ಲಾಡುವುದೆ ನವಿಲು?\n ಕೊಳಕ್ಕಲ್ಲದೆ ಕಿರುವಳ್ಳಕ್ಕೆಳಸುವುದೆ ಹಂಸೆ?\n ಮಾಮರ ತಳಿತಲ್ಲದೆ ಸರಗೈವುದೆ ಕೋಗಿಲೆ?\n ಪರಿಮಳವಿಲ್ಲದ ಪುಷ್ಪಕ್ಕೆಳಸುವುದೆ ಭ್ರಮರ?\n ಎನ್ನ ದೇವ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಂಗಲ್ಲದೆ\n ಅನ್ಯಕ್ಕೆಳಸುವುದೆ ಎನ್ನ ಮನ?\n ಪೇಳಿರೆ, ಕೆಳದಿಯರಿರಾ!","t":{"en":"Would a peacock dance on a grassy mound rather than on a mountain?\nWould a swan yearn for a shallow brook rather than for a lake?\nWould a cuckoo sing unless the mango tree has sprouted fresh leaves?\nWould a bee yearn for a flower without fragrance?\nWould my mind yearn for any other\nthan my Lord Chennamallikarjuna?\nTell me, O my companions!","hi":"पर्वत के बिना, क्या घास के टीले पर नाचता है मोर?\nसरोवर के बिना, क्या छोटे नाले की कामना करता है हंस?\nआम के वृक्ष में कोंपलें फूटे बिना, क्या स्वर छेड़ती है कोयल?\nसुगंधहीन पुष्प की क्या कामना करता है भँवरा?\nमेरे देव चेन्नमल्लिकार्जुन के बिना,\nक्या किसी अन्य की कामना करेगा मेरा मन?\nबताओ री, सखियो!","mr":"गिरीवर सोडून गवताच्या टेकाडावर नाचेल का मोर?\nसरोवर सोडून लहानशा ओढ्याची ओढ धरील का हंस?\nआंब्याचे झाड बहरल्याशिवाय स्वर काढील का कोकीळ?\nसुगंध नसलेल्या फुलाकडे ओढ घेईल का भ्रमर?\nमाझा देव चेन्नमल्लिकार्जुनाशिवाय\nअन्याची ओढ धरील का माझे मन?\nसांगा ना, हे सख्यांनो!","fr":"Sinon sur la montagne, le paon danserait-il sur un tertre herbeux ?\nSinon vers l'étang, le cygne aspirerait-il à un mince ruisseau ?\nSans que le manguier ne bourgeonne, le coucou élèverait-il la voix ?\nL'abeille désirerait-elle une fleur sans parfum ?\nSinon vers mon Seigneur Chennamallikarjuna,\nmon esprit aspirerait-il à un autre ?\nDites-le-moi, ô mes compagnes !"},"m":{"en":"This Vachana uses four vivid images from nature to illustrate the unwavering focus of a seeker’s consciousness on the Supreme Reality.\n\nJust as a peacock naturally dances on a lofty mountain rather than a grassy mound, a swan seeks a clear lake over a shallow stream, a cuckoo sings only when the mango tree blossoms, and a bee is drawn only to a fragrant flower, true spiritual awareness cannot settle for anything inferior or transient.\n\nThrough these comparisons, the Vachana highlights that a mind awakened to the highest truth possesses an innate discernment that rejects worldly distractions and lesser pursuits.\n\nAddressing her companions, the Vachanakara affirms that her consciousness is exclusively drawn to the Formless Supreme Consciousness, Channamallikarjuna, incapable of desiring anything other than the Absolute.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस प्रकार प्रकृति का प्रत्येक जीव केवल अपने श्रेष्ठ और स्वाभाविक आधार की ओर ही आकर्षित होता है, उसी प्रकार एक सच्चे साधक का मन भी केवल परमतत्त्व में ही रमता है।\n\nवचन में यह स्पष्ट किया गया है कि जैसे मोर ऊँचे पर्वत को छोड़कर छोटी घास की टेकरी पर नहीं नाचता, हंस सरोवर को छोड़कर छोटे नाले की कामना नहीं करता, कोयल आम के वृक्ष में कोंपलें फूटे बिना मधुर गान नहीं करती और भँवरा सुगंधहीन फूल के पास नहीं जाता।\n\nइन प्राकृतिक रूपकों के माध्यम से यह आध्यात्मिक सत्य प्रकट होता है कि चेतना सदैव क्षुद्र या सारहीन वस्तुओं को नकार कर सर्वोच्च सत्य की ओर ही उन्मुख होती है।\n\nइसी प्रकार, साधक का मन चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व को छोड़कर किसी अन्य सांसारिक विषय या नश्वर आकर्षण की ओर कदापि झुक नहीं सकता।","mr":"या वचनाचा मुख्य आशय असा आहे की, सत्याची जाणीव झालेले मन क्षुद्र आणि नश्वर सांसारिक आकर्षणांच्या मागे कधीही धावत नाही, तर ते केवळ सर्वोच्च परमतत्त्वातच रममाण होते.\n\nमोर जसा गवताच्या छोट्या टेकाडावर न नाचता उंच डोंगरावरच विहार करतो, हंस लहान ओढ्याकडे न वळता मोठ्या सरोवराचीच ओढ धरतो, कोकिळा आम्रवृक्षाला पालवी फुटल्याशिवाय गात नाही आणि भुंगा सुगंधाशिवाय असलेल्या फुलाकडे आकर्षित होत नाही, या निसर्गातील दृष्टांतांमधून हेच श्रेष्ठतेचे तत्त्व स्पष्ट केले आहे.\n\nत्याचप्रमाणे, साक्षात्कारी जीव आपल्या सख्यांना उद्देशून अत्यंत ठामपणे सांगतो की, त्याचे मन 'चन्नमल्लिकार्जुन' या निराकार परम चैतन्याशिवाय इतर कोणत्याही दुय्यम किंवा लौकिक गोष्टीची अभिलाषा बाळगूच शकत नाही.\n\nपरम सत्याची एकदा ओळख पटली की साधकाची वृत्ती केवळ त्या अनंत आणि शुद्ध चैतन्याशीच एकनिष्ठ राहते, हे या वचनाचे आध्यात्मिक महत्त्व आहे.","fr":"Ce vachana illustre la fidélité spirituelle absolue d'une conscience entièrement tournée vers la Réalité suprême sans forme, invoquée ici sous la signature de Channamallikarjuna.\n\nÀ travers d'élégantes métaphores tirées de la nature, le texte rappelle que chaque être aspire naturellement à ce qu'il y a de plus noble : le paon danse sur les hautes montagnes et non sur les buttes stériles, le cygne recherche les lacs limpides plutôt que les petits ruisseaux, le coucou ne chante que lorsque le manguier bourgeonne, et l'abeille délaisse les fleurs sans parfum.\n\nDe la même manière, un esprit éveillé à la Vérité absolue ne saurait se tourner vers des attraits secondaires ou superficiels.\n\nEn interpellant ses compagnes, la voix poétique affirme avec conviction que son cœur, ayant reconnu l'excellence du Principe suprême, ne peut plus désirer autre chose."}},{"no":1178,"o":"ಗುರುಪಾದತೀರ್ಥವೆ ಮಂಗಳ ಮಜ್ಜನವೆನಗೆ.\n ವಿಭೂತಿಯೆ ಒಳಗುಂದದರಿಷಿಣವೆನಗೆ.\n ದಿಗಂಬರವೆ ದಿವ್ಯಾಂಬರವೆನಗೆ.\n ಶಿವಭಕ್ತರ ಪಾದರೇಣುವೆ ಅನುಲೇಪನವೆನಗೆ.\n ರುದ್ರಾಕ್ಷಿಯೆ ಮೈದೊಡಿಗೆಯೆನಗೆ.\n ಶರಣರ ಪಾದರಕ್ಷೆಯೆ ಶಿರದಲ್ಲಿ ತೊಂಡಿಲು ಬಾಸಿಗವೆನಗೆ.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನ ಮದವಳಿಗೆಗೆ\n ಬೇರೆ ಶೃಂಗಾರವೇಕೆ ಹೇಳಿರೆ ಅವ್ವಗಳಿರಾ!","t":{"en":"The holy water from the Guru's feet alone is the auspicious bath for me.\nSacred ash alone is the unfading turmeric for me.\nSky-clad nakedness alone is the divine garment for me.\nThe dust from the feet of Shiva's devotees alone is the fragrant ointment for me.\nThe *Rudraksha* alone is the bodily ornament for me.\nThe sandals of the *Sharanas* alone are the bridal chaplet and coronet upon my head for me.\nFor the bride of Chennamallikarjuna,\nwhat need is there for any other adornment? Tell me, O mothers!","hi":"गुरुपादतीर्थ ही मेरे लिए मंगल स्नान है।\nविभूति ही मेरे लिए ओलगुंद की हल्दी है।\nदिगंबर ही मेरे लिए दिव्यांबर है।\nशिवभक्तों की चरण-धूलि ही मेरे लिए अनुलेपन है।\nरुद्राक्ष ही मेरे लिए देह का आभूषण है।\nशरणों की पादुकाएँ ही मेरे सिर पर बासिंग और मुकुट हैं।\nचेन्नमल्लिकार्जुन की दुल्हन को\nअन्य शृंगार क्यों, बताओ हे सखियो!","mr":"गुरुपादतीर्थ हेच माझ्यासाठी मंगल स्नान आहे.\nविभूती हीच माझ्यासाठी अस्सल हळद आहे.\nदिगंबर हेच माझ्यासाठी दिव्यांबर आहे.\nशिवभक्तांची चरणधूळ हेच माझ्यासाठी अनुलेपन आहे.\nरुद्राक्ष हेच माझ्या अंगावरील दागिने आहेत.\nशरणांच्या पादुका हेच माझ्या मस्तकावरील मुकुट आणि बाशिंग आहे.\nचेन्नमल्लिकार्जुनाच्या या नवरीला\nदुसरा शृंगार कशासाठी, सांगा ग बायांनो!","fr":"L'eau consacrée des pieds du Gourou est pour moi le bain de bon augure.\nLa cendre sacrée est pour moi le curcuma dont l'éclat ne pâlit jamais.\nAvoir l'espace pour vêtement est pour moi le vêtement divin.\nLa poussière des pieds des dévots de Shiva est pour moi l'onguent parfumé.\nLe *Rudrakshi* est pour moi la parure du corps.\nLes sandales des *Sharanas* sont pour moi la couronne et le diadème nuptial sur ma tête.\nPour la mariée de Chennamallikarjuna,\npourquoi faudrait-il d'autres ornements, dites-moi, ô mères !"},"m":{"en":"This Vachana redefines conventional bridal adornment from the perspective of a seeker dedicated to union with the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nRather than relying on worldly ornaments and marriage rituals, the speaker embraces sacred spiritual practices as her true bridal preparation—treating the sanctified water from the Guru's feet as her auspicious bath, sacred ash (Vibhuti) as her turmeric, sky-clad nakedness (Digambara) as her divine garment, the dust from the feet of devotees as her cosmetic paste, Rudrakshi beads as her jewellery, and the footwear of the Sharanas as her bridal crown.\n\nThrough this powerful reversal of imagery, the Vachana highlights how complete humility before the Guru and the community of Sharanas replaces material vanity with authentic spiritual beauty.\n\nAddressing the women who ask her to dress like a conventional bride, the speaker asserts that one who seeks mystical union with the Absolute needs no external decoration beyond these sacred emblems of devotion and detachment.","hi":"यह वचन सांसारिक श्रृंगार और बाहरी वैभव को नकारते हुए आध्यात्मिक प्रतीकों को ही वास्तविक सौंदर्य और अलंकरण के रूप में प्रस्तुत करता है।\n\nयहाँ साधक के लिए गुरु का पादतीर्थ ही मंगल-स्नान है, विभूति ही कभी फीकी न पड़ने वाली हल्दी है, और दिगंबर अवस्था ही दिव्य वस्त्र है।\n\nशिवभक्तों के चरणों की धूल शरीर पर लगाया जाने वाला सुगंधित लेप है, रुद्राक्ष ही आभूषण हैं और शरणों की पादुकाएँ ही सिर पर धारण किया जाने वाला वैवाहिक मुकुट हैं।\n\nइस प्रकार, चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व से एकाकार होने वाली साधिका को किसी भी अन्य सांसारिक या भौतिक श्रृंगार की कोई आवश्यकता नहीं होती।","mr":"या वचनाचा मुख्य आशय असा आहे की, परमतत्त्वाशी एकरूप होऊ पाहणाऱ्या साधकासाठी बाह्य आणि नश्वर आभूषणांपेक्षा आध्यात्मिक मूल्ये हाच खरा शृंगार असतो.\n\nगुरूचे पादतीर्थ हेच मंगल स्नान, विभूती हीच कधीही न उजळणारी हळद, दिगंबरत्व हेच दिव्य वस्त्र आणि रुद्राक्ष हाच अंगावरील दागिना मानून येथे भौतिक अलंकारांचा त्याग मांडला आहे.\n\nतसेच, शिवभक्तांच्या चरणांची धूळ हेच सुगंधी उटणे आणि शरणांच्या पादत्राणांनाच मस्तकावरील बाशिंग मानून शरणांच्या प्रती असलेली सर्वोच्च निष्ठा व नम्रता व्यक्त केली आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाची वधू बनलेल्या जिवात्म्याला या अलौकिक आध्यात्मिक वैभवापुढे इतर कोणत्याही सांसारिक शृंगाराची गरज उरत नाही, हेच या वचनातून स्पष्ट होते.","fr":"Ce vachana met en lumière la transfiguration des rites nuptiaux traditionnels en une quête spirituelle absolue, où chaque parure mondaine est remplacée par un symbole de dévotion et de détachement.\n\nL'eau consacrée par les pieds du Guru devient le bain rituel de bon augure, la cendre sacrée remplace le curcuma, le dépouillement total fait office de vêtement divin et les graines de rudraksha tiennent lieu de joyaux.\n\nDe même, la poussière des pieds des dévots devient un onguent précieux, tandis que les sandales des Sharanas sont élevées au rang de couronne nuptiale portée avec humilité sur la tête.\n\nPour l'âme ainsi parée qui s'unit à la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna, tout autre ornement extérieur ou artifice matériel perd entièrement sa raison d'être."}},{"no":1179,"o":"ಗುರುವೆಂಬ ತೆತ್ತಿಗನು\n ಲಿಂಗವೆಂಬಲಗನು ಮನನಿಷ್ಠೆಯೆಂಬ ಕೈಯಲ್ಲಿ ಕೊಡಲು,\n ಕಾದಿದೆ ಗೆಲಿದೆ ಕಾಮನೆಂಬವನ.\n ಕ್ರೋಧಾದಿಗಳು ಕೆಟ್ಟು, ವಿಷಯಂಗಳೋಡಿದವು.\n ಅಲಗು ಎನ್ನೊಳು ನಟ್ಟು ಆನಳಿದ ಕಾರಣ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಲಿಂಗವ ಕರದಲ್ಲಿ ಹಿಡಿದೆ.","t":{"en":"When the sword-bearer called the Guru\nplaced the blade called *Linga* into the hand called steadfastness of mind,\nI fought and conquered the one called Kama.\nWrath and the rest were ruined, and the sense-pleasures fled.\nBecause that blade pierced into me and my 'I' perished,\nI held the *Linga* Chennamallikarjuna in my hand.","hi":"गुरु नामक आत्मीय रक्षक ने\nलिंग नामक खड्ग को मनोनिष्ठा नामक हाथ में देने पर,\nमैं लड़ी और जीत लिया काम नामक शत्रु को।\nक्रोधादि नष्ट हो गए, विषय भाग खड़े हुए।\nवह खड्ग मुझमें धँसकर मेरा अहं मिट जाने के कारण,\nमैंने चेन्नमल्लिकार्जुनलिंग को हाथ में धारण कर लिया।","mr":"गुरू नावाच्या शस्त्रधारकाने\nलिंग नावाची तलवार मनोनिष्ठा नावाच्या हाती दिल्यावर,\nमी काम नावाच्या शत्रूशी झुंजले आणि जिंकले.\nक्रोधादी विकार नष्ट झाले, आणि विषयवासना पळून गेल्या.\nती तलवार माझ्यात रुतून माझा 'मी'पणा मिटल्यामुळे,\nचेन्नमल्लिकार्जुनलिंगाला मी करांमध्ये धारण केले.","fr":"Lorsque ce gardien fidèle que l'on appelle le Guru\nremit cette lame que l'on appelle le Linga dans cette main que l'on appelle la fermeté de l'esprit,\nje combattis et je vainquis celui que l'on appelle le Désir.\nLa colère et les autres passions périrent, les objets des sens s'enfuirent.\nParce que la lame s'est enfoncée en moi et que le moi a été anéanti,\nj'ai tenu dans ma paume le Linga Chennamallikarjuna."},"m":{"en":"This Vachana uses the metaphor of a spiritual battlefield to illustrate how the grace of the Guru and unwavering mental devotion overcome inner passions and ego.\n\nHere, the Guru is portrayed as a trusted attendant who places the sword of the Ishtalinga—the sacred symbolic medium of Formless Supreme Consciousness—into the hand of steadfast devotion, enabling the seeker to fight and conquer desire, anger, and sensory temptations.\n\nTrue spiritual victory occurs when this blade of awareness pierces inward to dissolve the personal ego (\"I\"), rather than merely fighting external battles.\n\nWith the complete dissolution of the ego, the seeker attains direct realization of the Supreme Reality, invoked as Channamallikarjuna, holding the Linga on the palm in a state of unified consciousness.","hi":"यह वचन एक युद्ध के रूपक के माध्यम से आंतरिक विकारों पर विजय पाने और अहं के विलय से होने वाले आध्यात्मिक रूपांतरण को स्पष्ट करता है।\n\nजब गुरु रूपी शस्त्र-प्रदाता साधक के मन की एकाग्रता और निष्ठा रूपी हाथ में इष्टलिंग रूपी तलवार सौंपते हैं, तब साधक उस आध्यात्मिक शस्त्र के बल से कामनाओं से युद्ध करके उन पर विजय प्राप्त कर लेता है।\n\nइस आंतरिक संघर्ष के परिणामस्वरूप क्रोध आदि विकार नष्ट हो जाते हैं और समस्त सांसारिक विषय-वासनाएं पलायन कर जाती हैं।\n\nजब वह लिंग-रूपी ज्ञान की धार साधक के भीतर गहराई से उतरती है और उसका व्यक्तिगत अहंकार ('मैं'-पन) पूरी तरह मिट जाता है, तभी वह अपने कर-कमल में चन्नमल्लिकार्जुनलिंग रूपी परम सत्य को वास्तविक अर्थों में धारण कर पाता है।","mr":"हे वचन आध्यात्मिक संघर्षावर विजय मिळवून आत्मसाक्षात्कार साधण्याचा मार्ग अत्यंत प्रभावी रूपकातून स्पष्ट करते.\n\nसद्गुरूंनी एक विश्वासू साहाय्यक बनून, इष्टलिंगाचे पवित्र शस्त्र मननिष्ठेच्या हाती दिल्यामुळे साधकाला कामवासनेशी लढून त्यावर विजय मिळवणे शक्य होते.\n\nया आंतरिक लढाईत क्रोध आणि इतर सर्व विकार नष्ट होऊन इंद्रियसुखाची सर्व प्रलोभने पळून जातात.\n\nजेव्हा हे लिंगरूपी शस्त्र अंतःकरणात खोलवर रुजून 'मी'पणाचा अर्थात अहंकाराचा पूर्णपणे नाश होतो, तेव्हाच साधकाच्या हाती चन्नमल्लिकार्जुन या निराकार परमतत्त्वाचे प्रतीक असलेले लिंग खऱ्या अर्थाने स्थिरावते.","fr":"Ce vachana illustre par une puissante métaphore guerrière la victoire intérieure sur les passions humaines grâce à l'initiation spirituelle.\n\nLorsque le Guru, décrit ici comme un fidèle écuyer, remet le Linga telle une lame tranchante entre les mains d'un esprit résolu et pleinement dévoué, le chercheur spirituel peut livrer bataille contre le désir charnel, le vaincre, et mettre en déroute la colère ainsi que l'attrait des plaisirs sensoriels.\n\nCette lame symbolique de la conscience s'enfonce au plus profond de l'être jusqu'à dissoudre entièrement l'ego et le sentiment du « moi ».\n\nLa portée spirituelle de ce poème réside dans l'idée que ce n'est qu'après l'anéantissement de l'individualité limitée que l'on peut véritablement tenir dans sa paume l'Ishtalinga, miroir sacré de la Réalité suprême sans forme invoquée sous le nom de Channamallikarjunalinga."}},{"no":1180,"o":"ಗುರುವೆ ತೆತ್ತಿಗನಾದ,\n ಲಿಂಗವೆ ಮದುವಣಿಗನಾದ,\n ನಾನೆ ಮದುವಳಿಗೆಯಾದೆನು.\n ಈ ಭುವನವೆಲ್ಲರಿಯಲು ಅಸಂಖ್ಯಾತರೆನಗೆ ತಾಯಿತಂದೆಗಳು.\n ಕೊಟ್ಟರು ಸಾದೃಶ್ಯವಪ್ಪ ವರನ ನೋಡಿ.\n ಇದು ಕಾರಣ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನೆ ಗಂಡನೆನಗೆ.\n ಮಿಕ್ಕಿನ ಲೋಕದವರೆನಗೆ ಸಂಬಂಧವಿಲ್ಲವಯ್ಯಾ ಪ್ರಭುವೆ.","t":{"en":"The Guru himself became the kinsman who gave me away,\nthe *Linga* itself became the bridegroom,\nand I myself became the bride.\nFor all this world to know, the countless *Sharanas* are my mother and father.\nSeeing a groom who is my true match, they gave me in marriage.\nTherefore, Chennamallikarjuna alone is my husband;\nI have no bond with any other men of this world, O Lord, O Master.","hi":"गुरु ही आत्मीय संगी बने,\nलिंग ही दूल्हा बना,\nमैं ही दुल्हन बनी।\nयह सारा भुवन जानता है कि असंख्य शरण ही मेरे माता-पिता हैं।\nउन्होंने अनुरूप वर देखकर मुझे ब्याह दिया।\nइस कारण, चेन्नमल्लिकार्जुन ही मेरे पति हैं।\nशेष संसारवालों से मेरा कोई संबंध नहीं है, हे प्रभु।","mr":"गुरूच सोयरा झाला,\nलिंगच वर झाला,\nआणि मीच वधू झाले.\nहे संबंध जग जाणे, असंख्य शरणच माझे आई-वडील आहेत.\nत्यांनी अनुरूप असा वर पाहून मला दिले.\nयाच कारणाने, चेन्नमल्लिकार्जुनच माझा पती आहे.\nहे प्रभो, उरलेल्या जगातील लोकांशी माझा काहीही संबंध नाही.","fr":"Le Guru lui-même est devenu le garant des noces,\nle Linga lui-même est devenu le marié,\net moi-même, je suis devenue la mariée.\nAu su de tout cet univers, les Innombrables sont pour moi mère et père.\nAprès avoir trouvé un époux sans pareil, ils m'ont donnée en mariage.\nPour cette raison, Chennamallikarjuna seul est mon époux.\nLes autres gens de ce monde n'ont aucun lien avec moi, ô Seigneur, ô Maître."},"m":{"en":"This Vachana uses the metaphor of marriage to express a profound spiritual union with the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nIn this sacred union, the Guru acts as the matchmaker who initiates the seeker into the path of Linga, the symbolic medium leading to the Absolute, while the innumerable Sharanas serve as spiritual parents who witness and bless the bond with a truly worthy partner.\n\nBy claiming Channamallikarjuna alone as the eternal spouse, the speaker rejects conventional, perishable human marriage and declares complete freedom from all worldly relationships and societal ties.","hi":"यह वचन आत्मा और निराकार परमतत्त्व के साथ हुए आध्यात्मिक मिलन को एक विवाह के रूपक के माध्यम से स्पष्ट करता है।\n\nइसमें गुरु को इस दिव्य संबंध को जोड़ने वाला मध्यस्थ, लिंग को वर और स्वयं साधक को वधू के रूप में चित्रित किया गया है।\n\nपूरे संसार के साक्षी रूप में असंख्य शरण समुदाय ने माता-पिता की भूमिका निभाते हुए साधक का हाथ सर्वथा अनुरूप परम सत्य रूपी वर के हाथों में सौंपा है।\n\nइस वचन का मूल भाव यह है कि जब चन्नमल्लिकार्जुन रूपी निराकार चैतन्य ही एकमात्र पति बन जाता है, तब साधक का सांसारिक लोगों और लौकिक बंधनों से कोई संबंध शेष नहीं रह जाता।","mr":"या वचनात साधक आणि निराकार परमतत्त्व यांच्यातील अद्वैत मीलन विवाहाच्या सुंदर रूपकातून स्पष्ट केले आहे.\n\nयेथे गुरूने मध्यस्थाची भूमिका बजावून, अखंड चैतन्याचे प्रतीक असलेल्या लिंगरूपी वराशी साधकरूपी वधूचा आध्यात्मिक विवाह जुळवून आणला आहे.\n\nअसंख्य पुरातन शरणांनी आई-वडिलांच्या मायेने साऱ्या विश्वाच्या साक्षीने साधकाला अनुरूप असा हा अलौकिक वर निवडून दिला आहे.\n\nया शाश्वत मीलनामुळे आता केवळ चन्नमल्लिकार्जुन हे परमतत्त्वच आपले एकमेव सर्वस्व असून, उरलेल्या नश्वर जगाशी व लौकिक पाशांशी आपला कोणताही संबंध उरलेला नाही, हा ठाम आध्यात्मिक निश्चय यातून व्यक्त होतो.","fr":"Ce vachana utilise la métaphore du mariage pour exprimer l'union spirituelle entre la conscience individuelle et la Réalité suprême sans forme, désignée ici sous le nom de Channamallikarjuna.\n\nDans cette alliance sacrée, le Guru agit comme l'intermédiaire qui unit l'être au Linga, tandis que la communauté des innombrables Sharanas (Asankhyata) joue le rôle des parents ayant choisi cet époux idéal au vu du monde entier.\n\nCette consécration intérieure établit une appartenance exclusive au Principe absolu, rendant désormais caduc et sans objet tout lien conjugal ou attachement aux relations conventionnelles de ce monde."}}]},
{"id":"s5","n":{"en":"Amuge Rayamma","hi":"अमुगे रायम्मा","mr":"अमुगे रायम्मा","fr":"Amuge Rayamma"},"v":[{"no":1280,"o":"ಬೀಜವಿಲ್ಲದೆ ವೃಕ್ಷ ಬೆಳೆಯಬಲ್ಲುದೆ?\n ಹೂವಿಲ್ಲದೆ ಹಣ್ಣಾಗಬಲ್ಲುದೆ?\n ತೆಂಗಿನ ಮರವ ಬಿತ್ತಿದಡೆ ಅಂಬರಕ್ಕೆ ಹೋಯಿತ್ತು,\n ಕಾಯಿಲ್ಲದೆ ನೀ[ರಿ]ಲ್ಲದೆ\n ಗಾಳಿಗೆ ಮರ ಮುರಿದಂತೆ ಆಯಿತ್ತು ಕಾಣಾ.\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದ\n ಅನಾಚಾರಿಗಳ ವಿರಕ್ತರೆಂಬೆನೆ? ಎನಲಾಗದು.","t":{"en":"Can a tree grow without a seed?\nCan fruit form without a flower?\nWhen a coconut tree was planted, it rose up to the sky;\nyet without coconut, without water,\nsee, it became like a tree snapped by the wind!\nCan I call those devoid of righteous conduct,\nwho do not know Amugeshwaralinga, renunciants? I cannot call them so.","hi":"बिना बीज के क्या वृक्ष बढ़ सकता है?\nबिना फूल के क्या फल बन सकता है?\nनारियल का पेड़ बोने पर वह आकाश तक गया,\nबिना फल के, बिना पानी के,\nहवा से पेड़ टूट जाने के समान हुआ, देखो।\nअमुगेश्वरलिंग को न जाननेवाले\nअनाचारियों को क्या विरक्त कहूँ? नहीं कहा जा सकता है।","mr":"बीजाशिवाय वृक्ष वाढू शकेल का?\nफुलाशिवाय फळ येऊ शकेल का?\nनारळाचे झाड लावले तर ते आभाळापर्यंत गेले,\nपण फळाशिवाय आणि पाण्याशिवाय\nवाऱ्याने झाड मोडून पडल्यासारखे झाले, पाहा.\nअमुगेश्वरलिंगाला न जाणणाऱ्या\nअनाचाऱ्यांना विरक्त म्हणू का? तसे म्हणता येणार नाही.","fr":"Sans semence, l'arbre peut-il croître ?\nSans fleur, le fruit peut-il naître ?\nLorsqu'on plante un cocotier, il s'élève jusqu'au ciel ;\nmais sans noix et sans eau,\nil est pareil à un arbre brisé par le vent, vois-tu.\nCeux qui sont dépourvus de juste conduite et ignorent Amugeshwaralinga,\npuis-je les appeler des renonçants ? On ne peut les appeler ainsi."},"m":{"en":"This Vachana explains that genuine spiritual maturity cannot arise without a proper foundation of ethical discipline and inner realization.\n\nJust as a tree cannot grow without a seed or bear fruit without first blossoming, a person cannot attain true detachment without going through the essential stages of righteous conduct and spiritual awakening.\n\nThrough the metaphor of a tall coconut tree that bears neither fruit nor water and easily snaps in the wind, the Vachana illustrates the hollowness of outward spiritual pretension that lacks inner substance.\n\nThose who abandon right conduct and remain ignorant of the Supreme Reality, addressed here as Amugeshwaralinga, cannot truly be considered renunciates, for their detachment is empty and fragile.","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार बीज के बिना वृक्ष नहीं उग सकता और फूल के बिना फल नहीं लग सकता, उसी प्रकार आध्यात्मिक मूलाधार और सदाचार के बिना सच्चा वैराग्य संभव नहीं है।\n\nनारियल का पेड़ भले ही आकाश को छूने जितना ऊँचा बढ़ जाए, किंतु यदि उसमें न नारियल का फल हो और न ही भीतर का मीठा जल, तो वह हवा के झोंके से टूटकर गिरने वाले एक निष्फल वृक्ष के समान ही रह जाता है।\n\nइसी प्रकार, बाहरी रूप से वैराग्य का दिखावा करने वाले व्यक्ति का आध्यात्मिक कद कितना भी बड़ा क्यों न दिखे, यदि उसके भीतर सदाचार और परमतत्त्व की अनुभूति रूपी सार नहीं है, तो उसका जीवन खोखला और निरर्थक है।\n\nइस वचन का मूल आशय यह है कि निराकार परम सत्य अमुगेश्वरलिंग को जाने बिना और आचरण की शुद्धता को अपनाए बिना, किसी भी सदाचारहीन व्यक्ति को सच्चा विरक्त नहीं कहा जा सकता।","mr":"हे वचन स्पष्ट करते की, कोणतीही आध्यात्मिक प्रगती मूळ आधाराशिवाय आणि योग्य आचरणाच्या क्रमाशिवाय साध्य होऊ शकत नाही. ज्याप्रमाणे बियाण्याशिवाय वृक्ष वाढू शकत नाही आणि फुलाशिवाय फळ धरू शकत नाही, त्याचप्रमाणे आंतरिक शुद्धता व मूळ तत्त्वाच्या जाणिवेशिवाय खरी साधना घडू शकत नाही.\n\nनारळाचे झाड कितीही आभाळापर्यंत उंच वाढले, तरी त्याला फळ आणि त्यामध्ये पाणी नसल्यास ते झाड वाऱ्याने मोडून पडल्यासारखेच व्यर्थ ठरते. या प्रतीकाद्वारे येथे हे अधोरेखित केले आहे की, आध्यात्मिक अनुभवाचा गाभा आणि सदाचार नसेल तर केवळ बाह्य मोठेपणा निरर्थक असतो.\n\n'अमुगेश्वरलिंग' या निराकार परमतत्त्वाची जाणीव नसलेल्या आणि आचारभ्रष्ट असलेल्या लोकांना कधीही खरे विरक्त म्हणता येणार नाही, असा स्पष्ट विचार या वचनातून मांडला आहे.","fr":"Ce vachana met en lumière le fait qu'une véritable évolution spirituelle ne peut se produire sans des bases solides ni un cheminement authentique.\n\nÀ travers les images naturelles d'un arbre qui ne saurait croître sans semence et d'un fruit qui ne peut naître sans fleur, le texte illustre l'impossibilité d'atteindre la réalisation intérieure sans une pratique juste.\n\nDe même qu'un cocotier s'élevant jusqu'au ciel mais dépourvu de noix et d'eau finit par se briser sous la force du vent, une élévation spirituelle purement extérieure et vide de substance est vouée à s'effondrer.\n\nAinsi, ceux qui sont dénués d'une conduite intègre et qui ignorent la Réalité suprême sans forme, invoquée sous le nom d'Amugeshwaralinga, ne peuvent nullement être considérés comme d'authentiques renonçants."}},{"no":1281,"o":"ಬೆಟ್ಟದ ನೆಲ್ಲಿಯಕಾಯ ಪಟ್ಟಣಕ್ಕೆ ಹೊತ್ತುಕೊಂಡು ಹೋಗಿ\n ಹೊಟ್ಟೆಯ ಹೊರೆವವನಂತೆ,\n ಉತ್ತಮ ತೇಜಿಯ ಹೆಸರ ಹೇಳಿ\n ಕಡಲೆಯ ತಿಂಬ ಗಾವಲಿಗನಂತೆ,\n ಆದ್ಯರ ವಚನಂಗಳ ಅಲ್ಲಲ್ಲಿಗೆ ಉಸುರಿ,\n ಅನ್ನ ಕೂಳಿಂಗೆ ಹರಿದಾಡುವ ಅಜ್ಞಾನಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ಅಯ್ಯಾ ವಿರಕ್ತರೆಂಬೆನೆ?\n ವೇಷವ ಹೊತ್ತು ತಿರುಗುವ [ಡಂ]ಬನಂತೆ\n ಬಲ್ಲೆಬಲ್ಲೆನೆಂಬ ಅಹಂಕಾರವ ನುಡಿವ ಭವಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ವಿರಕ್ತರೆಂಬೆನೆ?\n ವಿಷಯವ ಮುಂದುಗೊಂಡು ತಿರುಗುವ ಅನುಭಾವಿಗಳನೆಂತು\n ವಿರಕ್ತರೆಂಬೆನಯ್ಯಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ?","t":{"en":"Carrying mountain gooseberries to the town,\nlike one who labours only to fill his belly,\ninvoking the name of a noble steed,\nlike the groom who eats the horse-gram himself,\nuttering the Vachanas of the ancients here and there,\nthose ignorant ones who run about for rice and gruel—\nshall I call them mystics of *Anubhāva*? O Lord, shall I call them renunciates?\nLike a hypocrite who wanders about wearing a guise,\nthose worldly ones who speak with arrogance, saying, \"I know, I know\"—\nshall I call them mystics of *Anubhāva*? Shall I call them renunciates?\nThose mystics of *Anubhāva* who wander about putting sensory pleasures first—how\ncan I call them renunciates, O Lord, O Amugeshwaralinga?","hi":"पहाड़ के आँवले को नगर में ढोकर ले जाकर,\nपेट पालनेवाले के समान,\nउत्तम घोड़े का नाम लेकर,\nचना खानेवाले साईस के समान,\nआद्यों के वचनों को जहाँ-तहाँ उचारकर,\nअन्न-भोजन के लिए भटकनेवाले अज्ञानियों को,\nक्या अनुभावी कहूँ? हे स्वामी, क्या विरक्त कहूँ?\nवेष धारणकर घूमनेवाले दंभी के समान,\n‘जानता हूँ, जानता हूँ’ कहने का अहंकार बोलनेवाले भवियों को,\nक्या अनुभावी कहूँ? क्या विरक्त कहूँ?\nविषय को आगे रखकर घूमनेवाले अनुभावियों को कैसे\nविरक्त कहूँ हे स्वामी, हे अमुगेश्वरलिंग?","mr":"डोंगरावरील आवळे शहरात वाहून नेऊन\nपोट भरणाऱ्याप्रमाणे,\nउत्तम घोड्याचे नाव सांगून\nहरभरे खाणाऱ्या मोतद्दाराप्रमाणे,\nआद्यांची वचने ठिकठिकाणी उच्चारून,\nअन्नाच्या घासासाठी भटकणाऱ्या अज्ञानी लोकांना\nअनुभावी म्हणू का? हे स्वामी, विरक्त म्हणू का?\nवेष धारण करून फिरणाऱ्या दांभिकाप्रमाणे\n‘मी जाणतो, मी जाणतो’ असे अहंकाराचे बोल बोलणाऱ्या भवी लोकांना\nअनुभावी म्हणू का? विरक्त म्हणू का?\nविषयसुखांना पुढे ठेवून फिरणाऱ्या अनुभावींना कसे\nविरक्त म्हणू हे प्रभो, हे अमुगेश्वरलिंगा?","fr":"Comme celui qui porte les groseilles de la montagne jusqu'à la ville\npour nourrir son ventre,\ncomme le palefrenier qui invoque le nom d'un noble coursier\npour manger les pois chiches,\nces ignorants qui récitent çà et là les Vachanas des Anciens\net courent de tous côtés pour leur riz et leur pitance,\nles appellerai-je des êtres d'*Anubhava* ? Ô Seigneur, les appellerai-je des renonçants ?\nComme l'imposteur qui erre en portant un déguisement,\nces *Bhavis* mondains qui parlent avec l'arrogance de dire : « Je sais, je sais ! »,\nles appellerai-je des êtres d'*Anubhava* ? Les appellerai-je des renonçants ?\nCes hommes d'*Anubhava* qui errent en mettant au premier plan les plaisirs des sens, comment\nles appellerai-je des renonçants, Ô Seigneur, Ô Amugeshwaralinga ?"},"m":{"en":"This Vachana sharply critiques spiritual hypocrisy, condemning those who reduce the sacred wisdom of the ancient Sharanas (Adyas) into a mere commodity for their own livelihood.\n\nThrough vivid metaphors—comparing such people to a vendor carrying wild gooseberries from the hills to sell in the town for survival, or a stable hand eating horse-gram in the name of a fine steed—it exposes the ignorance of reciting Vachanas here and there merely to secure food and sustenance.\n\nWearing a spiritual guise while boasting of one's knowledge out of ego is the mark of a worldly, uninitiated person (Bhavi), not of a true seeker.\n\nAddressing the Formless Supreme Reality as Amugeshwaralinga, the Vachana concludes that those who wander about driven by sensory desires and material motives can never be considered genuine mystics (Anubhavis) or true renunciates (Viraktas).","hi":"इस वचन का केंद्रीय भाव यह है कि केवल अपनी आजीविका चलाने और उदर-पोषण के लिए आध्यात्मिक ज्ञान का प्रदर्शन करना वास्तविक अनुभाव या वैराग्य नहीं है।\n\nजिस प्रकार कोई व्यक्ति पहाड़ से आंवले ढोकर शहर में बेचकर अपना पेट पालता है, या कोई साईस उत्तम घोड़े के नाम पर मिलने वाले चने को स्वयं खा जाता है, उसी प्रकार प्राचीन शरणों के वचनों को जगह-जगह केवल अन्न और भोजन के लालच में दोहराने वाले लोग अज्ञानी हैं।\n\nकेवल बाहरी भेष धारण कर पाखंडियों की तरह घूमने वाले और 'मैं सब जानता हूँ' के अहंकार में डूबे हुए सांसारिक प्रवृत्ति के लोगों को कभी भी सच्चा अनुभावी या विरक्त नहीं कहा जा सकता।\n\nनिराकार परमतत्त्व अमुगेश्वरलिंग को संबोधित यह वचन स्पष्ट करता है कि जो लोग इंद्रिय-सुखों और सांसारिक विषयों को आगे रखकर भटकते हैं, वे सच्चे वैरागी नहीं हो सकते।","mr":"हे वचन अध्यात्माच्या नावाखाली केवळ स्वतःची पोटापाण्याची सोय करणाऱ्या आणि ज्ञानाचा अहंकार मिरवणाऱ्या दांभिक प्रवृत्तीवर कठोर प्रहार करते.\n\nडोंगरावरील आवळे शहरात विकून पोट भरणाऱ्या विक्रेत्याप्रमाणे किंवा उत्तम घोड्याच्या नावावर स्वतः हरभरे खाणाऱ्या नोकराप्रमाणे, जे अज्ञानी लोक केवळ अन्नासाठी प्राचीन शरणांची वचने इकडे-तिकडे तोंडपाठ बोलून दाखवतात, त्यांना खरे अनुभावी किंवा विरक्त म्हणता येणार नाही.\n\nत्याचप्रमाणे, केवळ बाह्य वेष धारण करून 'मला सर्व काही समजते' असा अहंकार बाळगणाऱ्या आणि प्रत्यक्षात विषयवासनांच्या मागे धावणाऱ्या लोकांना अमुगेश्वरलिंग या परमतत्त्वाच्या साक्षीने कधीही खरे अनुभावी किंवा विरक्त मानले जाऊ शकत नाही, असा या वचनाचा मुख्य आशय आहे.\n\nकेवळ वचनांचे पोपटपंचीने पठण करणे किंवा संन्याशाचा वेष घेणे म्हणजे अध्यात्म नव्हे, तर अहंकार आणि विषयवासनांचा त्याग करून प्रत्यक्ष आचरणातून सत्याचा अनुभव घेणेच महत्त्वाचे आहे, हे सत्य यातून स्पष्ट होते.","fr":"Ce vachana dénonce avec fermeté l'hypocrisie de ceux qui utilisent les paroles sacrées des premiers maîtres spirituels comme un simple moyen de subsistance.\n\nÀ travers les images parlantes du porteur de groseilles sauvages qui va les vendre en ville pour se nourrir et du palefrenier qui mange les pois chiches destinés à un noble coursier, le texte illustre le comportement de ces ignorants qui récitent des vachanas çà et là uniquement pour remplir leur ventre.\n\nIl critique également les imposteurs mondains (bhavi) qui, sous un déguisement trompeur, proclament avec arrogance tout savoir alors qu'ils restent entièrement asservis aux plaisirs des sens.\n\nEn s'adressant à la Réalité suprême sous le nom d'Amugeshwaralinga, la portée spirituelle de ce vachana rappelle que la véritable expérience mystique (anubhava) et le détachement authentique (virakti) sont incompatibles avec l'orgueil, la cupidité et la quête de confort matériel."}},{"no":1282,"o":"ಮಂಡೆ ಬೋಳಾಗಿ ತುಂಡುಗಂಬಳಿ ಹೊದ್ದ ಬಳಿಕ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಖಂಡಿತನೆಅ ಕಂಡಕಂಡವರ ಮನ ಮೆಚ್ಚುವಂತೆ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಮಂಡೆ ಬೋಳಾದಡೆ ಮಹಾನುಭಾವಿಗಳು ಮೆಚ್ಚುವಂತೆ ಇರಬೇಕು\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ.","t":{"en":"Once the head is shaven and wrapped in a scrap of coarse blanket,\nwhat need is there for outward finery?\nFor one who has severed worldly ties, why seek outward finery\njust to please the minds of every passerby?\nIf the head is shaven, one must live so as to please the masters of mystic realization—\nsee, O Amugeshwara.","hi":"सिर मुँडवाकर फटा कंबल ओढ़ने के बाद,\nरूप-सिंगार किसलिए?\nनिश्चय ही हर किसी के मन को रिझाने के लिए,\nरूप-सिंगार किसलिए?\nसिर मुँडवा लेने पर महानुभावियों को भाने जैसा रहना चाहिए,\nदेखो, हे अमुगेश्वर।","mr":"डोके मुंडून घोंगडीचा तुकडा पांघरल्यानंतर\nसाजशृंगार कशासाठी?\nखरोखरच दिसेल त्याचे मन रिझवण्यासाठी\nसाजशृंगार कशासाठी?\nडोके मुंडले असेल, तर महानुभावींना रुचेल असे असले पाहिजे\nपाहा, हे अमुगेश्वरा।","fr":"Après s'être rasé la tête et couvert d'un lambeau de couverture,\nà quoi bon les atours et l'élégance ?\nDevenu renonçant résolu, pour plaire à l'esprit du premier venu,\nà quoi bon les atours et l'élégance ?\nSi l'on s'est rasé la tête, il faut vivre de manière à être approuvé par les êtres de haute réalisation mystique,\nvois-tu, Ô Amugeshwara."},"m":{"en":"This Vachana emphasizes the need for inner integrity when embracing a life of spiritual simplicity and renunciation.\n\nHaving shaved the head and draped a coarse piece of blanket as a sign of giving up worldly vanity, it is contradictory to still crave outward elegance or seek the approval of ordinary passersby.\n\nTrue asceticism is not a theatrical display meant to please the public gaze or attract superficial admiration.\n\nAddressing the Supreme Reality as Amugeshwara, the Vachana concludes that if one adopts the outward marks of renunciation, one's conduct and inner state must be authentic enough to earn the respect of the truly enlightened.","hi":"इस वचन का केंद्रीय संदेश यह है कि वैराग्य का मार्ग चुन लेने के पश्चात बाहरी आडंबर और सौंदर्य प्रदर्शन निरर्थक हो जाते हैं।\n\nसिर मुंडवाकर और कंबल का टुकड़ा ओढ़कर संन्यास का वेश धारण करने के बाद, राह चलते साधारण लोगों को प्रसन्न करने के लिए बाहरी रूप-रंग और बनावट की कोई आवश्यकता नहीं होती।\n\nसच्चा त्यागी वही है जो दिखावे के लिए नहीं, बल्कि आत्मज्ञानी महानुभावों और शरणों की दृष्टि में खरा उतरने के लिए अपना जीवन जीता है।\n\nअमुगेश्वर के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन स्पष्ट करता है कि बाहरी वेशभूषा की सार्थकता केवल तभी है जब साधक का आचरण प्रबुद्ध ज्ञानियों के मानदंडों के अनुरूप हो।","mr":"या वचनाचा मुख्य आशय असा आहे की, एकदा डोक्याचे मुंडण करून आणि अंगावर घोंगडीचा तुकडा पांघरून वैराग्याचा मार्ग स्वीकारल्यानंतर बाह्य नट्टापट्ट्याची आणि दिमाखाची काहीच गरज उरत नाही.\n\nनिःस्पृह आणि ठाम आचरण ठेवण्याऐवजी, येणाऱ्या-जाणाऱ्या सामान्य लोकांचे मन रिझवण्यासाठी बाह्य सौंदर्याचा आणि दिखाव्याचा अट्टाहास धरणे निरर्थक आहे.\n\nविरक्तीचा स्वीकार केल्यानंतर साधकाचे आचरण लोकानुनयासाठी नसून, खऱ्या अनुभवी आणि जाणत्या महात्म्यांना मान्य होईल अशाच निष्ठावान वृत्तीचे असावे, ही जाणीव अमुगेश्वर या परमतत्त्वाला उद्देशून येथे व्यक्त झाली आहे.","fr":"Ce vachana met en lumière l'exigence d'intégrité intérieure qui doit accompagner les signes extérieurs du renoncement.\n\nAprès avoir rasé sa tête et revêtu une simple pièce de couverture en laine, symboles de détachement, il devient contradictoire de continuer à rechercher la parure ou l'élégance.\n\nCelui qui a choisi une voie résolue ne doit pas chercher à séduire ni à plaire au premier venu par son apparence extérieure.\n\nÀ travers la signature spirituelle Amugeshwara, adressée à la Réalité suprême sans forme, ce vachana affirme que le véritable dépouillement doit se traduire par une conduite authentique, digne de l'estime des êtres spirituellement accomplis."}},{"no":1283,"o":"ಮರನನೇರಿ ಹಣ್ಣನರಸಹೋದಡೆ\n ಮರ ಮುರಿದು ಬಿದ್ದ ಮರುಳ ಮಾನವನಂತೆ,\n ಕೆಸರೊಳಗಣ ಹುಲ್ಲ ಮೇಯ ಹೋದ ಪಶುವಿನಂತೆ,\n ಕೊಂಬೆ ಕೊಂಬೆಗೆ ಹಾರುವ ಕೋಡಗನಂತೆ,\n ಉಂಡ ಮನೆಯ ದೂರುವ ಒಡೆಕಾರನಂತೆ,\n ಹಳ್ಳಹಳ್ಳ ತಿಬ್ಬಳಿ ತಿರುಗುವ ಬಳ್ಳುವಿನಂತೆ,\n ಮಾತಿನಲ್ಲಿ ಬ್ರಹ್ಮವ ನುಡಿವ ವೇಷಧಾರಿಗಳ ಲಿಂಗಾಂಗಿಗಳೆಂದಡೆ,\n ಮಾರಿಗೆ ತಂದ ಹಂದಿಯ ನಾಯಿ ನರಿ ತಿಂಬಂತೆ\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ.","t":{"en":"When climbing a tree in search of fruit,\nlike a foolish man who falls as the tree breaks,\nlike a beast that goes to graze on grass within the mire,\nlike a monkey leaping from branch to branch,\nlike a treacherous man who slanders the very house where he has eaten,\nlike a jackal stumbling and wandering from ditch to ditch,\nif one calls those costumed impostors who speak of Brahman in mere words *Lingangis*,\nit is like dogs and jackals eating a pig brought for the goddess Mari—\nsee, O Amugeshwara.","hi":"पेड़ पर चढ़कर फल ढूँढ़ने जाने पर,\nपेड़ टूटकर गिरे मूढ़ मानव के समान,\nकीचड़ के भीतर की घास चरने गए पशु के समान,\nडाल-डाल पर कूदनेवाले बंदर के समान,\nखाए हुए घर की निंदा करनेवाले कृतघ्न के समान,\nनाले-नाले और टीलों पर भटकनेवाली लोमड़ी के समान,\nबातों में ब्रह्म का बखान करनेवाले वेशधारियों को लिंगांगी कहा जाए तो,\nवह मारी के लिए लाए गए सूअर को कुत्ते और सियार के खाने के समान है,\nदेखो, हे अमुगेश्वर।","mr":"झाडावर चढून फळ शोधायला गेल्यावर\nझाड मोडून खाली पडलेल्या वेड्या माणसाप्रमाणे,\nचिखलातले गवत चरायला गेलेल्या पशूप्रमाणे,\nफांदीवरून फांदीवर उड्या मारणाऱ्या माकडाप्रमाणे,\nजेवलेल्या घराचीच निंदा करणाऱ्या कृतघ्न माणसाप्रमाणे,\nओढ्या-खळग्यांतून वणवण फिरणाऱ्या कोल्ह्याप्रमाणे,\nकेवळ शब्दांतून ब्रह्म बोलणाऱ्या वेशधाऱ्यांना लिंगांगी म्हटले,\nतर मारीसाठी आणलेल्या डुकराला कुत्री आणि कोल्हे खातात तसे होईल,\nपाहा, हे अमुगेश्वरा.","fr":"Comme l'homme insensé qui, monté sur un arbre pour chercher des fruits,\ntombe lorsque l'arbre se brise,\ncomme la bête allée brouter l'herbe dans la bourbe,\ncomme le singe sautant de branche en branche,\ncomme le semeur de discorde qui médit de la maison où il a mangé,\ncomme le renard qui erre de fossé en fossé et de butte en butte,\nsi l'on appelle *Lingangis* ces imposteurs déguisés qui ne parlent du *Brahman* qu'en paroles,\nc'est comme les chiens et les chacals dévorant le porc amené pour la déesse Mari,\nvois-tu, Ô Amugeshwara."},"m":{"en":"This Vachana sharply critiques hypocrites who adopt the outward attire of spiritual seekers and speak loftily of the Supreme Reality, yet possess restless, greedy, and ungrateful minds.\n\nThrough a series of vivid comparisons—such as a fool falling from a breaking branch while reaching for fruit, a cow sinking into mud for grass, a monkey leaping aimlessly from branch to branch, an ungrateful person slandering the very house that fed him, and a scavenging jackal wandering through ditches—the Vachana exposes the inner instability and moral hollowness of such pretenders.\n\nMistaking these mere performers for true Lingangis—those who have genuinely realized union with the Formless Divine—is completely deluded.\n\nAddressing the Supreme Reality as Amugeshwara, the Vachana concludes that such empty hypocrisy is as degraded and spiritually meaningless as dogs and jackals devouring a pig meant for a sacrificial offering to the folk deity Mari.","hi":"इस वचन का मुख्य संदेश यह है कि केवल बाहरी वेशभूषा धारण करने और मुख से परम सत्य (ब्रह्म) की बड़ी-बड़ी बातें करने मात्र से कोई सच्चा लिंगांगी या साधक नहीं बन जाता।\n\nवचन में ऐसे पाखंडी वेशधारियों की अस्थिर और विवेकहीन स्थिति को स्पष्ट करने के लिए कई सटीक उपमाएँ दी गई हैं—जैसे फल की खोज में पेड़ पर चढ़कर डाल टूटने से गिरता हुआ मूर्ख व्यक्ति, कीचड़ में घास चरने गया पशु, डाल-डाल भटकता बंदर, जिस घर में खाया उसी की निंदा करने वाला कृतघ्न व्यक्ति और गड्ढों व टीलों में भटकती हुई लोमड़ी।\n\nअमुगेश्वर के प्रति संबोधित इस वचन का आध्यात्मिक आशय यह है कि आचरण और आंतरिक अनुभूति के बिना कोरा ज्ञान बघारने वाले वेशधारियों को लिंगांगी मानना उतना ही निरर्थक और हास्यास्पद है, जितना लोक-प्रथा में मारी के लिए लाए गए सूअर को कुत्तों और सियारों द्वारा खा जाना।","mr":"या वचनात प्रत्यक्ष अनुभूती आणि आचरणाशिवाय केवळ तोंडाने ब्रह्मज्ञानाच्या पोकळ गप्पा मारणाऱ्या वेशधारी ढोंगी लोकांवर तीव्र प्रहार केला आहे.\n\nफांदी तुटून पडणारा वेडा माणूस, चिखलात फसणारे पशू, फांद्यांवर उड्या मारणारे माकड, ज्या घरात खाल्ले त्याचेच वाईट चिंतणारा कृतघ्न माणूस आणि नाल्या-खड्ड्यांत भटकणारा कोल्हा या प्रपंचातील समर्पक उपमांमधून अशा फसव्या साधकांची चंचल व अधोगतीकडे जाणारी वृत्ती स्पष्ट होते.\n\nअशा केवळ बाह्य वेश धारण केलेल्या लबाड लोकांना जर अमुगेश्वर या परमतत्त्वाशी एकरूप झालेले सच्चे लिंगांगी मानले, तर ते मरीआईच्या बळीसाठी आणलेले डुक्कर कुत्र्या-कोल्ह्यांनी फाडून खाण्यासारखे अत्यंत निरर्थक आणि हास्यास्पद ठरते.\n\nआध्यात्मिक मार्गात बाह्य देखावा आणि शाब्दिक पांडित्यापेक्षा स्थिर मन, कृतज्ञता आणि प्रत्यक्ष आचरणालाच खरे महत्त्व आहे, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana dénonce avec vigueur l'hypocrisie de ceux qui adoptent l'apparence extérieure de la dévotion et parlent de la Vérité absolue sans que leur esprit ni leur conduite ne soient stabilisés.\n\nÀ travers une série d'images saisissantes — l'insensé qui tombe d'un arbre brisé en cherchant des fruits, le bétail s'enfonçant dans la boue pour brouter, le singe sautant de branche en branche, l'ingrat dénigrant la maison qui l'a nourri ou le chacal errant de ravin en ravin —, le texte illustre l'égarement, l'agitation mentale et l'absence d'intégrité de ces faux chercheurs.\n\nLa portée spirituelle de ce poème réside dans l'affirmation que le véritable Lingangi, celui qui vit en union intime avec le Linga et la Réalité suprême sans forme invoquée sous le nom d'Amugeshwara, ne saurait se réduire à un simple porteur de déguisement qui proclame le Principe absolu uniquement en paroles.\n\nQualifier de tels imposteurs d'êtres spirituellement accomplis est une profanation dérisoire, comparable au fait de laisser des chiens et des chacals dévorer le porc pourtant destiné en offrande à la déesse Mari."}},{"no":1284,"o":"ಮರುಜವಣಿಯ ಕಂಡವಂಗೆ ಮರಣದ ಹಂಗುಂಟೆ?\n ಪರುಷವುಳ್ಳವಂಗೆ ಪಾಷಾಣದ ಹಂಗುಂಟೆ?\n ಸರ್ವಾಂಗಲಿಂಗವಾದವಂಗೆ ಅನರ್ಪಿತವುಂಟೆ?\n ಜ್ಯೋತಿಯ ಬೆಳಗಿನಲ್ಲಿದ್ದವಂಗೆ ಕತ್ತಲೆಯ ಹಂಗುಂಟೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವಾದವಂಗೆ [ಅ]ಂಗದ ಹಂಗುಂಟೆ?","t":{"en":"For one who has found the life-restoring herb, is there any bondage to death?\nFor one who possesses the philosopher's stone, is there any dependence on common stone?\nFor one whose entire body has become *Linga*, is there anything left unoffered?\nFor one who abides in the radiance of the flame, is there any bondage to darkness?\nFor one who has become Amugeshwaralinga, is there any dependence on the mortal body?","hi":"संजीवनी पानेवाले को क्या मरण का भय होता है?\nपारस रखनेवाले को क्या पाषाण की अपेक्षा होती है?\nसर्वांगलिंग हो जानेवाले के लिए क्या कुछ अनर्पित होता है?\nज्योति के प्रकाश में रहनेवाले को क्या अंधकार का भय होता है?\nअमुगेश्वरलिंग हो जानेवाले को क्या अंग की अपेक्षा होती है?","mr":"संजीवनी गवसलेल्याला मरणाची गरज उरते का?\nपरसजवळ असलेल्याला पाषाणाची गरज उरते का?\nसर्वांग लिंग झालेल्याला काही अनर्पित उरते का?\nज्योतीच्या प्रकाशात असलेल्याला अंधाराची गरज उरते का?\nअमुगेश्वरलिंग झालेल्याला अंगाची गरज उरते का?","fr":"Pour celui qui a trouvé l'herbe de résurrection, y a-t-il l'emprise de la mort ?\nPour celui qui possède la pierre philosophale, y a-t-il l'emprise de la pierre ordinaire ?\nPour celui dont tous les membres sont devenus Linga, y a-t-il quoi que ce soit de non offert ?\nPour celui qui demeure dans la clarté de la flamme, y a-t-il l'emprise de l'obscurité ?\nPour celui qui est devenu Amugeshwaralinga, y a-t-il l'emprise du corps ?"},"m":{"en":"This Vachana explains that once a seeker attains the highest spiritual realization, all lower worldly limitations and dependencies naturally fall away.\n\nThrough a series of vivid metaphors, it illustrates that just as one who possesses the life-restoring herb is free from the fear of death, one who holds the philosopher's stone has no need for ordinary rock, and one who dwells in radiant light is untouched by darkness, the enlightened state leaves no room for deficiency.\n\nWhen a person's entire being is transformed into Divine Consciousness (Sarvangalinga), no aspect of life remains unoffered or profane, making every experience sacred.\n\nUltimately, the Vachana points towards the understanding that one who has merged entirely with the Formless Supreme Reality, addressed here as Amugeshwaralinga, transcends the limitations and compulsive attachments of the physical body (Anga).","hi":"इस वचन का केंद्रीय भाव यह है कि परम सत्य की अनुभूति कर लेने वाले साधक को किसी भी भौतिक या सांसारिक सीमा की पराधीनता नहीं रह जाती।\n\nजिस प्रकार संजीवनी प्राप्त कर लेने वाले को मृत्यु का भय नहीं रहता, पारसमणि रखने वाले को सामान्य पत्थर की आवश्यकता नहीं होती और प्रकाश के भीतर रहने वाले को अंधकार से कोई सरोकार नहीं होता, उसी प्रकार पूर्ण आध्यात्मिक जागृति के बाद साधक अज्ञान और अभाव से मुक्त हो जाता है।\n\nजिसका संपूर्ण अस्तित्व ही लिंगमय हो गया हो, उसके लिए कुछ भी अनर्पित या अपवित्र नहीं रह जाता क्योंकि उसका प्रत्येक कर्म और भाव स्वतः ही परम चैतन्य को समर्पित हो जाता है।\n\nवचन का आध्यात्मिक निष्कर्ष यह है कि जो साधक निराकार परमतत्त्व 'अमुगेश्वरलिंग' के साथ एकाकार हो जाता है, वह नश्वर देह की सीमाओं और दैहिक आश्रय से पूर्णतः ऊपर उठ जाता है।","mr":"हे वचन स्पष्ट करते की, सर्वोच्च आध्यात्मिक सत्य प्राप्त केलेल्या साधकाला कोणत्याही कनिष्ठ किंवा मर्यादित गोष्टींचे भय अथवा परावलंबित्व उरत नाही.\n\nज्याप्रमाणे संजीवनी लाभलेल्याला मृत्यूची, परिस असलेल्याला सामान्य दगडाची आणि प्रकाशात वावरणाऱ्याला अंधाराची भीती किंवा गरज उरत नाही, तसेच ज्याचे संपूर्ण अस्तित्वच लिंगमय झाले आहे त्याच्याकडून कोणतीही कृती परमतत्त्वाला अर्पण केल्याशिवाय घडत नाही.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, अमुगेश्वरलिंग या निराकार परमतत्त्वाशी पूर्णपणे एकरूप झालेल्या साक्षात्कारी जीवाला स्वतःच्या नश्वर देहाच्या जाणिवांची आणि मर्यादांची कोणतीही गरज उरत नाही.","fr":"Ce vachana met en lumière la liberté absolue qui découle de la réalisation spirituelle et de l'union avec la Réalité suprême sans forme.\n\nÀ travers des images parlantes, il explique que tout comme l'élixir d'immortalité affranchit de la peur de la mort, que la pierre philosophale rend les pierres ordinaires inutiles et que la lumière dissipe toute dépendance à l'obscurité, l'éveil spirituel dissout les limitations de l'existence ordinaire.\n\nLorsque l'être tout entier se transforme en Linga, chaque aspect de la vie devient une offrande consacrée, ne laissant plus aucune place au profane ou au non-offert.\n\nEnfin, celui qui s'est uni à la Conscience pure désignée par l'ankitanama Amugeshwaralinga transcende l'attachement et la soumission aux limites du corps physique (Anga)."}},{"no":1285,"o":"ಮುಂಡದಲ್ಲಿ ತಿರುಗುವವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ತಲೆಯಲ್ಲಿ ತಿರುಗುವವರನಾರನೂ ಕಾಣೆ.\n ಅಂಗದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ಮನದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವವರನಾರನೂ ಕಾಣೆ,\n ಅಮುಗೇಶ್ವರಾ.","t":{"en":"Those who wander as mere torsos are millions upon millions;\nI see no one who walks upon the head.\nThose who wash away the filth upon the body are millions upon millions;\nI see no one who washes away the filth within the mind,\nO Amugeshwara.","hi":"धड़ में घूमनेवाले करोड़ों हैं,\nसिर में घूमनेवाले किसी को भी नहीं देखता हूँ।\nअंग में रहे मैल को मिटानेवाले करोड़ों हैं,\nमन में रहे मैल को मिटानेवाले किसी को भी नहीं देखता हूँ,\nहे अमुगेश्वर।","mr":"धडावर चालणारे कोट्यनुकोटी आहेत;\nडोक्यावर चालणारे कोणीही मला दिसत नाहीत.\nअंगावरील मळ दूर करणारे कोट्यनुकोटी आहेत;\nमनातील मळ दूर करणारे कोणीही मला दिसत नाहीत,\nहे अमुगेश्वरा.","fr":"Ceux qui se meuvent avec le tronc sont des millions et des millions ;\nje ne vois personne qui se meuve avec la tête.\nCeux qui ôtent la souillure qui est sur le corps sont des millions et des millions ;\nje ne vois personne qui ôte la souillure qui est dans l'esprit,\nÔ Amugeshwara."},"m":{"en":"This Vachana highlights the stark contrast between superficial, body-centric existence and genuine inner awakening.\n\nUsing the imagery of the torso and the head, it observes that while millions of people live purely on the physical plane driven by bodily impulses, hardly anyone operates from the seat of higher awareness and intellect.\n\nSimilarly, countless individuals are obsessed with cleansing the external impurities of the physical body, yet almost no one strives to purge the deeper impurities residing within the mind.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Amugeshwara, the Vachana emphasizes that true spiritual refinement lies in mental purification and elevated consciousness rather than mere physical hygiene or outward action.","hi":"इस वचन का मूल भाव यह है कि संसार में केवल शारीरिक धरातल पर भटकने वाले तो करोड़ों लोग हैं, किंतु उच्च मानसिक या बौद्धिक चेतना के स्तर पर विचरण करने वाला कोई बिरला ही मिलता है।\n\nयहाँ 'मुंड' (धड़) और 'तले' (सिर) के प्रतीकों के माध्यम से दैहिक वृत्तियों तथा विवेकपूर्ण आत्म-जागृति के बीच के अंतर को स्पष्ट किया गया है।\n\nअमुगेश्वर के रूप में संबोधित निराकार परम सत्य के आलोक में यह वचन बताता है कि बाहरी शरीर की गंदगी को धोने वाले तो अनगिनत हैं, परंतु अपने भीतर के मानसिक विकारों और मलिनता को दूर कर मन को शुद्ध करने वाला कोई दिखाई नहीं देता।\n\nइस प्रकार यह वचन बाह्य शारीरिक शुद्धि की अपेक्षा आंतरिक और मानसिक पवित्रता के वास्तविक आध्यात्मिक महत्त्व को रेखांकित करता है।","mr":"हे वचन बाह्य आचरण आणि आंतरिक जागृती यांतील मूलभूत फरक अत्यंत प्रभावीपणे स्पष्ट करते.\n\nजगात केवळ शारीरिक पातळीवर जगणारे आणि देहाच्या गरजांभोवती फिरणारे कोट्यवधी लोक आहेत, परंतु उच्च वैचारिक पातळीवर किंवा शुद्ध जाणिवेत वावरणारे विरळाच आढळतात.\n\nत्याचप्रमाणे, शरीरावरची बाह्य घाण धुऊन काढणारे असंख्य लोक दिसतात, पण मनातील विकार आणि अज्ञानाचा मळ दूर करणारे कोणीही दिसत नाहीत, अशी खंत अमुगेश्वर या परमतत्त्वाला उद्देशून व्यक्त केली आहे.\n\nखरी आध्यात्मिक शुद्धता ही केवळ बाह्य देहाची नसून ती अंतर्मनाच्या आणि विचारांच्या निर्मळतेत आहे, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le contraste saisissant entre les préoccupations purement corporelles de l'être humain et la véritable quête de la conscience intérieure.\n\nDes millions de personnes errent dans le monde, uniquement guidées par les besoins de leur corps physique, sans jamais s'élever vers la réflexion et l'éveil de l'esprit.\n\nDe même, alors qu'une multitude d'individus s'efforcent de laver les souillures extérieures de leur chair, il est extrêmement rare de trouver quelqu'un qui s'attache à purifier son esprit de ses impuretés intérieures.\n\nÀ travers la signature spirituelle Amugeshwara, qui évoque la Réalité suprême sans forme, ce poème rappelle que la véritable pureté ne réside pas dans les soins superficiels du corps, mais dans la clarté de l'esprit et la lucidité de la conscience."}},{"no":1286,"o":"ಮೂಗಿಲ್ಲದವಂಗೆ ಕನ್ನಡಿಯ ತೋರಲೇಕೆ?\n ಕೈಯಿಲ್ಲದವಂಗೆ ಕುದುರೆಯನೇರಲೇಕೆ?\n ಕಾಲಿಲ್ಲದವಂಗೆ ನಿಚ್ಚಣಿಗೆಯನೇರಲೇಕೆ?\n ಭಕ್ತಿ ಜ್ಞಾನ ವೈರಾಗ್ಯವಿಲ್ಲದವಂಗೆ ಇಷ್ಟಲಿಂಗವೇಕೆ\n ಅಮುಗೇಶ್ವರಾ?","t":{"en":"Why show a mirror to one who has no nose?\nWhy should one who has no hands mount a horse?\nWhy should one who has no legs climb a ladder?\nOf what use is the *Ishtalinga* to one devoid of devotion, wisdom, and detachment,\nO Amugeshwara?","hi":"बिना नाकवाले को दर्पण दिखाना किसलिए?\nबिना हाथवाले को घोड़े पर चढ़ना किसलिए?\nबिना पैरवाले को सीढ़ी पर चढ़ना किसलिए?\nबिना भक्ति, ज्ञान और वैराग्यवाले को इष्टलिंग किसलिए,\nहे अमुगेश्वर?","mr":"नाक नसलेल्याला आरसा दाखवणे कशाला?\nहात नसलेल्याला घोड्यावर चढणे कशाला?\nपाय नसलेल्याला शिडीवर चढणे कशाला?\nभक्ती, ज्ञान, वैराग्य नसलेल्याला इष्टलिंग कशाला,\nहे अमुगेश्वरा?","fr":"À celui qui n'a pas de nez, pourquoi montrer un miroir ?\nÀ celui qui n'a pas de mains, pourquoi monter à cheval ?\nÀ celui qui n'a pas de jambes, pourquoi gravir une échelle ?\nÀ celui qui n'a ni Bhakti, ni connaissance, ni détachement, à quoi bon l'Ishtalinga,\nÔ Amugeshwara ?"},"m":{"en":"This Vachana emphasizes that external spiritual symbols have no value without the essential inner qualities required to realize their purpose.\n\nThrough vivid everyday comparisons—showing a mirror to someone without a nose, mounting a horse without hands, or climbing a ladder without legs—the Vachana illustrates the futility of possessing a tool when one lacks the fundamental capacity to engage with it.\n\nIn Sharana philosophy, the Ishtalinga serves as a sacred visual medium and symbolic mirror (Kuruhu) designed to focus the mind and lead the seeker toward the Formless Supreme Consciousness (Aruhu).\n\nAddressed to the Formless Absolute as Amugeshwara, the Vachana concludes that wearing the Ishtalinga becomes a meaningless outward formality if a seeker is devoid of devotion, spiritual knowledge, and inner detachment.","hi":"इस वचन का केंद्रीय भाव यह है कि आंतरिक पात्रता और आत्मिक गुणों के बिना बाह्य आध्यात्मिक प्रतीक धारण करना पूर्णतः निरर्थक है।\n\nजिस प्रकार नाक विहीन व्यक्ति को दर्पण दिखाना, हाथ विहीन व्यक्ति का घोड़े पर सवार होना और पैर विहीन व्यक्ति का सीढ़ी चढ़ना अनुपयोगी एवं असंभव है, उसी प्रकार बिना आंतरिक तैयारी के साधना का मार्ग सार्थक नहीं हो सकता।\n\nअमुगेश्वर के रूप में संबोधित निराकार परमतत्त्व के साक्षात्कार हेतु इष्टलिंग एक पवित्र माध्यम और प्रवेश द्वार है, किंतु हृदय में भक्ति, ज्ञान और वैराग्य के बिना केवल बाह्य रूप से इष्टलिंग धारण करने का कोई औचित्य नहीं है।","mr":"हे वचन स्पष्ट करते की, ज्या व्यक्तीमध्ये भक्ती, ज्ञान आणि वैराग्य ही आंतरिक पात्रता नाही, तिच्यासाठी बाह्य इष्टलिंग धारण करणे पूर्णपणे निरर्थक आहे.\n\nज्याप्रमाणे नाक नसलेल्या व्यक्तीला आरसा दाखवण्याचा, हात नसलेल्याला घोड्यावर बसवण्याचा किंवा पाय नसलेल्याला शिडीवर चढवण्याचा काहीही उपयोग होत नाही, त्याचप्रमाणे योग्य आध्यात्मिक जाणीव नसलेल्या व्यक्तीला साधनेची साधने देणे व्यर्थ ठरते.\n\nशरण तत्त्वज्ञानानुसार, इष्टलिंग हे निराकार परमतत्त्वाशी एकरूप होण्याचे एक पवित्र माध्यम आहे, परंतु त्याचा खरा लाभ घेण्यासाठी साधकाच्या अंतःकरणात भक्ती, सम्यक ज्ञान आणि वैराग्याची बैठक असणे आवश्यक आहे.\n\n'अमुगेश्वर' या अंकितनामातून निराकार चैतन्याला उद्देशून हेच सांगण्यात आले आहे की, आंतरिक गुणवत्तेशिवाय केवळ बाह्य प्रतीकांचे किंवा साधनांचे आचरण आध्यात्मिक उन्नती घडवून आणू शकत नाही.","fr":"Ce vachana met en lumière le fait que le port de l'Ishtalinga est dénué de sens s'il n'est pas accompagné d'une préparation intérieure adéquate.\n\nÀ travers des images frappantes — tendre un miroir à une personne sans nez, faire monter à cheval quelqu'un sans mains ou gravir une échelle à quelqu'un sans jambes —, le texte illustre l'inutilité d'un outil lorsque la capacité fondamentale d'en faire usage fait défaut.\n\nDe la même manière, pour une personne dépourvue de dévotion (Bhakti), de connaissance spirituelle (Jnana) et de détachement (Vairagya), l'Ishtalinga reste un objet extérieur sans effet véritable.\n\nEn s'adressant à la Réalité suprême sans forme invoquée sous la signature spirituelle Amugeshwara, ce vachana rappelle que l'Ishtalinga, en tant que miroir symbolique et porte d'accès vers l'Absolu, exige la présence vivante de ces trois qualités intérieures pour accomplir sa fonction spirituelle."}},{"no":1287,"o":"ವಿರಕ್ತನಾದ ಬಳಿಕ ವಿಷಯಕ್ಕೆ ದೂರನಾಗಿರಬೇಕು.\n ಒಣಗಿದ ಮರನ ವಾಯು ಅಪ್ಪಿದಂತಿರಬೇಕು.\n ಸಮುದ್ರದೊಳಗೆ ತರುಗಿರಿಗಳು ಮುಳುಗಿದಂತಿರಬೇಕು.\n ಮೂಗ ಕಂಡ ಕನಸಿನಂತಿರಬೇಕು.\n ಜಾಲಗಾರ ಕಂಡ ರತ್ನದಂತಿರಬಲ್ಲಡೆ, ವಿರಕ್ತನೆಂಬೆನು.\n ಹೀಂಗಲ್ಲದೆ, ಅರಿವುಳ್ಳವರೆಂದು\n ತಮ್ಮ ಅಗಮ್ಯವ ಬೀರುವ ಅಜ್ಞಾನಿಯ\n ಭಕ್ತನೆಂದಡೆ, ಮಾಹೇಶ್ವರನೆಂದಡೆ, ಪ್ರಸಾದಿಯೆಂದಡೆ,\n ಪ್ರಾಣಲಿಂಗಿಯೆಂದಡೆ, ಶರಣನೆಂದಡೆ, ಐಕ್ಯನೆಂದಡೆ\n ಅಘೋರನರಕ ತಪ್ಪದು ಕಾಣಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ.","t":{"en":"Once one has become a renunciate, one must remain far from sensory pleasures.\nOne must be as when the wind embraces a withered tree.\nOne must be as when trees and mountains are subm
