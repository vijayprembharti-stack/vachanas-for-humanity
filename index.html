erged within the ocean.\nOne must be like a dream seen by the mute.\nIf one can be like a gem found by a fisherman, I shall call him a renunciate.\nOtherwise, claiming to possess *Arivu*—innate awareness—\nif one calls an ignorant person who flaunts his unfathomable state\na *Bhakta*, or a *Maheshwara*, or a *Prasadi*,\nor a *Pranalingi*, or a *Sharana*, or an *Aikya*,\ndreadful hell is inescapable, you see, O Amugeshwaralinga.","hi":"विरक्त होने के बाद विषय से दूर रहना चाहिए।\nसूखे पेड़ को वायु के आलिंगन करने के समान रहना चाहिए।\nसमुद्र के भीतर वृक्ष और पर्वतों के डूबने के समान रहना चाहिए।\nगूँगे के देखे स्वप्न के समान रहना चाहिए।\nमछुआरे को मिले रत्न के समान रह सके, तो विरक्त कहूँगा।\nऐसा न होकर, स्वयं को चेतनावाला कहकर\nअपनी अगम्यता का प्रदर्शन करनेवाले अज्ञानी को\nभक्त कहने पर, माहेश्वर कहने पर, प्रसादी कहने पर,\nप्राणलिंगी कहने पर, शरण कहने पर, ऐक्य कहने पर\nअघोर नरक टलेगा नहीं देखो, हे अमुगेश्वरलिंग।","mr":"विरक्त झाल्यानंतर विषयापासून दूर असले पाहिजे।\nवाळलेल्या झाडाला वाऱ्याने आलिंगन दिल्यासारखे असले पाहिजे।\nसमुद्रामध्ये वृक्ष आणि पर्वत बुडाल्यासारखे असले पाहिजे।\nमुक्याने पाहिलेल्या स्वप्नासारखे असले पाहिजे।\nजाळे टाकणाऱ्या कोळ्याला सापडलेल्या रत्नासारखे राहता आले, तरच मी त्याला विरक्त म्हणेन।\nअसे नसता, आपण जाणीवसंपन्न आहोत असे म्हणवत\nआपल्या अगम्यतेचाच बडेजाव मिरवणाऱ्या अज्ञानाला\nभक्त म्हटले तर, माहेश्वर म्हटले तर, प्रसादी म्हटले तर,\nप्राणलिंगी म्हटले तर, शरण म्हटले तर, ऐक्य म्हटले तर\nअघोर नरक चुकणार नाही पाहा, हे अमुगेश्वरलिंगा।","fr":"Après être devenu un renonçant, il faut demeurer éloigné des plaisirs des sens.\nIl faut être comme le vent embrassant un arbre desséché.\nIl faut être comme les arbres et les montagnes engloutis dans l'océan.\nIl faut être comme le rêve qu'a fait un muet.\nS'il sait être comme un joyau trouvé par un pêcheur au filet, je l'appellerai un renonçant.\nSinon, l'ignorant qui, se disant doué de conscience éveillée,\nétale sa propre impénétrabilité —\nsi on l'appelle Bhakta, si on l'appelle Maheshwara, si on l'appelle Prasadi,\nsi on l'appelle Pranalingi, si on l'appelle Sharana, si on l'appelle Aikya,\nle terrible enfer sera inévitable, vois-tu, ô Amugeshwaralinga."},"m":{"en":"This Vachana defines the true nature of spiritual renunciation (Virakti), emphasizing that one who claims to be detached must remain completely unmoved by sensory pleasures and worldly temptations.\n\nThrough vivid metaphors—such as the wind embracing a dry tree, mountains and trees submerged within the ocean, a mute person's dream, and a fisherman indifferent to a precious gem—the Vachana illustrates a state of inward stillness that neither reacts to external contact nor feels the urge to boast about its inner treasure.\n\nIt sharply critiques the spiritual arrogance of ignorant individuals who claim to possess higher awareness (Arivu) while ostentatiously displaying their inner mysticism for worldly recognition.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Amugeshwaralinga, the Vachana warns that bestowing the sacred titles of the six-fold spiritual path (Shatsthala)—Bhakta, Maheshwara, Prasadi, Pranalingi, Sharana, or Aikya—upon such pretentious people is a grave error that inevitably leads to spiritual downfall.","hi":"इस वचन का मूल भाव यह है कि एक सच्चे विरक्त को सांसारिक विषयों और इंद्रिय-भोगों से पूरी तरह निर्लिप्त रहना चाहिए।\n\nविषयों के प्रति उसकी अनासक्ति ऐसी होनी चाहिए जैसे सूखे वृक्ष को हवा छूकर निकल जाती है, समुद्र की गहराई में पेड़ और पहाड़ समा जाते हैं, गूंगा व्यक्ति अपने सपने का बखान नहीं कर पाता, या मछुआरे को रत्न मिलने पर भी उसके प्रति कोई आकर्षण नहीं होता।\n\nइसके विपरीत, जो अज्ञानी व्यक्ति इस आंतरिक विरक्ति के बिना स्वयं को ज्ञानी मानकर अपनी अगम्य आध्यात्मिक स्थिति का बाहरी प्रदर्शन और बखान करते हैं, वे सच्चे साधक नहीं हैं।\n\nअमुगेश्वरलिंग के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन स्पष्ट करता है कि ऐसे दंभी लोगों को भक्त, माहेश्वर, प्रसादी, प्राणलिंगी, शरण या ऐक्य जैसे षट्स्थल के उच्च नामों से पुकारना घोर पतन का कारण बनता है।","mr":"हे वचन खऱ्या विरक्तीचे स्वरूप स्पष्ट करताना सांगते की, विरक्त झालेल्या साधकाने सर्व विषयवासनांपासून अलिप्त राहणे आवश्यक आहे.\n\nवाळलेल्या झाडाला वाऱ्याने स्पर्श केला तरी जसा त्यात कोणताही बदल होत नाही, महासागरात पर्वत आणि वृक्ष पूर्णपणे सामावून जातात, मुक्या माणसाला पडलेले स्वप्न जसे तो शब्दांत मांडू शकत नाही किंवा कोळ्याला सापडलेल्या रत्नाबद्दल जशी त्याला कोणतीही आसक्ती नसते, तशी संपूर्ण निरिच्छ आणि शांत अवस्था प्राप्त झाल्यावरच ती खरी विरक्ती ठरते.\n\nयाउलट, अंतर्यामी अशी विरक्ती नसताना केवळ आपण ज्ञानी आहोत असा आव आणणाऱ्या आणि आपल्या अपूर्ण ज्ञानाचे बाह्य प्रदर्शन करणाऱ्या अज्ञानी माणसाला भक्त, माहेश्वर, प्रसादी, प्राणलिंगी, शरण किंवा ऐक्य अशा षट्स्थलांच्या उच्च अवस्था प्राप्त झाल्याचे मानणे हा केवळ भ्रम आहे.\n\nअशा बाह्य अवडंबर करणाऱ्या दांभिक व्यक्तीला भयंकर अधोगती टाळता येणार नाही, हाच अमुगेश्वरलिंग या परमतत्त्वाला उद्देशून मांडलेला या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana définit l'essence du véritable détachement spirituel, qui exige de demeurer entièrement affranchi de l'emprise des objets sensoriels.\n\nÀ travers des images saisissantes — un arbre desséché que le vent caresse sans l'ébranler, des montagnes et des forêts englouties dans l'océan, le rêve indicible d'un muet ou un joyau trouvé par un pêcheur qui n'en fait nul cas — le texte illustre l'état d'une conscience impassible, silencieuse et libre de toute convoitise.\n\nÀ l'inverse, ceux qui demeurent dans l'ignorance tout en faisant ostensiblement étalage d'une prétendue connaissance de l'inaccessible trahissent l'esprit même du renoncement.\n\nEn s'adressant à la Réalité suprême sans forme à travers l'ankitanama Amugeshwaralinga, le vachana avertit avec fermeté qu'accorder à de tels êtres les titres spirituels des six étapes de l'évolution intérieure (Shatsthala) — Bhakta, Maheshwara, Prasadi, Pranalingi, Sharana ou Aikya — est une grave dérive qui mène inévitablement à la perdition."}},{"no":1288,"o":"ವೇಷವ ತೊಟ್ಟು ಗ್ರಾಸಕ್ಕೆ ತಿರುಗುವ\n ವೇಷಧಾರಿಗಳ ಕಂಡಡೆ ನಾಚಿತ್ತೆನ್ನ ಮನ.\n ಲಿಂಗವನರಿಯದೆ ಲಿಂಗೈಕ್ಯರೆಂಬ\n ಅಂಗವಿಕಾರಿಗಳ ಕಂಡಡೆ ಹೊದ್ದದು ಎನ್ನ ಮನ.\n ಅರಿದು ಆಚರಿಸಿದೆನೆಂಬ ಅಜ್ಞಾನಿಗಳ ಕಂಡಡೆ\n ಮೃಡನ ಶರಣರು ಮೆಚ್ಚುವರೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದಿರ್ದಡೆ\n ಎಂತು ಲಿಂಗೈಕ್ಯರೆಂಬೆನಯ್ಯಾ?","t":{"en":"Putting on a garb and wandering about for a mouthful of food—\nthe moment I see such wearers of disguise, my mind is ashamed.\nWithout knowing the *Linga*, claiming to be united with the *Linga*—\nthe moment I see such slaves to bodily passions, my mind does not draw near them.\nThe moment they see the ignorant who say, \"Having known, I have practised,\"\nwill the *Sharanas* of Mrida ever approve of them?\nIf they do not know Amugeshwaralinga,\nhow can I call them united with the *Linga*, O Lord?","hi":"वेष धारणकर ग्रास के लिए भटकनेवाले\nवेषधारियों को देखते ही लज्जित हो उठा मेरा मन।\nलिंग को जाने बिना लिंगैक्य कहनेवाले\nअंगविकारियों को देखते ही उनसे मेल नहीं खाता मेरा मन।\nजानकर आचरण किया है कहनेवाले अज्ञानियों को देखते ही\nक्या मृड के शरण प्रसन्न होंगे?\nअमुगेश्वरलिंग को यदि न जानें,\nतो कैसे लिंगैक्य कहूँ, हे स्वामी?","mr":"वेष धारण करून घासासाठी फिरणाऱ्या\nवेषधाऱ्यांना पाहताच लाजले माझे मन।\nलिंगाला न जाणता आम्ही लिंगैक्य आहोत असे म्हणणाऱ्या\nअंगविकाऱ्यांना पाहताच जवळ जात नाही माझे मन।\nजाणून आचरण केले असे म्हणणाऱ्या अज्ञानी लोकांना पाहताच\nमृडाचे शरण संतुष्ट होतील का?\nअमुगेश्वरलिंगाला न जाणले, तर\nत्यांना लिंगैक्य कसे म्हणू, हे प्रभो?","fr":"Dès qu'il voit ces imposteurs qui revêtent un habit pour errer en quête de pitance,\nmon esprit éprouve de la honte.\nDès qu'il voit ces êtres en proie aux passions du corps qui, sans connaître le Linga, se disent unis au Linga,\nmon esprit ne peut s'y attacher.\nDès qu'ils voient ces ignorants qui disent avoir pratiqué en toute conscience,\nles Sharanas de Mrida les approuveraient-ils ?\nS'ils ne connaissent pas Amugeshwaralinga,\ncomment pourrais-je dire qu'ils sont unis au Linga, ô Seigneur ?"},"m":{"en":"This Vachana sharply critiques spiritual hypocrisy, expressing deep disdain for those who merely adopt outward religious attire to earn their livelihood.\n\nIt rejects the false claims of individuals who remain enslaved to bodily passions yet declare themselves to have attained Lingaikya—ultimate union with the Supreme Reality—without truly realizing the essence of the Linga.\n\nThe Vachana emphasizes that genuine Sharanas of Mruda can never approve of the spiritually ignorant who boast of practicing truth while lacking authentic inner awareness (Arivu).\n\nUltimately, it asserts that without experiencing the Formless Supreme Consciousness addressed as Amugeshwaralinga, no one can genuinely claim to have achieved spiritual union.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक जीवन में बाहरी भेषभूषा, पाखंड और बिना वास्तविक बोध के किए गए दावों का कोई स्थान नहीं है।\n\nकेवल अपनी जीविका या भिक्षा के लिए धार्मिक भेष धारण करके घूमने वाले पाखंडियों को देखकर सच्चे साधक का मन लज्जित होता है, तथा लिंग-तत्त्व के वास्तविक स्वरूप को जाने बिना और शारीरिक विकारों से मुक्त हुए बिना स्वयं को लिंगैक्य कहने वालों को मन कभी स्वीकार नहीं करता।\n\nवास्तविक अज्ञान में डूबे रहकर भी यह अहंकार रखने वाले लोगों को कि उन्होंने सत्य को जानकर आचरण किया है, सच्चे शरण कभी पसंद नहीं कर सकते।\n\nइस वचन का आध्यात्मिक महत्त्व यह स्पष्ट करने में है कि जब तक निराकार परमतत्त्व अमुगेश्वरलिंग की सच्ची अनुभूति और आत्म-बोध न हो, तब तक किसी को भी वास्तव में लिंगैक्य की अवस्था प्राप्त करने वाला नहीं माना जा सकता।","mr":"हे वचन केवळ पोटाची खळगी भरण्यासाठी आध्यात्मिक वेश धारण करून भटकणाऱ्या ढोंगी वेशधाऱ्यांवर कठोर भाष्य करते आणि अशा दांभिकपणाविषयी मनात निर्माण होणारी लाज व खंत व्यक्त करते.\n\nनिराकार परमतत्त्वाकडे नेणाऱ्या लिंगतत्त्वाचे खरे स्वरूप न जाणताच आणि स्वतःच्या शारीरिक विकारांवर विजय न मिळवताच, जे स्वतःला 'लिंगैक्य' (परमतत्त्वाशी एकरूप झालेले) म्हणवून घेतात, अशा लोकांशी सच्चे मन कधीही जोडले जाऊ शकत नाही.\n\nखऱ्या आध्यात्मिक जाणीवेचा अभाव असतानाही \"मी सर्व काही जाणून आचरण केले आहे\" असा अहंकार बाळगणाऱ्या अज्ञानी लोकांचे वागणे जागृत शरणांना कधीही मान्य होऊ शकत नाही.\n\n'अमुगेश्वरलिंग' या नावाने संबोधित केलेल्या निराकार परमतत्त्वाची प्रत्यक्ष अनुभूती आणि जाण नसताना, केवळ बाह्य देखाव्याच्या आधारे कोणालाही परमतत्त्वाशी एकरूप झालेले मानता येत नाही, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana dénonce avec fermeté l'hypocrisie spirituelle de ceux qui revêtent un simple habit religieux pour gagner leur subsistance, provoquant ainsi un sentiment de honte face à une telle imposture.\n\nIl rejette résolument les individus qui demeurent asservis aux passions du corps tout en prétendant avoir atteint l'union avec le Linga (Lingaikya) sans en posséder la moindre connaissance intérieure.\n\nDe même, les authentiques Sharanas ne sauraient approuver l'arrogance des ignorants qui se vantent de détenir le savoir et d'accomplir des pratiques spirituelles, alors qu'ils sont dépourvus de véritable discernement.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation que nul ne peut être reconnu comme uni au Principe suprême sans avoir véritablement réalisé et expérimenté en soi la Réalité suprême sans forme, invoquée ici sous le nom d'Amugeshwaralinga."}},{"no":1289,"o":"ಹೆದರದಿರು ಮನವೆ, ಹಿಮ್ಮೆಟ್ಟದಿರು ಮನವೆ,\n ಹಿಡಿದ ಛಲವ ಬಿಡದಿರು ಮನವೆ.\n ಜರಿದರೆಂದು ಝಂಕಿಸಿದರೆಂದು\n ಶಸ್ತ್ರ ಸಮಾಧಿ ನೀರು ನೇಣು ವಿಷ ಔಷಧದಲ್ಲಿ ಘಟವ ಬಿಡದೆ,\n ಗುರುವಾಡದು ಲಿಂಗವಾದಡು ಜಂಗಮವಾದಡು\n ನೊಸಲಲ್ಲಿ ಕಣ್ಣುಳ್ಳ ಪಶುಪತಿಯಾದಡು\n ತೆತ್ತಿಗರು ಕಂಡು ಒತ್ತಿ ನುಡಿದರೆಂದು ಘಟವ ಬಿಡುವ ಕರ್ಮಿಗಳು\n ಏಳೇಳು ಜನ್ಮದಲ್ಲಿ ಸೂಕರನ ಹೊಟ್ಟೆಯಲ್ಲಿ ಹುಟ್ಟಿ,\n ನೂರೊಂದು ಕುಲ ಹದಿನೆಂಟು ಜಾತಿಯ ಅಮೇಧ್ಯವ ತಿಂದು\n ಹೊಲೆಯರ ಮನೆಯ ಹೊಸ್ತಿಲ ಕಾಯ್ದುಕೊಂಡಿಪ್ಪರಯ್ಯ,\n ಅಮುಗೇಶ್ವರಲಿಂಗವೆ, ನಿಮ್ಮಾಣೆ ನಿಮ್ಮ ಪ್ರಮಥರಾಣೆ.","t":{"en":"Do not fear, O Mind; do not retreat, O Mind;\ndo not abandon the resolve you have taken, O Mind.\nWithout forsaking the body by weapon, burial, water, noose, poison, or potion,\njust because someone reviled or rebuked you—\nbe it the Guru, be it the *Linga*, be it the *Jangama*,\nor be it Pashupati himself with the eye upon his forehead,\nthose bound by karma who forsake the body because companions saw and spoke harsh words\nshall be born in the womb of a swine for seven times seven births,\neat the filth of the hundred and one clans and eighteen castes,\nand keep watch at the threshold of the outcastes' house, O Lord—\nO Amugeshwaralinga, I swear by you and by your *Pramathas*.","hi":"डरो मत हे मन, पीछे मत हटो हे मन,\nठाने हुए हठ को मत छोड़ो हे मन।\nतिरस्कार किया कहकर, डाँटा-फटकारा कहकर,\nशस्त्र, समाधि, जल, फंदे, विष या औषधि से देह का त्याग मत करो।\nचाहे गुरु हो, चाहे लिंग हो, चाहे जंगम हो,\nचाहे ललाट पर नेत्र रखनेवाला पशुपति ही क्यों न हो,\nअंतरंग जनों ने देखकर कठोरता से कहा—यह सोचकर देह त्यागनेवाले कर्मी\nसात-सात जन्मों में सूकर के पेट में जन्म लेकर,\nएक सौ एक कुल और अठारह जातियों का अमेध्य खाकर,\nअछूतों के घर की देहलीज़ की रखवाली करते रहेंगे,\nहे अमुगेश्वरलिंग, आपकी सौगंध, आपके प्रमथों की सौगंध।","mr":"घाबरू नकोस हे मना, मागे हटू नकोस हे मना,\nधरलेला निर्धार सोडू नकोस हे मना.\nनिंदा केली म्हणून, दटावले म्हणून,\nशस्त्र, समाधी, पाणी, फास, विष किंवा औषधाने देहघट सोडू नकोस.\nगुरू असो, लिंग असो, जंगम असो,\nकपाळावर डोळा असलेला पशुपती असो—\nजवळच्यांनी पाहून टोचून बोलले म्हणून देहघट सोडणारे कर्मी\nसात-सात जन्मांत डुकराच्या पोटी जन्मून,\nएकशे एक कुळे आणि अठरा जातींची विष्ठा खाऊन,\nमहारवाड्यातील घराचा उंबरठा राखत बसतील, हे प्रभो!\nहे अमुगेश्वरलिंगा, तुमची शपथ, तुमच्या प्रमथांची शपथ.","fr":"Ne crains pas, ô esprit, ne recule pas, ô esprit,\nne renonce pas à la détermination que tu as prise, ô esprit.\nSans abandonner ce corps par l'arme, le *samadhi*, l'eau, la corde, le poison ou les drogues,\nparce que l'on t'a raillé ou parce que l'on t'a réprimandé —\nqu'il s'agisse du *Guru*, du *Linga*, du *Jangama*,\nou même de Pashupati qui porte un œil sur le front —\nles misérables liés par leurs actes qui abandonnent leur corps\nparce que des proches, les ayant vus, leur ont parlé durement,\nnaîtront durant sept fois sept vies dans le ventre d'une truie,\nmangeront les immondices des cent un clans et des dix-huit castes,\net monteront la garde au seuil de la maison des intouchables, ô Seigneur !\nÔ Amugeshwaralinga, je le jure par vous et par vos *Pramathas* !"},"m":{"en":"This Vachana strongly urges the mind to remain fearless, steadfast, and unwavering in its chosen spiritual resolve, regardless of external criticism, ridicule, or intimidation.\n\nIt unequivocally condemns the act of ending one's physical life—whether by weapons, self-burial, drowning, hanging, or poison—merely because one is rebuked or pressured by close associates, even if such harsh words come from the Guru, Linga, Jangama, or the forehead-eyed Pashupati himself.\n\nThe Vachana declares that those who cowardly abandon their body out of fear or humiliation are deluded individuals who suffer the most degraded existence across lifetimes, figuratively described as being reborn as swine feeding on the filth of all castes and guarding the thresholds of outcastes.\n\nAddressed to the Formless Supreme Reality through the ankitanama Amugeshwaralinga and sworn in the name of the Pramathas, the Vachana upholds the sanctity of human life and insists that a true seeker must face social and spiritual trials with unyielding courage rather than escaping through self-destruction.","hi":"इस वचन का केंद्रीय संदेश यह है कि मनुष्य को किसी भी परिस्थिति में भयभीत होकर अपने संकल्प से पीछे नहीं हटना चाहिए और अपने ग्रहण किए हुए दृढ़ निश्चय का त्याग नहीं करना चाहिए।\n\nचाहे गुरु हों, निराकार परमतत्त्व के साकार प्रतीक स्वरूप लिंग हों, आध्यात्मिक ज्ञान का प्रसार करने वाले प्रबुद्ध जंगम हों, या फिर पौराणिक संदर्भ के ललाट पर नेत्र रखने वाले पशुपति ही क्यों न हों, अथवा किसी अपने या पराए की निंदा, फटकार और कटु वचनों के दबाव में आकर जीवन से पलायन करना पूर्णतः अनुचित है।\n\nजो अज्ञानी लोग ऐसी आलोचनाओं से घबराकर शस्त्र, जीवित समाधि, जल, फंदे, विष या औषधि के माध्यम से अपने शरीर का त्याग (आत्महत्या) कर लेते हैं, वे घोर पतन के भागी बनते हैं।\n\nअमुगेश्वरलिंग के रूप में निराकार परम सत्य और प्रथम गणों की सौगंध खाकर यह वचन स्पष्ट करता है कि इस प्रकार देह त्यागने वाले लोग अत्यंत नीच और तिरस्कृत स्थिति को प्राप्त होते हैं, इसलिए मानव जीवन में आने वाली चुनौतियों का डटकर सामना करना ही सच्चा मार्ग है।","mr":"हे वचन साधकाला आपल्या मनाचे धैर्य टिकवून ठेवण्याचे, कोणत्याही संकटाने मागे न हटण्याचे आणि घेतलेला सत्यनिष्ठेचा वसा कधीही न सोडण्याचे आवाहन करते.\n\nकोणी निंदा केली किंवा धमकावले म्हणून शस्त्र, जिवंत समाधी, पाणी, गळफास किंवा विषाचा आश्रय घेऊन आपला देह त्यागू नये, असे हे वचन ठामपणे सांगते.\n\nगुरु, निराकार परमतत्त्वाचे प्रतीक असलेले लिंग, आध्यात्मिक ज्ञान देणारे जंगम किंवा खुद्द कपाळावर डोळा असलेला पशुपती जरी समोर आला, अथवा जवळच्या लोकांनी कितीही कठोर व जाचक शब्द बोलले, तरी खचून जाऊन जीव देणाऱ्या भ्याड प्रवृत्तीचा येथे तीव्र निषेध केला आहे.\n\nप्रतिकूल परिस्थितीला शरण जाऊन स्वतःचा देह संपवणे हे अमुगेश्वरलिंग या परमतत्त्वाच्या आणि प्रमथांच्या साक्षीने अत्यंत नीच व अधोगतीकडे नेणारे कृत्य मानले गेले असून, जीवनातील आव्हानांना निर्भयपणे आणि अढळ निष्ठेने सामोरे जाणे हाच खरा शरणधर्म आहे, हे यातून स्पष्ट होते.","fr":"Ce vachana exhorte l'esprit à demeurer inébranlable, à ne jamais céder à la peur ou au découragement, et à préserver fermement sa détermination spirituelle face aux critiques, aux mépris ou aux réprimandes.\n\nIl condamne avec rigueur toute tentative de mettre fin à ses jours — que ce soit par les armes, l'enterrement rituel en samadhi, la noyade, la pendaison, le poison ou les drogues — par simple désespoir ou sous le poids du jugement d'autrui.\n\nCette fermeté intérieure doit subsister même si les reproches émanent du Guru, du Linga, du Jangama, de Pashupati doté de l'œil frontal, ou encore des compagnons spirituels les plus proches.\n\nEn prenant à témoin la Réalité suprême invoquée sous le nom d'Amugeshwaralinga ainsi que les Pramathas, le texte affirme avec force que ceux qui abandonnent lâchement leur corps sous la pression sociale ou spirituelle s'exposent à la plus vile des déchéances morales et existentielles."}},{"no":1290,"o":"ಹೊನ್ನ ಬಿಟ್ಟಡೇನು, ಹೆಣ್ಣ ಬಿಟ್ಟಡೇನು, ಮಣ್ಣ ಬಿಟ್ಟಡೇನು,\n ವಿರಕ್ತನಾಗಬಲ್ಲನೆ?\n ಆದ್ಯರ ವಚನಂಗಳ ಹತ್ತುಸಾವಿರವ ಲೆಕ್ಕವಿಲ್ಲದೆ ಓದಿದಡೇನು,\n ನಿತ್ಯನಾಗಬಲ್ಲನೆ?\n ಮಂಡೆಯ ಬೋಳಿಸಿಕೊಂಡು ಅಂದಚಂದಕೆ ತಿರುಗುವ\n ಜಗಭಂಡರ ಮೆಚ್ಚುವನೆ, ಅಮುಗೇಶ್ವರಲಿಂಗವು?","t":{"en":"What if he gives up gold, what if he gives up woman, what if he gives up land—\ncan he become truly detached?\nWhat if he reads ten thousand Vachanas of the ancient ones without count—\ncan he become eternal?\nHaving shaved their heads and wandering about for outward show,\nwill Amugeshwaralinga ever be pleased with such shameless frauds of the world?","hi":"सोना छोड़ देने से क्या, स्त्री छोड़ देने से क्या, मिट्टी छोड़ देने से क्या,\nक्या वह विरक्त हो सकता है?\nआद्यों के दस हज़ार वचनों को अनगिनत बार पढ़ने से क्या,\nक्या वह नित्य हो सकता है?\nसिर मुँड़ाकर सज-धज के लिए घूमनेवाले\nजग के पाखंडियों को क्या अमुगेश्वरलिंग पसंद करेंगे?","mr":"सोने सोडले तर काय, स्त्री सोडली तर काय, जमीन सोडली तर काय,\nतो विरक्त होऊ शकेल का?\nआद्यांची दहा हजार वचने अगणित वेळा वाचली तर काय,\nतो नित्य होऊ शकेल का?\nडोके मुंडून घेऊन डौलाने फिरणाऱ्या\nजगभंडांना पसंती देईल का, अमुगेश्वरलिंग?","fr":"Qu'importe s'il renonce à l'or, qu'importe s'il renonce à la femme, qu'importe s'il renonce à la terre,\npeut-il devenir un renonçant ?\nQu'importe s'il lit sans compter dix mille Vachanas des anciens maîtres,\npeut-il devenir éternel ?\nCes effrontés du monde qui se rasent le crâne et errent pour la parade,\nAmugeshwaralinga les approuvera-t-il ?"},"m":{"en":"This Vachana explains that mere physical abandonment of wealth, women, and land does not make a person truly detached.\n\nSimilarly, mechanically reading tens of thousands of Vachanas composed by the ancient Sharanas (Adyas) cannot in itself lead one to eternal spiritual realization.\n\nThrough these pointed rhetorical questions, the Vachana critiques the hypocrisy of outward asceticism and superficial scriptural scholarship that lack genuine inner transformation.\n\nThe Formless Supreme Consciousness, addressed here as Amugeshwaralinga, does not approve of such worldly pretenders who merely shave their heads and wander about for outward show.","hi":"इस वचन का केंद्रीय भाव यह है कि केवल बाहरी रूप से धन, स्त्री या भूमि का त्याग कर देने मात्र से कोई मनुष्य सच्चा विरक्त नहीं हो सकता।\n\nइसी प्रकार, बिना आंतरिक बोध के आद्य शरणों के दस हजार या अनगिनत वचनों का केवल पाठ कर लेने से कोई शाश्वत सत्य में स्थित नहीं हो सकता।\n\nयह वचन स्पष्ट करता है कि सिर मुंडवाकर केवल दिखावे और आडंबर के लिए इधर-उधर भटकने वाले पाखंडियों को निराकार परमतत्त्व अमुगेश्वरलिंग कभी स्वीकार नहीं करता।\n\nइसका आध्यात्मिक महत्त्व यह है कि सच्ची विरक्ति और आध्यात्मिकता बाहरी त्याग, कोरे शास्त्र-पठन या भेष बदलने में नहीं, बल्कि आंतरिक शुद्धता और वास्तविक आचरण में निहित है।","mr":"हे वचन स्पष्ट करते की केवळ बाह्य स्वरूपात सोने, स्त्री आणि भूमी यांचा त्याग केल्याने मनुष्य खऱ्या अर्थाने विरक्त होऊ शकत नाही.\n\nत्याचप्रमाणे, पूर्वसुरींच्या दहा हजार वचनांचे केवळ संख्यात्मक आणि यांत्रिक पठण केल्याने कोणालाही शाश्वत सत्याची प्राप्ती होत नाही.\n\nअशाप्रकारे अंतर्मनात कोणतेही परिवर्तन न घडवता केवळ डोक्याचे मुंडन करून दिमाखाने फिरणाऱ्या ढोंगी व निर्लज्ज लोकांचे आचरण निरर्थक आहे.\n\nअसे पोकळ बाह्य प्रदर्शन आणि ढोंगीपणा अमुगेश्वरलिंग या परमतत्त्वाला कधीही मान्य होत नाही, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que le renoncement purement extérieur à la richesse, aux désirs charnels et aux terres ne suffit pas à engendrer un véritable détachement intérieur.\n\nDe même, la lecture mécanique et innombrable des milliers de vachanas composés par les anciens sages ne saurait à elle seule conduire à la réalisation de l'éternel.\n\nLe texte dénonce avec vigueur l'hypocrisie de ceux qui se rasent la tête pour se donner l'apparence d'ascètes et errent par simple vanité mondaine.\n\nLa Réalité suprême sans forme, invoquée sous la signature spirituelle Amugeshwaralinga, ne saurait apprécier de tels imposteurs dépourvus de sincérité intérieure."}}]},
{"id":"s6","n":{"en":"Aydakki Lakkamma","hi":"आयदक्की लक्कम्मा","mr":"आयदक्की लक्कम्मा","fr":"Aydakki Lakkamma"},"v":[{"no":1291,"o":"ಅಂಗಕ್ಕೆ ಬಡತನವಲ್ಲದೆ ಮನಕ್ಕೆ ಬಡತನವುಂಟೆ?\n ಬೆಟ್ಟ ಬಲ್ಲಿತ್ತೆಂದಡೆ,\n ಉಳಿಯ ಮೊನೆಯಲ್ಲಿ ಬಡತನವಿದ್ದಡೆ ಒಡೆಯದೆ?\n ಘನಶಿವಭಕ್ತರಿಗೆ ಬಡತನವಿಲ್ಲ; ಸತ್ಯರಿಗೆ ದುಷ್ಕರ್ಮವಿಲ್ಲ.\n ಎನಗೆ ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗವುಳ್ಳನ್ನಕ್ಕ\n ಆರ ಹಂಗಿಲ್ಲ ಮಾರಯ್ಯಾ.","t":{"en":"There may be poverty for the body, but can there be poverty for the mind?\nEven if a mountain is said to be mighty,\nthough there be poverty at the point of the chisel, does it not break it?\nFor the great devotees of Shiva, there is no poverty; for the truthful, there is no evil action.\nSo long as I have Marayyapriya Amareshwaralinga,\nI am beholden to no one, O Marayya.","hi":"देह के लिए निर्धनता है, क्या मन के लिए भी निर्धनता हो सकती है?\nपहाड़ को कठोर कहें,\nतो क्या छेनी की नोक में निर्धनता होती है कि वह उसे तोड़ न सके?\nमहान शिवभक्तों को निर्धनता नहीं है; सत्यनिष्ठों को दुष्कर्म नहीं है।\nजब तक मेरे पास मारय्याप्रिय अमरेश्वरलिंग हैं,\nमुझे किसी का अहसान नहीं है, हे मारय्या।","mr":"देहाला दारिद्र्य असू शकते, पण मनाला कधी दारिद्र्य असते का?\nडोंगर कितीही कठीण असला तरी,\nछन्नीच्या टोकामध्ये का दारिद्र्य असते की तो फुटणार नाही?\nमहान शिवभक्तांना दारिद्र्य नसते; सत्यवंतांना दुष्कर्म नसते.\nजोपर्यंत माझ्याजवळ मारय्याप्रिय अमरेश्वरलिंग आहे,\nतोपर्यंत मला कुणाचेही मिंधेपण नाही, हे मारय्या!","fr":"Hormis la pauvreté pour le corps, peut-il y avoir de la pauvreté pour l'esprit ?\nMême si l'on dit que la montagne est dure,\ns'il y avait de la pauvreté à la pointe du ciseau, la briserait-il ?\nPour les grands dévots de Shiva, il n'y a pas de pauvreté ; pour les véridiques, il n'y a pas de mauvaise action.\nTant que j'ai pour moi Marayyapriya Amareshwaralinga,\nje ne suis redevable à personne, ô Marayya."},"m":{"en":"This Vachana explains that poverty belongs only to the physical body, whereas a resolute and conscious mind can never be impoverished.\n\nJust as the sharp tip of a chisel can split a mighty mountain regardless of its size, inner determination and spiritual strength can overcome any material hardship.\n\nTrue devotees of the Supreme Reality are never truly poor, and those anchored in truth remain untouched by corrupt actions.\n\nAddressing Marayya, the Vachana affirms that as long as one is sustained by the Formless Supreme Consciousness invoked as Marayyapriya Amareshwaralinga, there is no need to live in obligation to anyone.","hi":"इस वचन का केंद्रीय भाव यह है कि गरीबी केवल भौतिक शरीर तक सीमित हो सकती है, परंतु एक दृढ़ और जागृत मन कभी दरिद्र या कमजोर नहीं हो सकता।\n\nजिस प्रकार एक विशाल और कठोर पर्वत को भी छेनी की पैनी नोक से तोड़ा जा सकता है, उसी प्रकार अटूट मानसिक संकल्प के सामने कोई भी भौतिक अभाव टिक नहीं सकता।\n\nयह वचन स्पष्ट करता है कि श्रेष्ठ शिवभक्तों के पास आत्मिक संपन्नता होने के कारण वे कभी दरिद्र नहीं होते और सत्य के मार्ग पर चलने वालों के कर्म कभी अशुद्ध नहीं होते।\n\nजब तक साधक के भीतर मारय्यप्रिय अमरेश्वरलिंग रूपी निराकार परमतत्त्व की उपस्थिति का बोध है, तब तक वह पूर्णतः स्वावलंबी है और किसी भी सांसारिक आश्रय या एहसान का मोहताज नहीं है।","mr":"हे वचन स्पष्ट करते की दारिद्र्य किंवा अभाव हा केवळ शरीरापुरता मर्यादित असू शकतो, परंतु मनाला कधीही दारिद्र्य नसते.\n\nडोंगर कितीही अवाढव्य आणि कठीण असला, तरी छिन्नीच्या टोकामध्ये जर तीक्ष्णता आणि सामर्थ्य असेल, तर तो डोंगर नक्कीच फोडला जाऊ शकतो; त्याचप्रमाणे दृढ मनोबलापुढे कोणतीही अडचण टिकू शकत नाही.\n\nमहान शिवभक्तांना कधीही दारिद्र्य शिवत नाही आणि सत्याच्या मार्गावर चालणाऱ्यांकडून कधीही दुष्कर्म घडत नाही, असा उच्च आध्यात्मिक विचार यात मांडला आहे.\n\nजोपर्यंत आपल्याजवळ 'मारय्यप्रिय अमरेश्वरलिंग' या निराकार परमतत्त्वाची साथ आणि जाणीव आहे, तोपर्यंत आपल्याला कोणाच्याही मिंधेपणाची किंवा आश्रयाची गरज नाही, असा स्वाभिमानी आणि निर्भय भाव हे वचन व्यक्त करते.","fr":"Ce vachana établit une distinction essentielle entre le dénuement physique et la richesse intérieure en affirmant que si le corps peut connaître la pauvreté matérielle, l'esprit, quant à lui, ne saurait en être affligé.\n\nÀ travers l'image de la montagne qui, aussi massive et dure soit-elle, finit par céder sous la pointe acérée du burin, le texte illustre la puissance d'une volonté résolue face aux épreuves de l'existence.\n\nAinsi, les grands dévots de Shiva ne connaissent jamais l'indigence spirituelle, tout comme ceux qui marchent dans la vérité demeurent préservés des mauvaises actions.\n\nS'adressant à Marayya, la voix poétique affirme enfin son absolue liberté face aux dettes et aux dépendances de ce monde, tant qu'elle demeure unie à la Réalité suprême sans forme, invoquée sous le nom de Marayyapriya Amareshwaralinga."}},{"no":1292,"o":"ಆವ ಬೀಜವು ಬೀಳುವಲ್ಲಿ ಮೊಳೆ ಮುಖ ಹಿಂಚು ಮುಂಚುಂಟೆ?\n ಮೂಲ ನಷ್ಟವಾದಲ್ಲಿ ಅಂಕುರ ನಿಂದಿತ್ತು.\n ನೀ ಮರೆದಲ್ಲಿ ನಾನರಿದಲ್ಲಿ ಬೇರೊಂದೊಡಲುಂಟೆ?\n ಕೂಟಕ್ಕೆ ಸತಿಪತಿ ಎಂಬ ನಾಮವಲ್ಲದೆ\n ಅರಿವಿಂಗೆ ಬೇರೊಂದೊಡಲುಂಟೆ?\n ಬೇರೊಂದಡಿಯಿಡದಿರು,\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗವನರಿಯಬಲ್ಲಡೆ.","t":{"en":"When any seed falls, is there a before or an after for the tip of its sprout?\nWhen the root perishes, the shoot ceases to be.\nIf you forget and I remain aware, can there be two separate bodies?\nFor union, there is only the name of wife and husband,\nbut for awareness, is there a separate body?\nDo not take a step apart,\nif you would truly know Marayyapriya Amareshwaralinga.","hi":"जब कोई बीज गिरता है, तो क्या उसके अंकुर का मुख आगे या पीछे होता है?\nजहाँ मूल नष्ट हुआ, वहाँ अंकुर रुक गया।\nजहाँ तुम भूल गए और जहाँ मैंने जान लिया, क्या वहाँ कोई दूसरा शरीर है?\nमिलन के लिए पति-पत्नी का नाम ही है, इसके अतिरिक्त\nचेतना के लिए क्या कोई दूसरा शरीर है?\nकहीं और पग मत रखो,\nयदि मारय्याप्रिय अमरेश्वरलिंग को जान सकते हो।","mr":"कोणतेही बीज पडताना त्याच्या कोंबाच्या मुखामध्ये मागे-पुढे असा भेद असतो का?\nमूळ नष्ट झाल्यावर अंकुर थांबतो.\nतू विसरल्यावर आणि मी जाणल्यावर, वेगळे असे शरीर असते का?\nमिलनासाठी पती-पत्नी असे नाव असले तरी,\nजाणिवेला वेगळे असे शरीर असते का?\nमारय्यप्रिय अमरेश्वरलिंगाला जाणू शकत असशील,\nतर वेगळे पाऊल टाकू नकोस.","fr":"Quelle que soit la graine qui tombe, y a-t-il un avant ou un après pour la pointe du germe ?\nLorsque la racine est détruite, la pousse s'arrête.\nLorsque tu tombes dans l'oubli et que je m'éveille à la conscience, y a-t-il un autre corps ?\nHormis ce que l'on appelle les noms d'épouse et d'époux pour l'union,\ny a-t-il un autre corps pour la conscience lumineuse ?\nNe pose pas ton pas ailleurs,\nsi tu sais connaître Marayyapriya Amareshwaralinga."},"m":{"en":"This Vachana uses the metaphor of a germinating seed to illustrate the origin of duality and its dissolution in pure consciousness.\n\nJust as a falling seed holds the potential to sprout in any direction, yet ceases to germinate altogether once its root cause is destroyed, the sense of separation vanishes when the underlying root of ignorance is eliminated.\n\nWhile bodily union in the world relies on the dualistic labels of husband and wife, awakened consciousness (Arivu) transcends physical distinction, revealing that the self and the other do not possess separate identities when forgetfulness gives way to awareness.\n\nAddressing the Supreme Reality as Marayyapriya Amareshwaralinga, the Vachana concludes that realizing this non-dual truth requires remaining steadfast in unified awareness without taking a single step toward duality.","hi":"इस वचन का मूल भाव यह है कि जिस प्रकार किसी बीज के गिरने पर उसके अंकुरित होने की दिशा में आगे-पीछे का भेद नहीं होता और मूल रूप के नष्ट हो जाने पर अंकुरना ही रुक जाता है, उसी प्रकार आत्म-बोध में द्वैत की कोई जगह नहीं है।\n\nवचन में यह स्पष्ट किया गया है कि विस्मरण और बोध की अवस्थाओं में भी दो अलग शरीर या अस्तित्व नहीं होते।\n\nसांसारिक मिलन के संदर्भ में ही 'सती' और 'पति' जैसे अलग-अलग नाम होते हैं, किंतु शुद्ध बोध के स्तर पर कोई दूसरा शरीर या भिन्नता नहीं रह जाती।\n\nमारय्यप्रिय अमरेश्वरलिंग के रूप में संबोधित परम सत्य को यदि वास्तव में जानना है, तो अद्वैत के इस मार्ग से हटकर किसी अन्य दिशा में कदम नहीं रखना चाहिए।","mr":"हे वचन आत्मभान आणि अद्वैत जाणिवेचे सखोल तत्त्वज्ञान स्पष्ट करते. ज्याप्रमाणे कोणतेही बीज मातीत पडल्यावर त्याला कोंब फुटताना मागे-पुढे असा भेद नसतो आणि मूळ नष्ट झाल्यास अंकुरही थांबतो, त्याचप्रमाणे या वचनात अस्तित्वाच्या मूळ एकत्वाकडे लक्ष वेधले आहे.\n\nएक बाजू विस्मृतीत गेली आणि दुसरी बाजू जाणिवेत राहिली, तरी प्रत्यक्षात वेगळे शरीर किंवा दुजेपणा अस्तित्वात नसतो. केवळ सांसारिक मिलनापुरतेच 'पती-पत्नी' अशी नावे दिली जातात, परंतु शुद्ध जाणिवेच्या पातळीवर वेगवेगळ्या देहांचा भेद उरत नाही.\n\nमारय्यप्रिय अमरेश्वरलिंग या परमतत्त्वाला जर खऱ्या अर्थाने जाणून घ्यायचे असेल, तर या अद्वैत जाणिवेपासून ढळून दुसरीकडे पाऊल टाकू नये, असा आध्यात्मिक आशय या वचनातून व्यक्त होतो.","fr":"Ce vachana met en lumière la nature indivise de la conscience spirituelle à travers la métaphore de la graine et du germe, qui ne souffrent d'aucune séparation temporelle lors de leur éclosion, mais cessent de croître dès que leur racine originelle est détruite.\n\nIl explique que les désignations d'époux et d'épouse n'ont de sens que dans le cadre de leur union mondaine, tandis que sur le plan de la connaissance spirituelle (Arivu), il n'existe pas deux corps distincts, que l'un demeure dans l'oubli ou que l'autre accède à l'éveil.\n\nLa portée spirituelle de ce poème réside dans cette unité absolue de la conscience qui transcende les distinctions de genre et de dualité physique entre les êtres.\n\nAinsi, pour celui qui est capable de connaître véritablement la Réalité suprême sans forme, invoquée sous la signature spirituelle de Marayyapriya Amareshwaralinga, il est essentiel de demeurer ferme dans cette unité sans s'égarer sur une voie de séparation."}},{"no":1293,"o":"ಆಸೆಯೆಂಬುದು ಅರಸಿಂಗಲ್ಲದೆ,\n ಶಿವಭಕ್ತರಿಗುಂಟೆ ಅಯ್ಯಾ?\n ರೋಷವೆಂಬುದು ಯಮದೂತರಿಗಲ್ಲದೆ,\n ಅಜಾತರಿಗುಂಟೆ ಅಯ್ಯಾ?\n ಈಸಕ್ಕಿಯಾಸೆ ನಿಮಗೇಕೆ? ಈಶ್ವರನೊಪ್ಪ.\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗಕ್ಕೆ ದೂರ ಮಾರಯ್ಯ.","t":{"en":"What is called desire belongs only to a king;\ncan it exist in the devotees of Shiva, O Master?\nWhat is called wrath belongs only to the messengers of Yama;\ncan it exist in the Unborn, O Master?\nWhy do you have this desire for so much rice? Ishwara will not approve.\nThis is far from Marayyapriya Amareshwaralinga, O Marayya.","hi":"लोभ कहना तो राजा के लिए है,\nक्या शिवभक्तों को भी होता है, हे स्वामी?\nक्रोध कहना तो यमदूतों के लिए है,\nक्या अजातों को भी होता है, हे स्वामी?\nइतने-से चावल का लोभ आपको क्यों? ईश्वर इसे स्वीकार नहीं करते।\nमारय्याप्रिय अमरेश्वरलिंग से तुम दूर हो, मारय्या।","mr":"हाव ही राजालाच असते,\nती शिवभक्तांना असते का हो?\nक्रोध हा यमदूतांनाच असतो,\nतो अजातांना असतो का हो?\nएवढ्याशा तांदळाची हाव तुम्हाला कशाला? ईश्वराला हे मान्य नाही।\nमारय्यप्रिय अमरेश्वरलिंगाला हे दूर आहे, मारय्या।","fr":"Ce que l'on appelle l'avidité appartient au roi,\nmais en existe-t-il chez les dévots de Shiva, mon Seigneur ?\nCe que l'on appelle la colère appartient aux messagers de Yama,\nmais en existe-t-il chez les Non-nés, mon Seigneur ?\nPourquoi avez-vous cette avidité pour tant de riz ? Ishwara ne l'approuve pas.\nC'est bien loin de Marayyapriya Amareshwaralinga, ô Marayya."},"m":{"en":"This Vachana contrasts worldly passions with the inner freedom expected of a true Sharana, pointing out that greed belongs to kings and wrath belongs to the messengers of Yama, not to devotees who have transcended the cycle of birth.\n\nUsing these striking comparisons, the Vachana questions why a spiritual seeker should harbour craving for so much rice, reminding us that such acquisitiveness does not meet the approval of the Divine.\n\nIn the philosophy of Kayaka, one gathers only what is needed for honest livelihood and daily sustenance, whereas hoarding beyond necessity reflects attachment and greed.\n\nAddressing Marayya directly, the Vachana concludes that such desire estranges a seeker from the Formless Supreme Consciousness, invoked through the ankitanama Marayyapriya Amareshwaralinga.","hi":"इस वचन का केंद्रीय संदेश यह है कि सच्चे शिवभक्त और जन्म-मरण के बंधन से मुक्त साधक (अजात) के भीतर लालच और क्रोध के लिए कोई स्थान नहीं होता।\n\nयहाँ एक स्पष्ट विरोधाभास के माध्यम से समझाया गया है कि संग्रह की तृष्णा राजाओं का स्वभाव है और क्रोध करना यमदूतों का काम है, न कि आध्यात्मिक पथ पर चलने वाले शरणों का।\n\nइतने अधिक चावल के प्रति मोह या संचय की लालसा रखने को परम सत्य स्वीकार नहीं करता।\n\nवचन में मारय्य को संबोधित करते हुए सचेत किया गया है कि आवश्यकता से अधिक अनाज का यह लोभ मनुष्य को निराकार परमतत्त्व 'मारय्यप्रिय अमरेश्वरलिंग' से दूर कर देता है।","mr":"या वचनामध्ये खऱ्या शिवभक्ताच्या निष्काम आणि शांत वृत्तीचे दर्शन घडवून, सांसारिक हाव व क्रोध यांसारख्या विकारांवर परखड भाष्य केले आहे.\n\nसत्ता आणि संपत्तीची हाव ही केवळ राजालाच असू शकते आणि क्रोध हा यमदूतांचा गुणधर्म आहे; मात्र जन्म-मृत्यूच्या पलीकडे गेलेल्या 'अजात' शिवभक्तांच्या ठायी लोभ आणि संताप यांना कोणतेही स्थान नसते.\n\nअशा स्थितीत एवढ्याशा तांदळाची लालसा बाळगणे भक्ताला शोभणारे नाही, कारण अशी आसक्ती परमसत्याला कधीच मान्य होत नाही.\n\nलोभ आणि क्रोध बाळगणारी व्यक्ती 'मारय्यप्रिय अमरेश्वरलिंग' या निराकार परमतत्त्वापासून दूर जाते, म्हणूनच साधकाने पूर्णपणे निर्लोभ आणि क्रोधमुक्त असले पाहिजे, हेच या वचनाचे सार आहे.","fr":"Ce vachana met en lumière le fait que l'avidité et la colère sont totalement incompatibles avec la véritable voie spirituelle des Sharanas.\n\nIl établit un contraste saisissant en rappelant que la convoitise appartient aux rois, tandis que la fureur caractérise les messagers de Yama, et que ces passions n'ont aucune place chez les dévots de Shiva ou chez les êtres affranchis du cycle de la naissance (Ajata).\n\nLe texte interroge directement Marayya sur son désir excessif d'amasser du riz, soulignant qu'une telle avidité matérielle ne saurait être approuvée par le Principe suprême.\n\nAinsi, céder à la cupidité et à l'emportement éloigne l'aspirant de la Réalité suprême sans forme, invoquée ici sous la signature spirituelle de Marayyapriya Amareshwaralinga."}},{"no":1294,"o":"ಗರ್ವದಿಂದ ಮಾಡುವ ಭಕ್ತಿ ದ್ರವ್ಯದ ಕೇಡು;\n ನಡೆಯಿಲ್ಲದ ನುಡಿ ಅರಿವಿಂಗೆ ಹಾನಿ;\n ಕೊಡದೆ ತ್ಯಾಗಿ ಎನಿಸಿಕೊಂಬುದು ಮುಡಿಯಿಲ್ಲದ ಶೃಂಗಾರ;\n ದೃಢವಿಲ್ಲದ ಭಕ್ತಿ ಅಡಿ ಒಡೆದ ಕುಂಭದಲ್ಲಿ ಸುಜಲವ ತುಂಬಿದಂತೆ,\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗವ ಮುಟ್ಟದ ಭಕ್ತಿ.","t":{"en":"Devotion practised with pride is a waste of wealth;\nspeech without conduct is harm to awareness;\nto be called a renunciant without giving is adornment without hair;\ndevotion without steadfastness is like filling pure water into a pot cracked at the bottom—\nsuch is devotion that does not touch Marayyapriya Amareshwaralinga.","hi":"गर्व से की जानेवाली भक्ति द्रव्य का नाश है,\nआचरण के बिना वाणी चेतना की हानि है,\nदिए बिना त्यागी कहलाना केशहीन शृंगार है,\nदृढ़ता के बिना भक्ति तली फूटे घड़े में निर्मल जल भरने के समान है,\nमारय्यप्रिय अमरेश्वरलिंग को न छूनेवाली भक्ति।","mr":"गर्वाने केलेली भक्ती हा द्रव्याचा नाश आहे;\nआचरणावाचून केलेले बोलणे ही जाणिवेची हानी आहे;\nकाहीही न देता त्यागी म्हणवून घेणे हा केसांवाचून केलेला शृंगार आहे;\nनिष्ठा नसलेली भक्ती ही तळ फुटलेल्या कुंभात निर्मळ पाणी भरल्यासारखी आहे,\nमारय्यप्रिय अमरेश्वरलिंगाला न शिवणारी भक्ती.","fr":"La dévotion pratiquée avec orgueil est une perte de richesse ;\nla parole dépourvue d'acte est une atteinte à la conscience éveillée ;\nse faire appeler renonçant sans rien donner est une parure sur une tête sans chevelure ;\nla dévotion sans fermeté est comme verser de l'eau pure dans une jarre au fond brisé :\nc'est une dévotion qui n'atteint pas Marayyapriya Amareshwaralinga."},"m":{"en":"This Vachana exposes the futility of spiritual and social practices that lack inner sincerity, humility, and steadfastness.\n\nDevotion performed out of pride and ego is merely a wasteful expenditure of wealth, while speaking wise words without matching righteous conduct directly harms true spiritual awareness (Arivu).\n\nThrough vivid comparisons, the Vachana points out that claiming to be a generous renunciate without actually giving is as absurd as adorning a head that has no hair, and wavering devotion is like pouring pure water into a pot with a broken bottom.\n\nSuch hollow and unstable practices never truly reach or unite with the Formless Supreme Consciousness, addressed here as Marayyapriya Amareshwaralinga.","hi":"इस वचन का केंद्रीय भाव यह है कि अहंकार, आचरणहीनता और अस्थिरता से युक्त भक्ति पूरी तरह से निरर्थक है।\n\nइसमें स्पष्ट किया गया है कि गर्व से की जाने वाली भक्ति केवल धन की बर्बादी है और आचरण के बिना कोरे ज्ञान की बातें करना स्वयं के बोध को ही हानि पहुँचाता है।\n\nबिना कुछ दान किए स्वयं को त्यागी कहलाना ठीक वैसा ही हास्यास्पद है, जैसे सिर पर बिना बालों के श्रृंगार करना।\n\nअंततः, यह वचन इस समझ की ओर संकेत करता है कि मारय्यप्रिय अमरेश्वरलिंग के रूप में संबोधित निराकार परमतत्त्व का स्पर्श न करने वाली और दृढ़ता से रहित भक्ति, फूटे हुए तले वाले घड़े में शुद्ध जल भरने के समान निष्फल है।","mr":"अहंकाराने केलेली भक्ती ही केवळ धनाचा अपव्यय ठरते आणि प्रत्यक्ष आचरणाची जोड नसलेले शब्द खऱ्या आध्यात्मिक ज्ञानाला बाधा पोहोचवतात, असे हे वचन स्पष्ट करते.\n\nप्रत्यक्ष काहीही दान न करता स्वतःला त्यागी म्हणवून घेणे म्हणजे केसांशिवाय केलेल्या व्यर्थ शृंगारासारखे पोकळ प्रदर्शन होय.\n\nमनात दृढ निष्ठा नसलेली भक्ती ही तळ फुटलेल्या घड्यात शुद्ध पाणी भरण्यासारखी निरर्थक असते, कारण अशा अस्थिर वृत्तीमध्ये साधनेचे कोणतेही मोल टिकून राहत नाही.\n\nअशा दांभिक आणि अस्थिर भक्तीतून मारय्यप्रिय अमरेश्वरलिंग या परमतत्त्वाची अनुभूती कधीही घेता येत नाही; त्यासाठी अहंकाररहित आचरण आणि निष्ठेचीच आवश्यकता असते, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière la futilité d'une pratique spirituelle dépourvue d'humilité, de cohérence et de fermeté intérieure.\n\nIl explique qu'une dévotion empreinte d'orgueil ne fait que gaspiller les biens matériels, tandis que des paroles qui ne s'accompagnent pas d'actes justes nuisent à la vraie connaissance (Arivu).\n\nDe même, prétendre au renoncement sans jamais rien partager est aussi absurde que de vouloir parer une tête sans chevelure, et une foi hésitante ressemble à un vase au fond brisé incapable de retenir l'eau pure.\n\nAinsi, toute dévotion superficielle qui n'atteint pas réellement la Réalité suprême sans forme, invoquée sous le nom de Marayyapriya Amareshwaralinga, demeure totalement vaine."}},{"no":1295,"o":"ಭಕ್ತಂಗೆ ಬಡತನವುಂಟೆ? ನಿತ್ಯಂಗೆ ಮರಣವುಂಟೆ?\n ಭಕ್ತರು ಬಡವರೆಂದು ಮತ್ತೊಂದ ಕೊಟ್ಟೆಹೆನೆಂದಡೆ,\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವಲಿಂಗವು ಸತ್ತಂದಿಗಲ್ಲದೆ ಬಡತನವಿಲ್ಲ.","t":{"en":"Is there poverty for the devotee? Is there death for the eternal?\nIf someone thinks that devotees are poor and says, \"I shall give them something more,\"\nunless Marayyapriya Amareshwaralinga dies, there is no poverty for us.","hi":"क्या भक्त को दरिद्रता होती है? क्या नित्य को मरण होता है?\nभक्त दरिद्र हैं, यह मानकर कुछ और दूँगा कहा जाए तो,\nमारय्यप्रिय अमरेश्वरलिंग के मरने के दिन के सिवा दरिद्रता नहीं है।","mr":"भक्ताला दारिद्र्य असते का? नित्याला मरण असते का?\nभक्त दरिद्री आहेत म्हणून आणखी काही देईन असे म्हटल्यास,\nमारय्यप्रिय अमरेश्वरलिंग निवर्तल्याच्या दिवसाखेरीज दारिद्र्य नाही।","fr":"Peut-il y avoir de la pauvreté pour le dévot ? Peut-il y avoir de la mort pour l'Éternel ?\nSi l'on dit, pensant que les dévots sont pauvres, que l'on va leur donner autre chose,\ntant que Marayyapriya Amareshwaralinga ne sera pas mort, il n'y aura point de pauvreté."},"m":{"en":"The central message of this Vachana is that true spiritual richness makes material poverty impossible for a genuine devotee.\n\nThrough rhetorical questions, the Vachana equates the impossibility of a devotee being poor with the impossibility of the Eternal ever facing death.\n\nIt rejects the condescending notion of offering charity to devotees out of pity for their material lack, asserting that their inner spiritual fulfillment leaves no room for deprivation.\n\nAddressing the Formless Supreme Consciousness as Marayyapriya Amareshwaralinga, the Vachana concludes that a devotee could experience poverty only if the immortal Absolute itself were to perish—affirming that as long as the Eternal exists, the devotee remains eternally abundant.","hi":"इस वचन का केंद्रीय भाव यह है कि एक सच्चे भक्त को कभी दरिद्रता नहीं हो सकती, ठीक वैसे ही जैसे शाश्वत सत्य को कभी मृत्यु का स्पर्श नहीं हो सकता।\n\nयह वचन स्पष्ट करता है कि यदि कोई व्यक्ति भक्तों को निर्धन या अभावग्रस्त समझकर उन्हें कुछ देने का विचार करता है, तो यह उसकी अज्ञानता है।\n\nमारय्यप्रिय अमरेश्वरलिंग के रूप में संबोधित निराकार और अमर परमतत्त्व से जुड़े होने के कारण भक्त स्वयं पूर्ण और समृद्ध होता है।\n\nअतः जब तक वह अविनाशी परम सत्य विद्यमान है—जिसका कभी नाश संभव ही नहीं है—तब तक सच्चे भक्त के जीवन में किसी भी प्रकार की दरिद्रता का कोई स्थान नहीं हो सकता।","mr":"हे वचन भक्ताच्या आंतरिक श्रीमंतीची आणि स्वाभिमानाची प्रभावी मांडणी करते.\n\nज्याप्रमाणे अविनाशी परमतत्त्वाला कधीही मरण नसते, त्याचप्रमाणे सत्याच्या मार्गावर चालणाऱ्या खऱ्या भक्तालाही कधीही दारिद्र्य किंवा कमतरता भासत नाही.\n\nभक्ताला गरीब समजून कोणी त्याला वरून काही देण्याचा किंवा उपकार करण्याचा प्रयत्न केला, तर ती भावना पूर्णपणे निरर्थक ठरते.\n\nअविनाशी अशा मारय्यप्रिय अमरेश्वरलिंग या परमतत्त्वाचा कधीही अंत होऊ शकत नाही, आणि तोपर्यंत भक्तालाही कोणत्याही प्रकारचे दारिद्र्य स्पर्श करू शकत नाही, असा आत्मविश्वास या वचनातून व्यक्त होतो.","fr":"Ce vachana met en lumière la plénitude spirituelle du véritable dévot (Bhakta), qui ne connaît jamais la pauvreté intérieure, tout comme l'Éternel ne peut connaître la mort.\n\nIl souligne que considérer les chercheurs spirituels comme démunis sur le plan matériel et vouloir leur offrir quelque chose par condescendance relève d'une profonde méprise sur leur richesse intérieure.\n\nÀ travers la signature spirituelle Marayyapriya Amareshwaralinga, qui désigne la Réalité suprême sans forme, le texte affirme avec force que la pauvreté ne pourrait toucher le dévot que si le Principe absolu lui-même cessait d'exister, ce qui est par nature impossible."}},{"no":1296,"o":"ಭಕ್ತರು ಕಾಯಕವೆಂದು ದಾಯಗಾರಿಕೆಯಲ್ಲಿ ತಂದು\n ದಾಸೋಹವ ಮಾಡಬಹುದೆ?\n ಒಮ್ಮನವ ತಂದು ಒಮ್ಮನದಲ್ಲಿಯೇ ಮಾಡಿ\n ಇಮ್ಮನವಾಗದ ಮುನ್ನವೆ\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವಲಿಂಗಕ್ಕೆ\n ಸಲಬೇಕು ಮಾರಯ್ಯಾ.","t":{"en":"Can devotees bring in what is acquired through rivalry, calling it *Kayaka*,\nand perform *Dasoha*?\nBringing a single-minded heart and performing it in single-mindedness alone,\nbefore the mind becomes divided in two,\nit must be offered to Marayyapriya Amareshwaralinga,\nO Marayya.","hi":"भक्त कायक कहकर अधिकार-भाव से लाकर\nक्या दासोह कर सकते हैं?\nएकमन लाकर, एकमन में ही करके,\nदो-मन होने से पहले ही,\nमारय्यप्रिय अमरेश्वरलिंग को\nसमर्पित होना चाहिए, हे मारय्या।","mr":"भक्तांनी कायक म्हणून स्पर्धेच्या भावनेने आणून\nदासोह करणे योग्य आहे का?\nएकचित्ताने आणून, एकचित्तानेच करून,\nमन द्विधा होण्यापूर्वीच\nमारय्यप्रिय अमरेश्वरलिंगास\nअर्पण झाले पाहिजे, हे मारय्या।","fr":"Les dévots peuvent-ils rapporter par rivalité ce qu'ils nomment *Kayaka*\net en accomplir le *Dasoha* ?\nEn le rapportant d'un seul esprit, et en l'accomplissant dans ce seul esprit,\navant même que l'esprit ne se divise en deux,\ncela doit parvenir à Marayyapriya Amareshwaralinga,\nô Marayya."},"m":{"en":"This Vachana examines the ethical and spiritual integrity required in the practice of Kayaka (honest, dedicated work) and Dasoha (selfless sharing with society).\n\nIt questions how devotees can claim to perform Dasoha if the resources they bring are acquired through deceit, rivalry, or dishonest means in the name of Kayaka.\n\nTrue work and service must be carried out with complete single-mindedness and purity of intent, free from any inner division or ulterior motive.\n\nAddressing Marayya, the Vachana concludes that before the mind slips into duality or doubt, one's sincere offering must be dedicated straight to the Formless Supreme Reality, invoked here as Marayyapriya Amareshwaralinga.","hi":"यह वचन स्पष्ट करता है कि भक्तों द्वारा कायक (श्रम) के नाम पर किसी प्रकार के छल-कपट या द्वेषपूर्ण स्पर्धा से अर्जित वस्तु से दासोह (निःस्वार्थ सेवा) नहीं किया जा सकता।\n\nसच्चे कायक और दासोह के लिए आवश्यक है कि उन्हें मन की पूर्ण एकाग्रता और पवित्रता के साथ संपन्न किया जाए।\n\nअंत में मारय्या को संबोधित करते हुए यह आध्यात्मिक मर्म प्रकट किया गया है कि मन में द्विविधा या द्वैत उत्पन्न होने से पूर्व ही, इस एकाग्र सेवा-भाव से निराकार परमतत्त्व मारय्यप्रिय अमरेश्वरलिंग में समर्पित एवं एकरूप हो जाना चाहिए।","mr":"या वचनाचा मुख्य आशय असा आहे की, शरण भक्ताने 'कायक' (प्रामाणिक श्रम) आणि 'दासोह' (निःस्वार्थ सेवा व समर्पण) करताना मनाची संपूर्ण शुद्धता आणि एकतानता राखणे अत्यंत आवश्यक आहे.\n\nकवेत घेण्याची किंवा लोभाची वृत्ती (दायगारिके) ठेवून, म्हणजेच फसवणूक किंवा स्वार्थापोटी मिळवलेल्या धनातून खरी दासोह सेवा घडू शकत नाही, हे या वचनातून स्पष्ट होते.\n\nमनात कोणताही दुजाभाव, द्विधा मनःस्थिती किंवा संकोच निर्माण होण्यापूर्वीच, पूर्णपणे एकचित्त होऊन आणि निष्कलंक भावनेने श्रम व सेवा केली पाहिजे.\n\nअशा प्रकारे मनाची अखंड एकता राखून केलेले कार्यच 'मारय्यप्रिय अमरेश्वरलिंग' या परमतत्त्वाला खऱ्या अर्थाने पावून सार्थक ठरते, असा आध्यात्मिक विचार येथे मांडला आहे.","fr":"Ce vachana met en lumière l’éthique fondamentale du Kayaka (le travail honnête et sacré) et du Dasoha (le partage désintéressé des fruits de ce labeur), qui constituent le cœur de la philosophie des Sharanas.\n\nIl interroge fermement la légitimité d’accomplir le Dasoha à partir de biens acquis par la ruse, la rivalité ou la tromperie, en les faisant faussement passer pour le fruit d’un travail intègre.\n\nL’auteur, s’adressant ici à son compagnon Marayya, souligne que l’acquisition des ressources ainsi que leur offrande à la communauté doivent procéder d’une parfaite unité d’esprit et d’une pureté d’intention absolue.\n\nLa portée spirituelle de ce vachana réside dans l’urgence de dédier cet acte accompli d’un cœur indivis à la Réalité suprême sans forme, invoquée sous la signature spirituelle Marayyapriya Amareshwaralinga, avant que le doute ou la dualité ne viennent altérer la conscience."}},{"no":1297,"o":"ಮನ ಶುದ್ಧವಿಲ್ಲದವಂಗೆ ದ್ರವ್ಯದ ಬಡತನವಲ್ಲದೆ,\n ಚಿತ್ತಶುದ್ಧದಲ್ಲಿ ಕಾಯಕವ ಮಾಡುವಲ್ಲಿ\n ಸದ್ಭಕ್ತಂಗೆ ಎತ್ತ ನೋಡಿದಡತ್ತ ಲಕ್ಷ್ಮಿ ತಾನಾಗಿಪ್ಪಳು,\n ಮಾರಯ್ಯಪ್ರಿಯ ಅಮರೇಶ್ವರಲಿಂಗದ ಸೇವೆಯುಳ್ಳನ್ನಕ್ಕರ.","t":{"en":"Only for one whose mind is impure is there poverty of wealth;\nin performing *Kayaka* with purity of heart,\nfor the true devotee, wherever one looks, Lakshmi herself abides,\nso long as there is service unto Marayyapriya Amareshwaralinga.","hi":"जिसका मन शुद्ध नहीं है, केवल उसे ही धन की दरिद्रता होती है,\nचित्त की शुद्धि से कायक करते समय,\nसद्भक्त को जिधर देखे उधर लक्ष्मी स्वयं ही रहती है,\nजब तक मारय्यप्रिय अमरेश्वरलिंग की सेवा रहती है।","mr":"ज्याचे मन शुद्ध नाही त्यालाच धनाचे दारिद्र्य असते,\nचित्तशुद्धीने कायक करताना\nसद्भक्ताला जिकडे पाहावे तिकडे लक्ष्मी स्वतःहून वास करते,\nजोपर्यंत मारय्यप्रिय अमरेश्वरलिंगाची सेवा घडत राहते.","fr":"La pauvreté de biens n'est que pour celui dont l'esprit n'est pas pur ;\nmais lorsqu'il accomplit le *Kayaka* dans la pureté de la conscience,\npour le vrai dévot, partout où il porte le regard, Lakshmi se tient d'elle-même présente,\ntant que demeure le service de Marayyapriya Amareshwaralinga."},"m":{"en":"The central message of this Vachana is that true material poverty afflicts only those who lack purity of mind, rather than those who engage in honest, dedicated labor.\n\nWhen a genuine devotee performs Kayaka (sacred, selfless work) with complete integrity and inner clarity, abundance—symbolically referred to here as Lakshmi—naturally manifests wherever they turn.\n\nThe spiritual significance of this Vachana lies in its teaching that as long as one remains devoted to the service of the Supreme Reality, invoked here through the ankitanama Marayyapriya Amareshwaralinga, sincere and mindful labor itself guarantees complete fulfillment and sufficiency.","hi":"इस वचन का केंद्रीय भाव यह है कि धन का वास्तविक अभाव केवल उसी व्यक्ति को होता है जिसका मन शुद्ध नहीं है।\n\nइसके विपरीत, जो सच्चा भक्त चित्त की पूर्ण पवित्रता और निष्ठा के साथ अपना कायक (श्रम) करता है, उसे कभी दरिद्रता का सामना नहीं करना पड़ता।\n\nवचन में लक्ष्मी का उल्लेख समृद्धि के एक सांस्कृतिक रूपक के रूप में करते हुए यह स्पष्ट किया गया है कि शुद्ध अंतःकरण से श्रम करने वाले साधक के लिए हर दिशा में संपन्नता स्वतः ही उपस्थित रहती है।\n\nजब तक साधक निराकार परमतत्त्व रूपी मारय्यप्रिय अमरेश्वरलिंग की सेवा और कायक-निष्ठा में लीन रहता है, तब तक उसके जीवन में किसी भी प्रकार का अभाव नहीं रहता।","mr":"या वचनाचा मुख्य आशय असा आहे की, खऱ्या दारिद्र्याचा संबंध मनाच्या अशुद्धतेशी असतो, शुद्ध आचरणाशी नाही.\n\nज्यांचे मन निर्मळ नसते त्यांनाच संपत्तीचे दारिद्र्य भोगावे लागते; परंतु जे सद्भक्त चित्तशुद्धीने आणि प्रामाणिकपणे आपला कायक (श्रम) करतात, त्यांच्यासाठी जिकडे पाहावे तिकडे लक्ष्मी म्हणजेच समृद्धी आपोआप वास करते.\n\nमारय्यप्रिय अमरेश्वरलिंग या परमतत्त्वाची सेवा आणि जाणीव जोपर्यंत अंतःकरणात अखंड आहे, तोपर्यंत शुद्ध मनाने केलेल्या कायकामध्ये कधीही कोणतीही कमतरता भासत नाही, असा आध्यात्मिक विचार हे वचन मांडते.","fr":"Ce vachana met en lumière le lien indissociable entre la pureté intérieure et la pratique du Kayaka, le travail accompli avec intégrité et dévouement.\n\nIl explique que la véritable pauvreté matérielle n'affecte que celui dont l'esprit est dépourvu de droiture, tandis que le chercheur sincère qui œuvre avec une conscience pure ne connaît jamais le manque.\n\nPour un tel être, la figure de Lakshmi — évoquée ici comme une métaphore de l'abondance et de la prospérité — se manifeste naturellement partout où se porte son regard.\n\nTant que l'existence demeure consacrée au service de la Réalité suprême sans forme, invoquée sous la signature spirituelle Marayyapriya Amareshwaralinga, le labeur honnête devient lui-même la source d'une plénitude inépuisable."}}]},
{"id":"s7","n":{"en":"Urilingapeddigala Punyastri Kalavve","hi":"उरिलिंगपेद्दिगल पुण्यस्त्री कालव्वे","mr":"उरिलिंगपेद्दिगळा पुण्यस्त्री काळव्वे","fr":"Urilingapeddigala Punyastri Kalavve"},"v":[{"no":1298,"o":"ಕೃತ್ಯ ಕಾಯಕವಿಲ್ಲದವರು ಭಕ್ತರಲ್ಲ;\n ಸತ್ಯಶುದ್ಧವಿಲ್ಲದುದು ಕಾಯಕವಲ್ಲ.\n ಆಸೆಯೆಂಬುದು ಭವದ ಬೀಜ;\n ನಿರಾಸೆಯೆಂಬುದು ನಿತ್ಯಮುಕ್ತಿ.\n ಉರಿಲಿಂಗಪೆದ್ದಿಗಳರಸನಲ್ಲಿ ಸದರವಲ್ಲ ಕಾಣವ್ವಾ.","t":{"en":"Those without dutiful *Kayaka* are not devotees;\nthat which lacks truth and purity is not *Kayaka*.\nWhat is called desire is the seed of worldly existence;\nwhat is called desirelessness is eternal liberation.\nBefore Urilingapeddigalarasa, it is no easy matter, see, O mother.","hi":"जिनमें कृत्य और कायक नहीं, वे भक्त नहीं हैं;\nजिसमें सत्य और शुद्धता नहीं, वह कायक नहीं है।\nआशा कहना भव का बीज है;\nनिराशा कहना नित्यमुक्ति है।\nउरिलिंगपेद्दि के स्वामी के आगे यह सहज खेल नहीं है, देख री माँ।","mr":"ज्यांच्यापाशी निष्ठेचा कायक नाही, ते भक्त नाहीत;\nजे सत्यशुद्ध नाही, ते कायक नाही.\nआशा म्हणणे हे भवाचे बीज आहे;\nनिराशा म्हणणे ही नित्यमुक्ती आहे.\nउरिलिंगपेद्दिगळरस यांच्यासमोर ही काही साधीसुधी गोष्ट नाही, हे जाणून घे माते.","fr":"Ceux qui sont dépourvus d'un *Kayaka* accompli en acte ne sont pas des dévots ;\nce qui est dépourvu de vérité et de pureté n'est pas un *Kayaka*.\nCe que l'on appelle le désir est la semence de l'existence mondaine ;\nce que l'on appelle l'absence de désir est l'éternelle libération.\nAuprès d'Urilingapeddigalarasa, il n'y a point d'indulgence, vois-tu, ô mère."},"m":{"en":"This Vachana defines the foundational ethics of Sharana philosophy by linking true devotion directly to honest, purposeful labour (Kayaka). It asserts that one cannot be considered a genuine devotee without engaging in productive work, and equally, that no work qualifies as true Kayaka unless it is rooted in absolute truth and moral purity.\n\nFurthermore, the Vachana identifies greed and selfish desire as the root cause of worldly bondage, while performing one's work free from such acquisitive desires leads to enduring liberation in the present life itself.\n\nAddressing the Supreme Reality as Urilingapeddigalarasa, the Vachana concludes that walking this path of pure, desireless Kayaka is not an easy or casual undertaking, but demands rigorous ethical discipline and unwavering integrity.","hi":"इस वचन का केंद्रीय भाव यह है कि एक सच्चे भक्त के लिए कर्म (कायक) और सत्यनिष्ठा दोनों अनिवार्य हैं। जो व्यक्ति श्रम-आधारित कर्म नहीं करता, वह सच्चा भक्त नहीं हो सकता, और जिस कार्य में सत्य एवं पवित्रता का अभाव हो, उसे वास्तविक 'कायक' नहीं कहा जा सकता।\n\nयह वचन स्पष्ट करता है कि लोभ और तृष्णा ही सांसारिक बंधनों (भव) के मूल बीज हैं, जबकि निष्काम और तृष्णारहित भाव से कर्म करना ही नित्य मुक्ति की अवस्था है।\n\nउरिलिंगपेद्दिगळरस के रूप में संबोधित निराकार परमतत्त्व की प्राप्ति का मार्ग कोई सहज या हल्का खेल नहीं है, बल्कि इसके लिए पूर्ण सत्यनिष्ठा, शुद्ध श्रम और कामनारहित जीवन की कठोर साधना आवश्यक है।","mr":"या वचनात खरी भक्ती, शुद्ध कायक आणि मुक्ती यांचा परस्परसंबंध अत्यंत स्पष्ट शब्दांत मांडला आहे.\n\nप्रत्यक्ष प्रामाणिक श्रम म्हणजेच कायक केल्याशिवाय कोणालाही खरा भक्त म्हणता येत नाही, आणि ज्या श्रमात सत्याची व नैतिक शुद्धतेची जोड नाही त्याला 'कायक' मानता येत नाही.\n\nमनातील आशा किंवा लोभ हेच जन्म-मृत्यूच्या सांसारिक बंधनाचे मूळ कारण आहे, तर कोणत्याही फळाची किंवा संचयाची हाव न ठेवता निरिच्छ वृत्तीने जगणे हीच खरी नित्यमुक्ती आहे.\n\nउरिलिंगपेद्दिगळरस या परमतत्त्वाच्या सान्निध्यात राहण्याचा मार्ग हा वरवरचा किंवा सोपा नसून, त्यासाठी सत्यशुद्ध श्रम आणि पूर्णतः निरिच्छ वृत्तीची कठोर साधना आवश्यक आहे, हेच या वचनातून अधोरेखित होते.","fr":"Ce vachana met en lumière le lien indissociable entre la dévotion authentique et la pratique du Kayaka, affirmant que nul ne peut être considéré comme un véritable dévot s'il ne s'engage pas dans un travail actif et concret.\n\nIl précise toutefois que le labeur ne mérite le nom de Kayaka que s'il est accompli dans une vérité et une pureté absolues, exemptes de toute malhonnêteté.\n\nSur le plan spirituel, le texte établit un contraste fondamental entre le désir ou la convoitise, qui constitue la semence même du cycle des existences mondaines, et l'absence de désir, qui représente la libération éternelle.\n\nEnfin, à travers la signature spirituelle Urilingapeddigalarasa, dédiée à la Réalité suprême sans forme, ce vachana avertit que cette voie d'intégrité et de détachement est d'une haute exigence et ne saurait être prise à la légère."}},{"no":1299,"o":"ತೂಬರದ ಕೊಳ್ಳಿಯಂತೆ ಉರಿವಾತ ಭಕ್ತನೆ?\n ಹುಸಿದು ತಂದು ಮಾಡುವಾತ ಭಕ್ತನೆ?\n ಭಕ್ತರ ಕುಲವನೆತ್ತಿ ನಿಂದಿಸುವಾತ ಭಕ್ತನೆ?\n ನಿಂದಯಾ ಶಿವಭಕ್ತಾನಾಂ ಕೋಟಿಜನ್ಮನಿ ಸೂಕರಃ\nಸಪ್ತಜನ್ಮನಿ ಭವೇತ್ ಕುಷಿ ದಾಸೀಗರ್ಭೇಷು ಜಾಯತೆ||\n ಎಂದುದಾಗಿ, ತನ್ನ ಪ್ರಾಣದ ಮೇಲೆ ಬಂದಡೂ ಬರಲಿ, ಇವರ ಬಿಡಬೇಕು.\n ಬಿಡದಿರಲು ಉರಿಲಿಂಗಪೆದ್ದಿಗಳರಸನೊಲ್ಲನವ್ವಾ.","t":{"en":"Is one who burns like a brand of *tūbara* wood a devotee?\nIs one who brings by falsehood and makes offerings a devotee?\nIs one who drags up and slanders the caste of devotees a devotee?\nBy slandering the devotees of Shiva, one becomes a pig for a crore of births;\nfor seven births one becomes a leper, and is born in the wombs of bondmaids.\nSince it is said thus, even if it costs one's own life, let it come—one must forsake such people.\nIf one does not forsake them, Urilingapeddigalarasa will not approve, O Mother.","hi":"तेंदू की जलती लकड़ी के समान सुलगनेवाला क्या भक्त है?\nझूठ बोलकर लाकर अर्पण करनेवाला क्या भक्त है?\nभक्तों का कुल उछालकर निंदा करनेवाला क्या भक्त है?\nशिवभक्तों की निंदा करने से कोटि जन्मों में सूकर होता है,\nसात जन्मों तक कुष्ठी होता है और दासी के गर्भ में जन्म लेता है—\nऐसा कहा गया है, इसलिए अपने प्राणों पर आ बने तो भी आ बने, इन्हें छोड़ना चाहिए।\nन छोड़ने पर उरिलिंगपेद्दि के स्वामी प्रसन्न नहीं होते, हे माँ।","mr":"टेंभूर्णीच्या कोलित्याप्रमाणे जळणारा तो भक्त आहे का?\nखोटे बोलून कमावून आणून अर्पण करणारा तो भक्त आहे का?\nभक्तांची जात काढून निंदा करणारा तो भक्त आहे का?\nशिवभक्तांच्या निंदेमुळे कोटी जन्मांत डुक्कर होतो,\nसात जन्मांत कुष्ठरोगी होतो आणि दासीच्या पोटी जन्म घेतो॥\nअसे म्हटले असल्यामुळे, आपल्या प्राणावर बेतले तरी बेतू दे, अशा लोकांना सोडून द्यायला हवे.\nन सोडल्यास उरिलिंगपेद्दीगळरस स्वीकारणार नाही, हे माते.","fr":"Celui qui brûle comme un tison de bois d'ébène est-il un dévot ?\nCelui qui amasse par le mensonge pour faire ses offrandes est-il un dévot ?\nCelui qui évoque la lignée des dévots pour les calomnier est-il un dévot ?\nPar la calomnie des dévots de Shiva, on devient un porc durant dix millions de vies,\npendant sept vies on est atteint de la lèpre et l'on naît du ventre de servantes.\nPuisqu'il est dit ainsi, même s'il doit en coûter la vie, il faut abandonner de tels gens.\nSi on ne les abandonne pas, Urilingapeddigalarasa n'acceptera point cela, ô mère."},"m":{"en":"The central message of this Vachana is that true spiritual devotion cannot coexist with fiery anger, dishonest means of earning, or caste-based contempt.\n\nThrough rhetorical questions, the Vachana rejects the claim to devotion of anyone who burns with rage like a smoldering firebrand, performs religious service using wealth acquired through deceit, or insults fellow devotees by dragging up their birth and caste.\n\nCiting a Sanskrit verse that warns of severe consequences across countless births for those who slander Shiva's devotees, the Vachana emphasizes how deeply destructive caste prejudice and slander are to the Sharana ideal of equality.\n\nTherefore, even at the cost of one's own life, one must completely shun the company of such false and abusive people, as the Formless Supreme Consciousness addressed as Urilingapeddigalarasa will never accept anyone who fails to renounce them.","hi":"इस वचन का केंद्रीय भाव यह है कि जो व्यक्ति भीतर ही भीतर क्रोध में जलता रहता है, झूठ बोलकर आजीविका कमाता है और अर्पित करता है, या अन्य भक्तों की जाति व कुल को लेकर उनकी निंदा करता है, वह सच्चा भक्त नहीं हो सकता।\n\nवचन में एक पारंपरिक संस्कृत श्लोक के माध्यम से यह गंभीर चेतावनी दी गई है कि सच्चे भक्तों की निंदा करने वाला व्यक्ति करोड़ों जन्मों तक सूअर, सात जन्मों तक कुष्ठरोगी और दासी के गर्भ से जन्म लेने के समान अधोगति को प्राप्त होता है।\n\nअतः यह वचन स्पष्ट करता है कि यदि प्राणों का संकट भी आ पड़े, तब भी ऐसे मिथ्याचारी और निंदक लोगों का संग तुरंत त्याग देना चाहिए।\n\nइस वचन का आध्यात्मिक महत्व यह है कि ऐसे कलुषित आचरण और संगति का त्याग किए बिना उरिलिंगपेद्दिगलरस के रूप में संबोधित निराकार परमतत्त्व की स्वीकृति और प्रसन्नता प्राप्त नहीं हो सकती।","mr":"हे वचन स्पष्ट करते की, तोंडाने उगीच जळत्या कोलितासारखा रागावणारा, खोटे बोलून धन कमावणारा आणि सेवा किंवा अर्पण करणारा, तसेच इतर भक्तांच्या कुळाची निंदा करणारा माणूस कधीही खरा भक्त होऊ शकत नाही.\n\nशिवभक्तांची निंदा करणाऱ्यांना कोटी जन्म डुकराचा, सात जन्म कुष्ठरोग्याचा आणि दासीच्या पोटी जन्म घ्यावा लागतो, या पारंपरिक वचनाचा संदर्भ देऊन भक्तांच्या निंदेची आणि जातीय अहंकाराची तीव्र निंदा येथे केली आहे.\n\nशरण तत्त्वज्ञानानुसार भक्तीमध्ये प्रामाणिकपणा, विनम्रता आणि सर्व भक्तांप्रती समानतेची भावना असणे आवश्यक आहे; जिथे क्रोध, असत्य आणि कुळाचा भेदभाव असतो तिथे खरी भक्ती नांदू शकत नाही.\n\nम्हणूनच, जिवावर बेतले तरी अशा ढोंगी आणि निंदक प्रवृत्तीच्या लोकांची संगत तात्काळ सोडली पाहिजे, कारण त्यांचा त्याग केल्याशिवाय 'उरिलिंगपेद्दिगळरस' या नावाने ओळखले जाणारे निराकार परमतत्त्व कधीही प्रसन्न होत नाही.","fr":"Ce vachana définit l'éthique fondamentale du véritable dévot (Bhakta) en rejetant trois fautes graves : la colère destructrice, comparée à un tison de bois d'ébène en flammes, le service accompli avec des biens acquis par la tromperie et le mensonge, ainsi que le dénigrement des autres chercheurs spirituels en raison de leur caste ou de leurs origines.\n\nS'appuyant sur un adage sanskrit traditionnel pour souligner la gravité spirituelle du mépris envers les dévots de Shiva — une offense symboliquement associée à des renaissances avilissantes et douloureuses —, le texte affirme l'égalité absolue au sein de la communauté des Sharanas, où toute discrimination sociale est une trahison de la vérité spirituelle.\n\nLa portée spirituelle de ce vachana réside dans l'exigence d'une intégrité morale sans compromis : même au péril de sa propre vie, l'aspirant sincère doit s'éloigner résolument de ceux qui pratiquent le mensonge, la colère et le mépris de caste.\n\nSans ce détachement radical vis-à-vis de l'hypocrisie et des préjugés sociaux, il est impossible d'être en harmonie avec la Réalité suprême sans forme, désignée ici sous le nom d'Urilingapeddigalarasa."}},{"no":1300,"o":"ಭಾಗ್ಯವುಳ್ಳ ಪುರುಷಂಗೆ\n ಕಾಮಧೇನು ಕಾಮಿಸಿದುದನೀವುದಯ್ಯಾ,\n ನಿರ್ಭಾಗ್ಯ ಪುರುಷಂಗೆ\n ಕಾಮಧೇನು ತುಡುಗುಣಿಯಾಗಿ ತೋರುವುದಯ್ಯಾ.\n ಸತ್ಯಪುರುಷಂಗೆ\n ಕಲ್ಪವೃಕ್ಷ ಕಲ್ಪಿಸಿದುದನೀವುದಯ್ಯಾ,\n ಅಸತ್ಯಪುರುಷಂಗೆ\n ಕಲ್ಪವೃಕ್ಷ ಬೊಬ್ಬುಲಿಯಾಗಿ ತೋರುವುದಯ್ಯಾ.\n ಧರ್ಮಪುರುಷಂಗೆ\n ಚಿಂತಾಮಣಿ ಚಿಂತಿಸಿದುದನೀವುದಯ್ಯಾ,\n ಅಧರ್ಮ ಪುರುಷಂಗೆ\n ಚಿಂತಾಮಣಿ ಗಾಜಿನ ಮಣಿಯಾಗಿ ತೋರುವುದಯ್ಯಾ.\n ಶ್ರೀಗುರು ಕಾರುಣ್ಯವುಳ್ಳ ಸದ್ಭಕ್ತಂಗೆ\n ಜಂಗಮ ಲಿಂಗವಾಗಿ ತೋರುವುದಯ್ಯಾ,\n ಭಕ್ತನಲ್ಲದ ಪಾಪಿಷ್ಠಂಗೆ ಜಂಗಮಲಿಂಗ\n ಮಾನವನಾಗಿ ತೋರುವುದಯ್ಯಾ,\n ಉರಿಲಿಂಗಪೆದ್ದಿಗಳರಸ ಒಲ್ಲನವ್ವಾ.","t":{"en":"To a fortunate man,\nKamadhenu grants whatever is desired, O sir;\nto an unfortunate man,\nKamadhenu appears as a stray rogue cow, O sir.\nTo a truthful man,\nKalpavriksha grants whatever is imagined, O sir;\nto an untruthful man,\nKalpavriksha appears as a thorny babul tree, O sir.\nTo a righteous man,\nChintamani grants whatever is thought of, O sir;\nto an unrighteous man,\nChintamani appears as a bead of glass, O sir.\nTo a true devotee blessed with the grace of the revered Guru,\nthe *Jangama* appears as *Linga*, O sir;\nto a wicked person who is not a devotee, the *Jangamalinga*\nappears as a mere human, O sir—\nUrilingapeddigalarasa will not accept him, O mother.","hi":"भाग्यवान पुरुष को\nकामधेनु इच्छित फल देती है, हे भाई,\nअभागे पुरुष को\nकामधेनु आवारा गाय के रूप में दिखती है, हे भाई।\nसत्यपुरुष को\nकल्पवृक्ष कल्पित फल देता है, हे भाई,\nअसत्यपुरुष को\nकल्पवृक्ष बबूल के पेड़ के रूप में दिखता है, हे भाई।\nधर्मपुरुष को\nचिंतामणि चिंतित फल देती है, हे भाई,\nअधर्मपुरुष को\nचिंतामणि काँच की मणि के रूप में दिखती है, हे भाई।\nश्रीगुरु की करुणावाले सद्भक्त को\nजंगम लिंग के रूप में दिखते हैं, हे भाई,\nजो भक्त नहीं है उस पापी को जंगमलिंग\nसाधारण मनुष्य के रूप में दिखते हैं, हे भाई,\nउरिलिंगपेद्दि के स्वामी उसे स्वीकार नहीं करते, हे माँ।","mr":"भाग्यवान पुरुषाला\nकामधेनू इच्छिलेले देते, अहो,\nअभागी पुरुषाला\nकामधेनू उनाड गाईसारखी दिसते, अहो।\nसत्यपुरुषाला\nकल्पवृक्ष कल्पिलेले देतो, अहो,\nअसत्यपुरुषाला\nकल्पवृक्ष बाभळीसारखा दिसतो, अहो।\nधर्मपुरुषाला\nचिंतामणी चिंतिलेले देतो, अहो,\nअधर्मपुरुषाला\nचिंतामणी काचेच्या मण्यासारखा दिसतो, अहो।\nश्रीगुरूंची करुणा लाभलेल्या सद्भक्ताला\nजंगम लिंग म्हणून दिसतो, अहो,\nभक्त नसलेल्या पापिष्ठाला जंगमलिंग\nमानव म्हणून दिसतो, अहो,\nउरिलिंगपेद्दिगळरस त्याला स्वीकारत नाही, हे माते।","fr":"À l'homme fortuné,\nKamadhenu accorde ce qu'il désire, ô Seigneur ;\nà l'homme infortuné,\nKamadhenu apparaît comme une vache vagabonde, ô Seigneur.\nÀ l'homme de vérité,\nKalpavriksha accorde ce qu'il conçoit, ô Seigneur ;\nà l'homme de fausseté,\nKalpavriksha apparaît comme un acacia épineux, ô Seigneur.\nÀ l'homme de droiture,\nChintamani accorde ce à quoi il pense, ô Seigneur ;\nà l'homme sans droiture,\nChintamani apparaît comme une perle de verre, ô Seigneur.\nAu vrai dévot qui possède la grâce du vénérable Gourou,\nle Jangama apparaît comme le Linga, ô Seigneur ;\nau pécheur qui n'est pas un dévot, le Jangama-Linga\napparaît comme un simple être humain, ô Seigneur ;\nUrilingapeddigalarasa ne l'agrée point, ô mère."},"m":{"en":"The central message of this Vachana is that one's perception of spiritual truth depends entirely on one's inner worthiness, integrity, and readiness to receive the Guru's grace.\n\nThrough mythological metaphors, the Vachana illustrates how the wish-fulfilling cow Kamadhenu appears as a stray rogue cow to the unfortunate, the wish-granting Kalpavriksha tree seems like a worthless thorny bush to the untruthful, and the precious Chintamani gem looks like a mere piece of glass to the unrighteous.\n\nSimilarly, to a true devotee blessed with the Guru's grace, the Jangama—an enlightened spiritual seeker and guide—is perceived directly as the living embodiment of the Divine (Linga), whereas an unspiritual person sees the Jangama as nothing more than an ordinary human being.\n\nConcluding with the ankitanama Urilingapeddigalarasa, the Vachana emphasizes that the Formless Supreme Reality does not accept those who lack the inner purity and devotion required to recognize the sacred within the living spiritual guide.","hi":"यह वचन स्पष्ट करता है कि किसी भी उच्च और पवित्र तत्व का अनुभव मनुष्य की अपनी आंतरिक पात्रता, सत्यनिष्ठा और आध्यात्मिक दृष्टि पर निर्भर करता है।\n\nपौराणिक और सांस्कृतिक प्रतीकों के माध्यम से यहाँ समझाया गया है कि जिस प्रकार कामधेनु, कल्पवृक्ष और चिंतामणि केवल भाग्यवान, सत्यवादी और धर्मनिष्ठ व्यक्ति की ही मनोकामनाएँ पूर्ण करते हैं, परंतु अभागे, असत्यवादी और अधर्मी व्यक्ति को वे क्रमशः एक उपद्रवी गाय, साधारण बबूल के पेड़ और काँच के टुकड़े जैसे तुच्छ दिखाई देते हैं।\n\nउसी प्रकार, जिस सच्चे भक्त पर श्रीगुरु की कृपा होती है, उसे आध्यात्मिक ज्ञान का प्रसार करने वाले त्यागी और प्रबुद्ध साधक रूपी जंगम में साक्षात् निराकार परमतत्त्व के प्रतीक लिंग के दर्शन होते हैं।\n\nइसके विपरीत, भक्तिहीन और पापी मनुष्य को वही जंगम केवल एक साधारण मानव के रूप में दिखाई देता है, तथा उरिलिंगपेद्दिगळरस के रूप में संबोधित परम सत्य को ऐसे अज्ञानी व अपात्र व्यक्ति कभी स्वीकार्य नहीं होते।","mr":"या वचनाचा मुख्य आशय असा आहे की, कोणत्याही दिव्य गोष्टीचे खरे स्वरूप ओळखण्याची क्षमता ही माणसाच्या आंतरिक पात्रतेवर, सत्यनिष्ठेवर आणि शुद्ध भावावर अवलंबून असते.\n\nज्याप्रमाणे कामधेनू, कल्पवृक्ष आणि चिंतामणी हे केवळ भाग्यवान, सत्यवान आणि धर्मनिष्ठ व्यक्तींच्याच इच्छा पूर्ण करतात, तर अभागी, असत्यवादी आणि अधर्मी लोकांना ते अनुक्रमे उपद्रवी गाय, काटेरी बाभळीचे झाड आणि साधा काचेचा मणी वाटतात, या प्रतीकात्मक दृष्टांतांतून मानवी दृष्टिकोनातील हा मोठा फरक स्पष्ट केला आहे.\n\nत्याचप्रमाणे, ज्याच्यावर श्रीगुरूंची कृपा आहे अशा सच्च्या भक्तालाच आध्यात्मिक ज्ञान पसरवणाऱ्या प्रबुद्ध जंगमामध्ये साक्षात लिंगतत्त्वाचे म्हणजेच परमतत्त्वाचे दर्शन होते; परंतु भक्ती नसलेल्या पापी माणसाला मात्र तो जंगम केवळ एक सामान्य माणूस वाटतो.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, आंतरिक शुद्धी आणि गुरुकृपेच्या दृष्टीशिवाय जंगमातील दिव्य चैतन्याची ओळख पटत नाही, आणि अशा अज्ञानी व अभक्त वृत्तीचा उरिलिंगपेद्दिगळरस हे परमतत्त्व कधीही स्वीकार करत नाही.","fr":"Ce vachana met en lumière le fait que la perception d'une réalité sacrée dépend entièrement de la disposition intérieure et de la droiture de celui qui la regarde.\n\nPour illustrer cette vérité, le texte recourt aux symboles mythologiques de la vache Kamadhenu, de l'arbre Kalpavruksha et du joyau Chintamani, qui exaucent tous les vœux de l'homme fortuné, véridique et juste, mais n'apparaissent respectivement que comme une bête farouche, un buisson épineux ou une simple bille de verre aux yeux de l'être infortuné, menteur et injuste.\n\nDe la même manière, pour le dévot authentique éclairé par la grâce du Guru, le Jangama — le maître spirituel éveillé — se révèle comme le Linga lui-même, c'est-à-dire la présence manifestée du Principe suprême, tandis que l'homme dépourvu de dévotion ne voit en lui qu'un simple mortel.\n\nÀ travers la signature spirituelle Urilingapeddigalarasa, qui désigne la Réalité suprême sans forme, le poème conclut que la Conscience absolue demeure étrangère à ceux qui, aveuglés par leurs propres défauts, sont incapables de reconnaître la dimension sacrée incarnée dans le Jangama."}}]},
{"id":"s8","n":{"en":"Ambigara Chowdayya","hi":"अंबिगर चौडय्या","mr":"अंबिगर चौडय्या","fr":"Ambigara Chowdayya"},"v":[{"no":1380,"o":"ಅಡವಿಯ ಹೊಗಿಸಿತ್ತು,\n ಹುಡುಕುನೀರಲದ್ದಿತ್ತು,\n ಜಡೆಗಟ್ಟಿ ಭಸ್ಮವ ತೊಡೆಸಿತ್ತು,\n ಉಡೆವುಚ್ಚುಗೊಳಿಸಿತ್ತು,\n ಹಿಡಿದೊತ್ತಿ ಕೇಶವ ಕೀಳಿಸಿತ್ತು,\n ಪಡಿಪುಚ್ಚಗೊಳಿಸಿತ್ತು ಊರೊಳಗೆಲ್ಲ.\n ಈ ಬೆಡಗಿನ ಮಾಯೆಯ\n ಬಡಿಹಾರಿ ಸಮಯಿಗಳ ನುಡಿಗೆ\n ನಾಚುವೆನೆಂದನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"It made them enter the forest,\nit plunged them into sought-out waters,\nit matted their locks and made them smear sacred ash,\nit stripped them of their clothes,\nit held them down and made them pluck out their hair,\nit reduced them to mockery throughout the town.\nAt the words of the shameless sectarians\nof this deceptive *Maya*,\nI feel ashamed, said Ambigara Chowdayya.","hi":"जंगल में प्रवेश कराया,\nगंदले पानी में डुबाया,\nजटा बँधवाकर भस्म पोतवाया,\nवस्त्र उतरवाकर नग्न कराया,\nपकड़-दबाकर केश नोचवाए,\nगाँव-भर में दुर्दशा कराई।\nइस अनूठी माया के,\nइन कुलटा मतवादियों की बातों पर\nलजाता हूँ, कहा अंबिग चौडय्या ने।","mr":"तिने रानात शिरण्यास लावले,\nडबक्याच्या पाण्यात बुडवले,\nजटा बांधून भस्म फासण्यास लावले,\nनग्न करून सोडले,\nदाबून धरून केस उपटून काढण्यास लावले,\nगावागावात दुर्दशा करून फजिती केली।\nया चकवणाऱ्या मायेच्या\nभोंदू पंथीयांच्या बोलण्याची\nमला लाज वाटते, असे अंबिग चौडय्या म्हणाला।","fr":"Elle a fait pénétrer dans la forêt,\nelle a plongé dans les eaux que l'on recherche,\nelle a fait nouer des tresses emmêlées et enduire le corps de cendre,\nelle a fait dépouiller de tout vêtement,\nelle a fait saisir, presser et arracher les cheveux,\nelle a réduit à la risée dans toute la ville.\nDevant les paroles des sectaires vénaux\npris dans cette Maya pleine d'artifices,\nj'éprouve de la honte, dit Ambigara Chowdayya."},"m":{"en":"This Vachana critiques the deceptive nature of Maya (worldly illusion) that drives people toward extreme, bodily-focused asceticism in the name of spirituality.\n\nIt exposes how various sects mislead seekers into retreating to forests, immersing themselves in water, matting their hair, smearing ash, abandoning clothes, forcibly plucking out their hair, and wandering around towns begging for alms.\n\nThrough his spiritual signature, Ambigara Choudayya expresses deep embarrassment at the hollow claims of such sectarian dogmatists who mistake these outward, self-mortifying rituals for genuine spiritual realization.\n\nUltimately, the Vachana rejects performative renunciation and physical torment, pointing toward the Sharana view that true inner awareness cannot be achieved by merely altering or punishing the external body.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिकता के नाम पर किए जाने वाले बाह्य आडंबर, कठोर शारीरिक यातनाएं और विचित्र वेशभूषाएं केवल भ्रामक माया का जाल हैं।\n\nयह वचन स्पष्ट करता है कि इसी आकर्षक माया के प्रभाव में आकर विभिन्न मत-पंथों के अनुयायी जंगल में भटकना, कीचड़ या जल में डुबकी लगाना, जटाएं बढ़ाकर भस्म रमाना, वस्त्र त्यागकर नग्न घूमना और सिर के बाल नोचने जैसे निरर्थक कृत्य करते हैं।\n\nऐसे बाहरी दिखावों और देह-दंड के कारण मनुष्य वास्तविक सत्य को पाने के बजाय पूरे समाज में केवल उपहास का पात्र बनकर रह जाता है।\n\nअंबिग चौडय्या के अंकितांकित इस वचन का आध्यात्मिक महत्व यह है कि यह विभिन्न संप्रदायों के ऐसे पाखंडपूर्ण आचरण और खोखली बातों को लज्जाजनक मानता है तथा बाह्य आडंबरों से मुक्त सहज विवेक की ओर संकेत करता है।","mr":"अंबिगर चौडय्या यांच्या या वचनात आध्यात्मिक मुक्तीच्या नावाखाली केल्या जाणाऱ्या बाह्य आणि देहदंडनात्मक साधनांवर परखड भाष्य केले आहे.\n\nवनात जाणे, चिखलाच्या किंवा डबक्यातल्या पाण्यात बुड्या मारणे, जटा वाढवून भस्म फासणे, वस्त्रत्याग करणे किंवा केस उपटून घेणे यांसारख्या गोष्टी म्हणजे केवळ भुरळ घालणाऱ्या मायेचा खेळ आहे, असे हे वचन स्पष्ट करते.\n\nअशा प्रकारच्या अघोरी आणि देखाव्याच्या आचरणामुळे माणसाची गावभर केवळ फजिती आणि हास्यास्पद अवस्था होते, त्यातून कोणतीही खरी आध्यात्मिक जागृती साध्य होत नाही.\n\nमायेच्या आहारी गेलेल्या अशा संप्रदायवाद्यांच्या निरर्थक आणि दांभिक बोलण्याची आपल्याला लाज वाटते, असे सांगून हे वचन बाह्य अवडंबराचा स्पष्टपणे नकार करते.","fr":"Ce vachana dénonce avec vigueur les austérités corporelles extrêmes et les pratiques ascétiques purement extérieures imposées au nom de la spiritualité.\n\nIl décrit comment l'illusion trompeuse (Maya) pousse les chercheurs égarés à se retirer dans les forêts, à plonger dans les eaux, à porter des cheveux emmêlés et de la cendre, à renoncer aux vêtements ou à s'arracher les cheveux, faisant d'eux un objet de dérision à travers toute la ville.\n\nÀ travers la signature d'Ambigara Chowdayya, le texte exprime une profonde honte face aux discours hypocrites et vains des sectaires qui, soumis à ce mirage séduisant, confondent ces mortifications spectaculaires avec la véritable réalisation intérieure."}},{"no":1381,"o":"ಅಡವಿಯೊಳಗರಸುವಡೆ ಸಿಡಿಗಂಟಿ ತಾನಲ್ಲ.\n ಮಡುವಿನೊಳಗರಸುವಡೆ ಮತ್ಸ್ಯಮಂಡೂಕನಲ್ಲ.\n ತಪಂಬಡುವಡೆ ವೇಷಕ್ಕೆ ವೇಳೆಯಲ್ಲ.\n ಒಡಲ ದಂಡಿಸುವಡೆ ಕೊಡುವ ಸಾಲಿಗನಲ್ಲ.\n ಅಷ್ಟತನುವಿನೊಳಗೆ ಹುದುಗಿದ್ದ ಲಿಂಗವ\n ನಿಲುಕಿ ನೋಡಿಯೆ ಕಂಡನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"If you seek Him in the forest, He is not a thorny bush.\nIf you seek Him in a deep pool, He is neither fish nor frog.\nIf you undergo penance, it is no time for outward disguise.\nIf you torment the body, He is not a moneylender who pays upon coercion.\nReaching within and beholding the *Linga* hidden in the eightfold body,\nAmbigara Chowdayya saw Him.","hi":"वन में खोजने के लिए वह काँटेदार झाड़ी नहीं है।\nजलाशय में खोजने के लिए वह मत्स्य-मंडूक नहीं है।\nतप करने के लिए यह स्वाँग रचने का समय नहीं है।\nकाया को दंडित करने के लिए वह कोई सूदखोर नहीं है।\nअष्टतनु के भीतर छिपे हुए लिंग को,\nभीतर झाँककर देखा और पा लिया अंबिग चौडय्या ने।","mr":"अरण्यात शोधावे, तर तो काटेरी झुडूप नाही.\nडोहात शोधावे, तर तो मासा किंवा बेडूक नाही.\nतप करावे, तर ती वेषाची वेळ नाही.\nशरीराला दंडित करावे, तर तो कर्जवसुली करणारा सावकार नाही.\nअष्टतनूच्या आत दडलेल्या लिंगाला\nअंबिग चौडय्याने पोहोचून, पाहूनच जाणले.","fr":"Pour le chercher dans la forêt, il n'est pas un buisson épineux.\nPour le chercher dans l'étang profond, il n'est ni poisson ni grenouille.\nPour s'adonner à l'ascèse, ce n'est pas le moment pour un déguisement.\nPour mortifier le corps, il n'est pas un créancier qui prête.\nLe Linga qui était caché au sein du corps octuple,\nAmbigara Chowdayya l'a atteint du regard et l'a vu."},"m":{"en":"This Vachana by Ambigara Choudayya critiques the misconception that the Supreme Reality can be found through external wandering, ascetic disguises, or extreme physical mortification.\n\nThrough vivid comparisons, it points out that the Absolute is neither a wild thorny bush hidden in the forest to be hunted down, nor an aquatic creature like a fish or frog dwelling in deep waters.\n\nSimilarly, the Divine is not impressed by outward spiritual garbs, nor is it a moneylender who yields only when the physical body is punished and tortured.\n\nInstead, the Vachana emphasizes that the Divine Principle (Linga) resides latently within the eightfold constitution of one's own being, and true realization occurs only by turning one's awareness inward to perceive this inner presence.","hi":"इस वचन का केंद्रीय भाव यह है कि निराकार परमतत्त्व की प्राप्ति बाह्य स्थानों की खोज या कठोर शारीरिक तपस्या से नहीं, बल्कि आत्म-साक्षात्कार से होती है।\n\nवचन में यह स्पष्ट किया गया है कि परम सत्य न तो जंगल में ढूँढे जाने वाली कोई कँटीली झाड़ी है और न ही गहरे जल में रहने वाली मछली या मेंढक की तरह कोई बाहरी जीव है।\n\nयहाँ बाह्य भेष धारण कर तपस्या करने को निरर्थक बताया गया है और यह समझाया गया है कि परमात्मा कोई साहूकार नहीं है, जिसे शरीर को कष्ट देकर ऋण चुकाने की तरह संतुष्ट किया जा सके।\n\nअंबिग चौडय्या के आध्यात्मिक हस्ताक्षर से युक्त यह वचन दर्शाता है कि वह लिंग-तत्त्व अष्टतनु रूपी हमारे अस्तित्व के भीतर ही निहित है, जिसे केवल अंतर्दृष्टि से अपने भीतर झाँककर ही अनुभव किया जा सकता है।","mr":"या वचनात बाह्य तपस्या आणि शरीरदंडनाला नकार देऊन, परमतत्त्वाचा शोध आपल्या अंतर्यामी घेण्याचे महत्त्व स्पष्ट केले आहे.\n\nपरम सत्य हे रानावनात शोधण्यासारखी एखादी जंगली वनस्पती नाही किंवा डोहाच्या पाण्यात सापडणाऱ्या मासा-बेडकासारखा जलचरही नाही.\n\nकेवळ बाह्य वेष धारण करून तपस्या करणे म्हणजे काळाचा अपव्यय आहे, आणि शरीराला कष्ट देऊन परमतत्त्व प्राप्त होईल असे मानणे चुकीचे आहे; कारण परमात्मा हा काही शरीराला छळल्यामुळे फळ देणारा सावकार नव्हे.\n\nअंबिग चौडय्य या वचनातून असे स्पष्ट करतात की, आपल्या अष्टतनूमध्येच (पंचमहाभूते, मन, बुद्धी आणि अहंकार यांनी बनलेल्या अस्तित्वात) दडलेल्या त्या लिंगतत्त्वाला, म्हणजेच निराकार शुद्ध चैतन्याला केवळ अंतर्मुख होऊन आणि आत्मनिरीक्षणाच्या दृष्टीनेच अनुभवता येते.","fr":"Ce vachana rejette la quête extérieure de la Réalité suprême sans forme à travers l'errance ascétique et les austérités infligées au corps.\n\nIl souligne que le Principe absolu ne se cache ni dans les forêts comme une herbe rare, ni dans les eaux profondes à la manière des poissons ou des grenouilles.\n\nIl ne s'obtient pas non plus par des déguisements pénitentiels ou par la mortification physique, comme s'il s'agissait d'un créancier exigeant que l'on se tourmente soi-même.\n\nPortant la signature spirituelle Ambiga Chowdayya, ce poème révèle que le Linga, pure conscience divine, réside au cœur même du corps constitué des huit éléments et ne se dévoile qu'à celui qui plonge son regard vers l'intérieur."}},{"no":1382,"o":"ಅತ್ಯಾಹಾರವನುಂಡು ಹೊತ್ತುಗಳೆದು\n ಹೋಕಿನ ಮಾತನಾಡುತ್ತ,\n ಚಿತ್ತ ಬಂದ ಪರಿಯಲ್ಲಿ ವ್ಯವಹರಿಸಿಕೊಳ್ಳುತ್ತ,\n ಮತ್ತೆ ಶಿವನ ನೆನೆದೆನೆಂದಡೆ ಶಿವನ ವರ ಎತ್ತಲೆಂದರಿಯದೆಂದಾತ,\n ನಮ್ಮಂಬಿಗರ ಚೌಡಯ್ಯ.","t":{"en":"Having eaten to excess and idled away the time,\nspeaking vain words,\nconducting oneself in whatever way the mind fancies,\nif one then says, I have remembered Shiva, it cannot be known where Shiva's grace lies—so said\nour Ambigara Chowdayya.","hi":"अति-आहार खाकर समय बिताकर,\nव्यर्थ की बातें करते हुए,\nचित्त में आए ढंग से व्यवहार करते हुए,\nफिर 'मैंने शिव का स्मरण किया' कहने पर, शिव का वर कहाँ है यह जाना नहीं जा सकता, ऐसा कहा\nहमारे अंबिगर चौडय्या ने।","mr":"अतिआहार सेवन करून वेळ घालवत,\nनिरर्थक बडबड करत,\nमनाला येईल त्या रीतीने वागत,\nआणि पुन्हा शिवाला स्मरले असे म्हटले तरी शिवाचा वर कोठून मिळेल हे कळणार नाही, असे म्हणाले,\nआमचे अंबिगर चौडय्या.","fr":"Après avoir mangé à l'excès et gaspillé le temps,\nen tenant des propos vains,\nen se comportant au gré des caprices de l'esprit,\nsi l'on dit ensuite : « Je me suis souvenu de Shiva », on ne saurait où se trouve la grâce de Shiva — ainsi l'a dit\nnotre Ambigara Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya exposes the hypocrisy of claiming spiritual devotion while leading an undisciplined and indulgent life.\n\nIt critiques those who overeat, waste their time in idle gossip, and act merely according to the whims of an unrestrained mind.\n\nIf such people still claim to remember Shiva, their devotion remains empty and disconnected from the discipline of genuine inner awareness.\n\nBearing his distinctive signature, Ambigara Choudayya, the Vachana makes it clear that the grace of the Supreme Reality cannot be attained through mere lip service without restraint in conduct and thought.","hi":"इस वचन का केंद्रीय भाव यह है कि आत्मानुशासन और सजग आचरण के बिना केवल ऊपरी तौर पर परमतत्त्व का स्मरण करने का दावा करना पूर्णतः निरर्थक है।\n\nजो व्यक्ति आवश्यकता से अधिक भोजन कर समय नष्ट करता है, व्यर्थ की अनर्गल बातें करता है और अपने मन की मनमानी इच्छाओं के अनुसार व्यवहार करता है, उसका जीवन духовिक साधना के अनुकूल नहीं होता।\n\nऐसे असंयमित और स्वच्छंद आचरण के बावजूद यदि कोई यह कहे कि उसने शिव अर्थात् निराकार परमतत्त्व का स्मरण किया है, तो उसे उस परम सत्य की कृपा या वास्तविक अनुभूति कैसे प्राप्त हो सकती है।\n\nअंबिगर चौडय्या के इस वचन का आध्यात्मिक महत्व यह स्पष्ट करना है कि इंद्रिय-संयम, सार्थक वाणी और मर्यादित आचरण के अभाव में किया गया स्मरण कोरा दिखावा मात्र है।","mr":"हे वचन स्पष्ट करते की, आहारावर आणि इंद्रियांवर संयम न ठेवता स्वैराचाराने वागणाऱ्या व्यक्तीचे आध्यात्मिक चिंतन पूर्णपणे निरर्थक असते.\n\nअतिरेकी भोजन करून, निरर्थक गप्पांमध्ये वेळ घालवत आणि मनाला वाटेल तसा अनिर्बंध व्यवहार करत राहणे हे साधनेच्या विसंगत आहे.\n\nअशा असंयमी जीवनशैलीत राहूनही आपण शिवतत्त्वाचे स्मरण करतो असा दावा करणाऱ्या व्यक्तीला परमतत्त्वाची कृपा आणि खरी अनुभूती कधीच प्राप्त होऊ शकत नाही, असा स्पष्ट इशारा अंबिगर चौडय्य या वचनातून देतात.","fr":
