और साध्य का भेद मिट जाता है।\n\nइस परम एकत्व की स्थिति में पहुँचने के पश्चात, फिर से किसी अलग सत्ता के रूप में उसका स्मरण करने की कोई आवश्यकता या संभावना ही नहीं रह जाती।","mr":"हे वचन साधक आणि निराकार परमतत्त्व यांच्यातील पूर्ण अद्वैत आणि विलीनीकरणाची अवस्था प्रभावी रूपकांच्या माध्यमातून स्पष्ट करते.\n\nकापराच्या पर्वताला आग लागल्यावर तिथे कोळसा उरत नाही, धुके किंवा बर्फाच्या मंदिराला उन्हाचा कळस चढवता येत नाही आणि निखाऱ्याच्या डोंगरावर लाखेचा बाण मारल्यास तो बाण परत शोधूनही सापडत नाही, कारण तो त्या अग्नीत पूर्णपणे वितळून एकरूप झालेला असतो.\n\nयाचप्रमाणे, 'गुहेश्वर' या नावाने ओळखल्या जाणाऱ्या शुद्ध चैतन्यस्वरूप लिंगाची एकदा का खऱ्या अर्थाने जाणीव झाली, की साधकाचे स्वतंत्र अस्तित्व आणि द्वैतभाव तिथेच पूर्णपणे विरून जातो.\n\nया परम सत्यात साधक स्वतःच विलीन झाल्यामुळे, तिथे पुन्हा वेगळेपणाने स्मरण करणारा किंवा ध्यान करणारा कोणी उरतच नाही, हा या वचनाचा मुख्य आध्यात्मिक आशय आहे.","fr":"Ce vachana illustre la dissolution totale de l'ego et de la conscience individuelle dans l'expérience de la Réalité suprême sans forme, invoquée ici sous la signature spirituelle de Guheshwara.\n\nÀ travers trois métaphores saisissantes — une montagne de camphre embrasée qui ne laisse aucun charbon, un temple de brume incapable de supporter un faîte de soleil, et une flèche de cire tirée sur une montagne de braises que l'on ne peut jamais retrouver — le texte montre comment le fini s'anéantit sans laisser de trace au contact de l'infini.\n\nDe même que ces éléments fragiles se consument entièrement dans le feu ou la lumière, l'esprit du chercheur spirituel perd toute existence séparée lorsqu'il réalise la Vérité absolue du Linga.\n\nDès lors que cette union parfaite est accomplie, la dualité entre celui qui connaît et ce qui est connu s'efface, rendant superflu et même impossible tout acte ultérieur de souvenir ou de pensée distincte.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నిరాకార పరమచైతన్యాన్ని అనుభవపూర్వకంగా తెలుసుకున్న తర్వాత సాధకునికి ప్రత్యేక ఉనికి గానీ, ద్వైత భావన గానీ మిగలవు.\n\nకర్పూరపు కొండకు నిప్పు అంటుకుంటే బొగ్గు మిగలనట్లు, మంచుతో కట్టిన గుడిపై ఎండ కలశం నిలవనట్లు, నిప్పుల కొండపైకి లక్క బాణాన్ని వేస్తే ఆ బాణాన్ని తిరిగి వెతకడం సాధ్యం కానట్లు ఈ ఐక్య స్థితి ఉంటుంది.\n\nఅదే విధంగా, గుహేశ్వర అనే పరమతత్త్వాన్ని ఎరుకతో దర్శించి అందులో లీనమైన తర్వాత, దానిని మళ్ళీ వేరుగా తలచుకోవడానికి \"నేను\" అనే భిన్నమైన భావన అసలు ఉండదని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಗುಹೇಶ್ವರಲಿಂಗವನ್ನು ಅರಿತು ಅದರಲ್ಲಿ ಒಂದಾದ ಮೇಲೆ, ಸಾಧಕನಿಗೆ ಪ್ರತ್ಯೇಕವಾದ ಅಸ್ತಿತ್ವವೇ ಉಳಿಯುವುದಿಲ್ಲ.\n\nಕರ್ಪೂರದ ಬೆಟ್ಟಕ್ಕೆ ಬೆಂಕಿ ಬಿದ್ದರೆ ಅಲ್ಲಿ ಇದ್ದಿಲು ಉಳಿಯಲು ಸಾಧ್ಯವಿಲ್ಲ, ಮಂಜಿನಿಂದ ಕಟ್ಟಿದ ಗುಡಿಗೆ ಬಿಸಿಲಿನ ಕಳಸವಿಡಲು ಆಗುವುದಿಲ್ಲ, ಹಾಗೆಯೇ ಉರಿಯುವ ಕೆಂಡದ ಬೆಟ್ಟಕ್ಕೆ ಮೇಣದ ಬಾಣವನ್ನು ಬಿಟ್ಟರೆ ಆ ಬಾಣವನ್ನು ಮತ್ತೆ ಹುಡುಕಿ ತರಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\nಈ ರೂಪಕಗಳ ಮೂಲಕ ವಚನವು ಏನನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ ಎಂದರೆ, ಅರಿವಿನ ಬೆಂಕಿಯಲ್ಲಿ ಸಾಧಕನ 'ನಾನು' ಎಂಬ ಅಹಂಕಾರ ಮತ್ತು ಪ್ರತ್ಯೇಕತೆಯ ಭಾವವು ಕರ್ಪೂರ, ಮಂಜು ಹಾಗೂ ಮೇಣದಂತೆ ಯಾವುದೇ ಕುರುಹು ಇಲ್ಲದೆ ಸಂಪೂರ್ಣವಾಗಿ ಕರಗಿಹೋಗುತ್ತದೆ.\n\nಹೀಗೆ ನಿರ್ಗುಣ ಚೈತನ್ಯವಾದ ಗುಹೇಶ್ವರಲಿಂಗದ ನಿಜಸ್ವರೂಪವನ್ನು ಅರಿತು ಅದರಲ್ಲೇ ಬೆರೆತುಹೋದ ನಂತರ, ಅದನ್ನು ಬೇರೆಂದು ಭಾವಿಸಿ ಮತ್ತೆ ನೆನೆಯುವ ಪ್ರಶ್ನೆಯೇ ಹುಟ್ಟುವುದಿಲ್ಲ ಎಂಬ ಅದ್ವೈತ ಅನುಭಾವವೇ ಇದರ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":494,"o":"ಕಬ್ಬು ಬೆಳೆವುದಯ್ಯ ಕರಿಯ ಭೂಮಿಯಿದ್ದಲ್ಲಿ,\n ಉಬ್ಬುಬ್ಬಿ ಬೆಳೆವುದಯ್ಯ ಬಲ ಪ್ರಮಾಣವಿರ್ದಲ್ಲಿ.\n ದಾರಿದ್ರ್ಯವಿದ್ದಲ್ಲಿ ನಿದ್ರೆ ಬೆಳೆವುದಯ್ಯ,\n ಜಟ್ಟಿ ಮಾಸಾಳರಿರ್ದಲ್ಲಿ ಕಾಳಗ ಘನವಪ್ಪುದಯ್ಯ,\n ನಮ್ಮ ಶಿವನ ಸಲೆ ಸಂದ ಶರಣರಾದ ಹಿರಿಯರಿದ್ದಲ್ಲಿ\n ಬುದ್ಧಿ ಬೆಳವುದಯ್ಯ.\n ಇ[ದ] ಕಂಡು ಬೆರಗಾದ ನಮ್ಮ ಗುಹೇಶ್ವರ.","t":{"en":"Sugarcane grows, O brother, where there is black soil,\nand pride swells up and grows, O brother, where there is abundant strength.\nWhere there is poverty, sleep grows, O brother;\nwhere there are mighty wrestlers and warriors, battle becomes fierce, O brother;\nwhere there are elders who are the truly accomplished *Sharanas* of our Shiva,\nwisdom grows, O brother.\nSeeing this, our Guheshwara was struck with wonder.","hi":"गन्ना बढ़ता है हे भाई, काली भूमि होने पर,\nउमड़-उमड़कर बढ़ता है हे भाई, बल का प्रमाण होने पर।\nदरिद्रता होने पर निद्रा बढ़ती है हे भाई,\nपहलवान और महावीर होने पर युद्ध घमासान होता है हे भाई,\nहमारे शिव के सच्चे, सिद्ध शरण रूपी बड़ों के होने पर\nबुद्धि बढ़ती है हे भाई।\nयह देखकर चकित हो गए हमारे गुहेश्वर।","mr":"काळी जमीन जिथे असते, तिथे ऊस पिकतो हो,\nकस-सामर्थ्य जिथे असते, तिथे तो बहरून वाढतो हो.\nदारिद्र्य जिथे असते, तिथे निद्रा वाढते हो,\nमल्ल आणि महावीर जिथे असतात, तिथे रणसंग्राम घनघोर होतो हो,\nआमच्या शिवाचे खरोखरच मान्यवर शरण असलेले ज्येष्ठ जिथे असतात,\nतिथे बुद्धी वाढते हो.\nहे पाहून आमचा गुहेश्वर थक्क झाला.","fr":"La canne à sucre pousse, ô Seigneur, là où se trouve une terre noire ;\nelle pousse avec exubérance, ô Seigneur, là où la vigueur et la juste mesure sont présentes.\nLà où se trouve la pauvreté, le sommeil croît, ô Seigneur ;\nlà où se trouvent de vaillants lutteurs et de grands guerriers, la bataille devient redoutable, ô Seigneur.\nLà où se trouvent les aînés qui sont les Sharanas pleinement accomplis de notre Shiva,\nl'intelligence spirituelle croît, ô Seigneur.\nEn voyant cela, notre Guheshwara fut émerveillé.","te":"నల్లని భూమి ఉన్నచోట చెరుకు పెరుగుతుంది ఓ స్వామీ,\nబలప్రమాణాలు ఉన్నచోట ఉప్పొంగి పెరుగుతుంది ఓ స్వామీ.\nదారిద్ర్యం ఉన్నచోట నిద్ర పెరుగుతుంది ఓ స్వామీ,\nజెట్టి మహావీరులు ఉన్నచోట పోరు ఘనమవుతుంది ఓ స్వామీ,\nమన శివునియందు నిశ్చయంగా నిలిచిన శరణులైన పెద్దలు ఉన్నచోట\nబుద్ధి పెరుగుతుంది ఓ స్వామీ.\nఇది చూసి విస్మయం చెందెను మన గుహేశ్వరుడు.","kn":"ಕಬ್ಬು ಬೆಳೆವುದಯ್ಯ ಕರಿಯ ಭೂಮಿಯಿದ್ದಲ್ಲಿ,\n ಉಬ್ಬುಬ್ಬಿ ಬೆಳೆವುದಯ್ಯ ಬಲ ಪ್ರಮಾಣವಿರ್ದಲ್ಲಿ.\n ದಾರಿದ್ರ್ಯವಿದ್ದಲ್ಲಿ ನಿದ್ರೆ ಬೆಳೆವುದಯ್ಯ,\n ಜಟ್ಟಿ ಮಾಸಾಳರಿರ್ದಲ್ಲಿ ಕಾಳಗ ಘನವಪ್ಪುದಯ್ಯ,\n ನಮ್ಮ ಶಿವನ ಸಲೆ ಸಂದ ಶರಣರಾದ ಹಿರಿಯರಿದ್ದಲ್ಲಿ\n ಬುದ್ಧಿ ಬೆಳವುದಯ್ಯ.\n ಇ[ದ] ಕಂಡು ಬೆರಗಾದ ನಮ್ಮ ಗುಹೇಶ್ವರ."},"m":{"en":"This Vachana illustrates the natural law that every state or quality flourishes only when placed in its conducive environment.\n\nThrough vivid comparisons—such as sugarcane thriving in fertile black soil, vigor expanding where there is proportionate strength, sleep increasing in poverty, and fierce combat arising among mighty wrestlers—the Vachana shows how surroundings shape outcomes.\n\nDrawing from these everyday observations, the Vachana highlights that true wisdom and higher awareness naturally blossom in the presence of realized elder Sharanas who have attained union with the Divine.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Guheshwara, the closing line expresses wonder at how the spiritual companionship of enlightened elders awakens and nurtures such profound inner intelligence.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस प्रकार किसी भी वस्तु या स्थिति के विकास के लिए उसके अनुकूल वातावरण आवश्यक होता है, ठीक उसी प्रकार आत्मिक ज्ञान और सद्बुद्धि के विकास के लिए सच्चे शरणों का सान्निध्य अनिवार्य है।\n\nयहाँ सांसारिक दृष्टांतों के माध्यम से स्पष्ट किया गया है कि जैसे काली मिट्टी में गन्ना उगता है, सामर्थ्य होने पर उत्साह बढ़ता है, दरिद्रता में आलस्य और निद्रा पनपती है तथा शूरवीर पहलवानों के होने से युद्ध भीषण होता है, वैसे ही प्रत्येक गुण अपने अनुकूल परिवेश में ही फलता-फूलता है।\n\nइसी क्रम में यह वचन रेखांकित करता है कि परमतत्त्व शिव के प्रति पूर्णतः समर्पित और अनुभवी वरिष्ठ शरणों की संगति में रहने से ही मनुष्य के भीतर सच्ची प्रज्ञा और विवेक का उदय होता है।\n\nअंततः, शरणों के सान्निध्य से होने वाले इस आध्यात्मिक बोध के स्वाभाविक विकास का यह अद्भुत विधान इतना विलक्षण है कि स्वयं निराकार परमतत्त्व गुहेश्वर भी इसे देखकर चकित रह जाता है।","mr":"हे वचन सभोवतालच्या पोषक वातावरणाचा आणि संगतीचा मानवी प्रवृत्तीवर व आध्यात्मिक विकासावर कसा परिणाम होतो, हे विविध नैसर्गिक आणि व्यावहारिक दृष्टांतांच्या माध्यमातून स्पष्ट करते.\n\nज्याप्रमाणे सुपीक काळ्या जमिनीत ऊस पिकतो, ताकद आणि प्रमाणबद्धता असेल तिथे भरभराट होते, दारिद्र्यात आळस व झोप वाढते आणि शूर योद्धे एकत्र आले की घनघोर युद्ध होते, त्याचप्रमाणे प्रत्येक गोष्ट तिच्या अनुकूल परिस्थितीतच वाढीस लागते.\n\nयाच न्यायाने, जिथे परमसत्याशी एकरूप झालेले आणि कसोटीला उतरलेले ज्येष्ठ शरण असतात, तिथेच खरी आध्यात्मिक समज, प्रज्ञा आणि विवेकबुद्धी विकसित होते.\n\nगुहेश्वर या निराकार परमतत्त्वाला स्मरून मांडलेला हा विचार असा आशय व्यक्त करतो की, शरणांच्या सत्संगतीत घडून येणारा हा ज्ञानाचा आणि जाणीवेचा विकास इतका अलौकिक आहे की त्याचे स्वतः परमतत्त्वालाही आश्चर्य वाटते.","fr":"Ce vachana met en lumière le lien essentiel entre le milieu qui nous entoure et la nature de ce qui se développe en nous.\n\nÀ travers des images concrètes, il montre que chaque terrain produit des fruits conformes à sa propre qualité : la terre noire et fertile fait croître la canne à sucre en abondance, le dénuement favorise la torpeur du sommeil, et la présence de vaillants lutteurs rend le combat redoutable.\n\nDe la même manière, c'est uniquement en la compagnie des aînés accomplis — les Sharanas intimement unis à la Réalité suprême — que l'intelligence spirituelle et le discernement véritable peuvent s'épanouir pleinement.\n\nCette floraison de la conscience au sein d'une telle assemblée éveillée est si remarquable qu'elle suscite l'émerveillement au cœur même de la Conscience absolue, désignée ici par la signature spirituelle Guheshwara.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, ఏదైనా ఒక గుణం లేదా స్థితి వికసించాలంటే దానికి తగిన సహజమైన వాతావరణం మరియు సాంగత్యం ఎంతో అవసరం.\n\nసారవంతమైన నల్లరేగడి భూమి ఉన్నచోట చెరకు ఏపుగా పెరిగినట్లు, తగిన ఆధారమూ బలమూ ఉన్నప్పుడే ఏదైనా ఉప్పొంగుతూ వృద్ధి చెందుతుంది; అలాగే దారిద్ర్యం ఉన్నచోట నిద్ర, మల్లయోధులు ఉన్నచోట పోరాటం సహజంగానే పెరుగుతాయి.\n\nఅదే విధంగా, పరమతత్త్వానికి సంపూర్ణంగా అంకితమైన అనుభవజ్ఞులైన పెద్దలు, శరణుల సాన్నిధ్యం ఉన్నచోట మనిషిలో నిజమైన జ్ఞానం మరియు సద్బుద్ధి వికసిస్తాయి.\n\nగుహేశ్వర అనే అంకితనామంతో కూడిన ఈ వచనం, సత్పురుషులైన శరణుల సమక్షంలో కలిగే ఈ అపురూపమైన ఆధ్యాత్మిక వికాసాన్ని పరమచైతన్యం కూడా ఆశ్చర్యంతో పరికిస్తుందని వివరిస్తోంది.","kn":"ಈ ವಚನವು ನಮಗೆ ಅರ್ಥ ಮಾಡಿಸುವುದು ಏನೆಂದರೆ, ಯಾವುದೇ ಒಂದು ಸಂಗತಿ ಸಹಜವಾಗಿ ಬೆಳೆಯಬೇಕಾದರೆ ಅದಕ್ಕೆ ಪೂರಕವಾದ ವಾತಾವರಣ ಮತ್ತು ಸರಿಯಾದ ಆಧಾರ ಇರಲೇಬೇಕು.\n\nಫಲವತ್ತಾದ ಕಪ್ಪು ಮಣ್ಣು ಮತ್ತು ಭೂಮಿಯಲ್ಲಿ ಸರಿಯಾದ ಸತ್ವ ಇದ್ದಾಗ ಕಬ್ಬು ಸಮೃದ್ಧವಾಗಿ ಬೆಳೆಯುತ್ತದೆ, ಬಡತನವಿರುವ ಕಡೆ ಸೋಮಾರಿತನದ ನಿದ್ರೆ ಹೆಚ್ಚಾಗುತ್ತದೆ ಹಾಗೂ ಶೂರರಾದ ಜಟ್ಟಿಗಳು ಮತ್ತು ವೀರರಿದ್ದ ಕಡೆ ಯುದ್ಧವು ತೀವ್ರವಾಗುತ್ತದೆ ಎಂದು ಇಲ್ಲಿ ಲೋಕದ ಸಹಜ ನಿದರ್ಶನಗಳನ್ನು ನೀಡಲಾಗಿದೆ.\n\nಇದೇ ರೀತಿಯಲ್ಲಿ, ಪರಮಸತ್ಯವಾದ ಶಿವತತ್ತ್ವಕ್ಕೆ ಸಂಪೂರ್ಣವಾಗಿ ಸಲ್ಲುವಂತಹ ಅನುಭಾವಿಗಳಾದ ಹಿರಿಯ ಶರಣರು ಇರುವ ಕಡೆ ಮನುಷ್ಯನ ಅರಿವು ಮತ್ತು ಸುಜ್ಞಾನವು ತಾನಾಗಿಯೇ ವಿಕಾಸವಾಗುತ್ತದೆ.\n\nನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಗುಹೇಶ್ವರನನ್ನು ಸಾಕ್ಷಿಯಾಗಿಟ್ಟುಕೊಂಡು, ಸತ್ಯವಂತರಾದ ಶರಣರ ಸಂಗದಲ್ಲಿ ಅರಿವು ಅರಳುವ ಈ ಸಹಜ ವಿಸ್ಮಯವೇ ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":495,"o":"ಕರಸ್ಥಲದ ಲಿಂಗ ಮನಸ್ಥಲದಲ್ಲಿ ವೇದ್ಯವಾಗಿ,\n ಮನಸ್ಥಲದ ಲಿಂಗ ಎನ್ನ ಸರ್ವಾಂಗದಲ್ಲಿ ವೇದ್ಯವಾದ ಬಳಿಕ,\n ಇನ್ನು ಭಿನ್ನಭಾವಕ್ಕೆ ತೆರಹುಂಟೆ?\n ಗುಹೇಶ್ವರಲಿಂಗವ ಬೆರಸಿ ಸಮರಸವಾದ ಬಳಿಕ\n ಎರಡೆಂಬುದಿಲ್ಲ ನೋಡಾ, ಚನ್ನಬಸವಣ್ಣಾ.","t":{"en":"Once the *Linga* in the palm of the hand is realized in the seat of the mind,\nand the *Linga* in the seat of the mind is realized throughout my entire being,\nis there any room left for a sense of separateness?\nOnce one merges in *Samarasa* with Guheshwaralinga,\nthere is nothing called two—see, O Channabasavanna!","hi":"करस्थल का लिंग मनस्थल में वेद्य होकर,\nमनस्थल का लिंग मेरे सर्वांग में वेद्य होने के बाद,\nअब भिन्नभाव के लिए अवकाश है क्या?\nगुहेश्वरलिंग में मिलकर समरस होने के बाद,\nदो कहना नहीं है देखो, हे चन्नबसवण्णा।","mr":"करस्थळावरील लिंग मनस्थळात वेद्य होऊन,\nमनस्थळातील लिंग माझ्या सर्वांगात वेद्य झाल्यावर,\nआता भिन्नभावाला वाव उरतो का?\nगुहेश्वरलिंगात मिसळून समरस झाल्यावर,\nदोन असे म्हणणेच उरत नाही पहा, हे चन्नबसवण्णा.","fr":"Le Linga du Karasthala étant réalisé dans le Manasthala,\net après que le Linga du Manasthala est réalisé dans tout mon être,\ny a-t-il encore place pour un sentiment de séparation ?\nAprès s'être uni à Guheshwaralinga et être devenu un en Samarasa,\nil n'y a plus ce que l'on appelle deux, vois-tu, ô Channabasavanna.","te":"కరస్థలపు లింగం మనఃস্থలంలో వేద్యమై,\nమనఃస్థలపు లింగం నా సర్వాంగంలో వేద్యమైన తరువాత,\nఇక భిన్నభావానికి తావుందా?\nగుహేశ్వరలింగాన్ని కూడి సమరసమైన తరువాత\nరెండనేది లేదు చూడుమా, ఓ చన్నబసవణ్ణా.","kn":"ಕರಸ್ಥಲದ ಲಿಂಗ ಮನಸ್ಥಲದಲ್ಲಿ ವೇದ್ಯವಾಗಿ,\n ಮನಸ್ಥಲದ ಲಿಂಗ ಎನ್ನ ಸರ್ವಾಂಗದಲ್ಲಿ ವೇದ್ಯವಾದ ಬಳಿಕ,\n ಇನ್ನು ಭಿನ್ನಭಾವಕ್ಕೆ ತೆರಹುಂಟೆ?\n ಗುಹೇಶ್ವರಲಿಂಗವ ಬೆರಸಿ ಸಮರಸವಾದ ಬಳಿಕ\n ಎರಡೆಂಬುದಿಲ್ಲ ನೋಡಾ, ಚನ್ನಬಸವಣ್ಣಾ."},"m":{"en":"This Vachana describes the seamless spiritual progression from outer contemplation to complete inner realization.\n\nWhen the Ishtalinga held on the palm (Karasthala)—serving as a sacred visual medium—is internalized and experienced within the mind (Manasthala), it subsequently pervades every aspect of one's entire being.\n\nOnce this Divine Consciousness is fully assimilated throughout the body and mind, no room remains for any sense of separation or duality.\n\nAddressing Channabasavanna, the Vachana concludes that when the seeker merges into harmonious union (Samarasa) with the Formless Supreme Reality, Guheshwaralinga, all distinction of \"two\" dissolves into absolute oneness.","hi":"यह वचन साधक की आध्यात्मिक यात्रा के उस शिखर को स्पष्ट करता है जहाँ बाह्य प्रतीक से शुरू हुई साधना पूर्ण अद्वैत और आंतरिक अनुभूति में परिणत हो जाती है।\n\nहथेली पर स्थित इष्टलिंग एक पवित्र माध्यम के रूप में पहले साधक के मन में आत्मसात होता है, और फिर मन से प्रवाहित होकर उसके रोम-रोम और संपूर्ण अस्तित्व में व्याप्त हो जाता है।\n\nजब शुद्ध चैतन्य इस प्रकार साधक के सर्वांग में समा जाता है, तब भीतर और बाहर या साधक और साध्य के बीच किसी भी प्रकार के भेदभाव के लिए कोई स्थान शेष नहीं रहता।\n\nचन्नबसवण्ण को संबोधित करते हुए इस वचन का मूल भाव यह है कि निराकार परमतत्त्व गुहेश्वर में पूर्णतः लीन होकर समरस हो जाने के बाद द्वैत यानी 'दो' होने का भाव पूरी तरह मिट जाता है और केवल एकत्व ही रह जाता है।","mr":"हे वचन इष्टलिंग साधनेतून बाह्य प्रतीकाकडून आंतरिक चैतन्याकडे होणाऱ्या आध्यात्मिक प्रवासाचे आणि अद्वैत अनुभूतीचे वर्णन करते.\n\nतळहातावरील इष्टलिंगाचे भान जेव्हा मनात सामावले जाते आणि मनातील हेच लिंगतत्त्व जेव्हा साधकाच्या सर्वांगात व्यापून राहते, तेव्हा कोणत्याही प्रकारच्या द्वैताला किंवा वेगळेपणाच्या भावनेला जागा उरत नाही.\n\nचन्नबसवण्णा यांना उद्देशून मांडलेला या वचनाचा गाभा असा की, 'गुहेश्वरलिंग' या निराकार परमतत्त्वाशी एकरूप होऊन समरस पावल्यानंतर भक्त आणि परमतत्त्व असा कोणताही दुजाभाव शिल्लक राहत नाही, तर केवळ अखंड एकत्वच उरते.","fr":"Ce vachana met en lumière le cheminement intérieur par lequel l’Ishtalinga, d’abord contemplé dans le creux de la main comme un support sacré, s’intériorise progressivement dans la conscience.\n\nLorsque cette présence du Linga dépasse le plan mental pour imprégner et illuminer chaque fibre de l’être tout entier, tout sentiment de séparation ou de différence s’efface d’emblée.\n\nS’adressant à Channabasavanna, le texte souligne qu’une fois accomplie l’union harmonieuse avec la Réalité suprême sans forme, désignée sous le nom de Guheshwaralinga, toute dualité disparaît pour laisser place à une unité absolue.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, బాహ్య ప్రతీకగా అరచేతిలో ధరించిన ఇష్టలింగం క్రమంగా అంతరంగంలో అనుభవవేద్యమై, సర్వాంతర్యామి అయిన నిరాకార పరమచైతన్యంలో ఐక్యమయ్యే ఆధ్యాత్మిక పరిణామ క్రమాన్ని ఇది వివరిస్తోంది.\n\nసాధకుని అరచేతిలో (కరస్థలంలో) నిరాకార తత్త్వానికి ప్రవేశద్వారంగా ఉన్న లింగం ముందుగా మనస్సులో (మనస్థలంలో) అర్థమవుతుంది; ఆ తర్వాత మనస్సులోని ఆ చైతన్య స్ఫురణ సాధకుని సర్వాంగాలలోనూ వ్యాపించి సంపూర్ణ అనుభవంగా మారుతుంది.\n\nఇలా బాహ్యం నుండి అంతరంగానికి, అక్కడి నుండి అణువణువునా ఆ దివ్య ఎరుక వ్యాపించిన తర్వాత ఇక వేరనే భేదభావానికి (భిన్నభావానికి) ఎక్కడా ఆస్కారం ఉండదు.\n\nచన్నబసవణ్ణను సంబోధిస్తూ, గుహేశ్వరలింగం అనబడే నిరాకార పరమతత్త్వంలో కూడి సమరస భావంతో ఏకమైన తర్వాత, ఇక అక్కడ 'రెండు' అనే ద్వాైత భావన గానీ, వేర్పాటు గానీ ఏమాత్రం ఉండదని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಅಂಗೈಯಲ್ಲಿರುವ ಇಷ್ಟಲಿಂಗವು ಕೇವಲ ಹೊರಗಿನ ಒಂದು ಕುರುಹಾಗಿ ಉಳಿಯದೆ, ನಮ್ಮ ಅರಿವಿನಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ನೆಲೆಗೊಳ್ಳುವ ಆಧ್ಯಾತ್ಮಿಕ ಹಂತವನ್ನು ಇಲ್ಲಿ ಚನ್ನಬಸವಣ್ಣನವರನ್ನು ಸಂಬೋಧಿಸಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಮೊದಲು ಕರಸ್ಥಲದಲ್ಲಿ ಅಂದರೆ ಅಂಗೈಯಲ್ಲಿ ಹಿಡಿದ ಇಷ್ಟಲಿಂಗದ ತತ್ತ್ವವು ಮನಸ್ಸಿನ ಆಳಕ್ಕೆ ಇಳಿದು ಅರಿವಾದಾಗ, ಮುಂದೆ ಆ ಮನಸ್ಸಿನಲ್ಲಿ ಮೂಡಿದ ಅರಿವೇ ನಮ್ಮ ಇಡೀ ಶರೀರದ ಅಣುಅಣುವಿನಲ್ಲೂ ಅಂದರೆ ಸರ್ವಾಂಗದಲ್ಲೂ ತುಂಬಿಕೊಳ್ಳುತ್ತದೆ.\n\nಹೀಗೆ ಹೊರಗಿನ ಕುರುಹಾದ ಲಿಂಗವು ಒಳಗಿನ ಅರಿವಾಗಿ ಇಡೀ ಅಸ್ತಿತ್ವವೇ ಲಿಂಗಮಯವಾದ ಮೇಲೆ, ಇನ್ನು ನಾನು ಬೇರೆ, ಆ ಪರಮತತ್ತ್ವ ಬೇರೆ ಎಂಬ ಭೇದಭಾವಕ್ಕೆ ಅಲ್ಲಿ ಯಾವುದೇ ಜಾಗವಿರುವುದಿಲ್ಲ.\n\nಗುಹೇಶ್ವರಲಿಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮಚೈತನ್ಯದೊಡನೆ ಬೆರೆತು ಹೀಗೆ ಸಂಪೂರ್ಣ ಸಮರಸವಾದ ಬಳಿಕ, ಅಲ್ಲಿ ಪೂಜಿಸುವವನು ಮತ್ತು ಪೂಜಿಸಲ್ಪಡುವ ತತ್ತ್ವ ಎಂಬ ಎರಡು ಪ್ರತ್ಯೇಕ ಭಾವಗಳೇ ಇಲ್ಲದಂತಾಗಿ ಕೇವಲ ಏಕತ್ವ ಮಾತ್ರ ಉಳಿಯುತ್ತದೆ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":496,"o":"ಕಲ್ಯಾಣವೆಂಬ ಪ್ರಣತೆಯಲ್ಲಿ\n ಭಕ್ತಿರಸವೆಂಬ ತೈಲವನೆರೆದು\n ಆಚಾರವೆಂಬ ಬತ್ತಿಯಲ್ಲಿ\n ಬಸವಣ್ಣನೆಂಬ ಜ್ಯೋತಿಯ ಮುಟ್ಟಿಸಲು\n ತೊಳಗಿ ಬೆಳಗುತ್ತಿದ್ದಿತ್ತಯ್ಯಾ ಶಿವನ ಪ್ರಕಾಶ!\n ಆ ಬೆಳಗಿನೊಳಗೆ ಒಪ್ಪುತ್ತಿದ್ದರಯ್ಯಾ\n ಅಸಂಖ್ಯಾತ ಭಕ್ತಗಣಂಗಳು.\n ಶಿವಭಕ್ತರಿರ್ದ ಕ್ಷೇತ್ರವೆ ಅವಿಮುಕ್ತಕ್ಷೇತ್ರವೆಂಬುದು ಹುಸಿಯೆ?\n ಶಿವಭಕ್ತರಿರ್ದ ದೇಶ ಪಾವನವೆಂಬುದು ಹುಸಿಯೆ?\n ಗುಹೇಶ್ವರಲಿಂಗದಲ್ಲಿ\n ಎನ್ನ ಪರಮಾರಾಧ್ಯ ಸಂಗನಬಸವಣ್ಣನ ಕಂಡು\n ಬದುಕಿದೆನು ಕಾಣಾ, ಸಿದ್ಧರಾಮಯ್ಯಾ.","t":{"en":"In the earthen lamp called Kalyana,\npouring the oil of the essence of devotion,\nwhen the flame called Basavanna\ntouched the wick of righteous conduct,\nthe radiance of Shiva shone forth in splendor, O brother!\nIn that light there shone in grace, O brother,\ncountless hosts of devotees.\nIs it false to say that the place where Shiva's devotees dwell is itself Avimukta Kshetra?\nIs it false to say that the land where Shiva's devotees dwell is sacred?\nIn Guheshwaralinga,\nhaving seen my supremely revered Sanganabasavanna,\nI was saved, see, O Siddharamayya!","hi":"कल्याण रूपी दीये में,\nभक्तिरस रूपी तेल डालकर,\nआचार रूपी बाती में,\nबसवय्या रूपी ज्योति के छूते ही,\nजगमगाकर चमक रहा था, हे भाई, शिव का प्रकाश!\nउस प्रकाश में शोभायमान थे, हे भाई,\nअसंख्य भक्तगण।\nशिवभक्तों का निवास-क्षेत्र ही अविमुक्त क्षेत्र है कहना क्या झूठ है?\nशिवभक्तों का निवास-देश पावन है कहना क्या झूठ है?\nगुहेश्वरलिंग में,\nमेरे परमाराध्य संगनबसवय्या का दर्शन कर,\nमैं धन्य हो गया, देखो हे सिद्धरामय्या।","mr":"कल्याण नावाच्या पणतीमध्ये\nभक्तिरस नावाचे तेल ओतून,\nआचार नावाच्या वातीला\nबसवण्णा नावाची ज्योत लावताच,\nअहो, झळकून उजळत होता शिवाचा प्रकाश!\nत्या प्रकाशात शोभून दिसत होते अहो,\nअसंख्य भक्तगण।\nशिवभक्त असलेले क्षेत्र हेच अविमुक्तक्षेत्र आहे असे म्हणणे खोटे का?\nशिवभक्त असलेला देश पावन आहे असे म्हणणे खोटे का?\nगुहेश्वरसिंगामध्ये\nमाझ्या परमांराध्य संगनबसवण्णांना पाहून\nमी धन्य झालो पहा, हे सिद्धरामय्या।","fr":"Dans la lampe d'argile que l'on appelle Kalyana,\nayant versé l'huile que l'on appelle l'essence de la *Bhakti*,\net à la mèche que l'on appelle la conduite juste,\nlorsqu'on a approché la flamme que l'on appelle Basavanna,\nelle resplendissait et rayonnait, mon frère, la splendeur de Shiva !\nAu sein de cette lumière brillaient dans toute leur beauté, mon frère,\nles innombrables assemblées de dévots.\nEst-il faux de dire que le lieu où demeurent les dévots de Shiva est le sanctuaire même d'Avimukta ?\nEst-il faux de dire que la terre où demeurent les dévots de Shiva est sacrée ?\nEn présence de Guheshwaralinga,\nayant vu mon suprême vénéré Sanganabasavanna,\nj'ai trouvé la vraie vie, vois-tu, ô Siddharamayya.","te":"కల్యాణమనే ప్రమిదలో\nభక్తిరసమనే తైలాన్ని పోసి\nఆచారమనే వత్తికి\nబసవణ్ణ అనే జ్యోతిని తాకించగా\nతళతళలాడుతూ వెలుగుచుండెను గదయ్యా శివుని ప్రకాశం!\nఆ వెలుగులో శోభిల్లుచుండిరి గదయ్యా\nఅసంఖ్యాత భక్తగణములు.\nశివభక్తులున్న క్షేత్రమే అవిముక్తక్షేత్రమని చెప్పడం అసత్యమా?\nశివభక్తులున్న దేశమే పావనమని చెప్పడం అసత్యమా?\nగుహేశ్వరలింగములో\nనా పరమారాధ్యుడైన సంగనబసవణ్ణను చూసి\nబతికాను సుమా, ఓ సిద్ధరామయ్యా.","kn":"ಕಲ್ಯಾಣವೆಂಬ ಪ್ರಣತೆಯಲ್ಲಿ\n ಭಕ್ತಿರಸವೆಂಬ ತೈಲವನೆರೆದು\n ಆಚಾರವೆಂಬ ಬತ್ತಿಯಲ್ಲಿ\n ಬಸವಣ್ಣನೆಂಬ ಜ್ಯೋತಿಯ ಮುಟ್ಟಿಸಲು\n ತೊಳಗಿ ಬೆಳಗುತ್ತಿದ್ದಿತ್ತಯ್ಯಾ ಶಿವನ ಪ್ರಕಾಶ!\n ಆ ಬೆಳಗಿನೊಳಗೆ ಒಪ್ಪುತ್ತಿದ್ದರಯ್ಯಾ\n ಅಸಂಖ್ಯಾತ ಭಕ್ತಗಣಂಗಳು.\n ಶಿವಭಕ್ತರಿರ್ದ ಕ್ಷೇತ್ರವೆ ಅವಿಮುಕ್ತಕ್ಷೇತ್ರವೆಂಬುದು ಹುಸಿಯೆ?\n ಶಿವಭಕ್ತರಿರ್ದ ದೇಶ ಪಾವನವೆಂಬುದು ಹುಸಿಯೆ?\n ಗುಹೇಶ್ವರಲಿಂಗದಲ್ಲಿ\n ಎನ್ನ ಪರಮಾರಾಧ್ಯ ಸಂಗನಬಸವಣ್ಣನ ಕಂಡು\n ಬದುಕಿದೆನು ಕಾಣಾ, ಸಿದ್ಧರಾಮಯ್ಯಾ."},"m":{"en":"This Vachana uses the metaphor of an earthen lamp to celebrate how the city of Kalyana became a radiant center of spiritual awakening under the leadership of Basavanna.\n\nBy pouring the oil of devotion into the lamp of Kalyana and igniting the wick of righteous conduct with the flame that is Basavanna, the resplendent light of Formless Supreme Consciousness shone forth, illuminating countless Sharanas gathered within its glow.\n\nAddressing Siddharama, the Vachana affirms that any land inhabited by true devotees becomes a sacred, liberated realm (Avimuktakshetra), rather than holiness being confined to conventional pilgrimage sites.\n\nUltimately, the Vachanakara expresses profound gratitude for finding true spiritual fulfillment upon beholding his revered Sanganabasavanna in union with the Supreme Reality, invoked as Guheshwaralinga.","hi":"इस वचन का केंद्रीय भाव यह है कि कल्याण नगर के आध्यात्मिक वैभव और बसवण्ण के आलोकित व्यक्तित्व को एक सुंदर रूपक के माध्यम से प्रस्तुत किया गया है।\n\nयह वचन स्पष्ट करता है कि कल्याण रूपी दीपक में भक्तिरस रूपी तेल डालकर, सदाचार रूपी बाती में जब बसवण्ण रूपी ज्योति को स्पर्श कराया गया, तो चारों ओर परम चैतन्य (शिव) का दिव्य प्रकाश जगमगा उठा और उस आलोक में असंख्य भक्तगण शोभायमान हो रहे थे।\n\nसिद्धराम को संबोधित करते हुए इस वचन में यह दर्शन प्रकट होता है कि जहाँ सच्चे शिवभक्त निवास करते हैं, वही स्थान वास्तव में मुक्त करने वाला 'अविमुक्त क्षेत्र' और परम पावन भूमि है, यह बात कदापि असत्य नहीं हो सकती।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि निराकार परमतत्त्व गुहेश्वर लिंग की अनुभूति में अपने परम आराध्य संगनबसवण्ण के दर्शन पाकर ही साधक का जीवन सार्थक और धन्य हो जाता है।","mr":"या वचनात कल्याण नगरीचे एका दिव्याच्या रूपकातून अतिशय सुंदर वर्णन केले आहे, जिथे कल्याण ही पणती, भक्तीरस हे तेल आणि सदाचार ही वात आहे.\n\nजेव्हा या सदाचाराच्या वातीला बसवण्णांसारख्या तेजस्वी ज्योतीचा स्पर्श होतो, तेव्हा तिथे शिवतत्त्वाचा अर्थात शुद्ध चैतन्याचा दिव्य प्रकाश सर्वत्र उजळून निघतो आणि त्या प्रकाशात असंख्य शरणांचा समुदाय झळाळून उठतो.\n\nसिद्धरामय्यांना उद्देशून हे वचन स्पष्ट करते की, जिथे असे सच्चे शिवभक्त राहतात तोच प्रदेश खऱ्या अर्थाने पावन आणि मुक्त क्षेत्र ठरतो, हे विधान अजिबात खोटे नाही.\n\nगुहेश्वरलिंग या परमतत्त्वाच्या ठायी आपले परमपूज्य संगनबसवण्ण यांचे दर्शन झाल्यामुळेच आपले जीवन खऱ्या अर्थाने सार्थक झाले, हा आध्यात्मिक कृतज्ञतेचा भाव या वचनाच्या केंद्रस्थानी आहे.","fr":"Ce vachana met en lumière le rayonnement spirituel de la cité de Kalyana à travers la métaphore lumineuse d'une lampe sacrée, où Kalyana est le réceptacle, l'essence de la dévotion est l'huile, et la conduite juste constitue la mèche.\n\nLorsque Basavanna, telle une flamme vivante, embrase cette mèche, la splendeur de la conscience suprême resplendit pleinement et révèle dans sa clarté d'innombrables chercheurs spirituels.\n\nLe texte affirme ainsi que la sainteté véritable et le caractère libérateur d'un lieu, appelé Avimuktakshetra, ne dépendent pas d'une géographie figée, mais de la présence vivante des dévots qui purifient la terre qu'ils habitent.\n\nEn s'adressant à Siddharama et en invoquant Guheshwaralinga, désignant la Réalité suprême sans forme, le poète exprime que la contemplation de la grandeur exemplaire de Sanganabasavanna au sein de cette pure conscience donne son sens véritable à l'existence.","te":"ఈ వచనం కళ్యాణ నగరంలో బసవణ్ణ వెలిగించిన ఆధ్యాత్మిక చైతన్యాన్ని ఒక అద్భుతమైన దీపక రూపకం ద్వారా ఆవిష్కరిస్తున్నది.\n\nకళ్యాణమనే ప్రమిదలో భక్తిరసమనే నూనెను పోసి, సదాచారమనే వత్తికి బసవణ్ణ అనే జ్యోతిని తాకించగా, అక్కడ నిరాకార పరమతత్త్వమైన శివప్రకాశం దేదీప్యమానంగా ప్రకాశించిందని ఈ వచనం వివరిస్తున్నది.\n\nఆ దివ్యమైన వెలుగులో అసంఖ్యాత శరణ గణాలు ప్రకాశిస్తున్నాయని తెలుపుతూ, నిజమైన శివభక్తులు నివసించే ప్రదేశమే అవిముక్త క్షేత్రమని, వారున్న దేశమే పరమ పావనమైనదని ఈ వచనం స్పష్టం చేస్తున్నది.\n\nగుహేశ్వరలింగ అనే నిరాకార పరమచైతన్యంలో పరమారాధ్యుడైన సంగనబసవణ్ణను దర్శించుకోవడం వల్లనే తన జీవితం ధన్యమైందని వచనకారుడు సిద్ధరామయ్యతో పంచుకుంటున్న ఆధ్యాత్మిక అనుభూతి ఇందులో వ్యక్తమవుతున్నది.","kn":"ಈ ವಚನದಲ್ಲಿ ಕಲ್ಯಾಣ ನಗರವನ್ನು ಒಂದು ಹಣತೆಗೆ ಹೋಲಿಸಿ, ಅಲ್ಲಿ ಭಕ್ತಿರಸವೆಂಬ ಎಣ್ಣೆ ಮತ್ತು ಸದಾಚಾರವೆಂಬ ಬತ್ತಿಯು ಸಿದ್ಧವಾಗಿರುವಾಗ, ಬಸವಣ್ಣನವರ ಜೀವನವೇ ಒಂದು ಜ್ಯೋತಿಯಾಗಿ ಅದನ್ನು ಬೆಳಗಿಸಿ ಇಡೀ ಕಲ್ಯಾಣದಲ್ಲಿ ಶಿವತತ್ತ್ವದ ಅರಿವಿನ ಬೆಳಕನ್ನು ಹರಡಿತು ಎಂದು ವಿವರಿಸಲಾಗಿದೆ.\n\nಬಸವಣ್ಣನವರು ಹೊತ್ತಿಸಿದ ಆ ಜ್ಞಾನ ಮತ್ತು ಭಕ್ತಿಯ ಬೆಳಕಿನಲ್ಲಿ ಅಸಂಖ್ಯಾತ ಶರಣರ ಸಮೂಹವು ಕಂಗೊಳಿಸುತ್ತಾ, ಆಧ್ಯಾತ್ಮಿಕವಾಗಿ ಎಚ್ಚರಗೊಂಡು ಬದುಕುತ್ತಿದ್ದ ಸುಂದರ ಚಿತ್ರಣವನ್ನು ಇಲ್ಲಿ ಕಾಣಬಹುದು.\n\nಭಕ್ತರು ಮತ್ತು ಸತ್ಯಾನ್ವೇಷಕರು ನೆಲೆಸಿರುವ ಸ್ಥಳವೇ ನಿಜವಾದ ಪಾವನ ಭೂಮಿ ಮತ್ತು ಮುಕ್ತಿಯ ನೆಲೆಯಾದ ಅವಿಮುಕ್ತಕ್ಷೇತ್ರ ಎಂಬ ಮಾತು ಕಲ್ಯಾಣದ ಶರಣರ ಬದುಕಿನಿಂದಾಗಿ ನೂರಕ್ಕೆ ನೂರರಷ್ಟು ಸತ್ಯವಾಗಿದೆ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.\n\nನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಗುಹೇಶ್ವರಲಿಂಗದ ಅರಿವಿನ ನೆಲೆಯಲ್ಲಿ, ಇಂತಹ ಪರಮ ಪೂಜ್ಯ ಸಂಗನಬಸವಣ್ಣನವರ ದರ್ಶನ ಮತ್ತು ಒಡನಾಟವನ್ನು ಪಡೆದು ತನ್ನ ಬದುಕು ಸಾರ್ಥಕವಾಯಿತು ಎಂದು ಸಿದ್ಧರಾಮಯ್ಯನನ್ನು ಉದ್ದೇಶಿಸಿ ಇಲ್ಲಿ ಹೇಳಲಾಗಿದೆ."}},{"no":497,"o":"ಕಲ್ಲೊಳಗಣ ಕಿಚ್ಚು ಉರಿಯದಂತೆ,\n ಬೀಜದೊಳಗಣ ವೃಕ್ಷ ಉಲಿಯದಂತೆ,\n ತೋರಲಿಲ್ಲಾಗಿ ಬೀರಲಿಲ್ಲಾರಿಗೆಯು,\n ಗುಹೇಶ್ವರ ನಿಂದ ನಿಲವ ಅನು[ಭಾ]ವಸುಖಿ ಬಲ್ಲ.","t":{"en":"Like the fire within a stone that does not blaze,\nlike the tree within a seed that makes no sound,\nsince it is not shown, it is not displayed to anyone;\nonly one who savours the bliss of *Anubhāva* knows the state in which Guheshwara abides.","hi":"पत्थर के भीतर की आग के न जलने के समान,\nबीज के भीतर के वृक्ष के न सरसराने के समान,\nदिखाई नहीं दिया इसलिए किसी को भी बाँटा नहीं,\nगुहेश्वर की स्थित स्थिति को अनुभावसुखी ही जानता है।","mr":"दगडातील अग्नी जसा जळत नाही,\nबियातील वृक्ष जसा सळसळत नाही,\nदिसण्यासारखे नसल्याने कुणापुढेही मांडण्यासारखे नाही,\nगुहेश्वराची स्थिर स्थिती अनुभावसुखीच जाणतो.","fr":"Comme le feu au sein de la pierre qui ne brûle pas,\ncomme l'arbre au sein de la graine qui ne bruisse pas,\nparce qu'il ne s'est pas manifesté, il ne s'est répandu pour personne ;\nseul celui qui jouit de la félicité de l'Anubhava connaît la stature où demeure Guheshwara.","te":"రాతిలోని నిప్పు మండనట్లు,\nవిత్తనంలోని వృక్షం ధ్వనించనట్లు,\nకనిపించలేదు గనుక ఎవరికీ వెల్లడించబడలేదు,\nగుహేశ్వరుడు నిలిచిన స్థితిని అనుభావసుఖి ఎరుగును.","kn":"ಕಲ್ಲೊಳಗಣ ಕಿಚ್ಚು ಉರಿಯದಂತೆ,\n ಬೀಜದೊಳಗಣ ವೃಕ್ಷ ಉಲಿಯದಂತೆ,\n ತೋರಲಿಲ್ಲಾಗಿ ಬೀರಲಿಲ್ಲಾರಿಗೆಯು,\n ಗುಹೇಶ್ವರ ನಿಂದ ನಿಲವ ಅನು[ಭಾ]ವಸುಖಿ ಬಲ್ಲ."},"m":{"en":"This Vachana explains that the Formless Supreme Consciousness, addressed as Guheshwara, abides within everything in a subtle, unmanifest state, much like fire concealed inside a stone or a full-grown tree hidden within a seed.\n\nJust as the latent fire does not burn on its own and the unmanifest tree makes no sound, this ultimate reality neither displays itself outwardly nor broadcasts its presence to the world.\n\nBecause the Absolute remains beyond external show and ordinary sensory perception, its true nature cannot be grasped through mere outward observation.\n\nOnly the one who is immersed in the bliss of inner spiritual experience (Anubhava) can truly recognize and realize the silent, all-pervading presence of the Supreme Reality.","hi":"यह वचन निराकार परमतत्त्व की अव्यक्त और सूक्ष्म उपस्थिति की गहनता को स्पष्ट करता है।\n\nजिस प्रकार पत्थर के भीतर छिपी अग्नि बाहर जलती हुई दिखाई नहीं देती और बीज के भीतर समाया हुआ वृक्ष कोई शब्द नहीं करता, उसी प्रकार परम सत्य भी भीतर मौन और अप्रकट रूप से विद्यमान रहता है।\n\nयह आंतरिक सत्य किसी बाहरी प्रदर्शन का विषय नहीं है, इसलिए इसे किसी को दिखाया या शब्दों के माध्यम से बाँटा नहीं जा सकता।\n\nगुहेश्वर के रूप में संबोधित उस परमतत्त्व की इस गूढ़ स्थिति को केवल वही साधक जान सकता है, जो स्वयं उस आध्यात्मिक अनुभूति के आनंद में लीन हो।","mr":"हे वचन परमतत्त्वाचे अव्यक्त आणि सूक्ष्म अस्तित्व स्पष्ट करते.\n\nज्याप्रमाणे दगडात लपलेली ठिणगी बाहेरून पेटलेली दिसत नाही आणि बीजामध्ये दडलेला वृक्ष कोणतीही चाहूल देत नाही, त्याचप्रमाणे परम सत्य हे बाह्य दृष्टीला सहजपणे प्रकट होत नाही किंवा कुणालाही बाहेरून दाखवता येत नाही.\n\nअशा या बाह्य रूपांच्या पलीकडे असलेल्या 'गुहेश्वर' या निराकार चैतन्याची मूळ स्थिती केवळ स्वानुभवाच्या आणि आंतरिक अनुभूतीच्या आनंदात मग्न असलेला साधकच जाणू शकतो, हा या वचनाचा मुख्य गाभा आहे.","fr":"Ce vachana met en lumière la nature latente et silencieuse de la Réalité suprême sans forme, désignée sous la signature spirituelle de Guheshwara.\n\nTout comme le feu caché au cœur de la pierre ne brûle pas de manière visible et que l’arbre contenu dans la graine demeure dans le silence, ce Principe absolu réside au sein de l’existence sans se manifester extérieurement.\n\nParce qu’il échappe à toute ostentation et ne se livre pas à une démonstration ordinaire, cet état d’être échappe au regard superficiel.\n\nSeul l’être accompli, plongé dans la béatitude de l’expérience spirituelle directe (Anubhava), est capable de saisir et de connaître cette présence intérieure subtile et immuable.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నిరాకార పరమసత్యం బాహ్య ప్రదర్శనకు లేదా సాధారణ ఇంద్రియ దృష్టికి అందేది కాదని, అది అంతర్గత అనుభూతి ద్వారా మాత్రమే గ్రాహ్యమవుతుందని వివరించడం.\n\nరాయిలో దాగి ఉన్న అగ్ని తనంతట తానుగా బయటకు మండనట్లే, విత్తనంలో సూక్ష్మరూపంలో ఉన్న వృక్షం బయటకు శబ్దం చేయనట్లే, పరమతత్త్వం కూడా నిశ్శబ్దంగా, అవ్యక్తంగా అంతర్లీనమై ఉంటుంది.\n\nఅది బాహ్యంగా కనిపించే వస్తువు కాదు కాబట్టి, దానిని ఇతరులకు భౌతికంగా చూపించడం గానీ, మాటల ద్వారా పంచిపెట్టడం గానీ ఎవరికీ సాధ్యం కాదు.\n\nగుహేశ్వర అని సంబోధించబడే ఆ నిరాకార పరమచైతన్యం కొలువై ఉన్న అత్యున్నత స్థితిని, ఆత్మానుభూతిలోని పరమానందాన్ని పొందిన ఆధ్యాత్మిక అనుభావి మాత్రమే యథార్థంగా తెలుసుకోగలడు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕಲ್ಲಿನ ಒಳಗಿರುವ ಬೆಂಕಿ ಹೊರಗೆ ಉರಿಯದೆ ಸುಪ್ತವಾಗಿರುವಂತೆ ಮತ್ತು ಬೀಜದ ಒಳಗಿರುವ ದೊಡ್ಡ ಮರವು ಯಾವುದೇ ಸದ್ದಿಲ್ಲದೆ ಅಡಗಿರುವಂತೆ, ನಿರಾಕಾರ ಪರಮಸತ್ಯವು ನಮ್ಮೊಳಗೆಯೇ ಅಂತರ್ಗತವಾಗಿದೆ.\n\nಅದು ಹೊರಗಿನ ಕಣ್ಣಿಗೆ ಒಂದು ಭೌತಿಕ ವಸ್ತುವಾಗಿ ಕಾಣಿಸುವುದಿಲ್ಲವಾದ್ದರಿಂದ, ಅದನ್ನು ಯಾರಿಗೂ ತೋರಿಸಲಾಗಲಿ ಅಥವಾ ಮಾತಿನ ಮೂಲಕ ಹಂಚಿ ಹೇಳಲಾಗಲಿ ಸಾಧ್ಯವಿಲ್ಲ.\n\nಹೊರಗಿನ ಪ್ರದರ್ಶನಕ್ಕೆ ಸಿಗದ ಗುಹೇಶ್ವರ ಎಂಬ ಆ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವು ನೆಲೆಸಿರುವ ಸ್ಥಿತಿಯನ್ನು, ಆಳವಾದ ಅರಿವಿನ ಸಾಕ್ಷಾತ್ಕಾರವಾದ ಅನುಭಾವದ ಆನಂದವನ್ನು ಹೊಂದಿದ ಸಾಧಕನು ಮಾತ್ರ ತನ್ನೊಳಗೆ ಅರಿತುಕೊಳ್ಳಬಲ್ಲನು ಎಂಬುದು ಈ ವಚನದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":498,"o":"ಕಳ್ಳಗಂಜಿ ಕಾಡ ಹೊಕ್ಕಡೆ ಹುಲಿ ತಿಂಬುದ ಮಾಬುದೆ?\n ಹುಲಿಗಂಜಿ ಹುತ್ತವ ಹೊಕ್ಕಡೆ ಸರ್ಪ ತಿಂಬುದ ಮಾಬುದೆ?\n ಕಾಲಗಂಜಿ ಭಕ್ತನಾದಡೆ ಕರ್ಮ ತಿಂಬುದ ಮಾಬುದೆ?\n ಇಂತೀ ಮೃತ್ಯುವಿನ ಬಾಯ ತುತ್ತಾದ\n ವೇಷಡಂಬಕರ ನಾನೇನೆಂಬೆ ಗುಹೇಶ್ವರಾ.","t":{"en":"If one enters the forest in fear of a thief, will the tiger refrain from devouring him?\nIf one enters an anthill in fear of the tiger, will the serpent refrain from devouring him?\nIf one becomes a devotee in fear of death, will karma refrain from devouring him?\nWhat can I say of such hypocrites in disguise,\nwho have become a mere morsel in the jaws of death, O Guheshwara?","hi":"चोर से डरकर जंगल में घुसने पर क्या बाघ खाना छोड़ेगा?\nबाघ से डरकर बाँबी में घुसने पर क्या सर्प खाना छोड़ेगा?\nकाल से डरकर भक्त बनने पर क्या कर्म खाना छोड़ेगा?\nइस प्रकार मृत्यु के मुँह का ग्रास बने,\nवेश-आडंबरियों को मैं क्या कहूँ, हे गुहेश्वर?","mr":"चोराला भिऊन रानात शिरल्यावर वाघ खाण्याचे सोडेल का?\nवाघाला भिऊन वारुळात शिरल्यावर साप खाण्याचे सोडेल का?\nकाळाला भिऊन भक्त झाल्यावर कर्म खाण्याचे सोडेल का?\nअशा या मृत्यूच्या मुखातील घास झालेल्या\nवेषढोंग्यांना मी काय म्हणू, हे गुहेश्वरा?","fr":"Si, par crainte du voleur, l'on entre dans la forêt, le tigre manquera-t-il de dévorer ?\nSi, par crainte du tigre, l'on entre dans une termitière, le serpent manquera-t-il de dévorer ?\nSi, par crainte du temps et du trépas, l'on devient dévot, le *karma* manquera-t-il de dévorer ?\nAinsi, de ces hypocrites déguisés,\ndevenus une bouchée dans la gueule de la mort, que puis-je dire, ô Guheshwara ?","te":"దొంగకు భయపడి అడవిలో దూరితే పులి తినడం మానుతుందా?\nపులికి భయపడి పుట్టలో దూరితే సర్పం తినడం మానుతుందా?\nకాలానికి భయపడి భక్తుడైతే కర్మ తినడం మానుతుందా?\nఇలా మృత్యువు నోటికి కబళమైన\nవేషడంభకులను నేనేమందును ఓ గుహేశ్వరా.","kn":"ಕಳ್ಳಗಂಜಿ ಕಾಡ ಹೊಕ್ಕಡೆ ಹುಲಿ ತಿಂಬುದ ಮಾಬುದೆ?\n ಹುಲಿಗಂಜಿ ಹುತ್ತವ ಹೊಕ್ಕಡೆ ಸರ್ಪ ತಿಂಬುದ ಮಾಬುದೆ?\n ಕಾಲಗಂಜಿ ಭಕ್ತನಾದಡೆ ಕರ್ಮ ತಿಂಬುದ ಮಾಬುದೆ?\n ಇಂತೀ ಮೃತ್ಯುವಿನ ಬಾಯ ತುತ್ತಾದ\n ವೇಷಡಂಬಕರ ನಾನೇನೆಂಬೆ ಗುಹೇಶ್ವರಾ."},"m":{"en":"This Vachana exposes the futility of turning to spirituality out of mere fear and self-preservation rather than genuine inner awakening.\n\nUsing vivid imagery—such as fleeing a thief only to enter a forest where a tiger awaits, or escaping a tiger by hiding in an anthill inhabited by a venomous snake—the Vachana illustrates how running away from one peril without true understanding only leads to another.\n\nSimilarly, adopting the outward garb of a devotee simply out of the fear of death cannot free a person from the inescapable consequences of their own actions (karma).\n\nAddressed to the Formless Supreme Consciousness invoked as Guheshwara, the Vachana critiques such pretentious individuals who wear religious disguises out of fear, noting that their hollow ostentation leaves them utterly helpless inside the jaws of mortality.","hi":"इस वचन का मूल भाव यह है कि केवल भय से प्रेरित होकर अपनाया गया बाहरी भक्ति-भाव मनुष्य को उसके कर्मों के परिणाम और मृत्यु से बचा नहीं सकता।\n\nजैसे चोर के डर से जंगल में भागने वाला व्यक्ति बाघ का शिकार बन जाता है, और बाघ के डर से बांबी में छिपने वाले को सांप डस लेता है, वैसे ही संकट से केवल बाहरी पलायन करने से मुक्ति नहीं मिलती।\n\nइसी प्रकार, मृत्यु या काल के भय से यदि कोई व्यक्ति केवल ऊपरी तौर पर भक्त का रूप धारण कर लेता है, तो भी उसके अपने कर्म उसे ग्रसने से नहीं छोड़ते।\n\nअंततः गुहेश्वरा के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन उन पाखंडियों और दिखावटी वेशभूषा धारण करने वालों की निरर्थकता को उजागर करता है, जो आंतरिक सत्य को जाने बिना अंततः मृत्यु के मुख का ग्रास बन जाते हैं।","mr":"हे वचन केवळ मृत्यूच्या आणि काळाच्या भीतीने स्वीकारलेल्या वरवरच्या भक्तीचे आणि ढोंगीपणाचे फोलपण स्पष्ट करते.\n\nज्याप्रमाणे चोराच्या भीतीने जंगलात लपणाऱ्याला वाघ खातो आणि वाघाच्या भीतीने वारुळात शिरणाऱ्याला साप दंश करतो, त्याचप्रमाणे केवळ संकटातून किंवा मृत्यूच्या भयाने पळवाट म्हणून स्वीकारलेला भक्तीचा मार्ग माणसाला त्याच्या कर्माच्या फेऱ्यातून वाचवू शकत नाही.\n\nअशा भीतीपोटी केलेल्या बाह्य वेशभूषेमुळे आणि दांभिकपणामुळे माणसाची मृत्यूच्या जबड्यातून सुटका होत नाही.\n\nगुहेश्वरा या नावाने परमतत्त्वाला उद्देशून हे वचन सांगते की, आंतरिक जाणिवेशिवाय केवळ भयापोटी भक्ताचे सोंग घेणाऱ्या ढोंगी लोकांचे आचरण आध्यात्मिकदृष्ट्या पूर्णपणे निरर्थक ठरते.","fr":"Ce vachana met en lumière la futilité d'une dévotion née de la peur de la mort plutôt que d'une véritable conscience spirituelle.\n\nÀ travers l'image de celui qui fuit un voleur pour finir dévoré par un tigre dans la forêt, ou qui cherche refuge dans une termitière pour être mordu par un serpent, le texte montre qu'on ne peut échapper à son sort par la simple fuite.\n\nDe même, embrasser la voie de la dévotion par seule crainte du temps et du trépas ne libère nullement l'être humain de l'emprise de son karma.\n\nEn s'adressant à Guheshwara, la Réalité suprême sans forme, le vachana dénonce ainsi l'hypocrisie de ceux qui ne revêtent qu'un déguisement spirituel factice, demeurant malgré leurs apparences de simples proies dans la gueule de la mort.","te":"ఈ వచనం ఆధ్యాత్మిక సాధన పేరుతో భయంతో వేషాలు వేసే కపట భక్తుల తీరును సునిశితంగా విమర్శిస్తోంది.\n\nదొంగలకు భయపడి అడవిలోకి పారిపోతే పులి తినకుండా వదిలిపెట్టదు, అలాగే పులికి భయపడి పుట్టలో దూరితే పాము కాటు వేయకుండా ఉండదు అనే సహజమైన పోలికలను ఇక్కడ ఉపయోగించారు.\n\nఅదేవిధంగా, మరణ భయంతో కేవలం పైపై వేషం కోసం భక్తుడిగా మారినంత మాత్రాన అతని కర్మఫలం అతడిని విడిచిపెట్టదని ఈ వచనం స్పష్టం చేస్తోంది.\n\nగుహేశ్వర అనే నిరాకార పరమచైతన్యాన్ని సంబోధిస్తూ, ఇలా మృత్యువు నోటికి ఆహారమైపోయే ఆడంబర వేషధారుల అజ్ఞానాన్ని ఏమని వర్ణించాలని ఈ వచనం ప్రశ్నిస్తోంది.","kn":"ಈ ವಚನವು ಭಯದಿಂದ ಆಧ್ಯಾತ್ಮಿಕ ಮಾರ್ಗಕ್ಕೆ ಬರುವವರ ಬಾಹ್ಯ ಆಡಂಬರ ಮತ್ತು ಕಪಟತನವನ್ನು ತೀಕ್ಷ್ಣವಾಗಿ ಪ್ರಶ್ನಿಸುತ್ತದೆ.\n\nಕಳ್ಳನಿಗೆ ಹೆದರಿ ಕಾಡಿಗೆ ಓಡಿದರೆ ಅಲ್ಲಿ ಹುಲಿ ತಿನ್ನದೆ ಬಿಡುವುದಿಲ್ಲ, ಹಾಗೆಯೇ ಹುಲಿಗೆ ಹೆದರಿ ಹುತ್ತದೊಳಗೆ ಅಡಗಿದರೆ ಅಲ್ಲಿ ಹಾವು ಕಚ್ಚದೆ ಬಿಡುವುದಿಲ್ಲ ಎಂಬ ಉದಾಹರಣೆಗಳ ಮೂಲಕ ಒಂದು ಭಯದಿಂದ ತಪ್ಪಿಸಿಕೊಳ್ಳಲು ಹೋಗಿ ಇನ್ನೊಂದು ಅಪಾಯಕ್ಕೆ ಸಿಲುಕುವ ಸ್ಥಿತಿಯನ್ನು ಇಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಅದೇ ರೀತಿ, ನಿಜವಾದ ಅರಿವಿಲ್ಲದೆ ಕೇವಲ ಸಾವಿಗೆ ಅಥವಾ ಕಾಲನಿಗೆ ಹೆದರಿ ಒಬ್ಬನು ಭಕ್ತನ ವೇಷ ತೊಟ್ಟರೆ, ಅವನನ್ನು ಕರ್ಮದ ಬಂಧನವು ಬಿಡುವುದಿಲ್ಲ.\n\nನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಗುಹೇಶ್ವರನನ್ನು ಸಾಕ್ಷಿಯಾಗಿರಿಸಿಕೊಂಡು, ಹೀಗೆ ಸಾವಿನ ಭಯದಿಂದ ಕೇವಲ ತೋರಿಕೆಯ ವೇಷ ಹಾಕಿಕೊಂಡು ಡಂಬಾಚಾರ ಮಾಡುವವರು ಕೊನೆಗೆ ಸಾವಿನ ಬಾಯಿಗೆ ತುತ್ತಾಗುತ್ತಾರೆಯೇ ಹೊರತು ಅವರಿಗೆ ನಿಜವಾದ ಬಿಡುಗಡೆ ಸಿಗುವುದಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":499,"o":"ಕಾಡುಗಿಚ್ಚೆದ್ದಡೆ ಅಡವಿಯೆ ಗುರಿ,\n ನೀರುಗಿಚ್ಚೆದ್ದಡೆ ಸಮುದ್ರವೆ ಗುರಿ,\n ಒಡಲುಗಿಚ್ಚೆದ್ದಡೆ ತನುವೆ ಗುರಿ,\n ಕಾಲಾಗ್ನಿಯೆದ್ದಡೆ ಲೋಕಂಗಳೆ ಗುರಿ,\n ಶಿವಶರಣರ ಮನದಲ್ಲಿ ಕೋಪಾಗ್ನಿಯೆದ್ದಡೆ ನಿಂದಕರೆ ಗುರಿ.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಮಾಯದ ಹೊಡೆಗಿಚ್ಚಿಂಗೆ\n ನಾನು ಗುರಿಯಲ್ಲ ಕೇಳಾ.","t":{"en":"When the forest fire rises, the forest itself is the target,\nwhen the submarine fire rises, the ocean itself is the target,\nwhen the fire of hunger rises, the body itself is the target,\nwhen the fire of time rises, the worlds themselves are the target,\nwhen the fire of wrath rises in the minds of Shiva's *Sharanas*, the slanderers themselves are the target.\nO Guheshwara, to the striking fire of your illusion,\nI am not the target, listen!","hi":"दावानल उठे तो वन ही लक्ष्य है,\nबड़वानल उठे तो समुद्र ही लक्ष्य है,\nजठराग्नि उठे तो तन ही लक्ष्य है,\nकालाग्नि उठे तो लोक ही लक्ष्य हैं,\nशिवशरणों के मन में क्रोधाग्नि उठे तो निंदक ही लक्ष्य हैं।\nहे गुहेश्वर, तुम्हारी माया की अंतर्दाह-अग्नि का\nमैं लक्ष्य नहीं हूँ, सुनो।","mr":"वणवा पेटला तर रानच त्याचे लक्ष्य ठरते,\nवडवानल पेटला तर समुद्रच त्याचे लक्ष्य ठरतो,\nजठराग्नी पेटला तर शरीरच त्याचे लक्ष्य ठरते,\nकालाग्नी पेटला तर सर्व लोकच त्याचे लक्ष्य ठरतात,\nशिवशरणांच्या मनात कोपाग्नी पेटला तर निंदकच त्याचे लक्ष्य ठरतात.\nहे गुहेश्वरा, तुमच्या मायेच्या पसरणाऱ्या आगीचे\nमी लक्ष्य नाही, हे ऐका.","fr":"Quand s'élève le feu des bois, c'est la forêt même qui est la cible,\nquand s'élève le feu des eaux, c'est l'océan même qui est la cible,\nquand s'élève le feu des entrailles, c'est le corps même qui est la cible,\nquand s'élève le feu du Temps, ce sont les mondes mêmes qui sont la cible,\nquand s'élève le feu de la colère dans l'esprit des Shiva-Sharanas, ce sont les détracteurs mêmes qui sont la cible.\nÔ Guheshwara, du feu foudroyant de votre Maya,\nje ne suis point la cible, écoutez !","te":"కార్చిచ్చు రేగితే అడవే దానికి గురి,\nబడబాగ్ని రేగితే సముద్రమే దానికి గురి,\nజఠరాగ్ని రేగితే తనువే దానికి గురి,\nకాలాగ్ని రేగితే లోకాలే దానికి గురి,\nశివశరణుల మనసులో కోపాగ్ని రేగితే నిందకులే దానికి గురి.\nఓ గుహేశ్వరా, మీ మాయ యొక్క రగిలే చిచ్చుకు\nనేను గురి కాను, వినండి.","kn":"ಕಾಡುಗಿಚ್ಚೆದ್ದಡೆ ಅಡವಿಯೆ ಗುರಿ,\n ನೀರುಗಿಚ್ಚೆದ್ದಡೆ ಸಮುದ್ರವೆ ಗುರಿ,\n ಒಡಲುಗಿಚ್ಚೆದ್ದಡೆ ತನುವೆ ಗುರಿ,\n ಕಾಲಾಗ್ನಿಯೆದ್ದಡೆ ಲೋಕಂಗಳೆ ಗುರಿ,\n ಶಿವಶರಣರ ಮನದಲ್ಲಿ ಕೋಪಾಗ್ನಿಯೆದ್ದಡೆ ನಿಂದಕರೆ ಗುರಿ.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಮಾಯದ ಹೊಡೆಗಿಚ್ಚಿಂಗೆ\n ನಾನು ಗುರಿಯಲ್ಲ ಕೇಳಾ."},"m":{"en":"This Vachana uses a series of vivid metaphors to show that every type of fire has its specific target of consumption: a forest fire consumes the woods, submarine fire consumes the ocean, the fire of hunger consumes the physical body, and the cosmic fire of time consumes the worlds.\n\nExtending this principle to the spiritual realm, it notes that when the fire of righteous anger arises in the minds of Shiva Sharanas, it is directed solely against slanderers and detractors.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Guheshwara, the Vachana culminates in a declaration of absolute spiritual transcendence.\n\nHaving risen above worldly illusion, the speaker asserts complete immunity to the sudden, consuming fire of Maya, affirming that an enlightened consciousness can never become its target.","hi":"इस वचन में अग्नि के विभिन्न रूपों और उनके निश्चित लक्ष्यों का उदाहरण देते हुए प्रबुद्ध शरण की माया से अतीत अवस्था को स्पष्ट किया गया है।\n\nजिस प्रकार दावाग्नि का लक्ष्य जंगल, बड़वाग्नि का लक्ष्य समुद्र, जठराग्नि (भूख) का लक्ष्य शरीर और प्रलय की कालाग्नि का लक्ष्य समस्त लोक होते हैं, उसी प्रकार जब शिवशरणों के मन में क्रोधाग्नि जाग्रत होती है, तो उसका लक्ष्य केवल निंदक ही होते हैं।\n\nअंतिम पंक्तियों में निराकार परमतत्त्व गुहेश्वर को संबोधित करते हुए यह गहरा आध्यात्मिक सत्य प्रकट किया गया है कि हर अग्नि का अपना एक लक्ष्य होता है, किंतु आत्मज्ञानी साधक माया रूपी अदृश्य अग्नि का लक्ष्य कभी नहीं बन सकता, क्योंकि वह माया के प्रभाव से पूर्णतः मुक्त है।","mr":"या वचनाचा मुख्य आशय असा आहे की, निसर्गातील आणि जीवनातील विविध प्रकारच्या अग्नीचे एक निश्चित लक्ष्य असते; जसे की वणव्याचे लक्ष्य अरण्य, पाण्यातील बडवानलाचे लक्ष्य समुद्र, जठराग्नीचे लक्ष्य शरीर आणि प्रलयकाळातील कालाग्नीचे लक्ष्य संपूर्ण जग हे असते.\n\nत्याचप्रमाणे, शिवशरणांच्या मनात जेव्हा संतापाचा अग्नी पेटतो, तेव्हा केवळ निंदकच त्याचे लक्ष्य ठरतात.\n\nमात्र, गुहेश्वर या नावाने संबोधल्या गेलेल्या परमतत्त्वाच्या मायेच्या छुपा अग्नीला आपण कधीही बळी पडणार नाही, असा ठाम आत्मविश्वास येथे व्यक्त झाला आहे.\n\nहे वचन स्पष्ट करते की, आत्मज्ञानी शरण हा सर्वसामान्य प्रापंचिक अग्नी आणि मायेच्या प्रभावापलीकडे गेलेला असल्यामुळे कोणतीही माया त्याला भुरळ घालू शकत नाही किंवा जाळू शकत नाही.","fr":"Ce vachana s'appuie sur la métaphore puissante de divers feux destructeurs — le feu de forêt, le feu sous-marin, le feu de la faim dans les entrailles et le feu cosmique de la fin des temps — pour illustrer que chaque flamme possède une cible précise qu'elle finit par consumer, qu'il s'agisse des bois, de l'océan, du corps ou des mondes.\n\nDans cette même logique implacable, lorsque le feu de la colère s'éveille dans l'esprit des Shivasharanas, ce sont les calomniateurs et les détracteurs de la voie spirituelle qui en deviennent la cible directe.\n\nToutefois, la portée philosophique essentielle de ce poème réside dans son affirmation finale : en s'adressant à la Réalité suprême sans forme évoquée sous le nom de Guheshwara, la voix spirituelle déclare avec une absolue fermeté être totalement hors d'atteinte des flammes soudaines et insidieuses de l'illusion (Maya).\n\nCe texte met ainsi en lumière la souveraineté intérieure d'une conscience éveillée qui, ayant transcendé les pièges du monde illusoire, demeure invulnérable à ses assauts.","te":"ఈ వచనం వివరిస్తున్నది ఏమిటంటే, ప్రకృతిలో రగిలే ప్రతి అగ్నికీ దానికి తగిన ఒక నిర్దిష్టమైన లక్ష్యం ఉంటుంది.\n\nఅడవిలో దావానలం చెలరేగితే అడవే దానికి గురవుతుంది, సముద్రంలో బడబాగ్ని పుడితే ఆ సాగరమే దానికి లక్ష్యమవుతుంది; అలాగే కడుపులో జఠరాగ్ని రగిలితే దేహం, ప్రళయకాలపు కాలాగ్ని చెలరేగితే సమస్త లోకాలూ దానికి ఆహుతవుతాయి.\n\nఅదే విధంగా, శివశరణుల మనసులో కోపాగ్ని జ్వలిస్తే వారికి ఆధ్యాత్మికంగా హాని తలపెట్టే నిందకులే దానికి గురవుతారు.\n\nఅయితే గుహేశ్వర అనే అంకితనామంతో సూచించబడిన నిరాకార పరమతత్త్వం కల్పించే మాయాగ్ని జ్వాలలకు మాత్రం తాను ఏమాత్రం గురి కాబోనని, ఆ మాయ తనను దహించలేదని ఈ వచనం నిశ్చయంగా ప్రకటిస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ಪ್ರಕೃತಿಯ ವಿವಿಧ ಬೆಂಕಿಗಳು ಹೇಗೆ ಆಯಾ ನೆಲೆಯನ್ನೇ ಸುಡುತ್ತವೆಯೋ, ಹಾಗೆಯೇ ಅರಿವಿನ ಸಾಧಕನಾದ ಶರಣನ ನಿಲುವು ಹೇಗಿರುತ್ತದೆ ಎಂಬುದನ್ನು ಬಹಳ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಕಾಡಿನ ಬೆಂಕಿಗೆ ಕಾಡು, ಸಮುದ್ರದ ಒಳಗಿನ ಕಿಚ್ಚಿಗೆ ಸಮುದ್ರ, ಹೊಟ್ಟೆಯ ಹಸಿವಿನ ಬೆಂಕಿಗೆ ದೇಹ, ಮತ್ತು ಪ್ರಳಯಕಾಲದ ಬೆಂಕಿಗೆ ಇಡೀ ಲೋಕವೇ ಗುರಿಯಾಗುವಂತೆ, ಶಿವಶರಣರ ಮನಸ್ಸಿನಲ್ಲಿ ಸತ್ಯದ ಪರವಾದ ಕೋಪದ ಕಿಚ್ಚು ಎದ್ದರೆ ಅದಕ್ಕೆ ಸತ್ಯವನ್ನು ನಿಂದಿಸುವವರೇ ಗುರಿಯಾಗುತ್ತಾರೆ.\n\nಆದರೆ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಗುಹೇಶ್ವರನ ಮಾಯೆಯಿಂದ ಹುಟ್ಟುವ ಭ್ರಮೆ ಅಥವಾ ಸಂಸಾರದ ಆಕರ್ಷಣೆಯೆಂಬ ಬೆಂಕಿಗೆ ತಾನು ಎಂದಿಗೂ ಬಲಿಯಾಗುವುದಿಲ್ಲ ಎಂದು ವಚನಕಾರರು ಇಲ್ಲಿ ದೃಢವಾಗಿ ಹೇಳಿದ್ದಾರೆ.\n\nಒಟ್ಟಾರೆಯಾಗಿ, ಪರಿಪೂರ್ಣ ಅರಿವನ್ನು ಸಾಧಿಸಿದ ಶರಣನು ಅಜ್ಞಾನ ಮತ್ತು ನಿಂದನೆಗಳನ್ನು ಎದುರಿಸಬಲ್ಲನೇ ಹೊರತು, ಪ್ರಾಪಂಚಿಕ ಮಾಯೆಯ ಉರಿಗೆ ಸಿಲುಕಿ ತನ್ನ ಎಚ್ಚರವನ್ನು ಕಳೆದುಕೊಳ್ಳಲಾರನು ಎಂಬ ಆಳವಾದ ತಾತ್ತ್ವಿಕ ಸತ್ಯವನ್ನು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ."}},{"no":500,"o":"ಕಾಯಕ್ಕೆ ಮಜ್ಜನ, ಪ್ರಾಣಕ್ಕೆ ಓಗರ\n ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಸುಳಿವ ಸುಳುಹುಳ್ಳನ್ನಕ್ಕ ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಗುಹೇಶ್ವರನೆಂಬ [ಲಿಂಗಕ್ಕೆ] ಆತ್ಮವುಳ್ಳನ್ನಕ್ಕ\n ಭಕ್ತಿಯ ಮಾಡಲೇ ಬೇಕು.","t":{"en":"Bathing for the body, food for the vital breath—\nthis one must certainly do.\nAs long as the moving breath stirs, this one must certainly do.\nTo the *Linga* called Guheshwara, as long as the soul abides,\ndevotion one must certainly offer.","hi":"काया को स्नान, प्राण को भोजन,\nयह करना ही चाहिए।\nजब तक गति का स्पंदन रहे, यह करना ही चाहिए।\nगुहेश्वर नामक लिंग की, जब तक आत्मा रहे,\nभक्ति करनी ही चाहिए।","mr":"कायेला स्नान, प्राणाला नैवेद्य—\nहे केलेच पाहिजे.\nवाहणारा श्वास असेपर्यंत हे केलेच पाहिजे.\nगुहेश्वर नावाच्या लिंगाची आत्मा असेपर्यंत\nभक्ती केलीच पाहिजे.","fr":"Le bain pour le corps, la nourriture pour le souffle vital :\ncela, il faut assurément l'accomplir.\nTant que demeure le mouvement du souffle qui circule, cela, il faut assurément l'accomplir.\nEnvers le Linga que l'on appelle Guheshwara, tant que demeure l'âme,\nil faut assurément accomplir la Bhakti.","te":"కాయానికి మజ్జనం, ప్రాణానికి ఓగరం\nదీనిని చేయనే వలెను.\nకదిలే ఊపిరి ఉన్నంతవరకు దీనిని చేయనే వలెను.\nగుహేశ్వరుడనే లింగానికి ఆత్మ ఉన్నంతవరకు\nభక్తిని చేయనే వలెను.","kn":"ಕಾಯಕ್ಕೆ ಮಜ್ಜನ, ಪ್ರಾಣಕ್ಕೆ ಓಗರ\n ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಸುಳಿವ ಸುಳುಹುಳ್ಳನ್ನಕ್ಕ ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಗುಹೇಶ್ವರನೆಂಬ [ಲಿಂಗಕ್ಕೆ] ಆತ್ಮವುಳ್ಳನ್ನಕ್ಕ\n ಭಕ್ತಿಯ ಮಾಡಲೇ ಬೇಕು."},"m":{"en":"This Vachana explains the natural and unavoidable necessities of both physical existence and spiritual consciousness.\n\nJust as the physical body requires cleansing and the vital life-force needs nourishment for as long as breath and movement persist, the inner self also has an essential need.\n\nFor as long as individual consciousness endures, it must engage in devotion towards the Formless Supreme Reality, addressed here as Guheshwara.\n\nThrough this parallel, the Vachana highlights that while caring for the body and breath is an inescapable requirement of living, sustaining the inner self through devotion to the Absolute is equally indispensable.","hi":"इस वचन का मूल भाव यह है कि जिस प्रकार शरीर की स्वच्छता के लिए स्नान और प्राणों को बनाए रखने के लिए भोजन नितांत आवश्यक है, उसी प्रकार आत्मा के लिए भक्ति भी अपरिहार्य है।\n\nजब तक शरीर में श्वास और जीवन का संचार है, तब तक देह और प्राण के इन स्वाभाविक धर्मों का पालन करना ही पड़ता है।\n\nइसी प्रकार, यह वचन स्पष्ट करता है कि जब तक भीतर चैतन्य या आत्मा का अस्तित्व है, तब तक गुहेश्वर रूपी निराकार परमतत्त्व के प्रति निरंतर भक्ति का भाव बनाए रखना ही सच्ची साधना है।","mr":"हे वचन मानवी देह, प्राण आणि आत्मा यांच्यातील नैसर्गिक गरज आणि आध्यात्मिक कर्तव्य यातील परस्परसंबंध स्पष्ट करते.\n\nशरीराच्या शुद्धतेसाठी स्नान आणि प्राणाच्या पोषणासाठी अन्न घेणे, या गोष्टी देहात श्वास आणि हालचाल असेपर्यंत करणे अत्यावश्यक असते.\n\nत्याचप्रमाणे, जोपर्यंत आपल्यात आत्म्याचे अस्तित्व आणि जाणीव शिल्लक आहे, तोपर्यंत गुहेश्वर या नावाने ओळखल्या जाणाऱ्या निराकार परमतत्त्वाची भक्ती करणे तितकेच अनिवार्य आहे.\n\nदेह आणि प्राणाच्या जतनासाठी जसे बाह्य नियम पाळावे लागतात, तसेच आत्म्याच्या सार्थकतेसाठी अखंड भक्तीची नितांत गरज असते, असा सखोल विचार यातून व्यक्त होतो.","fr":"Ce vachana met en lumière le caractère indispensable des besoins fondamentaux de l'existence humaine et de la vie spirituelle.\n\nTant que le mouvement du souffle vital persiste en nous, il est tout à fait naturel et nécessaire d'accorder le bain au corps physique et la nourriture au principe vital.\n\nDe la même manière, tant que la conscience intérieure demeure présente, il est essentiel de vouer une dévotion sincère au Linga désigné sous le nom de Guheshwara, c'est-à-dire à la Réalité suprême sans forme.\n\nLa portée spirituelle de ce vachana réside ainsi dans l'équilibre lucide entre l'entretien légitime de la vie matérielle et l'engagement intérieur constant envers le principe absolu.","te":"ఈ వచనం వివరిస్తున్నది ఏమిటంటే, మనిషి జీవించి ఉన్నంత కాలం శారీరక అవసరాలను, ఆధ్యాత్మిక సాధనను సమన్వయం చేసుకోవాలి.\n\nభౌతిక శరీరానికి శుభ్రత కోసం స్నానం, ప్రాణం నిలవడానికి ఆహారం ఎలాగైతే అనివార్యమో, జీవితపు కదలికలు ఉన్నంతవరకు ఈ దేహధర్మాలను తప్పక నిర్వర్తించాల్సిందే.\n\nఅదేవిధంగా, మనలో ఆత్మచైతన్యం ఉన్నంత కాలం గుహేశ్వర అనే అంకితనామంతో సూచించబడిన నిరాకార పరమతత్త్వం పట్ల నిరంతర భక్తిభావాన్ని కలిగి ఉండటం కూడా అంతే సహజమైన, తప్పనిసరి కర్తవ్యమని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ದೇಹದಲ್ಲಿ ಉಸಿರು ಮತ್ತು ಜೀವಂತ ಚಲನೆ ಇರುವವರೆಗೂ ದೇಹದ ಸ್ವಚ್ಛತೆಗಾಗಿ ಸ್ನಾನ ಹಾಗೂ ಪ್ರಾಣವನ್ನು ಉಳಿಸಿಕೊಳ್ಳುವುದಕ್ಕಾಗಿ ಆಹಾರವನ್ನು ಸೇವಿಸಲೇಬೇಕಾದುದು ಪ್ರಕೃತಿ ಸಹಜವಾದ ಅನಿವಾರ್ಯತೆ.\n\nಈ ಭೌತಿಕ ದೇಹ ಮತ್ತು ಪ್ರಾಣವನ್ನು ಪೋಷಿಸುವುದನ್ನು ನಿರ್ಲಕ್ಷಿಸಲು ಹೇಗೆ ಸಾಧ್ಯವಿಲ್ಲವೋ, ಹಾಗೆಯೇ ಒಳಗೆ ಅರಿವಿನ ಚೈತನ್ಯವಾದ ಆತ್ಮವು ಇರುವವರೆಗೂ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯನ್ನು ಕೂಡ ನಿರಂತರವಾಗಿ ಮಾಡಲೇಬೇಕು.\n\nಗುಹೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಾಕಾರ ಕುರುಹಾದ ಲಿಂಗದ ಮೂಲಕ, ಆತ್ಮವು ಇರುವವರೆಗೂ ಶುದ್ಧವಾದ ಭಕ್ತಿ ಮತ್ತು ಅನುಸಂಧಾನವನ್ನು ಮಾಡುವುದು ಸಹ ದೇಹಕ್ಕೆ ಸ್ನಾನ-ಆಹಾರಗಳಷ್ಟೇ ಸಹಜ ಹಾಗೂ ಕಡ್ಡಾಯವಾದ ಸಂಗತಿಯಾಗಿದೆ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}}]},
{"id":"s2","n":{"en":"Chennabasavanna","hi":"चेन्नबसवण्णा","mr":"चेन्नबसवण्णा","fr":"Chennabasavanna","te":"చెన్నబసవణ్ణ","kn":"ಚೆನ್ನಬಸವಣ್ಣ"},"v":[{"no":900,"o":"ವಾರವೇಳು ಕುಲ ಹದಿನೆಂಟು ಎಂಬರಯ್ಯಾ,\n ಅದ ನಾವು ಅಲ್ಲವೆಂಬೆವು.\n ಇರುಳೊಂದು ವಾರ, ಹಗಲೊಂದು ವಾರ,\n ಭವಿಯೊಂದು ಕುಲ, ಭಕ್ತನೊಂದು ಕುಲ,\n ನಾವು ಬಲ್ಲುದು ಕಾಣಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"They say there are seven days of the week and eighteen castes, O Lord;\nthat we declare is not so.\nNight is one day, and day is one day;\nthe worldly one is one caste, and the devotee is one caste—\nthis is what we know, you see, O Koodala Chennasangamadeva.","hi":"वार सात और कुल अठारह हैं, ऐसा कहते हैं, हे स्वामी,\nउसे हम नहीं कहते हैं।\nरात एक वार है, दिन एक वार है,\nभवि एक कुल है, भक्त एक कुल है,\nयही हम जानते हैं, देखो, हे कूडल चेन्नसंगमदेव।","mr":"हे प्रभो, वार सात आणि जाती अठरा आहेत असे लोक म्हणतात,\nत्याला आम्ही नाही म्हणतो.\nरात्र हा एक वार, दिवस हा एक वार,\nभवी ही एक जात, भक्त ही एक जात,\nहेच आम्ही जाणतो पाहून घ्या, हे कूडल चेन्नसंगमदेवा.","fr":"Ils disent qu'il y a sept jours et dix-huit castes, ô Seigneur,\nmais nous disons qu'il n'en est pas ainsi.\nLa nuit est un jour, le jour est un jour,\nle *Bhavi*, l'homme du monde, est une caste, le *Bhakta*, le dévot, est une caste :\nvoilà ce que nous savons, vois-tu, ô Koodala Chennasangamadeva.","te":"వారాలు ఏడు, కులాలు పద్దెనిమిది అని అంటారు ఓ స్వామీ,\nదానిని మేము కాదని అంటాము.\nరేయి ఒక వారం, పగలు ఒక వారం,\nభవి ఒక కులం, భక్తుడు ఒక కులం,\nమేము ఎరిగినది ఇదే సుమా, ఓ కూడల చెన్నసంగమదేవా.","kn":"ವಾರವೇಳು ಕುಲ ಹದಿನೆಂಟು ಎಂಬರಯ್ಯಾ,\n ಅದ ನಾವು ಅಲ್ಲವೆಂಬೆವು.\n ಇರುಳೊಂದು ವಾರ, ಹಗಲೊಂದು ವಾರ,\n ಭವಿಯೊಂದು ಕುಲ, ಭಕ್ತನೊಂದು ಕುಲ,\n ನಾವು ಬಲ್ಲುದು ಕಾಣಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ."},"m":{"en":"This Vachana rejects the conventional worldly classification of time into seven days of the week and society into eighteen castes.\n\nInstead of artificial calendar divisions, the Sharana perspective recognizes only two natural phases of time: night and day.\n\nSimilarly, rather than dividing humanity by birth-based castes, it acknowledges only two spiritual states of being: the Bhavi, who remains bound to worldly ignorance, and the Bhakta, who walks the path of spiritual awareness.\n\nAddressed to the Formless Supreme Reality through the ankitanama Kudalachannasangamadeva, the Vachana affirms that true human distinction lies in one's spiritual consciousness rather than social or astrological categories.","hi":"इस वचन का मूल भाव यह है कि समाज में प्रचलित काल और जाति के कृत्रिम विभाजन, जैसे कि सप्ताह के सात वार और अठारह कुल, पूर्णतः निराधार और अस्वीकार्य हैं।\n\nयहाँ यह स्पष्ट किया गया है कि समय का वास्तविक और स्वाभाविक रूप केवल दो भागों में है—एक दिन का वार और दूसरा रात का वार।\n\nइसी प्रकार, जन्म पर आधारित अनेक जातियों को नकारते हुए मानव समाज को केवल दो ही कुलों में देखा गया है—एक 'भवि' अर्थात् सांसारिक अज्ञान में डूबा हुआ व्यक्ति, और दूसरा 'भक्त' अर्थात् सत्य के मार्ग पर चलने वाला साधक।\n\nनिराकार परमतत्त्व कूडल चन्नसंगमदेव को संबोधित यह वचन जन्मगत जातिभेद और बाह्य मान्यताओं का खंडन करते हुए मनुष्य की आध्यात्मिक चेतना को ही उसकी वास्तविक पहचान मानता है।","mr":"हे वचन काळाचे आणि मानवी समाजाचे पारंपरिक तसेच कृत्रिम विभाजन स्पष्टपणे नाकारते.\n\nजगाच्या दृष्टीने आठवड्याचे सात वार आणि समाजाची अठरा कुळे किंवा जाती मानल्या जातात, परंतु शरणांचा विवेक या रूढ समजुती अमान्य करतो.\n\nनिसर्गाच्या चक्रानुसार केवळ दिवस आणि रात्र हे दोनच मुख्य काळ आहेत, आणि मानवामध्येही केवळ अज्ञानी संसारी (भवी) आणि सत्याच्या मार्गावर चालणारा निष्ठावंत (भक्त) असे दोनच वर्ग अस्तित्वात आहेत.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाच्या साक्षीने हे वचन स्पष्ट करते की, जन्मजात जाती-कुळांच्या पलीकडे जाऊन मानवाची खरी ओळख त्याच्या आध्यात्मिक जाणीवेवरून आणि भक्तीवरूनच ठरते.","fr":"Ce vachana rejette avec fermeté les divisions conventionnelles du monde, qui séparent le temps en sept jours de la semaine et la société en dix-huit castes traditionnelles.\n\nLa philosophie des Sharanas dépasse ces classements artificiels pour ramener la réalité à une vérité beaucoup plus simple et essentielle.\n\nSur le plan du temps, il n'existe véritablement que deux cycles fondamentaux : celui du jour et celui de la nuit.\n\nDe même, au regard de la Réalité suprême sans forme invoquée sous le nom de Koodalachannasangamadeva, l'humanité ne se divise pas selon la naissance, mais uniquement selon la conscience spirituelle : d'un côté le Bhavi, l'être tourné vers la mondanité, et de l'autre le Bhakta, le dévot éveillé à la vérité.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన సందేశం ఏమిటంటే, లోకంలో ప్రচলితంలో ఉన్న ఏడు వారాలు, పద్దెనిమిది కులాలు అనే సాంప్రదాయిక విభజనలను శరణుల తాత్త్విక దృక్పథం అంగీకరించదు.\n\nసహజమైన కాలగమనంలో పగలు ఒక వారం, రాత్రి ఒక వారం అన్నట్లుగా కేవలం రెండే విభాగాలు ఉన్నాయని ఈ వచనం స్పష్టం చేస్తోంది.\n\nఅదే విధంగా మానవ సమాజంలో జన్మ ఆధారంగా ఏర్పడిన కులభేదాలను నిరాకరిస్తూ, ప్రాపంచిక అజ్ఞానంలో ఉన్న ‘భవి’ ఒక కులం, ఆధ్యాత్మిక ఎరుక కలిగిన ‘భక్తుడు’ మరొక కులం అనే రెండు వర్గాలను మాత్రమే ఇది గుర్తిస్తుంది.\n\nకూడల చెన్నసంగమదేవ అనే నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, కృత్రిమమైన సామాజిక, కాల విభజనలకు అతీతంగా మనిషిలోని ఆధ్యాత్మిక చైతన్యాన్నే అసలైన కొలమానంగా చూడాలని ఈ వచనం తెలియజేస్తోంది.","kn":"ಲೋಕದಲ್ಲಿ ಸಾಮಾನ್ಯವಾಗಿ ಏಳು ವಾರಗಳು ಮತ್ತು ಹದಿನೆಂಟು ಜಾತಿ ಅಥವಾ ಕುಲಗಳಿವೆ ಎಂದು ಜನರು ಹೇಳುವ ಸಾಂಪ್ರದಾಯಿಕ ವಿಭಜನೆಯನ್ನು ಈ ವಚನವು ನೇರವಾಗಿ ನಿರಾಕರಿಸುತ್ತದೆ.\n\nಶರಣರ ದೃಷ್ಟಿಯಲ್ಲಿ ಕಾಲವನ್ನು ಏಳು ವಾರಗಳಾಗಿ ಒಡೆಯುವ ಬದಲು, ಪ್ರಕೃತಿಯ ಸಹಜ ನಿಯಮದಂತೆ ಹಗಲು ಮತ್ತು ರಾತ್ರಿ ಎಂಬ ಎರಡೇ ವಾರಗಳಿವೆ ಎಂದು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಅದೇ ರೀತಿ ಮನುಷ್ಯರನ್ನು ಹದಿನೆಂಟು ಜಾತಿಗಳಾಗಿ ವಿಂಗಡಿಸುವ ಬದಲು, ಅರಿವಿಲ್ಲದ ಲೌಕಿಕ ಪ್ರವೃತ್ತಿಯ 'ಭವಿ' ಮತ್ತು ಸತ್ಯದ ಅರಿವುಳ್ಳ 'ಭಕ್ತ' ಎಂಬ ಎರಡೇ ಕುಲಗಳಿವೆ ಎಂದು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ.\n\nಕೂಡಲಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಾಕ್ಷಿಯಾಗಿ, ಹುಟ್ಟಿನ ಆಧಾರದ ಜಾತಿಗಳು ಹಾಗೂ ಕಾಲದ ಕೃತಕ ಲೆಕ್ಕಾಚಾರಗಳನ್ನು ತಿರಸ್ಕರಿಸಿ, ಮನುಷ್ಯನ ಆಂತರಿಕ ಅರಿವು ಮತ್ತು ನಡವಳಿಕೆಯನ್ನೇ ನಿಜವಾದ ಮಾನದಂಡವಾಗಿ ನೋಡುವುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":901,"o":"ವಾಸಿಸುವ ನಾಸಿಕ ನೀನೆಂದರಿದೆ,\n ರುಚಿಸುವ ಜಿಹ್ವೆ ನೀನೆಂದರಿದೆ,\n ನೋಡುವ ನಯನ ನೀನೆಂದರಿದೆ,\n ಮುಟ್ಟುವ ತ್ವಕ್ಕು ನೀನೆಂದರಿದೆ,\n ಕೇಳುವ ಶ್ರೋತ್ರ ನೀನೆಂದರಿದೆ.\n ಇದು ಕಾರಣ, ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ನಾ ನಿಮ್ಮ ಬೇಡಲಿಲ್ಲಾಗಿ ಕೂರ್ತು ಕೊಡಲಿಲ್ಲ.","t":{"en":"I knew that you are the nose that smells,\nI knew that you are the tongue that tastes,\nI knew that you are the eye that sees,\nI knew that you are the skin that touches,\nI knew that you are the ear that hears.\nTherefore, O Koodala Chennasangayya,\nbecause I did not beg of you, I did not lovingly give.","hi":"सूँघनेवाली नासिका आप ही हैं, यह मैंने जाना,\nचखनेवाली जिह्वा आप ही हैं, यह मैंने जाना,\nदेखनेवाले नयन आप ही हैं, यह मैंने जाना,\nछूनेवाली त्वचा आप ही हैं, यह मैंने जाना,\nसुननेवाले श्रोत्र आप ही हैं, यह मैंने जाना।\nइस कारण, हे कूडल चेन्नसंगय्या,\nमैंने आपसे माँगा नहीं, इसलिए आपने प्रेम से दिया नहीं।","mr":"गंध घेणारी नासिका तूच आहेस असे मी जाणले,\nचव घेणारी जिव्हा तूच आहेस असे मी जाणले,\nपाहणारे नयन तूच आहेस असे मी जाणले,\nस्पर्श करणारी त्वचा तूच आहेस असे मी जाणले,\nऐकणारे श्रोत्र तूच आहेस असे मी जाणले.\nयाच कारणाने, हे कूडल चेन्नसंगय्या,\nमी तुझ्याकडे मागितले नाही, म्हणून प्रीतीने दिलेही नाही.","fr":"J'ai su que la narine qui hume, c'est vous,\nj'ai su que la langue qui goûte, c'est vous,\nj'ai su que l'œil qui voit, c'est vous,\nj'ai su que la peau qui touche, c'est vous,\nj'ai su que l'oreille qui entend, c'est vous.\nC'est pourquoi, Ô Koodala Chennasangayya,\npuisque je ne vous ai rien demandé, vous n'avez rien donné avec amour.","te":"వాసన చూసే నాసిక మీరేనని తెలుసుకున్నాను,\nరుచి చూసే జిహ్వ మీరేనని తెలుసుకున్నాను,\nచూసే నయనం మీరేనని తెలుసుకున్నాను,\nతాకే త్వక్కు మీరేనని తెలుసుకున్నాను,\nవినే శ్రోత్రం మీరేనని తెలుసుకున్నాను.\nఈ కారణంగా, ఓ కూడల చెన్నసంగయ్యా,\nనేను మిమ్మల్ని వేడుకోలేదు గనుక ప్రీతితో ఇవ్వలేదు.","kn":"ವಾಸಿಸುವ ನಾಸಿಕ ನೀನೆಂದರಿದೆ,\n ರುಚಿಸುವ ಜಿಹ್ವೆ ನೀನೆಂದರಿದೆ,\n ನೋಡುವ ನಯನ ನೀನೆಂದರಿದೆ,\n ಮುಟ್ಟುವ ತ್ವಕ್ಕು ನೀನೆಂದರಿದೆ,\n ಕೇಳುವ ಶ್ರೋತ್ರ ನೀನೆಂದರಿದೆ.\n ಇದು ಕಾರಣ, ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ನಾ ನಿಮ್ಮ ಬೇಡಲಿಲ್ಲಾಗಿ ಕೂರ್ತು ಕೊಡಲಿಲ್ಲ."},"m":{"en":"This Vachana expresses the profound spiritual realization that the Formless Supreme Consciousness is not a distant entity, but the very animating awareness functioning through every human sense organ.\n\nThe five senses—smell, taste, sight, touch, and hearing—are recognized as nothing other than the direct presence of Kudalachannasanga operating within the body.\n\nBecause the seeker has realized this complete non-duality between personal sensory experience and the Absolute, the conventional distinction between a worshipper who asks and a divine power that grants is entirely dissolved.\n\nIn this state of unified awareness, there is no sense of separation left from which one could either beg for grace or offer something in devotion.","hi":"इस वचन का केंद्रीय भाव यह है कि जब साधक को यह बोध हो जाता है कि शरीर की समस्त ज्ञानेंद्रियाँ स्वयं उस निराकार परमतत्त्व का ही स्वरूप हैं, तब बाह्य कामनाओं का अस्तित्व समाप्त हो जाता है।\n\nयहाँ स्पष्ट किया गया है कि सूँघने वाली नासिका, स्वाद लेने वाली जिह्वा, देखने वाले नेत्र, स्पर्श करने वाली त्वचा और सुनने वाले कान—इन सभी इंद्रियों में वही शुद्ध चैतन्य सक्रिय रूप से विद्यमान है।\n\nजब प्रत्येक इंद्रिय और उसके अनुभव में कूडल चन्नसंगम के रूप में संबोधित उस परम सत्य की ही अनुभूति हो जाती है, तो साधक और परमतत्त्व के बीच का द्वैत मिट जाता है।\n\nइस वचन का आध्यात्मिक महत्व यह है कि इस पूर्ण एकत्व की स्थिति में न तो साधक को परमतत्त्व से अलग से कुछ माँगने की आवश्यकता रहती है और न ही परमतत्त्व को अलग से कुछ प्रदान करने की, क्योंकि सब कुछ पहले से ही उस चैतन्य से परिपूर्ण है।","mr":"हे वचन मानवी ज्ञानेंद्रिये आणि निराकार परमतत्त्व यांच्यातील अद्वैत संबंध स्पष्ट करते.\n\nवास घेणारे नाक, चव घेणारी जीभ, पाहणारे डोळे, स्पर्श जाणणारी त्वचा आणि ऐकणारे कान या पंचेंद्रियांच्या मुळाशी कूडलचन्नसंगम हेच शुद्ध चैतन्य कार्यरत असल्याची सखोल जाणीव येथे व्यक्त झाली आहे.\n\nज्या अर्थी अनुभव घेणारी सर्व इंद्रिये आणि त्यामागील जाणीव हे परमतत्त्वच आहे, त्या अर्थी साधक आणि परमतत्त्व यांच्यात कोणताही दुरावा किंवा वेगळेपण उरत नाही.\n\nया एकरूपतेच्या जाणिवेमुळेच साधकाने त्या परम सत्याकडे वेगळे काही मागितले नाही आणि परमतत्त्वानेही प्रीतीने काही वेगळे देण्याची गरज उरली नाही, हा या वचनाचा गहन आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière la réalisation spirituelle selon laquelle la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasangama, n'est pas extérieure à l'être, mais constitue l'essence même des cinq sens.\n\nEn reconnaissant que l'odorat, le goût, la vue, le toucher et l'ouïe sont animés par cette Conscience pure, le chercheur comprend que ses propres facultés sensorielles ne font qu'un avec le Principe suprême.\n\nEn raison de cette unité absolue, toute dualité entre l'adorateur et l'Absolu s'efface, éliminant ainsi le besoin de formuler la moindre prière ou requête.\n\nLa portée philosophique de ce vachana réside dans ce dépassement de la relation transactionnelle : là où il n'y a plus de séparation pour demander quoi que ce soit, il n'y a plus non plus d'acte extérieur de don par complaisance.","te":"ఈ వచనం వివరిస్తున్న ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, సాధకుడు తన పంచేంద్రియాలైన ముక్కు, నాలుక, కన్ను, చర్మం, చెవి అనేవి కేవలం భౌతిక అవయవాలు కావని, అవి కూడలచెన్నసంగమదేవ అనే నిరాకార పరమచైతన్య స్వరూపాలేనని సంపూర్ణమైన ఎరుకతో గ్రహించాడు.\n\nవాసన చూసేది, రుచి చూసేది, వీక్షించేది, స్పృశించేది, వినేది అంతా ఆ నిర్గుణ పరమతత్త్వమేనని అనుభూతి చెందినప్పుడు, ఆ ఇంద్రియాలను వేరుగా తీసుకుని పరమసత్యానికి బాహ్యంగా సమర్పించాల్సిన అవసరం ఉండదు.\n\nఅందుకే ఆ పరమచైతన్యాన్ని తాను వేరుగా ఏదీ యాచించలేదని, తనలో ఉన్నదే అదైనందున ప్రీతితో తిరిగి సమర్పించడానికి కూడా తనకంటూ ప్రత్యేకంగా ఏమీ మిగలలేదని ఈ వచనం అద్వైత స్థితిని స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಮ್ಮ ದೇಹದ ಪಂಚೇಂದ್ರಿಯಗಳಾದ ವಾಸನೆ ಹಿಡಿಯುವ ಮೂಗು, ರುಚಿ ನೋಡುವ ನಾಲಿಗೆ, ನೋಡುವ ಕಣ್ಣು, ಮುಟ್ಟುವ ಚರ್ಮ ಮತ್ತು ಕೇಳುವ ಕಿವಿ ಇವೆಲ್ಲವೂ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಚೈತನ್ಯವೇ ಆಗಿವೆ ಎಂಬ ಅರಿವನ್ನು ಇಲ್ಲಿ ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.\n\nನಮ್ಮ ಇಂದ್ರಿಯಗಳ ಮೂಲಕ ನಡೆಯುವ ಪ್ರತಿಯೊಂದು ಅನುಭವವೂ ಆ ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವನ ಅಸ್ತಿತ್ವವೇ ಆಗಿದೆ ಎಂದು ತಿಳಿದಾಗ, ಇಂದ್ರಿಯಗಳಿಗೂ ಮತ್ತು ಆ ಪರಮಸತ್ಯಕ್ಕೂ ಯಾವುದೇ ಭೇದವಿಲ್ಲ ಎಂಬುದು ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ.\n\nಹೀಗೆ ನೋಡುವ, ಕೇಳುವ, ಅನುಭವಿಸುವ ಎಲ್ಲವೂ ಆ ಶುದ್ಧ ಚೈತನ್ಯವೇ ಆಗಿರುವಾಗ, ನಾನು ಪ್ರತ್ಯೇಕವಾಗಿ ನಿಂತು ಬೇಡುವುದಾದರೂ ಏನನ್ನು ಮತ್ತು ಆ ಪರಮತತ್ತ್ವವು ಪ್ರತ್ಯೇಕವಾಗಿ ಒಲಿದು ಕೊಡುವುದಾದರೂ ಏನನ್ನು ಎಂಬ ಆಳವಾದ ತಾತ್ವಿಕ ಪ್ರಶ್ನೆ ಇಲ್ಲಿ ಮೂಡುತ್ತದೆ.\n\nತನ್ನೊಳಗಿನ ಜೀವಚೈತನ್ಯವೇ ಪರಮಸತ್ಯವಾಗಿದೆ ಎಂದು ಅರಿತ ಮೇಲೆ, ಅಲ್ಲಿ ಕೊಡುವವರು ಮತ್ತು ಬೇಡುವವರು ಎಂಬ ಇಬ್ಬಗೆಯ ಭಾವನೆಯೇ ಉಳಿಯುವುದಿಲ್ಲ ಎಂಬ ಅಂಗ-ಲಿಂಗ ಸಾಮರಸ್ಯದ ಸ್ಥಿತಿಯನ್ನು ಈ ವಚನವು ಸರಳವಾಗಿ ತಿಳಿಸುತ್ತದೆ."}},{"no":902,"o":"ವೀರನಾದರೆ ಅಲಗಿನ ಮೊನೆಯಲ್ಲಿ ಕಾಣಬಹುದು,\n ಧೀರನಾದರೆ ತನ್ನ ಸೋಂಕಿದಲ್ಲಿ ಅರಿಯಬಹುದು,\n ಭಕ್ತನಾದರೆ ತಾಗು ನಿರೋಧದಲ್ಲಿ ಅರಿಯಬಹುದು.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ಸುಜ್ಞಾನಿಯಾದರೆ ಸುಳುಹಿನಲ್ಲಿ ಅರಿಯಬಹುದು.","t":{"en":"If one is a warrior, it can be seen at the point of a blade,\nIf one is a person of fortitude, it can be known when struck,\nIf one is a devotee, it can be known in reproof and restraint.\nO Koodala Chennasangayya,\nIf one is truly wise, it can be known in one's very bearing.","hi":"वीर हो तो तलवार की नोक पर देखा जा सकता है,\nधीर हो तो अपने पर प्रहार लगने पर जाना जा सकता है,\nभक्त हो तो अनुशासन की कसौटी में जाना जा सकता है।\nहे कूडल चेन्नसंगय्या,\nसुज्ञानी हो तो उसके आचरण के संकेत में जाना जा सकता है।","mr":"वीर असल्यास तलवारीच्या टोकावर पाहता येते,\nधीर असल्यास त्याला स्पर्श होताच जाणता येते,\nभक्त असल्यास आघात आणि रोधामध्ये जाणता येते.\nहे कूडल चेन्नसंगय्या,\nसुज्ञानी असल्यास त्याच्या खुणेवरून जाणता येते.","fr":"S'il est un vaillant guerrier, on peut le voir à la pointe de la lame,\ns'il est un homme ferme, on peut le reconnaître lorsqu'on le touche,\ns'il est un dévot, on peut le reconnaître dans le choc de l'épreuve et de l'opposition.\nÔ Koodala Chennasangayya,\ns'il est un être de vraie connaissance, on peut le reconnaître à son maintien même.","te":"వీరుడైతే కత్తిమొనపై చూడవచ్చు,\nధీరుడైతే తనను తాకినప్పుడు తెలుసుకోవచ్చు,\nభక్తుడైతే తాకిడి నిరోధంలో తెలుసుకోవచ్చు.\nఓ కూడల చెన్నసంగయ్యా,\nసుజ్ఞాని అయితే జాడలో తెలుసుకోవచ్చు.","kn":"ವೀರನಾದರೆ ಅಲಗಿನ ಮೊನೆಯಲ್ಲಿ ಕಾಣಬಹುದು,\n ಧೀರನಾದರೆ ತನ್ನ ಸೋಂಕಿದಲ್ಲಿ ಅರಿಯಬಹುದು,\n ಭಕ್ತನಾದರೆ ತಾಗು ನಿರೋಧದಲ್ಲಿ ಅರಿಯಬಹುದು.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ಸುಜ್ಞಾನಿಯಾದರೆ ಸುಳುಹಿನಲ್ಲಿ ಅರಿಯಬಹುದು."},"m":{"en":"This Vachana explains that a person's true inner stature is revealed only through lived conduct and moments of testing, rather than mere outward claims.\n\nJust as a warrior's valor is proven at the sharp point of a sword and a person of fortitude is recognized when directly confronted by adversity, a true devotee is known by their steadfastness in restraining worldly impulses and enduring trials.\n\nAddressing the Formless Supreme Consciousness as Kudalachannasanga, the Vachana concludes that a person of true spiritual wisdom (Sujnani) is effortlessly recognized through their very presence, demeanor, and subtle way of life.\n\nUltimately, it emphasizes that in Sharana philosophy, both devotion and enlightened awareness must naturally manifest in one's everyday actions and character.","hi":"इस वचन का केंद्रीय भाव यह है कि किसी भी व्यक्ति के वास्तविक गुण की पहचान केवल कोरी बातों से नहीं, बल्कि प्रत्यक्ष कसौटी और आचरण से होती है।\n\nजिस प्रकार एक सच्चे वीर की परख तलवार की धार पर और एक धैर्यवान (धीर) व्यक्ति की पहचान उस पर विपत्ति या प्रहार पड़ने पर होती है, उसी प्रकार एक सच्चे भक्त की परीक्षा सांसारिक आघातों और बाधाओं का सामना करने तथा उन पर नियंत्रण रखने से होती है।\n\nकूडल चन्नसंगम (निराकार परम सत्य) को संबोधित यह वचन स्पष्ट करता है कि यदि कोई वास्तव में सुज्ञानी है, तो उसकी इस आंतरिक प्रज्ञा की पहचान उसकी सहज उपस्थिति, आचरण और व्यवहार के संकेतों से ही हो जाती है।","mr":"या वचनाचा मुख्य आशय असा आहे की, कोणत्याही व्यक्तीच्या खऱ्या स्वरूपाची ओळख केवळ बाह्य शब्दांनी होत नाही, तर प्रत्यक्ष कृतीतून आणि कसोटीच्या प्रसंगांतूनच होते.\n\nखऱ्या शूराची परीक्षा समोर आलेल्या तलवारीच्या टोकावर आणि धैर्यवान व्यक्तीची पारख तिच्यावर आघात किंवा संकट कोसळल्यावरच्या तिच्या स्थिरतेतून होते.\n\nत्याचप्रमाणे, एका सच्च्या भक्ताची निष्ठा ही तो स्वतःवर व आपल्या विकारांवर कसा संयम व नियंत्रण ठेवतो यावरून ओळखता येते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला स्मरून हे वचन स्पष्ट करते की, खऱ्या सुज्ञानी व्यक्तीची ओळख तिच्या सहज हालचाली, वागणूक आणि तिच्या अस्तित्वातूनच आपोआप पटते.","fr":"Ce vachana met en lumière l’idée que la véritable nature d’un être ne se révèle pas par de simples revendications, mais à travers l’épreuve du réel et sa manière d’être au monde.\n\nTout comme la bravoure d’un guerrier se vérifie à la pointe de l’épée et la fermeté du courageux au moment où il est directement éprouvé, l’authenticité du dévot se reconnaît à sa capacité de maîtrise intérieure face aux obstacles et aux assauts de l’existence.\n\nEn s’adressant à la Réalité suprême sans forme sous l’ankitanama Koodalachannasanga, le poème souligne que l’être éveillé à la vraie connaissance spirituelle se distingue naturellement par la justesse de sa présence, de ses gestes et de son rayonnement.\n\nLa portée philosophique de ce vachana réside ainsi dans l’unité entre l’état intérieur et l’expression vécue : la sagesse véritable (Sujnana) n’est jamais abstraite, mais se rend perceptible dans le moindre mouvement de la vie quotidienne.","te":"ఒక మనిషిలోని నిజమైన అంతరంగ పరిపక్వతను అతడి ఆచరణ మరియు ప్రవర్తనల ద్వారానే గుర్తించగలమని ఈ వచనం స్పష్టం చేస్తోంది.\n\nనిజమైన వీరుడి శౌర్యం కత్తి మొన వద్ద, ధీరుడి స్థైర్యం అతడికి కష్టనష్టాలు లేదా సవాళ్లు ఎదురైనప్పుడు మాత్రమే బయటపడతాయి.\n\nఅలాగే, ఒక నిజమైన భక్తుడి నిষ্ঠ అతడు తన మనస్సును, ఇంద్రియాలను ఎంతగా నియంత్రించుకోగలడనే ఆత్మనిగ్రహంలోనే తెలుస్తుంది.\n\nనిరాకార పరమతత్త్వమైన కూడలచెన్నసంగమదేవా అని సంబోధిస్తూ, సత్యం తెలిసిన సుజ్ఞానిని మాత్రం అతడి కదలికలు, నడవడిక మరియు సహజమైన ఉనికి ద్వారానే సులభంగా పసిగట్టవచ్చని ఈ వచనం వివరిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಒಬ್ಬ ಮನುಷ್ಯನ ನಿಜವಾದ ಯೋಗ್ಯತೆ ಮತ್ತು ಆಂತರಿಕ ಸತ್ವವು ಬರೀ ಮಾತಿನಿಂದ ತಿಳಿಯುವುದಿಲ್ಲ, ಬದಲಾಗಿ ಅವನು ಎದುರಿಸುವ ಪರೀಕ್ಷೆಗಳು ಮತ್ತು ಅವನ ಸಹಜ ನಡವಳಿಕೆಯಿಂದ ಮಾತ್ರ ಬಯಲಾಗುತ್ತದೆ.\n\nಒಬ್ಬನು ನಿಜವಾದ ವೀರನಾಗಿದ್ದರೆ ಕತ್ತಿಯ ತುದಿಯಂತಹ ಅಪಾಯದ ಸಂದರ್ಭದಲ್ಲಿ ಅವನ ಶೌರ್ಯ ಕಾಣಿಸುತ್ತದೆ ಮತ್ತು ಧೀರನಾಗಿದ್ದರೆ ತನಗೆ ಕಷ್ಟ ಅಥವಾ ಆಘಾತ ತಟ್ಟಿದಾಗ ಅವನು ವಿಚಲಿತನಾಗದೆ ನಿಲ್ಲುವ ರೀತಿಯಿಂದ ಅವನ ಧೈರ್ಯವನ್ನು ಗುರುತಿಸಬಹುದು.\n\nಹಾಗೆಯೇ, ಒಬ್ಬ ಸಾಧಕನ ನಿಜವಾದ ಭಕ್ತಿಯು ಅವನಿಗೆ ಎದುರಾಗುವ ಅಡ್ಡಿ-ಆತಂಕಗಳು ಹಾಗೂ ವಿರೋಧಗಳನ್ನು ಅವನು ಹೇಗೆ ತಡೆದುಕೊಳ್ಳುತ್ತಾನೆ ಎಂಬುದರಲ್ಲಿ ತಿಳಿದುಬರುತ್ತದೆ.\n\nಕೂಡಲಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಾಕ್ಷಿಯಾಗಿ ಹೇಳುವುದಾದರೆ, ನಿಜವಾದ ಸುಜ್ಞಾನಿಯಾದವನನ್ನು ಅವನ ಬಾಹ್ಯ ಪ್ರದರ್ಶನದಿಂದಲ್ಲದೆ, ಅವನ ಸಣ್ಣ ಚಲನವಲನ, ಇಂಗಿತ ಮತ್ತು ಸಹಜವಾದ ನಡೆ-ನುಡಿಯ ಸುಳಿವಿನಿಂದಲೇ ಅರಿಯಬಹುದು ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":903,"o":"ವ್ರತಸ್ಥನರಿವು ಪ್ರಪಂಚಿನಲೆ ಹೋಯಿತ್ತು,\n ಭಾಷೆವಂತನರಿವು ವಂಚನೆಯಲೆ ಹೋಯಿತ್ತು,\n ನೇಮಸ್ಥನರಿವು ಸಂಕಲ್ಪದಲೆ ಹೋಯಿತ್ತು,\n ಶೀಲವಂತನರಿವು ಸೂತಕದಲೆ ಹೋಯಿತ್ತು,\n ಜಂಗಮದರಿವು ಬೇ[ಡಿದಾಗ]ಲೆ ಹೋಯಿತ್ತು,\n ಪ್ರಸಾದದರಿವು ಬೆರಕೆಯಲ್ಲಿ ಹೋಯಿತ್ತು.\n ಇಂತಿವು ಷಡುಸ್ಥಲದ ನಿರ್ಣಯಕ್ಕೆ ಸಲ್ಲದೆ ಹೋ[ದ]ವು,\n ಕೂಡಲಚೆನ್ನಸಂಗನಲ್ಲಿ.","t":{"en":"The awareness of the keeper of vows was lost in worldliness,\nthe awareness of the keeper of his word was lost in deceit,\nthe awareness of the observer of disciplines was lost in willful intent,\nthe awareness of the follower of strict conduct was lost in ritual pollution,\nthe awareness of the *Jangama* was lost the very moment he begged,\nthe awareness of *Prasada* was lost in admixture.\nThus all these proved unfit for the definitive truth of the *Shadusthala*,\nbefore Koodalachennasanga.","hi":"व्रतस्थ का बोध प्रपंच में ही चला गया,\nशपथधारी का बोध वंचना में ही चला गया,\nनियमस्थ का बोध संकल्प में ही चला गया,\nशीलवंत का बोध सूतक में ही चला गया,\nजंगम का बोध माँगते ही चला गया,\nप्रसाद का बोध मिलावट में चला गया।\nइस प्रकार ये षट्स्थल के निर्णय के योग्य न रहे,\nकूडलचेन्नसंग के आगे।","mr":"व्रतस्थाची जाणीव प्रपंचातच नाहीशी झाली,\nवचनबद्ध असलेल्याची जाणीव वंचनेतच नाहीशी झाली,\nनियमनिष्ठाची जाणीव संकल्पातच नाहीशी झाली,\nशीलवंताची जाणीव सूतकातच नाहीशी झाली,\nजंगमाची जाणीव मागताच नाहीशी झाली,\nप्रसादाची जाणीव भेसळीत नाहीशी झाली.\nअशा प्रकारे या गोष्टी षड्स्थलाच्या निर्णयास पात्र न ठरता वाया गेल्या,\nकूडलचेन्नसंगासमोर.","fr":"La conscience éveillée de celui qui observe les vœux s'est perdue dans la mondanité même,\nla conscience éveillée de celui qui tient parole s'est perdue dans la tromperie même,\nla conscience éveillée de celui qui suit la règle s'est perdue dans le désir intentionnel même,\nla conscience éveillée de l'homme de pure conduite s'est perdue dans la souillure rituelle du Sutaka même,\nla conscience éveillée du Jangama s'est perdue à l'instant même où il mendie,\nla conscience éveillée du Prasada s'est perdue dans l'adultération.\nAinsi, toutes ces choses sont devenues impropres à l'accomplissement définitif des six étapes du Shatsthala,\nen présence de Koodalachennasanga.","te":"వ్రతస్థుని ఎరుక ప్రపంచంలోనే పోయింది,\nబాసగలవాని ఎరుక వంచనలోనే పోయింది,\nనియమస్థుని ఎరుక సంకల్పంలోనే పోయింది,\nశీలవంతుని ఎరుక సూతకంలోనే పోయింది,\nజంగముని ఎరుక యాచించినప్పుడే పోయింది,\nప్రసాదపు ఎరుక కలగలుపులో పోయింది.\nఇలా ఇవి షట్స్థల నిర్ణయానికి చెల్లక పోయాయి,\nకూడలచెన్నసంగని సన్నిధిలో.","kn":"ವ್ರತಸ್ಥನರಿವು ಪ್ರಪಂಚಿನಲೆ ಹೋಯಿತ್ತು,\n ಭಾಷೆವಂತನರಿವು ವಂಚನೆಯಲೆ ಹೋಯಿತ್ತು,\n ನೇಮಸ್ಥನರಿವು ಸಂಕಲ್ಪದಲೆ ಹೋಯಿತ್ತು,\n ಶೀಲವಂತನರಿವು ಸೂತಕದಲೆ ಹೋಯಿತ್ತು,\n ಜಂಗಮದರಿವು ಬೇ[ಡಿದಾಗ]ಲೆ ಹೋಯಿತ್ತು,\n ಪ್ರಸಾದದರಿವು ಬೆರಕೆಯಲ್ಲಿ ಹೋಯಿತ್ತು.\n ಇಂತಿವು ಷಡುಸ್ಥಲದ ನಿರ್ಣಯಕ್ಕೆ ಸಲ್ಲದೆ ಹೋ[ದ]ವು,\n ಕೂಡಲಚೆನ್ನಸಂಗನಲ್ಲಿ."},"m":{"en":"This Vachana examines how true spiritual awareness (Arivu) is lost when religious disciplines and noble principles are compromised by underlying worldly weaknesses and inner contradictions.\n\nThe Vachana points out that the awareness of one observing sacred vows is lost in worldly entanglement, the pledge-keeper's integrity is ruined by deceit, the practitioner of strict rules falls prey to calculated desires, and the seeker of purity becomes trapped in notions of ritual pollution.\n\nSimilarly, the spiritual stature of a Jangama—an enlightened seeker and guide—is diminished the moment they resort to begging, and the sanctity of Prasada is lost when it becomes tainted by impurity or discrimination.\n\nUltimately, the Vachana concludes that such compromised practices fail to meet the true standard of the six-fold spiritual path (Shatsthala) and have no place in the realization of the Supreme Reality, Kudalachannasanga.","hi":"इस वचन का केंद्रीय भाव यह है कि बाह्य नियमों और आचरणों में उलझकर जब आत्मिक चेतना या सजगता नष्ट हो जाती है, तब साधना का वास्तविक उद्देश्य ही समाप्त हो जाता है।\n\nयह वचन स्पष्ट करता है कि यदि व्रतधारी का बोध सांसारिक मोह में, वचनबद्ध व्यक्ति का बोध छल-कपट में, नियम का पालन करने वाले का बोध मन की कामनाओं में, और सदाचारी का बोध छूत-अछूत या सूतक के भ्रम में खो जाए, तो उनकी साधना निरर्थक हो जाती है।\n\nइसी प्रकार, आध्यात्मिक ज्ञान का प्रसार करने वाले त्यागी जंगम साधक की गरिमा याचना करने से और प्रसाद की शुद्धता सांसारिक मिलावट से नष्ट हो जाती है।\n\nकूडलचेन्नसंगम रूपी निराकार परमतत्त्व की प्राप्ति के मार्ग में ऐसे खंडित और दिखावटी आचरण षट्स्थल दर्शन की कसौटी पर कभी खरे नहीं उतर सकते।","mr":"हे वचन आध्यात्मिक साधनेतील बाह्य आचरण आणि आंतरिक शुद्ध भान (अरीवु) यांमधील विरोधाभासावर प्रकाश टाकते.\n\nव्रत करणाऱ्याची जाणीव प्रपंचाच्या गुंत्यात, वचनबद्ध साधकाची जाणीव फसवणुकीत, नियम पाळणाऱ्याची जाणीव मनातील संकल्पांत आणि शीलवंताची जाणीव सुतकाच्या भ्रमात अडकून नष्ट होते.\n\nत्याचप्रमाणे, विरक्त असायला हव्या असलेल्या जंगम साधकाची जाणीव जेव्हा तो इतरांकडे याचना करतो तेव्हा संपते आणि प्रसादाचे पवित्र भान भेसळीच्या वृत्तीमुळे लोप पावते.\n\nकूडलचन्नसंगम या निराकार परमतत्त्वाच्या सान्निध्यात, अशा दोषांनी युक्त असलेल्या या गोष्टी षट्स्थलाच्या अंतिम आध्यात्मिक कसोट्यांवर कधीच पात्र ठरू शकत नाहीत.","fr":"Ce vachana met en lumière la manière dont la conscience spirituelle véritable, l'Arivu, se perd lorsque la pratique religieuse est corrompue par des compromis intérieurs et extérieurs.\n\nIl explique que l'observance des vœux s'égare dans la mondanité, la parole donnée dans la tromperie, la discipline rituelle dans les intentions intéressées et la pureté morale dans l'obsession de la souillure.\n\nDe même, la dignité spirituelle du Jangama — le renonçant et guide spirituel éclairé — s'évanouit dès lors qu'il mendie ou sollicite autrui, tout comme la sacralité du Prasada se dissout lorsqu'il est dénaturé par le mélange et l'impureté.\n\nLa portée spirituelle de ce texte réside dans le constat que ces pratiques dégradées ne répondent plus à l'exigence véritable de la voie des six étapes spirituelles, le Shatsthala, en la Réalité suprême sans forme invoquée sous le nom de Koodalachannasanga.","te":"ఆధ్యాత్మిక సాధనలో ఉండే వివిధ ఆచారాలు, నియమాలు తమలోని నిజమైన అంతరంగ ఎరుకను కోల్పోయి ఎలా యాంత్రికంగా మారిపోతాయో ఈ వచనం స్పష్టంగా వివరిస్తోంది.\n\nలౌకిక వ్యామోహంలో పడటం వల్ల వ్రతనిష్ఠాపరుడి ఎరుక, వంచన వల్ల వచనబద్ధుడి ఎరుక, కేవలం కోరికలతో కూడిన సంకల్పాల వల్ల నియమవంతుడి ఎరుక, మైల లేదా సూతక భావనల వల్ల శీలవంతుడి ఎరుక నశించిపోతున్నాయని ఇక్కడ సున్నితంగా విమర్శించబడింది.\n\nఅలాగే జంగముడు యాచించిన మరుక్షణమే అతని ఆధ్యాత్మిక ఎరుక అంతరిస్తుందని, ప్రసాద తత్త్వపు ఎరుక కల్తీ లేదా భేదభావాల కలయిక వల్ల తన విలువను కోల్పోతుందని ఈ వచనం తెలియజేస్తోంది.\n\nఈ విధంగా తమ మూల చైతన్యాన్ని కోల్పోయిన బాహ్య ఆచారాలు నిరాకార పరమతత్త్వమైన కూడలచెన్నసంగమ తత్త్వంలో షట్స్థల సిద్ధాంతపు పరమార్థానికి ఏమాత్రం తగినవి కావని ఈ వచనం తేల్చి చెబుతోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯಲ್ಲಿ ತೊಡಗಿರುವವರ ಆಂತರಿಕ ಅರಿವು ಯಾವ ರೀತಿಯ ದೋಷಗಳಿಂದಾಗಿ ನಾಶವಾಗಿಹೋಗುತ್ತದೆ ಎಂಬುದನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ತೋರಿಸಲಾಗಿದೆ.\n\nವ್ರತವನ್ನು ಹಿಡಿದವನು ಲೌಕಿಕ ಪ್ರಪಂಚದ ವ್ಯಾಮೋಹಕ್ಕೆ ಒಳಗಾದಾಗ, ಕೊಟ್ಟ ಮಾತಿಗೆ ಬದ್ಧನಾದವನು ಮೋಸಕ್ಕಿಳಿದಾಗ, ನಿಯಮಗಳನ್ನು ಪಾಲಿಸುವವನು ಮನಸ್ಸಿನ ಬಯಕೆಗಳಿಗೆ ಸಿಲುಕಿದಾಗ ಮತ್ತು ಶೀಲವಂತನು ಮಡಿ-ಮೈಲಿಗೆಯಂತಹ ಸೂತಕದ ಭಾವನೆಗಳಲ್ಲಿ ಮುಳುಗಿದಾಗ ಅವರೊಳಗಿನ ನಿಜವಾದ ಅರಿವು ಕಳೆದುಹೋಗುತ್ತದೆ.\n\nಅದೇ ರೀತಿ, ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕನಾದ ಜಂಗಮನ ಅರಿವು ಇನ್ನೊಬ್ಬರ ಮುಂದೆ ಕೈಚಾಚಿ ಬೇಡಿದ ತಕ್ಷಣವೇ ಹೊರಟುಹೋಗುತ್ತದೆ ಮತ್ತು ಪರಿಶುದ್ಧವಾಗಿರಬೇಕಾದ ಪ್ರಸಾದದ ಅರಿವು ಅಶುದ್ಧವಾದ ಕಲಬೆರಕೆಯಿಂದಾಗಿ ನಷ್ಟವಾಗುತ್ತದೆ.\n\nಹೀಗೆ ಆಂತರಿಕ ಶುದ್ಧತೆಯನ್ನೇ ಕಳೆದುಕೊಂಡ ಈ ಆರು ಬಗೆಯ ಆಚರಣೆಗಳು ಕೂಡಲಚೆನ್ನಸಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ನೆಲೆಯಲ್ಲಿ ಷಟ್‌ಸ್ಥಲ ಸಾಧನೆಯ ನಿಜವಾದ ತಾತ್ವಿಕ ನಿರ್ಣಯಕ್ಕೆ ಎಂದಿಗೂ ಒಪ್ಪಿಗೆಯಾಗುವುದಿಲ್ಲ ಎಂಬುದೇ ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":904,"o":"ಶರಣನೆನಿಸಿಕೊಂಬುದು ಕರ ಅರಿದು ನೋಡಯ್ಯಾ!\n ಸತ್ಯಸದ್ಭಕ್ತರೊಳಡಗಿ ತನ್ನ ಕುರುಹ ಲೋಕಕ್ಕೆ ತೋರದಿರಬೇಕು.\n ಸಕಲಜೀವರಾಶಿಗಳಿಗೆ ರೋಷ ಹರುಷವ ತಾಳದಿರಬೇಕು.\n ಇಂತಪ್ಪ ಶರಣನಲ್ಲಿ ಸನ್ನಿಹಿತ ನಮ್ಮ ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ.","t":{"en":"To be called a *Sharana* is exceedingly rare, behold, O Lord!\nHidden among true and virtuous devotees, one must not display one's own mark to the world.\nToward the multitude of all living beings, one must bear neither wrath nor elation.\nIn such a *Sharana*, our Koodala Chennasangamadeva abides ever near.","hi":"शरण कहलाना अत्यंत कठिन है, देखो भाई!\nसत्य-सद्भक्तों में छिपकर, अपनी पहचान संसार को न दिखानी चाहिए।\nसकल जीवराशियों के प्रति रोष और हर्ष न धारण करना चाहिए।\nऐसे शरण में सन्निहित हैं हमारे कूडल चेन्नसंगमदेव।","mr":"शरण म्हणवून घेणे अत्यंत कठीण आहे, पहा हे प्रभो!\nसत्य सद्भक्तांमध्ये लीन राहून आपली खूण जगाला दाखवू नये.\nसकल जीवराशींविषयी रोष आणि हर्ष बाळगू नये.\nअशा या शरणाच्या ठायी आमचे कूडल चेन्नसंगमदेव सन्निहित आहेत.","fr":"Le fait d'être appelé un Sharana est extrêmement difficile, vois-tu, mon frère !\nS'effaçant parmi les vrais et vertueux dévots, il ne doit point montrer sa propre marque au monde.\nEnvers la multitude de tous les êtres vivants, il ne doit éprouver ni colère ni exaltation.\nAuprès d'un tel Sharana demeure présent notre Koodala Chennasangamadeva.","te":"శరణుడనిపించుకొనుట మిక్కిలి అరుదు సుమా, ఓ సోదరా!\nసত্যసద్భక్తులలో ఒదిగి ఉండి, తన గుರುతును లోకానికి చూపకుండా ఉండాలి.\nసకల జీవరాశుల పట్ల రోషాన్నీ హర్షాన్నీ వహించకుండా ఉండాలి.\nఇటువంటి శరణుని యందు సన్నిహితుడై ఉంటాడు మన కూడల చెన్నసంగమదేవుడు.","kn":"ಶರಣನೆನಿಸಿಕೊಂಬುದು ಕರ ಅರಿದು ನೋಡಯ್ಯಾ!\n ಸತ್ಯಸದ್ಭಕ್ತರೊಳಡಗಿ ತನ್ನ ಕುರುಹ ಲೋಕಕ್ಕೆ ತೋರದಿರಬೇಕು.\n ಸಕಲಜೀವರಾಶಿಗಳಿಗೆ ರೋಷ ಹರುಷವ ತಾಳದಿರಬೇಕು.\n ಇಂತಪ್ಪ ಶರಣನಲ್ಲಿ ಸನ್ನಿಹಿತ ನಮ್ಮ ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ."},"m":{"en":"This Vachana explains that earning the title of a true Sharana is an extraordinarily difficult spiritual achievement, not merely a social identity.\n\nA genuine seeker must dissolve the ego by merging quietly into the company of truthful devotees, completely concealing any personal trace or outward display of spiritual superiority from the world.\n\nFurthermore, such a person must cultivate inner balance toward all living beings, remaining free from the dual impulses of anger and elation.\n\nThe Vachana concludes that the Formless Supreme Consciousness, addressed here as Kudalachannasangamadeva, abides intimately within a Sharana who embodies this quiet humility and emotional steadiness.","hi":"इस वचन का केंद्रीय भाव यह है कि एक सच्चा 'शरण' कहलाना और उस अवस्था को जीना अत्यंत कठिन व दुर्लभ साधना है।\n\nसच्चे शरण का लक्षण यह है कि वह सत्यनिष्ठ सद्भक्तों के बीच सहज रूप से घुल-मिलकर रहता है और संसार के सामने अपनी अलग पहचान, श्रेष्ठता या बाहरी चिह्न का प्रदर्शन नहीं करता।\n\nइसके साथ ही, वह समस्त जीव-जगत के प्रति किसी भी प्रकार के क्रोध या अति-हर्ष (राग-द्वेष) के भाव से पूर्णतः मुक्त रहता है।\n\nवचन का आध्यात्मिक निष्कर्ष यह है कि जो साधक इस प्रकार अहंकारशून्य और समभाव में स्थित होता है, उसी सच्चे शरण के भीतर निराकार परमतत्त्व 'कूडल चन्नसंगमदेव' का सदैव वास होता है।","mr":"हे वचन स्पष्ट करते की स्वतःला 'शरण' म्हणवून घेणे ही अत्यंत कठीण आणि सूक्ष्म साधना आहे.\n\nखऱ्या शरणाने आपले स्वतंत्र अस्तित्व आणि अहंभाव बाजूला सारून, सद्भक्तांच्या समूहामध्ये इतके एकरूप होऊन जावे की जगाला त्याची वेगळी ओळख जाणवू नये.\n\nतसेच, प्राणिमात्रांच्या बाबतीत त्याने राग किंवा हर्ष यांसारख्या द्वंद्वांच्या पलीकडे जाऊन समभावाने वागले पाहिजे.\n\nअशा निरहंकारी आणि समदर्शी शरणाच्या ठायीच कूडलचन्नसंगमदेव या नावाने संबोधले जाणारे परमतत्त्व अखंड वास करते, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière la très haute exigence spirituelle qu'implique le fait d'être reconnu comme un véritable Sharana.\n\nIl explique qu'un tel être doit demeurer humblement immergé parmi les dévots sincères et véridiques, en effaçant toute trace de son ego ou de sa propre importance aux yeux du monde.\n\nDe plus, il lui faut cultiver une égalité d'âme parfaite envers l'ensemble des êtres vivants, en se gardant aussi bien de la colère que de l'exaltation.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation que la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasangamadeva, demeure intimement présente en un Sharana d'une telle pureté intérieure.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నిజమైన శరణుడనిపించుకోవడం సామాన్యమైన విషయం కాదు; అది ఎంతో దుర్లభమైన స్థితి.\n\nఆ స్థితిని పొందగోరే సాధకుడు సత్యవంతులైన సద్భక్తుల సమూహంలో తానుగా ఒదిగిపోయి, తన ప్రత్యేక ఉనికిని గాని, గొప్పతనాన్ని గాని లోకానికి ప్రదర్శించుకోకూడదు.\n\nఅంతేకాక, సకల జీవరాశుల పట్ల కోపతాపాలు గాని, పొంగిపోయే హర్షాతిరేకాలు గాని లేకుండా సమభావంతో మెలగాలి.\n\nఇలాంటి నిరహంకార, సమచిత్త స్థితిని సంతరించుకున్న శరణునిలోనే నిరాకార పరమతత్త్వమైన కూడల చెన్నసంగమదేవ ఎల్లప్పుడూ సన్నిహితమై ఉంటుందని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ನಿಜವಾದ ಶರಣನೆಂದು ಅನಿಸಿಕೊಳ್ಳುವುದು ಅಷ್ಟು ಸುಲಭವಲ್ಲ, ಅದೊಂದು ಬಹಳ ಕಠಿಣವಾದ ಸಾಧನೆ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.\n\nನಿಜವಾದ ಶರಣನಾದವನು ಸತ್ಯವಂತರಾದ ಸದ್ಭಕ್ತರ ನಡುವೆ ಅವರಲ್ಲಿ ಒಬ್ಬನಾಗಿ ಬೆರೆತುಕೊಂಡು, ತನ್ನ ಹಿರಿಮೆ ಅಥವಾ ಪ್ರತ್ಯೇಕ ಗುರುತನ್ನು ಜಗತ್ತಿಗೆ ತೋರಿಸಿಕೊಳ್ಳದಂತೆ ಅಹಂಕಾರರಹಿತನಾಗಿ ಬದುಕಬೇಕು.\n\nಇಷ್ಟೇ ಅಲ್ಲದೆ, ಜಗತ್ತಿನ ಎಲ್ಲಾ ಜೀವರಾಶಿಗಳ ಬಗ್ಗೆಯೂ ಕೋಪವಾಗಲಿ ಅಥವಾ ಅತಿಯಾದ ಹಿಗ್ಗುವಿಕೆಯಾಗಲಿ ಇಲ್ಲದೆ ಸಮಚಿತ್ತದಿಂದ ಇರಬೇಕು.\n\nಇಂತಹ ನಿರಹಂಕಾರ ಮತ್ತು ಸಮಭಾವವನ್ನು ಹೊಂದಿರುವ ಶರಣನಲ್ಲಿಯೇ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವನು ನೆಲೆಸಿರುತ್ತಾನೆ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ಆಶಯವಾಗಿದೆ."}},{"no":905,"o":"ಶರಣ ಶರಣನ ಕಂಡು,\n ‘ಶರಣು’ ಎಂದು ಕರವ ಮುಗಿವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಶರಣನ ಕಂಡು,\n ಪಾದವಿಡಿದು ವಂದಿಸುವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಚರಣವ ಪಿಡಿಯದೆ\n ಕಂಡೂ ಕಾಣದೆ ಪೋದನಾದಡೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗನ ಶರಣರು ಮನ್ನಿಸರಯ್ಯಾ.","t":{"en":"When a *Sharana* sees a *Sharana*,\nto fold one's hands and say \"*Sharanu*\" is the mark of devotion.\nWhen a *Sharana* sees a *Sharana*,\nto clasp the feet and bow in reverence is the mark of devotion.\nWithout clasping the feet of a *Sharana*,\nif one walks away as though not seeing even after seeing,\nthe *Sharanas* of Koodala Chennasanga will not forgive him, O Lord.","hi":"शरण का शरण को देखकर,\n‘शरणु’ कहकर हाथ जोड़ना ही भक्ति का लक्षण है।\nशरण का शरण को देखकर,\nचरण पकड़कर वंदना करना ही भक्ति का लक्षण है।\nशरण के चरण न पकड़कर,\nदेखते हुए भी अनदेखा कर चला जाए तो,\nकूडल चेन्नसंगम के शरण उसे स्वीकार नहीं करते, हे स्वामी।","mr":"शरणाने शरणाला पाहून,\n‘शरणु’ म्हणून कर जोडणे हेच भक्तीचे लक्षण आहे.\nशरणाने शरणाला पाहून,\nपाय धरून वंदन करणे हेच भक्तीचे लक्षण आहे.\nशरणाचे चरण न धरता,\nपाहूनही न पाहिल्यासारखे करून निघून गेल्यास,\nकूडल चेन्नसंगाचे शरण त्याला मान देणार नाहीत, हे प्रभो.","fr":"Lorsqu'un Sharana voit un autre Sharana,\ndire « Sharanu » et joindre les mains, voilà la marque de la Bhakti.\nLorsqu'un Sharana voit un autre Sharana,\ntoucher ses pieds et le saluer avec révérence, voilà la marque de la Bhakti.\nSi, sans toucher les pieds du Sharana,\nil s'en va en feignant de ne pas voir tout e
