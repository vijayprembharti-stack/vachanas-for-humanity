"Ce vachana d'Ambigara Chowdayya dénonce avec vigueur l'hypocrisie de ceux qui prétendent se tourner vers le divin tout en menant une vie dépourvue de toute discipline intérieure.\n\nLe poème met en lumière le comportement de l'individu qui se livre à des excès alimentaires, gaspille son temps en bavardages futiles et agit uniquement selon ses caprices et ses impulsions égoïstes.\n\nPrétendre méditer sur Shiva, c'est-à-dire la Réalité suprême sans forme, après s'être ainsi abandonné à l'inconscience et aux plaisirs mondains, relève de la pure illusion.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation directe qu'une quête spirituelle authentique exige une maîtrise de soi constante et une conduite juste, sans lesquelles la grâce de la Conscience pure demeure totalement inaccessible."}},{"no":1383,"o":"ಅಯ್ಯಾ!\n ಪಾಷಾಣಕ್ಕೆ ಗಿರಿ ಸವೆದವು.\n ಪತ್ರೆಗೆ ತರು ಸವೆದವು.\n ಸಪ್ತಸಾಗರಂಗಳು ಮಜ್ಜನಕ್ಕೆ ಸವೆದವು.\n ಅಗ್ನಿ ಧೂಪಕ್ಕೆ ಸವೆಯಿತ್ತು.\n ವಾಯು ಕಂಪಿತಕ್ಕೆ ಸವೆಯಿತ್ತು.\n ಉಘೆ! ಚಾಂಗು ಭಲಾ! ಎಂಬ ಶಬ್ದ ಸವೆಯಿತ್ತು.\n ಎನಗಿನ್ನೆಂತೊ.\n ಉಮೇಶನ ಶರಣರು\n ಮಹಮನೆಯಲ್ಲಿ ಶಿವಲಿಂಗಾರ್ಚನೆಗೆ ಕುಳ್ಳಿರ್ದಡೆ,\n ನಾನವರ ಪಾದರಕ್ಷೆಯ\n ಕಾಯ್ದುಕೊಂಡಿದ್ದೇನೆಂದನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"O Lord!\nMountains wore away for stones.\nTrees wore away for leaves.\nThe seven seas wore away for ritual bathing.\nFire wore away for incense.\nWind wore away in fanning.\nThe very sound of saying \"Hail! Bravo! Well done!\" wore away.\nHow then shall it be for me?\nWhen the *Sharanas* of Umesha\nsit in the Great House for the worship of the *Shivalinga*,\nI keep watch over their footwear,\nsaid Ambigara Chowdayya.","hi":"हे स्वामी!\nपाषाण के लिए पर्वत घिस गए।\nपत्रों के लिए वृक्ष घिस गए।\nसप्तसागर मज्जन के लिए घिस गए।\nअग्नि धूप के लिए घिस गई।\nवायु कंपन के लिए घिस गई।\n‘उघे! चांगु भला!’ कहने का शब्द घिस गया।\nअब मेरे लिए कैसे संभव हो?\nउमेश के शरण\nमहामने में शिवलिंगार्चन के लिए बैठें तो,\nमैं उनकी पादुकाओं की\nरक्षा करता हुआ बैठा हूँ, ऐसा कहा अंबिग चौडय्या ने।","mr":"हे स्वामी!\nपाषाणासाठी पर्वत झिजले.\nपत्रीसाठी वृक्ष झिजले.\nसप्तसागर मज्जनासाठी झिजले.\nअग्नी धुपासाठी झिजला.\nवायू कम्पनासाठी झिजला.\nउघे! चांगभलं! हा शब्द झिजला.\nआता माझे कसे होणार?\nउमेशाचे शरण\nमहाघरात शिवलिंगार्चनेसाठी बसल्यावर,\nमी त्यांच्या पादत्राणांचे\nरक्षण करत बसलो आहे, असे अंबिग चौडय्या म्हणाला.","fr":"Ô Seigneur !\nPour des pierres, les montagnes se sont épuisées.\nPour du feuillage, les arbres se sont épuisés.\nLes sept océans se sont épuisés pour le bain rituel.\nLe feu s'est épuisé pour l'encens.\nLe vent s'est épuisé à frémir.\nLe son disant « Gloire ! Bravo, très bien ! » s'est épuisé.\nQu'en sera-t-il donc de moi désormais ?\nLorsque les *Sharanas* d'Umesha\ns'assoient dans la Grande Demeure pour l'adoration du *Shivalinga*,\nmoi, veillant sur leurs sandales,\nje demeure à les garder, dit Ambiga Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya critiques the endless exhaustion of natural elements and hollow exclamations used in conventional, external rituals.\n\nThrough hyperbolic imagery, the Vachana illustrates how mountains have worn away to carve stone idols, trees have been stripped bare for bilva leaves, the seven oceans have been depleted for ritual bathing, fire and wind have been consumed for incense, and even celebratory chants like \"Ughe!\" and \"Changu Bhala!\" have lost their meaning through overuse.\n\nSet against this futile consumption of nature for static worship, the Vachana highlights the quiet, inward devotion of the Sharanas who gather in the Mahamane for contemplative communion with the Divine.\n\nAddressing the Supreme Reality through his signature name Ambigara Choudayya, the poet expresses his profound humility, declaring that while the Sharanas are absorbed in such worship, his highest spiritual fulfillment lies in simply guarding their footwear outside.","hi":"इस वचन का केंद्रीय भाव यह है कि अंबिग चौडय्या बाह्य पूजा-अर्चना और कर्मकांड के लिए प्रकृति तथा शब्दों के दिखावटी उपयोग की निरर्थकता को उजागर करते हैं।\n\nयह वचन स्पष्ट करता है कि मूर्तियों के लिए पत्थरों को तराशने में पर्वत घिस गए, पूजा के पत्तों के लिए वृक्ष समाप्त हो गए, अभिषेक के लिए सातों समुद्र रीते हो गए, धूप जलाने में अग्नि और चँवर डुलाने में वायु का क्षय हो गया, तथा 'उघे! चांगु भला!' जैसे जयकारे लगाते-लगाते शब्द भी घिस गए।\n\nइन सभी बाह्य और भौतिक साधनों की सीमा तथा खोखलेपन को देखकर वचनकार यह प्रश्न उठाते हैं कि जब सब कुछ इस प्रकार बाहरी आडंबरों में समाप्त हो गया, तो सच्ची आराधना का मार्ग क्या रह गया है।\n\nइस वचन का आध्यात्मिक महत्व यह है कि अंबिग चौडय्या ऐसे बाह्य कर्मकांडों को त्यागकर पूर्ण विनम्रता और सेवा-भाव को अपनाते हैं, जहाँ वे 'महामने' में लिंगार्चन में लीन शरणों की चरण-पादुकाओं की रक्षा करने को ही अपनी सर्वोच्च साधना मानते हैं।","mr":"हे वचन बाह्य व भौतिक पूजा-विधींच्या मर्यादांवर भाष्य करून शरणांच्या निस्सीम सेवाभावाचे आणि नम्रतेचे महत्त्व अधोरेखित करते.\n\nदगडी मूर्तींसाठी पर्वत झिजले, पत्रीसाठी वृक्ष संपले, अभिषेकासाठी सप्तसागर आटले, तसेच धूप, वारा आणि 'उघे, चांगभलं' यांसारखे जयघोषही बाह्य उपचारांत झिजून गेले, या प्रतीकांमधून पारंपरिक कर्मकांडांची निरर्थकता आणि नश्वरता स्पष्ट होते.\n\nअशा बाह्य आडंबराच्या पलीकडे जाऊन, जेव्हा शरण महामनेत निराकार परमतत्त्वाच्या एकाग्र उपासनेसाठी शिवलिंगार्चनेला बसतात, तेव्हा त्यांच्या पादत्राणांचे रक्षण करण्याची नम्र भूमिका अंबिगर चौडय्या स्वीकारतात.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, भौतिक साधनांच्या अवाढव्य प्रदर्शनापेक्षा अनुभवी शरणांच्या संगतीत राहून निरहंकारी वृत्तीने केलेली सेवाच खरी आणि श्रेष्ठ साधना ठरते.","fr":"Ce vachana d'Ambigara Chowdayya met en lumière le caractère épuisable et extérieur des rituels conventionnels qui consomment les ressources de la nature pour des pratiques formelles.\n\nIl souligne que les montagnes s'usent pour tailler des idoles de pierre, les arbres pour cueillir des feuilles d'offrande, les sept océans pour les ablutions, le feu pour l'encens, le vent pour son mouvement et la parole elle-même dans de vaines acclamations rituelles.\n\nFace à cette démesure matérielle, le poète s'interroge avec humilité sur sa propre voie et choisit une dévotion fondée sur la simplicité et le service désintéressé.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation que le fait de veiller humblement sur les sandales des Sharanas réunis dans la grande demeure spirituelle pour la méditation sur le Linga possède une valeur bien plus authentique que toutes les cérémonies ostentatoires."}},{"no":1384,"o":"ಅರಿಯದ ಗುರು ಅರಿಯದ ಶಿಷ್ಯಂಗೆ\n ಅನುಗ್ರಹವ ಮಾಡಿದಡೇನಪ್ಪುದೆಲವೊ.\n ಅಂಧಕನ ಕೈಯನಂಧಕ ಹಿಡಿದಡೆ\n ಮುಂದನಾರು ಕಾಬರು ಹೇಳೆಲೆ ಮರುಳೆ.\n ತೊರೆಯಲದ್ದವನನೀಸಲರಿಯದವ\n ತೆಗೆವ ತೆರನಂತೆಂದನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"If a Guru without awareness to a disciple without awareness\nbestows grace, what comes of it, O fellow?\nIf a blind man holds a blind man's hand,\nwho will see what lies ahead? Tell me, O fool!\nFor one who knows not how to swim to pull out\none drowning in a stream—it is just like that, said Ambiga Chowdayya.","hi":"न जाननेवाला गुरु न जाननेवाले शिष्य पर\nअनुग्रह करे तो क्या होगा रे?\nअंधे का हाथ अंधा पकड़ ले तो,\nआगे का कौन देखेगा, बता रे बावरे?\nयह तो नदी में डूबे हुए को तैरना न जाननेवाले द्वारा\nनिकालने के समान है, कहा अंबिग चौडय्या ने।","mr":"अजाण गुरूने अजाण शिष्याला\nअनुग्रह दिला तर काय घडणार रे?\nआंधळ्याचा हात आंधळ्याने धरला तर\nपुढचे कोण पाहणार, सांग रे वेड्या!\nप्रवाहात बुडणाऱ्याला पोहता न येणाऱ्याने\nबाहेर काढण्यासारखे हे आहे, असे अंबिग चौडय्या म्हणाला.","fr":"Si un maître privé de connaissance accorde sa grâce\nà un disciple privé de connaissance, qu'en adviendra-t-il, ô homme ?\nSi un aveugle tient la main d'un aveugle,\nqui donc verra le chemin devant eux ? Dis-moi, ô insensé !\nC'est à l'image de celui qui ne sait pas nager\nessayant de tirer hors de l'eau celui qui s'est enfoncé dans le torrent, dit Ambigara Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya exposes the futility of spiritual guidance when both the teacher and the disciple lack true inner awareness (Arivu).\n\nWhen an unenlightened Guru attempts to bestow spiritual grace upon an equally ignorant seeker, no real transformation can take place.\n\nThrough the vivid metaphors of one blind person leading another and a person who cannot swim trying to rescue someone drowning in a river, the Vachana illustrates how spiritual ignorance cannot liberate another from ignorance.\n\nTrue spiritual awakening requires a guide who has genuinely realized the truth; otherwise, mere ritual initiation becomes a perilous and meaningless exercise for both.","hi":"इस वचन का केंद्रीय भाव यह है कि आत्मज्ञान से रहित गुरु यदि किसी अज्ञानी शिष्य को दीक्षा या अनुग्रह प्रदान करता है, तो उससे कोई वास्तविक आध्यात्मिक लाभ नहीं हो सकता।\n\nवचन में यह स्पष्ट किया गया है कि यदि एक अंधा व्यक्ति दूसरे अंधे का हाथ पकड़कर चले, तो उन दोनों में से आगे का मार्ग कोई नहीं देख सकता।\n\nअंबिग चौडय्या के माध्यम से इस वचन में यह दृष्टांत दिया गया है कि ऐसी स्थिति ठीक वैसी ही है जैसे स्वयं तैरना न जानने वाला व्यक्ति नदी में डूबते हुए किसी दूसरे व्यक्ति को बचाने का निरर्थक प्रयास करे।\n\nअतः इस वचन का आध्यात्मिक महत्व यह है कि सत्य का मार्ग दिखाने और अज्ञान के प्रवाह से उबारने के लिए मार्गदर्शक का स्वयं आध्यात्मिक रूप से जागृत और ज्ञानी होना अनिवार्य है।","mr":"हे वचन स्वतः आध्यात्मिक जाणीव नसलेल्या अज्ञानी गुरूने अज्ञानी शिष्याला दिलेल्या अनुग्रहाची निरर्थकता स्पष्ट करते.\n\nएका अंध व्यक्तीने दुसऱ्या अंध व्यक्तीचा हात धरून चालल्यास, पुढील मार्ग कोणालाच दिसू शकत नाही आणि दोघांनाही योग्य दिशा मिळू शकत नाही.\n\nज्याप्रमाणे स्वतःला पोहता न येणारा माणूस नदीच्या प्रवाहात बुडणाऱ्या दुसऱ्या माणसाला वाचवू शकत नाही, तशीच अवस्था अज्ञानी गुरू आणि शिष्याची होते.\n\nअशा प्रकारे, हे वचन अंबिग चौडय्य या अंकिताद्वारे खऱ्या आध्यात्मिक मार्गदर्शनासाठी आणि उद्धारासाठी गुरू स्वतः ज्ञानी आणि अनुभवी असणे किती आवश्यक आहे, या जाणिवेकडे आपल्याला घेऊन जाते.","fr":"Ce vachana met en lumière la futilité d'une initiation spirituelle transmise par un maître lui-même dépourvu de véritable connaissance (Arivu) à un disciple tout aussi ignorant.\n\nPour illustrer cette absurdité, le texte recourt à des images saisissantes : celle d'un aveugle guidant un autre aveugle sans que nul ne puisse voir le chemin devant eux, et celle d'une personne ne sachant pas nager qui prétendrait sauver quelqu'un de la noyade dans un torrent.\n\nPorté par la signature spirituelle Ambigara Choudayya, cet enseignement souligne que sans l'éveil intérieur et la maîtrise réelle de la vérité, toute transmission spirituelle demeure vaine et ne peut conduire personne hors de l'ignorance."}},{"no":1385,"o":"ಅರಿವನರಿದಲ್ಲಿ ತಾನೆನ್ನದೆ ಇದಿರೆನ್ನದೆ,\n ಮತ್ತೇನುವ ಉಳಿದುವ ಸಂಪಾದಿಸದೆ,\n ಅರುಣನ ಕಿರಣದಲ್ಲಿ ಅರತ ಸಾರದಂತೆ,\n ಕಾದ ಹಂಚಿನಲ್ಲಿ ನೀರ ಬಿಟ್ಟಂತೆ\n ಬಧಿರನ ಕಾವ್ಯದಂತೆ,\n ಚದುರನ ಒಳುಪಿನಂತೆ\n ತಲೆದೋರದೆ ನಿಂದಾತನ ಅಡಿಗೆರಗುವೆನೆಂದನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"Having realized *Arivu*, without saying \"I\" or \"the other\",\nwithout acquiring anything else that remains,\nlike dew dried up in the rays of the rising sun,\nlike water dropped upon a heated pan,\nlike poetry to a deaf man,\nlike the inner secret of a wise man—\nto the feet of the one who stands without showing himself, I bow, said Ambigara Chowdayya.","hi":"बोध को जान लेने पर, 'मैं' न कहकर, 'पराया' न कहकर,\nऔर कुछ भी शेष का अर्जन न कर,\nअरुण की किरणों में सूख गए रस के समान,\nतपे हुए खपरे पर पानी डालने के समान,\nबधिर के काव्य के समान,\nचतुर के अंतर्भाव के समान,\nप्रकट हुए बिना स्थित रहनेवाले के चरणों में नमन करूँगा, ऐसा कहा अंबिग चौडय्या ने।","mr":"जाणिवेला जाणल्यावर मी न म्हणता, समोरील न म्हणता,\nआणखी काही उरलेले संपादन न करता,\nसूर्यकिरणांत आटलेल्या दवबिंदूप्रमाणे,\nतापलेल्या खापरावर पाणी सोडल्याप्रमाणे,\nबहिऱ्याच्या काव्याप्रमाणे,\nचतुराच्या अंतरीच्या गुपीताप्रमाणे,\nवर न दिसता स्थिर राहिलेल्याच्या चरणी मी नतमस्तक होतो, असे म्हणाला अंबिग चौडय्या.","fr":"Lorsqu'il réalise la conscience lumineuse, sans dire « moi » ni dire « l'autre »,\nsans acquérir quoi que ce soit qui reste encore,\ncomme la rosée qui s'assèche aux rayons du soleil levant,\ncomme l'eau versée sur un tesson brûlant,\ncomme le poème d'un sourd,\ncomme le secret intérieur d'un être habile,\naux pieds de celui qui demeure sans se manifester, je me prosterne, dit Ambiga Chowdayya."},"m":{"en":"This Vachana describes the state of realising Pure Consciousness (Arivu), where the duality of 'self' and 'other' dissolves completely and no separate worldly or spiritual residue remains to be acquired.\n\nThrough vivid metaphors—moisture vanishing in the morning sun's rays, water evaporating instantly on a heated pan, a deaf person's poetry, and a clever person's concealed inner intent—the Vachana illustrates how individual identity and outward display disappear into complete stillness.\n\nBearing the spiritual signature Ambigachaudayya, the Vachana expresses profound reverence for the realized being who abides in this non-dual awareness without any trace of ego or self-projection.","hi":"इस वचन का केंद्रीय भाव यह है कि जब एक साधक परम ज्ञान और शुद्ध चैतन्य को पूर्णतः जान लेता है, तब उसके भीतर 'मैं' और 'तू' का सारा द्वैत मिट जाता है तथा उसे किसी अन्य सांसारिक या बाहरी उपलब्धि की आवश्यकता नहीं रह जाती।\n\nसूर्य की किरणों के स्पर्श से सूख जाने वाली ओस की बूँद और तप्त तवे पर पड़ते ही विलीन हो जाने वाले जल के रूपकों के माध्यम से यह स्पष्ट किया गया है कि सच्चे ज्ञान के उदय होने पर साधक का पृथक अहंकार पूरी तरह अस्तित्वहीन हो जाता है।\n\nबहरे व्यक्ति के काव्य और चतुर व्यक्ति के गुप्त अंतर्मन की भाँति, यह सर्वोच्च आध्यात्मिक स्थिति किसी बाहरी प्रदर्शन या दिखावे से सर्वथा परे और पूर्णतः अंतर्मुखी होती है।\n\nअंबिग चौडय्या इस वचन के माध्यम से ऐसे ही अहंकार-शून्य और अप्रकट रूप से परम सत्य में लीन रहने वाले ज्ञानी के चरणों में नमन करते हैं।","mr":"हे वचन आध्यात्मिक जाणीव आणि आत्मज्ञानाच्या सर्वोच्च अवस्थेचे वर्णन करते, जिथे साधकाच्या मनात 'मी' आणि 'दुसरा' असा कोणताही द्वैतभाव उरत नाही आणि त्यापलीकडे इतर काहीही मिळवण्याची किंवा साठवण्याची इच्छा शिल्लक राहत नाही.\n\nसूर्याच्या किरणांनी दवबिंदू शोषून घ्यावेत किंवा तापलेल्या खापरावर टाकलेले पाणी तत्काळ नाहीसे व्हावे, त्याप्रमाणे साक्षात्कारी व्यक्तीचा अहंकार शुद्ध चैतन्यात पूर्णपणे विरून जातो.\n\nबहिऱ्या माणसाच्या काव्याप्रमाणे किंवा एखाद्या चतुर माणसाच्या गुप्त अंतस्थ हेतूप्रमाणे, ज्याचे आत्मज्ञान बाह्य जगात स्वतःचे प्रदर्शन न करता अत्यंत सूक्ष्म व गुप्त रूपात अढळ राहते, अशा ज्ञानी महात्म्याचे श्रेष्ठत्व येथे अधोरेखित केले आहे.\n\nअशाप्रकारे स्वतःच्या ज्ञानाचा कोणताही बडेजाव न मिरवता आत्मस्वरूपात लीन झालेल्या महात्म्याच्या चरणी मी नतमस्तक होतो, असा भाव अंबिग चौडय्य या वचनातून व्यक्त करतात.","fr":"Ce vachana d'Ambigara Chowdayya décrit l'état ultime de la réalisation spirituelle, où la connaissance de la Conscience pure (Arivu) dissout toute dualité entre le « soi » et l'« autre », sans laisser subsister le moindre désir d'acquérir quoi que ce soit.\n\nPour illustrer cette disparition totale de l'ego et des traces matérielles, le texte emploie des images saisissantes : l'essence ou la rosée qui s'évapore sous les rayons du soleil levant, ou encore une goutte d'eau versée sur une tuile brûlante qui s'évanouit instantanément.\n\nL'être éveillé demeure dans un état d'intériorité absolue et d'humilité silencieuse, semblable au poème inexprimé d'un sourd ou au secret profondément gardé par un homme habile, qui ne cherche jamais à se manifester ni à s'exposer au monde.\n\nAmbigara Chowdayya exprime sa profonde vénération et s'incline aux pieds de celui qui a atteint cette plénitude silencieuse, où l'individu s'est entièrement fondu dans la Réalité suprême sans forme sans laisser la moindre trace d'ostentation."}},{"no":1386,"o":"ಅರ್ಚನೆಯ ಮಾಡುವಲ್ಲಿ ಆವೇಶ ಅರತಿರಬೇಕು.\n ಪೂಜೆಯ ಮಾಡುವಲ್ಲಿ ಪುಣ್ಯಮೂರ್ತಿಯಾಗಿರಬೇಕು.\n ಕೊಡುವ ಕೊಂಬಲ್ಲಿ ಸರ್ವಭೂತ ಹಿತನಾಗಿರಬೇಕು.\n ಇಂತೀ ಸಡಗರಿಸಿಕೊಂಡಿಪ್ಪಾತನ ಅಡಿಗೆರಗುವೆನೆಂದ\n ಅಂಬಿಗರ ಚೌಡಯ್ಯ.","t":{"en":"In performing adoration, there must be fervent devotion and love.\nIn performing worship, one must be the very embodiment of virtue.\nIn giving and receiving, one must seek the well-being of all living beings.\nI bow at the feet of one who conducts himself with such joyful zeal,\nsaid Ambigara Chowdayya.","hi":"अर्चना करते समय आवेश मिट जाना चाहिए।\nपूजा करते समय पुण्यमूर्ति होना चाहिए।\nलेने-देने में सर्वभूत-हितैषी होना चाहिए।\nइस प्रकार के उत्साह से युक्त रहनेवाले के चरणों में झुकूँगा,\nकहा अंबिगर चौडय्या ने।","mr":"अर्चना करताना उत्कट आवेश आणि प्रीती असावी.\nपूजा करताना पुण्यमूर्ती असावे.\nदेण्या-घेण्यात सर्वभूतांचे हित जपणारे असावे.\nअशा प्रकारे भक्तीच्या उल्हासात राहणाऱ्याच्या चरणी मी लीन होतो, असे म्हणाला\nअंबिगर चौडय्या.","fr":"En accomplissant l'offrande rituelle, toute frénésie doit s'être éteinte.\nEn accomplissant la dévotion, il faut être l'incarnation même de la vertu.\nDans le donner et le recevoir, il faut être voué au bien de tous les êtres.\nJe me prosterne aux pieds de celui qui demeure dans une telle ferveur joyeuse, dit\nAmbigara Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya defines the inner disposition and ethical integrity required in both spiritual practice and everyday social life.\n\nTrue worship demands that the mind be entirely free from restless agitation, frenzy, or egoistic impulse, requiring instead that the seeker become an embodiment of purity and virtue.\n\nEqually important, spiritual authenticity is tested in daily worldly transactions of giving and receiving, where a person must act with genuine goodwill toward the welfare of all living beings.\n\nThrough the signature Ambigara Choudayya, the Vachana affirms profound reverence for the seeker who lives with joyful commitment to this harmony between inner mindfulness and universal compassion.","hi":"इस वचन का केंद्रीय भाव यह है कि सच्ची आध्यात्मिक साधना बाहरी प्रदर्शन से नहीं, बल्कि साधक के आंतरिक समर्पण, पवित्र आचरण और सबके प्रति कल्याण की भावना से सिद्ध होती है।\n\nउपासना के समय साधक में गहन तल्लीनता तथा उत्कट प्रेम का भाव होना चाहिए और पूजा करते समय उसका स्वयं का जीवन भी पवित्रता एवं सदाचार का साक्षात् रूप होना आवश्यक है।\n\nसमाज में आपसी लेन-देन और व्यवहार करते समय व्यक्ति को संकीर्ण स्वार्थ से ऊपर उठकर समस्त प्राणियों के हित में तत्पर रहना चाहिए।\n\nनिज-अंकितांकित वचनकार अंबिगर चौडय्या यह स्पष्ट करते हैं कि जो मनुष्य अपने जीवन में ऐसे पवित्र उत्साह और लोक-कल्याण के भाव को धारण किए रहता है, वे उसके चरणों में नतमस्तक होते हैं।","mr":"या वचनाचा मुख्य आशय असा आहे की, उपासना आणि दैनंदिन आचरण यात अंतर्बाह्य शुद्धता आणि एकरूपता असणे आवश्यक आहे.\n\nपूजा-अर्चा करताना मनातील अहंकार किंवा दिखाऊ आवेश पूर्णपणे मावळलेला असावा आणि साधकाने स्वतःच पुण्यस्वरूप होऊन अंतःकरणाच्या पवित्र भावाने उपासना करावी.\n\nतसेच, समाजात वावरताना आणि देवाणघेवाणीचे व्यवहार करताना केवळ स्वार्थ न पाहता सर्व प्राणिमात्रांच्या कल्याणाची भावना जपली पाहिजे, हे या वचनातून स्पष्ट होते.\n\nअशा प्रकारे आंतरिक पवित्रता आणि सर्वभूतांच्या हिताची जाणीव ठेवून आनंदाने जगणाऱ्या सात्त्विक व्यक्तीच्या चरणी नतमस्तक होण्याचा भाव अंबिगर चौडय्य या अंकितानामातून व्यक्त झाला आहे.","fr":"Ce vachana d'Ambigara Choudayya met en lumière l'unité indissociable entre la pratique spirituelle intérieure et l'éthique sociale dans la vie quotidienne.\n\nIl explique que le culte véritable exige l'apaisement des passions et des impulsions égoïstes, ainsi qu'une pureté d'être absolue au moment de la vénération.\n\nDans les échanges matériels et les relations humaines — l'acte de donner et de recevoir —, l'individu se doit d'agir avec bienveillance pour le bien-être de toutes les créatures vivantes.\n\nLa portée spirituelle de ce vachana réside dans l'idée que celui qui incarne avec joie cette harmonie entre dévotion apaisée, intégrité morale et altruisme universel mérite le plus profond respect."}},{"no":1387,"o":"ಅಸುರ ಮಾಲೆಗಳಿಲ್ಲ,\n ತ್ರಿಶೂಲ ಡಮರುಗವಿಲ್ಲ,\n ಬ್ರಹ್ಮಕಪಾಲವಿಲ್ಲ,\n ಭಸ್ಮಭೂಷಣನಲ್ಲ,\n ವೃಷಭವಾಹನನಲ್ಲ,\n ಋಷಿಯರುಗಳೊಡನಿದ್ದಾತನಲ್ಲ.\n ಎಸಗುವ ಸಂಸಾರದ ಕುರುಹಿಲ್ಲದಾತಂಗೆ\n ಹೆಸರಾವುದಿಲ್ಲೆಂದನಂಬಿಗರ ಚೌಡಯ್ಯ.","t":{"en":"There are no garlands of demon skulls,\nthere is neither trident nor hand-drum,\nthere is no skull of Brahma;\nhe is not one adorned with sacred ash,\nhe is not one who rides the bull,\nhe is not one who dwelt among the sages.\nFor the One who bears no trace of this active worldly existence,\nthere is no name whatsoever, said Ambigara Chowdayya.","hi":"असुरों की मालाएँ नहीं हैं,\nत्रिशूल और डमरू नहीं हैं,\nब्रह्मकपाल नहीं है,\nवह भस्मभूषण नहीं है,\nवह वृषभवाहन नहीं है,\nवह ऋषियों के साथ रहनेवाला नहीं है।\nरचे जानेवाले संसार का चिह्न न रखनेवाले का\nकोई भी नाम नहीं है, ऐसा अंबिगर चौडय्या ने कहा।","mr":"असुरांच्या माळा नाहीत,\nत्रिशूळ आणि डमरू नाही,\nब्रह्मकपाळ नाही,\nतो भस्मभूषण नाही,\nतो वृषभवाहन नाही,\nतो ऋषींसोबत राहणारा नाही.\nघडणाऱ्या संसाराची खूण नसलेल्याला\nकोणतेही नाव नाही, असे अंबिगर चौडय्या म्हणाला.","fr":"Il n'y a pas de guirlandes de démons,\nil n'y a ni trident ni tambourin *damaru*,\nil n'y a pas le crâne de Brahma,\nil n'est pas celui qui se pare de cendres,\nil n'est pas celui qui a le taureau pour monture,\nil n'est pas celui qui demeure parmi les sages *rishi*.\nPour celui qui ne porte aucune trace de ce monde agissant,\nil n'est aucun nom, dit Ambigara Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya rejects the conventional Puranic and mythological depictions of the Divine, distinguishing the Supreme Reality from anthropomorphic deities.\n\nBy systematically negating traditional attributes associated with the mythological Rudra or Shiva—such as wearing garlands of demon skulls, holding a trident, a damaru, or Brahma's skull, smearing sacred ash, riding the bull Nandi, and dwelling among sages—the Vachana strips away all physical iconography.\n\nThe central philosophical insight is that the Formless Supreme Consciousness bears no trace of worldly existence or physical form (Kuruhu), and therefore transcends all names, myths, and limiting descriptions.","hi":"इस वचन का केंद्रीय भाव यह है कि परमतत्त्व किसी भी प्रकार के पौराणिक या बाहरी रूप-आकार से सर्वथा परे और निराकार है।\n\nयहाँ असुरों की मुंडमाला, त्रिशूल, डमरू, ब्रह्मकपाल, शरीर पर भस्म, वृषभ वाहन तथा ऋषियों के संग रहने जैसी प्रचलित पौराणिक कल्पनाओं का स्पष्ट निषेध करते हुए यह समझाया गया है कि शुद्ध चैतन्य को इन भौतिक चिह्नों या आकृतियों में नहीं बाँधा जा सकता।\n\nअंबिगर चौडय्या के इस वचन का आध्यात्मिक आशय यह है कि जो परम सत्य सांसारिक क्रियाकलापों और लौकिक पहचानों के किसी भी चिह्न से पूर्णतः मुक्त है, उसे किसी भी नाम या रूप की सीमा में परिभाषित नहीं किया जा सकता, क्योंकि वह अनाम और निर्गुण है।","mr":"या वचनातून परमतत्त्वाचे निराकार आणि निर्गुण स्वरूप अत्यंत स्पष्टपणे मांडले आहे.\n\nगळ्यात असुरांच्या मुंडक्यांची माळ, हातात त्रिशूळ-डमरू किंवा ब्रह्मकपाल, अंगावर भस्माचा लेप, नंदीचे वाहन आणि ऋषीमुनींचा सहवास या सर्व पौराणिक व सगुण कल्पनांपासून परमतत्त्व पूर्णपणे अलिप्त आहे.\n\nअशा बाह्य आभूषणांच्या किंवा प्रतीकांच्या पलीकडे असलेले हे शुद्ध चैतन्य कोणत्याही भौतिक चौकटीत बांधले जाऊ शकत नाही, असे हे वचन दर्शवते.\n\nअंबिगर चौडय्य या अंकितानामातून हाच विचार दृढ होतो की, ज्या परमतत्त्वाला सांसारिक कर्तृत्वाची कोणतीही खूण किंवा मर्यादा नाही, त्याला कोणतेही विशिष्ट नाव दिले जाऊ शकत नाही; ते अनादि आणि अनाम आहे.","fr":"Ce vachana d'Ambigara Choudayya met en lumière la nature purement sans forme et sans attributs de la Réalité suprême, en rejetant catégoriquement les représentations mythologiques et anthropomorphiques du divin.\n\nIl écarte un à un les symboles traditionnels associés à l'iconographie puranique de Shiva — tels que les guirlandes de crânes, le trident, le tambourin, le crâne de Brahma, la parure de cendres, la monture du taureau ou la compagnie des sages (Rishis) — pour montrer que l'Absolu ne saurait être réduit à une figure dotée d'ornements ou d'histoire.\n\nDépourvu de toute empreinte ou marque du monde phénoménal, ce Principe suprême transcende entièrement les limites matérielles et les constructions de l'imaginaire humain.\n\nAinsi, la portée philosophique de ce poème réside dans l'affirmation radicale que cette Vérité absolue, libre de tout signe distinctif mondain, demeure fondamentalement au-delà de tout nom et de toute définition."}},{"no":1388,"o":"ಆರಿಕೆ ಬಿತ್ತಿದ ಗಿಡುವಿನ ಹೂವ ಕೊಯಿದು,\n ಊರೆಲ್ಲರೂ ಕಟ್ಟಿಸಿದ ಕೆರೆಯ ನೀರ ತಂದು,\n ನಾಡೆಲ್ಲರೂ ನೋಡಿಯೆಂದು ಪೂಜಿಸುತ್ತ,\n ಪೂಜಿಸಿದ ಪುಣ್ಯ ಹೂವಿಗೋ? ನೀರಿಗೋ?\n ನಾಡೆಲ್ಲಕ್ಕೋ? ಪೂಜಿಸಿದಾತಗೋ?\n ಇದ ನಾನರಿಯೆ, ನೀ ಹೇಳೆಂದನಂಬಿಗ ಚೌಡಯ್ಯ.","t":{"en":"Plucking the flowers of a plant someone else has sown,\nfetching the water of a tank the whole village has built,\nand worshipping, saying, let the whole land see—\ndoes the merit of that worship belong to the flower? Or to the water?\nTo the whole land? Or to the one who worshipped?\nI do not know this; you tell me, said Ambigara Chowdayya.","hi":"अनायास उगे पौधे के फूल तोड़कर,\nसारे गाँव द्वारा बनवाए गए तालाब का पानी लाकर,\nसारा देश देखे यह सोचकर पूजा करते हुए,\nपूजा करने का पुण्य फूल को है? या पानी को?\nसारे देश को है? या पूजा करनेवाले को?\nयह मैं नहीं जानता, तुम ही बताओ—ऐसा कहा अंबिग चौडय्या ने।","mr":"आस्थेने लावलेल्या झाडाचे फूल तोडून,\nगावच्या सर्वांनी बांधलेल्या तळ्याचे पाणी आणून,\nसगळ्या लोकांनी पाहावे म्हणून पूजा करणाऱ्या,\nत्या पूजेचे पुण्य फुलाला? की पाण्याला?\nसगळ्या लोकांना? की पूजा करणाऱ्याला?\nहे मला ठाऊक नाही, तूच सांग असे म्हणाला अंबिग चौडय्या.","fr":"Cueillant la fleur d'une plante semée avec soin,\napportant l'eau de l'étang bâti par tout le village,\ncélébrant le culte en disant : « Que tout le pays regarde ! »,\nle mérite de ce culte revient-il à la fleur ? À l'eau ?\nÀ tout le pays ? Ou à celui qui a célébré le culte ?\nCela, je ne le sais pas ; dis-le, toi, dit Ambiga Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudaiah sharply critiques the hypocrisy and vanity of ostentatious ritual worship performed for public display.\n\nHe points out the irony of a worshipper who plucks flowers from plants grown by others and fetches water from a tank built by the entire village, only to perform rituals so that the whole land may watch and admire him.\n\nBy questioning whether the spiritual merit of such an act belongs to the flower, the water, the watching public, or the worshipper himself, the Vachana exposes the hollowness of claiming personal credit for offerings that are neither one's own nor offered with genuine inwardness.\n\nUltimately, the Vachana emphasizes that mechanical rituals performed with borrowed materials for social recognition are spiritually meaningless and devoid of true realization.","hi":"यह वचन बाह्य आडंबर और दिखावे के लिए की जाने वाली पारंपरिक पूजा-पद्धति की निरर्थकता को स्पष्ट करता है।\n\nयहाँ यह प्रश्न उठाया गया है कि किसी दूसरे के द्वारा बोए गए पौधे से फूल तोड़कर और पूरे गाँव द्वारा बनवाए गए तालाब से जल लाकर, जब कोई व्यक्ति केवल संसार को दिखाने के लिए पूजा करता है, तो उसमें उसकी अपनी वास्तविक निष्ठा कहाँ होती है।\n\nअंबिग चौडय्या के माध्यम से यह वचन तीखा व्यंग्य करता है कि दूसरे के श्रम के साधनों और लोक-प्रदर्शन से की गई ऐसी पूजा का पुण्य फूल को मिलेगा, जल को, देखने वाले समाज को या पूजा करने वाले को—यह समझ से परे है, क्योंकि सच्ची उपासना बाहरी वस्तुओं के संग्रह या दिखावे का विषय नहीं है।","mr":"अंबिग चौडय्य यांच्या या वचनाचा मुख्य आशय बाह्य आणि दिखाऊ पूजाविधीतील पोकळपणावर परखड भाष्य करणारा आहे.\n\nकोणीतरी लावलेल्या झाडाची फुले तोडून आणि संपूर्ण गावाने बांधलेल्या तलावातील पाणी आणून, केवळ लोकांना दाखवण्यासाठी जी पूजा केली जाते, तिच्यातील विरोधाभास येथे स्पष्ट केला आहे.\n\nअशा परक्या साधनांनी आणि लोकप्रदर्शनाच्या हेतूने केलेल्या पूजेचे पुण्य नेमके फुलांना, पाण्याला, पाहणाऱ्या लोकांना की पूजा करणाऱ्याला मिळते, असा मूलभूत प्रश्न हे वचन उपस्थित करते.\n\nस्वतःचे आंतरिक समर्पण आणि शुद्ध भाव नसताना केवळ बाह्य वस्तूंच्या आधारे व दिखाऊपणाने केलेल्या उपासनेतून कोणतेही आध्यात्मिक श्रेय लाभत नाही, हेच यातून अधोरेखित होते.","fr":"Ce vachana d'Ambiga Chowdayya remet en question avec une ironie perçante la vanité du rituel extérieur et de la dévotion ostentatoire accomplie pour être vue de tous.\n\nLe poète souligne que l'adorateur se contente de cueillir les fleurs d'une plante semée par quelqu'un d'autre et de puiser l'eau d'un réservoir construit par l'effort collectif de tout le village.\n\nDès lors, si ce culte est célébré uniquement pour s'attirer le regard du pays tout entier, il devient légitime de se demander si le mérite spirituel revient à la fleur, à l'eau, aux spectateurs ou à celui qui accomplit le rite.\n\nÀ travers cette interrogation incisive, le vachana dévoile l'illusion de s'attribuer un mérite personnel en utilisant ce qui appartient à la nature et à la communauté pour nourrir son propre orgueil."}},{"no":1389,"o":"ಆಶೆಯುಳ್ಳಾತನೊಬ್ಬರಾಧೀನದಲ್ಲಿಪ್ಪನು.\n ಆಶೆಯ ಮನದ ಕೊನೆಯನರಿದಾತ\n ಕೈಲಾಸದಾಚೆಯಲ್ಲಿಪ್ಪನೆಂದಾತ\n ನಮ್ಮ ಅಂಬಿಗ ಚೌಡಯ್ಯ!","t":{"en":"He who possesses desire abides in subjection to another.\nHe who has known the end of the desiring mind\nabides beyond Kailasa—so declared\nour Ambiga Chowdayya!","hi":"आशा रखनेवाला किसी के अधीन रहेगा।\nआशा-भरे मन के अंत को जाननेवाला\nकैलास के पार रहेगा, ऐसा कहा\nहमारे अंबिग चौडय्या ने!","mr":"आशा असलेला माणूस दुसऱ्याच्या आधीन असतो.\nआशाळू मनाचे मूळ जाणून घेणारा\nकैलासाच्याही पलीकडे असतो, असे म्हणाला\nआमचा अंबिग चौडय्या!","fr":"Celui qui a du désir demeure sous l'emprise d'autrui.\nCelui qui a connu le terme de l'esprit plein de désir\ndemeure au-delà de Kailasa : ainsi l'a dit\nnotre Ambiga Chowdayya !"},"m":{"en":"This Vachana by Ambigara Choudayya examines the nature of human desire and the bondage it creates.\n\nA person driven by worldly cravings inevitably falls into servitude and remains dependent on others to fulfill those wants.\n\nIn contrast, one who truly understands the root and limit of desire within the mind transcends all mental dependency and achieves complete inner freedom.\n\nSuch an awakened individual attains a state of supreme consciousness that surpasses even traditional, mythological conceptions of heaven like Kailasa.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस व्यक्ति के मन में इच्छा या तृष्णा (आशा) होती है, वह सदैव किसी दूसरे के अधीन होकर जीता है।\n\nइसके विपरीत, जो साधक अपने मन में उठने वाली तृष्णाओं की सीमा और उनके अंत को जान लेता है, वह समस्त बंधनों से मुक्त हो जाता है।\n\nयहाँ कैलास की पौराणिक अवधारणा का एक प्रतीकात्मक माध्यम के रूप में उपयोग करते हुए यह स्पष्ट किया गया है कि तृष्णा के अंत को जानने वाला व्यक्ति परंपरागत स्वर्ग या कैलास से भी परे के परम सत्य की स्थिति में निवास करता है।\n\nअंबिग चौडय्या के आध्यात्मिक हस्ताक्षर से युक्त यह वचन इस सत्य की ओर संकेत करता है कि इच्छाओं के स्वरूप को समझकर उनसे पार पाना ही सर्वोच्च आध्यात्मिक स्वतंत्रता है।","mr":"मनात इच्छा किंवा हाव बाळगणारा माणूस नेहमीच दुसऱ्याच्या अधीन होऊन गुलामगिरीत जगतो, असे हे वचन स्पष्ट करते.\n\nपरंतु ज्याने आपल्या मनातील या आशेच्या मुळाचा आणि तिच्या मर्यादेचा पूर्णपणे शोध घेतला आहे, तो सर्व बंधनांतून मुक्त होतो.\n\nअसा तृष्णारहित मनुष्य केवळ कल्पित स्वर्गापुरता मर्यादित न राहता, कैलासाच्याही पलीकडे असलेल्या सर्वोच्च आध्यात्मिक स्थितीत वावरतो, हा विचार अंबिग चौडय्या यांच्या वचनातून मांडला आहे.","fr":"Ce vachana d'Ambigara Chowdayya met en lumière l'effet asservissant du désir sur la condition humaine, affirmant que quiconque nourrit la convoitise reste inévitablement soumis à la dépendance d'autrui.\n\nEn revanche, celui qui comprend et atteint la fin même des désirs au sein de son esprit accède à une liberté intérieure absolue.\n\nLa portée spirituelle de ce vachana réside dans l'idée qu'un tel être éveillé s'élève bien au-delà de Kailasa, transcendant les conceptions conventionnelles du paradis pour demeurer dans un état de pure conscience affranchie de toute limite."}},{"no":1390,"o":"ಉಂಡರೆ ಭೂತನೆಂಬರು,\n ಉಣದಿದ್ದರೆ ಚಕೋರನೆಂಬರು.\n ಭೋಗಿಸಿದರೆ ಕಾಮಿಯೆಂಬರು,\n ಭೋಗಿಸದಿದ್ದರೆ ಮುನ್ನ ಮಾಡಿದ ಕರ್ಮಿ ಎಂಬರು.\n ಊರೊಳಗಿದ್ದರೆ ಸಂಸಾರಿ ಎಂಬರು,\n ಅಡವಿಯೊಳಗಿದ್ದರೆ ಮೃಗಜಾತಿ ಎಂಬರು.\n ನಿದ್ರೆಗೈದರೆ ಜಡದೇಹಿ ಎಂಬರು,\n ಎದ್ದಿದ್ದರೆ [ಚೋ]ರನೆಂಬರು.\n ಇಂತೀ ಜನಮೆಚ್ಚಿ ನಡೆ[ಯ]ದವರ\n ಎಡದ ಪಾದ ಕಿರುಗುಣಿಯಲ್ಲಿ ಮನೆಮಾಡು, ಮನೆಮಾಡು\n ಎಂದಾತ ನಮ್ಮ ಅಂಬಿಗರ ಚೌಡಯ್ಯ.","t":{"en":"If one eats, they call him a gluttonous fiend;\nif one does not eat, they call him a chakora bird.\nIf one enjoys pleasures, they call him a sensualist;\nif one does not enjoy them, they call him one bound by past karma.\nIf one lives in the town, they call him a worldly householder;\nif one lives in the forest, they call him one of the beastly kind.\nIf one sleeps, they call him a sluggish body;\nif one stays awake, they call him a thief.\nIn the small hollow of the left foot\nof those who do not walk thus to please people,\nmake your home, make your home—\nso said our Ambigara Chowdayya.","hi":"भोजन करें तो भूत कहते हैं,\nभोजन न करें तो चकोर कहते हैं।\nभोग करें तो कामी कहते हैं,\nभोग न करें तो पूर्वजन्म के पापकर्म का भागी कहते हैं।\nगाँव में रहें तो संसारी कहते हैं,\nवन में रहें तो पशुजाति का कहते हैं।\nनिद्रा करें तो जड़देही कहते हैं,\nजागते रहें तो चोर कहते हैं।\nइस प्रकार, लोक की प्रशंसा चाहकर न चलनेवालों के\nबाएँ चरण के तलवे के गड्ढे में घर बनाओ, घर बनाओ—\nऐसा कहा है हमारे अंबिगर चौडय्या ने।","mr":"जेवलो तर भूत म्हणतात,\nनाही जेवलो तर चकोर म्हणतात.\nभोग घेतला तर कामी म्हणतात,\nभोग नाही घेतला तर पूर्वजन्मीचा कर्मी म्हणतात.\nगावात राहिलो तर संसारी म्हणतात,\nरानात राहिलो तर पशूंच्या जातीचा म्हणतात.\nझोप घेतली तर जडदेही म्हणतात,\nजागा राहिलो तर चोर म्हणतात.\nअशा या लोकांच्या पसंतीनुसार न वागणाऱ्यांच्या\nडाव्या पावलाच्या टाचेखालील छोट्या खड्ड्यात घर कर, घर कर,\nअसे आमचा अंबिगर चौडय्या म्हणाला.","fr":"S'il mange, on dit qu'il est un démon,\ns'il ne mange pas, on dit qu'il est un oiseau *Chakora*.\nS'il jouit des plaisirs, on dit qu'il est un luxurieux,\ns'il n'en jouit pas, on dit qu'il subit ses actes passés.\nS'il demeure au village, on dit qu'il est un homme du monde,\ns'il demeure dans la forêt, on dit qu'il est de la race des bêtes.\nS'il dort, on dit qu'il est un corps inerte,\ns'il reste éveillé, on dit qu'il est un voleur.\nAinsi, de ceux qui ne marchent pas pour plaire aux gens,\nfais ta demeure, fais ta demeure dans le petit creux de leur pied gauche,\na dit notre Ambigara Chowdayya."},"m":{"en":"This Vachana by Ambigara Choudayya exposes the contradictory and fault-finding nature of worldly opinion, showing how society criticizes a person regardless of which path they choose.\n\nWhether one eats or fasts, enjoys worldly pleasures or abstains from them, lives within the community or retreats to the forest, or sleeps or stays awake, people invariably attach a derogatory label—ranging from a gluttonous demon, a Chakora bird, a lustful person, or a victim of past karma, to a householder, a wild beast, a lazy body, or a thief.\n\nThrough these sharp contrasts, the Vachana highlights the futility of trying to live merely to gain social approval.\n\nWith the signature Ambigara Choudayya, the Vachana expresses profound reverence for those independent seekers who refuse to live simply to please the crowd, declaring a readiness to dwell even in the tiny hollow beneath their left foot.","hi":"यह वचन संसार के लोगों की विरोधाभासी मानसिकता और दोहरे मापदंडों को स्पष्ट करता है, जहाँ मनुष्य चाहे कैसा भी आचरण करे, समाज उसमें कोई न कोई दोष अवश्य ढूँढ लेता है।\n\nयदि कोई व्यक्ति भोजन करता है तो लोग उसे भूत या पेटू कहते हैं और न खाए तो चकोर कहते हैं; इसी प्रकार सांसारिक सुख भोगने पर कामी और त्याग करने पर पूर्व जन्म के कर्मों का भोगी कहकर उसकी निंदा की जाती है।\n\nगाँव या समाज के बीच रहने पर उसे संसारी और जंगल में एकांतवास करने पर पशु समान कहा जाता है; यहाँ तक कि सोने वाले को जड़देही (आलसी) और जागने वाले को चोर कहकर पुकारा जाता है।\n\nअंबिगर चौडय्या के इस वचन का केंद्रीय भाव यही है कि ऐसी लोक-निंदा या झूठी प्रशंसा की परवाह किए बिना अपने पथ पर चलने वाले निष्काम साधकों के बाएँ पैर के अंगूठे के नीचे के छोटे से गड्ढे में भी निवास करना परम सौभाग्य की बात है।","mr":"हे वचन जगाच्या दुटप्पी आणि विसंगत वृत्तीवर अचूक बोट ठेवते, जिथे माणसाने काहीही केले तरी लोक त्यावर टीका करण्यासाठी सज्ज असतात.\n\nजर एखाद्याने अन्न सेवन केले तर लोक त्याला खादाड भुतासारखा म्हणतात आणि नाही खाल्ले तर चकोर पक्षासारखा म्हणतात; तसेच सुखभोग घेतले तर कामी ठरवतात आणि त्यांचा त्याग केला तर पूर्वजन्मीचा पापी समजतात.\n\nसमाजात राहणाऱ्याला संसारी तर अरण्यात राहणाऱ्याला पशू मानले जाते; इतकेच नव्हे तर झोपणाऱ्याला आळशी आणि जागे राहणाऱ्याला चोर म्हणून हिणवले जाते.\n\nअशा या लहरी जगाची पर्वा न करता आणि लोकांच्या पसंतीसाठी न जगता जे लोक आपल्या निष्ठावंत मार्गावर ठाम राहतात, त्यांच्या डाव्या पायाच्या करंगळीखाली आश्रय घेण्याचा नम्र भाव या वचनातून व्यक्त होतो.","fr":"Ce vachana met en lumière la nature contradictoire et inévitable des jugements du monde, qui critique l'individu quelle que soit sa conduite.\n\nQue l'on mange ou que l'on jeûne, que l'on jouisse de la vie ou que l'on y renonce, que l'on vive parmi les hommes ou dans la forêt, ou encore que l'on dorme ou que l'on veille, la société trouve toujours un prétexte pour blâmer.\n\nÀ travers la signature spirituelle Ambigara Choudayya, le poète exprime sa profonde vénération pour les êtres libres qui refusent de conformer leur existence à cette quête illusoire de l'approbation publique.\n\nLa portée spirituelle de ce vachana réside dans l'appel à s'affranchir du regard fluctuant d'autrui, en choisissant de demeurer humblement au service de ceux qui marchent avec intégrité sans chercher à plaire au monde."}}]},
{"id":"s9","n":{"en":"Jedara Dasimayya","hi":"जेडर दासिमय्या","mr":"जेडर दासिमय्या","fr":"Jedara Dasimayya"},"v":[{"no":1714,"o":"ಅಚ್ಚ ಶಿವೈಕ್ಯಂಗೆ ಹೊತ್ತಾರೆ ಅಮಾವಾಸ್ಯೆ;\n ಮಟ್ಟ ಮಧ್ಯಾಹ್ನ ಸಂಕ್ರಾಂತಿ;\n ಮತ್ತೆ ಅಸ್ತಮಾನ ಪೌರ್ನಮಿ;\n ಭಕ್ತನ ಮನೆಯ ಅಂಗಳವೆ ವಾರಣಾಸಿ ಕಾಣಾ! ರಾಮನಾಥಾ.","t":{"en":"For one in pure union with Shiva, daybreak is the new moon day;\nhigh noon is the solstice;\nand sunset is the full moon day;\nthe very courtyard of a devotee's house is Varanasi, behold, O Ramanatha!","hi":"सच्चे शिवैक्य के लिए प्रातःकाल अमावस्या है,\nठीक मध्याह्न संक्रांति है,\nऔर सूर्यास्त ही पूर्णिमा है;\nभक्त के घर का आँगन ही वाराणसी है, देखो हे रामनाथ!","mr":"विशुद्ध शिवैक्यासाठी सकाळ म्हणजेच अमावास्या,\nभर दुपार म्हणजेच संक्रांत,\nआणि संध्याकाळ म्हणजेच पौर्णिमा;\nभक्ताच्या घराचे अंगणच वाराणसी असते, हे जाण, हे रामनाथा!","fr":"Pour le pur *Shivaikya*, celui qui est uni à Shiva, le matin même est la nouvelle lune ;\nle plein midi est le solstice ;\net le coucher du soleil est la pleine lune ;\nvois donc, la cour de la maison du dévot est elle-même Varanasi, ô Ramanatha !"},"m":{"en":"The central message of this Vachana is that for one who has attained genuine oneness with the Formless Supreme Consciousness, sacredness is not restricted to specific astrological timings or distant pilgrimage centres.\n\nThrough the imagery of dawn as the new moon (Amavasye), midday as the auspicious solar transition (Sankranti), and sunset as the full moon (Pournami), the Vachana rejects ritualistic notions of auspicious and inauspicious time, showing that every moment of the day is equally sacred to the awakened seeker.\n\nSimilarly, by declaring the courtyard of a devotee's home to be Varanasi itself, it challenges the conventional belief in external geographical holiness and affirms that true sanctity resides wherever genuine devotion is lived.\n\nAddressed to the Absolute through the ankitanama Ramanatha, the Vachana highlights how inner union with the Divine transforms ordinary time and everyday living space into the highest spiritual realm.","hi":"इस वचन का केंद्रीय भाव यह है कि जो साधक निराकार परमतत्त्व के साथ पूर्णतः एकरूप (शिवैक्य) हो चुका है, वह बाहरी तिथियों, मुहूर्तों और तीर्थस्थानों की पारंपरिक मान्यताओं से परे हो जाता है।\n\nऐसे सच्चे शिवैक्य के लिए अमावस्या, संक्रांति या पूर्णिमा जैसे विशेष पर्व किसी पंचांग पर निर्भर नहीं करते, बल्कि उसके लिए हर दिन का प्रातःकाल ही अमावस्या, मध्याह्न ही संक्रांति और सूर्यास्त का समय ही पूर्णिमा के समान पवित्र है।\n\nरामनाथ के संबोधन के माध्यम से यह स्पष्ट किया गया है कि एक सच्चे भक्त के घर का आँगन ही वाराणसी जैसे पवित्र तीर्थ के समान है, क्योंकि जहाँ शुद्ध भक्ति और चैतन्य का वास होता है, वहीं वास्तविक तीर्थ और पवित्रता विद्यमान रहती है।","mr":"हे वचन स्पष्ट करते की, ज्याने निराकार परमतत्त्वाशी संपूर्ण ऐक्य साधले आहे अशा शुद्ध शिवैक्य भक्तासाठी कोणताही विशिष्ट दिवस किंवा मुहूर्त वेगळा नसतो.\n\nअशा भक्तासाठी रोजची सकाळ हीच अमावास्या, भर दुपार हीच संक्रांत आणि सूर्यास्त हीच पौर्णिमा असते, म्हणजेच त्याचा प्रत्येक क्षण पवित्र असतो.\n\nबाह्य तिथी, सण किंवा कालगणनेच्या पलीकडे जाऊन तो प्रत्येक समयालाच पर्वकाळ मानतो.\n\nरामनाथ या परमतत्त्वाच्या साक्षीने वचनकार सांगतात की, अशा सच्च्या भक्ताला काशीसारख्या तीर्थक्षेत्री जाण्याची गरज नसून त्याच्या घराचे अंगण हेच त्याच्यासाठी वाराणसीसारखे पवित्र क्षेत्र असते.","fr":"Ce vachana met en lumière le fait que, pour l'être véritablement uni à la Conscience suprême (Shivaikya), la dépendance aux dates astrologiques et aux lieux de pèlerinage extérieurs perd toute pertinence.\n\nPour un tel être éveillé, chaque moment de la journée est intrinsèquement sacré : le matin équivaut à la nouvelle lune (Amavasye), le plein midi au solstice propice (Sankranti) et le crépuscule à la pleine lune (Pournami).\n\nDe même, la cour de la maison d'un vrai dévot devient aussi sainte que la cité sacrée de Varanasi, rendant inutile toute quête géographique du divin.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Ramanatha, le texte affirme que la véritable sacralité réside dans la pureté de l'union intérieure et dans l'espace quotidien de la dévotion, et non dans le calendrier rituel ou les sanctuaires lointains."}},{"no":1715,"o":"ಅಡಗಿನೊಳಗಣ ಹಾಲು ಅಡಗಿಪ್ಪ ಭೇದವನು\n ಬೆಡಗಪ್ಪ ತುಪ್ಪದ ಕಂಪಿನ ಪರಿಯಂತೆ.\n ಎಲೆ ಮೃಡನೆ! ನೀನು ಪ್ರಾಣ ಪ್ರಕೃತಿಗಳೊಳಗೆ\n ಅಡಗಿಹ ಭೇದವ ಲೋಕದ ಜಡರೆತ್ತ ಬಲ್ಲರೈ! ರಾಮನಾಥ.","t":{"en":"Like the secret of milk lying hidden within the flesh,\nand the manner of the fragrance of wondrous ghee—\nO Mrida! That you lie hidden within life-breath and nature—\nhow could the dullards of the world know this secret, O Ramanatha!","hi":"मांस के भीतर दूध के छिपे रहने के भेद की तरह,\nऔर मनोहर घी की सुगंध की भांति,\nहे मृड! तुम्हारे प्राण और प्रकृति के भीतर\nछिपे रहने के भेद को लोक के जड़ लोग भला कैसे जानें, हे रामनाथ!","mr":"मांसामध्ये दूध लपून राहण्याचे रहस्य,\nमनोहर तुपाच्या सुगंधाच्या रीतीप्रमाणे आहे.\nहे मृडा! तू प्राण आणि प्रकृतीमध्ये\nलपून राहण्याचे रहस्य जगातील जडमती कसे जाणतील, हे रामनाथा!","fr":"Le secret du lait caché au sein de la chair est semblable au parfum exquis du beurre clarifié.\nÔ Mrida ! Comment les êtres inertes de ce monde connaîtraient-ils le secret de ta présence cachée au sein du souffle vital et de la nature,\nô Ramanatha !"},"m":{"en":"This Vachana explains the subtle and invisible manner in which the Formless Supreme Reality pervades the living world.\n\nIt uses the imagery of milk concealed within the flesh of the udder, and the fragrant richness of ghee hidden within that milk, to illustrate how the ultimate essence remains unseen within the physical form.\n\nIn the same way, the Supreme Consciousness addressed as Ramanatha is intimately woven into both the vital breath (Prana) and physical nature (Prakriti).\n\nThe Vachana points out that those who remain spiritually dull and bound to superficial perception cannot grasp this profound mystery of the Divine dwelling silently within all existence.","hi":"यह वचन इस गहन दार्शनिक सत्य को स्पष्ट करता है कि निराकार परमतत्त्व प्राण और प्रकृति के भीतर सूक्ष्म एवं अदृश्य रूप से व्याप्त है।\n\nजिस प्रकार मांस या शरीर के भीतर दूध का सार छिपा रहता है और उस दूध के भीतर सुगंधित घी गुप्त रूप से समाहित होता है, उसी प्रकार परम चैतन्य भी संपूर्ण जीव-जगत और प्रकृति के अंतरतम में निहित है।\n\n'रामनाथ' को संबोधित यह वचन बताता है कि सांसारिक अज्ञान में डूबे जड़ बुद्धि वाले लोग प्राण और प्रकृति के भीतर छिपे इस सूक्ष्म आध्यात्मिक भेद को जानने में असमर्थ होते हैं।","mr":"हे वचन आपल्या शरीरात आणि संपूर्ण सृष्टीत सूक्ष्म रूपाने दडलेल्या परमतत्त्वाचे रहस्य उलगडून दाखवते.\n\nज्याप्रमाणे प्राण्याच्या मांसात दूध आणि दुधात सुगंधी तूप अदृश्य रूपाने सामावलेले असते, त्याचप्रमाणे रामनाथ हे निराकार परमतत्त्व आपल्या प्राणात आणि प्रकृतीमध्ये गुप्तपणे वास करून आहे.\n\nहे आंतरिक चैतन्य अत्यंत सूक्ष्म असल्यामुळे ते केवळ वरवरच्या दृष्टीला दिसत नाही, तर त्यासाठी आध्यात्मिक जाणिवेची गरज असते.\n\nसामान्य जगात अज्ञानात वावरणाऱ्या जडबुद्धीच्या लोकांना प्राणात आणि निसर्गात एकरूप झालेल्या या परम सत्याचा भेद कसा कळणार, असा सखोल विचार या वचनातून मांडला आहे.","fr":"Ce vachana met en lumière la présence subtile et immanente de la Réalité suprême sans forme, désignée ici par l’ankitanama Ramanatha, au cœur même du souffle vital et de la nature.\n\nPour illustrer ce mystère, le poète recourt à l’image du lait dissimulé dans la chair de l’être vivant et à celle du parfum délicat contenu de manière latente dans le beurre clarifié.\n\nDe la même façon, le Principe suprême demeure invisiblement uni à la vie et à la matière, tout en conservant sa nature distincte et transcendante.\n\nLa portée spirituelle de ce vachana réside dans le constat que les esprits engourdis par l’ignorance mondaine sont incapables de discerner cette vérité intime qui anime pourtant toute l’existence."}},{"no":1716,"o":"ಅಡವಿ ಅರಣ್ಯದಲ್ಲಿ ಮಡಿವನಕ ತಪವಿದ್ದು\n ಮಡಿವಾಗ ಮೃಡನ ಮರೆದಡೆ,\n ತುಂಬಿದ ಸಕ್ಕರೆಯ ಮಡುವಿನೊಳಗೊಕ್ಕಂತೆ! ರಾಮನಾಥ.","t":{"en":"After practising penance in forests and wilderness until death,\nif at the moment of dying one forgets Mrida,\nit is like drowning in a pool brimming with sugar, O Ramanatha!","hi":"वन-अरण्य में मरते दम तक तप करके,\nमरते समय मृड को भूल जाएँ,\nतो यह भरे हुए शक्कर के कुंड में डूब मरने के समान है! हे रामनाथ।","mr":"रानावनात मरेपर्यंत तपश्चर्या करत राहून,\nमरताना जर मृडालाच विसरले,\nतर ते साखरेने भरलेल्या डोहात बुडून मेल्यासारखेच आहे! हे रामनाथा।","fr":"Après avoir pratiqué l'ascèse dans les bois et les forêts jusqu'à la mort,\nsi, à l'heure de mourir, l'on oublie Mrida,\nc'est comme plonger dans un bassin profond rempli de sucre, ô Ramanatha !"},"m":{"en":"This Vachana highlights the futility of lifelong external penance if inner awareness of the Divine is lost at the crucial moment of death.\n\nPerforming severe austerities in deep forests until the end of one's life holds no spiritual value if one forgets the Supreme Reality, referred to here as Mruda, when dying.\n\nThrough the vivid metaphor of drowning in a pool filled with sugar, the Vachana illustrates the tragedy of being surrounded by the sweetness of spiritual practice yet perishing without truly experiencing its essence.\n\nAddressing Ramanatha, the Formless Supreme Consciousness, the Vachana emphasizes that genuine spiritual fulfillment lies in unwavering, continuous awareness rather than mere physical asceticism.","hi":"यह वचन इस सत्य को स्पष्ट करता है कि यदि कोई व्यक्ति जीवन भर घने जंगल में रहकर कठोर तपस्या करे, किंतु अपने अंतिम समय में परम चैतन्य (मृड) का स्मरण ही भूल जाए, तो उसकी सारी साधना व्यर्थ हो जाती है।\n\nइस स्थिति को स्पष्ट करने के लिए वचन में शक्कर से भरे हुए तालाब या कुंड में डूबकर मरने का एक प्रभावशाली रूपक दिया गया है।\n\nजिस प्रकार मिठास के अथाह भंडार में रहते हुए भी यदि कोई उसका आस्वादन करने के बजाय उसी में डूबकर प्राण त्याग दे, तो वह शक्कर उसके किसी काम नहीं आती।\n\nरामनाथ के संबोधन के माध्यम से इस वचन का आध्यात्मिक आशय यह है कि बाहरी तपस्या का वास्तविक मूल्य तभी है जब जीवन के अंतिम क्षण तक निराकार परमतत्त्व की अखंड जागृति बनी रहे।","mr":"हे वचन स्पष्ट करते की, एखाद्याने आयुष्यभर रानावनात राहून मरेपर्यंत कितीही कठोर तपश्चर्या केली, तरी अंतिम समयी परमतत्त्वाचे स्मरण राहिले नाही तर ती सर्व साधना व्यर्थ ठरते.\n\nअशा प्रकारे शेवटच्या क्षणी शिवतत्त्वाला विसरणे म्हणजे साखरेने काठोकाठ भरलेल्या डोहात पडूनही बुडून जाण्यासारखे निरर्थक आहे, हे या दृष्टांतातून अधोरेखित केले आहे.\n\nरामनाथ या अंकितनामाने युक्त असलेले हे वचन बाह्य तपस्यांपेक्षा आयुष्याच्या शेवटच्या श्वासापर्यंत टिकून राहणाऱ्या अखंड आत्मजागृतीचे आणि परमतत्त्वाच्या स्मरणाचे महत्त्व सांगते.","fr":"Ce vachana met en lumière la futilité des austérités extérieures prolongées lorsqu'elles ne s'accompagnent pas d'une conscience constante du Principe suprême jusqu'au terme de l'existence.\n\nIl explique que consacrer sa vie entière à la pénitence au fond des forêts devient totalement vain si l'on en vient à oublier Mruda, évocation de la Réalité suprême sans forme également désignée par la signature spirituelle Ramanatha, à l'instant même de la mort.\n\nPour illustrer ce paradoxe, le poème recourt à l'image saisissante d'une personne qui se noierait dans un bassin rempli de sucre : bien qu'immergée dans une douceur abondante, elle périt sans pouvoir en recueillir le bienfait.\n\nLa portée spirituelle de ce vachana réside ainsi dans l'affirmation que l'ascèse sévère ne remplace pas l'éveil intérieur ininterrompu, seul garant d'une quête authentique jusqu'au dernier souffle."}},{"no":1717,"o":"ಅನುಭಾವವಿಲ್ಲದೆ ಈ ತನು ಎಳತಟವಾದುದಯ್ಯಾ.\n ಅನುಭಾವವೀ ತನುವಿಂಗೆ ಆಧಾರ.\n ಅನುಭಾವರ ಅನುಭಾವವನು\n ಮನವಾರೆ ವೇಧಿಸಿದವರಿಗೆ ಜನನವಿಲ್ಲ ಕಾಣಾ! ರಾಮನಾಥ.","t":{"en":"Without mystic communion, this body has grown restless, O Lord.\nMystic communion is the very support of this body.\nThe mystic communion of the realized ones—\nfor those who have fathomed it wholeheartedly, there is no rebirth, behold, O Ramanatha!","hi":"अनुभाव के बिना यह तन अस्थिर हो गया है, हे स्वामी।\nअनुभाव ही इस तन का आधार है।\nअनुभावियों के अनुभाव को\nजी भरकर भेदनेवालों के लिए पुनर्जन्म नहीं है, देखो! हे रामनाथ।","mr":"अनुभावाशिवाय हे तन व्याकूळ झाले आहे, हे प्रभो.\nअनुभावच या तनाला आधार आहे.\nअनुभावीजनांच्या अनुभावाला\nमनापासून जाणून घेतलेल्यांना जन्म नाही पाहा, हे रामनाथा!","fr":"Sans *Anubhava*, la communion mystique, ce corps est devenu chancelant, ô Seigneur.\nL'*Anubhava* est le soutien de ce corps.\nL'*Anubhava* de ceux qui demeurent dans l'*Anubhava*,\npour ceux qui l'ont pénétré de tout leur cœur, il n'y a plus de naissance, vois-tu, ô Ramanatha !"},"m":{"en":"This Vachana explains that without mystical experience (Anubhava), the human body remains restless, unstable, and without true purpose.\n\nIn Sharana philosophy, direct spiritual insight is the very foundation that sustains and gives meaning to physical existence.\n\nBy wholeheartedly absorbing and internalizing the wisdom shared by enlightened seekers (Anubhavis), one elevates the mind toward Formless Supreme Consciousness, addressed here through the ankitanama Ramanatha.\n\nThose who deeply assimilate this experiential realization within their consciousness transcend the cycle of birth and attain ultimate spiritual fulfillment.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक अनुभाव (आत्मिक अनुभूति और दिव्य ज्ञान) के बिना यह मानवीय शरीर भटककर निस्तेज और दिशाहीन हो जाता है।\n\nयथार्थ रूप में आध्यात्मिक अनुभाव ही इस शरीर और जीवन का वास्तविक आधार है।\n\nजो साधक प्रबुद्ध अनुभावियों (शरणों) की गहन आध्यात्मिक अनुभूति को पूरे मन और अंतःकरण से आत्मसात कर लेते हैं, वे जन्म-मरण के चक्र से मुक्त हो जाते हैं।\n\nनिराकार परमतत्त्व रामनाथ को संबोधित यह वचन स्पष्ट करता है कि कोरे बाहरी आचरण के बजाय सच्चे अनुभावियों के ज्ञान और प्रत्यक्ष आत्म-साक्षात्कार को गहराई से हृदयंगम करना ही परम मुक्ति का मार्ग है।","mr":"हे वचन आध्यात्मिक अनुभावाचे मानवी जीवनातील अनन्यसाधारण महत्त्व स्पष्ट करते.\n\nप्रत्यक्ष आध्यात्मिक अनुभावाशिवाय मानवी देह आणि जीवन अस्थिर व भरकटलेले राहते; कारण हा अनुभावच मानवी अस्तित्वाला खरा आधार देतो.\n\nज्ञानी अनुभावी व्यक्तींच्या आध्यात्मिक अनुभवाचे रहस्य जे साधक मनापासून जाणून घेतात आणि आत्मसात करतात, त्यांची जन्म-मरण रूपी भवबंधनातून मुक्तता होते, असा गहन विचार 'रामनाथ' या अंकितनामाच्या साक्षीने येथे मांडला आहे.","fr":"Ce vachana met en lumière le rôle vital de l'Anubhava, l'expérience spirituelle vécue, sans laquelle le corps humain demeure dans un état de confusion et d'égarement.\n\nIl explique que cette connaissance intérieure constitue le véritable fondement et le soutien essentiel de l'existence incarnée.\n\nEn pénétrant de tout son cœur la sagesse expérientielle des êtres éveillés, l'être humain s'affranchit définitivement du cycle des renaissances pour s'unir à la Réalité suprême sans forme, invoquée sous le nom de Ramanatha."}},{"no":1718,"o":"ಅರುಹ ಅರಿಯಲೆಂದು\n ಕುರುಹ ಕೈಯಲ್ಲಿ ಕೊಟ್ಟ!\n ಅರುಹನೆ ಮರೆದು ಕುರುಹನೆ [ಅ]ರಿದ!\n ಈ ಕುರುಂಬರಿಗಿನ್ನೆತ್ತಣ ಮುಕ್ತಿಯೊ? ರಾಮನಾಥ.","t":{"en":"To realize the formless awareness,\nHe placed the symbolic form in the hand!\nForgetting the formless awareness itself, one knew only the symbolic form!\nWhere anymore is liberation for these deluded ones, O Ramanatha?","hi":"चेतना को जानने के लिए\nचिह्न हाथ में दिया!\nचेतना को ही भूलकर चिह्न को ही जाना!\nइन मूढ़ों को अब कहाँ से मुक्ति, हे रामनाथ?","mr":"अरुहू जाणावे म्हणून\nकुरुहू हाती दिले!\nअरुहूच विसरून कुरुहूच जाणले!\nया अडाण्यांना आता कुठली मुक्ती, हे रामनाथा?","fr":"Afin que l'on connaisse la Conscience sans forme,\nIl a remis le signe dans la main !\nOubliant la Conscience même, on n'a reconnu que le signe !\nD'où viendrait donc la délivrance pour ces bergers égarés, ô Ramanatha ?"},"m":{"en":"This Vachana explains the true relationship between the visible spiritual symbol (Kuruhu) and the Formless Supreme Consciousness (Aruhu) in Sharana philosophy.\n\nThe Ishtalinga placed in the palm is given strictly as a sacred medium and starting point to help the seeker focus the mind and realize the vast, Formless Reality.\n\nHowever, the Vachana critiques the spiritual blindness of those who become completely absorbed in the physical symbol itself while forgetting the inner awareness and Ultimate Truth it represents.\n\nAddressing the Absolute as Ramanatha, the Vachana questions how liberation is ever possible for such misguided individuals who mistake the mere sign for the Supreme Consciousness.","hi":"यह वचन इस केंद्रीय दर्शन को स्पष्ट करता है कि हाथ में दिया गया बाह्य प्रतीक (कुरुहु या इष्टलिंग) वास्तव में निराकार परमतत्त्व की उच्चतम चेतना (अरुहु) को जानने और उसमें प्रवेश करने का एक पवित्र माध्यम मात्र है।\n\nकिंतु अज्ञानी मनुष्य उस परम ज्ञान और शुद्ध चैतन्य को ही भूल जाता है तथा केवल बाहरी चिह्न या भौतिक रूप को ही सब कुछ समझकर उसी में उलझकर रह जाता है।\n\nरामनाथ के माध्यम से यह वचन आध्यात्मिक सत्य को रेखांकित करता है कि जो विवेकहीन लोग माध्यम के पीछे छिपे वास्तविक निराकार सत्य को विस्मृत कर केवल बाह्य प्रतीक तक सीमित हो जाते हैं, उन्हें मुक्ति कदापि प्राप्त नहीं हो सकती।","mr":"हे वचन आत्मज्ञानाची जाणीव (अरुह) आणि त्याकडे नेणारे प्रतीक किंवा माध्यम (कुरुह) यांमधील महत्त्वाचा फरक स्पष्ट करते.\n\nअमूर्त परमतत्त्वाची व आत्मज्ञानाची अनुभूती मिळावी या उद्देशानेच हातावर इष्टलिंगासारखे साकार प्रतीक दिले गेले आहे, जेणेकरून ते निराकार सत्यापर्यंत पोहोचण्याचे एक पवित्र माध्यम ठरावे.\n\nमात्र मूळ ज्ञान आणि शुद्ध चैतन्याचा विसर पडून जर साधक केवळ बाह्य प्रतीकामध्येच अडकून पडला, तर साधनेचा मूळ हेतूच नष्ट होतो.\n\nरामनाथ या अंकितनामाने संबोधित केलेल्या या वचनानुसार, मूळ सत्याला विसरून केवळ बाह्य चिन्हांनाच सर्वस्व मानणाऱ्या अशा अज्ञानी वृत्तीला मुक्ती मिळणे अशक्य आहे.","fr":"Ce vachana met en lumière le rôle véritable de l’Ishtalinga en tant que Kuruhu, le signe sacré confié dans la paume de la main pour servir de moyen d’accès à la Conscience suprême sans forme, l’Aruhu.\n\nIl souligne que ce support matériel et visuel n’a d’autre finalité que d’orienter l’esprit vers la connaissance intérieure de la Réalité absolue.\n\nLe texte déplore l’erreur de ceux qui oublient cette Conscience pure pour ne s’attacher qu’à la forme extérieure du symbole et aux pratiques superficielles.\n\nAdressé à la Réalité suprême sous la signature spirituelle de Ramanatha, ce vachana affirme qu’aucune libération n’est possible tant que l’on confond le moyen spirituel avec sa finalité ultime."}}]}
];
const LN={en:['English','English'],hi:['हिन्दी','Hindi'],mr:['मराठी','Marathi'],fr:['Français','French']};
let lang='en',tab='v',sel=null,q='',cur=null,openNo=null,sy=0;
const A=document.getElementById('app'),g=o=>o[lang]||o.en;
const all=()=>[...D].sort((a,b)=>g(a.n).localeCompare(g(b.n),lang)).flatMap(s=>s.v.map(v=>({s,v})));
const byNo=()=>D.flatMap(s=>s.v.map(v=>({s,v}))).sort((a,b)=>a.v.no-b.v.no);
const fl=v=>((g(v.t)||'').split('\n').map(x=>x.trim()).find(Boolean)||'');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vrow=(x,sh)=>`<button class="vrow" data-no="${x.v.no}"><span class="vn">${x.v.no}</span><span class="vb"><span class="vl">${esc(fl(x.v))}</span>${sh?`<small>${esc(g(x.s.n))}</small>`:''}</span></button>`;
function openV(no,fromDrawer){const L=byNo(),x=L.find(y=>y.v.no==no);if(!x)return;
if(fromDrawer){sel=x.s.id;q='';sy=0;tab='v';openNo=no;shell()}else{sy=bd.scrollTop;tab='v';openNo=no;view()}}
function detail(){const b=bd,L=byNo(),i=L.findIndex(y=>y.v.no==openNo),x=L[i];
if(!x){openNo=null;view();return}
const p=L[i-1],n=L[i+1];

const ABT={b:`<h3>Guru Basavanna (1105–1167 CE)</h3>
<figure class="fig guru"><img src="${IMG_GURU}" alt="Guru Basavanna holding the Ishtalinga"></figure>
<p>Guru Basavanna was a visionary 12th-century philosopher, statesman, mystic poet, and social reformer from Karnataka who founded the Lingayat tradition. Born into an orthodox Brahmin family in Ingaleshwar-Bagevadi to Madiraja and Madalambike, he discarded ritual dogma and the sacred thread in youth, pursuing spiritual realization at Kudalasangama before serving as prime minister under Kalachuri King Bijjala II at Kalyana.</p>
<p>To democratize spirituality, Basavanna introduced the Ishtalinga—a personal, wearable icon of the formless divine that guided seekers along the sixfold Shatsthala path, advancing from initial devotion (Bhakti) to absolute union (Aikya).</p>
<p>At Kalyana, he established the Anubhava Mantapa, an egalitarian spiritual parliament where seekers of all castes and genders deliberated freely. His movement championed honest labor as heaven (Kayakave Kailasa), dedicated distribution of resources (Dasoha), the complete eradication of caste and gender hierarchies, and the power of simple Kannada poetry (Vachanas) dedicated to Kudalasangamadeva.</p>
<p>Orthodox resistance to an inter-caste marriage among the Sharanas eventually ignited the turbulent Kalyana Revolution. Pained by the conflict, Basavanna left for Kudalasangama, where he attained Aikya in 1167 CE.</p>
<p>In the aftermath, the Sharanas fought courageously during a perilous migration to Ulavi to protect and preserve their palm-leaf Vachana manuscripts for future generations.</p>`,t:`<h3>Core Tenets of Basava Philosophy</h3><p>Basava philosophy is structured around foundational frameworks designed to elevate the individual spiritually while establishing an egalitarian, ethical society.</p><h4>1. Ashtavarana (The Eight Shields)</h4><p>The eight protective spiritual shields that safeguard the practitioner (Sharana) on the path of inner discipline and devotion:</p><ul><li><b>Guru:</b> The spiritual guide who initiates the seeker and imparts divine wisdom.</li><li><b>Linga:</b> The Ishtalinga, worn on the chest as the concrete symbol of the formless supreme reality.</li><li><b>Jangama:</b> The wandering mystic or ascetic who serves society and personifies dynamic spiritual wisdom.</li><li><b>Padodaka:</b> The sanctified water received from the Guru, Linga, or Jangama, symbolizing internal purification.</li><li><b>Prasada:</b> The consecrated food or grace received with humility, freeing the seeker from physical cravings.</li><li><b>Vibhuti:</b> The sacred ash applied on the body, signifying purity, detachment, and the impermanence of worldly life.</li><li><b>Rudraksha:</b> The sacred bead worn as an aid to constant divine remembrance and mental composure.</li><li><b>Mantra:</b> The five-syllable sacred invocation (Panchakshari), recited to anchor the mind in constant communion.</li></ul><h4>2. Panchachara (The Five Codes of Conduct)</h4><p>The five moral and social pillars governing daily ethical living and civic responsibility:</p><ul><li><b>Lingachara:</b> Single-minded devotion to the personal Ishtalinga; rejection of all polytheistic and temple-centric mediation.</li><li><b>Sadachara:</b> Pure moral conduct, honest living, non-violence, truthfulness, and non-exploitation of others.</li><li><b>Shivachara:</b> Universal equality; viewing every human being as a manifestation of the divine without discrimination based on caste, creed, or gender.</li><li><b>Bhrityachara:</b> Absolute humility; conducting oneself as a humble servant to the community and fellow seekers.</li><li><b>Ganachara:</b> Righteous moral courage; taking a firm, collective stand against social injustice, dogma, and untruth.</li></ul><h4>3. Shatsthala (The Six Spiritual Stages)</h4><p>The sixfold progressive ascent of the soul (Anga) toward complete non-dual union with the divine (Linga):</p><ul><li><b>Bhakti Sthala:</b> The stage of pure devotion and reverence through the worship of the Ishtalinga.</li><li><b>Mahesha Sthala:</b> Steadfast moral discipline, unshakeable resolve, and ethical commitment.</li><li><b>Prasada Sthala:</b> Calm selflessness, viewing everything experienced as an offering of divine grace.</li><li><b>Pranalinga Sthala:</b> Internalization, realizing the Linga not merely as an external icon but as one’s vital life-breath.</li><li><b>Sharana Sthala:</b> Surrender and intuitive communion; experiencing the divine within every aspect of consciousness.</li><li><b>Aikya Sthala:</b> The pinnacle of spiritual evolution; complete, seamless merger of the individual self into absolute divinity.</li></ul><h4>4. Foundational Socio-Ethical Tenets</h4><p>The practical everyday principles that made the movement a social revolution:</p><ul><li><b>Kayaka:</b> Kayakave Kailasa—Honest, productive labor is divine worship in itself. No legitimate work is superior or inferior.</li><li><b>Dasoha:</b> Dedicated communal sharing without ego. What is earned through Kayaka is distributed back to society to serve the needy and the community.</li><li><b>Dehave Devalaya:</b> The physical body itself is the true, living temple; static stone structures are secondary (Sthavarakku alivundu, Jangamakku alivilla).</li><li><b>Anubhava:</b> Direct personal mystical experience validated through rational communal reflection, superseding blind scriptural dogma.</li><li><b>Saptashila (The Seven Moral Vows):</b> Basavanna’s concise code of ethics outlined in his celebrated Vachana: do not steal, do not kill, do not lie, do not lose your temper, do not despise others, do not praise yourself, and do not scorch others with your words.</li></ul>`,s:`<h3>Basava Samithi</h3>
<figure class="fig emb"><img src="${LOGO}" alt="Basava Samithi emblem"></figure>
<figure class="fig bld"><img src="${IMG_BLD}" alt="Anubhava Mantapa, the Basava Samithi building, Bengaluru" loading="lazy"></figure>
<p>Basava Samithi is a non-profit socio-cultural and educational organization headquartered at Basava Bhavan in Bengaluru. Founded in 1964 by the former Vice President of India, Dr. B. D. Jatti, the institution has been running successfully for over six decades, dedicated to preserving, researching, and disseminating the philosophy of Jagadjyothi Basaveshwara and the 12th-century Sharanas.</p>
<p>Under the leadership of its current President, Dr. Aravind Jatti, the Samithi has expanded its global presence and modernized its outreach. It works actively across several key areas:</p>
<ul><li><b>Vachana Translation &amp; Publications:</b> Publishing authentic compilations and translating Kannada Vachana literature into major Indian and international languages to make Sharana philosophy universally accessible.</li>
<li><b>Research and Academic Initiatives:</b> Organizing national and international seminars, symposiums, endowment lectures, and research projects on Lingayat thought, comparative philosophy, and democratic traditions.</li>
<li><b>Promoting Core Humanist Values:</b> Propagating foundational Sharana principles, including Kayaka (the dignity of honest labor), Dasoha (selfless community service and sharing), caste and gender equality, and social justice.</li>
<li><b>Global Network &amp; Cultural Centers:</b> Operating active branch centers across India and overseas, spearheading Basava Jayanti celebrations, youth workshops, and digital initiatives to connect newer generations with Vachana heritage.</li></ul>
<figure class="fig pres"><img src="${IMG_PRES}" alt="Dr. Aravind Jatti, President, Basava Samithi" loading="lazy"><figcaption><b>Dr. Aravind Jatti</b>President, Basava Samithi</figcaption></figure>`};
function hero(){setBg(1);A.innerHTML=`<div class="scr hero"><img class="logo" src="${LOGO}" alt="Basava Samithi emblem"><div class="cz a">Basava Samithi</div><div class="cz b">Presents</div><div class="cz c">Vachanas</div><div class="cz d">for</div><div class="cz c">Humanity</div><div class="tag">Beyond Languages. Beyond Borders.</div><button class="btn" id="go">Begin</button></div>`;go.onclick=pick}
function pick(){setBg(0);stopSpeak();A.innerHTML=`<div class="scr"><div class="pad"><h2>Choose your language</h2><p class="sub">Sharanas, vachanas and their meanings will appear in the language you pick. You can change it anytime.</p>${Object.keys(LN).map(k=>`<button class="lang ${k==lang?'on':''}" data-k="${k}">${LN[k][0]}<small>${LN[k][1]}</small></button>`).join('')}</div><div class="foot"><button class="btn" id="go">Continue</button></div></div>`;
A.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.k;document.documentElement.lang=lang;pick()});go.onclick=()=>{if(!openNo){sel=null;q=''}tab='v';shell()}}
function vc(x){const{s,v}=x,lg=false;return `<article class="vc"><div class="meta"><b>${g(s.n)}</b><span>Vachana ${v.no}</span></div><p class="vt">${g(v.t)}</p>${v.o?`<details class="orig"><summary>Original in Kannada</summary><p>${v.o}</p></details>`:''}<div class="mean ${lg?'cl':''}" ${lg?'onclick="this.classList.toggle(\'cl\')"':''}><i>Meaning</i><span class="tx">${g(v.m)}</span>${lg?'<span class="more"><span class="m1">Read more</span><span class="m2">Show less</span></span>':''}</div>${v.t[lang]?'':'<span class="fb">Translation pending. Showing English.</span>'}</article>`}
function shell(){setBg(0);stopSpeak();A.innerHTML=`<div class="scr"><div class="top"><div class="rt"><button class="spk" id="mn" aria-label="Open vachana index" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><span class="cz">Vachanas</span></div><div class="rt"><button class="spk" id="sp" aria-label="Listen to this page" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button class="spk" id="nm" aria-pressed="${night}" aria-label="${night?'Switch to day mode':'Switch to night mode'}">${nmIcon()}</button><button class="chip" id="lg">${LN[lang][0]}</button></div></div><div class="body" id="bd"></div><nav class="nav">${[['v','Vachanas'],['s','Random'],['a','About'],['c','Contact']].map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('')}</nav>${drawerHTML()}</div>`;
lg.onclick=pick;sp.onclick=speak;nm.onclick=toggleNight;bindDrawer();A.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;openNo=null;if(tab=='s')cur=null;shell()});view()}
function view(){stopSpeak();const b=bd;if(tab=='v'&&openNo){detail();return}if(tab=='v'){b.innerHTML=(sel?`<button class="back" id="bk">‹ All sharanas</button><h2>${g(D.find(s=>s.id==sel).n)}</h2>`:`<h2>Sharanas</h2><p class="sub">${D.length} vachanakaras in alphabetical order</p>`)+`<div class="srch"><input id="q" value="${q}" placeholder="Search by keyword or vachana number" inputmode="search"></div><div id="ls"></div>`;
if(sel)bk.onclick=()=>{sel=null;q='';view()};document.getElementById('q').oninput=e=>{q=e.target.value;list()};list()}
else if(tab=='s'){cur=cur||all()[Math.floor(Math.random()*all().length)];b.innerHTML=`<h2>Random</h2><p class="sub">A random vachana, picked just for you.</p>${vc(cur)}<div style="text-align:center"><button class="btn" id="ag">Show another</button></div>`;ag.onclick=()=>{let n;do{n=all()[Math.floor(Math.random()*all().length)]}while(n==cur&&all().length>1);cur=n;view()}}
else if(tab=='a'){b.innerHTML=`<h2>About</h2><div class="pills">${[['b','Basavanna'],['t','Core Tenets'],['s','Basava Samithi']].map(x=>`<button class="pill ${x[0]==ab?'on':''}" data-a="${x[0]}">${x[1]}</button>`).join('')}</div><div class="blk ab">${ABT[ab]}</div>`;b.querySelectorAll('.pill').forEach(q=>q.onclick=()=>{ab=q.dataset.a;view()})}
else b.innerHTML=`<h2>Contact</h2><p class="sub">We would love to hear from you.</p><div class="blk"><h3>Address</h3><p>#1, Basava Bhawan<br>Basaveshwara Circle,<br>Bangalore 560 001,<br>Karnataka, India</p></div><div class="blk"><h3>Phone</h3><p><a href="tel:+918022265505">080 22265505</a>, <a href="tel:+918022375001">22375001</a></p></div><div class="blk"><h3>Email</h3><p><a href="mailto:basavasamithi.india@gmail.com">basavasamithi.india@gmail.com</a></p></div><div class="blk"><h3>Official Website</h3><p><a href="https://basavasamithi.org" target="_blank" rel="noopener">basavasamithi.org</a></p></div><div class="blk"><h3>Feedback</h3><input class="in" placeholder="Your name"><textarea rows="4" placeholder="Share your thoughts"></textarea><button class="btn" style="margin-top:14px" id="sd">Send feedback</button></div>`;
if(tab=='c')sd.onclick=()=>{const t=document.createElement('div');t.className='toast';t.textContent='Thank you. Your feedback was sent.';A.appendChild(t);setTimeout(()=>t.remove(),2200)}}
function list(){stopSpeak();const el=document.getElementById('ls'),k=q.trim().toLowerCase();
if(!k&&!sel){const ss=[...D].sort((a,b)=>g(a.n).localeCompare(g(b.n),lang));let h='',l='';ss.forEach(s=>{const c=[...g(s.n)][0].toUpperCase();if(c!=l){l=c;h+=`<div class="ltr">${c}</div>`}h+=`<button class="row" data-id="${s.id}">${g(s.n)}<small>${s.v.length} vachana${s.v.length>1?'s':''}</small></button>`});el.innerHTML=h;el.querySelectorAll('.row').forEach(r=>r.onclick=()=>{sel=r.dataset.id;q='';view()});return}
const r=byNo().filter(x=>(!sel||x.s.id==sel)&&(!k||String(x.v.no)==k||[g(x.v.t),g(x.v.m),g(x.s.n)].join(' ').toLowerCase().includes(k)));
el.innerHTML=r.length?`<p class="cnt">${r.length} vachana${r.length>1?'s':''}</p>`+r.map(x=>vrow(x,!sel)).join(''):'<p class="empty">No vachanas found. Try another word or number.</p>';el.querySelectorAll('.vrow').forEach(x=>x.onclick=()=>openV(+x.dataset.no))}
(function(){const r=Math.random,c=[];for(let i=0;i<120;i++){const a=(.25+r()*.65).toFixed(2),z=r()<.12?1.4:.8,k=`rgba(232,240,255,${a})`;c.push(`radial-gradient(circle at ${(r()*100).toFixed(1)}% ${(r()*100).toFixed(1)}%,${k} 0,${k} ${z}px,transparent ${z+.6}px)`)}c.push('radial-gradient(120% 45% at 50% 112%,rgba(60,90,230,.32),transparent 65%)','linear-gradient(#060D2E,#030718)');window.STARS=c.join(',')})();
const setBg=s=>{A.style.background=s?STARS:'var(--bg)'};
const MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
let night=false;try{localStorage.removeItem('vfh-night')}catch(e){}
const nmIcon=()=>night?SUN:MOON;
function applyMode(){const r=document.documentElement;if(night)r.setAttribute('data-mode','night');else r.removeAttribute('data-mode');
const b=document.getElementById('nm');if(b){b.innerHTML=nmIcon();b.setAttribute('aria-pressed',String(night));b.setAttribute('aria-label',night?'Switch to day mode':'Switch to night mode')}}
function toggleNight(){night=!night;applyMode()}
applyMode();
hero();
</script>
</body>
</html>
