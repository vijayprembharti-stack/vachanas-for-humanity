ತಿಯನ್ನು ಒಂದು ಮದುವೆಯ ರೂಪಕದ ಮೂಲಕ ವಿವರಿಸಲಾಗಿದೆ.\n\nಇಲ್ಲಿ ಗುರುವೇ ಮುಂದೆ ನಿಂತು ಸಂಬಂಧವನ್ನು ಬೆಸೆಯುವ ಬಂಧುವಾದರೆ, ಅರಿವಿನ ಕುರುಹಾದ ಲಿಂಗವೇ ವರನಾಗಿದ್ದಾನೆ ಮತ್ತು ಸಾಧಕಿಯೇ ವಧುವಾಗಿದ್ದಾಳೆ.\n\nಅಸಂಖ್ಯಾತ ಶರಣರೇ ತಂದೆ-ತಾಯಿಗಳಾಗಿ ನಿಂತು, ಇಡೀ ಜಗತ್ತಿಗೆ ತಿಳಿಯುವಂತೆ ತನಗೆ ಸರಿಸಾಟಿಯಾದ ಮತ್ತು ಅತ್ಯಂತ ಯೋಗ್ಯನಾದ ವರನನ್ನು ನೋಡಿ ಧಾರೆ ಎರೆದು ಕೊಟ್ಟಿದ್ದಾರೆ ಎಂಬುದು ಇಲ್ಲಿನ ಭಾವವಾಗಿದೆ.\n\nಹೀಗೆ ಪರಮಚೈತನ್ಯವಾದ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನೇ ತನಗೆ ನಿಜವಾದ ಗಂಡನಾಗಿರುವುದರಿಂದ, ಪ್ರಾಪಂಚಿಕವಾದ ಇತರ ಯಾವುದೇ ಲೌಕಿಕ ಸಂಬಂಧಗಳಿಗೂ ಮತ್ತು ತನಗೂ ಇನ್ನು ಯಾವ ನಂಟೂ ಇಲ್ಲ ಎಂಬ ಅಚಲವಾದ ನಿಲುವು ಈ ವಚನದಲ್ಲಿ ವ್ಯಕ್ತವಾಗಿದೆ."}}]},
{"id":"s5","n":{"en":"Amuge Rayamma","hi":"अमुगे रायम्मा","mr":"अमुगे रायम्मा","fr":"Amuge Rayamma","te":"అముగే రాయమ్మ","kn":"ಅಮುಗೆ ರಾಯಮ್ಮ"},"v":[{"no":1280,"o":"ಬೀಜವಿಲ್ಲದೆ ವೃಕ್ಷ ಬೆಳೆಯಬಲ್ಲುದೆ?\n ಹೂವಿಲ್ಲದೆ ಹಣ್ಣಾಗಬಲ್ಲುದೆ?\n ತೆಂಗಿನ ಮರವ ಬಿತ್ತಿದಡೆ ಅಂಬರಕ್ಕೆ ಹೋಯಿತ್ತು,\n ಕಾಯಿಲ್ಲದೆ ನೀ[ರಿ]ಲ್ಲದೆ\n ಗಾಳಿಗೆ ಮರ ಮುರಿದಂತೆ ಆಯಿತ್ತು ಕಾಣಾ.\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದ\n ಅನಾಚಾರಿಗಳ ವಿರಕ್ತರೆಂಬೆನೆ? ಎನಲಾಗದು.","t":{"en":"Can a tree grow without a seed?\nCan fruit form without a flower?\nWhen a coconut tree was planted, it rose up to the sky;\nyet without coconut, without water,\nsee, it became like a tree snapped by the wind!\nCan I call those devoid of righteous conduct,\nwho do not know Amugeshwaralinga, renunciants? I cannot call them so.","hi":"बिना बीज के क्या वृक्ष बढ़ सकता है?\nबिना फूल के क्या फल बन सकता है?\nनारियल का पेड़ बोने पर वह आकाश तक गया,\nबिना फल के, बिना पानी के,\nहवा से पेड़ टूट जाने के समान हुआ, देखो।\nअमुगेश्वरलिंग को न जाननेवाले\nअनाचारियों को क्या विरक्त कहूँ? नहीं कहा जा सकता है।","mr":"बीजाशिवाय वृक्ष वाढू शकेल का?\nफुलाशिवाय फळ येऊ शकेल का?\nनारळाचे झाड लावले तर ते आभाळापर्यंत गेले,\nपण फळाशिवाय आणि पाण्याशिवाय\nवाऱ्याने झाड मोडून पडल्यासारखे झाले, पाहा.\nअमुगेश्वरलिंगाला न जाणणाऱ्या\nअनाचाऱ्यांना विरक्त म्हणू का? तसे म्हणता येणार नाही.","fr":"Sans semence, l'arbre peut-il croître ?\nSans fleur, le fruit peut-il naître ?\nLorsqu'on plante un cocotier, il s'élève jusqu'au ciel ;\nmais sans noix et sans eau,\nil est pareil à un arbre brisé par le vent, vois-tu.\nCeux qui sont dépourvus de juste conduite et ignorent Amugeshwaralinga,\npuis-je les appeler des renonçants ? On ne peut les appeler ainsi.","te":"విత్తనం లేకుండా వృక్షం పెరగగలదా?\nపువ్వు లేకుండా పండు కాగలదా?\nకొబ్బరి చెట్టును నాటితే ఆకాశానికి ఎదిగింది,\nకాయ లేకుండా నీరు లేకుండా\nగాలికి చెట్టు విరిగినట్లయింది చూడు.\nఅముగేశ్వరలింగాన్ని ఎరుగని\nఅనాచారులను విరక్తులని అనగలనా? అనరాదు.","kn":"ಬೀಜವಿಲ್ಲದೆ ವೃಕ್ಷ ಬೆಳೆಯಬಲ್ಲುದೆ?\n ಹೂವಿಲ್ಲದೆ ಹಣ್ಣಾಗಬಲ್ಲುದೆ?\n ತೆಂಗಿನ ಮರವ ಬಿತ್ತಿದಡೆ ಅಂಬರಕ್ಕೆ ಹೋಯಿತ್ತು,\n ಕಾಯಿಲ್ಲದೆ ನೀ[ರಿ]ಲ್ಲದೆ\n ಗಾಳಿಗೆ ಮರ ಮುರಿದಂತೆ ಆಯಿತ್ತು ಕಾಣಾ.\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದ\n ಅನಾಚಾರಿಗಳ ವಿರಕ್ತರೆಂಬೆನೆ? ಎನಲಾಗದು."},"m":{"en":"This Vachana explains that genuine spiritual maturity cannot arise without a proper foundation of ethical discipline and inner realization.\n\nJust as a tree cannot grow without a seed or bear fruit without first blossoming, a person cannot attain true detachment without going through the essential stages of righteous conduct and spiritual awakening.\n\nThrough the metaphor of a tall coconut tree that bears neither fruit nor water and easily snaps in the wind, the Vachana illustrates the hollowness of outward spiritual pretension that lacks inner substance.\n\nThose who abandon right conduct and remain ignorant of the Supreme Reality, addressed here as Amugeshwaralinga, cannot truly be considered renunciates, for their detachment is empty and fragile.","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार बीज के बिना वृक्ष नहीं उग सकता और फूल के बिना फल नहीं लग सकता, उसी प्रकार आध्यात्मिक मूलाधार और सदाचार के बिना सच्चा वैराग्य संभव नहीं है।\n\nनारियल का पेड़ भले ही आकाश को छूने जितना ऊँचा बढ़ जाए, किंतु यदि उसमें न नारियल का फल हो और न ही भीतर का मीठा जल, तो वह हवा के झोंके से टूटकर गिरने वाले एक निष्फल वृक्ष के समान ही रह जाता है।\n\nइसी प्रकार, बाहरी रूप से वैराग्य का दिखावा करने वाले व्यक्ति का आध्यात्मिक कद कितना भी बड़ा क्यों न दिखे, यदि उसके भीतर सदाचार और परमतत्त्व की अनुभूति रूपी सार नहीं है, तो उसका जीवन खोखला और निरर्थक है।\n\nइस वचन का मूल आशय यह है कि निराकार परम सत्य अमुगेश्वरलिंग को जाने बिना और आचरण की शुद्धता को अपनाए बिना, किसी भी सदाचारहीन व्यक्ति को सच्चा विरक्त नहीं कहा जा सकता।","mr":"हे वचन स्पष्ट करते की, कोणतीही आध्यात्मिक प्रगती मूळ आधाराशिवाय आणि योग्य आचरणाच्या क्रमाशिवाय साध्य होऊ शकत नाही. ज्याप्रमाणे बियाण्याशिवाय वृक्ष वाढू शकत नाही आणि फुलाशिवाय फळ धरू शकत नाही, त्याचप्रमाणे आंतरिक शुद्धता व मूळ तत्त्वाच्या जाणिवेशिवाय खरी साधना घडू शकत नाही.\n\nनारळाचे झाड कितीही आभाळापर्यंत उंच वाढले, तरी त्याला फळ आणि त्यामध्ये पाणी नसल्यास ते झाड वाऱ्याने मोडून पडल्यासारखेच व्यर्थ ठरते. या प्रतीकाद्वारे येथे हे अधोरेखित केले आहे की, आध्यात्मिक अनुभवाचा गाभा आणि सदाचार नसेल तर केवळ बाह्य मोठेपणा निरर्थक असतो.\n\n'अमुगेश्वरलिंग' या निराकार परमतत्त्वाची जाणीव नसलेल्या आणि आचारभ्रष्ट असलेल्या लोकांना कधीही खरे विरक्त म्हणता येणार नाही, असा स्पष्ट विचार या वचनातून मांडला आहे.","fr":"Ce vachana met en lumière le fait qu'une véritable évolution spirituelle ne peut se produire sans des bases solides ni un cheminement authentique.\n\nÀ travers les images naturelles d'un arbre qui ne saurait croître sans semence et d'un fruit qui ne peut naître sans fleur, le texte illustre l'impossibilité d'atteindre la réalisation intérieure sans une pratique juste.\n\nDe même qu'un cocotier s'élevant jusqu'au ciel mais dépourvu de noix et d'eau finit par se briser sous la force du vent, une élévation spirituelle purement extérieure et vide de substance est vouée à s'effondrer.\n\nAinsi, ceux qui sont dénués d'une conduite intègre et qui ignorent la Réalité suprême sans forme, invoquée sous le nom d'Amugeshwaralinga, ne peuvent nullement être considérés comme d'authentiques renonçants.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన ఆధ్యాత్మిక సత్యం ఏమిటంటే, ఆంతరికమైన అరివు (ఎరుక) మరియు సదాచారం లేకుండా కేవలం బాహ్యంగా కనిపించే వైరాగ్యానికి ఎలాంటి సార్థకత ఉండదు.\n\nవిత్తనం లేకుండా చెట్టు పెరగడం, పువ్వు పూయకుండానే కాయ పండటం ఎలాగైతే ప్రకృతి విరుద్ధమో, అలాగే ఆధ్యాత్మిక మూలం లేని సాధన కూడా ఫలించదు.\n\nఆకాశమంత ఎత్తుకు ఎదిగిన కొబ్బరి చెట్టులో కాయలు, అందులో నీరు లేకపోతే అది గాలికి విరిగిపడిన మోడులా నిష్ప్రయోజనమవుతుంది.\n\nఅదేవిధంగా, అముగేశ్వరలింగ తత్త్వాన్ని అనగా నిరాకార పరమచైతన్యాన్ని అనుభవపూర్వకంగా తెలుసుకోలేని సదాచారం లేనివారిని నిజమైన విరక్తులని పిలవడం తగదు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಬೀಜವಿಲ್ಲದೆ ಮರ ಬೆಳೆಯಲು ಹೇಗೆ ಸಾಧ್ಯವಿಲ್ಲವೋ ಮತ್ತು ಹೂವು ಬಿಡದೆ ಹಣ್ಣು ಆಗಲು ಹೇಗೆ ಸಾಧ್ಯವಿಲ್ಲವೋ, ಹಾಗೆಯೇ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಗೆ ಸರಿಯಾದ ಅರಿವು ಮತ್ತು ಸದಾಚಾರದ ಮೂಲ ತಳಹದಿ ಇರಲೇಬೇಕು.\n\nತೆಂಗಿನ ಮರವು ಎಷ್ಟೇ ಎತ್ತರಕ್ಕೆ ಆಕಾಶದವರೆಗೆ ಬೆಳೆದರೂ, ಅದರಲ್ಲಿ ಕಾಯಿ ಮತ್ತು ಸಿಹಿನೀರು ಇಲ್ಲದಿದ್ದರೆ ಅದು ಗಾಳಿಗೆ ಮುರಿದು ಬೀಳುವ ನಿಷ್ಪ್ರಯೋಜಕ ಮರದಂತೆ ಆಗುತ್ತದೆ.\n\nಹಾಗೆಯೇ, ತತ್ತ್ವದ ಅರಿವು ಮತ್ತು ಒಳ್ಳೆಯ ನಡೆ-ನುಡಿಗಳಿಲ್ಲದೆ ಕೇವಲ ಹೊರಗಿನ ತೋರಿಕೆಗಾಗಿ ದೊಡ್ಡದಾಗಿ ಕಾಣಿಸಿಕೊಳ್ಳುವವರ ಬದುಕು ಒಳಗಡೆ ಟೊಳ್ಳಾಗಿರುತ್ತದೆ.\n\nಅಮುಗೇಶ್ವರಲಿಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಅರಿವಿಲ್ಲದೆ, ಸದಾಚಾರವನ್ನು ಬಿಟ್ಟು ಅನಾಚಾರಿಗಳಾಗಿ ಬದುಕುವವರನ್ನು ನಿಜವಾದ ವಿರಕ್ತರು ಅಥವಾ ಜ್ಞಾನಿಗಳು ಎಂದು ಕರೆಯಲು ಖಂಡಿತ ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಸ್ಪಷ್ಟ ನಿಲುವಾಗಿದೆ."}},{"no":1281,"o":"ಬೆಟ್ಟದ ನೆಲ್ಲಿಯಕಾಯ ಪಟ್ಟಣಕ್ಕೆ ಹೊತ್ತುಕೊಂಡು ಹೋಗಿ\n ಹೊಟ್ಟೆಯ ಹೊರೆವವನಂತೆ,\n ಉತ್ತಮ ತೇಜಿಯ ಹೆಸರ ಹೇಳಿ\n ಕಡಲೆಯ ತಿಂಬ ಗಾವಲಿಗನಂತೆ,\n ಆದ್ಯರ ವಚನಂಗಳ ಅಲ್ಲಲ್ಲಿಗೆ ಉಸುರಿ,\n ಅನ್ನ ಕೂಳಿಂಗೆ ಹರಿದಾಡುವ ಅಜ್ಞಾನಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ಅಯ್ಯಾ ವಿರಕ್ತರೆಂಬೆನೆ?\n ವೇಷವ ಹೊತ್ತು ತಿರುಗುವ [ಡಂ]ಬನಂತೆ\n ಬಲ್ಲೆಬಲ್ಲೆನೆಂಬ ಅಹಂಕಾರವ ನುಡಿವ ಭವಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ವಿರಕ್ತರೆಂಬೆನೆ?\n ವಿಷಯವ ಮುಂದುಗೊಂಡು ತಿರುಗುವ ಅನುಭಾವಿಗಳನೆಂತು\n ವಿರಕ್ತರೆಂಬೆನಯ್ಯಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ?","t":{"en":"Carrying mountain gooseberries to the town,\nlike one who labours only to fill his belly,\ninvoking the name of a noble steed,\nlike the groom who eats the horse-gram himself,\nuttering the Vachanas of the ancients here and there,\nthose ignorant ones who run about for rice and gruel—\nshall I call them mystics of *Anubhāva*? O Lord, shall I call them renunciates?\nLike a hypocrite who wanders about wearing a guise,\nthose worldly ones who speak with arrogance, saying, \"I know, I know\"—\nshall I call them mystics of *Anubhāva*? Shall I call them renunciates?\nThose mystics of *Anubhāva* who wander about putting sensory pleasures first—how\ncan I call them renunciates, O Lord, O Amugeshwaralinga?","hi":"पहाड़ के आँवले को नगर में ढोकर ले जाकर,\nपेट पालनेवाले के समान,\nउत्तम घोड़े का नाम लेकर,\nचना खानेवाले साईस के समान,\nआद्यों के वचनों को जहाँ-तहाँ उचारकर,\nअन्न-भोजन के लिए भटकनेवाले अज्ञानियों को,\nक्या अनुभावी कहूँ? हे स्वामी, क्या विरक्त कहूँ?\nवेष धारणकर घूमनेवाले दंभी के समान,\n‘जानता हूँ, जानता हूँ’ कहने का अहंकार बोलनेवाले भवियों को,\nक्या अनुभावी कहूँ? क्या विरक्त कहूँ?\nविषय को आगे रखकर घूमनेवाले अनुभावियों को कैसे\nविरक्त कहूँ हे स्वामी, हे अमुगेश्वरलिंग?","mr":"डोंगरावरील आवळे शहरात वाहून नेऊन\nपोट भरणाऱ्याप्रमाणे,\nउत्तम घोड्याचे नाव सांगून\nहरभरे खाणाऱ्या मोतद्दाराप्रमाणे,\nआद्यांची वचने ठिकठिकाणी उच्चारून,\nअन्नाच्या घासासाठी भटकणाऱ्या अज्ञानी लोकांना\nअनुभावी म्हणू का? हे स्वामी, विरक्त म्हणू का?\nवेष धारण करून फिरणाऱ्या दांभिकाप्रमाणे\n‘मी जाणतो, मी जाणतो’ असे अहंकाराचे बोल बोलणाऱ्या भवी लोकांना\nअनुभावी म्हणू का? विरक्त म्हणू का?\nविषयसुखांना पुढे ठेवून फिरणाऱ्या अनुभावींना कसे\nविरक्त म्हणू हे प्रभो, हे अमुगेश्वरलिंगा?","fr":"Comme celui qui porte les groseilles de la montagne jusqu'à la ville\npour nourrir son ventre,\ncomme le palefrenier qui invoque le nom d'un noble coursier\npour manger les pois chiches,\nces ignorants qui récitent çà et là les Vachanas des Anciens\net courent de tous côtés pour leur riz et leur pitance,\nles appellerai-je des êtres d'*Anubhava* ? Ô Seigneur, les appellerai-je des renonçants ?\nComme l'imposteur qui erre en portant un déguisement,\nces *Bhavis* mondains qui parlent avec l'arrogance de dire : « Je sais, je sais ! »,\nles appellerai-je des êtres d'*Anubhava* ? Les appellerai-je des renonçants ?\nCes hommes d'*Anubhava* qui errent en mettant au premier plan les plaisirs des sens, comment\nles appellerai-je des renonçants, Ô Seigneur, Ô Amugeshwaralinga ?","te":"కొండ ఉసిరికాయను పట్టణానికి మోసుకొని వెళ్లి\nకడుపు నింపుకొనేవాని వలె,\nఉత్తమమైన గుర్రం పేరు చెప్పి\nశనగలు తినే గుర్రపు కాపరి వలె,\nఆద్యుల వచనాలను అక్కడక్కడా వల్లించి,\nఅన్నం కూటికై పరుగులాడే అజ్ఞానులను\nఅనుభావులని అనగలనా? ఓ స్వామీ, విరక్తులని అనగలనా?\nవేషం ధరించి తిరిగే డాంబికుని వలె\nతెలుసు తెలుసనే అహంకారపు మాటలు పలికే భవులను\nఅనుభావులని అనగలనా? విరక్తులని అనగలనా?\nవిషయవాంఛలను ముందుకుంచుకొని తిరిగే అనుభావులనెలా\nవిరక్తులని అనగలనయ్యా, ఓ అముగేశ్వరలింగమా?","kn":"ಬೆಟ್ಟದ ನೆಲ್ಲಿಯಕಾಯ ಪಟ್ಟಣಕ್ಕೆ ಹೊತ್ತುಕೊಂಡು ಹೋಗಿ\n ಹೊಟ್ಟೆಯ ಹೊರೆವವನಂತೆ,\n ಉತ್ತಮ ತೇಜಿಯ ಹೆಸರ ಹೇಳಿ\n ಕಡಲೆಯ ತಿಂಬ ಗಾವಲಿಗನಂತೆ,\n ಆದ್ಯರ ವಚನಂಗಳ ಅಲ್ಲಲ್ಲಿಗೆ ಉಸುರಿ,\n ಅನ್ನ ಕೂಳಿಂಗೆ ಹರಿದಾಡುವ ಅಜ್ಞಾನಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ಅಯ್ಯಾ ವಿರಕ್ತರೆಂಬೆನೆ?\n ವೇಷವ ಹೊತ್ತು ತಿರುಗುವ [ಡಂ]ಬನಂತೆ\n ಬಲ್ಲೆಬಲ್ಲೆನೆಂಬ ಅಹಂಕಾರವ ನುಡಿವ ಭವಿಗಳ\n ಅನುಭಾವಿಗಳೆಂಬೆನೆ? ವಿರಕ್ತರೆಂಬೆನೆ?\n ವಿಷಯವ ಮುಂದುಗೊಂಡು ತಿರುಗುವ ಅನುಭಾವಿಗಳನೆಂತು\n ವಿರಕ್ತರೆಂಬೆನಯ್ಯಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ?"},"m":{"en":"This Vachana sharply critiques spiritual hypocrisy, condemning those who reduce the sacred wisdom of the ancient Sharanas (Adyas) into a mere commodity for their own livelihood.\n\nThrough vivid metaphors—comparing such people to a vendor carrying wild gooseberries from the hills to sell in the town for survival, or a stable hand eating horse-gram in the name of a fine steed—it exposes the ignorance of reciting Vachanas here and there merely to secure food and sustenance.\n\nWearing a spiritual guise while boasting of one's knowledge out of ego is the mark of a worldly, uninitiated person (Bhavi), not of a true seeker.\n\nAddressing the Formless Supreme Reality as Amugeshwaralinga, the Vachana concludes that those who wander about driven by sensory desires and material motives can never be considered genuine mystics (Anubhavis) or true renunciates (Viraktas).","hi":"इस वचन का केंद्रीय भाव यह है कि केवल अपनी आजीविका चलाने और उदर-पोषण के लिए आध्यात्मिक ज्ञान का प्रदर्शन करना वास्तविक अनुभाव या वैराग्य नहीं है।\n\nजिस प्रकार कोई व्यक्ति पहाड़ से आंवले ढोकर शहर में बेचकर अपना पेट पालता है, या कोई साईस उत्तम घोड़े के नाम पर मिलने वाले चने को स्वयं खा जाता है, उसी प्रकार प्राचीन शरणों के वचनों को जगह-जगह केवल अन्न और भोजन के लालच में दोहराने वाले लोग अज्ञानी हैं।\n\nकेवल बाहरी भेष धारण कर पाखंडियों की तरह घूमने वाले और 'मैं सब जानता हूँ' के अहंकार में डूबे हुए सांसारिक प्रवृत्ति के लोगों को कभी भी सच्चा अनुभावी या विरक्त नहीं कहा जा सकता।\n\nनिराकार परमतत्त्व अमुगेश्वरलिंग को संबोधित यह वचन स्पष्ट करता है कि जो लोग इंद्रिय-सुखों और सांसारिक विषयों को आगे रखकर भटकते हैं, वे सच्चे वैरागी नहीं हो सकते।","mr":"हे वचन अध्यात्माच्या नावाखाली केवळ स्वतःची पोटापाण्याची सोय करणाऱ्या आणि ज्ञानाचा अहंकार मिरवणाऱ्या दांभिक प्रवृत्तीवर कठोर प्रहार करते.\n\nडोंगरावरील आवळे शहरात विकून पोट भरणाऱ्या विक्रेत्याप्रमाणे किंवा उत्तम घोड्याच्या नावावर स्वतः हरभरे खाणाऱ्या नोकराप्रमाणे, जे अज्ञानी लोक केवळ अन्नासाठी प्राचीन शरणांची वचने इकडे-तिकडे तोंडपाठ बोलून दाखवतात, त्यांना खरे अनुभावी किंवा विरक्त म्हणता येणार नाही.\n\nत्याचप्रमाणे, केवळ बाह्य वेष धारण करून 'मला सर्व काही समजते' असा अहंकार बाळगणाऱ्या आणि प्रत्यक्षात विषयवासनांच्या मागे धावणाऱ्या लोकांना अमुगेश्वरलिंग या परमतत्त्वाच्या साक्षीने कधीही खरे अनुभावी किंवा विरक्त मानले जाऊ शकत नाही, असा या वचनाचा मुख्य आशय आहे.\n\nकेवळ वचनांचे पोपटपंचीने पठण करणे किंवा संन्याशाचा वेष घेणे म्हणजे अध्यात्म नव्हे, तर अहंकार आणि विषयवासनांचा त्याग करून प्रत्यक्ष आचरणातून सत्याचा अनुभव घेणेच महत्त्वाचे आहे, हे सत्य यातून स्पष्ट होते.","fr":"Ce vachana dénonce avec fermeté l'hypocrisie de ceux qui utilisent les paroles sacrées des premiers maîtres spirituels comme un simple moyen de subsistance.\n\nÀ travers les images parlantes du porteur de groseilles sauvages qui va les vendre en ville pour se nourrir et du palefrenier qui mange les pois chiches destinés à un noble coursier, le texte illustre le comportement de ces ignorants qui récitent des vachanas çà et là uniquement pour remplir leur ventre.\n\nIl critique également les imposteurs mondains (bhavi) qui, sous un déguisement trompeur, proclament avec arrogance tout savoir alors qu'ils restent entièrement asservis aux plaisirs des sens.\n\nEn s'adressant à la Réalité suprême sous le nom d'Amugeshwaralinga, la portée spirituelle de ce vachana rappelle que la véritable expérience mystique (anubhava) et le détachement authentique (virakti) sont incompatibles avec l'orgueil, la cupidité et la quête de confort matériel.","te":"ఈ వచనం ఆధ్యాత్మిక వాక్కులను కేవలం పొట్టకూటి కోసం, ఆడంబరం కోసం వాడుకునే కপట సాధకుల తీరును తీవ్రంగా విమర్శిస్తున్నది.\n\nకొండवरील ఉసిరికాయలను పట్టణానికి మోసుకెళ్లి అమ్మి కడుపు నింపుకునే వాడిలాగా, మేలుజాతి గుర్రం పేరు చెప్పి శనగలు తినే గుర్రపు కాపరిలాగా, కొందరు అజ్ఞానులు ఆద్యులైన శరణుల వచనాలను అక్కడా ఇక్కడా వల్లెవేస్తూ కేవలం అన్నం కోసం, ఉదరపోషణ కోసం తిరుగుతుంటారు.\n\nపైకి వేషం ధరించి తిరిగే డాంబికుడిలాగా, తమకు అంతా తెలుసనే అహంకారంతో మాట్లాడే ప్రాపంచిక మనుషులను (భవులను) ఆత్మానుభవం కలిగిన అనుభావులని లేదా విరక్తులని ఎలా అనగలమని ఈ వచనం ప్రశ్నిస్తున్నది.\n\nఅముగేశ్వరలింగ అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, అంతరంగంలో అనుభూతి లేకుండా ఇంద్రియ భోగాలనే ముందుంచుకుని తిరిగే ఇటువంటి వారిని నిజమైన విరక్తులుగా ఎన్నటికీ గుర్తించలేమని ఈ వచనం స్పష్టం చేస్తున్నది.","kn":"ಈ ವಚನದಲ್ಲಿ, ಕಾಡಿನ ಬೆಟ್ಟದ ನೆಲ್ಲಿಕಾಯಿಯನ್ನು ಪಟ್ಟಣದಲ್ಲಿ ಮಾರಿ ಹೊಟ್ಟೆ ತುಂಬಿಸಿಕೊಳ್ಳುವವನಂತೆ ಅಥವಾ ಒಳ್ಳೆಯ ಕುದುರೆಯ ಹೆಸರನ್ನು ಹೇಳಿಕೊಂಡು ಕಡಲೆ ತಿನ್ನುವ ಕಾವಲುಗಾರನಂತೆ, ಹಿಂದಿನ ಶರಣರ ವಚನಗಳನ್ನು ಕೇವಲ ತುತ್ತು ಅನ್ನಕ್ಕಾಗಿ ಅಲ್ಲಲ್ಲಿ ಹೇಳಿಕೊಂಡು ತಿರುಗುವವರ ಕಪಟತನವನ್ನು ತೀವ್ರವಾಗಿ ಟೀಕಿಸಲಾಗಿದೆ.\n\nತಮ್ಮ ಒಳಗಿನ ಬದುಕಿನಲ್ಲಿ ಆಧ್ಯಾತ್ಮಿಕ ಅರಿವನ್ನು ಅಳವಡಿಸಿಕೊಳ್ಳದೆ, ಕೇವಲ ಹೊಟ್ಟೆಪಾಡಿಗಾಗಿ ವಚನಗಳನ್ನು ಬಾಯಿಪಾಠ ಮಾಡಿ ಹೇಳುವ ಇಂತಹ ಅಜ್ಞಾನಿಗಳನ್ನು ನಿಜವಾದ ಅನುಭಾವಿಗಳೆಂದೋ ಅಥವಾ ವಿರಕ್ತರೆಂದೋ ಕರೆಯಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಸ್ಪಷ್ಟ ನಿಲುವಾಗಿದೆ.\n\nಬರೀ ಹೊರಗಿನ ವೇಷವನ್ನು ಹಾಕಿಕೊಂಡು ತಿರುಗುವ ಡಾಂಬಿಕರಂತೆ, ತಮಗೆಲ್ಲವೂ ತಿಳಿದಿದೆ ಎಂಬ ಅಹಂಕಾರದ ಮಾತುಗಳನ್ನಾಡುವ ಇಂತಹ ಪ್ರಾಪಂಚಿಕ ಮನಸ್ಥಿತಿಯವರನ್ನು (ಭವಿಗಳನ್ನು) ಎಂದಿಗೂ ಶರಣರ ಸಾಲಿಗೆ ಸೇರಿಸಲು ಬರುವುದಿಲ್ಲ.\n\nಅಮುಗೇಶ್ವರಲಿಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಸಾಕ್ಷಿಯಾಗಿ, ಆಧ್ಯಾತ್ಮಿಕ ಮಾತನ್ನಾಡುತ್ತಲೇ ಇಂದ್ರಿಯ ಸುಖ-ಭೋಗಗಳ ಹಿಂದೆ ಬಿದ್ದು ತಿರುಗುವ ಇಂತಹವರನ್ನು ನಿಜವಾದ ಅನುಭಾವಿಗಳು ಅಥವಾ ವಿರಕ್ತರು ಎಂದು ಒಪ್ಪಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":1282,"o":"ಮಂಡೆ ಬೋಳಾಗಿ ತುಂಡುಗಂಬಳಿ ಹೊದ್ದ ಬಳಿಕ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಖಂಡಿತನೆಅ ಕಂಡಕಂಡವರ ಮನ ಮೆಚ್ಚುವಂತೆ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಮಂಡೆ ಬೋಳಾದಡೆ ಮಹಾನುಭಾವಿಗಳು ಮೆಚ್ಚುವಂತೆ ಇರಬೇಕು\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ.","t":{"en":"Once the head is shaven and wrapped in a scrap of coarse blanket,\nwhat need is there for outward finery?\nFor one who has severed worldly ties, why seek outward finery\njust to please the minds of every passerby?\nIf the head is shaven, one must live so as to please the masters of mystic realization—\nsee, O Amugeshwara.","hi":"सिर मुँडवाकर फटा कंबल ओढ़ने के बाद,\nरूप-सिंगार किसलिए?\nनिश्चय ही हर किसी के मन को रिझाने के लिए,\nरूप-सिंगार किसलिए?\nसिर मुँडवा लेने पर महानुभावियों को भाने जैसा रहना चाहिए,\nदेखो, हे अमुगेश्वर।","mr":"डोके मुंडून घोंगडीचा तुकडा पांघरल्यानंतर\nसाजशृंगार कशासाठी?\nखरोखरच दिसेल त्याचे मन रिझवण्यासाठी\nसाजशृंगार कशासाठी?\nडोके मुंडले असेल, तर महानुभावींना रुचेल असे असले पाहिजे\nपाहा, हे अमुगेश्वरा।","fr":"Après s'être rasé la tête et couvert d'un lambeau de couverture,\nà quoi bon les atours et l'élégance ?\nDevenu renonçant résolu, pour plaire à l'esprit du premier venu,\nà quoi bon les atours et l'élégance ?\nSi l'on s'est rasé la tête, il faut vivre de manière à être approuvé par les êtres de haute réalisation mystique,\nvois-tu, Ô Amugeshwara.","te":"తల బోడియై ముక్కల కంబళి కప్పుకున్న తరువాత\nఅందచందాలెందుకు?\nనిక్కముగా కనిపించినవారందరి మనసు మెచ్చుకొనేటట్లు\nఅందచందాలెందుకు?\nతల బోడియైనప్పుడు మహానుభావులు మెచ్చుకొనేటట్లు ఉండాలి\nచూడుమా, ఓ అముగేశ్వరా.","kn":"ಮಂಡೆ ಬೋಳಾಗಿ ತುಂಡುಗಂಬಳಿ ಹೊದ್ದ ಬಳಿಕ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಖಂಡಿತನೆಅ ಕಂಡಕಂಡವರ ಮನ ಮೆಚ್ಚುವಂತೆ\n ಅಂದಚಂದಗಳೇಕೆ?\n ಮಂಡೆ ಬೋಳಾದಡೆ ಮಹಾನುಭಾವಿಗಳು ಮೆಚ್ಚುವಂತೆ ಇರಬೇಕು\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ."},"m":{"en":"This Vachana emphasizes the need for inner integrity when embracing a life of spiritual simplicity and renunciation.\n\nHaving shaved the head and draped a coarse piece of blanket as a sign of giving up worldly vanity, it is contradictory to still crave outward elegance or seek the approval of ordinary passersby.\n\nTrue asceticism is not a theatrical display meant to please the public gaze or attract superficial admiration.\n\nAddressing the Supreme Reality as Amugeshwara, the Vachana concludes that if one adopts the outward marks of renunciation, one's conduct and inner state must be authentic enough to earn the respect of the truly enlightened.","hi":"इस वचन का केंद्रीय संदेश यह है कि वैराग्य का मार्ग चुन लेने के पश्चात बाहरी आडंबर और सौंदर्य प्रदर्शन निरर्थक हो जाते हैं।\n\nसिर मुंडवाकर और कंबल का टुकड़ा ओढ़कर संन्यास का वेश धारण करने के बाद, राह चलते साधारण लोगों को प्रसन्न करने के लिए बाहरी रूप-रंग और बनावट की कोई आवश्यकता नहीं होती।\n\nसच्चा त्यागी वही है जो दिखावे के लिए नहीं, बल्कि आत्मज्ञानी महानुभावों और शरणों की दृष्टि में खरा उतरने के लिए अपना जीवन जीता है।\n\nअमुगेश्वर के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन स्पष्ट करता है कि बाहरी वेशभूषा की सार्थकता केवल तभी है जब साधक का आचरण प्रबुद्ध ज्ञानियों के मानदंडों के अनुरूप हो।","mr":"या वचनाचा मुख्य आशय असा आहे की, एकदा डोक्याचे मुंडण करून आणि अंगावर घोंगडीचा तुकडा पांघरून वैराग्याचा मार्ग स्वीकारल्यानंतर बाह्य नट्टापट्ट्याची आणि दिमाखाची काहीच गरज उरत नाही.\n\nनिःस्पृह आणि ठाम आचरण ठेवण्याऐवजी, येणाऱ्या-जाणाऱ्या सामान्य लोकांचे मन रिझवण्यासाठी बाह्य सौंदर्याचा आणि दिखाव्याचा अट्टाहास धरणे निरर्थक आहे.\n\nविरक्तीचा स्वीकार केल्यानंतर साधकाचे आचरण लोकानुनयासाठी नसून, खऱ्या अनुभवी आणि जाणत्या महात्म्यांना मान्य होईल अशाच निष्ठावान वृत्तीचे असावे, ही जाणीव अमुगेश्वर या परमतत्त्वाला उद्देशून येथे व्यक्त झाली आहे.","fr":"Ce vachana met en lumière l'exigence d'intégrité intérieure qui doit accompagner les signes extérieurs du renoncement.\n\nAprès avoir rasé sa tête et revêtu une simple pièce de couverture en laine, symboles de détachement, il devient contradictoire de continuer à rechercher la parure ou l'élégance.\n\nCelui qui a choisi une voie résolue ne doit pas chercher à séduire ni à plaire au premier venu par son apparence extérieure.\n\nÀ travers la signature spirituelle Amugeshwara, adressée à la Réalité suprême sans forme, ce vachana affirme que le véritable dépouillement doit se traduire par une conduite authentique, digne de l'estime des êtres spirituellement accomplis.","te":"ఈ వచనం వివరిస్తున్నది ఏమిటంటే, ప్రాపంచిక వ్యామోహాలను విడిచిపెట్టిన దానికి గుర్తుగా తల గొరిగించుకొని, చినిగిన కంబళిని కప్పుకున్న తర్వాత ఇక బాహ్యమైన అందచందాలు, అలంకారాలతో పని ఉండదు.\n\nఅలా నిశ్చయమైన వైరాగ్య మార్గాన్ని ఎంచుకున్న వారు, దారిన పోయే ప్రతి ఒక్కరి మనస్సునూ ఆకట్టుకోవడానికి పైపై ఆడంబరాలను ప్రదర్శించడం పూర్తిగా అర్థరహితం.\n\nనిరాకార పరమతత్త్వమైన అముగేశ్వర సాక్షిగా ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, బాహ్యంగా సన్యాస వేషం ధరించిన సాధకుడి నడవడిక లౌకికులను ఆకర్షించేలా కాకుండా, ఆధ్యాత్మిక అనుభావం కలిగిన మహానుభావులు మెచ్చుకునేంత నిష్కల్మషంగా ఉండాలి.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಲೌಕಿಕ ಆಡಂಬರವನ್ನು ಬಿಟ್ಟು ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯ ಹಾದಿಯನ್ನು ಹಿಡಿದ ಮೇಲೆ ಮತ್ತೆ ದೇಹದ ಅಂದಚಂದಗಳ ಕಡೆಗೆ ಗಮನ ಕೊಡುವುದು ತರವಲ್ಲ.\n\nತಲೆ ಬೋಳಿಸಿಕೊಂಡು, ತುಂಡು ಕಂಬಳಿಯನ್ನು ಹೊದ್ದುಕೊಂಡು ವೈರಾಗ್ಯದ ವೇಷ ಧರಿಸಿದ ನಂತರವೂ, ದಾರಿಯಲ್ಲಿ ಸಿಗುವ ಕಂಡಕಂಡವರ ಮನಸ್ಸನ್ನು ಮೆಚ್ಚಿಸುವುದಕ್ಕಾಗಿ ಬಾಹ್ಯ ಅಲಂಕಾರ ಮಾಡಿಕೊಳ್ಳುವುದರಲ್ಲಿ ಯಾವುದೇ ಅರ್ಥವಿಲ್ಲ.\n\nಆಧ್ಯಾತ್ಮಿಕ ಬದುಕಿಗಾಗಿ ಹೊರಗಿನ ಶೃಂಗಾರವನ್ನು ತ್ಯಜಿಸಿದ ಮೇಲೆ, ಒಬ್ಬ ಸಾಧಕನ ನಡವಳಿಕೆ ಮತ್ತು ಅಂತರಂಗದ ಶುದ್ಧತೆಯು ಅರಿವಿನ ನೆಲೆಯಲ್ಲಿರುವ ಮಹಾನುಭಾವಿಗಳು ಮೆಚ್ಚುವಂತಿರಬೇಕು ಎಂಬ ಸತ್ಯವನ್ನು ಅಮುಗೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಸಾಕ್ಷಿಯಾಗಿ ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಒಟ್ಟಾರೆಯಾಗಿ, ವೇಷದಲ್ಲಿ ಮಾತ್ರವಲ್ಲದೆ ಆಚಾರ ಮತ್ತು ವಿಚಾರಗಳಲ್ಲಿಯೂ ನಿಜವಾದ ಸರಳತೆ ಹಾಗೂ ತಾತ್ವಿಕ ನಿಷ್ಠೆ ಇರಬೇಕೇ ಹೊರತು, ಜನರನ್ನು ಆಕರ್ಷಿಸುವ ತೋರಿಕೆಯ ಬದುಕು ಇರಬಾರದು ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1283,"o":"ಮರನನೇರಿ ಹಣ್ಣನರಸಹೋದಡೆ\n ಮರ ಮುರಿದು ಬಿದ್ದ ಮರುಳ ಮಾನವನಂತೆ,\n ಕೆಸರೊಳಗಣ ಹುಲ್ಲ ಮೇಯ ಹೋದ ಪಶುವಿನಂತೆ,\n ಕೊಂಬೆ ಕೊಂಬೆಗೆ ಹಾರುವ ಕೋಡಗನಂತೆ,\n ಉಂಡ ಮನೆಯ ದೂರುವ ಒಡೆಕಾರನಂತೆ,\n ಹಳ್ಳಹಳ್ಳ ತಿಬ್ಬಳಿ ತಿರುಗುವ ಬಳ್ಳುವಿನಂತೆ,\n ಮಾತಿನಲ್ಲಿ ಬ್ರಹ್ಮವ ನುಡಿವ ವೇಷಧಾರಿಗಳ ಲಿಂಗಾಂಗಿಗಳೆಂದಡೆ,\n ಮಾರಿಗೆ ತಂದ ಹಂದಿಯ ನಾಯಿ ನರಿ ತಿಂಬಂತೆ\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ.","t":{"en":"When climbing a tree in search of fruit,\nlike a foolish man who falls as the tree breaks,\nlike a beast that goes to graze on grass within the mire,\nlike a monkey leaping from branch to branch,\nlike a treacherous man who slanders the very house where he has eaten,\nlike a jackal stumbling and wandering from ditch to ditch,\nif one calls those costumed impostors who speak of Brahman in mere words *Lingangis*,\nit is like dogs and jackals eating a pig brought for the goddess Mari—\nsee, O Amugeshwara.","hi":"पेड़ पर चढ़कर फल ढूँढ़ने जाने पर,\nपेड़ टूटकर गिरे मूढ़ मानव के समान,\nकीचड़ के भीतर की घास चरने गए पशु के समान,\nडाल-डाल पर कूदनेवाले बंदर के समान,\nखाए हुए घर की निंदा करनेवाले कृतघ्न के समान,\nनाले-नाले और टीलों पर भटकनेवाली लोमड़ी के समान,\nबातों में ब्रह्म का बखान करनेवाले वेशधारियों को लिंगांगी कहा जाए तो,\nवह मारी के लिए लाए गए सूअर को कुत्ते और सियार के खाने के समान है,\nदेखो, हे अमुगेश्वर।","mr":"झाडावर चढून फळ शोधायला गेल्यावर\nझाड मोडून खाली पडलेल्या वेड्या माणसाप्रमाणे,\nचिखलातले गवत चरायला गेलेल्या पशूप्रमाणे,\nफांदीवरून फांदीवर उड्या मारणाऱ्या माकडाप्रमाणे,\nजेवलेल्या घराचीच निंदा करणाऱ्या कृतघ्न माणसाप्रमाणे,\nओढ्या-खळग्यांतून वणवण फिरणाऱ्या कोल्ह्याप्रमाणे,\nकेवळ शब्दांतून ब्रह्म बोलणाऱ्या वेशधाऱ्यांना लिंगांगी म्हटले,\nतर मारीसाठी आणलेल्या डुकराला कुत्री आणि कोल्हे खातात तसे होईल,\nपाहा, हे अमुगेश्वरा.","fr":"Comme l'homme insensé qui, monté sur un arbre pour chercher des fruits,\ntombe lorsque l'arbre se brise,\ncomme la bête allée brouter l'herbe dans la bourbe,\ncomme le singe sautant de branche en branche,\ncomme le semeur de discorde qui médit de la maison où il a mangé,\ncomme le renard qui erre de fossé en fossé et de butte en butte,\nsi l'on appelle *Lingangis* ces imposteurs déguisés qui ne parlent du *Brahman* qu'en paroles,\nc'est comme les chiens et les chacals dévorant le porc amené pour la déesse Mari,\nvois-tu, Ô Amugeshwara.","te":"చెట్టునెక్కి పండును వెదకబోతే\nచెట్టు విరిగి పడిన వెర్రి మానవుని వలె,\nబురదలోని గడ్డిని మేయబోయిన పశువు వలె,\nకొమ్మ కొమ్మకు దూకే కోతి వలె,\nతిన్న ఇంటినే దూషించే కృతఘ్నుని వలె,\nవాగువంకలన్నీ తಡబడుతూ తిరిగే నక్క వలె,\nమాటలలో బ్రహ్మాన్ని పలికే వేషధారులను లింగాంగులని అంటే,\nమారెమ్మకు తెచ్చిన పందిని కుక్కలు నక్కలు తిన్నట్లే\nసుమా, ఓ అముగేశ్వరా.","kn":"ಮರನನೇರಿ ಹಣ್ಣನರಸಹೋದಡೆ\n ಮರ ಮುರಿದು ಬಿದ್ದ ಮರುಳ ಮಾನವನಂತೆ,\n ಕೆಸರೊಳಗಣ ಹುಲ್ಲ ಮೇಯ ಹೋದ ಪಶುವಿನಂತೆ,\n ಕೊಂಬೆ ಕೊಂಬೆಗೆ ಹಾರುವ ಕೋಡಗನಂತೆ,\n ಉಂಡ ಮನೆಯ ದೂರುವ ಒಡೆಕಾರನಂತೆ,\n ಹಳ್ಳಹಳ್ಳ ತಿಬ್ಬಳಿ ತಿರುಗುವ ಬಳ್ಳುವಿನಂತೆ,\n ಮಾತಿನಲ್ಲಿ ಬ್ರಹ್ಮವ ನುಡಿವ ವೇಷಧಾರಿಗಳ ಲಿಂಗಾಂಗಿಗಳೆಂದಡೆ,\n ಮಾರಿಗೆ ತಂದ ಹಂದಿಯ ನಾಯಿ ನರಿ ತಿಂಬಂತೆ\n ಕಾಣಾ, ಅಮುಗೇಶ್ವರಾ."},"m":{"en":"This Vachana sharply critiques hypocrites who adopt the outward attire of spiritual seekers and speak loftily of the Supreme Reality, yet possess restless, greedy, and ungrateful minds.\n\nThrough a series of vivid comparisons—such as a fool falling from a breaking branch while reaching for fruit, a cow sinking into mud for grass, a monkey leaping aimlessly from branch to branch, an ungrateful person slandering the very house that fed him, and a scavenging jackal wandering through ditches—the Vachana exposes the inner instability and moral hollowness of such pretenders.\n\nMistaking these mere performers for true Lingangis—those who have genuinely realized union with the Formless Divine—is completely deluded.\n\nAddressing the Supreme Reality as Amugeshwara, the Vachana concludes that such empty hypocrisy is as degraded and spiritually meaningless as dogs and jackals devouring a pig meant for a sacrificial offering to the folk deity Mari.","hi":"इस वचन का मुख्य संदेश यह है कि केवल बाहरी वेशभूषा धारण करने और मुख से परम सत्य (ब्रह्म) की बड़ी-बड़ी बातें करने मात्र से कोई सच्चा लिंगांगी या साधक नहीं बन जाता।\n\nवचन में ऐसे पाखंडी वेशधारियों की अस्थिर और विवेकहीन स्थिति को स्पष्ट करने के लिए कई सटीक उपमाएँ दी गई हैं—जैसे फल की खोज में पेड़ पर चढ़कर डाल टूटने से गिरता हुआ मूर्ख व्यक्ति, कीचड़ में घास चरने गया पशु, डाल-डाल भटकता बंदर, जिस घर में खाया उसी की निंदा करने वाला कृतघ्न व्यक्ति और गड्ढों व टीलों में भटकती हुई लोमड़ी।\n\nअमुगेश्वर के प्रति संबोधित इस वचन का आध्यात्मिक आशय यह है कि आचरण और आंतरिक अनुभूति के बिना कोरा ज्ञान बघारने वाले वेशधारियों को लिंगांगी मानना उतना ही निरर्थक और हास्यास्पद है, जितना लोक-प्रथा में मारी के लिए लाए गए सूअर को कुत्तों और सियारों द्वारा खा जाना।","mr":"या वचनात प्रत्यक्ष अनुभूती आणि आचरणाशिवाय केवळ तोंडाने ब्रह्मज्ञानाच्या पोकळ गप्पा मारणाऱ्या वेशधारी ढोंगी लोकांवर तीव्र प्रहार केला आहे.\n\nफांदी तुटून पडणारा वेडा माणूस, चिखलात फसणारे पशू, फांद्यांवर उड्या मारणारे माकड, ज्या घरात खाल्ले त्याचेच वाईट चिंतणारा कृतघ्न माणूस आणि नाल्या-खड्ड्यांत भटकणारा कोल्हा या प्रपंचातील समर्पक उपमांमधून अशा फसव्या साधकांची चंचल व अधोगतीकडे जाणारी वृत्ती स्पष्ट होते.\n\nअशा केवळ बाह्य वेश धारण केलेल्या लबाड लोकांना जर अमुगेश्वर या परमतत्त्वाशी एकरूप झालेले सच्चे लिंगांगी मानले, तर ते मरीआईच्या बळीसाठी आणलेले डुक्कर कुत्र्या-कोल्ह्यांनी फाडून खाण्यासारखे अत्यंत निरर्थक आणि हास्यास्पद ठरते.\n\nआध्यात्मिक मार्गात बाह्य देखावा आणि शाब्दिक पांडित्यापेक्षा स्थिर मन, कृतज्ञता आणि प्रत्यक्ष आचरणालाच खरे महत्त्व आहे, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana dénonce avec vigueur l'hypocrisie de ceux qui adoptent l'apparence extérieure de la dévotion et parlent de la Vérité absolue sans que leur esprit ni leur conduite ne soient stabilisés.\n\nÀ travers une série d'images saisissantes — l'insensé qui tombe d'un arbre brisé en cherchant des fruits, le bétail s'enfonçant dans la boue pour brouter, le singe sautant de branche en branche, l'ingrat dénigrant la maison qui l'a nourri ou le chacal errant de ravin en ravin —, le texte illustre l'égarement, l'agitation mentale et l'absence d'intégrité de ces faux chercheurs.\n\nLa portée spirituelle de ce poème réside dans l'affirmation que le véritable Lingangi, celui qui vit en union intime avec le Linga et la Réalité suprême sans forme invoquée sous le nom d'Amugeshwara, ne saurait se réduire à un simple porteur de déguisement qui proclame le Principe absolu uniquement en paroles.\n\nQualifier de tels imposteurs d'êtres spirituellement accomplis est une profanation dérisoire, comparable au fait de laisser des chiens et des chacals dévorer le porc pourtant destiné en offrande à la déesse Mari.","te":"ఈ వచనం ఆంతరికమైన అರಿవు, నిష్ఠ లేకుండా కేవలం మాటలలో మాత్రమే పరమసత్యాన్ని వల్లించే వేషధారులైన కపట సాధకుల నైజాన్ని తీవ్రంగా విమర్శిస్తోంది.\n\nపండు కోసం చెట్టెక్కి కొమ్మ విరిగి కిందపడ్డ అవివేకిలా, బురదలోని గడ్డిని మేయబోయి అందులో కూరుకుపోయిన పశువులా, కొమ్మకొమ్మకూ గంతులేసే కోతిలా ఇలాంటి వారి ప్రవర్తన స్థిరత్వం లేక అజ్ఞానంతో కూడి ఉంటుంది.\n\nతిన్న ఇంటినే నిందించే కృతఘ్నుడిలా, గుంతలు దిబ్బలూ తిరిగే గుంటనక్కలా వీరు కేవలం బాహ్య వేషధారణతో తాము బ్రహ్మజ్ఞానులమని మాటలు చెబుతుంటారు.\n\nఅముగేశ్వరా అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, ఇటువంటి కపట వేషధారులను నిజమైన లింగాంగులని పిలవడం మారి దేవతకు బలి ఇవ్వడానికి తెచ్చిన పందిని కుక్కలు, నక్కలు పీక్కుతిన్నంత నీచంగా ఉంటుందని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿಜವಾದ ಅರಿವು ಮತ್ತು ಆಚರಣೆ ಇಲ್ಲದೆ ಕೇವಲ ಬಾಯ್ಮಾತಿನಲ್ಲಿ ಪರಮಸತ್ಯದ ಬಗ್ಗೆ ಮಾತನಾಡುವ ವೇಷಧಾರಿಗಳ ಡಾಂಭಿಕತನವನ್ನು ಇಲ್ಲಿ ಕಟುವಾಗಿ ವಿಮರ್ಶಿಸಲಾಗಿದೆ.\n\nಹಣ್ಣನ್ನು ಹುಡುಕಲು ಮರವೇರಿ ಮರ ಮುರಿದು ಬೀಳುವ ದಡ್ಡನಂತೆ, ಕೆಸರಿನಲ್ಲಿದ್ದ ಹುಲ್ಲನ್ನು ಮೇಯಲು ಹೋಗಿ ಸಿಕ್ಕಿಕೊಳ್ಳುವ ಪಶುವಿನಂತೆ, ಕೊಂಬೆಯಿಂದ ಕೊಂಬೆಗೆ ಹಾರುವ ಕೋತಿಯಂತೆ, ಅನ್ನ ತಿಂದ ಮನೆಯನ್ನೇ ದೂರುವ ಕೃತಘ್ನನಂತೆ ಮತ್ತು ಗುಂಡಿ-ದಿಬ್ಬಗಳಲ್ಲಿ ಅಲೆಯುವ ನರಿಯಂತೆ ಇಂತಹ ವೇಷಧಾರಿಗಳ ಸ್ಥಿತಿಯು ನೆಲೆಯಿಲ್ಲದ ಚಂಚಲತೆಯಿಂದ ಕೂಡಿರುತ್ತದೆ.\n\nನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಅರಿವಿನೊಡನೆ ಒಂದಾಗಿ ಬದುಕುವ ನಿಜವಾದ ಲಿಂಗಾಂಗಿಗಳ ಸ್ಥಿತಿಗೂ, ಕೇವಲ ತೋರಿಕೆಯ ವೇಷ ಹಾಕಿಕೊಂಡು ಬ್ರಹ್ಮತತ್ತ್ವದ ಮಾತುಗಳನ್ನಾಡುವವರ ಸ್ಥಿತಿಗೂ ಅಜಗಜಾಂತರ ವ್ಯತ್ಯಾಸವಿದೆ ಎಂಬುದು ಈ ಹೋಲಿಕೆಗಳ ಆಳವಾದ ಅರ್ಥವಾಗಿದೆ.\n\nಇಂತಹ ಬರೀ ಮಾತಿನ ವೇಷಧಾರಿಗಳನ್ನು ನಿಜವಾದ ಲಿಂಗಾಂಗಿಗಳೆಂದು ಕರೆಯುವುದು, ಮಾರಮ್ಮನಿಗೆ ಬಲಿ ಕೊಡಲು ತಂದ ಹಂದಿಯನ್ನು ಬೀದಿಯ ನಾಯಿ-ನರಿಗಳು ಎಳೆದಾಡಿ ತಿಂದಷ್ಟೇ ಅರ್ಥಹೀನ ಮತ್ತು ತುಚ್ಛವಾದುದು ಎಂದು ಅಮುಗೇಶ್ವರ ಎಂಬ ಅಂಕಿತನಾಮದ ಮೂಲಕ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ."}},{"no":1284,"o":"ಮರುಜವಣಿಯ ಕಂಡವಂಗೆ ಮರಣದ ಹಂಗುಂಟೆ?\n ಪರುಷವುಳ್ಳವಂಗೆ ಪಾಷಾಣದ ಹಂಗುಂಟೆ?\n ಸರ್ವಾಂಗಲಿಂಗವಾದವಂಗೆ ಅನರ್ಪಿತವುಂಟೆ?\n ಜ್ಯೋತಿಯ ಬೆಳಗಿನಲ್ಲಿದ್ದವಂಗೆ ಕತ್ತಲೆಯ ಹಂಗುಂಟೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವಾದವಂಗೆ [ಅ]ಂಗದ ಹಂಗುಂಟೆ?","t":{"en":"For one who has found the life-restoring herb, is there any bondage to death?\nFor one who possesses the philosopher's stone, is there any dependence on common stone?\nFor one whose entire body has become *Linga*, is there anything left unoffered?\nFor one who abides in the radiance of the flame, is there any bondage to darkness?\nFor one who has become Amugeshwaralinga, is there any dependence on the mortal body?","hi":"संजीवनी पानेवाले को क्या मरण का भय होता है?\nपारस रखनेवाले को क्या पाषाण की अपेक्षा होती है?\nसर्वांगलिंग हो जानेवाले के लिए क्या कुछ अनर्पित होता है?\nज्योति के प्रकाश में रहनेवाले को क्या अंधकार का भय होता है?\nअमुगेश्वरलिंग हो जानेवाले को क्या अंग की अपेक्षा होती है?","mr":"संजीवनी गवसलेल्याला मरणाची गरज उरते का?\nपरसजवळ असलेल्याला पाषाणाची गरज उरते का?\nसर्वांग लिंग झालेल्याला काही अनर्पित उरते का?\nज्योतीच्या प्रकाशात असलेल्याला अंधाराची गरज उरते का?\nअमुगेश्वरलिंग झालेल्याला अंगाची गरज उरते का?","fr":"Pour celui qui a trouvé l'herbe de résurrection, y a-t-il l'emprise de la mort ?\nPour celui qui possède la pierre philosophale, y a-t-il l'emprise de la pierre ordinaire ?\nPour celui dont tous les membres sont devenus Linga, y a-t-il quoi que ce soit de non offert ?\nPour celui qui demeure dans la clarté de la flamme, y a-t-il l'emprise de l'obscurité ?\nPour celui qui est devenu Amugeshwaralinga, y a-t-il l'emprise du corps ?","te":"సంజీవనిని కనుగొన్నవానికి మరణపు అక్కరుంటుందా?\nపరుసవేది ఉన్నవానికి పాషాణపు అక్కరుంటుందా?\nసర్వాంగలింగమైనవానికి అనర్పితముంటుందా?\nజ్యోతి వెలుగులో ఉన్నవానికి చీకటి అక్కరుంటుందా?\nఅముగేశ్వరలింగమైనవానికి అంగపు అక్కరుంటుందా?","kn":"ಮರುಜವಣಿಯ ಕಂಡವಂಗೆ ಮರಣದ ಹಂಗುಂಟೆ?\n ಪರುಷವುಳ್ಳವಂಗೆ ಪಾಷಾಣದ ಹಂಗುಂಟೆ?\n ಸರ್ವಾಂಗಲಿಂಗವಾದವಂಗೆ ಅನರ್ಪಿತವುಂಟೆ?\n ಜ್ಯೋತಿಯ ಬೆಳಗಿನಲ್ಲಿದ್ದವಂಗೆ ಕತ್ತಲೆಯ ಹಂಗುಂಟೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವಾದವಂಗೆ [ಅ]ಂಗದ ಹಂಗುಂಟೆ?"},"m":{"en":"This Vachana explains that once a seeker attains the highest spiritual realization, all lower worldly limitations and dependencies naturally fall away.\n\nThrough a series of vivid metaphors, it illustrates that just as one who possesses the life-restoring herb is free from the fear of death, one who holds the philosopher's stone has no need for ordinary rock, and one who dwells in radiant light is untouched by darkness, the enlightened state leaves no room for deficiency.\n\nWhen a person's entire being is transformed into Divine Consciousness (Sarvangalinga), no aspect of life remains unoffered or profane, making every experience sacred.\n\nUltimately, the Vachana points towards the understanding that one who has merged entirely with the Formless Supreme Reality, addressed here as Amugeshwaralinga, transcends the limitations and compulsive attachments of the physical body (Anga).","hi":"इस वचन का केंद्रीय भाव यह है कि परम सत्य की अनुभूति कर लेने वाले साधक को किसी भी भौतिक या सांसारिक सीमा की पराधीनता नहीं रह जाती।\n\nजिस प्रकार संजीवनी प्राप्त कर लेने वाले को मृत्यु का भय नहीं रहता, पारसमणि रखने वाले को सामान्य पत्थर की आवश्यकता नहीं होती और प्रकाश के भीतर रहने वाले को अंधकार से कोई सरोकार नहीं होता, उसी प्रकार पूर्ण आध्यात्मिक जागृति के बाद साधक अज्ञान और अभाव से मुक्त हो जाता है।\n\nजिसका संपूर्ण अस्तित्व ही लिंगमय हो गया हो, उसके लिए कुछ भी अनर्पित या अपवित्र नहीं रह जाता क्योंकि उसका प्रत्येक कर्म और भाव स्वतः ही परम चैतन्य को समर्पित हो जाता है।\n\nवचन का आध्यात्मिक निष्कर्ष यह है कि जो साधक निराकार परमतत्त्व 'अमुगेश्वरलिंग' के साथ एकाकार हो जाता है, वह नश्वर देह की सीमाओं और दैहिक आश्रय से पूर्णतः ऊपर उठ जाता है।","mr":"हे वचन स्पष्ट करते की, सर्वोच्च आध्यात्मिक सत्य प्राप्त केलेल्या साधकाला कोणत्याही कनिष्ठ किंवा मर्यादित गोष्टींचे भय अथवा परावलंबित्व उरत नाही.\n\nज्याप्रमाणे संजीवनी लाभलेल्याला मृत्यूची, परिस असलेल्याला सामान्य दगडाची आणि प्रकाशात वावरणाऱ्याला अंधाराची भीती किंवा गरज उरत नाही, तसेच ज्याचे संपूर्ण अस्तित्वच लिंगमय झाले आहे त्याच्याकडून कोणतीही कृती परमतत्त्वाला अर्पण केल्याशिवाय घडत नाही.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, अमुगेश्वरलिंग या निराकार परमतत्त्वाशी पूर्णपणे एकरूप झालेल्या साक्षात्कारी जीवाला स्वतःच्या नश्वर देहाच्या जाणिवांची आणि मर्यादांची कोणतीही गरज उरत नाही.","fr":"Ce vachana met en lumière la liberté absolue qui découle de la réalisation spirituelle et de l'union avec la Réalité suprême sans forme.\n\nÀ travers des images parlantes, il explique que tout comme l'élixir d'immortalité affranchit de la peur de la mort, que la pierre philosophale rend les pierres ordinaires inutiles et que la lumière dissipe toute dépendance à l'obscurité, l'éveil spirituel dissout les limitations de l'existence ordinaire.\n\nLorsque l'être tout entier se transforme en Linga, chaque aspect de la vie devient une offrande consacrée, ne laissant plus aucune place au profane ou au non-offert.\n\nEnfin, celui qui s'est uni à la Conscience pure désignée par l'ankitanama Amugeshwaralinga transcende l'attachement et la soumission aux limites du corps physique (Anga).","te":"ఈ వచనం వివరిస్తున్న ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, సంపూర్ణమైన పరమసత్యాన్ని అనుభూతి చెందిన సాధకుడికి ఇక ఏ విధమైన భౌతిక బంధనాలు గానీ, పరిమితులు గానీ ఉండవు.\n\nఅమృతత్వాన్ని ప్రసాదించే సంజీవని దొరికినవాడికి మరణభయం ఎలా ఉండదో, స్పర్శమణి ఉన్నవాడికి సాధారణ రాళ్లతో ఎలా పని ఉండదో, జ్యోతిర్మయమైన వెలుగులో ఉన్నవాడికి చీకటితో ఎలా సంబంధం ఉండదో ఈ వచనం చక్కని ఉపమానాలతో స్పష్టం చేస్తోంది.\n\nఅలాగే తన సర్వాంగాలూ లింగమయంగా మారిన శరణుడికి సమర్పణ కానిదంటూ ఏదీ మిగలదు; అంటే అతని ఉనికి, కదలిక, అనుభవం అన్నీ పవిత్రమైన అర్చనగానే మారిపోతాయి.\n\nఅముగేశ్వరలింగ అనబడే నిరాకార పరమచైతన్యంతో ఏకమైన తర్వాత, సాధకుడికి ఇక భౌతిక దేహస్పృహ గానీ, శారీరక పరిమితుల అవసరం గానీ ఉండవని ఈ వచనం తెలియజేస్తోంది.","kn":"ಈ ವಚನವು ಸೂಚಿಸುವ ತಾತ್ಪರ್ಯವೇನೆಂದರೆ, ಸಾವನ್ನು ಗೆಲ್ಲುವ ಮರುಜೀವಣಿ ಮೂಲಿಕೆಯನ್ನು ಪಡೆದವನಿಗೆ ಸಾವಿನ ಭಯವಿರುವುದಿಲ್ಲ, ಕಬ್ಬಿಣವನ್ನು ಚಿನ್ನವಾಗಿಸುವ ಪರುಷಮಣಿ ಇರುವವನಿಗೆ ಸಾಮಾನ್ಯ ಕಲ್ಲಿನ ಹಂಗಿರುವುದಿಲ್ಲ ಮತ್ತು ಬೆಳಕಿನಲ್ಲಿದ್ದವನಿಗೆ ಕತ್ತಲೆಯ ಭಯವಿರುವುದಿಲ್ಲ.\n\nಅದೇ ರೀತಿ, ತನ್ನ ಇಡೀ ಅಸ್ತಿತ್ವವನ್ನೇ ಲಿಂಗಮಯವಾಗಿಸಿಕೊಂಡು ‘ಸರ್ವಾಂಗಲಿಂಗ’ವಾದ ಸಾಧಕನಿಗೆ, ತನ್ನ ಒಳಗೂ ಹೊರಗೂ ಅರಿವಿನ ಪ್ರಜ್ಞೆಯೇ ತುಂಬಿರುವುದರಿಂದ ಆತ ಮಾಡುವ ಯಾವುದೇ ಕ್ರಿಯೆಯೂ ಲಿಂಗಕ್ಕೆ ಅರ್ಪಿತವಾಗದೆ ಉಳಿಯುವುದಿಲ್ಲ.\n\nಹೀಗೆ ಅಮುಗೇಶ್ವರಲಿಂಗದಲ್ಲಿ ಅಂದರೆ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ಒಂದಾದವನಿಗೆ, ದೇಹಭಾವ ಮತ್ತು ಲೌಕಿಕ ಮಿತಿಗಳನ್ನು ಸೂಚಿಸುವ ‘ಅಂಗ’ದ ಹಂಗಾಗಲಿ ಅಥವಾ ಬಂಧನವಾಗಲಿ ಉಳಿಯುವುದಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ಅರ್ಥವಾಗಿದೆ."}},{"no":1285,"o":"ಮುಂಡದಲ್ಲಿ ತಿರುಗುವವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ತಲೆಯಲ್ಲಿ ತಿರುಗುವವರನಾರನೂ ಕಾಣೆ.\n ಅಂಗದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ಮನದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವವರನಾರನೂ ಕಾಣೆ,\n ಅಮುಗೇಶ್ವರಾ.","t":{"en":"Those who wander as mere torsos are millions upon millions;\nI see no one who walks upon the head.\nThose who wash away the filth upon the body are millions upon millions;\nI see no one who washes away the filth within the mind,\nO Amugeshwara.","hi":"धड़ में घूमनेवाले करोड़ों हैं,\nसिर में घूमनेवाले किसी को भी नहीं देखता हूँ।\nअंग में रहे मैल को मिटानेवाले करोड़ों हैं,\nमन में रहे मैल को मिटानेवाले किसी को भी नहीं देखता हूँ,\nहे अमुगेश्वर।","mr":"धडावर चालणारे कोट्यनुकोटी आहेत;\nडोक्यावर चालणारे कोणीही मला दिसत नाहीत.\nअंगावरील मळ दूर करणारे कोट्यनुकोटी आहेत;\nमनातील मळ दूर करणारे कोणीही मला दिसत नाहीत,\nहे अमुगेश्वरा.","fr":"Ceux qui se meuvent avec le tronc sont des millions et des millions ;\nje ne vois personne qui se meuve avec la tête.\nCeux qui ôtent la souillure qui est sur le corps sont des millions et des millions ;\nje ne vois personne qui ôte la souillure qui est dans l'esprit,\nÔ Amugeshwara.","te":"మొండెములో తిరిగేవారు కోటానుకోట్లు;\nతలలో తిరిగేవారిని ఎవరినీ కానను.\nఅంగములో ఉన్న మాలిన్యాన్ని తొలగించేవారు కోటానుకోట్లు;\nమనసులో ఉన్న మాలిన్యాన్ని తొలగించేవారిని ఎవరినీ కానను,\nఓ అముగేశ్వరా.","kn":"ಮುಂಡದಲ್ಲಿ ತಿರುಗುವವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ತಲೆಯಲ್ಲಿ ತಿರುಗುವವರನಾರನೂ ಕಾಣೆ.\n ಅಂಗದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವರು ಕೋಟ್ಯನುಕೋಟಿ;\n ಮನದಲ್ಲಿಪ್ಪ ಮಲಿನವ ಕಳೆವವರನಾರನೂ ಕಾಣೆ,\n ಅಮುಗೇಶ್ವರಾ."},"m":{"en":"This Vachana highlights the stark contrast between superficial, body-centric existence and genuine inner awakening.\n\nUsing the imagery of the torso and the head, it observes that while millions of people live purely on the physical plane driven by bodily impulses, hardly anyone operates from the seat of higher awareness and intellect.\n\nSimilarly, countless individuals are obsessed with cleansing the external impurities of the physical body, yet almost no one strives to purge the deeper impurities residing within the mind.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Amugeshwara, the Vachana emphasizes that true spiritual refinement lies in mental purification and elevated consciousness rather than mere physical hygiene or outward action.","hi":"इस वचन का मूल भाव यह है कि संसार में केवल शारीरिक धरातल पर भटकने वाले तो करोड़ों लोग हैं, किंतु उच्च मानसिक या बौद्धिक चेतना के स्तर पर विचरण करने वाला कोई बिरला ही मिलता है।\n\nयहाँ 'मुंड' (धड़) और 'तले' (सिर) के प्रतीकों के माध्यम से दैहिक वृत्तियों तथा विवेकपूर्ण आत्म-जागृति के बीच के अंतर को स्पष्ट किया गया है।\n\nअमुगेश्वर के रूप में संबोधित निराकार परम सत्य के आलोक में यह वचन बताता है कि बाहरी शरीर की गंदगी को धोने वाले तो अनगिनत हैं, परंतु अपने भीतर के मानसिक विकारों और मलिनता को दूर कर मन को शुद्ध करने वाला कोई दिखाई नहीं देता।\n\nइस प्रकार यह वचन बाह्य शारीरिक शुद्धि की अपेक्षा आंतरिक और मानसिक पवित्रता के वास्तविक आध्यात्मिक महत्त्व को रेखांकित करता है।","mr":"हे वचन बाह्य आचरण आणि आंतरिक जागृती यांतील मूलभूत फरक अत्यंत प्रभावीपणे स्पष्ट करते.\n\nजगात केवळ शारीरिक पातळीवर जगणारे आणि देहाच्या गरजांभोवती फिरणारे कोट्यवधी लोक आहेत, परंतु उच्च वैचारिक पातळीवर किंवा शुद्ध जाणिवेत वावरणारे विरळाच आढळतात.\n\nत्याचप्रमाणे, शरीरावरची बाह्य घाण धुऊन काढणारे असंख्य लोक दिसतात, पण मनातील विकार आणि अज्ञानाचा मळ दूर करणारे कोणीही दिसत नाहीत, अशी खंत अमुगेश्वर या परमतत्त्वाला उद्देशून व्यक्त केली आहे.\n\nखरी आध्यात्मिक शुद्धता ही केवळ बाह्य देहाची नसून ती अंतर्मनाच्या आणि विचारांच्या निर्मळतेत आहे, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le contraste saisissant entre les préoccupations purement corporelles de l'être humain et la véritable quête de la conscience intérieure.\n\nDes millions de personnes errent dans le monde, uniquement guidées par les besoins de leur corps physique, sans jamais s'élever vers la réflexion et l'éveil de l'esprit.\n\nDe même, alors qu'une multitude d'individus s'efforcent de laver les souillures extérieures de leur chair, il est extrêmement rare de trouver quelqu'un qui s'attache à purifier son esprit de ses impuretés intérieures.\n\nÀ travers la signature spirituelle Amugeshwara, qui évoque la Réalité suprême sans forme, ce poème rappelle que la véritable pureté ne réside pas dans les soins superficiels du corps, mais dans la clarté de l'esprit et la lucidité de la conscience.","te":"ఈ వచనం బాహ్యమైన దేహశుద్ధి కంటే అంతరంగ శుద్ధి, ఉన్నతమైన ఎరుక ఎంత ముఖ్యమో వివరిస్తోంది.\n\nకేవలం భౌతిక దేహస్పృహతో, లౌకిక వ్యవహారాలలోనే తిరుగాడేవారు లోకంలో కోటానుకోట్లుగా కనిపిస్తారు గానీ, ఉన్నతమైన జ్ఞానం, ఎరుక అనే శిరస్సు స్థాయిలో సంచరించేవారు ఎక్కడా కనిపించరని ఇక్కడ స్పష్టం చేయబడింది.\n\nఅదేవిధంగా శరీరానికి అంటిన బాహ్య మలినాన్ని కడిగివేసుకునేవారు కోట్ల సంఖ్యలో ఉన్నప్పటికీ, మనస్సులో పేరుకుపోయిన అంతరంగ మలినాన్ని తొలగించుకునేవారు మాత్రం అరుదుగా కూడా కనిపించరని అముగేశ్వర అనే నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ ఈ వచనం మానసిక పవిత్రత ఆవశ్యకతను చాటుతోంది.","kn":"ಕೇವಲ ದೇಹದ ಬಯಕೆಗಳು ಮತ್ತು ಹೊರಗಿನ ಪ್ರಾಪಂಚಿಕ ವ್ಯವಹಾರಗಳ ಸುತ್ತಲೇ ತಿರುಗಾಡುತ್ತಾ ಬದುಕುವವರು ಕೋಟ್ಯಂತರ ಮಂದಿ ಇದ್ದಾರೆ, ಆದರೆ ತಲೆಯೊಳಗಿನ ವಿವೇಕ ಮತ್ತು ಉನ್ನತ ಅರಿವಿನ ಮಾರ್ಗದಲ್ಲಿ ನಡೆಯುವವರು ಯಾರೂ ಕಾಣಿಸುತ್ತಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ.\n\nಹಾಗೆಯೇ, ತಮ್ಮ ದೇಹದ ಮೇಲಿನ ಹೊರಗಿನ ಕೊಳೆಯನ್ನು ತೊಳೆದುಕೊಳ್ಳುವವರು ಕೋಟಿಗಟ್ಟಲೆ ಸಿಗುತ್ತಾರೆ, ಆದರೆ ಮನಸ್ಸಿನ ಒಳಗಿರುವ ಕೆಟ್ಟ ಆಲೋಚನೆಗಳು ಮತ್ತು ಕಲ್ಮಶಗಳನ್ನು ತೊಳೆದು ಶುದ್ಧ ಮಾಡಿಕೊಳ್ಳುವವರು ಕಾಣಸಿಗುವುದಿಲ್ಲ ಎಂದು ಇಲ್ಲಿ ಹೇಳಲಾಗಿದೆ.\n\nಇಲ್ಲಿ 'ಮುಂಡ' ಎಂದರೆ ಕೇವಲ ದೇಹಕ್ಕೆ ಸೀಮಿತವಾದ ಪ್ರಾಪಂಚಿಕ ಬದುಕು ಎಂದೂ, 'ತಲೆ' ಎಂದರೆ ವಿಚಾರಶಕ್ತಿ ಮತ್ತು ಆಂತರಿಕ ಅರಿವಿನ ನೆಲೆ ಎಂದೂ ಸಾಂಕೇತಿಕವಾಗಿ ತಿಳಿಸಲಾಗಿದೆ.\n\nಅಮುಗೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವನ್ನು ಸಾಕ್ಷಿಯಾಗಿಟ್ಟುಕೊಂಡು, ಕೇವಲ ಬಾಹ್ಯ ಶುದ್ಧತೆಗಿಂತ ಅರಿವಿನ ಎಚ್ಚರ ಮತ್ತು ಮನಸ್ಸಿನ ಆಂತರಿಕ ಶುದ್ಧತೆಯೇ ನಿಜವಾದ ಸಾಧನೆ ಎಂಬ ತಾತ್ತ್ವಿಕ ಸತ್ಯವನ್ನು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":1286,"o":"ಮೂಗಿಲ್ಲದವಂಗೆ ಕನ್ನಡಿಯ ತೋರಲೇಕೆ?\n ಕೈಯಿಲ್ಲದವಂಗೆ ಕುದುರೆಯನೇರಲೇಕೆ?\n ಕಾಲಿಲ್ಲದವಂಗೆ ನಿಚ್ಚಣಿಗೆಯನೇರಲೇಕೆ?\n ಭಕ್ತಿ ಜ್ಞಾನ ವೈರಾಗ್ಯವಿಲ್ಲದವಂಗೆ ಇಷ್ಟಲಿಂಗವೇಕೆ\n ಅಮುಗೇಶ್ವರಾ?","t":{"en":"Why show a mirror to one who has no nose?\nWhy should one who has no hands mount a horse?\nWhy should one who has no legs climb a ladder?\nOf what use is the *Ishtalinga* to one devoid of devotion, wisdom, and detachment,\nO Amugeshwara?","hi":"बिना नाकवाले को दर्पण दिखाना किसलिए?\nबिना हाथवाले को घोड़े पर चढ़ना किसलिए?\nबिना पैरवाले को सीढ़ी पर चढ़ना किसलिए?\nबिना भक्ति, ज्ञान और वैराग्यवाले को इष्टलिंग किसलिए,\nहे अमुगेश्वर?","mr":"नाक नसलेल्याला आरसा दाखवणे कशाला?\nहात नसलेल्याला घोड्यावर चढणे कशाला?\nपाय नसलेल्याला शिडीवर चढणे कशाला?\nभक्ती, ज्ञान, वैराग्य नसलेल्याला इष्टलिंग कशाला,\nहे अमुगेश्वरा?","fr":"À celui qui n'a pas de nez, pourquoi montrer un miroir ?\nÀ celui qui n'a pas de mains, pourquoi monter à cheval ?\nÀ celui qui n'a pas de jambes, pourquoi gravir une échelle ?\nÀ celui qui n'a ni Bhakti, ni connaissance, ni détachement, à quoi bon l'Ishtalinga,\nÔ Amugeshwara ?","te":"ముక్కు లేనివానికి అద్దం చూపడమెందుకు?\nచేయి లేనివానికి గుర్రం ఎక్కడమెందుకు?\nకాలు లేనివానికి నిచ్చెన ఎక్కడమెందుకు?\nభక్తి జ్ఞాన వైరాగ్యాలు లేనివానికి ఇష్టలింగమెందుకు\nఓ అముగేశ్వరా?","kn":"ಮೂಗಿಲ್ಲದವಂಗೆ ಕನ್ನಡಿಯ ತೋರಲೇಕೆ?\n ಕೈಯಿಲ್ಲದವಂಗೆ ಕುದುರೆಯನೇರಲೇಕೆ?\n ಕಾಲಿಲ್ಲದವಂಗೆ ನಿಚ್ಚಣಿಗೆಯನೇರಲೇಕೆ?\n ಭಕ್ತಿ ಜ್ಞಾನ ವೈರಾಗ್ಯವಿಲ್ಲದವಂಗೆ ಇಷ್ಟಲಿಂಗವೇಕೆ\n ಅಮುಗೇಶ್ವರಾ?"},"m":{"en":"This Vachana emphasizes that external spiritual symbols have no value without the essential inner qualities required to realize their purpose.\n\nThrough vivid everyday comparisons—showing a mirror to someone without a nose, mounting a horse without hands, or climbing a ladder without legs—the Vachana illustrates the futility of possessing a tool when one lacks the fundamental capacity to engage with it.\n\nIn Sharana philosophy, the Ishtalinga serves as a sacred visual medium and symbolic mirror (Kuruhu) designed to focus the mind and lead the seeker toward the Formless Supreme Consciousness (Aruhu).\n\nAddressed to the Formless Absolute as Amugeshwara, the Vachana concludes that wearing the Ishtalinga becomes a meaningless outward formality if a seeker is devoid of devotion, spiritual knowledge, and inner detachment.","hi":"इस वचन का केंद्रीय भाव यह है कि आंतरिक पात्रता और आत्मिक गुणों के बिना बाह्य आध्यात्मिक प्रतीक धारण करना पूर्णतः निरर्थक है।\n\nजिस प्रकार नाक विहीन व्यक्ति को दर्पण दिखाना, हाथ विहीन व्यक्ति का घोड़े पर सवार होना और पैर विहीन व्यक्ति का सीढ़ी चढ़ना अनुपयोगी एवं असंभव है, उसी प्रकार बिना आंतरिक तैयारी के साधना का मार्ग सार्थक नहीं हो सकता।\n\nअमुगेश्वर के रूप में संबोधित निराकार परमतत्त्व के साक्षात्कार हेतु इष्टलिंग एक पवित्र माध्यम और प्रवेश द्वार है, किंतु हृदय में भक्ति, ज्ञान और वैराग्य के बिना केवल बाह्य रूप से इष्टलिंग धारण करने का कोई औचित्य नहीं है।","mr":"हे वचन स्पष्ट करते की, ज्या व्यक्तीमध्ये भक्ती, ज्ञान आणि वैराग्य ही आंतरिक पात्रता नाही, तिच्यासाठी बाह्य इष्टलिंग धारण करणे पूर्णपणे निरर्थक आहे.\n\nज्याप्रमाणे नाक नसलेल्या व्यक्तीला आरसा दाखवण्याचा, हात नसलेल्याला घोड्यावर बसवण्याचा किंवा पाय नसलेल्याला शिडीवर चढवण्याचा काहीही उपयोग होत नाही, त्याचप्रमाणे योग्य आध्यात्मिक जाणीव नसलेल्या व्यक्तीला साधनेची साधने देणे व्यर्थ ठरते.\n\nशरण तत्त्वज्ञानानुसार, इष्टलिंग हे निराकार परमतत्त्वाशी एकरूप होण्याचे एक पवित्र माध्यम आहे, परंतु त्याचा खरा लाभ घेण्यासाठी साधकाच्या अंतःकरणात भक्ती, सम्यक ज्ञान आणि वैराग्याची बैठक असणे आवश्यक आहे.\n\n'अमुगेश्वर' या अंकितनामातून निराकार चैतन्याला उद्देशून हेच सांगण्यात आले आहे की, आंतरिक गुणवत्तेशिवाय केवळ बाह्य प्रतीकांचे किंवा साधनांचे आचरण आध्यात्मिक उन्नती घडवून आणू शकत नाही.","fr":"Ce vachana met en lumière le fait que le port de l'Ishtalinga est dénué de sens s'il n'est pas accompagné d'une préparation intérieure adéquate.\n\nÀ travers des images frappantes — tendre un miroir à une personne sans nez, faire monter à cheval quelqu'un sans mains ou gravir une échelle à quelqu'un sans jambes —, le texte illustre l'inutilité d'un outil lorsque la capacité fondamentale d'en faire usage fait défaut.\n\nDe la même manière, pour une personne dépourvue de dévotion (Bhakti), de connaissance spirituelle (Jnana) et de détachement (Vairagya), l'Ishtalinga reste un objet extérieur sans effet véritable.\n\nEn s'adressant à la Réalité suprême sans forme invoquée sous la signature spirituelle Amugeshwara, ce vachana rappelle que l'Ishtalinga, en tant que miroir symbolique et porte d'accès vers l'Absolu, exige la présence vivante de ces trois qualités intérieures pour accomplir sa fonction spirituelle.","te":"అంతరంగంలో భక్తి, జ్ఞానం, వైరాగ్యం అనే ఆధ్యాత్మిక అర్హతలు లేనప్పుడు బాహ్యంగా ఇష్టలింగాన్ని ధరించడం నిరర్థకమని ఈ వచనం స్పష్టం చేస్తోంది.\n\nముక్కు లేనివాడికి అద్దం చూపడం, చేతులు లేనివాడు గుర్రం ఎక్కాలనుకోవడం, కాళ్ళు లేనివాడు నిచ్చెన ఎక్కాలనుకోవడం ఎలా నిష్ప్రయోజనమో, సరైన ఆంతరిక సంసిద్ధత లేని ఆధ్యాత్మిక ఆచరణ కూడా అంతే అర్థరహితమని ఇందులోని ఉపమానాలు వివరిస్తున్నాయి.\n\nఅముగేశ్వర అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, ఇష్టలింగం అనేది కేవలం బాహ్యంగా ధరించే వస్తువు కాదని, భక్తి-జ్ఞాన-వైరాగ్యాలతో కూడిన ఎరుక ఉన్నప్పుడే అది నిరాకార చైతన్యాన్ని అనుభూతి చెందే పవిత్ర మాధ్యమంగా సార్థకమవుతుందని ఈ వచనం బోధిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಯಾವುದೇ ಒಂದು ಸಾಧನವು ಸಾರ್ಥಕವಾಗಬೇಕಾದರೆ ಅದನ್ನು ಬಳಸುವವನಲ್ಲಿ ಅದಕ್ಕೆ ತಕ್ಕ ಅರ್ಹತೆ ಮತ್ತು ಆಂತರಿಕ ಸಿದ್ಧತೆ ಇರಬೇಕು.\n\nಮೂಗಿಲ್ಲದವನಿಗೆ ಕನ್ನಡಿ ತೋರಿಸಿದರೆ, ಕೈಯಿಲ್ಲದವನು ಕುದುರೆ ಏರಲು ಹೋದರೆ ಅಥವಾ ಕಾಲಿಲ್ಲದವನು ಏಣಿ ಹತ್ತಲು ಪ್ರಯತ್ನಿಸಿದರೆ ಅದು ಹೇಗೆ ನಿಷ್ಪ್ರಯೋಜಕವೋ, ಹಾಗೆಯೇ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯಲ್ಲಿಯೂ ಕೇವಲ ಬಾಹ್ಯ ಚಿಹ್ನೆಗಳಿಂದ ಯಾವುದೇ ಪ್ರಯೋಜನವಿಲ್ಲ.\n\nಶರಣರ ತತ್ತ್ವದಲ್ಲಿ ಇಷ್ಟಲಿಂಗವು ನಿರಾಕಾರ ಪರಮಸತ್ಯವನ್ನು ಅರಿಯಲು ಮತ್ತು ಮನಸ್ಸನ್ನು ಕೇಂದ್ರೀಕರಿಸಲು ಇರುವ ಒಂದು ಪವಿತ್ರ ಮಾಧ್ಯಮವೇ ಹೊರತು, ಕೇವಲ ಮೈಮೇಲೆ ಧರಿಸುವ ತೋರಿಕೆಯ ವಸ್ತುವಲ್ಲ.\n\nಆದ್ದರಿಂದ ಅಮುಗೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವನ್ನು ಸಾಕ್ಷಾತ್ಕರಿಸಿಕೊಳ್ಳಲು ಮನಸ್ಸಿನಲ್ಲಿ ನಿಜವಾದ ಭಕ್ತಿ, ಅರಿವು ಮತ್ತು ವೈರಾಗ್ಯಗಳಿಲ್ಲದಿದ್ದರೆ, ಅಂತಹವರಿಗೆ ಇಷ್ಟಲಿಂಗವನ್ನು ಧರಿಸುವುದರಿಂದಲೂ ಏನೂ ಪ್ರಯೋಜನವಿಲ್ಲ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":1287,"o":"ವಿರಕ್ತನಾದ ಬಳಿಕ ವಿಷಯಕ್ಕೆ ದೂರನಾಗಿರಬೇಕು.\n ಒಣಗಿದ ಮರನ ವಾಯು ಅಪ್ಪಿದಂತಿರಬೇಕು.\n ಸಮುದ್ರದೊಳಗೆ ತರುಗಿರಿಗಳು ಮುಳುಗಿದಂತಿರಬೇಕು.\n ಮೂಗ ಕಂಡ ಕನಸಿನಂತಿರಬೇಕು.\n ಜಾಲಗಾರ ಕಂಡ ರತ್ನದಂತಿರಬಲ್ಲಡೆ, ವಿರಕ್ತನೆಂಬೆನು.\n ಹೀಂಗಲ್ಲದೆ, ಅರಿವುಳ್ಳವರೆಂದು\n ತಮ್ಮ ಅಗಮ್ಯವ ಬೀರುವ ಅಜ್ಞಾನಿಯ\n ಭಕ್ತನೆಂದಡೆ, ಮಾಹೇಶ್ವರನೆಂದಡೆ, ಪ್ರಸಾದಿಯೆಂದಡೆ,\n ಪ್ರಾಣಲಿಂಗಿಯೆಂದಡೆ, ಶರಣನೆಂದಡೆ, ಐಕ್ಯನೆಂದಡೆ\n ಅಘೋರನರಕ ತಪ್ಪದು ಕಾಣಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ.","t":{"en":"Once one has become a renunciate, one must remain far from sensory pleasures.\nOne must be as when the wind embraces a withered tree.\nOne must be as when trees and mountains are submerged within the ocean.\nOne must be like a dream seen by the mute.\nIf one can be like a gem found by a fisherman, I shall call him a renunciate.\nOtherwise, claiming to possess *Arivu*—innate awareness—\nif one calls an ignorant person who flaunts his unfathomable state\na *Bhakta*, or a *Maheshwara*, or a *Prasadi*,\nor a *Pranalingi*, or a *Sharana*, or an *Aikya*,\ndreadful hell is inescapable, you see, O Amugeshwaralinga.","hi":"विरक्त होने के बाद विषय से दूर रहना चाहिए।\nसूखे पेड़ को वायु के आलिंगन करने के समान रहना चाहिए।\nसमुद्र के भीतर वृक्ष और पर्वतों के डूबने के समान रहना चाहिए।\nगूँगे के देखे स्वप्न के समान रहना चाहिए।\nमछुआरे को मिले रत्न के समान रह सके, तो विरक्त कहूँगा।\nऐसा न होकर, स्वयं को चेतनावाला कहकर\nअपनी अगम्यता का प्रदर्शन करनेवाले अज्ञानी को\nभक्त कहने पर, माहेश्वर कहने पर, प्रसादी कहने पर,\nप्राणलिंगी कहने पर, शरण कहने पर, ऐक्य कहने पर\nअघोर नरक टलेगा नहीं देखो, हे अमुगेश्वरलिंग।","mr":"विरक्त झाल्यानंतर विषयापासून दूर असले पाहिजे।\nवाळलेल्या झाडाला वाऱ्याने आलिंगन दिल्यासारखे असले पाहिजे।\nसमुद्रामध्ये वृक्ष आणि पर्वत बुडाल्यासारखे असले पाहिजे।\nमुक्याने पाहिलेल्या स्वप्नासारखे असले पाहिजे।\nजाळे टाकणाऱ्या कोळ्याला सापडलेल्या रत्नासारखे राहता आले, तरच मी त्याला विरक्त म्हणेन।\nअसे नसता, आपण जाणीवसंपन्न आहोत असे म्हणवत\nआपल्या अगम्यतेचाच बडेजाव मिरवणाऱ्या अज्ञानाला\nभक्त म्हटले तर, माहेश्वर म्हटले तर, प्रसादी म्हटले तर,\nप्राणलिंगी म्हटले तर, शरण म्हटले तर, ऐक्य म्हटले तर\nअघोर नरक चुकणार नाही पाहा, हे अमुगेश्वरलिंगा।","fr":"Après être devenu un renonçant, il faut demeurer éloigné des plaisirs des sens.\nIl faut être comme le vent embrassant un arbre desséché.\nIl faut être comme les arbres et les montagnes engloutis dans l'océan.\nIl faut être comme le rêve qu'a fait un muet.\nS'il sait être comme un joyau trouvé par un pêcheur au filet, je l'appellerai un renonçant.\nSinon, l'ignorant qui, se disant doué de conscience éveillée,\nétale sa propre impénétrabilité —\nsi on l'appelle Bhakta, si on l'appelle Maheshwara, si on l'appelle Prasadi,\nsi on l'appelle Pranalingi, si on l'appelle Sharana, si on l'appelle Aikya,\nle terrible enfer sera inévitable, vois-tu, ô Amugeshwaralinga.","te":"విరక్తుడైన తరువాత విషయవాసనలకు దూరంగా ఉండాలి.\nఎండిన చెట్టును గాలి కౌగిలించుకున్నట్లుండాలి.\nసముద్రంలో చెట్లు, కొండలు మునిగినట్లుండాలి.\nమూగవాడు కన్న కల వలె ఉండాలి.\nజాలరి చూసిన రత్నం వలె ఉండగలిగితేనే, విరక్తుడని అంటాను.\nఇలా కాక, ఎరుక గలవారమని\nతమ అగమ్యతను చాటుకొనే అజ్ఞానిని\nభక్తుడని అన్నా, మాహేశ్వరుడని అన్నా, ప్రసాదియని అన్నా,\nప్రాణలింగియని అన్నా, శరణుడని అన్నా, ఐక్యుడని అన్నా\nఅఘోర నరకం తప్పదు సుమా, ఓ అముగేశ్వరలింగా.","kn":"ವಿರಕ್ತನಾದ ಬಳಿಕ ವಿಷಯಕ್ಕೆ ದೂರನಾಗಿರಬೇಕು.\n ಒಣಗಿದ ಮರನ ವಾಯು ಅಪ್ಪಿದಂತಿರಬೇಕು.\n ಸಮುದ್ರದೊಳಗೆ ತರುಗಿರಿಗಳು ಮುಳುಗಿದಂತಿರಬೇಕು.\n ಮೂಗ ಕಂಡ ಕನಸಿನಂತಿರಬೇಕು.\n ಜಾಲಗಾರ ಕಂಡ ರತ್ನದಂತಿರಬಲ್ಲಡೆ, ವಿರಕ್ತನೆಂಬೆನು.\n ಹೀಂಗಲ್ಲದೆ, ಅರಿವುಳ್ಳವರೆಂದು\n ತಮ್ಮ ಅಗಮ್ಯವ ಬೀರುವ ಅಜ್ಞಾನಿಯ\n ಭಕ್ತನೆಂದಡೆ, ಮಾಹೇಶ್ವರನೆಂದಡೆ, ಪ್ರಸಾದಿಯೆಂದಡೆ,\n ಪ್ರಾಣಲಿಂಗಿಯೆಂದಡೆ, ಶರಣನೆಂದಡೆ, ಐಕ್ಯನೆಂದಡೆ\n ಅಘೋರನರಕ ತಪ್ಪದು ಕಾಣಾ, ಅಮುಗೇಶ್ವರಲಿಂಗವೆ."},"m":{"en":"This Vachana defines the true nature of spiritual renunciation (Virakti), emphasizing that one who claims to be detached must remain completely unmoved by sensory pleasures and worldly temptations.\n\nThrough vivid metaphors—such as the wind embracing a dry tree, mountains and trees submerged within the ocean, a mute person's dream, and a fisherman indifferent to a precious gem—the Vachana illustrates a state of inward stillness that neither reacts to external contact nor feels the urge to boast about its inner treasure.\n\nIt sharply critiques the spiritual arrogance of ignorant individuals who claim to possess higher awareness (Arivu) while ostentatiously displaying their inner mysticism for worldly recognition.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Amugeshwaralinga, the Vachana warns that bestowing the sacred titles of the six-fold spiritual path (Shatsthala)—Bhakta, Maheshwara, Prasadi, Pranalingi, Sharana, or Aikya—upon such pretentious people is a grave error that inevitably leads to spiritual downfall.","hi":"इस वचन का मूल भाव यह है कि एक सच्चे विरक्त को सांसारिक विषयों और इंद्रिय-भोगों से पूरी तरह निर्लिप्त रहना चाहिए।\n\nविषयों के प्रति उसकी अनासक्ति ऐसी होनी चाहिए जैसे सूखे वृक्ष को हवा छूकर निकल जाती है, समुद्र की गहराई में पेड़ और पहाड़ समा जाते हैं, गूंगा व्यक्ति अपने सपने का बखान नहीं कर पाता, या मछुआरे को रत्न मिलने पर भी उसके प्रति कोई आकर्षण नहीं होता।\n\nइसके विपरीत, जो अज्ञानी व्यक्ति इस आंतरिक विरक्ति के बिना स्वयं को ज्ञानी मानकर अपनी अगम्य आध्यात्मिक स्थिति का बाहरी प्रदर्शन और बखान करते हैं, वे सच्चे साधक नहीं हैं।\n\nअमुगेश्वरलिंग के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन स्पष्ट करता है कि ऐसे दंभी लोगों को भक्त, माहेश्वर, प्रसादी, प्राणलिंगी, शरण या ऐक्य जैसे षट्स्थल के उच्च नामों से पुकारना घोर पतन का कारण बनता है।","mr":"हे वचन खऱ्या विरक्तीचे स्वरूप स्पष्ट करताना सांगते की, विरक्त झालेल्या साधकाने सर्व विषयवासनांपासून अलिप्त राहणे आवश्यक आहे.\n\nवाळलेल्या झाडाला वाऱ्याने स्पर्श केला तरी जसा त्यात कोणताही बदल होत नाही, महासागरात पर्वत आणि वृक्ष पूर्णपणे सामावून जातात, मुक्या माणसाला पडलेले स्वप्न जसे तो शब्दांत मांडू शकत नाही किंवा कोळ्याला सापडलेल्या रत्नाबद्दल जशी त्याला कोणतीही आसक्ती नसते, तशी संपूर्ण निरिच्छ आणि शांत अवस्था प्राप्त झाल्यावरच ती खरी विरक्ती ठरते.\n\nयाउलट, अंतर्यामी अशी विरक्ती नसताना केवळ आपण ज्ञानी आहोत असा आव आणणाऱ्या आणि आपल्या अपूर्ण ज्ञानाचे बाह्य प्रदर्शन करणाऱ्या अज्ञानी माणसाला भक्त, माहेश्वर, प्रसादी, प्राणलिंगी, शरण किंवा ऐक्य अशा षट्स्थलांच्या उच्च अवस्था प्राप्त झाल्याचे मानणे हा केवळ भ्रम आहे.\n\nअशा बाह्य अवडंबर करणाऱ्या दांभिक व्यक्तीला भयंकर अधोगती टाळता येणार नाही, हाच अमुगेश्वरलिंग या परमतत्त्वाला उद्देशून मांडलेला या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana définit l'essence du véritable détachement spirituel, qui exige de demeurer entièrement affranchi de l'emprise des objets sensoriels.\n\nÀ travers des images saisissantes — un arbre desséché que le vent caresse sans l'ébranler, des montagnes et des forêts englouties dans l'océan, le rêve indicible d'un muet ou un joyau trouvé par un pêcheur qui n'en fait nul cas — le texte illustre l'état d'une conscience impassible, silencieuse et libre de toute convoitise.\n\nÀ l'inverse, ceux qui demeurent dans l'ignorance tout en faisant ostensiblement étalage d'une prétendue connaissance de l'inaccessible trahissent l'esprit même du renoncement.\n\nEn s'adressant à la Réalité suprême sans forme à travers l'ankitanama Amugeshwaralinga, le vachana avertit avec fermeté qu'accorder à de tels êtres les titres spirituels des six étapes de l'évolution intérieure (Shatsthala) — Bhakta, Maheshwara, Prasadi, Pranalingi, Sharana ou Aikya — est une grave dérive qui mène inévitablement à la perdition.","te":"ఈ వచనం నిజమైన విరాగికి ఉండవలసిన ఆంతరంగిక నిర్లిప్తతను, మౌన నిష్ఠను లోతైన ఉపమానాలతో వివరిస్తున్నది.\n\nవైరాగ్యాన్ని స్వీకరించిన సాధకుడు లౌకిక విషయవాసనలకు పూర్తిగా దూరమై, ఎండిన చెట్టును గాలి తాకినట్లుగా స్పందన రహితంగా, సముద్రగర్భంలో మునిగిన కొండలు, చెట్లలా నిశ్చలంగా ఉండాలి.\n\nఅంతేకాక, మూగవాడు కన్న కలలాగా తన అనుభూతిని బయటకు ప్రదర్శించకుండా, జాలరికి దొరికిన రత్నంలాగా ప్రాపంచిక విలువల పట్ల ఉదాసీనంగా ఉండగలిగినప్పుడే అతడు నిజమైన విరక్తుడవుతాడు.\n\nఅలా కాకుండా, తాము గొప్ప ఎరుక గలవారమని భావిస్తూ, వాక్కుకు అందని ఆధ్యాత్మిక రహస్యాలను బహిరంగంగా ప్రదర్శించుకునే అజ్ఞానులను భక్తుడు, మాహేశ్వరుడు, ప్రసాది, ప్రాణలింగి, శరణుడు లేదా ఐక్యుడు అనే షట్స్థల నామాలతో పిలిస్తే అఘోర నరకం తప్పదని అముగేశ్వరలింగ అనే నిరాకార పరమతత్త్వం సాక్షిగా ఈ వచనం హెచ్చరిస్తున్నది.","kn":"ಈ ವಚನವು ನಿಜವಾದ ವಿರಕ್ತನ ಸ್ವಭಾವ ಹೇಗಿರಬೇಕು ಎಂಬುದನ್ನು ಬಹಳ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸುತ್ತದೆ; ಒಮ್ಮೆ ವಿರಕ್ತನಾದ ಮೇಲೆ ಇಂದ್ರಿಯ ಭೋಗಗಳ ಕಡೆಗೆ ಸ್ವಲ್ಪವೂ ಆಕರ್ಷಣೆ ಇಲ್ಲದೆ, ಒಣಗಿದ ಮರಕ್ಕೆ ಗಾಳಿ ಬಡಿದಾಗ ಅದು ಹೇಗೆ ನಿರ್ಲಿಪ್ತವಾಗಿರುತ್ತದೆಯೋ ಹಾಗೆ ಪ್ರಾಪಂಚಿಕ ವಿಷಯಗಳಿಂದ ಸಂಪೂರ್ಣ ದೂರವಿರಬೇಕು.\n\nಸಮುದ್ರದ ಆಳದಲ್ಲಿ ಮರಗಳೂ ಬೆಟ್ಟಗಳೂ ಮುಳುಗಿ ಹೊರಗೆ ಕಾಣದಂತಿರುವ ಹಾಗೆ, ಮೂಗನು ಕಂಡ ಕನಸನ್ನು ಬೇರೆಯವರಿಗೆ ಹೇಳಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಾಗದ ಹಾಗೆ, ಮತ್ತು ಮೀನು ಹಿಡಿಯುವ ಜಾಲಗಾರನಿಗೆ ರತ್ನ ಸಿಕ್ಕರೂ ಅದರ ಆಸೆ ಹುಟ್ಟದ ಹಾಗೆ, ತನ್ನ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯನ್ನು ಹೊರಗೆ ಪ್ರದರ್ಶಿಸದೆ ಒಳಗೇ ಅಡಗಿಸಿಕೊಂಡು ನಿರ್ಲಿಪ್ತವಾಗಿರುವವನೇ ನಿಜವಾದ ವಿರಕ್ತ.\n\nಇದನ್ನು ಬಿಟ್ಟು, ತಾವು ಮಹಾ ಜ್ಞಾನಿಗಳೆಂದು ತೋರಿಸಿಕೊಳ್ಳುತ್ತಾ, ಮಾತಿನಲ್ಲಿ ವಿವರಿಸಲಾಗದ ಪರಮಸತ್ಯದ ಅನುಭವವನ್ನು ಬೀದಿಯಲ್ಲಿ ಹರಡುವಂತೆ ಡಂಭಾಚಾರದಿಂದ ಪ್ರದರ್ಶಿಸುವವರನ್ನು ಈ ವಚನವು ಅಜ್ಞಾನಿಗಳೆಂದು ಕರೆಯುತ್ತದೆ.\n\nಇಂತಹ ತೋರಿಕೆಯ ಅಜ್ಞಾನಿಗಳನ್ನು ಭಕ್ತ, ಮಾಹೇಶ್ವರ, ಪ್ರಸಾದಿ, ಪ್ರಾಣಲಿಂಗಿ, ಶರಣ ಅಥವಾ ಐಕ್ಯ ಎಂಬ ಷಟ್‌ಸ್ಥಲದ ಸಾಧಕರೆಂದು ಕರೆದರೆ ಅಘೋರ ನರಕ ತಪ್ಪುವುದಿಲ್ಲ ಎಂದು ಅಮುಗೇಶ್ವರಲಿಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಸಾಕ್ಷಿಯಾಗಿ ಈ ವಚನವು ಎಚ್ಚರಿಸುತ್ತದೆ."}},{"no":1288,"o":"ವೇಷವ ತೊಟ್ಟು ಗ್ರಾಸಕ್ಕೆ ತಿರುಗುವ\n ವೇಷಧಾರಿಗಳ ಕಂಡಡೆ ನಾಚಿತ್ತೆನ್ನ ಮನ.\n ಲಿಂಗವನರಿಯದೆ ಲಿಂಗೈಕ್ಯರೆಂಬ\n ಅಂಗವಿಕಾರಿಗಳ ಕಂಡಡೆ ಹೊದ್ದದು ಎನ್ನ ಮನ.\n ಅರಿದು ಆಚರಿಸಿದೆನೆಂಬ ಅಜ್ಞಾನಿಗಳ ಕಂಡಡೆ\n ಮೃಡನ ಶರಣರು ಮೆಚ್ಚುವರೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದಿರ್ದಡೆ\n ಎಂತು ಲಿಂಗೈಕ್ಯರೆಂಬೆನಯ್ಯಾ?","t":{"en":"Putting on a garb and wandering about for a mouthful of food—\nthe moment I see such wearers of disguise, my mind is ashamed.\nWithout knowing the *Linga*, claiming to be united with the *Linga*—\nthe moment I see such slaves to bodily passions, my mind does not draw near them.\nThe moment they see the ignorant who say, \"Having known, I have practised,\"\nwill the *Sharanas* of Mrida ever approve of them?\nIf they do not know Amugeshwaralinga,\nhow can I call them united with the *Linga*, O Lord?","hi":"वेष धारणकर ग्रास के लिए भटकनेवाले\nवेषधारियों को देखते ही लज्जित हो उठा मेरा मन।\nलिंग को जाने बिना लिंगैक्य कहनेवाले\nअंगविकारियों को देखते ही उनसे मेल नहीं खाता मेरा मन।\nजानकर आचरण किया है कहनेवाले अज्ञानियों को देखते ही\nक्या मृड के शरण प्रसन्न होंगे?\nअमुगेश्वरलिंग को यदि न जानें,\nतो कैसे लिंगैक्य कहूँ, हे स्वामी?","mr":"वेष धारण करून घासासाठी फिरणाऱ्या\nवेषधाऱ्यांना पाहताच लाजले माझे मन।\nलिंगाला न जाणता आम्ही लिंगैक्य आहोत असे म्हणणाऱ्या\nअंगविकाऱ्यांना पाहताच जवळ जात नाही माझे मन।\nजाणून आचरण केले असे म्हणणाऱ्या अज्ञानी लोकांना पाहताच\nमृडाचे शरण संतुष्ट होतील का?\nअमुगेश्वरलिंगाला न जाणले, तर\nत्यांना लिंगैक्य कसे म्हणू, हे प्रभो?","fr":"Dès qu'il voit ces imposteurs qui revêtent un habit pour errer en quête de pitance,\nmon esprit éprouve de la honte.\nDès qu'il voit ces êtres en proie aux passions du corps qui, sans connaître le Linga, se disent unis au Linga,\nmon esprit ne peut s'y attacher.\nDès qu'ils voient ces ignorants qui disent avoir pratiqué en toute conscience,\nles Sharanas de Mrida les approuveraient-ils ?\nS'ils ne connaissent pas Amugeshwaralinga,\ncomment pourrais-je dire qu'ils sont unis au Linga, ô Seigneur ?","te":"వేషం ధరించి గ్రాసం కోసం తిరిగే\nవేషధారులను చూడగానే సిగ్గుపడింది నా మనసు.\nలింగాన్ని ఎరుగక లింగైక్యులమని చెప్పుకునే\nఅంగవికారులను చూడగానే చేరదు నా మనసు.\nతెలిసి ఆచరించానని చెప్పుకునే అజ్ఞానులను చూడగానే\nమృడుని శరణులు మెచ్చుకుంటారా?\nఅముగేశ్వరలింగాన్ని ఎరుగకుంటే\nఎలా లింగైక్యులని చెప్పగలను ఓ స్వామీ?","kn":"ವೇಷವ ತೊಟ್ಟು ಗ್ರಾಸಕ್ಕೆ ತಿರುಗುವ\n ವೇಷಧಾರಿಗಳ ಕಂಡಡೆ ನಾಚಿತ್ತೆನ್ನ ಮನ.\n ಲಿಂಗವನರಿಯದೆ ಲಿಂಗೈಕ್ಯರೆಂಬ\n ಅಂಗವಿಕಾರಿಗಳ ಕಂಡಡೆ ಹೊದ್ದದು ಎನ್ನ ಮನ.\n ಅರಿದು ಆಚರಿಸಿದೆನೆಂಬ ಅಜ್ಞಾನಿಗಳ ಕಂಡಡೆ\n ಮೃಡನ ಶರಣರು ಮೆಚ್ಚುವರೆ?\n ಅಮುಗೇಶ್ವರಲಿಂಗವನರಿಯದಿರ್ದಡೆ\n ಎಂತು ಲಿಂಗೈಕ್ಯರೆಂಬೆನಯ್ಯಾ?"},"m":{"en":"This Vachana sharply critiques spiritual hypocrisy, expressing deep disdain for those who merely adopt outward religious attire to earn their livelihood.\n\nIt rejects the false claims of individuals who remain enslaved to bodily passions yet declare themselves to have attained Lingaikya—ultimate union with the Supreme Reality—without truly realizing the essence of the Linga.\n\nThe Vachana emphasizes that genuine Sharanas of Mruda can never approve of the spiritually ignorant who boast of practicing truth while lacking authentic inner awareness (Arivu).\n\nUltimately, it asserts that without experiencing the Formless Supreme Consciousness addressed as Amugeshwaralinga, no one can genuinely claim to have achieved spiritual union.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक जीवन में बाहरी भेषभूषा, पाखंड और बिना वास्तविक बोध के किए गए दावों का कोई स्थान नहीं है।\n\nकेवल अपनी जीविका या भिक्षा के लिए धार्मिक भेष धारण करके घूमने वाले पाखंडियों को देखकर सच्चे साधक का मन लज्जित होता है, तथा लिंग-तत्त्व के वास्तविक स्वरूप को जाने बिना और शारीरिक विकारों से मुक्त हुए बिना स्वयं को लिंगैक्य कहने वालों को मन कभी स्वीकार नहीं करता।\n\nवास्तविक अज्ञान में डूबे रहकर भी यह अहंकार रखने वाले लोगों को कि उन्होंने सत्य को जानकर आचरण किया है, सच्चे शरण कभी पसंद नहीं कर सकते।\n\nइस वचन का आध्यात्मिक महत्त्व यह स्पष्ट करने में है कि जब तक निराकार परमतत्त्व अमुगेश्वरलिंग की सच्ची अनुभूति और आत्म-बोध न हो, तब तक किसी को भी वास्तव में लिंगैक्य की अवस्था प्राप्त करने वाला नहीं माना जा सकता।","mr":"हे वचन केवळ पोटाची खळगी भरण्यासाठी आध्यात्मिक वेश धारण करून भटकणाऱ्या ढोंगी वेशधाऱ्यांवर कठोर भाष्य करते आणि अशा दांभिकपणाविषयी मनात निर्माण होणारी लाज व खंत व्यक्त करते.\n\nनिराकार परमतत्त्वाकडे नेणाऱ्या लिंगतत्त्वाचे खरे स्वरूप न जाणताच आणि स्वतःच्या शारीरिक विकारांवर विजय न मिळवताच, जे स्वतःला 'लिंगैक्य' (परमतत्त्वाशी एकरूप झालेले) म्हणवून घेतात, अशा लोकांशी सच्चे मन कधीही जोडले जाऊ शकत नाही.\n\nखऱ्या आध्यात्मिक जाणीवेचा अभाव असतानाही \"मी सर्व काही जाणून आचरण केले आहे\" असा अहंकार बाळगणाऱ्या अज्ञानी लोकांचे वागणे जागृत शरणांना कधीही मान्य होऊ शकत नाही.\n\n'अमुगेश्वरलिंग' या नावाने संबोधित केलेल्या निराकार परमतत्त्वाची प्रत्यक्ष अनुभूती आणि जाण नसताना, केवळ बाह्य देखाव्याच्या आधारे कोणालाही परमतत्त्वाशी एकरूप झालेले मानता येत नाही, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana dénonce avec fermeté l'hypocrisie spirituelle de ceux qui revêtent un simple habit religieux pour gagner leur subsistance, provoquant ainsi un sentiment de honte face à une telle imposture.\n\nIl rejette résolument les individus qui demeurent asservis aux passions du corps tout en prétendant avoir atteint l'union avec le Linga (Lingaikya) sans en posséder la moindre connaissance intérieure.\n\nDe même, les authentiques Sharanas ne sauraient approuver l'arrogance des ignorants qui se vantent de détenir le savoir et d'accomplir des pratiques spirituelles, alors qu'ils sont dépourvus de véritable discernement.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation que nul ne peut être reconnu comme uni au Principe suprême sans avoir véritablement réalisé et expérimenté en soi la Réalité suprême sans forme, invoquée ici sous le nom d'Amugeshwaralinga.","te":"ఈ వచనం బాహ్య ఆడంబరాలను, కేవలం ఉదరపోషణ కోసం ఆధ్యాత్మిక వేషాలు ధరించే కపటత్వాన్ని తీవ్రంగా ఖండిస్తోంది.\n\nఆహారం కోసం వేషాలు వేసుకుని తిరిగే వేషధారులను చూసినప్పుడు మనస్సు సిగ్గుపడుతుందని, నిరాకార పరమతత్త్వమైన లింగతత్త్వాన్ని అనుభూతి చెందకుండానే తాము లింగైక్యం పొందామని చెప్పుకునే శారీరక వికారాలు గలవారిని తన మనస్సు అంగీకరించదని ఈ వచనం స్పష్టం చేస్తోంది.\n\nనిజమైన ఎరుక లేకపోయినా తాము అన్నీ తెలుసుకుని ఆచరించామని గర్వించే అజ్ఞానులను మృడుని శరణులు ఎన్నటికీ మెచ్చుకోరని ఇక్కడ వివరించబడింది.\n\nఅముగేశ్వరలింగంగా సంబోధించబడే ఆ నిరాకార పరమచైతన్యాన్ని అంతరంగంలో యథార్థంగా తెలుసుకోలేని వారిని లింగైక్యులని ఎలా అనగలమని ప్రశ్నిస్తూ, ఆత్మజ్ఞానం లేని బాహ్య ఆచరణ నిరర్థకమని ఈ వచనం తేల్చి చెబుతోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕೇವಲ ಒಂದು ತುತ್ತು ಅನ್ನಕ್ಕಾಗಿ ಮತ್ತು ಹೊಟ್ಟೆಪಾಡಿಗಾಗಿ ಆಧ್ಯಾತ್ಮಿಕ ವೇಷ ಹಾಕಿಕೊಂಡು ತಿರುಗಾಡುವ ಡಾಂಭಿಕರನ್ನು ಕಂಡರೆ ನಿಜವಾದ ಸಾಧಕನ ಮನಸ್ಸಿಗೆ ನಾಚಿಕೆಯಾಗುತ್ತದೆ.\n\nತಮ್ಮೊಳಗಿನ ಹಾಗೂ ಇಷ್ಟಲಿಂಗದ ಹಿಂದಿರುವ ಆಳವಾದ ಪರಮತತ್ತ್ವವನ್ನು ಅರಿತುಕೊಳ್ಳದೆ, ದೇಹದ ಬಯಕೆ ಮತ್ತು ವಿಕಾರಗಳಲ್ಲೇ ಮುಳುಗಿದ್ದುಕೊಂಡು ತಮ್ಮನ್ನು ತಾವು 'ಲಿಂಗೈಕ್ಯರು' ಎಂದು ಕರೆದುಕೊಳ್ಳುವವರನ್ನು ಮನಸ್ಸು ಎಂದಿಗೂ ಒಪ್ಪುವುದಿಲ್ಲ.\n\nನಿಜವಾದ ಅರಿವಿಲ್ಲದಿದ್ದರೂ ಎಲ್ಲವನ್ನೂ ತಿಳಿದು ಆಚರಿಸುತ್ತಿದ್ದೇವೆ ಎಂದು ಬೀಗುವ ಅಜ್ಞಾನಿಗಳನ್ನು ಮೃಡನ ಶರಣರು ಎಂದಿಗೂ ಮೆಚ್ಚುವುದಿಲ್ಲ.\n\nಅಮುಗೇಶ್ವರಲಿಂಗ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ನೈಜ ಅರಿವು ಮತ್ತು ಅನುಭಾವವಿಲ್ಲದವರನ್ನು ಲಿಂಗೈಕ್ಯರು ಎಂದು ಕರೆಯಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಸ್ಪಷ್ಟ ನಿಲುವಾಗಿದೆ."}},{"no":1289,"o":"ಹೆದರದಿರು ಮನವೆ, ಹಿಮ್ಮೆಟ್ಟದಿರು ಮನವೆ,\n ಹಿಡಿದ ಛಲವ ಬಿಡದಿರು ಮನವೆ.\n ಜರಿದರೆಂದು ಝಂಕಿಸಿದರೆಂದು\n ಶಸ್ತ್ರ ಸಮಾಧಿ ನೀರು ನೇಣು ವಿಷ ಔಷಧದಲ್ಲಿ ಘಟವ ಬಿಡದೆ,\n ಗುರುವಾಡದು ಲಿಂಗವಾದಡು ಜಂಗಮವಾದಡು\n ನೊಸಲಲ್ಲಿ ಕಣ್ಣುಳ್ಳ ಪಶುಪತಿಯಾದಡು\n ತೆತ್ತಿಗರು ಕಂಡು ಒತ್ತಿ ನುಡಿದರೆಂದು ಘಟವ ಬಿಡುವ ಕರ್ಮಿಗಳು\n ಏಳೇಳು ಜನ್ಮದಲ್ಲಿ ಸೂಕರನ ಹೊಟ್ಟೆಯಲ್ಲಿ ಹುಟ್ಟಿ,\n ನೂರೊಂದು ಕುಲ ಹದಿನೆಂಟು ಜಾತಿಯ ಅಮೇಧ್ಯವ ತಿಂದು\n ಹೊಲೆಯರ ಮನೆಯ ಹೊಸ್ತಿಲ ಕಾಯ್ದುಕೊಂಡಿಪ್ಪರಯ್ಯ,\n ಅಮುಗೇಶ್ವರಲಿಂಗವೆ, ನಿಮ್ಮಾಣೆ ನಿಮ್ಮ ಪ್ರಮಥರಾಣೆ.","t":{"en":"Do not fear, O Mind; do not retreat, O Mind;\ndo not abandon the resolve you have taken, O Mind.\nWithout forsaking the body by weapon, burial, water, noose, poison, or potion,\njust because someone reviled or rebuked you—\nbe it the Guru, be it the *Linga*, be it the *Jangama*,\nor be it Pashupati himself with the eye upon his forehead,\nthose bound by karma who forsake the body because companions saw and spoke harsh words\nshall be born in the womb of a swine for seven times seven births,\neat the filth of the hundred and one clans and eighteen castes,\nand keep watch at the threshold of the outcastes' house, O Lord—\nO Amugeshwaralinga, I swear by you and by your *Pramathas*.","hi":"डरो मत हे मन, पीछे मत हटो हे मन,\nठाने हुए हठ को मत छोड़ो हे मन।\nतिरस्कार किया कहकर, डाँटा-फटकारा कहकर,\nशस्त्र, समाधि, जल, फंदे, विष या औषधि से देह का त्याग मत करो।\nचाहे गुरु हो, चाहे लिंग हो, चाहे जंगम हो,\nचाहे ललाट पर नेत्र रखनेवाला पशुपति ही क्यों न हो,\nअंतरंग जनों ने देखकर कठोरता से कहा—यह सोचकर देह त्यागनेवाले कर्मी\nसात-सात जन्मों में सूकर के पेट में जन्म लेकर,\nएक सौ एक कुल और अठारह जातियों का अमेध्य खाकर,\nअछूतों के घर की देहलीज़ की रखवाली करते रहेंगे,\nहे अमुगेश्वरलिंग, आपकी सौगंध, आपके प्रमथों की सौगंध।","mr":"घाबरू नकोस हे मना, मागे हटू नकोस हे मना,\nधरलेला निर्धार सोडू नकोस हे मना.\nनिंदा केली म्हणून, दटावले म्हणून,\nशस्त्र, समाधी, पाणी, फास, विष किंवा औषधाने देहघट सोडू नकोस.\nगुरू असो, लिंग असो, जंगम असो,\nकपाळावर डोळा असलेला पशुपती असो—\nजवळच्यांनी पाहून टोचून बोलले म्हणून देहघट सोडणारे कर्मी\nसात-सात जन्मांत डुकराच्या पोटी जन्मून,\nएकशे एक कुळे आणि अठरा जातींची विष्ठा खाऊन,\nमहारवाड्यातील घराचा उंबरठा राखत बसतील, हे प्रभो!\nहे अमुगेश्वरलिंगा, तुमची शपथ, तुमच्या प्रमथांची शपथ.","fr":"Ne crains pas, ô esprit, ne recule pas, ô esprit,\nne renonce pas à la détermination que tu as prise, ô esprit.\nSans abandonner ce corps par l'arme, le *samadhi*, l'eau, la corde, le poison ou les drogues,\nparce que l'on t'a raillé ou parce que l'on t'a réprimandé —\nqu'il s'agisse du *Guru*, du *Linga*, du *Jangama*,\nou même de Pashupati qui porte un œil sur le front —\nles misérables liés par leurs actes qui abandonnent leur corps\nparce que des proches, les ayant vus, leur ont parlé durement,\nnaîtront durant sept fois sept vies dans le ventre d'une truie,\nmangeront les immondices des cent un clans et des dix-huit castes,\net monteront la garde au seuil de la maison des intouchables, ô Seigneur !\nÔ Amugeshwaralinga, je le jure par vous et par vos *Pramathas* !","te":"భయపడకు ఓ మనసా, వెనుకంజ వేయకు ఓ మనసా,\nపట్టిన పట్టుదలను విడవకు ఓ మనసా.\nనిందించారని, గద్దించారని\nశస్త్రం, సమాధి, నీరు, ఉరి, విషం, ఔషధాలతో దేహాన్ని విడవకు.\nగురువైనా, లింగమైనా, జంగమమైనా,\nనొసట కన్నున్న పశుపతియైనా సరే,\nసన్నిహితులు చూసి నొక్కి పలికారన్న కారణంతో దేహాన్ని విడిచే కర్మిష్ఠులు\nఏడేడు జన్మలలో సూకరం కడుపున పుట్టి,\nనూటొక్క కులాల, పద్దెనిమిది జాతుల అమేధ్యాన్ని తిని\nమాలల ఇంటి గడపను కాచుకొని ఉంటారు సుమా,\nఓ అముగేశ్వరలింగమా, మీ ఒట్టు, మీ ప్రమథుల ఒట్టు.","kn":"ಹೆದರದಿರು ಮನವೆ, ಹಿಮ್ಮೆಟ್ಟದಿರು ಮನವೆ,\n ಹಿಡಿದ ಛಲವ ಬಿಡದಿರು ಮನವೆ.\n ಜರಿದರೆಂದು ಝಂಕಿಸಿದರೆಂದು\n ಶಸ್ತ್ರ ಸಮಾಧಿ ನೀರು ನೇಣು ವಿಷ ಔಷಧದಲ್ಲಿ ಘಟವ ಬಿಡದೆ,\n ಗುರುವಾಡದು ಲಿಂಗವಾದಡು ಜಂಗಮವಾದಡು\n ನೊಸಲಲ್ಲಿ ಕಣ್ಣುಳ್ಳ ಪಶುಪತಿಯಾದಡು\n ತೆತ್ತಿಗರು ಕಂಡು ಒತ್ತಿ ನುಡಿದರೆಂದು ಘಟವ ಬಿಡುವ ಕರ್ಮಿಗಳು\n ಏಳೇಳು ಜನ್ಮದಲ್ಲಿ ಸೂಕರನ ಹೊಟ್ಟೆಯಲ್ಲಿ ಹುಟ್ಟಿ,\n ನೂರೊಂದು ಕುಲ ಹದಿನೆಂಟು ಜಾತಿಯ ಅಮೇಧ್ಯವ ತಿಂದು\n ಹೊಲೆಯರ ಮನೆಯ ಹೊಸ್ತಿಲ ಕಾಯ್ದುಕೊಂಡಿಪ್ಪರಯ್ಯ,\n ಅಮುಗೇಶ್ವರಲಿಂಗವೆ, ನಿಮ್ಮಾಣೆ ನಿಮ್ಮ ಪ್ರಮಥರಾಣೆ."},"m":{"en":"This Vachana strongly urges the mind to remain fearless, steadfast, and unwavering in its chosen spiritual resolve, regardless of external criticism, ridicule, or intimidation.\n\nIt unequivocally condemns the act of ending one's physical life—whether by weapons, self-burial, drowning, hanging, or poison—merely because one is rebuked or pressured by close associates, even if such harsh words come from the Guru, Linga, Jangama, or the forehead-eyed Pashupati himself.\n\nThe Vachana declares that those who cowardly abandon their body out of fear or humiliation are deluded individuals who suffer the most degraded existence across lifetimes, figuratively described as being reborn as swine feeding on the filth of all castes and guarding the thresholds of outcastes.\n\nAddressed to the Formless Supreme Reality through the ankitanama Amugeshwaralinga and sworn in the name of the Pramathas, the Vachana upholds the sanctity of human life and insists that a true seeker must face social and spiritual trials with unyielding courage rather than escaping through self-destruction.","hi":"इस वचन का केंद्रीय संदेश यह है कि मनुष्य को किसी भी परिस्थिति में भयभीत होकर अपने संकल्प से पीछे नहीं हटना चाहिए और अपने ग्रहण किए हुए दृढ़ निश्चय का त्याग नहीं करना चाहिए।\n\nचाहे गुरु हों, निराकार परमतत्त्व के साकार प्रतीक स्वरूप लिंग हों, आध्यात्मिक ज्ञान का प्रसार करने वाले प्रबुद्ध जंगम हों, या फिर पौराणिक संदर्भ के ललाट पर नेत्र रखने वाले पशुपति ही क्यों न हों, अथवा किसी अपने या पराए की निंदा, फटकार और कटु वचनों के दबाव में आकर जीवन से पलायन करना पूर्णतः अनुचित है।\n\nजो अज्ञानी लोग ऐसी आलोचनाओं से घबराकर शस्त्र, जीवित समाधि, जल, फंदे, विष या औषधि के माध्यम से अपने शरीर का त्याग (आत्महत्या) कर लेते हैं, वे घोर पतन के भागी बनते हैं।\n\nअमुगेश्वरलिंग के रूप में निराकार परम सत्य और प्रथम गणों की सौगंध खाकर यह वचन स्पष्ट करता है कि इस प्रकार देह त्यागने वाले लोग अत्यंत नीच और तिरस्कृत स्थिति को प्राप्त होते हैं, इसलिए मानव जीवन में आने वाली चुनौतियों का डटकर सामना करना ही सच्चा मार्ग है।","mr":"हे वचन साधकाला आपल्या मनाचे धैर्य टिकवून ठेवण्याचे, कोणत्याही संकटाने मागे न हटण्याचे आणि घेतलेला सत्यनिष्ठेचा वसा कधीही न सोडण्याचे आवाहन करते.\n\nकोणी निंदा केली किंवा धमकावले म्हणून शस्त्र, जिवंत समाधी, पाणी, गळफास किंवा विषाचा आश्रय घेऊन आपला देह त्यागू नये, असे हे वचन ठामपणे सांगते.\n\nगुरु, निराकार परमतत्त्वाचे प्रतीक असलेले लिंग, आध्यात्मिक ज्ञान देणारे जंगम किंवा खुद्द कपाळावर डोळा असलेला पशुपती जरी समोर आला, अथवा जवळच्या लोकांनी कितीही कठोर व जाचक शब्द बोलले, तरी खचून जाऊन जीव देणाऱ्या भ्याड प्रवृत्तीचा येथे तीव्र निषेध केला आहे.\n\nप्रतिकूल परिस्थितीला शरण जाऊन स्वतःचा देह संपवणे हे अमुगेश्वरलिंग या परमतत्त्वाच्या आणि प्रमथांच्या साक्षीने अत्यंत नीच व अधोगतीकडे नेणारे कृत्य मानले गेले असून, जीवनातील आव्हानांना निर्भयपणे आणि अढळ निष्ठेने सामोरे जाणे हाच खरा शरणधर्म आहे, हे यातून स्पष्ट होते.","fr":"Ce vachana exhorte l'esprit à demeurer inébranlable, à ne jamais céder à la peur ou au découragement, et à préserver fermement sa détermination spirituelle face aux critiques, aux mépris ou aux réprimandes.\n\nIl condamne avec rigueur toute tentative de mettre fin à ses jours — que ce soit par les armes, l'enterrement rituel en samadhi, la noyade, la pendaison, le poison ou les drogues — par simple désespoir ou sous le poids du jugement d'autrui.\n\nCette fermeté intérieure doit subsister même si les reproches émanent du Guru, du Linga, du Jangama, de Pashupati doté de l'œil frontal, ou encore des compagnons spirituels les plus proches.\n\nEn prenant à témoin la Réalité suprême invoquée sous le nom d'Amugeshwaralinga ainsi que les Pramathas, le texte affirme avec force que ceux qui abandonnent lâchement leur corps sous la pression sociale ou spirituelle s'exposent à la plus vile des déchéances morales et existentielles.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన సందేశం ఏమిటంటే, మనస్సు ఎటువంటి పరిస్థితులలోనూ భయపడకుండా, వెనుకంజ వేయకుండా, తాను చేపట్టిన దృఢమైన సంకల్పాన్ని విడిచిపెట్టకుండా నిలబడాలి.\n\nఎవరైనా నిందించారని లేదా బెదిరించారని ఆవేశపడి ఆయుధం, సజీవ సమాధి, నీరు, ఉరి, విషం లేదా మందుల ద్వారా తమ శరీరాన్ని విడిచిపెట్టే పిరికితనానికి పాల్పడకూడదు.\n\nసాక్షాత్తు గురువు, నిరాకార పరమతత్త్వానికి ప్రతీకయైన లింగం, ఆధ్యాత్మిక మార్గదర్శియైన జంగముడు, లేదా నుదుట కన్నున్న పశుపతియే ఎదురుగా నిలిచినా సరే, సన్నిహితులు లేదా ఇతరులు ఒత్తిడితో అన్న మాటలకు లొంగి ప్రాణాలు విడిచే కర్మిష్ఠుల పట్ల ఇందులో తీవ్రమైన నిరసన వ్యక్తమవుతోంది.\n\nఅಮುగేశ్వరలింగ అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని, ప్రమథులను సాక్షిగా నిలుపుతూ, అటువంటి ఆత్మహత్యా ప్రవృత్తి కలిగిన వారు ఏడేడు జన్మల పాటు పంది కడుపున పుట్టి, నూరొక్క కులాలు మరియు పద్దెనిమిది జాతుల మలాన్ని తింటూ, అత్యంత నీచమైన స్థితిలో గడపవలసి వస్తుందని ఈ వచనం తీవ్రంగా హెచ్చరిస్తోంది.","kn":"ಬದುಕಿನ ಕಷ್ಟಗಳಿಗೆ ಅಥವಾ ಇತರರ ನಿಂದನೆಗಳಿಗೆ ಹೆದರಿ ಮನಸ್ಸು ಕುಗ್ಗಬಾರದು, ಹಿಂದೆ ಸರಿಯಬಾರದು ಮತ್ತು ತಾನು ಹಿಡಿದ ಸತ್ಯದ ಛಲವನ್ನು ಎಂದಿಗೂ ಬಿಡಬಾರದು ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ.\n\nಯಾರೋ ಹೀಯಾಳಿಸಿದರು ಅಥವಾ ಗದರಿಸಿದರು ಎಂಬ ಕಾರಣಕ್ಕೆ ಶಸ್ತ್ರದಿಂದಲೋ, ಜೀವಂತ ಸಮಾಧಿಯಿಂದಲೋ, ನೀರಿಗೆ ಬಿದ್ದೋ, ನೇಣು ಹಾಕಿಕೊಂಡೋ ಅಥವಾ ವಿಷ ಕುಡಿದೋ ದೇಹವನ್ನು ಕಳೆದುಕೊಳ್ಳುವ ಆತ್ಮಹತ್ಯೆಯ ದಾರಿ ಹಿಡಿಯಬಾರದು ಎಂದು ಇಲ್ಲಿ ಸ್ಪಷ್ಟವಾಗಿ ಎಚ್ಚರಿಸಲಾಗಿದೆ.\n\nಅಷ್ಟೇ ಅಲ್ಲದೆ, ಅರಿವನ್ನು ನೀಡುವ ಗುರುವಾಗಲಿ, ನಿರಾಕಾರ ತತ್ತ್ವದ ಕುರುಹಾದ ಲಿಂಗವಾಗಲಿ, ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರಾದ ಜಂಗಮರಾಗಲಿ, ಹಣೆಯಲ್ಲಿ ಕಣ್ಣಿರುವ ಪಶುಪತಿಯೇ ಆಗಲಿ ಅಥವಾ ಆಪ್ತರು ಒತ್ತಾಯಿಸಿ ಕಠಿಣವಾಗಿ ಮಾತನಾಡಿದರು ಎಂದಾಗಲಿ ಬೇಸತ್ತು ಪ್ರಾಣ ಕಳೆದುಕೊಳ್ಳುವುದು ಶರಣ ತತ್ತ್ವಕ್ಕೆ ವಿರುದ್ಧವಾದ ಹೀನ ಕಾರ್ಯವಾಗಿದೆ.\n\nಹೀಗೆ ಹೇಡಿತನದಿಂದ ದೇಹವನ್ನು ಬಿಡುವವರು ಮುಂದೆ ಹಲವು ಜನ್ಮಗಳಲ್ಲಿ ಹಂದಿಯಾಗಿ ಹುಟ್ಟಿ, ಎಲ್ಲ ಜಾತಿ-ಕುಲಗಳ ಹೊಲಸನ್ನು ತಿನ್ನುತ್ತಾ, ಕೀಳು ಸ್ಥಿತಿಯಲ್ಲಿ ಬಾಗಿಲು ಕಾಯುವಂತಹ ಅತ್ಯಂತ ನಿಕೃಷ್ಟ ಪಾಡಿಗೆ ಗುರಿಯಾಗುತ್ತಾರೆ ಎಂದು ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಅಮುಗೇಶ್ವರಲಿಂಗ ಮತ್ತು ಪ್ರಮಥರ ಆಣೆಯಿಟ್ಟು ಆತ್ಮಹತ್ಯೆಯನ್ನು ಕಠಿಣವಾಗಿ ಖಂಡಿಸಲಾಗಿದೆ."}},{"no":1290,"o":"ಹೊನ್ನ ಬಿಟ್ಟಡೇನು, ಹೆಣ್ಣ ಬಿಟ್ಟಡೇನು, ಮಣ್ಣ ಬಿಟ್ಟಡೇನು,\n ವಿರಕ್ತನಾಗಬಲ್ಲನೆ?\n ಆದ್ಯರ ವಚನಂಗಳ ಹತ್ತುಸಾವಿರವ ಲೆಕ್ಕವಿಲ್ಲದೆ ಓದಿದಡೇನು,\n ನಿತ್ಯನಾಗಬಲ್ಲನೆ?\n ಮಂಡೆಯ ಬೋಳಿಸಿಕೊಂಡು ಅಂದಚಂದಕೆ ತಿರುಗುವ\n ಜಗಭಂಡರ ಮೆಚ್ಚುವನೆ, ಅಮುಗೇಶ್ವರಲಿಂಗವು?","t":{"en":"What if he gives up gold, what if he gives up woman, what if he gives up land—\ncan he become truly detached?\nWhat if he reads ten thousand Vachanas of the ancient ones without count—\ncan he become eternal?\nHaving shaved their heads and wandering about for outward show,\nwill Amugeshwaralinga ever be pleased with such shameless frauds of the world?","hi":"सोना छोड़ देने से क्या, स्त्री छोड़ देने से क्या, मिट्टी छोड़ देने से क्या,\nक्या वह विरक्त हो सकता है?\nआद्यों के दस हज़ार वचनों को अनगिनत बार पढ़ने से क्या,\nक्या वह नित्य हो सकता है?\nसिर मुँड़ाकर सज-धज के लिए घूमनेवाले\nजग के पाखंडियों को क्या अमुगेश्वरलिंग पसंद करेंगे?","mr":"सोने सोडले तर काय, स्त्री सोडली तर काय, जमीन सोडली तर काय,\nतो विरक्त होऊ शकेल का?\nआद्यांची दहा हजार वचने अगणित वेळा वाचली तर काय,\nतो नित्य होऊ शकेल का?\nडोके मुंडून घेऊन डौलाने फिरणाऱ्या\nजगभंडांना पसंती देईल का, अमुगेश्वरलिंग?","fr":"Qu'importe s'il renonce à l'or, qu'importe s'il renonce à la femme, qu'importe s'il renonce à la terre,\npeut-il devenir un renonçant ?\nQu'importe s'il lit sans compter dix mille Vachanas des anciens maîtres,\npeut-il devenir éternel ?\nCes effrontés du monde qui se rasent le crâne et errent pour la parade,\nAmugeshwaralinga les approuvera-t-il ?","te":"బంగారాన్ని విడిచిపెడితేనేమి, స్త్రీని విడిచిపెడితేనేమి, భూమిని విడిచిపెడితేనేమి,\nవిరక్తుడు కాగలడా?\nఆద్యుల వచనాలను పదివేలైనా లెక్కలేకుండా చదివితేనేమి,\nనిత్యుడు కాగలడా?\nతల గొరిగించుకొని అందచందాలకై తిరిగే\nజగభండులను మెచ్చునా, అముగేశ్వరలింగము?","kn":"ಹೊನ್ನ ಬಿಟ್ಟಡೇನು, ಹೆಣ್ಣ ಬಿಟ್ಟಡೇನು, ಮಣ್ಣ ಬಿಟ್ಟಡೇನು,\n ವಿರಕ್ತನಾಗಬಲ್ಲನೆ?\n ಆದ್ಯರ ವಚನಂಗಳ ಹತ್ತುಸಾವಿರವ ಲೆಕ್ಕವಿಲ್ಲದೆ ಓದಿದಡೇನು,\n ನಿತ್ಯನಾಗಬಲ್ಲನೆ?\n ಮಂಡೆಯ ಬೋಳಿಸಿಕೊಂಡು ಅಂದಚಂದಕೆ ತಿರುಗುವ\n ಜಗಭಂಡರ ಮೆಚ್ಚುವನೆ, ಅಮುಗೇಶ್ವರಲಿಂಗವು?"},"m":{"en":"This Vachana explains that mere physical abandonment of wealth, women, and land does not make a person truly detached.\n\nSimilarly, mechanically reading tens of thousands of Vachanas composed by the ancient Sharanas (Adyas) cannot in itself lead one to eternal spiritual realization.\n\nThrough these pointed rhetorical questions, the Vachana critiques the hypocrisy of outward asceticism and superficial scriptural scholarship that lack genuine inner transformation.\n\nThe Formless Supreme Consciousness, addressed here as Amugeshwaralinga, does not approve of such worldly pretenders who merely shave their heads and wander about for outward show.","hi":"इस वचन का केंद्रीय भाव यह है कि केवल बाहरी रूप से धन, स्त्री या भूमि का त्याग कर देने मात्र से कोई मनुष्य सच्चा विरक्त नहीं हो सकता।\n\nइसी प्रकार, बिना आंतरिक बोध के आद्य शरणों के दस हजार या अनगिनत वचनों का केवल पाठ कर लेने से कोई शाश्वत सत्य में स्थित नहीं हो सकता।\n\nयह वचन स्पष्ट करता है कि सिर मुंडवाकर केवल दिखावे और आडंबर के लिए इधर-उधर भटकने वाले पाखंडियों को निराकार परमतत्त्व अमुगेश्वरलिंग कभी स्वीकार नहीं करता।\n\nइसका आध्यात्मिक महत्त्व यह है कि सच्ची विरक्ति और आध्यात्मिकता बाहरी त्याग, कोरे शास्त्र-पठन या भेष बदलने में नहीं, बल्कि आंतरिक शुद्धता और वास्तविक आचरण में निहित है।","mr":"हे वचन स्पष्ट करते की केवळ बाह्य स्वरूपात सोने, स्त्री आणि भूमी यांचा त्याग केल्याने मनुष्य खऱ्या अर्थाने विरक्त होऊ शकत नाही.\n\nत्याचप्रमाणे, पूर्वसुरींच्या दहा हजार वचनांचे केवळ संख्यात्मक आणि यांत्रिक पठण केल्याने कोणालाही शाश्वत सत्याची प्राप्ती होत नाही.\n\nअशाप्रकारे अंतर्मनात कोणतेही परिवर्तन न घडवता केवळ डोक्याचे मुंडन करून दिमाखाने फिरणाऱ्या ढोंगी व निर्लज्ज लोकांचे आचरण निरर्थक आहे.\n\nअसे पोकळ बाह्य प्रदर्शन आणि ढोंगीपणा अमुगेश्वरलिंग या परमतत्त्वाला कधीही मान्य होत नाही, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que le renoncement purement extérieur à la richesse, aux désirs charnels et aux terres ne suffit pas à engendrer un véritable détachement intérieur.\n\nDe même, la lecture mécanique et innombrable des milliers de vachanas composés par les anciens sages ne saurait à elle seule conduire à la réalisation de l'éternel.\n\nLe texte dénonce avec vigueur l'hypocrisie de ceux qui se rasent la tête pour se donner l'apparence d'ascètes et errent par simple vanité mondaine.\n\nLa Réalité suprême sans forme, invoquée sous la signature spirituelle Amugeshwaralinga, ne saurait apprécier de tels imposteurs dépourvus de sincérité intérieure.","te":"ఈ వచనంలోని ప్రధాన ఆशयం ఏమిటంటే, కేవలం బంగారం, స్త్రీ, భూమి అనే ప్రాపంచిక విషయాలను బాహ్యంగా విడిచిపెట్టినంత మాత్రాన ఎవరూ నిజమైన విರక్తులు కాలేరు.\n\nఅలాగే, పూర్వ శరణుల వచనాలను పదివేల సంఖ్యలో లెక్కలేనన్ని సార్లు వల్లెవేసినంత మాత్రాన మనిషి శాశ్వతమైన పరమసత్యాన్ని పొందలేడు.\n\nతల గొరిగించుకుని, సన్యాసి వేషంతో ఆడంబరంగా ఊరూరా తిరిగే లోక వంచకులను అముగేశ్వరలింగ అనే నిరాకార పరమచైతన్యం ఎన్నటికీ మెచ్చదని ఈ వచనం స్పష్టం చేస్తోంది.\n\nఆంతరంగికమైన చిత్తశుద్ధి లేని బాహ్య త్యాగాలు, గ్రంథ పఠనాలు, కపట వేషధారణలు ఆధ్యాత్మిక పథంలో నిరర్థకమైనవని దీని అంతరార్థం.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕೇವಲ ಹೊರಗಿನ ಬದುಕಿನಲ್ಲಿ ಹಣ, ಹೆಣ್ಣು ಮತ್ತು ಆಸ್ತಿ-ಪಾಸ್ತಿಗಳನ್ನು ಬಿಟ್ಟ ಮಾತ್ರಕ್ಕೆ ಒಬ್ಬ ಮನುಷ್ಯ ನಿಜವಾದ ವಿರಕ್ತನಾಗಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\nಅದೇ ರೀತಿ, ಹಿರಿಯ ಶರಣರ ಸಾವಿರಾರು ವಚನಗಳನ್ನು ಬರೀ ಬಾಯಿಪಾಠ ಮಾಡಿ ಓದಿದಷ್ಟಕ್ಕೇ ಯಾರೂ ಅಳಿವಿಲ್ಲದ ಪರಮಸತ್ಯದ ಅರಿವನ್ನು ಪಡೆದು ಶಾಶ್ವತರಾಗಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\nಮನಸ್ಸಿನಲ್ಲಿ ಪರಿವರ್ತನೆಯಾಗದೆ, ಕೇವಲ ತಲೆ ಬೋಳಿಸಿಕೊಂಡು ಹೊರಗಿನ ವೇಷಭೂಷಣಗಳಿಂದ ಜನರ ಮುಂದೆ ಚಂದವಾಗಿ ತಿರುಗಾಡುವ ನಾಟಕೀಯ ವ್ಯಕ್ತಿಗಳನ್ನು ವಚನವು 'ಜಗಭಂಡರು' ಎಂದು ಕರೆಯುತ್ತದೆ.\n\nಒಳಗಿನ ಅರಿವು ಮತ್ತು ನೈಜ ಆಚರಣೆಯಿಲ್ಲದ ಇಂತಹ ತೋರಿಕೆಯ ಡಾಂಭಿಕರನ್ನು ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಅಮುಗೇಶ್ವರಲಿಂಗವು ಎಂದಿಗೂ ಒಪ್ಪುವುದಿಲ್ಲ ಎಂಬುದೇ ಈ ವಚನದ ಸ್ಪಷ್ಟ ನಿಲುವಾಗಿದೆ."}}]},
