const ABT={b:`<h3>Guru Basavanna (1105–1167 CE)</h3><img class="pic sv" src="${IMG1}" alt="Guru Basavanna">
<p>Guru Basavanna was a visionary 12th-century philosopher, statesman, mystic poet, and social reformer from Karnataka who founded the Lingayat tradition. Born into an orthodox Brahmin family in Ingaleshwar-Bagevadi to Madiraja and Madalambike, he discarded ritual dogma and the sacred thread in youth, pursuing spiritual realization at Kudalasangama before serving as prime minister under Kalachuri King Bijjala II at Kalyana.</p>
<p>To democratize spirituality, Basavanna introduced the Ishtalinga—a personal, wearable icon of the formless divine that guided seekers along the sixfold Shatsthala path, advancing from initial devotion (Bhakti) to absolute union (Aikya).</p>
<p>At Kalyana, he established the Anubhava Mantapa, an egalitarian spiritual parliament where seekers of all castes and genders deliberated freely. His movement championed honest labor as heaven (Kayakave Kailasa), dedicated distribution of resources (Dasoha), the complete eradication of caste and gender hierarchies, and the power of simple Kannada poetry (Vachanas) dedicated to Kudalasangamadeva.</p>
<p>Orthodox resistance to an inter-caste marriage among the Sharanas eventually ignited the turbulent Kalyana Revolution. Pained by the conflict, Basavanna left for Kudalasangama, where he attained Aikya in 1167 CE.</p>
<p>In the aftermath, the Sharanas fought courageously during a perilous migration to Ulavi to protect and preserve their palm-leaf Vachana manuscripts for future generations.</p>`,t:`<h3>Core Tenets of Basava Philosophy</h3><p>Basava philosophy is structured around foundational frameworks designed to elevate the individual spiritually while establishing an egalitarian, ethical society.</p><h4>1. Ashtavarana (The Eight Shields)</h4><p>The eight protective spiritual shields that safeguard the practitioner (Sharana) on the path of inner discipline and devotion:</p><ul><li><b>Guru:</b> The spiritual guide who initiates the seeker and imparts divine wisdom.</li><li><b>Linga:</b> The Ishtalinga, worn on the chest as the concrete symbol of the formless supreme reality.</li><li><b>Jangama:</b> The wandering mystic or ascetic who serves society and personifies dynamic spiritual wisdom.</li><li><b>Padodaka:</b> The sanctified water received from the Guru, Linga, or Jangama, symbolizing internal purification.</li><li><b>Prasada:</b> The consecrated food or grace received with humility, freeing the seeker from physical cravings.</li><li><b>Vibhuti:</b> The sacred ash applied on the body, signifying purity, detachment, and the impermanence of worldly life.</li><li><b>Rudraksha:</b> The sacred bead worn as an aid to constant divine remembrance and mental composure.</li><li><b>Mantra:</b> The five-syllable sacred invocation (Panchakshari), recited to anchor the mind in constant communion.</li></ul><h4>2. Panchachara (The Five Codes of Conduct)</h4><p>The five moral and social pillars governing daily ethical living and civic responsibility:</p><ul><li><b>Lingachara:</b> Single-minded devotion to the personal Ishtalinga; rejection of all polytheistic and temple-centric mediation.</li><li><b>Sadachara:</b> Pure moral conduct, honest living, non-violence, truthfulness, and non-exploitation of others.</li><li><b>Shivachara:</b> Universal equality; viewing every human being as a manifestation of the divine without discrimination based on caste, creed, or gender.</li><li><b>Bhrityachara:</b> Absolute humility; conducting oneself as a humble servant to the community and fellow seekers.</li><li><b>Ganachara:</b> Righteous moral courage; taking a firm, collective stand against social injustice, dogma, and untruth.</li></ul><h4>3. Shatsthala (The Six Spiritual Stages)</h4><p>The sixfold progressive ascent of the soul (Anga) toward complete non-dual union with the divine (Linga):</p><ul><li><b>Bhakti Sthala:</b> The stage of pure devotion and reverence through the worship of the Ishtalinga.</li><li><b>Mahesha Sthala:</b> Steadfast moral discipline, unshakeable resolve, and ethical commitment.</li><li><b>Prasada Sthala:</b> Calm selflessness, viewing everything experienced as an offering of divine grace.</li><li><b>Pranalinga Sthala:</b> Internalization, realizing the Linga not merely as an external icon but as one’s vital life-breath.</li><li><b>Sharana Sthala:</b> Surrender and intuitive communion; experiencing the divine within every aspect of consciousness.</li><li><b>Aikya Sthala:</b> The pinnacle of spiritual evolution; complete, seamless merger of the individual self into absolute divinity.</li></ul><h4>4. Foundational Socio-Ethical Tenets</h4><p>The practical everyday principles that made the movement a social revolution:</p><ul><li><b>Kayaka:</b> Kayakave Kailasa—Honest, productive labor is divine worship in itself. No legitimate work is superior or inferior.</li><li><b>Dasoha:</b> Dedicated communal sharing without ego. What is earned through Kayaka is distributed back to society to serve the needy and the community.</li><li><b>Dehave Devalaya:</b> The physical body itself is the true, living temple; static stone structures are secondary (Sthavarakku alivundu, Jangamakku alivilla).</li><li><b>Anubhava:</b> Direct personal mystical experience validated through rational communal reflection, superseding blind scriptural dogma.</li><li><b>Saptashila (The Seven Moral Vows):</b> Basavanna’s concise code of ethics outlined in his celebrated Vachana: do not steal, do not kill, do not lie, do not lose your temper, do not despise others, do not praise yourself, and do not scorch others with your words.</li></ul>`,s:`<h3>Basava Samithi</h3><img class="pic bd" src="${IMG2}" alt="Basava Samithi building"><img class="logo emb" src="${LOGO}" alt="Basava Samithi emblem">
<p>Basava Samithi is a non-profit socio-cultural and educational organization headquartered at Basava Bhavan in Bengaluru. Founded in 1964 by the former Vice President of India, Dr. B. D. Jatti, the institution has been running successfully for over six decades, dedicated to preserving, researching, and disseminating the philosophy of Jagadjyothi Basaveshwara and the 12th-century Sharanas.</p>
<p>Under the leadership of its current President, Dr. Aravind Jatti, the Samithi has expanded its global presence and modernized its outreach. It works actively across several key areas:</p>
<ul><li><b>Vachana Translation &amp; Publications:</b> Publishing authentic compilations and translating Kannada Vachana literature into major Indian and international languages to make Sharana philosophy universally accessible.</li>
<li><b>Research and Academic Initiatives:</b> Organizing national and international seminars, symposiums, endowment lectures, and research projects on Lingayat thought, comparative philosophy, and democratic traditions.</li>
<li><b>Promoting Core Humanist Values:</b> Propagating foundational Sharana principles, including Kayaka (the dignity of honest labor), Dasoha (selfless community service and sharing), caste and gender equality, and social justice.</li>
<li><b>Global Network &amp; Cultural Centers:</b> Operating active branch centers across India and overseas, spearheading Basava Jayanti celebrations, youth workshops, and digital initiatives to connect newer generations with Vachana heritage.</li></ul><img class="cir" src="${IMG3}" alt="Dr. Aravind Jatti"><p class="cap"><b>Dr. Aravind Jatti</b><br>President, Basava Samithi</p>`};

const DISCOVERY={"categories":{"Emotions & Mental States":{"tags":[{"name":"Restlessness","ids":[60],"why":"The speaker describes a mind that will not remain still, moving from one place or state to another.","quote":"A mind that runs in every direction struggles to recognise the peace already within."},{"name":"Mental Agitation","ids":[60,490],"why":"The mind's rapid and uncontrolled movement creates intense inner disturbance and prevents composure.","quote":"When thoughts keep racing, even a quiet place cannot give the mind rest."},{"name":"Resentment","ids":[62],"why":"The speaker admits resentment toward the Sharanas and recognises that this feeling diminishes the quality of devotion.","quote":"Resentment within the heart can weaken the devotion we profess."},{"name":"Fear","ids":[498,1289],"why":"The Vachana questions becoming a devotee merely out of fear of death, showing that fear alone cannot provide spiritual freedom.","quote":"Fear may drive us toward refuge, but it cannot by itself transform us."},{"name":"Righteous Anger","ids":[499,1299],"why":"The Vachana describes anger arising in the minds of Shiva Sharanas and being directed toward slanderers, rather than presented as indiscriminate rage.","quote":"Not every fire is born of hatred; some rises to confront falsehood."},{"name":"Equanimity","ids":[904,1293],"why":"The Vachana describes a Sharana who bears neither anger nor elation toward all living beings.","quote":"Inner freedom begins when neither anger nor excitement rules the heart."},{"name":"Worldly Desire","ids":[907,911,1171,1172,1282,1293,1298,1389],"why":"The Vachana insists that worldly craving must cease for devotion to become genuine rather than performative.","quote":"The heart cannot be wholly devoted while every desire pulls it elsewhere."},{"name":"Delusion","ids":[492,908,914,1008,1718],"why":"The opening line describes the Sharana as undeluded in Shivayoga and free from wavering between resolve and doubt.","quote":"Clarity begins when illusion no longer speaks in the voice of truth."},{"name":"Lust","ids":[909,1179],"why":"The Vachana directly condemns desire directed toward another person's spouse as incompatible with devotion.","quote":"Desire can undo in a moment the reverence we practise for years."},{"name":"Inner Serenity","ids":[911,1006],"why":"The Vachana defines true virtue as the mind abiding in the Supreme and becoming firmly established in inner serenity.","quote":"True serenity arrives when the mind finds a place where it no longer needs to wander."}]},"Spirituality & Existence":{"tags":[{"name":"Spiritual Longing","ids":[60],"why":"The speaker longs to overcome the mind's turbulence and attain union with the Divine.","quote":"The search for union begins with the honest recognition of our inner restlessness."},{"name":"Divine Oneness","ids":[61,916,1010,1714,1715],"why":"The Vachana directly declares that the Divine is one and rejects the idea of multiple independent gods.","quote":"Truth does not multiply when we give it many names."},{"name":"Devotion","ids":[62,491,496,500,906,910,917,1004,1177,1178,1180,1286,1295,1386],"why":"The Vachana reflects on the completeness of devotion by contrasting the endurance of earlier devotees with the speaker's own failing.","quote":"Devotion deepens when reverence remains even in moments of personal discomfort."},{"name":"Inner Receptivity","ids":[63],"why":"The Vachana points to the inward readiness required to perceive and respond to the spiritual path.","quote":"Wisdom begins when the inner self becomes ready to receive what it once missed."},{"name":"Self-Realisation","ids":[65,491,493,1001,1007,1010,1292,1381,1385,1389,1717],"why":"The Vachana links becoming a Sharana with recognising and awakening one's inner nature.","quote":"We come closer to truth when we recognise what has always been within."},{"name":"Forgetfulness","ids":[65,490],"why":"The contrast between awareness and forgetfulness warns against losing sight of the spiritual truth one has recognised.","quote":"What we forget within can matter more than what we gather outside."},{"name":"Divine Grace","ids":[491],"why":"The sanctifying power is attributed to the Divine presence, whose touch makes ordinary places and experiences sacred.","quote":"Grace changes not only where we stand, but how we experience all that surrounds us."},{"name":"Delusion","ids":[492,908,914,1008,1718],"why":"The Vachana identifies the notions of having seen, not seen, united or separated as delusive distinctions that must dissolve.","quote":"Sometimes the final illusion is believing that we have already reached the truth."},{"name":"Inner Experience","ids":[497,1717],"why":"The Vachana says that only one who tastes the bliss of Anubhava can know the subtle state in which Guheshwara abides.","quote":"Some truths cannot be displayed; they become clear only through lived experience."},{"name":"Unmanifest Reality","ids":[497,1387,1715],"why":"The fire within stone and the tree within the seed illustrate the subtle, concealed and unmanifest presence of ultimate reality.","quote":"Not everything real announces itself; some truths remain hidden until they are experienced."},{"name":"Karma","ids":[498,908],"why":"The Vachana explicitly asks whether devotion motivated only by fear can escape the consequences of karma.","quote":"Changing our outward appearance does not erase the consequences of our actions."},{"name":"Surrender","ids":[901,1174],"why":"Having recognised the Divine as the very source of sensory experience, the speaker no longer approaches it as a separate giver to be petitioned.","quote":"When separation disappears, prayer is no longer a request from one to another."},{"name":"Reward-Seeking","ids":[910,1281,1388],"why":"The Vachana explicitly identifies practitioners who observe rules, vows and renunciation while remaining attached to their fruits.","quote":"A spiritual act loses its freedom when the mind keeps counting its rewards."},{"name":"Spiritual Imitation","ids":[920,1003,1283,1287,1288,1380,1383],"why":"The Vachana criticises practices performed merely out of habit or by watching others, without spontaneity or genuine understanding.","quote":"Following a ritual is not the same as discovering the truth it was meant to awaken."},{"name":"Liberation","ids":[1001,1170,1172,1284,1298,1717],"why":"The Vachana explicitly says that the Guru severed the speaker's cycle of worldly existence.","quote":"Freedom begins when the source of our bondage is finally understood."},{"name":"Inner Bliss","ids":[1006],"why":"The Vachana declares pure, authentic bliss to be the true ornament of the Sharanas.","quote":"The finest ornament is an inner joy that no outward possession can provide."},{"name":"Worldly Detachment","ids":[1009,1170,1177,1178,1284,1287,1290,1293,1389,1390],"why":"The fish remains immersed in water without allowing it to enter its nostrils; similarly, the Sharana lives in the world without becoming inwardly entangled.","quote":"Be fully present in the world without letting the world take possession of your inner life."},{"name":"Divine Remembrance","ids":[1171,1716],"why":"The Vachana says that a body without remembrance of the Divine becomes vulnerable, like an unguarded home or kingdom.","quote":"Remembrance gives the inner life the strength that keeps it from being overrun."},{"name":"Inner Abundance","ids":[1291,1295,1297],"why":"The Vachana distinguishes bodily poverty from the inner abundance of a devotee sustained by the Divine.","quote":"A life may lack possessions and still be rich beyond measure."},{"name":"Spiritual Commitment","ids":[918,919,1004,1177,1180,1289,1294,1716],"why":"The cracked-pot metaphor shows that devotion without firmness cannot reach the Divine; steadfastness is essential.","quote":"Devotion needs steadiness, or its meaning leaks away like water from a broken vessel."},{"name":"Maya","ids":[499,1380],"why":"The Vachana names Maya as the deceptive force behind extreme outward practices that mislead seekers about the nature of spiritual attainment.","quote":"Not every path that looks spiritual leads beyond illusion."}]},"Self, Character & Personal Growth":{"tags":[{"name":"Religious Pride","ids":[61,1388],"why":"The opening warning criticises boastful speech about the number of gods, linking religious claims with pride.","quote":"Pride debates about the Divine; humility turns toward the truth."},{"name":"Forbearance","ids":[62,902],"why":"The speaker recalls devotees who endured severe suffering and ridicule, presenting endurance as a measure of devotion.","quote":"The depth of devotion is revealed by what the heart can endure without hatred."},{"name":"Ego","ids":[69,493,904,905,907,910,1174,1179,1281,1385],"why":"The Vachana's self-reproach identifies the ego's impulse to rank others as a source of inner suffering.","quote":"The ego seeks higher ground; wisdom learns to stand with everyone."},{"name":"Fortitude","ids":[902,1004,1289,1291,1390],"why":"The comparisons with a warrior and a steadfast person show that courage is known when one faces pressure or adversity.","quote":"Strength is not what we claim; it is what remains when we are tested."},{"name":"Spiritual Humility","ids":[904,1176,1282,1383],"why":"The Sharana remains hidden among true devotees and does not advertise spiritual status or identity to the world.","quote":"True humility does not need the world to notice its goodness."},{"name":"Sensory Discipline","ids":[906,909,917,1382],"why":"The Vachana describes the senses as being directed toward the Linga rather than moving independently toward self-centred enjoyment.","quote":"Freedom is not refusing to experience life, but transforming how we experience it."},{"name":"Integrated Virtue","ids":[912],"why":"The contrast between separate forms of virtue and Sanganabasavanna's Lingavanta state supports the idea of integrated spiritual character.","quote":"Growth is complete when goodness is no longer divided into separate performances."},{"name":"Self-Respect","ids":[917,1291],"why":"The consecrated hand of the Sharana is not stretched out to beg, expressing spiritual dignity and autonomy.","quote":"Dignity grows when we refuse to trade inner freedom for approval or favours."},{"name":"Spiritual Commitment","ids":[918,919,1004,1177,1180,1289,1294,1716],"why":"The Vachana states that separating from the Pranalinga entrusted to the mind and hand constitutes breaking one's vow.","quote":"Commitment is proven not by a promise, but by choosing faithfulness each day."},{"name":"Inner Transformation","ids":[1003,1170,1173,1175,1283,1285],"why":"The contrast between remembering past spiritual figures and actually becoming transformed highlights the need for personal change.","quote":"Borrowed inspiration matters only when it becomes a change in our own lives."}]},"Lingayat Philosophy & Sharana Teachings":{"tags":[{"name":"Spiritual Awareness","ids":[63,65,492,497,901,903,914,920,1007,1009,1171,1173,1285,1287,1288,1292,1300,1381,1384,1387,1714,1718],"why":"The sensory comparisons show that the spiritual path cannot be recognised without inner awareness and receptivity.","quote":"The path may be near, but awareness is what allows us to recognise it."},{"name":"Jangama","ids":[67,903,915,1002,1005,1175,1178,1300],"why":"The Jangama is the central subject of the Vachana, which demands equal reverence and service regardless of appearance.","quote":"True reverence sees the person, not the status suggested by their appearance."},{"name":"Spiritual Equality","ids":[68,1295],"why":"The Vachana places spiritual fellowship and worth above inherited caste status.","quote":"The worth of a seeker is measured by inner truth, not inherited rank."},{"name":"Non-duality","ids":[61,492,493,495,901,908,919,1005,1007,1008,1010,1174,1284,1292,1385,1387],"why":"The Vachana dissolves the assumed separation between seeing and not seeing, union and separation, affirming that there is no distance from Guheshwaralinga.","quote":"When separation is seen as an illusion, union is no longer a distant goal."},{"name":"Spiritual Companionship","ids":[494,905,916,1175,1180],"why":"The Vachana states that wisdom flourishes in the presence of accomplished elder Sharanas, making spiritual fellowship a condition for growth.","quote":"The company of the wise can become the ground in which our own wisdom grows."},{"name":"Ishtalinga","ids":[495,500,906,912,918,919,1002,1286,1381,1718],"why":"The Vachana explicitly traces the Linga from the palm to the mind and then throughout the seeker's entire being.","quote":"What begins as a symbol in the hand must become a living awareness throughout life."},{"name":"Samarasa","ids":[495],"why":"Samarasa is explicitly named as the state of harmonious, undivided union with Guheshwaralinga.","quote":"The deepest harmony begins when the idea of two dissolves."},{"name":"Maya","ids":[499,1380],"why":"The closing line invokes Maya and declares that the speaker is not a target of its striking, consuming force.","quote":"When illusion loses its hold, it can no longer define who we are."},{"name":"Spiritual Identity","ids":[900],"why":"The Vachana defines identity through one's spiritual orientation rather than conventional social categories.","quote":"What defines the seeker is not the label received at birth, but the path embraced."},{"name":"Shatsthala","ids":[903],"why":"The Vachana explicitly measures compromised religious practices against the true understanding of Shatsthala.","quote":"A spiritual path is fulfilled through lived truth, not merely through its name."},{"name":"Prasada","ids":[903],"why":"Prasada is explicitly named, with its sanctity or awareness described as lost through admixture.","quote":"What is received as sacred must also be treated with integrity."},{"name":"Shivayoga","ids":[908],"why":"Shivayoga is explicitly named as the state in which the Sharana remains undeluded and established in supreme bliss.","quote":"The deepest discipline is to remain inwardly free while living in the world."},{"name":"Divine Oneness","ids":[61,916,1010,1714,1715],"why":"The Vachana describes the presence of Sanga as transforming the devotee's body and dwelling into Linga itself.","quote":"When the sacred is realised within, no distant place can contain it."},{"name":"Spiritual Commitment","ids":[918,919,1004,1177,1180,1289,1294,1716],"why":"The Vachana insists that the seeker must remain connected with the threefold Linga rather than dismissing that bond as unnecessary.","quote":"A spiritual path asks for more than belief; it asks for an unbroken relationship with truth."},{"name":"Guru","ids":[1001,1002,1005,1179,1300,1384],"why":"After exhausting external searches in caves and mountains, the speaker recognises the Guru as the one who ends worldly bondage.","quote":"The search changes direction when the Guru reveals what wandering could never find."},{"name":"Unmanifest Reality","ids":[497,1387,1715],"why":"The Vachana describes the Supreme as beyond physical attributes, mythological imagery and worldly traces.","quote":"What is infinite cannot be contained by the images through which we try to describe it."},{"name":"Inner Experience","ids":[497,1717],"why":"Anubhava is described as the essential support that gives the body stability and meaning.","quote":"Experience turns spiritual ideas into a truth that can sustain a life."}]},"Knowledge, Learning & Wisdom":{"tags":[{"name":"Ignorance","ids":[63,1384,1715],"why":"The blind and deaf metaphors describe the inability to recognise spiritual truth despite external signs and sounds.","quote":"Truth can be present all around us and still remain unseen."},{"name":"Wisdom","ids":[494,902,915,1003,1009,1176,1280,1286,1290],"why":"The concluding comparison identifies the presence of realised Sharanas as the environment in which discernment and wisdom grow.","quote":"Wisdom grows most deeply where it is lived, not merely spoken."}]},"Society, Equality & Justice":{"tags":[{"name":"Social Inclusion","ids":[64,900],"why":"The repeated contrast between 'Who is he?' and 'He is ours' rejects exclusion and calls for acceptance.","quote":"A humane community begins when no one is treated as a stranger."},{"name":"Universal Brotherhood","ids":[64,1386],"why":"The image of belonging to one Divine household expresses kinship that extends beyond social divisions.","quote":"Our shared humanity grows stronger when belonging is offered without conditions."},{"name":"Caste Discrimination","ids":[66,68,900,1299],"why":"The Vachana directly criticises caste-based selection in marriage despite claims that caste distinctions have vanished.","quote":"A boundary upheld in private can undo the equality proclaimed in public."},{"name":"Non-discrimination","ids":[67,69],"why":"The Vachana rejects ranking Jangamas by clothing, appearance, or outward social status.","quote":"Do not measure a person's worth by the clothes they wear."},{"name":"Prejudice","ids":[69,915,1176,1390],"why":"The speaker describes the inner anguish caused by judging Jangamas through a hierarchy of worth.","quote":"The prejudice we direct outward often becomes the fire within."},{"name":"Sacred Community","ids":[496,916],"why":"The Vachana describes the land inhabited by devotees as sacred, presenting a spiritually grounded community as a living holy place.","quote":"A place becomes sacred through the values embodied by the people who live there."},{"name":"Spiritual Equality","ids":[68,1295],"why":"The Vachana challenges the condescending assumption that devotees should be regarded as helpless recipients of charity because of material poverty.","quote":"Never mistake someone's material condition for the measure of their inner worth."}]},"Love, Relationships & Family":{"tags":[{"name":"Belonging","ids":[64,68],"why":"The speaker seeks acceptance as a member of the Divine household, expressing a deep need for spiritual belonging.","quote":"The deepest home is one in which no one must prove they belong."}]},"Ethics, Conduct & Human Values":{"tags":[{"name":"Hypocrisy","ids":[66,490,498,903,907,909,913,914,920,1173,1280,1281,1282,1283,1288,1290,1294,1380,1382,1388,1714,1716],"why":"The Vachana exposes the contradiction of claiming to reject caste distinctions in daily life while preserving them in marriage.","quote":"Equality is not genuine when it disappears at the moment of choice."},{"name":"Integrity","ids":[66,911,913,918,1294,1296,1297],"why":"The Vachana questions whether devotion is genuine when a person's actions contradict their stated belief in equality.","quote":"Our values become real only when our choices agree with our words."},{"name":"Impartial Service","ids":[67,905,1296,1383],"why":"The Vachana insists that food, clothing, wealth, and service be offered without favouring one Jangama over another.","quote":"Service becomes pure when the hand gives without ranking the receiver."},{"name":"Righteous Conduct","ids":[496,912,913,1006,1280,1285,1382,1386],"why":"The Vachana presents righteous conduct as the wick through which the flame of spiritual illumination shines.","quote":"Good conduct gives devotion a light the world can see."},{"name":"Slander","ids":[499,1299],"why":"The Vachana explicitly identifies slanderers as the target of the Sharanas' anger.","quote":"Words that wound the sincere can provoke a fire of their own."}]},"Life Challenges, Choices & Responsibilities":{"tags":[{"name":"Environment","ids":[494],"why":"The examples of crops, strength, sleep and conflict show that different conditions nurture different outcomes.","quote":"What grows within us is shaped, in part, by the ground around us."},{"name":"Human Necessity","ids":[500],"why":"The Vachana places devotion alongside bathing and food as a necessary part of embodied life.","quote":"Life asks us to care for the body, but also to care for what gives it meaning."},{"name":"Impermanence","ids":[1008,1172],"why":"The shifting reflections illustrate the unstable and changing nature of appearances in contrast with the unchanging original.","quote":"What changes before our eyes need not change the truth beneath it."}]},"Work, Wealth & Material Life":{"tags":[{"name":"Honest Livelihood","ids":[1296,1297,1298,1299],"why":"The Vachana questions whether resources acquired through rivalry or dishonest means can legitimately be called Kayaka.","quote":"Work is sacred only when the way we earn is as honest as the purpose we serve."}]},"Body, Health & Human Suffering":{"tags":[]},"Beyond Categories":{"tags":[]}}};

function getDisplayCategoryData(group){
 const merged=new Map();
 group.categories.forEach(categoryName=>{
  const source=DISCOVERY.categories[categoryName];
  if(!source)return;
  source.tags.forEach(tag=>{
   if(!merged.has(tag.name)){
    merged.set(tag.name,{...tag,ids:[...tag.ids],sourceCategories:[categoryName]});
   }else{
    const existing=merged.get(tag.name);
    existing.ids=[...new Set([...existing.ids,...tag.ids])];
    if(!existing.sourceCategories.includes(categoryName))existing.sourceCategories.push(categoryName);
   }
  });
 });
 return [...merged.values()].map(tag=>({...tag,ids:[...new Set(tag.ids)]}));
}

function discoveryThemeIcon(name){
 const n=(name||'').toLowerCase();
 if(/fear|anger|resent|restless|agitat|sorrow|bliss|serenity|desire|lust|emotion/.test(n)) return '◉';
 if(/wisdom|knowledge|learning|ignorance|awareness|realisation|experience/.test(n)) return '✺';
 if(/love|brotherhood|companionship|belong|community|friend/.test(n)) return '♡';
 if(/ego|self|identity|humility|integrity|character|virtue|respect/.test(n)) return '✦';
 if(/justice|equality|inclusion|discrimin|prejudice|caste|impartial/.test(n)) return '⚖';
 if(/work|livelihood|wealth|necessity|material|environment/.test(n)) return '⌁';
 if(/karma|liberation|maya|impermanence|existence|reality|non-dual/.test(n)) return '∞';
 if(/devotion|divine|guru|grace|surrender|remembrance|spiritual|sharana|linga|shatsthala|shivayoga/.test(n)) return '✧';
 if(/fear|fortitude|forbearance|discipline|commitment|transformation/.test(n)) return '⬡';
 if(/slander|hypocrisy|conduct|anger|reward|imitation/.test(n)) return '❖';
 return '◇';
}

function discoveryAtmosphere(){
 const bubbles=Array.from({length:13},(_,i)=>{
  const left=[5,17,29,42,55,68,80,92,12,36,61,75,48][i];
  const size=[13,21,9,16,26,11,18,8,15,23,10,19,12][i];
  const dur=[17,22,19,25,20,23,18,26,21,24,19,22,27][i];
  const delay=-[4,12,8,17,6,14,10,20,3,15,9,18,13][i];
  const drift=(i%2?'-':'')+(12+(i*7)%32)+'px';
  return `<i class="d-bubble" style="left:${left}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s;--drift:${drift}"></i>`;
 }).join('');
 return `<div class="d-atmosphere" aria-hidden="true"><i class="d-orb o1"></i><i class="d-orb o2"></i><i class="d-orb o3"></i>${bubbles}</div>`;
}

function discoveryHome(){
  const groups=DISCOVERY_DISPLAY_GROUPS;
  A.innerHTML=`<div class="scr dscr">${discoveryAtmosphere()}<div class="pad"><button class="back" id="dhome">‹ Home</button><h2>Discover Your Vachana</h2><p class="sub">Explore timeless wisdom through themes that speak to everyday life.</p><div class="dgrid">${groups.map((g,i)=>`<button class="dcat dcat-main" data-c="${i}"><span class="dicon" aria-hidden="true">${DISC_DISPLAY_ICONS[g.name]||'✧'}</span><span class="dcat-label">${g.name}</span><small>${getDisplayCategoryData(g).length} themes</small></button>`).join('')}</div></div><div class="dfoot"><button class="dback-bottom" id="dhomebottom">‹ Back</button></div></div>`;
  const goHome=()=>fadeTo(()=>{setBg(1);hero()});dhome.onclick=goHome;dhomebottom.onclick=goHome;
  A.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{DISC_GROUP=groups[+b.dataset.c];DISC_CAT=DISC_GROUP.name;discoveryTags()});
}
function discoveryTags(){
  const tags=getDisplayCategoryData(DISC_GROUP);
  A.innerHTML=`<div class="scr dscr">${discoveryAtmosphere()}<div class="pad"><button class="back" id="dback">‹ Categories</button><h2>${DISC_CAT}</h2><p class="sub">Choose a theme to discover related Vachanas.</p><div class="dgrid">${tags.map((t,i)=>`<button class="dcat dcat-theme" data-t="${i}"><span class="dtheme-icon" aria-hidden="true">${discoveryThemeIcon(t.name)}</span><span class="dcat-label">${t.name}</span><small>${t.ids.length} related Vachana${t.ids.length===1?'':'s'}</small></button>`).join('')}</div></div><div class="dfoot"><button class="dback-bottom" id="dbackbottom">‹ Back</button></div></div>`;
  dback.onclick=discoveryHome;dbackbottom.onclick=discoveryHome;
  A.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{DISC_TAG=tags[+b.dataset.t];DISC_QUEUE=[...DISC_TAG.ids].filter(n=>BYNO.some(x=>+x.v.no===+n));DISC_POS=0;discoveryResult(true)});
}
function discoveryResult(first){
  if(!DISC_QUEUE.length){discoveryTags();return}
  const key='vfh-discovery-'+DISC_CAT+'-'+DISC_TAG.name;
  let seen=[];try{seen=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){seen=[]}
  let next=DISC_QUEUE.findIndex(n=>!seen.includes(n));
  if(next<0){seen=[];next=0}
  const no=DISC_QUEUE[next];seen.push(no);try{localStorage.setItem(key,JSON.stringify(seen))}catch(e){}
  const x=BYNO.find(z=>+z.v.no===+no);
  const why=DISC_TAG.why||'This Vachana is connected to the selected theme.';
  const quote=DISC_TAG.quote||'';
  A.innerHTML=`<div class="scr dscr">${discoveryAtmosphere()}<div class="pad"><button class="back" id="dtagback">‹ ${DISC_TAG.name}</button><div class="dcrumb">${DISC_CAT} · ${DISC_TAG.name}</div><h2>Your Vachana</h2>${vc(x)}<section class="dnote"><b>Why this Vachana?</b><p>${why}</p></section>${quote?`<section class="dnote dq"><b>Philosophical Reflection</b><p>${quote}</p></section>`:''}<button class="btn dnext" id="dnext">Discover Another Vachana</button></div><div class="dresult-foot"><button class="dback-bottom" id="dresultback">‹ Back</button></div></div>`;
  dtagback.onclick=discoveryTags;dnext.onclick=()=>discoveryResult(false);dresultback.onclick=discoveryTags;
}

function hero(){A.innerHTML=`<div class="scr hero"><img class="logo" src="${LOGO}" alt="Basava Samithi emblem"><div class="cz a">Basava Samithi</div><div class="cz b">Presents</div><div class="cz c">Vachanas</div><div class="cz d">for</div><div class="cz c">Humanity</div><button class="btn" id="go">Enter</button><div class="dhome-title">Discover Your Vachana</div><button class="btn denter" id="discover">Enter</button><button class="spk hm" id="hm" aria-label="Explore more"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Explore More</span></button></div>`;go.onclick=()=>fadeTo(pick);discover.onclick=()=>fadeTo(discoveryHome);hm.onclick=homeMenu}
function pick(){stopSpeak();setBg(0);A.innerHTML=`<div class="scr"><div class="pad"><h2>Choose your language</h2><p class="sub">Sharanas, vachanas and their meanings will appear in the language you pick. You can change it anytime.</p>${Object.keys(LN).map(k=>`<button class="lang ${k==lang?'on':''}" data-k="${k}">${LN[k][0]}<small>${LN[k][1]}</small></button>`).join('')}</div><div class="foot"><button class="ay2" id="bkh">‹ Back</button><button class="btn" id="go">Continue</button></div></div>`;
A.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{lang=b.dataset.k;document.documentElement.lang=lang;A.querySelectorAll('.lang').forEach(x=>x.classList.toggle('on',x==b))});go.onclick=()=>fadeTo(()=>{HOME=0;HS.length=0;sel=null;q='';det=null;tab='v';shell()});bkh.onclick=()=>fadeTo(()=>{setBg(1);hero()})}
function vc(x){const{s,v}=x,lg=false;return `<article class="vc"><div class="meta"><b>${g(s.n)}</b><span>Vachana ${v.no}</span></div><p class="vt">${g(v.t)}</p>${v.o&&lang!='kn'?`<details class="orig"><summary>Original in Kannada</summary><p>${v.o}</p></details>`:''}<div class="mean ${lg?'cl':''}" ${lg?'onclick="this.classList.toggle(\'cl\')"':''}><i>Meaning</i><span class="tx">${g(v.m)}</span>${lg?'<span class="more"><span class="m1">Read more</span><span class="m2">Show less</span></span>':''}</div>${v.t[lang]?'':'<span class="fb">Translation pending. Showing English.</span>'}${acts(s,v)}</article>`}
function shell(){stopSpeak();setBg(0);A.innerHTML=`<div class="scr"><div class="top"><div class="lt"><button class="spk" id="mn" aria-label="Open vachana index"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><span class="cz">Vachanas</span></div><div class="rt"><button class="spk" id="sp" aria-label="Listen to this page" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button><button class="spk" id="th" aria-label="Switch between dark and light mode">${isL()?SUN:MOON}</button><button class="chip" id="lg">${LN[lang][0]}</button></div></div><div class="body" id="bd"></div><nav class="nav"><button id="nb" aria-label="Go back">‹ Back</button>${[['v','Vachanas'],['s','Random']].map(t=>`<button data-t="${t[0]}" class="${t[0]==tab?'on':''}">${t[1]}</button>`).join('')}</nav></div>`;
lg.onclick=pick;sp.onclick=speak;mn.onclick=drawer;th.onclick=toggleTheme;nb.onclick=back;A.querySelectorAll('.nav button[data-t]').forEach(b=>b.onclick=()=>{push();tab=b.dataset.t;if(tab=='s')cur=null;if(tab=='v'){det=null;sel=null;q=''}shell()});view()}
function view(){stopSpeak();const b=bd;b.dataset.dir=NAV;NAV='u';b.ontouchstart=b.ontouchend=null;if(tab=='v'){if(det!=null)detail();else browse()}
else if(tab=='s'){cur=cur||all()[Math.floor(Math.random()*all().length)];b.innerHTML=`<h2>Random</h2><p class="sub">A random vachana, picked just for you.</p>${vc(cur)}<div style="text-align:center"><button class="btn" id="ag">Show another</button></div>`;ag.onclick=()=>{let n;do{n=all()[Math.floor(Math.random()*all().length)]}while(n==cur&&all().length>1);cur=n;view()}}
}
function list(){stopSpeak();const el=document.getElementById('ls'),k=q.trim().toLowerCase();
if(!k&&!sel){const ss=[...D].sort((a,b)=>g(a.n).localeCompare(g(b.n),lang));let h='',l='';const fs=ss.filter(s=>FS.has(s.id)),fv=BYNO.filter(x=>FV.has(String(x.v.no)));if(fs.length)h+='<div class="ltr">Favorite Sharanas</div>'+fs.map(srow).join('');if(fv.length)h+='<div class="ltr">Favorite Vachanas</div>'+fv.map(x=>vrow(x,1)).join('');ss.forEach(s=>{const c=[...g(s.n)][0].toUpperCase();if(c!=l){l=c;h+=`<div class="ltr">${c}</div>`}h+=srow(s)});el.innerHTML=h;el.querySelectorAll('.row').forEach(r=>r.onclick=()=>{push();NAV='f';sel=r.dataset.id;q='';view()});openV(el);return}
const r=BYNO.filter(x=>(!sel||x.s.id==sel)&&(!k||String(x.v.no)==k||[g(x.v.t),g(x.v.m),g(x.s.n)].join(' ').toLowerCase().includes(k)));
el.innerHTML=r.length?`<p class="cnt">${r.length} vachana${r.length>1?'s':''}</p>`+r.map(x=>vrow(x,!sel)).join(''):'<p class="empty">No vachanas found. Try another word or number.</p>';openV(el)}
(function(){const r=Math.random,c=[];for(let i=0;i<120;i++){const a=(.25+r()*.65).toFixed(2),z=r()<.12?1.4:.8,k=`rgba(232,240,255,${a})`;c.push(`radial-gradient(circle at ${(r()*100).toFixed(1)}% ${(r()*100).toFixed(1)}%,${k} 0,${k} ${z}px,transparent ${z+.6}px)`)}const t='radial-gradient(120% 45% at 50% 112%,rgba(60,90,230,.32),transparent 65%),linear-gradient(#060D2E,#030718)';window.BGS=c.concat(t).join(',');window.BGP=t})();
const SUN='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',MOON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',BGL='#000';
const isL=()=>document.documentElement.getAttribute('data-theme')=='night';
function setBg(s){A.style.background=s?BGS:(isL()?BGL:BGP)}
function toggleTheme(){const R=document.documentElement;R.classList.add('tt');setTimeout(()=>R.classList.remove('tt'),500);const n=!isL();if(n)document.documentElement.setAttribute('data-theme','night');else document.documentElement.removeAttribute('data-theme');try{localStorage.setItem('vtheme',n?'night':'day')}catch(e){}setBg(0);th.innerHTML=isL()?SUN:MOON}
try{const t=localStorage.getItem('vtheme');if(t=='night')document.documentElement.setAttribute('data-theme','night')}catch(e){}

function installGlobalBubbles(){
  const addLayer=(scr)=>{
    if(!scr || scr.classList.contains('dscr') || scr.querySelector(':scope > .global-atmosphere')) return;
    const layer=document.createElement('div');
    layer.className='global-atmosphere';
    layer.setAttribute('aria-hidden','true');
    const bubbles=Array.from({length:11},(_,i)=>{
      const left=[4,15,27,39,52,64,76,88,21,59,94][i];
      const size=[10,17,24,12,19,9,22,14,8,16,11][i];
      const dur=[19,24,21,27,18,23,26,20,25,22,28][i];
      const delay=-[5,13,8,17,3,11,19,7,15,10,21][i];
      const drift=(i%2?'-':'')+(10+(i*9)%30)+'px';
      return `<i class="d-bubble" style="left:${left}%;width:${size}px;height:${size}px;--dur:${dur}s;--delay:${delay}s;--drift:${drift}"></i>`;
    }).join('');
    layer.innerHTML=`<i class="d-orb o1"></i><i class="d-orb o2"></i><i class="d-orb o3"></i>${bubbles}`;
    scr.insertBefore(layer,scr.firstChild);
  };
  const scan=()=>A.querySelectorAll('.scr').forEach(addLayer);
  scan();
  if(window.MutationObserver){
    const observer=new MutationObserver(scan);
    observer.observe(A,{childList:true,subtree:true});
  }
}

setBg(1);hero();installGlobalBubbles();
</script>
