<script>

{"id":"s0","n":{"en":"Basavanna","hi":"बसवण्णा","mr":"बसवण्णा","fr":"Basavanna"},"v":[{"no":60,"o":"ಇನ್ನೇವೆನಿನ್ನೇವೆನಯ್ಯಾ?\n ಎನ್ನ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿ ಘನವಾಯಿತ್ತು.\n ಎನ್ನ ನಿಂದಲ್ಲಿ ನಿಲ್ಲಲೀಯದು,\n ಎನ್ನ ಕುಳಿತಲ್ಲಿ ಕುಳ್ಳಿರಲೀಯದು.\n ಕ್ಷಣದಲ್ಲಿ ಪಾತಾಳಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ಆಕಾಶಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ದಿಗ್ದೆಸೆಗೆ ಐದುತ್ತಿದೆ.\n ಕೂಡಲಸಂಗಮದೇವಾ,\n ಈ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿಯನೆಂದಿಗೆ ನೀಗಿ,\n ಎಂದು ನಿಮ್ಮನೊಡಗೂಡುವೆನಯ್ಯಾ.","t":{"en":"What else can I do, what else can I do, O Lord?\nFierce has grown the assault of this monkey called my mind.\nWhere I stand, it does not let me stand;\nwhere I sit, it does not let me sit.\nIn a moment, it reaches the netherworld;\nin a moment, it reaches the sky;\nin a moment, it reaches all directions.\nO Koodalasangamadeva,\nwhen will I ever rid myself of the assault of this monkey called the mind,\nand when will I unite with you, O Lord?","hi":"अब क्या करूँ, अब क्या करूँ, हे स्वामी?\nमेरे मन रूपी मर्कट का आक्रमण प्रबल हो गया है।\nमुझे जहाँ खड़ा हूँ वहाँ खड़े रहने नहीं देता,\nमुझे जहाँ बैठा हूँ वहाँ बैठने नहीं देता।\nक्षण में पाताल को पहुँच रहा है,\nक्षण में आकाश को पहुँच रहा है,\nक्षण में दसों दिशाओं को पहुँच रहा है।\nहे कूडलसंगमदेव,\nइस मन रूपी मर्कट के आक्रमण से कब मुक्त होकर,\nकब आपसे आ मिलूँगा, हे स्वामी?","mr":"आता मी काय करू, आता मी काय करू, हे स्वामी?\nमाझ्या मन म्हणवणाऱ्या मर्कटाचा हल्ला प्रचंड झाला आहे.\nमला उभ्या असलेल्या जागी उभे राहू देत नाही,\nमला बसलेल्या जागी बसू देत नाही.\nक्षणात पाताळात जाऊन पोहोचतो,\nक्षणात आकाशात जाऊन पोहोचतो,\nक्षणात दाही दिशांना जाऊन पोहोचतो.\nहे कूडलसंगमदेवा,\nया मन म्हणवणाऱ्या मर्कटाचा हल्ला केव्हा दूर करून,\nमी केव्हा तुमच्याशी एकरूप होईन, हे स्वामी?","fr":"Que ferai-je désormais, que ferai-je donc, ô Seigneur ?\nL'assaut du singe que l'on appelle mon esprit est devenu redoutable.\nIl ne me laisse pas rester debout là où je me tiens,\nil ne me laisse pas rester assis là où je m'assieds.\nEn un instant, il s'élance vers les mondes souterrains,\nen un instant, il s'élance vers le ciel,\nen un instant, il s'élance vers toutes les directions.\nÔ Koodalasangamadeva,\nquand donc me délivrerai-je de l'assaut de ce singe que l'on appelle l'esprit,\net quand donc m'unirai-je à vous, ô Seigneur ?"},"m":{"en":"This Vachana vividly captures the intense inner struggle of a spiritual seeker against the relentless restlessness of the human mind.\n\nComparing the mind to a wild monkey, the Vachana illustrates how its constant agitation prevents any stillness, darting in a single instant from the deepest underworld to the highest sky and across all directions.\n\nThis extreme mental volatility scatters awareness and makes it impossible to remain grounded or composed in the present moment.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, the seeker expresses an earnest longing to transcend this turbulent mental assault and attain complete union with the Absolute.","hi":"यह वचन मन की अत्यंत चंचल और अनियंत्रित प्रकृति का सजीव वर्णन करता है, जिसे यहाँ एक उत्पाती बंदर (मर्कट) की उपमा दी गई है।\n\nवचनकार की व्यथा यह है कि इस मन रूपी बंदर का आक्रमण इतना प्रबल हो गया है कि यह साधक को न तो एक स्थान पर स्थिरता से खड़े रहने देता है और न ही शांति से बैठने देता है।\n\nयह अस्थिर मन एक ही क्षण में पाताल की गहराइयों में उतर जाता है, अगले ही क्षण आकाश की ऊँचाइयों में उड़ने लगता है और पल भर में दसों दिशाओं में भटकता रहता है।\n\nइस वचन का आध्यात्मिक मर्म यह है कि जब तक मन की इस निरंतर भटकन और चंचलता से मुक्ति नहीं मिलती, तब तक कूडलसंगमदेव रूपी निराकार परमतत्त्व के साथ एकाकार होना संभव नहीं है।","mr":"या वचनात मानवी मनाच्या अत्यंत चंचल आणि अस्थिर वृत्तीचे मार्मिक वर्णन करण्यात आले आहे.\n\nमनाला माकडाची उपमा देऊन हे वचन स्पष्ट करते की, मनाच्या या सततच्या उड्यांमुळे साधकाला एका जागी शांतपणे उभेही राहता येत नाही आणि स्थिरपणे बसताही येत नाही.\n\nहे चंचल मन एका क्षणात पाताळात जाते, दुसऱ्या क्षणात आकाशात भरारी घेते, तर पुढच्याच क्षणी दहा दिशांना भटकत राहते.\n\nकूडलसंगमदेव या परमतत्त्वाशी एकरूप होण्यासाठी मनाचा हा चंचलपणा आणि त्याचे आक्रमण कधी संपणार, अशी तीव्र आध्यात्मिक तळमळ या वचनातून व्यक्त झाली आहे.","fr":"Ce vachana met en lumière l'extrême agitation de l'esprit humain, comparé ici aux assauts incessants et imprévisibles d'un singe.\n\nCette instabilité intérieure empêche l'être de trouver le moindre repos, que ce soit debout ou assis, en projetant la pensée d'un instant à l'autre vers les abîmes, les cieux ou les quatre points cardinaux.\n\nÀ travers cette image saisissante de la dispersion mentale, le texte exprime l'impuissance du chercheur spirituel face aux soubresauts de sa propre conscience.\n\nLa portée spirituelle de ce vachana réside dans l'aspiration profonde à surmonter cette tyrannie de l'esprit vagabond afin de réaliser l'union ultime avec la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva."}},{"no":61,"o":"ಇಬ್ಬರು ಮೂವರು ದೇವರೆಂದು ಉಬ್ಬಿ ಮಾತನಾಡಬೇಡ,\n ಒಬ್ಬನೆ ಕಾಣಿರೊ, ಇಬ್ಬರೆಂಬುದು ಹುಸಿ ನೋಡಾ!\n ಕೂಡಲಸಂಗಮದೇವನಲ್ಲದಿಲ್ಲೆಂದಿತ್ತು ವೇದ.","t":{"en":"Do not swell with pride and speak of two or three gods,\nHe is but one, behold; to say there are two is a lie, see!\nThe Veda itself declared that there is none other than Koodalasangamadeva.","hi":"दो-तीन देव हैं, ऐसा फूलकर मत बोलो,\nवे एकमात्र ही हैं, देखो, दो कहना झूठ है, देखो!\nकूडलसंगमदेव के सिवा कोई नहीं है, ऐसा वेद ने कहा।","mr":"दोन किंवा तीन देव आहेत असे फुगून बोलू नकोस,\nतो एकच आहे हे लक्षात घ्या, दोन आहेत असे म्हणणे खोटे आहे पहा!\nकूडलसंगमदेवाशिवाय दुसरा कोणीही नाही, असे वेदाने म्हटले आहे.","fr":"Ne parlez pas avec orgueil en disant qu'il y a deux ou trois dieux,\nvoyez qu'Il est l'Unique ; dire qu'il y en a deux est un mensonge, voyez !\nLe Veda a déclaré qu'il n'en est point d'autre que Koodalasangamadeva."},"m":{"en":"The central message of this Vachana is an uncompromising assertion of the absolute oneness of the Formless Supreme Reality, firmly rejecting the belief in multiple gods.\n\nIt cautions against the boastful and misguided notion of dividing the Divine into two or three separate entities, declaring that any perception of duality is entirely false.\n\nTo reinforce this truth, the Vachana points out that even the Vedas ultimately affirm the existence of nothing other than the one Supreme Consciousness, addressed here through the ankitanama Kudalasangamadeva.","hi":"इस वचन का केंद्रीय संदेश यह है कि निराकार परमतत्त्व केवल एक है और बहुदेववाद की मान्यता पूरी तरह भ्रामक है।\n\nइसमें यह स्पष्ट किया गया है कि अहंकार या उत्साह में आकर दो या तीन देवताओं के अस्तित्व की बात करना व्यर्थ है, क्योंकि परमतत्त्व को दो या अधिक मानना कोरा झूठ है।\n\nकूडलसंगमदेव के रूप में संबोधित अद्वितीय निराकार परम सत्य के अतिरिक्त अन्य किसी का अस्तित्व नहीं है, और इस एकत्व के सिद्धांत की पुष्टि स्वयं वेद के उदाहरण से की गई है।","mr":"या वचनाचा मुख्य आशय असा आहे की, दोन किंवा तीन वेगवेगळे देव आहेत असे फुशारकीने किंवा भ्रमात राहून बोलू नये.\n\nहे वचन स्पष्ट करते की, संपूर्ण विश्वामध्ये केवळ एकच अद्वितीय परमतत्त्व अस्तित्वात आहे आणि यापेक्षा अधिक देव आहेत ही कल्पना पूर्णपणे खोटी व भ्रामक आहे.\n\nकूडलसंगमदेव या नावाने संबोधले गेलेले निराकार परमतत्त्वच एकमेव परम सत्य असून त्याशिवाय दुसरे काहीही अस्तित्वात नाही, असाच निर्वाळा वेदांनीही दिला आहे.","fr":"Ce vachana rejette fermement le polythéisme et la prétention d'affirmer avec orgueil qu'il existe deux ou trois divinités distinctes.\n\nIl met en lumière l'unicité absolue du Principe suprême, déclarant que toute notion de dualité ou de multiplicité du divin n'est qu'une pure illusion.\n\nLa portée spirituelle de ce texte réside dans le rappel que même le Veda atteste qu'il n'existe aucune autre vérité en dehors de l'unique Réalité suprême sans forme, invoquée ici sous le nom de Koodalasangamadeva."}},{"no":62,"o":"ಇರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ತರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಕೊರೆಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಜರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು.\n ಕೂಡಲಸಂಗನ ಶರಣರಿಗೆ ಮುಳಿಸ ತಾಳಿ\n ಎನ್ನ ಭಕ್ತಿ ಅರೆಯಾಯಿತ್ತು.","t":{"en":"By letting themselves be stabbed, our people became devotees,\nby letting themselves be beheaded, our people became devotees,\nby letting themselves be sawed, our people became devotees,\nby enduring scorn, our people became devotees.\nHarbouring anger towards Koodalasanga's *Sharanas*,\nmy devotion was reduced to half.","hi":"रखवाकर भक्त बने हैं हमारे लोग,\nमँगवाकर भक्त बने हैं हमारे लोग,\nकटवाकर भक्त बने हैं हमारे लोग,\nनिंदा सहकर भक्त बने हैं हमारे लोग।\nकूडलसंगम के शरणों पर रोष धारणकर\nमेरी भक्ति अधूरी रह गई।","mr":"भोसकून घेऊन भक्त झाले आमचे लोक,\nकापून घेऊन भक्त झाले आमचे लोक,\nकोरावून घेऊन भक्त झाले आमचे लोक,\nहिणवून घेऊन भक्त झाले आमचे लोक.\nकूडलसंगाच्या शरणांवर रोष धरून\nमाझी भक्ती अपुरी ठरली.","fr":"En se laissant transpercer, les nôtres sont devenus des dévots,\nen se laissant trancher, les nôtres sont devenus des dévots,\nen se laissant entailler, les nôtres sont devenus des dévots,\nen se laissant injurier, les nôtres sont devenus des dévots.\nPour avoir gardé du courroux envers les Sharanas de Koodalasanga,\nma Bhakti est demeurée incomplète."},"m":{"en":"This Vachana contrasts the supreme endurance and humility of true devotees with the speaker's own spiritual inadequacy.\n\nIt recalls how earlier revered devotees attained spiritual stature by willingly bearing severe trials, enduring physical affliction, and accepting public ridicule without complaint.\n\nAgainst this high benchmark of forbearance, the speaker confesses to harbouring anger or resentment toward the Sharanas of Kudalasanga.\n\nThe Vachana thus reveals that even a trace of irritation toward fellow spiritual seekers makes one's devotion incomplete and inferior to the selfless humility of true Sharanas.","hi":"इस वचन का मूल भाव यह है कि सच्चे शरण या भक्त हर प्रकार के कष्ट, परीक्षा और अपमान को सहकर ही भक्ति की उच्च अवस्था को प्राप्त करते हैं।\n\nयहाँ यह स्पष्ट किया गया है कि पूर्ववर्ती या निष्ठावान भक्त शरीर पर प्रहार सहकर, अपना सर्वस्व अर्पित कर, देह को कष्ट देकर तथा संसार की निंदा और तिरस्कार को स्वीकार करके सच्चे भक्त बने हैं।\n\nवचनकार आत्मनिरीक्षण करते हुए कहते हैं कि कूडलसंगमदेव के उन महान शरणों के प्रति तनिक भी क्रोध या रोष का भाव आने मात्र से उनकी अपनी भक्ति अधूरी रह गई।\n\nइस प्रकार यह वचन दर्शाता है कि शरणों के प्रति पूर्ण सहनशीलता, विनम्रता और क्रोधरहित भाव के बिना भक्ति की पूर्णता संभव नहीं है।","mr":"या वचनाचा मुख्य आशय असा आहे की, खऱ्या भक्तीमध्ये कितीही घोर शारीरिक वा मानसिक कष्ट आले तरी शरण विचलित होत नाहीत.\n\nकूटू अथवा शरीराचा घाव सोसणे, अवयव तोडले जाणे, शरीर करवतीने कापले जाणे तसेच कठोर निंदा आणि अपमान सहन करणे यांसारख्या सर्व कसोटींवर उतरून पुरातण शरणांनी आपली अढळ निष्ठा सिद्ध केली आहे.\n\nअशा निष्ठावंत आदर्शांच्या तुलनेत, कूडलसंगमदेवाच्या शरणांवर राग धरल्यामुळे आपली स्वतःची भक्ती मात्र अर्धवट आणि अपूर्ण राहिली आहे, अशी प्रांजळ आत्मपरीक्षणाची भावना या वचनातून व्यक्त होते.\n\nसंतांची सहनशीलता आणि स्वतःतील अहंकार व क्रोधाची जाणीव यांतील विरोधाभास मांडून, भक्तीच्या मार्गात नम्रता आणि समतेचे महत्त्व हे वचन अधोरेखित करते.","fr":"Ce vachana met en lumière la patience, l'endurance et l'humilité extraordinaires par lesquelles les véritables chercheurs spirituels deviennent des dévots accomplis.\n\nIl souligne que ceux de la communauté spirituelle ont affiné et prouvé leur dévotion en acceptant sans résistance d'être mis à l'épreuve, blessés, diminués ou sévèrement critiqués par autrui.\n\nEn contraste avec cette maîtrise de soi exemplaire, l'auteur reconnaît avec lucidité que sa propre dévotion est demeurée incomplète et imparfaite pour avoir cédé à la colère envers les Sharanas de Koodalasanga, la Réalité suprême sans forme.\n\nLa portée spirituelle de ce vachana réside ainsi dans un examen de conscience sincère, qui rappelle que l'irritation et le ressentiment envers les Sharanas altèrent la plénitude de l'engagement intérieur."}},{"no":63,"o":"ಇರುಳೆಂದೇನೋ ಕುರುಡಂಗೆ,\n ಹಗಲೆಂದೇನೋ ಕುರುಡಂಗೆ!\n ತಾಳವ ಬಾರಿಸಿದಡೇನೋ,\n ಪಂಚಮಹಾಶಬುದವ ಬಾರಿಸಿದಡೇನೋ ಕಿವುಡಂಗೆ!\n ಕೂಡಲಸಂಗಮದೇವಯ್ಯನ\n ಪಥವಿನ್ನಾವುದೆಂದರಿಯದವಂಗೆ!","t":{"en":"What if it is night to a blind man,\nwhat if it is day to a blind man!\nWhat if cymbals are played,\nwhat if the five great instruments are sounded to a deaf man—\nto one who does not know\nwhich is the path of Lord Koodalasangamadeva!","hi":"अंधे के लिए रात हो तो क्या,\nअंधे के लिए दिन हो तो क्या!\nताल बजाने पर क्या,\nपंचमहाशब्द बजाने पर क्या बहरे के लिए!\nस्वामी कूडलसंगमदेव का\nपथ कौन-सा है, यह न जाननेवाले के लिए!","mr":"रात्र म्हणजे काय आंधळ्याला,\nआणि दिवस म्हणजे काय आंधळ्याला!\nटाळ वाजवला तर काय,\nआणि पंचमहाशब्द वाजवले तर काय बहिऱ्याला!\nतसेच कूडलसंगमदेवय्यांचा\nमार्ग नेमका कोणता हे न जाणणाऱ्याला!","fr":"Que dire que c'est la nuit à un aveugle,\nque dire que c'est le jour à un aveugle !\nQu'importe que l'on fasse résonner les cymbales,\nqu'importe que l'on fasse retentir les cinq grands instruments à un sourd !\nIl en est ainsi pour celui qui ignore quelle est la voie\ndu Seigneur Koodalasangamadeva !"},"m":{"en":"This Vachana explains that spiritual truth and the path of awareness cannot be perceived by someone who lacks inner receptivity.\n\nJust as a blind person cannot distinguish between the darkness of night and the light of day, and a deaf person remains unaffected whether simple cymbals or the grand fivefold musical instruments (Panchamahashabda) are played, external spiritual expressions are meaningless to the unawakened mind.\n\nThrough these striking sensory metaphors, the Vachana highlights that the path towards the Formless Supreme Consciousness, addressed here as Kudalasangamadeva, remains entirely incomprehensible to one who has not cultivated inner spiritual sensibility and awareness (Arivu).","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार एक दृष्टिहीन व्यक्ति के लिए रात और दिन में कोई अंतर नहीं होता, उसी प्रकार आध्यात्मिक बोध से रहित व्यक्ति सत्य के प्रकाश को अनुभव नहीं कर पाता।\n\nजैसे किसी बधिर व्यक्ति के सामने केवल मंजीरा बजाया जाए या पाँच प्रकार के महान वाद्ययंत्रों (पंचमहाशब्द) की ध्वनि की जाए, उसके लिए दोनों ही निरर्थक होते हैं।\n\nवचन का केंद्रीय भाव यह है कि जो मनुष्य निराकार परमतत्त्व कूडलसंगमदेव के सत्य मार्ग को नहीं जानता, उसके लिए उच्चतम आध्यात्मिक ज्ञान और साधन भी उसी प्रकार निष्फल रह जाते हैं जैसे अंधे के लिए प्रकाश और बहरे के लिए संगीत।\n\nयहाँ अंधे और बहरे के रूपकों के माध्यम से यह दर्शाया गया है कि आध्यात्मिक मार्ग की पहचान और आंतरिक जागृति के बिना बाहरी परिवेश या भव्यता का कोई वास्तविक लाभ नहीं होता।","mr":"जशा अंध व्यक्तीला रात्र आणि दिवसाचा फरक जाणवत नाही, आणि बहिऱ्या व्यक्तीला साध्या टाळांचा आवाज काय किंवा पंचमहावाद्यांचा प्रचंड गजर काय, दोन्ही सारखेच निरर्थक ठरतात, तसेच अज्ञानी माणसाचे असते.\n\nया दृष्टांतांच्या माध्यमातून हे वचन स्पष्ट करते की, ज्या व्यक्तीमध्ये अंतरंगाची आध्यात्मिक जाणीव आणि संवेदनशीलता नाही, तिला बाह्य साधनांचा किंवा भव्यतेचा कोणताही उपयोग होत नाही.\n\nकूडलसंगमदेव या निराकार परमतत्त्वाचा खरा मार्ग कोणता आहे, हेच ज्याला समजलेले नाही, त्याच्यासाठी सत्याची सर्व बाह्य लक्षणे आणि शिकवण व्यर्थ ठरते.","fr":"Le message essentiel de ce vachana est que la vérité spirituelle demeure inaccessible à celui qui n'a pas la capacité intérieure de la percevoir et de la comprendre.\n\nÀ travers des images saisissantes, le texte rappelle que l'alternance du jour et de la nuit n'a aucun sens pour un aveugle, tout comme le rythme des cymbales ou le retentissement des cinq grands instruments de musique restent vains pour un sourd.\n\nDe la même manière, pour une personne dépourvue de discernement spirituel, la voie menant à la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva, demeure totalement hors de portée.\n\nCe vachana souligne ainsi que sans l'éveil de la conscience intérieure, les enseignements et les signes spirituels les plus élevés restent lettre morte."}},{"no":64,"o":"ಇವನಾರವ,\n ಇವನಾರವ,\n ಇವನಾರವನೆಂದೆನಿಸದಿರಯ್ಯಾ.\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವನೆಂದೆನಿಸಯ್ಯಾ.\n ಕೂಡಲಸಂಗಮದೇವಾ\n ನಿಮ್ಮ ಮನೆಯ ಮಗನೆಂದೆನಿಸಯ್ಯಾ.","t":{"en":"Who is he,\nwho is he,\ndo not let it be said, who is he, O Lord.\nHe is ours,\nhe is ours,\nlet it be said, he is ours, O Lord.\nO Koodalasangamadeva,\nlet me be called a son of your house, O Lord.","hi":"यह किसका है,\nयह किसका है,\nयह किसका है, ऐसा मत कहलवाइए, हे स्वामी।\nयह हमारा है,\nयह हमारा है,\nयह हमारा है, ऐसा कहलवाइए, हे स्वामी।\nहे कूडलसंगमदेव,\nआपके घर का पुत्र है, ऐसा कहलवाइए, हे स्वामी।","mr":"हा कोणाचा,\nहा कोणाचा,\nहा कोणाचा असे मला म्हणवू नका, हे प्रभो.\nहा आमचा,\nहा आमचा,\nहा आमचा असे मला म्हणवून घ्या, हे प्रभो.\nहे कूडलसंगमदेवा,\nआपल्या घराचा मुलगा असे मला म्हणवून घ्या.","fr":"« Qui est celui-ci,\nqui est celui-ci,\nqui est celui-ci ? » — ne fais pas dire cela, Ô Seigneur.\n« Celui-ci est des nôtres,\ncelui-ci est des nôtres,\ncelui-ci est des nôtres » — fais dire cela, Ô Seigneur.\nÔ Koodalasangamadeva,\nfais dire que je suis un fils de ta maison, Ô Seigneur."},"m":{"en":"This Vachana expresses a profound aspiration for universal brotherhood and complete social inclusion, rejecting the alienation caused by divisions of caste, status, or lineage.\n\nThe plea to never be looked upon as an outsider (\"Who is he?\") and instead be embraced entirely as one's own (\"He is ours\") strikes at the very root of social discrimination and hierarchy.\n\nBy asking Kudalasangamadeva, the Formless Supreme Reality, to be recognized as a true child of the spiritual household, the Vachana envisions an egalitarian community of Sharanas bound by shared kinship and equality rather than birth.","hi":"इस वचन का केंद्रीय भाव यह है कि मनुष्य को परायेपन और अलगाव की भावना से मुक्त होकर संपूर्ण आत्मीयता और अपनेपन का अनुभव होना चाहिए।\n\nयहाँ कूडलसंगमदेव के रूप में संबोधित निराकार परमतत्त्व से यह याचना की गई है कि किसी को भी देखकर मन में यह प्रश्न न उठे कि 'यह कौन है या किसका है', जिससे दूरी या भेदभाव प्रकट होता हो।\n\nइसके विपरीत, प्रत्येक व्यक्ति को 'यह हमारा है, यह हमारा अपना है' कहकर निस्संकोच स्वीकार करने की उदात्त दृष्टि की कामना की गई है।\n\nइस वचन का आध्यात्मिक और सामाजिक महत्व यह है कि साधक स्वयं को परमतत्त्व के घर के पुत्र के रूप में देखा जाना चाहता है, जो मानवीय समानता और विश्वबंधुत्व के गहरे शरण दर्शन को दर्शाता है।","mr":"हे वचन सामाजिक आणि आध्यात्मिक एकात्मतेचा अत्यंत जिव्हाळ्याचा संदेश देते, जिथे कोणत्याही व्यक्तीला 'हा कोणाचा आहे?' असे विचारून परके किंवा वेगळे मानू नये, अशी आर्त विनवणी केली आहे.\n\nसमाजात कोणताही भेदभाव न ठेवता प्रत्येकाला 'हा आमचाच आहे' अशा आत्मीयतेने आणि आपुलकीने जवळ केले जावे, हा या वचनाचा मुख्य गाभा आहे.\n\nकूडलसंगमदेव या नावाने संबोधलेल्या निराकार परमतत्त्वाच्या विशाल परिवारातील एक सदस्य म्हणून, म्हणजेच 'तुमच्याच घरातील मुलगा' म्हणून स्वतःचा स्वीकार व्हावा, ही यामागील उदात्त भावना आहे.\n\nथोडक्यात, सर्व प्रकारचे सामाजिक दुरावे मिटवून संपूर्ण मानवजातीमध्ये आणि सत्यशोधकांच्या समुदायात एकतेची व आपलेपणाची भावना निर्माण करणे, हेच या वचनाचे आध्यात्मिक महत्त्व आहे.","fr":"Ce vachana exprime un appel profond à dépasser toutes les barrières d'exclusion sociale pour embrasser une fraternité humaine universelle.\n\nIl rejette fermement l'attitude discriminatoire qui consiste à traiter autrui comme un étranger en s'interrogeant sur son origine ou son appartenance.\n\nÀ l'inverse, le texte invite à reconnaître chaque être avec bienveillance comme un membre à part entière de sa propre communauté.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Koodalasangamadeva, le poète aspire finalement à être accepté dans une intimité spirituelle absolue, tel un enfant appartenant au foyer même du Principe suprême."}},{"no":65,"o":"ಉಂಬ ಬಟ್ಟಲು ಬೇರೆ ಕಂಚಲ್ಲ,\n ನೋಡುವ ದರ್ಪಣ ಬೇರೆ ಕಂಚಲ್ಲ.\n ಭಾಂಡ ಒಂದೆ ಭಾಜನ ಒಂದೆ,\n ಬೆಳಗೆ ಕನ್ನಡಿಯೆನಿಸಿತ್ತಯ್ಯಾ.\n ಅರಿದಡೆ ಶರಣ, ಮರೆದಡೆ ಮಾನವ,\n ಮರೆಯದೆ ಪೂಜಿಸು ಕೂಡಲಸಂಗನ.","t":{"en":"The plate from which one eats is not a different bronze,\nthe mirror into which one looks is not a different bronze.\nThe metal is one, the vessel is one;\nwhen polished, it comes to be called a mirror, O brother.\nIf one awakens in awareness, one is a *Sharana*; if one falls into forgetfulness, a mere mortal—\nworship Koodalasanga without forgetting.","hi":"भोजन करने की कटोरी अलग काँसा नहीं है,\nदेखने का दर्पण अलग काँसा नहीं है।\nपात्र एक ही है, भाजन एक ही है,\nमाँजने पर दर्पण कहलाया, हे स्वामी।\nजाने तो शरण, भूले तो मानव,\nभूले बिना पूजो कूडलसंग को।","mr":"जेवायचे ताट काही वेगळे कांसे नाही,\nपाहायचा दर्पण काही वेगळे कांसे नाही.\nभांडे एकच, पात्रही एकच,\nघासून उजळले की तो आरसा म्हणवला, हे स्वामी.\nजाणले तर शरण, विसरले तर मानव,\nन विसरता पूजन कर कूडलसंगाचे.","fr":"L'écuelle dans laquelle on mange n'est pas d'un autre bronze,\nle miroir dans lequel on se regarde n'est pas d'un autre bronze.\nLa matière est une, le récipient est un ;\nlorsqu'on le polit, on l'appelle miroir, mon frère.\nLorsqu'il s'éveille à la conscience, il est un Sharana ; lorsqu'il tombe dans l'oubli, il est un simple humain :\nsans jamais oublier, vénère Koodalasanga."},"m":{"en":"The central message of this Vachana is that the difference between an ordinary human being and an enlightened Sharana lies not in their fundamental nature, but in the awakening of spiritual awareness (Arivu).\n\nUsing the striking metaphor of bronze, the Vachana illustrates that the metal used to make an everyday eating bowl and a reflective mirror is identical; the bronze becomes a mirror simply when it is polished and made to shine.\n\nSimilarly, all human beings share the same essential substance, yet one who remains in spiritual forgetfulness stays merely mortal, whereas one whose inner consciousness is purified and awakened to the truth becomes a Sharana.\n\nTherefore, the Vachana urges the seeker to continually cultivate this inner illumination without ever lapsing into forgetfulness, remaining steadfastly oriented towards the Formless Supreme Reality, Kudalasangama.","hi":"इस वचन का केंद्रीय भाव यह है कि सामान्य मनुष्य और प्रबुद्ध शरण के मूल तत्त्व में कोई भिन्नता नहीं है, अंतर केवल आत्म-जागृति और शुद्धता का है।\n\nभोजन करने का कटोरा और चेहरा देखने का दर्पण अलग-अलग कांसे से नहीं बने होते; दोनों की मूल धातु और पात्र एक ही हैं, किंतु जब उसी कांसे को माँजकर चमकाया जाता है, तो वह दर्पण बन जाता है।\n\nइसी प्रकार, जो अपने भीतर के परम सत्य को जान लेता है वह 'शरण' है, और जो इस बोध को भूलकर अज्ञान में रहता है वह साधारण 'मानव' ही रह जाता है।\n\nअतः यह वचन इस बात की ओर संकेत करता है कि अज्ञान की मलिनता को मिटाकर और अपनी चेतना को सदा जागृत रखते हुए, बिना भूले निराकार परमतत्त्व कूडलसंगम की उपासना करनी चाहिए।","mr":"या वचनाचा मुख्य आशय असा आहे की, सामान्य माणूस आणि आत्मज्ञानी शरण हे मूळ स्वरूपाने वेगळे नसून एकाच चैतन्याचे अंश आहेत.\n\nज्याप्रमाणे जेवणाचे ताट आणि चेहरा पाहण्याचा आरसा हे दोन्ही एकाच कांस्य धातूपासून बनलेले असतात, परंतु घासून स्वच्छ केल्यामुळे व उजळल्यामुळे त्या धातूला आरशाचे रूप प्राप्त होते, तसेच मानवी अस्तित्वाचेही आहे.\n\nया मूळ सत्यतत्त्वाची जाणीव होऊन जेव्हा अंतःकरण निर्मळ होते तेव्हा तोच जीव 'शरण' बनतो, आणि या सत्याचा विसर पडला की तो केवळ एक सामान्य 'मानव' राहतो.\n\nम्हणूनच, अज्ञानाची पुटे दूर सारून कूडलसंगमदेव या परमतत्त्वाचे स्मरण अखंड जागृत ठेवण्याचे व त्याची उपासना करण्याचे आध्यात्मिक महत्त्व हे वचन अधोरेखित करते.","fr":"Ce vachana met en lumière l’unité fondamentale de l’essence humaine à travers la métaphore du bronze : le bol dans lequel on mange et le miroir dans lequel on se regarde sont façonnés à partir de la même matière première.\n\nLa différence ne réside donc pas dans la substance, mais dans la clarté : c’est uniquement lorsqu’il est poli et brillant que le métal ordinaire devient un miroir capable de refléter la lumière.\n\nDe la même manière, l’être humain et le Sharana partagent la même nature profonde ; celui qui s’éveille à la connaissance de soi (Arivu) devient un Sharana, tandis que celui qui demeure dans l’oubli et l’ignorance reste un simple mortel.\n\nLa portée spirituelle de ce vachana réside dans l’invitation à polir sa conscience par une vigilance constante, afin de vénérer sans jamais l’oublier la Réalité suprême sans forme, invoquée ici sous le nom de Koodalasanga."}},{"no":66,"o":"ಉಂಬಲ್ಲಿ [ಊ]ಡುವಲ್ಲಿ ಕ್ರೀಯಳಿಯಿತ್ತೆಂಬರು,\n ಕೊಂಬಲ್ಲಿ ಕೊಡುವಲ್ಲಿ ಕುಲವನರಸುವರು,\n ಎಂತಯ್ಯಾ ಅವರ ಭಕ್ತರೆಂತೆಂಬೆ?\n ಎಂತಯ್ಯಾ ಅವರ ಯುಕ್ತರೆಂತೆಂಬೆ?\n ಕೂಡಲಸಂಗಮದೇವಾ ಕೇಳಯ್ಯಾ,\n ಹೊಲತಿ ಶುದ್ಧ ನೀರ ಮಿಂದಂತಾಯಿತ್ತಯ್ಯಾ.","t":{"en":"In eating and in dressing, they say caste-distinctions have vanished;\nin taking and in giving a bride, they search for caste.\nHow, O Lord—how can I call them devotees?\nHow, O Lord—how can I call them the worthy ones?\nListen, O Koodalasangamadeva:\nit is like an impure woman bathing in pure water, O Lord.","hi":"खाने में, पहनने में कहते हैं कि जाति-भेद मिट गया,\nकन्या लेने में, देने में कुल ढूँढ़ते हैं,\nकैसे, हे स्वामी, उन्हें भक्त कैसे कहूँ?\nकैसे, हे स्वामी, उन्हें युक्त कैसे कहूँ?\nहे कूडलसंगमदेव, सुनिए,\nयह तो ऐसा हुआ जैसे रजस्वला स्त्री ने शुद्ध जल से स्नान किया हो, हे स्वामी।","mr":"जेवताना आणि नेसताना कर्माचा भेद नाहीसा झाला असे म्हणतात,\nमुलगी घेताना आणि देताना मात्र जात शोधतात,\nहे प्रभो, त्यांना भक्त कसे म्हणू?\nहे प्रभो, त्यांना युक्त कसे म्हणू?\nहे कूडलसंगमदेवा, ऐक ना,\nहे तर विटाळशीने शुद्ध पाण्याने स्नान केल्यासारखे झाले, हे प्रभो!","fr":"Lorsqu'il s'agit de manger et de se vêtir, ils disent que les distinctions d'actes rituels ont disparu,\nmais lorsqu'il s'agit de prendre ou de donner en mariage, ils cherchent la caste ;\ncomment donc, Ô Seigneur, pourrais-je les appeler des dévots ?\ncomment donc, Ô Seigneur, pourrais-je les appeler des êtres dignes ?\nÔ Koodalasangamadeva, écoute, Ô Seigneur :\nc'est comme une femme en état d'impureté menstruelle qui se baigne dans une eau pure, Ô Seigneur."},"m":{"en":"This Vachana sharply critiques the hypocrisy of those who claim to have transcended caste distinctions only in superficial matters while clinging to them in major social decisions.\n\nPeople readily declare that ritual and caste barriers have dissolved when it comes to dining together or dressing, yet they strictly scrutinize lineage and caste when arranging marriages.\n\nThe Vachana questions how such individuals with double standards can ever be considered true devotees or spiritually worthy people.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, it compares this superficial equality to an impure person bathing in pure water without any genuine inner cleansing or transformation.","hi":"यह वचन सामाजिक और आध्यात्मिक जीवन में व्याप्त जातिगत पाखंड तथा दोहरे मापदंडों की कड़ी आलोचना करता है।\n\nवचन में यह स्पष्ट किया गया है कि जो लोग खान-पान और वस्त्र पहनावे के बाहरी व्यवहार में तो यह दावा करते हैं कि उनके भीतर से जाति और कर्मकांड का भेद मिट गया है, परंतु वैवाहिक संबंध जोड़ने या लेन-देन के समय कुल और जाति की तलाश करते हैं, उन्हें सच्चा भक्त या आध्यात्मिक रूप से युक्त कदाचित नहीं कहा जा सकता।\n\nनिराकार परमतत्त्व कूडलसंगमदेव को संबोधित करते हुए इस वचन का मूल आशय यह है कि जब तक मनुष्य के अंतर्मन से कुल-जाति का अहंकार और भेदभाव पूरी तरह समाप्त नहीं होता, तब तक उसकी बाहरी शुद्धता और भक्ति का दिखावा एक अपवित्र स्त्री द्वारा शुद्ध जल में स्नान करने के समान निरर्थक है।","mr":"हे वचन सामाजिक आणि आध्यात्मिक व्यवहारातील दुटप्पीपणावर तीव्र प्रहार करते.\n\nजेवणखाण आणि वेशभूषा यांसारख्या बाह्य गोष्टींमध्ये आपली जुनी कर्मकांडे आणि जातपात नष्ट झाली आहे असा दावा काही लोक करतात, परंतु लग्नसंबंध किंवा देवाणघेवाणीच्या प्रत्यक्ष व्यवहारात मात्र ते पुन्हा मूळ कुळ आणि जातीचाच शोध घेतात.\n\nअशा दुटप्पी वागणाऱ्या लोकांना खरा भक्त किंवा आध्यात्मिकदृष्ट्या एकरूप झालेला 'युक्त' कसे म्हणता येईल, असा थेट प्रश्न येथे उपस्थित केला आहे.\n\nकूडलसंगमदेव या परमतत्त्वाला स्मरून हे वचन स्पष्ट करते की, मनातील जातीभेदाची अशुद्धता कायम ठेवून केलेले बाह्य समतेचे प्रदर्शन हे अपवित्र अवस्थेतील स्त्रीने केवळ शुद्ध पाण्याने स्नान करण्यासारखेच वरवरचे आणि निरर्थक ठरते.","fr":"Ce vachana dénonce avec vigueur l'hypocrisie sociale de ceux qui prétendent avoir dépassé les discriminations de caste lorsqu'il s'agit simplement de partager un repas ou de se vêtir, mais qui s'empressent de scruter la lignée et l'origine sociale dès qu'il est question d'alliances matrimoniales.\n\nLe texte souligne l'incohérence profonde d'un tel comportement et refuse de considérer ces individus comme de véritables dévots ou des êtres spirituellement accomplis, car leur égalitarisme ne reste qu'une façade de convenance.\n\nÀ travers l'image frappante d'une femme impure qui se baigne dans une eau pure sans que sa condition intérieure ne change, le vachana illustre l'inutilité d'une réforme superficielle qui ne déracine pas les préjugés de caste au fond de la conscience.\n\nS'adressant à la Réalité suprême sans forme sous la signature spirituelle de Koodalasangamadeva, cette réflexion rappelle que la véritable intégrité spirituelle exige une égalité absolue et sans compromis dans toutes les sphères de l'existence humaine."}},{"no":67,"o":"ಉಟ್ಟು ತೊಟ್ಟು ಪೂಜ್ಯವಾಗಿ ಬಂದ ಜಂಗಮ ವಿಶೇಷವೆಂದು,\n ಕಂತೆ ಬೊಂತೆಯ ಜಂಗಮ ಬಂದಡೆ ಹೀನವೆಂದು\n ಕಂಡೆನಾದಡೆ ಪಂಚಮಹಾಪಾತಕ.\n ಇದು ಕಾರಣ, ಅನ್ನ ವಸ್ತ್ರ ಧನ ಮಾಟದಲ್ಲಿ\n ಎರಡಾಗಿ ಕಂಡೆನಾದಡೆ ನರಕದಲ್ಲಿಕ್ಕುವ,\n ಕೂಡಲಸಂಗಮದೇವ.","t":{"en":"To regard the *Jangama* who arrives richly robed, adorned, and venerable as superior,\nand to regard the *Jangama* who arrives in patched rags and tattered quilt as lowly—\nif I look upon them thus, it is the five great sins.\nTherefore, in offering food, clothing, wealth, and service,\nif I see them as two, he will cast me into hell,\nKoodalasangamadeva.","hi":"पहन-ओढ़कर पूज्य रूप में आए जंगम को विशेष मानकर,\nफटे-पुराने चिथड़ोंवाले जंगम के आने पर उसे हीन मानकर\nदेखूँ तो पंचमहापातक है।\nइस कारण, अन्न, वस्त्र, धन और सेवा में\nदो तरह से देखूँ तो नरक में डालेंगे,\nकूडलसंगमदेव।","mr":"वस्त्रे-अलंकार परिधान करून पूज्य रूपात आलेल्या जंगमाला विशेष म्हणून,\nगोधडी-वाकळ पांघरलेला जंगम आल्यास त्याला हीन म्हणून\nमी पाहिले, तर ते पंचमहापातक ठरेल.\nया कारणास्तव, अन्न, वस्त्र, धन आणि सेवेच्या कृतीत\nमी दोन प्रकारे पाहिले, तर नरकात टाकील,\nकूडलसंगमदेव.","fr":"Si je considère le Jangama venu vêtu et paré avec dignité comme supérieur,\net si, lorsqu'un Jangama arrive vêtu de haillons rapiécés, je le considère comme inférieur,\nc'est commettre les cinq grandes fautes.\nC'est pourquoi, si dans la nourriture, le vêtement, la richesse et le service,\nje fais une distinction entre les deux, il me jettera en enfer,\nKoodalasangamadeva."},"m":{"en":"This Vachana emphasizes the uncompromising ethical principle of equality in revering and serving the Jangama, the wandering spiritual seeker and guide.\n\nIt strongly condemns the superficial tendency to judge spiritual stature by external appearances, declaring it one of the five great sins to treat a richly dressed, respectable-looking Jangama as superior while looking down upon one dressed in tattered rags.\n\nTrue service requires offering food, clothing, and wealth with complete impartiality, free from any prejudice based on outward status or attire.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, the Vachana concludes that harbouring any sense of discrimination in the act of giving leads to spiritual downfall.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक ज्ञान का प्रसार करने वाले और विरक्त जीवन जीने वाले जंगमों (प्रबुद्ध साधकों) का मूल्यांकन उनके बाहरी वेशभूषा या आर्थिक स्थिति के आधार पर नहीं किया जाना चाहिए।\n\nयदि कोई साधक सुंदर वस्त्र और आभूषण पहनकर सम्माननीय रूप में आए तो उसे विशेष मानना, और फटे-पुराने चिथड़े या गुदड़ी पहनकर आने वाले जंगम को हीन समझना पंचमहापाप के समान घोर अपराध है।\n\nयह वचन स्पष्ट करता है कि अन्न, वस्त्र, धन के अर्पण और सेवा-सत्कार के व्यवहार में किसी भी प्रकार का भेदभाव या दोहरा मापदंड नहीं होना चाहिए।\n\nनिराकार परमतत्त्व कूडलसंगमदेव के समक्ष यह दृढ़ निष्ठा व्यक्त की गई है कि बाहरी दिखावे के आधार पर जंगमों की सेवा में अंतर करना मनुष्य को सीधे पतन और नरक की ओर ले जाता है।","mr":"आध्यात्मिक ज्ञान आणि भक्तीचा प्रसार करणाऱ्या जंगम साधकांचा सन्मान करताना त्यांच्या बाह्य वेशभूषेवरून किंवा श्रीमंती-गरिबीवरून भेदभाव करणे पूर्णपणे चुकीचे आहे, हा विचार या वचनातून मांडला आहे.\n\nउत्तम वस्त्रे व अलंकार परिधान केलेल्या जंगमाला श्रेष्ठ मानणे आणि फाटकी गोधडी पांघरलेल्या साध्या जंगमाला तुच्छ लेखणे हे पंचमहापातकासारखे घोर पाप आहे.\n\nअन्न, वस्त्र, धन अर्पण करताना किंवा सेवेच्या आचरणात अशा प्रकारे दुजाभाव केल्यास कूडलसंगमदेव म्हणून संबोधले जाणारे परमतत्त्व त्याचे कठोर परिणाम भोगायला लावते, असा इशारा देत हे वचन बाह्य आडंबरापेक्षा समतेचे आणि निखळ सेवाभावाचे महत्त्व अधोरेखित करते.","fr":"Ce vachana met en lumière le principe d'égalité absolue dans l'accueil et la considération dus au Jangama, l'être spirituel réalisé qui chemine et partage la connaissance.\n\nIl dénonce fermement le préjugé superficiel qui consiste à honorer comme supérieur un Jangama vêtu avec apparat, tout en méprisant comme inférieur celui qui se présente vêtu de simples haillons rapiécés.\n\nÉtablir une telle discrimination fondée sur l'apparence extérieure est assimilé ici à la plus grave des fautes morales, qualifiée de quintuple grand péché.\n\nAinsi, en prenant à témoin la Réalité suprême sans forme invoquée sous le nom de Koodalasangamadeva, le texte affirme que faire la moindre différence entre eux lors du partage de la nourriture, des vêtements, des biens ou du service mène inévitablement à la déchéance spirituelle."}},{"no":68,"o":"ಉತ್ತಮಕುಲದಲ್ಲಿ ಹುಟ್ಟಿದೆನೆಂಬ\n ಕಷ್ಟತನದ ಹೊರೆಯ ಹೊರಿಸದಿರಯ್ಯಾ.\n ಕಕ್ಕಯ್ಯನೊಕ್ಕುದನಿಕ್ಕ ನೋಡಯ್ಯಾ,\n ದಾಸಯ್ಯ ಶಿವದಾನವನೆರೆಯ ನೋಡಯ್ಯಾ,\n ಮನ್ನಣೆಯ ಚೆನ್ನಯ್ಯನೆನ್ನುವ ಮನ್ನಿಸ.\n ಉನ್ನತ ಮಹಿಮ,\n ಕೂಡಲಸಂಗಮದೇವಾ, ಶಿವಧೋ ಶಿವಧೋ!","t":{"en":"Thenotion that I was born in a high caste—\ndo not make me bear that burden of misery, O Lord.\nLook, Kakkayya will not offer me his leftovers, O Lord;\nlook, Dasayya will not pour out Shiva's grace for me, O Lord;\nrevered Chennayya will not show me regard.\nO you of exalted glory,\nO Koodalasangamadeva, alas, Shiva, alas, Shiva!","hi":"उत्तम कुल में जन्मा हूँ—कहने की\nकठिनाई का बोझ मुझ पर मत लादिए, हे स्वामी।\nकक्कय्या उच्छिष्ट प्रसाद परोसने पर भी मेरी ओर नहीं देखते, हे स्वामी,\nदासय्या शिवदान उँड़ेलने पर भी मेरी ओर नहीं देखते, हे स्वामी,\nआदरणीय चेन्नय्या भी मुझे स्वीकार नहीं करते।\nहे उन्नत महिमावान,\nहे कूडलसंगमदेव, शिवधो शिवधो!","mr":"उत्तम कुळात जन्मलो आहे असे म्हणण्याचे\nकष्टप्रद ओझे माझ्यावर लादू नकोस, हे प्रभो!\nकक्कय्या उष्टे-उरलेले वाढतो की नाही ते पाहत नाही, हे प्रभो;\nदासय्या शिवदान ओततो की नाही ते पाहत नाही, हे प्रभो;\nसन्माननीय चेन्नय्या मला मान देत नाही.\nहे उन्नत महिमावान,\nहे कूडलसंगमदेवा, शिवधो शिवधो!","fr":"Ne me fais pas porter, ô Seigneur, le pénible fardeau\nde dire que je suis né dans une haute caste.\nVois, Kakkayya ne daigne pas même me jeter ses restes ;\nvois, Dasayya ne daigne pas me verser le don de Shiva ;\nle vénéré Chennayya ne m'accorde aucune considération.\nÔ Toi de gloire suprême,\nÔ Koodalasangamadeva, hélas, par Shiva, hélas !"},"m":{"en":"This Vachana explains that birth into a socially privileged caste is not a blessing, but rather a heavy and painful burden that obstructs genuine spiritual communion.\n\nBy invoking revered Sharanas from marginalized backgrounds—Kakkayya, Dasayya, and the esteemed Channayya—the speaker laments that the stigma of high birth prevents them from offering sacred leftovers, sharing in spiritual grace, or extending their acceptance.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalasangamadeva, this poignant cry against caste hierarchy affirms that true spiritual nobility belongs to the realized Sharanas, while social superiority only alienates a seeker from the fellowship of the enlightened.","hi":"इस वचन का केंद्रीय भाव यह है कि उच्च कुल में जन्म लेने की सामाजिक प्रतिष्ठा वास्तव में आध्यात्मिक मार्ग में एक कष्टदायी बोझ के समान है।\n\nइसमें निराकार परमतत्त्व कूडलसंगमदेव को संबोधित करते हुए यह गहरा दुःख व्यक्त किया गया है कि कथित उच्च कुल में जन्म होने के कारण सच्चे शरणों का सान्निध्य और कृपा प्राप्त करने में बाधा आती है।\n\nयहाँ कक्कय्या, दासय्या और आदरणीय चेन्नय्या जैसे महान शरणों का उदाहरण देते हुए बताया गया है कि कुल के इस भेद के कारण वे भी प्रसादान्न, शिवदान (आध्यात्मिक कृपा) या अपना स्नेह व सम्मान प्रदान करने से संकोच करते हैं।\n\nइस प्रकार यह वचन जन्मजात जातीय श्रेष्ठता के अहंकार को नकारते हुए शरण समाज की आध्यात्मिक समता और सच्चे भक्तों की स्वीकृति को ही सर्वोच्च मानता है।","mr":"हे वचन स्पष्ट करते की, तथाकथित उच्च कुळात जन्माला येणे हा कोणताही विशेषाधिकार नसून, खऱ्या आध्यात्मिक वाटचालीत आणि शरण संगतीत येणारा तो एक कष्टदायक भार आहे.\n\nउच्च कुळाच्या अहंकारामुळे कक्कय्य आपला उरलेला प्रसाद देत नाही, दासय्य शिवदान करत नाही आणि आदरणीय चन्नय्यदेखील आपल्याला जवळ करत नाही, अशी खंत या वचनातून व्यक्त झाली आहे.\n\nम्हणूनच, महान महिमा असणाऱ्या कूडलसंगमदेव या परमतत्त्वाकडे वचनकार अत्यंत व्याकूळतेने अशी आर्त विनवणी करतात की, भक्तांपासून दूर लोटणाऱ्या या उच्च कुळाच्या जन्माचे ओझे माझ्यावर लादू नकोस.\n\nशरणांच्या आध्यात्मिक समतेच्या विचारात जन्मजात उच्चतेला कोणतेही स्थान नसून, अशा कुळाभिमानामुळे खऱ्या शिवशरणांच्या कृपेला आणि संगतीला मुकावे लागते, हेच या वचनाचे मुख्य मर्म आहे.","fr":"Ce vachana met en lumière le poids étouffant de la naissance dans une caste dite supérieure, que le poète considère comme un véritable fardeau d'affliction plutôt qu'un privilège.\n\nEn raison de ce statut social hérité, il déplore d'être tenu à l'écart par les Sharanas issus des communautés marginalisées : Kakkayya ne lui offre pas ses restes de nourriture, Dasayya ne lui verse pas le don sacré du babeurre, et le vénéré Channayya ne daigne même pas lui accorder son estime.\n\nCette douleur révèle que l'orgueil de la haute naissance crée un mur d'exclusion qui prive l'individu de la grâce, de la fraternité et de l'humilité authentique des véritables chercheurs spirituels.\n\nÀ travers un cri de détresse adressé à la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva, le texte rejette radicalement la hiérarchie des castes et aspire à une égalité spirituelle où seule compte la communion humaine."}},{"no":69,"o":"ಉತ್ತಮ ಮಧ್ಯಮ ಕನಿಷ್ಠವೆಂದು, ಬಂದ ಜಂಗಮವನೆಂದೆನಾದಡೆ\n ನೊಂದೆನಯ್ಯಾ, ಬೆಂದೆನಯ್ಯಾ, ಎನ್ನ ಕಿಚ್ಚು ಎನ್ನ ಸುಟ್ಟಿತ್ತು.\n ಸುಖಿಜಂಗಮ, ಸಾಮಾನ್ಯಜಂಗಮ ಉಂಟೆ,\n ಕೂಡಲಸಂಗಮದೇವಾ?","t":{"en":"If I call the *Jangama* who has come superior, middling, or inferior,\nI am pained, O Lord, I am scorched, O Lord; my own fire has burned me.\nIs there a blissful *Jangama* and an ordinary *Jangama*,\nO Koodalasangamadeva?","hi":"आए हुए जंगम को उत्तम, मध्यम, कनिष्ठ कहूँ तो,\nमैं व्यथित हुआ, हे स्वामी, मैं दग्ध हुआ, हे स्वामी, मेरी ही आग ने मुझे जला दिया।\nक्या सुखी जंगम, सामान्य जंगम भी होते हैं,\nहे कूडलसंगमदेव?","mr":"आलेल्या जंगमाला उत्तम, मध्यम आणि कनिष्ठ असे मी म्हटलो तर,\nहे प्रभो, मी दुखावलो, मी होरपळलो, माझ्याच अग्नीने मला जाळले.\nसुखीजंगम आणि सामान्यजंगम असे असतात का,\nहे कूडलसंगमदेवा?","fr":"Si je dis du Jangama qui est venu qu'il est supérieur, moyen ou inférieur,\nj'en souffre, ô Seigneur, je me consume, ô Seigneur ; mon propre feu m'a brûlé.\nExiste-t-il un Jangama bienheureux et un Jangama ordinaire,\nô Koodalasangamadeva ?"},"m":{"en":"The central message of this Vachana is a firm rejection of all forms of hierarchy and discrimination when receiving and serving the Jangama—the wandering spiritual seekers, enlightened Sadhakas, and embodiments of dynamic consciousness.\n\nThis Vachana explains that classifying an arriving Jangama as superior, middling, or inferior causes deep spiritual anguish, acting like an internal fire of prejudice and ego that ultimately burns and destroys the devotee's own inner peace.\n\nBy questioning whether there can ever be a distinction between a privileged, realized Jangama and an ordinary one, the Vachana highlights the Sharana principle of absolute equality among all who walk the spiritual path.\n\nAddressed to the Formless Supreme Reality through the ankitanama Kudalasangamadeva, it affirms that genuine devotion requires seeing the same undivided divine consciousness in every Jangama without judgment or gradation.","hi":"इस वचन का मूल भाव यह है कि घर पर आए हुए जंगम, अर्थात् आध्यात्मिक साधक या प्रबुद्ध जनों में उत्तम, मध्यम और कनिष्ठ जैसा कोई भी भेदभाव नहीं करना चाहिए।\n\nयदि साधक ऐसे प्रबुद्ध जंगमों को ऊंच-नीच या श्रेष्ठ-कनिष्ठ की संकुचित दृष्टि से आंकता है, तो उसके भीतर के भेदभाव की यह अग्नि स्वयं उसे ही पीड़ा पहुंचाती है और जलाकर नष्ट कर देती है।\n\nनिराकार परमतत्त्व कूडलसंगमदेव को संबोधित यह वचन स्पष्ट करता है कि जंगम स्वरूप में 'सुखी जंगम' या 'सामान्य जंगम' जैसा कोई विभाजन हो ही नहीं सकता, क्योंकि आध्यात्मिक और मानवीय दृष्टि से सभी जंगम समान हैं।","mr":"हे वचन स्पष्ट करते की, आध्यात्मिक ज्ञान पसरवणाऱ्या प्रबुद्ध साधकांमध्ये किंवा चैतन्यस्वरूप समाजामध्ये म्हणजेच जंगमांमध्ये उच्च, मध्यम किंवा कनिष्ठ असा कोणताही भेदभाव करणे अयोग्य आहे.\n\nजर मनात अशा उतरंडीचा किंवा भेदाचा विचार आला, तर ती स्वतःच्याच मनातील संकुचित भावना एखाद्या अग्नीप्रमाणे स्वतःलाच आतून पोळून काढते आणि तीव्र वेदना देते.\n\nकूडलसंगमदेव या निराकार परमतत्त्वाला उद्देशून हे वचन हा मूलभूत विचार मांडते की, जंगम हा सुखी किंवा सामान्य असा वेगवेगळा असूच शकत नाही; कारण सर्वत्र एकच शुद्ध चैतन्य समान रूपाने वास करत असते.","fr":"Ce vachana rejette catégoriquement toute forme de discrimination ou de hiérarchie à l'égard des Jangama qui se présentent.\n\nJuger ces chercheurs spirituels en les classant comme supérieurs, moyens ou inférieurs constitue une faute intérieure grave, comparée ici à un feu qui consume et tourmente celui-là même qui porte un tel jugement.\n\nS'adressant à la Réalité suprême sans forme à travers la signature spirituelle Koodalasangamadeva, le texte affirme l'égalité absolue des Jangama, en rappelant qu'il ne saurait exister de distinction entre un Jangama privilégié et un Jangama ordinaire."}}]},
{"id":"s1","n":{"en":"Allamaprabhu","hi":"अल्लमप्रभु","mr":"अल्लमप्रभू","fr":"Allamaprabhu"},"v":[{"no":490,"o":"ಕಂಗಳ ಮುಂದಣ ಕತ್ತಲೆ ಇದೇನೋ?\n ಮನದ ಮುಂದಣ ಮರವೆ ಇದೇನೊ?\n ಒಳಗಣ ರಣರಂಗ ಹೊರಗಣ ಶೃಂಗಾರ!\n ಬಳಕೆಗೆ ಬಂದ ಬಟ್ಟೆ ಇದೇನೊ ಗುಹೇಶ್ವರಾ?","t":{"en":"What is this darkness before the eyes?\nWhat is this forgetfulness before the mind?\nA battlefield within, adornment without!\nWhat is this way that has come into practice, O Guheshwara?","hi":"आँखों के आगे का अंधकार यह क्या है?\nमन के आगे का विस्मरण यह क्या है?\nभीतर का रणरंग, बाहर का शृंगार!\nप्रचलन में आया यह मार्ग क्या है, हे गुहेश्वर?","mr":"डोळ्यांपुढील हा अंधार काय आहे?\nमनापुढील ही विस्मृती काय आहे?\nआतील रणरंग, बाहेरील शृंगार!\nव्यवहारात आलेली ही वाट काय आहे, हे गुहेश्वरा?","fr":"Qu'est-ce donc que cette obscurité devant les yeux ?\nQu'est-ce donc que cet oubli devant l'esprit ?\nUn champ de bataille à l'intérieur, une parure à l'extérieur !\nQu'est-ce donc que cette voie entrée dans l'usage, ô Guheshwara ?"},"m":{"en":"This Vachana examines the spiritual contradiction of human existence, where inner ignorance and turmoil are masked by outward adornments.\n\nThe darkness before the eyes and the forgetfulness within the mind symbolize a lack of true awareness (Arivu), which prevents one from perceiving the truth clearly.\n\nBy contrasting the \"battlefield within\" against \"external decoration,\" the Vachana exposes the hypocrisy of maintaining a pleasing worldly appearance while the inner self remains consumed by conflict and restlessness.\n\nAddressing the Formless Supreme Consciousness as Guheshwara, the Vachana questions how such a superficial and conflicted way of living has become the accepted path in the world.","hi":"इस वचन का केंद्रीय भाव मनुष्य के बाहरी आचरण और उसकी आंतरिक स्थिति के बीच के गहरे विरोधाभास तथा आत्म-विस्मृति पर प्रश्न उठाना है।\n\nयहाँ यह दर्शाया गया है कि आँखों के सामने अज्ञान का अंधकार छाया हुआ है और मन के भीतर अपने वास्तविक स्वरूप की विस्मृति घर कर गई है।\n\nअंतर्मन में निरंतर द्वंद्व और अशांति का रणक्षेत्र बना हुआ है, किंतु बाहर से मनुष्य स्वयं को सुंदर और सुसज्जित दिखाने का आडंबर करता है।\n\nनिराकार परमतत्त्व गुहेश्वर को संबोधित करते हुए यह वचन इस बात पर गहरा आश्चर्य व्यक्त करता है कि मनुष्य ने अपने दैनिक जीवन के व्यवहार में यह कैसी विसंगतिपूर्ण और कृत्रिम राह अपना ली है।","mr":"हे वचन मानवाच्या अंतर्बाह्य आयुष्यातील विरोधाभास आणि त्याची आध्यात्मिक संभ्रमावस्था अचूकपणे उलगडून दाखवते.\n\nडोळ्यांसमोर पसरलेला अज्ञानाचा अंधार आणि मनावर आलेले आत्मविस्मृतीचे सावट यामुळे मानवी जाणिवेची वाट कशी खुंटली आहे, याबद्दल येथे सखोल चिंतन व्यक्त झाले आहे.\n\nअंतर्मनात वासना व संघर्षाचे रणकंदन सुरू असताना बाह्यतः मात्र शृंगाराचा आणि सुखवस्तूपणाचा देखावा मिरवण्याच्या मानवी दुटप्पीपणावर हे वचन प्रहार करते.\n\n'गुहेश्वरा' या निराकार परमतत्त्वाला स्मरून, अशा या खोट्या आणि दिखाऊ जीवनशैलीलाच माणसाने आपली नेहमीची वहिवाट कसे बनवले आहे, असा अंतर्मुख करणारा प्रश्न या वचनातून उपस्थित केला आहे.","fr":"Ce vachana met en lumière la profonde contradiction de l'existence humaine, marquée par une cécité spirituelle qui voile le regard et un oubli qui obscurcit la conscience.\n\nIl révèle le contraste saisissant entre le tumulte intérieur, semblable à un véritable champ de bataille, et la parure séduisante que l'on affiche à l'extérieur pour masquer ce désordre.\n\nEn s'adressant à Guheshwara, la Réalité suprême sans forme, ce poème interroge avec lucidité cette voie d'illusion et de duplicité qui est pourtant devenue la norme de la vie quotidienne."}},{"no":491,"o":"ಕಂಡುದೆಲ್ಲ ಪಾವನ, ಕೇಳಿತ್ತೆಲ್ಲ ಪರಮಬೋಧೆ,\n ಮುಟ್ಟಿತ್ತೆಲ್ಲ ಪರುಷದ ಸೋಂಕು,\n ಒಡನೆ ನುಡಿದವರೆಲ್ಲ ಸದ್ಯೋನ್ಮುಕ್ತರು,\n ಸುಳಿದ ಸುಳುಹೆಲ್ಲ ಜಗತ್ಪಾವನ, ಮೆಟ್ಟಿದ ಧರೆಯೆಲ್ಲ ಅವಿಮುಕ್ತ ಕ್ಷೇತ್ರ,\n ಸೋಂಕಿದ ಜಲವೆಲ್ಲ ಪುಣ್ಯತೀರ್ಥಂಗಳು,\n ಶರಣೆಂದು ಭಕ್ತಿಯ ಮಾಡಿದವರೆಲ್ಲರು ಸಾಯುಜ್ಯರು.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಸುಳುಹಿನ ಸೊಗಸನುಪಮಿಸಬಾರದು.","t":{"en":"All that is seen becomes sanctified, all that is heard becomes supreme teaching,\nall that is touched becomes the touch of the philosopher's stone,\nall who speak with you are liberated at once,\nevery movement of your presence sanctifies the world, all the earth you tread becomes the realm of Avimukta,\nall the water you touch becomes sacred waters,\nall who bow in surrender and offer devotion attain union with the Divine.\nO Guheshwara, the beauty of your living presence is beyond compare.","hi":"देखा हुआ सब पावन है, सुना हुआ सब परमबोध है,\nछुआ हुआ सब पारस का स्पर्श है,\nसाथ बोलनेवाले सब सद्योन्मुक्त हैं,\nविचरने की हर आहट जगत्पावन है, पग धरने की सारी धरा अविमुक्त क्षेत्र है,\nछुआ हुआ सारा जल पुण्यतीर्थ है,\nशरण कहकर भक्ति करनेवाले सभी सायुज्य हैं।\nहे गुहेश्वर, आपके विचरण के सौंदर्य की उपमा नहीं दी जा सकती।","mr":"जे काही पाहिले ते सर्व पावन, जे काही ऐकले तो सर्व परमबोध,\nज्याला स्पर्श केला तो सर्व परिसाचा स्पर्श,\nसोबत बोलणारे सर्व सद्योन्मुक्त आहेत,\nफिरलेला प्रत्येक संचार जगत्पावन, पाय ठेवलेली सर्व धरती अविमुक्त क्षेत्र,\nस्पर्श केलेले सर्व पाणी पुण्यतीर्थे आहेत,\nशरण म्हणून भक्ती करणारे सर्वजण सायुज्य पावलेले आहेत.\nहे गुहेश्वरा, तुमच्या संचाराच्या सौंदर्याला उपमा देता येत नाही.","fr":"Tout ce qui est vu est sanctifié, tout ce qui est entendu est l'enseignement suprême,\ntout ce qui est touché est le contact de la pierre philosophale,\ntous ceux avec qui l'on s'entretient sont libérés sur-le-champ,\nchaque mouvement est la sanctification du monde, toute terre foulée est le lieu sacré d'Avimukta,\ntoutes les eaux effleurées sont des gués sacrés,\ntous ceux qui disent « Je prends refuge » et pratiquent la *Bhakti* ont atteint l'union ultime.\nÔ Guheshwara, la splendeur de votre présence en mouvement est incomparable."},"m":{"en":"This Vachana describes the transformative presence of the Formless Supreme Consciousness, addressed here as Guheshwara, which sanctifies every aspect of existence.\n\nWhen one is attuned to this divine presence, every sight becomes pure, every sound turns into supreme wisdom, and every touch carries the alchemical power of the philosopher's stone.\n\nIn this state of awareness, the very earth one walks upon becomes a sacred realm of liberation, ordinary water becomes holy, and all who interact or offer devotion attain immediate spiritual union and freedom.\n\nUltimately, the Vachana conveys that the grace and movement of the Absolute through the living world possess an incomparable beauty that transcends all conventional notions of sacred places and rituals.","hi":"इस वचन का केंद्रीय भाव यह है कि निराकार परमतत्त्व (जिसे यहाँ 'गुहेश्वर' के रूप में संबोधित किया गया है) के साथ एकात्म होने और उसकी जीवंत अनुभूति से सृष्टि का प्रत्येक अनुभव पवित्र तथा दिव्य बन जाता है।\n\nइस अवस्था में साधक जो कुछ देखता है वह पावन हो जाता है, जो सुनता है वह परम ज्ञान बन जाता है और उसका प्रत्येक स्पर्श पारस मणि के समान रूपांतरणकारी हो जाता है।\n\nऐसे चैतन्य के सान्निध्य में संवाद करने वाले तत्काल मुक्त हो जाते हैं; जहाँ इसका संचार होता है वह संपूर्ण जगत पवित्र हो जाता है, चरणों से स्पर्श की गई भूमि अविमुक्त क्षेत्र और छुआ गया जल पुण्यतीर्थ बन जाता है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि जो साधक 'शरणु' कहकर समर्पण भाव से भक्ति करते हैं, वे परम सत्य में लीन (सायुज्य) हो जाते हैं और इस दिव्य उपस्थिति के अनुपम सौंदर्य की किसी से तुलना नहीं की जा सकती।","mr":"हे वचन गुहेश्वर या नावाने संबोधित केलेल्या निराकार परमतत्त्वाच्या चैतन्यमय अस्तित्वाची आणि अनुभूतीची अलौकिकता स्पष्ट करते.\n\nपरम सत्याचा साक्षात्कार झालेल्या या अवस्थेत पाहिलेले सर्व काही पवित्र होते, ऐकलेला प्रत्येक शब्द परमज्ञानाचा बोध ठरतो आणि ज्याला स्पर्श होतो तिथे परिसस्पर्शाप्रमाणे रूपांतर घडते.\n\nअशा चैतन्याचा वावर संपूर्ण जगाला पावन करतो; जिथे पाऊल पडते ती भूमी मुक्त क्षेत्र बनते आणि स्पर्श झालेले पाणी पुण्यतीर्थ ठरते.\n\nया जागृत चैतन्याशी संवाद साधणारे तत्काळ मुक्त होतात आणि शरण जाऊन भक्ती करणारे परमतत्त्वाशी एकरूप होतात, कारण या दिव्य अस्तित्वाचे सौंदर्य कोणत्याही उपमेपलीकडचे आहे.","fr":"Ce vachana met en lumière le rayonnement sanctifiant d’une conscience éveillée et pleinement unie à la Réalité suprême sans forme, invoquée sous le nom de Guheshwara.\n\nLorsque l’être atteint une telle plénitude spirituelle, ses perceptions et ses actes transfigurent le monde : son regard purifie tout ce qu’il voit, son écoute révèle un enseignement suprême et son toucher devient semblable à la pierre philosophale qui transforme la matière en or.\n\nPar sa seule présence, la terre qu’il foule devient un espace de libération, l’eau qu’il effleure devient sacrée, et ceux qui échangent des paroles avec lui ou s’inclinent avec dévotion connaissent immédiatement la liberté intérieure et l’union spirituelle.\n\nAinsi, la manifestation vivante du Principe absolu à travers un tel être possède une beauté et une grâce incomparables, qui dépassent toute description."}},{"no":492,"o":"ಕಂಡೆನೆಂಬುದು ಕಂಗಳ ಮರವೆ,\n ಕಾಣೆನೆಂಬುದು ಮನದ ಮರವೆ,\n ಕೂಡಿದೆನೆಂಬುದು ಅರುಹಿನ ಮರವೆ,\n ಅಗಲಿದೆನೆಂಬುದು ಮರಹಿನ ಮರವೆ.\n ಇಂತು ಕಂಡೆ ಕಾಣೆ ಕೂಡಿದೆ ಅಗಲಿದೆ ಎಂಬ,\n ಭ್ರಾಂತಿಸೂತಕವಳಿದು ನೋಡಲು\n ಗುಹೇಶ್ವರಲಿಂಗವನಗಲಲೆಡೆಯಿಲ್ಲ ಕೇಳಾ, ಎಲೆ ತಾಯೆ,","t":{"en":"To say \"I have seen\" is the forgetfulness of the eyes,\nto say \"I do not see\" is the forgetfulness of the mind,\nto say \"I have united\" is the forgetfulness of awareness,\nto say \"I have parted\" is the forgetfulness of forgetfulness itself.\nThus, when the taint of delusion in saying \"I saw, I do not see, I united, I parted\"\nperishes and one beholds,\nthere is no space to be parted from Guheshwaralinga—listen, O mother!","hi":"देखा है कहना आँखों की विस्मृति है,\nनहीं देखा है कहना मन की विस्मृति है,\nमिल गया हूँ कहना बोध की विस्मृति है,\nबिछुड़ गया हूँ कहना विस्मृति की विस्मृति है।\nइस प्रकार देखा, नहीं देखा, मिला, बिछुड़ा कहने के,\nभ्रांति-सूतक के मिटने पर देखने से,\nगुहेश्वरलिंग से बिछुड़ने का कोई स्थान नहीं है, सुनो, हे माँ!","mr":"पाहिले म्हणणे हे डोळ्यांचे विस्मरण आहे,\nपाहत नाही म्हणणे हे मनाचे विस्मरण आहे,\nएकत्र आलो म्हणणे हे जाणिवेचे विस्मरण आहे,\nविलग झालो म्हणणे हे विस्मरणाचे विस्मरण आहे।\nअशा प्रकारे पाहिले, पाहत नाही, एकत्र आलो, विलग झालो असे म्हणणाऱ्या\nभ्रांतीच्या सूतकाचा नाश होऊन पाहता,\nगुहेश्वरलिंगापासून विलग होण्यास जागाच नाही, ऐक हे माते।","fr":"Dire que j'ai vu est l'oubli des yeux,\nDire que je ne vois pas est l'oubli de l'esprit,\nDire que je me suis uni est l'oubli de la conscience,\nDire que je me suis séparé est l'oubli de l'oubli même.\nAinsi, dire que j'ai vu, que je ne vois pas, que je me suis uni ou que je me suis séparé —\nlorsque l'on regarde après que cette souillure rituelle (*Sutaka*) de l'égarement s'est éteinte,\nil n'y a nul lieu où se séparer du Linga Guheshwara ; écoute donc, ô mère."},"m":{"en":"This Vachana examines the subtle illusions of duality that persist even in spiritual inquiry, pointing out that claiming to have seen the Divine is merely a delusion of the eyes, while claiming not to have seen is a delusion of the mind.\n\nSimilarly, feeling that one has united with the Supreme Reality is a forgetfulness of true awareness (Aruhu), and feeling separated from it is a deeper ignorance born of spiritual forgetfulness (Marave), because both states falsely assume a division between the seeker and the Divine.\n\nThe spiritual significance of this Vachana lies in transcending the impure illusions of seeing and not seeing, uniting and separating.\n\nWhen these dualistic notions dissolve, one realizes that there is no space or possibility of ever being separated from the all-pervasive Formless Supreme Consciousness addressed as Guheshwaralinga.","hi":"इस वचन का केंद्रीय भाव यह है कि परमतत्त्व के संदर्भ में देखने या न देखने, तथा मिलने या बिछड़ने की भावनाएँ केवल द्वैतजनित विस्मृति और भ्रम का परिणाम हैं।\n\nयह वचन स्पष्ट करता है कि परमतत्त्व को 'मैंने देख लिया' कहना आँखों का भ्रम है और 'मैंने नहीं देखा' कहना मन की अज्ञानता है; इसी प्रकार 'मैं उससे मिल गया' कहना चेतना (अरुहु) की भूल है और 'मैं उससे अलग हो गया' कहना विस्मृति (मरहु) का ही भ्रम है।\n\nदेखने, न देखने, जुड़ने और बिछड़ने के इन द्वैतवादी भ्रम-रूपी सूतकों को मिटाकर जब शुद्ध बोध से देखा जाता है, तब यह अनुभव होता है कि सर्वव्यापी निराकार गुहेश्वरलिंग से अलग होने के लिए कहीं कोई स्थान ही नहीं है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि शुद्ध चैतन्य में न कोई मिलन है और न ही कोई वियोग, क्योंकि द्वैत का भ्रम मिटते ही साधक को परमतत्त्व के साथ अपनी शाश्वत अभिन्नता का बोध हो जाता है।","mr":"हे वचन मानवी मन आणि जाणिवांमधील द्वैतभावावर व अज्ञानावर प्रकाश टाकते.\n\nपरमतत्त्वाला बाह्य डोळ्यांनी पाहिले असे म्हणणे हा दृष्टीचा भ्रम आहे, तर ते पाहिले नाही असे मानणे हे मनाचे अज्ञान आहे.\n\nत्याच्याशी एकरूप झालो असे म्हणणे ही खऱ्या जाणिवेची विस्मृती आहे आणि त्याच्यापासून दुरावलो असे समजणे हा केवळ अज्ञानातून निर्माण झालेला समज आहे.\n\nपाहणे किंवा न पाहणे, तसेच मीलन किंवा विरह या सर्व मानसिक भ्रमांच्या पलीकडे जाऊन पाहिल्यास, गुहेश्वरलिंग हे सर्वव्यापी परमतत्त्व आपल्यापासून कधीच वेगळे नाही आणि त्याच्यापासून दूर जाण्यास कोणतीही जागा उरत नाही, हाच या वचनाचा गाभा आहे.","fr":"Ce vachana met en lumière la manière dont les notions d'expérience ou d'absence d'expérience spirituelle reposent toutes sur un oubli fondamental de notre nature véritable.\n\nAffirmer avoir vu la Réalité suprême sans forme est une illusion des yeux, croire ne pas l'avoir vue est un oubli de l'esprit, tandis que les sentiments d'union ou de séparation trahissent un voilement de la conscience pure (Aruhu) et de l'ignorance elle-même.\n\nCes états opposés — voir ou ne pas voir, s'unir ou se séparer — constituent une souillure née de l'illusion dualiste qui maintient l'être dans la division.\n\nLorsque cette confusion illusoire se dissipe, on réalise avec évidence qu'il n'existe aucun espace où l'on puisse être séparé du principe absolu désigné par Guheshwaralinga, car cette présence infinie demeure partout et en tout temps indissociable de l'être."}},{"no":493,"o":"ಕರ್ಪುರದ ಗಿರಿಯ ಉರಿ ಹಿಡಿದಡೆ ಇದ್ದಿಲುಂಟೆ?\n ಮಂಜಿನ ಶಿವಾಲಯಕ್ಕೆ ಬಿಸಿಲ ಕಳಸವುಂಟೆ?\n ಕೆಂಡದ ಗಿರಿಯನರಗಿನ ಬಾಣದಲೆಚ್ಚಡೆ,\n ಮರಳಿ ಬಾಣವನರಸಲುಂಟೆ?\n ಗುಹೇಶ್ವರನೆಂಬ ಲಿಂಗವನರಿದು\n ಮರಳಿ ನೆನೆಯಲುಂಟೆ?","t":{"en":"When fire catches a mountain of camphor, is there any charcoal left?\nCan a temple of mist bear a pinnacle of sunlight?\nWhen one shoots a mountain of glowing embers with an arrow of lac,\ncan one search for the arrow again?\nHaving realized the *Linga* called Guheshwara,\ncan one remember it again?","hi":"कर्पूर के पर्वत में आग लगने पर क्या कोयला होता है?\nहिम के शिवालय पर क्या धूप का कलश होता है?\nअंगारे के पर्वत को लाख के बाण से बेधने पर,\nक्या फिर से बाण को खोजा जा सकता है?\nगुहेश्वर नामक लिंग को जानकर,\nक्या फिर से स्मरण किया जा सकता है?","mr":"कापराच्या पर्वताने पेट घेतल्यावर कोळसा उरतो का?\nधुक्याच्या शिवालयाला उन्हाचा कळस असतो का?\nनिखाऱ्याच्या पर्वताला लाखाच्या बाणाने भेदल्यावर,\nपुन्हा तो बाण शोधता येतो का?\nगुहेश्वर नावाच्या लिंगाला जाणल्यावर\nपुन्हा त्याचे स्मरण करणे उरते का?","fr":"Si le feu s'empare d'une montagne de camphre, reste-t-il du charbon ?\nUn sanctuaire de Shiva fait de brume peut-il avoir un faîte de soleil ?\nSi l'on décoche une flèche de laque contre une montagne de braises,\npeut-on chercher à nouveau la flèche ?\nAprès avoir connu le *Linga* que l'on appelle Guheshwara,\npeut-on encore se souvenir à nouveau ?"},"m":{"en":"This Vachana explains the state of complete dissolution of the individual self upon realizing the Formless Supreme Consciousness, addressed here through the ankitanama Guheshwara.\n\nThrough striking metaphors—such as a mountain of camphor burning without leaving charcoal, a temple of mist unable to bear a pinnacle of sunlight, and an arrow of wax vanishing into a mountain of glowing embers—the Vachana illustrates how the finite self is entirely consumed when it encounters the Absolute.\n\nJust as camphor, mist, and wax leave no trace behind upon meeting fire and heat, a seeker's separate identity and ego dissolve completely in the fire of true realization (Arivu).\n\nWhen one truly realizes the Supreme Reality, the duality between the knower and the known ceases to exist, leaving no separate mind behind to step back and remember or contemplate the Divine again as an external object.","hi":"इस वचन का केंद्रीय भाव यह है कि परम सत्य की पूर्ण अनुभूति हो जाने के बाद साधक का अपना अलग अस्तित्व या अहंकार शेष नहीं रहता।\n\nजिस प्रकार कपूर के पर्वत में आग लगने पर कोयला नहीं बचता, ओस के शिवालय पर धूप का कलश नहीं टिकता, और अंगारों के पहाड़ पर लाख का बाण चलाने पर उसे वापस नहीं खोजा जा सकता, उसी प्रकार अज्ञान और द्वैत ज्ञान की अग्नि में पूरी तरह विलीन हो जाते हैं।\n\nगुहेश्वर रूपी निराकार लिंग-तत्त्व को जानकर उसमें एकरूप हो जाने के बाद, साधक और साध्य का भेद मिट जाता है।\n\nइस परम एकत्व की स्थिति में पहुँचने के पश्चात, फिर से किसी अलग सत्ता के रूप में उसका स्मरण करने की कोई आवश्यकता या संभावना ही नहीं रह जाती।","mr":"हे वचन साधक आणि निराकार परमतत्त्व यांच्यातील पूर्ण अद्वैत आणि विलीनीकरणाची अवस्था प्रभावी रूपकांच्या माध्यमातून स्पष्ट करते.\n\nकापराच्या पर्वताला आग लागल्यावर तिथे कोळसा उरत नाही, धुके किंवा बर्फाच्या मंदिराला उन्हाचा कळस चढवता येत नाही आणि निखाऱ्याच्या डोंगरावर लाखेचा बाण मारल्यास तो बाण परत शोधूनही सापडत नाही, कारण तो त्या अग्नीत पूर्णपणे वितळून एकरूप झालेला असतो.\n\nयाचप्रमाणे, 'गुहेश्वर' या नावाने ओळखल्या जाणाऱ्या शुद्ध चैतन्यस्वरूप लिंगाची एकदा का खऱ्या अर्थाने जाणीव झाली, की साधकाचे स्वतंत्र अस्तित्व आणि द्वैतभाव तिथेच पूर्णपणे विरून जातो.\n\nया परम सत्यात साधक स्वतःच विलीन झाल्यामुळे, तिथे पुन्हा वेगळेपणाने स्मरण करणारा किंवा ध्यान करणारा कोणी उरतच नाही, हा या वचनाचा मुख्य आध्यात्मिक आशय आहे.","fr":"Ce vachana illustre la dissolution totale de l'ego et de la conscience individuelle dans l'expérience de la Réalité suprême sans forme, invoquée ici sous la signature spirituelle de Guheshwara.\n\nÀ travers trois métaphores saisissantes — une montagne de camphre embrasée qui ne laisse aucun charbon, un temple de brume incapable de supporter un faîte de soleil, et une flèche de cire tirée sur une montagne de braises que l'on ne peut jamais retrouver — le texte montre comment le fini s'anéantit sans laisser de trace au contact de l'infini.\n\nDe même que ces éléments fragiles se consument entièrement dans le feu ou la lumière, l'esprit du chercheur spirituel perd toute existence séparée lorsqu'il réalise la Vérité absolue du Linga.\n\nDès lors que cette union parfaite est accomplie, la dualité entre celui qui connaît et ce qui est connu s'efface, rendant superflu et même impossible tout acte ultérieur de souvenir ou de pensée distincte."}},{"no":494,"o":"ಕಬ್ಬು ಬೆಳೆವುದಯ್ಯ ಕರಿಯ ಭೂಮಿಯಿದ್ದಲ್ಲಿ,\n ಉಬ್ಬುಬ್ಬಿ ಬೆಳೆವುದಯ್ಯ ಬಲ ಪ್ರಮಾಣವಿರ್ದಲ್ಲಿ.\n ದಾರಿದ್ರ್ಯವಿದ್ದಲ್ಲಿ ನಿದ್ರೆ ಬೆಳೆವುದಯ್ಯ,\n ಜಟ್ಟಿ ಮಾಸಾಳರಿರ್ದಲ್ಲಿ ಕಾಳಗ ಘನವಪ್ಪುದಯ್ಯ,\n ನಮ್ಮ ಶಿವನ ಸಲೆ ಸಂದ ಶರಣರಾದ ಹಿರಿಯರಿದ್ದಲ್ಲಿ\n ಬುದ್ಧಿ ಬೆಳವುದಯ್ಯ.\n ಇ[ದ] ಕಂಡು ಬೆರಗಾದ ನಮ್ಮ ಗುಹೇಶ್ವರ.","t":{"en":"Sugarcane grows, O brother, where there is black soil,\nand pride swells up and grows, O brother, where there is abundant strength.\nWhere there is poverty, sleep grows, O brother;\nwhere there are mighty wrestlers and warriors, battle becomes fierce, O brother;\nwhere there are elders who are the truly accomplished *Sharanas* of our Shiva,\nwisdom grows, O brother.\nSeeing this, our Guheshwara was struck with wonder.","hi":"गन्ना बढ़ता है हे भाई, काली भूमि होने पर,\nउमड़-उमड़कर बढ़ता है हे भाई, बल का प्रमाण होने पर।\nदरिद्रता होने पर निद्रा बढ़ती है हे भाई,\nपहलवान और महावीर होने पर युद्ध घमासान होता है हे भाई,\nहमारे शिव के सच्चे, सिद्ध शरण रूपी बड़ों के होने पर\nबुद्धि बढ़ती है हे भाई।\nयह देखकर चकित हो गए हमारे गुहेश्वर।","mr":"काळी जमीन जिथे असते, तिथे ऊस पिकतो हो,\nकस-सामर्थ्य जिथे असते, तिथे तो बहरून वाढतो हो.\nदारिद्र्य जिथे असते, तिथे निद्रा वाढते हो,\nमल्ल आणि महावीर जिथे असतात, तिथे रणसंग्राम घनघोर होतो हो,\nआमच्या शिवाचे खरोखरच मान्यवर शरण असलेले ज्येष्ठ जिथे असतात,\nतिथे बुद्धी वाढते हो.\nहे पाहून आमचा गुहेश्वर थक्क झाला.","fr":"La canne à sucre pousse, ô Seigneur, là où se trouve une terre noire ;\nelle pousse avec exubérance, ô Seigneur, là où la vigueur et la juste mesure sont présentes.\nLà où se trouve la pauvreté, le sommeil croît, ô Seigneur ;\nlà où se trouvent de vaillants lutteurs et de grands guerriers, la bataille devient redoutable, ô Seigneur.\nLà où se trouvent les aînés qui sont les Sharanas pleinement accomplis de notre Shiva,\nl'intelligence spirituelle croît, ô Seigneur.\nEn voyant cela, notre Guheshwara fut émerveillé."},"m":{"en":"This Vachana illustrates the natural law that every state or quality flourishes only when placed in its conducive environment.\n\nThrough vivid comparisons—such as sugarcane thriving in fertile black soil, vigor expanding where there is proportionate strength, sleep increasing in poverty, and fierce combat arising among mighty wrestlers—the Vachana shows how surroundings shape outcomes.\n\nDrawing from these everyday observations, the Vachana highlights that true wisdom and higher awareness naturally blossom in the presence of realized elder Sharanas who have attained union with the Divine.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Guheshwara, the closing line expresses wonder at how the spiritual companionship of enlightened elders awakens and nurtures such profound inner intelligence.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस प्रकार किसी भी वस्तु या स्थिति के विकास के लिए उसके अनुकूल वातावरण आवश्यक होता है, ठीक उसी प्रकार आत्मिक ज्ञान और सद्बुद्धि के विकास के लिए सच्चे शरणों का सान्निध्य अनिवार्य है।\n\nयहाँ सांसारिक दृष्टांतों के माध्यम से स्पष्ट किया गया है कि जैसे काली मिट्टी में गन्ना उगता है, सामर्थ्य होने पर उत्साह बढ़ता है, दरिद्रता में आलस्य और निद्रा पनपती है तथा शूरवीर पहलवानों के होने से युद्ध भीषण होता है, वैसे ही प्रत्येक गुण अपने अनुकूल परिवेश में ही फलता-फूलता है।\n\nइसी क्रम में यह वचन रेखांकित करता है कि परमतत्त्व शिव के प्रति पूर्णतः समर्पित और अनुभवी वरिष्ठ शरणों की संगति में रहने से ही मनुष्य के भीतर सच्ची प्रज्ञा और विवेक का उदय होता है।\n\nअंततः, शरणों के सान्निध्य से होने वाले इस आध्यात्मिक बोध के स्वाभाविक विकास का यह अद्भुत विधान इतना विलक्षण है कि स्वयं निराकार परमतत्त्व गुहेश्वर भी इसे देखकर चकित रह जाता है।","mr":"हे वचन सभोवतालच्या पोषक वातावरणाचा आणि संगतीचा मानवी प्रवृत्तीवर व आध्यात्मिक विकासावर कसा परिणाम होतो, हे विविध नैसर्गिक आणि व्यावहारिक दृष्टांतांच्या माध्यमातून स्पष्ट करते.\n\nज्याप्रमाणे सुपीक काळ्या जमिनीत ऊस पिकतो, ताकद आणि प्रमाणबद्धता असेल तिथे भरभराट होते, दारिद्र्यात आळस व झोप वाढते आणि शूर योद्धे एकत्र आले की घनघोर युद्ध होते, त्याचप्रमाणे प्रत्येक गोष्ट तिच्या अनुकूल परिस्थितीतच वाढीस लागते.\n\nयाच न्यायाने, जिथे परमसत्याशी एकरूप झालेले आणि कसोटीला उतरलेले ज्येष्ठ शरण असतात, तिथेच खरी आध्यात्मिक समज, प्रज्ञा आणि विवेकबुद्धी विकसित होते.\n\nगुहेश्वर या निराकार परमतत्त्वाला स्मरून मांडलेला हा विचार असा आशय व्यक्त करतो की, शरणांच्या सत्संगतीत घडून येणारा हा ज्ञानाचा आणि जाणीवेचा विकास इतका अलौकिक आहे की त्याचे स्वतः परमतत्त्वालाही आश्चर्य वाटते.","fr":"Ce vachana met en lumière le lien essentiel entre le milieu qui nous entoure et la nature de ce qui se développe en nous.\n\nÀ travers des images concrètes, il montre que chaque terrain produit des fruits conformes à sa propre qualité : la terre noire et fertile fait croître la canne à sucre en abondance, le dénuement favorise la torpeur du sommeil, et la présence de vaillants lutteurs rend le combat redoutable.\n\nDe la même manière, c'est uniquement en la compagnie des aînés accomplis — les Sharanas intimement unis à la Réalité suprême — que l'intelligence spirituelle et le discernement véritable peuvent s'épanouir pleinement.\n\nCette floraison de la conscience au sein d'une telle assemblée éveillée est si remarquable qu'elle suscite l'émerveillement au cœur même de la Conscience absolue, désignée ici par la signature spirituelle Guheshwara."}},{"no":495,"o":"ಕರಸ್ಥಲದ ಲಿಂಗ ಮನಸ್ಥಲದಲ್ಲಿ ವೇದ್ಯವಾಗಿ,\n ಮನಸ್ಥಲದ ಲಿಂಗ ಎನ್ನ ಸರ್ವಾಂಗದಲ್ಲಿ ವೇದ್ಯವಾದ ಬಳಿಕ,\n ಇನ್ನು ಭಿನ್ನಭಾವಕ್ಕೆ ತೆರಹುಂಟೆ?\n ಗುಹೇಶ್ವರಲಿಂಗವ ಬೆರಸಿ ಸಮರಸವಾದ ಬಳಿಕ\n ಎರಡೆಂಬುದಿಲ್ಲ ನೋಡಾ, ಚನ್ನಬಸವಣ್ಣಾ.","t":{"en":"Once the *Linga* in the palm of the hand is realized in the seat of the mind,\nand the *Linga* in the seat of the mind is realized throughout my entire being,\nis there any room left for a sense of separateness?\nOnce one merges in *Samarasa* with Guheshwaralinga,\nthere is nothing called two—see, O Channabasavanna!","hi":"करस्थल का लिंग मनस्थल में वेद्य होकर,\nमनस्थल का लिंग मेरे सर्वांग में वेद्य होने के बाद,\nअब भिन्नभाव के लिए अवकाश है क्या?\nगुहेश्वरलिंग में मिलकर समरस होने के बाद,\nदो कहना नहीं है देखो, हे चन्नबसवण्णा।","mr":"करस्थळावरील लिंग मनस्थळात वेद्य होऊन,\nमनस्थळातील लिंग माझ्या सर्वांगात वेद्य झाल्यावर,\nआता भिन्नभावाला वाव उरतो का?\nगुहेश्वरलिंगात मिसळून समरस झाल्यावर,\nदोन असे म्हणणेच उरत नाही पहा, हे चन्नबसवण्णा.","fr":"Le Linga du Karasthala étant réalisé dans le Manasthala,\net après que le Linga du Manasthala est réalisé dans tout mon être,\ny a-t-il encore place pour un sentiment de séparation ?\nAprès s'être uni à Guheshwaralinga et être devenu un en Samarasa,\nil n'y a plus ce que l'on appelle deux, vois-tu, ô Channabasavanna."},"m":{"en":"This Vachana describes the seamless spiritual progression from outer contemplation to complete inner realization.\n\nWhen the Ishtalinga held on the palm (Karasthala)—serving as a sacred visual medium—is internalized and experienced within the mind (Manasthala), it subsequently pervades every aspect of one's entire being.\n\nOnce this Divine Consciousness is fully assimilated throughout the body and mind, no room remains for any sense of separation or duality.\n\nAddressing Channabasavanna, the Vachana concludes that when the seeker merges into harmonious union (Samarasa) with the Formless Supreme Reality, Guheshwaralinga, all distinction of \"two\" dissolves into absolute oneness.","hi":"यह वचन साधक की आध्यात्मिक यात्रा के उस शिखर को स्पष्ट करता है जहाँ बाह्य प्रतीक से शुरू हुई साधना पूर्ण अद्वैत और आंतरिक अनुभूति में परिणत हो जाती है।\n\nहथेली पर स्थित इष्टलिंग एक पवित्र माध्यम के रूप में पहले साधक के मन में आत्मसात होता है, और फिर मन से प्रवाहित होकर उसके रोम-रोम और संपूर्ण अस्तित्व में व्याप्त हो जाता है।\n\nजब शुद्ध चैतन्य इस प्रकार साधक के सर्वांग में समा जाता है, तब भीतर और बाहर या साधक और साध्य के बीच किसी भी प्रकार के भेदभाव के लिए कोई स्थान शेष नहीं रहता।\n\nचन्नबसवण्ण को संबोधित करते हुए इस वचन का मूल भाव यह है कि निराकार परमतत्त्व गुहेश्वर में पूर्णतः लीन होकर समरस हो जाने के बाद द्वैत यानी 'दो' होने का भाव पूरी तरह मिट जाता है और केवल एकत्व ही रह जाता है।","mr":"हे वचन इष्टलिंग साधनेतून बाह्य प्रतीकाकडून आंतरिक चैतन्याकडे होणाऱ्या आध्यात्मिक प्रवासाचे आणि अद्वैत अनुभूतीचे वर्णन करते.\n\nतळहातावरील इष्टलिंगाचे भान जेव्हा मनात सामावले जाते आणि मनातील हेच लिंगतत्त्व जेव्हा साधकाच्या सर्वांगात व्यापून राहते, तेव्हा कोणत्याही प्रकारच्या द्वैताला किंवा वेगळेपणाच्या भावनेला जागा उरत नाही.\n\nचन्नबसवण्णा यांना उद्देशून मांडलेला या वचनाचा गाभा असा की, 'गुहेश्वरलिंग' या निराकार परमतत्त्वाशी एकरूप होऊन समरस पावल्यानंतर भक्त आणि परमतत्त्व असा कोणताही दुजाभाव शिल्लक राहत नाही, तर केवळ अखंड एकत्वच उरते.","fr":"Ce vachana met en lumière le cheminement intérieur par lequel l’Ishtalinga, d’abord contemplé dans le creux de la main comme un support sacré, s’intériorise progressivement dans la conscience.\n\nLorsque cette présence du Linga dépasse le plan mental pour imprégner et illuminer chaque fibre de l’être tout entier, tout sentiment de séparation ou de différence s’efface d’emblée.\n\nS’adressant à Channabasavanna, le texte souligne qu’une fois accomplie l’union harmonieuse avec la Réalité suprême sans forme, désignée sous le nom de Guheshwaralinga, toute dualité disparaît pour laisser place à une unité absolue."}},{"no":496,"o":"ಕಲ್ಯಾಣವೆಂಬ ಪ್ರಣತೆಯಲ್ಲಿ\n ಭಕ್ತಿರಸವೆಂಬ ತೈಲವನೆರೆದು\n ಆಚಾರವೆಂಬ ಬತ್ತಿಯಲ್ಲಿ\n ಬಸವಣ್ಣನೆಂಬ ಜ್ಯೋತಿಯ ಮುಟ್ಟಿಸಲು\n ತೊಳಗಿ ಬೆಳಗುತ್ತಿದ್ದಿತ್ತಯ್ಯಾ ಶಿವನ ಪ್ರಕಾಶ!\n ಆ ಬೆಳಗಿನೊಳಗೆ ಒಪ್ಪುತ್ತಿದ್ದರಯ್ಯಾ\n ಅಸಂಖ್ಯಾತ ಭಕ್ತಗಣಂಗಳು.\n ಶಿವಭಕ್ತರಿರ್ದ ಕ್ಷೇತ್ರವೆ ಅವಿಮುಕ್ತಕ್ಷೇತ್ರವೆಂಬುದು ಹುಸಿಯೆ?\n ಶಿವಭಕ್ತರಿರ್ದ ದೇಶ ಪಾವನವೆಂಬುದು ಹುಸಿಯೆ?\n ಗುಹೇಶ್ವರಲಿಂಗದಲ್ಲಿ\n ಎನ್ನ ಪರಮಾರಾಧ್ಯ ಸಂಗನಬಸವಣ್ಣನ ಕಂಡು\n ಬದುಕಿದೆನು ಕಾಣಾ, ಸಿದ್ಧರಾಮಯ್ಯಾ.","t":{"en":"In the earthen lamp called Kalyana,\npouring the oil of the essence of devotion,\nwhen the flame called Basavanna\ntouched the wick of righteous conduct,\nthe radiance of Shiva shone forth in splendor, O brother!\nIn that light there shone in grace, O brother,\ncountless hosts of devotees.\nIs it false to say that the place where Shiva's devotees dwell is itself Avimukta Kshetra?\nIs it false to say that the land where Shiva's devotees dwell is sacred?\nIn Guheshwaralinga,\nhaving seen my supremely revered Sanganabasavanna,\nI was saved, see, O Siddharamayya!","hi":"कल्याण रूपी दीये में,\nभक्तिरस रूपी तेल डालकर,\nआचार रूपी बाती में,\nबसवय्या रूपी ज्योति के छूते ही,\nजगमगाकर चमक रहा था, हे भाई, शिव का प्रकाश!\nउस प्रकाश में शोभायमान थे, हे भाई,\nअसंख्य भक्तगण।\nशिवभक्तों का निवास-क्षेत्र ही अविमुक्त क्षेत्र है कहना क्या झूठ है?\nशिवभक्तों का निवास-देश पावन है कहना क्या झूठ है?\nगुहेश्वरलिंग में,\nमेरे परमाराध्य संगनबसवय्या का दर्शन कर,\nमैं धन्य हो गया, देखो हे सिद्धरामय्या।","mr":"कल्याण नावाच्या पणतीमध्ये\nभक्तिरस नावाचे तेल ओतून,\nआचार नावाच्या वातीला\nबसवण्णा नावाची ज्योत लावताच,\nअहो, झळकून उजळत होता शिवाचा प्रकाश!\nत्या प्रकाशात शोभून दिसत होते अहो,\nअसंख्य भक्तगण।\nशिवभक्त असलेले क्षेत्र हेच अविमुक्तक्षेत्र आहे असे म्हणणे खोटे का?\nशिवभक्त असलेला देश पावन आहे असे म्हणणे खोटे का?\nगुहेश्वरसिंगामध्ये\nमाझ्या परमांराध्य संगनबसवण्णांना पाहून\nमी धन्य झालो पहा, हे सिद्धरामय्या।","fr":"Dans la lampe d'argile que l'on appelle Kalyana,\nayant versé l'huile que l'on appelle l'essence de la *Bhakti*,\net à la mèche que l'on appelle la conduite juste,\nlorsqu'on a approché la flamme que l'on appelle Basavanna,\nelle resplendissait et rayonnait, mon frère, la splendeur de Shiva !\nAu sein de cette lumière brillaient dans toute leur beauté, mon frère,\nles innombrables assemblées de dévots.\nEst-il faux de dire que le lieu où demeurent les dévots de Shiva est le sanctuaire même d'Avimukta ?\nEst-il faux de dire que la terre où demeurent les dévots de Shiva est sacrée ?\nEn présence de Guheshwaralinga,\nayant vu mon suprême vénéré Sanganabasavanna,\nj'ai trouvé la vraie vie, vois-tu, ô Siddharamayya."},"m":{"en":"This Vachana uses the metaphor of an earthen lamp to celebrate how the city of Kalyana became a radiant center of spiritual awakening under the leadership of Basavanna.\n\nBy pouring the oil of devotion into the lamp of Kalyana and igniting the wick of righteous conduct with the flame that is Basavanna, the resplendent light of Formless Supreme Consciousness shone forth, illuminating countless Sharanas gathered within its glow.\n\nAddressing Siddharama, the Vachana affirms that any land inhabited by true devotees becomes a sacred, liberated realm (Avimuktakshetra), rather than holiness being confined to conventional pilgrimage sites.\n\nUltimately, the Vachanakara expresses profound gratitude for finding true spiritual fulfillment upon beholding his revered Sanganabasavanna in union with the Supreme Reality, invoked as Guheshwaralinga.","hi":"इस वचन का केंद्रीय भाव यह है कि कल्याण नगर के आध्यात्मिक वैभव और बसवण्ण के आलोकित व्यक्तित्व को एक सुंदर रूपक के माध्यम से प्रस्तुत किया गया है।\n\nयह वचन स्पष्ट करता है कि कल्याण रूपी दीपक में भक्तिरस रूपी तेल डालकर, सदाचार रूपी बाती में जब बसवण्ण रूपी ज्योति को स्पर्श कराया गया, तो चारों ओर परम चैतन्य (शिव) का दिव्य प्रकाश जगमगा उठा और उस आलोक में असंख्य भक्तगण शोभायमान हो रहे थे।\n\nसिद्धराम को संबोधित करते हुए इस वचन में यह दर्शन प्रकट होता है कि जहाँ सच्चे शिवभक्त निवास करते हैं, वही स्थान वास्तव में मुक्त करने वाला 'अविमुक्त क्षेत्र' और परम पावन भूमि है, यह बात कदापि असत्य नहीं हो सकती।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि निराकार परमतत्त्व गुहेश्वर लिंग की अनुभूति में अपने परम आराध्य संगनबसवण्ण के दर्शन पाकर ही साधक का जीवन सार्थक और धन्य हो जाता है।","mr":"या वचनात कल्याण नगरीचे एका दिव्याच्या रूपकातून अतिशय सुंदर वर्णन केले आहे, जिथे कल्याण ही पणती, भक्तीरस हे तेल आणि सदाचार ही वात आहे.\n\nजेव्हा या सदाचाराच्या वातीला बसवण्णांसारख्या तेजस्वी ज्योतीचा स्पर्श होतो, तेव्हा तिथे शिवतत्त्वाचा अर्थात शुद्ध चैतन्याचा दिव्य प्रकाश सर्वत्र उजळून निघतो आणि त्या प्रकाशात असंख्य शरणांचा समुदाय झळाळून उठतो.\n\nसिद्धरामय्यांना उद्देशून हे वचन स्पष्ट करते की, जिथे असे सच्चे शिवभक्त राहतात तोच प्रदेश खऱ्या अर्थाने पावन आणि मुक्त क्षेत्र ठरतो, हे विधान अजिबात खोटे नाही.\n\nगुहेश्वरलिंग या परमतत्त्वाच्या ठायी आपले परमपूज्य संगनबसवण्ण यांचे दर्शन झाल्यामुळेच आपले जीवन खऱ्या अर्थाने सार्थक झाले, हा आध्यात्मिक कृतज्ञतेचा भाव या वचनाच्या केंद्रस्थानी आहे.","fr":"Ce vachana met en lumière le rayonnement spirituel de la cité de Kalyana à travers la métaphore lumineuse d'une lampe sacrée, où Kalyana est le réceptacle, l'essence de la dévotion est l'huile, et la conduite juste constitue la mèche.\n\nLorsque Basavanna, telle une flamme vivante, embrase cette mèche, la splendeur de la conscience suprême resplendit pleinement et révèle dans sa clarté d'innombrables chercheurs spirituels.\n\nLe texte affirme ainsi que la sainteté véritable et le caractère libérateur d'un lieu, appelé Avimuktakshetra, ne dépendent pas d'une géographie figée, mais de la présence vivante des dévots qui purifient la terre qu'ils habitent.\n\nEn s'adressant à Siddharama et en invoquant Guheshwaralinga, désignant la Réalité suprême sans forme, le poète exprime que la contemplation de la grandeur exemplaire de Sanganabasavanna au sein de cette pure conscience donne son sens véritable à l'existence."}},{"no":497,"o":"ಕಲ್ಲೊಳಗಣ ಕಿಚ್ಚು ಉರಿಯದಂತೆ,\n ಬೀಜದೊಳಗಣ ವೃಕ್ಷ ಉಲಿಯದಂತೆ,\n ತೋರಲಿಲ್ಲಾಗಿ ಬೀರಲಿಲ್ಲಾರಿಗೆಯು,\n ಗುಹೇಶ್ವರ ನಿಂದ ನಿಲವ ಅನು[ಭಾ]ವಸುಖಿ ಬಲ್ಲ.","t":{"en":"Like the fire within a stone that does not blaze,\nlike the tree within a seed that makes no sound,\nsince it is not shown, it is not displayed to anyone;\nonly one who savours the bliss of *Anubhāva* knows the state in which Guheshwara abides.","hi":"पत्थर के भीतर की आग के न जलने के समान,\nबीज के भीतर के वृक्ष के न सरसराने के समान,\nदिखाई नहीं दिया इसलिए किसी को भी बाँटा नहीं,\nगुहेश्वर की स्थित स्थिति को अनुभावसुखी ही जानता है।","mr":"दगडातील अग्नी जसा जळत नाही,\nबियातील वृक्ष जसा सळसळत नाही,\nदिसण्यासारखे नसल्याने कुणापुढेही मांडण्यासारखे नाही,\nगुहेश्वराची स्थिर स्थिती अनुभावसुखीच जाणतो.","fr":"Comme le feu au sein de la pierre qui ne brûle pas,\ncomme l'arbre au sein de la graine qui ne bruisse pas,\nparce qu'il ne s'est pas manifesté, il ne s'est répandu pour personne ;\nseul celui qui jouit de la félicité de l'Anubhava connaît la stature où demeure Guheshwara."},"m":{"en":"This Vachana explains that the Formless Supreme Consciousness, addressed as Guheshwara, abides within everything in a subtle, unmanifest state, much like fire concealed inside a stone or a full-grown tree hidden within a seed.\n\nJust as the latent fire does not burn on its own and the unmanifest tree makes no sound, this ultimate reality neither displays itself outwardly nor broadcasts its presence to the world.\n\nBecause the Absolute remains beyond external show and ordinary sensory perception, its true nature cannot be grasped through mere outward observation.\n\nOnly the one who is immersed in the bliss of inner spiritual experience (Anubhava) can truly recognize and realize the silent, all-pervading presence of the Supreme Reality.","hi":"यह वचन निराकार परमतत्त्व की अव्यक्त और सूक्ष्म उपस्थिति की गहनता को स्पष्ट करता है।\n\nजिस प्रकार पत्थर के भीतर छिपी अग्नि बाहर जलती हुई दिखाई नहीं देती और बीज के भीतर समाया हुआ वृक्ष कोई शब्द नहीं करता, उसी प्रकार परम सत्य भी भीतर मौन और अप्रकट रूप से विद्यमान रहता है।\n\nयह आंतरिक सत्य किसी बाहरी प्रदर्शन का विषय नहीं है, इसलिए इसे किसी को दिखाया या शब्दों के माध्यम से बाँटा नहीं जा सकता।\n\nगुहेश्वर के रूप में संबोधित उस परमतत्त्व की इस गूढ़ स्थिति को केवल वही साधक जान सकता है, जो स्वयं उस आध्यात्मिक अनुभूति के आनंद में लीन हो।","mr":"हे वचन परमतत्त्वाचे अव्यक्त आणि सूक्ष्म अस्तित्व स्पष्ट करते.\n\nज्याप्रमाणे दगडात लपलेली ठिणगी बाहेरून पेटलेली दिसत नाही आणि बीजामध्ये दडलेला वृक्ष कोणतीही चाहूल देत नाही, त्याचप्रमाणे परम सत्य हे बाह्य दृष्टीला सहजपणे प्रकट होत नाही किंवा कुणालाही बाहेरून दाखवता येत नाही.\n\nअशा या बाह्य रूपांच्या पलीकडे असलेल्या 'गुहेश्वर' या निराकार चैतन्याची मूळ स्थिती केवळ स्वानुभवाच्या आणि आंतरिक अनुभूतीच्या आनंदात मग्न असलेला साधकच जाणू शकतो, हा या वचनाचा मुख्य गाभा आहे.","fr":"Ce vachana met en lumière la nature latente et silencieuse de la Réalité suprême sans forme, désignée sous la signature spirituelle de Guheshwara.\n\nTout comme le feu caché au cœur de la pierre ne brûle pas de manière visible et que l’arbre contenu dans la graine demeure dans le silence, ce Principe absolu réside au sein de l’existence sans se manifester extérieurement.\n\nParce qu’il échappe à toute ostentation et ne se livre pas à une démonstration ordinaire, cet état d’être échappe au regard superficiel.\n\nSeul l’être accompli, plongé dans la béatitude de l’expérience spirituelle directe (Anubhava), est capable de saisir et de connaître cette présence intérieure subtile et immuable."}},{"no":498,"o":"ಕಳ್ಳಗಂಜಿ ಕಾಡ ಹೊಕ್ಕಡೆ ಹುಲಿ ತಿಂಬುದ ಮಾಬುದೆ?\n ಹುಲಿಗಂಜಿ ಹುತ್ತವ ಹೊಕ್ಕಡೆ ಸರ್ಪ ತಿಂಬುದ ಮಾಬುದೆ?\n ಕಾಲಗಂಜಿ ಭಕ್ತನಾದಡೆ ಕರ್ಮ ತಿಂಬುದ ಮಾಬುದೆ?\n ಇಂತೀ ಮೃತ್ಯುವಿನ ಬಾಯ ತುತ್ತಾದ\n ವೇಷಡಂಬಕರ ನಾನೇನೆಂಬೆ ಗುಹೇಶ್ವರಾ.","t":{"en":"If one enters the forest in fear of a thief, will the tiger refrain from devouring him?\nIf one enters an anthill in fear of the tiger, will the serpent refrain from devouring him?\nIf one becomes a devotee in fear of death, will karma refrain from devouring him?\nWhat can I say of such hypocrites in disguise,\nwho have become a mere morsel in the jaws of death, O Guheshwara?","hi":"चोर से डरकर जंगल में घुसने पर क्या बाघ खाना छोड़ेगा?\nबाघ से डरकर बाँबी में घुसने पर क्या सर्प खाना छोड़ेगा?\nकाल से डरकर भक्त बनने पर क्या कर्म खाना छोड़ेगा?\nइस प्रकार मृत्यु के मुँह का ग्रास बने,\nवेश-आडंबरियों को मैं क्या कहूँ, हे गुहेश्वर?","mr":"चोराला भिऊन रानात शिरल्यावर वाघ खाण्याचे सोडेल का?\nवाघाला भिऊन वारुळात शिरल्यावर साप खाण्याचे सोडेल का?\nकाळाला भिऊन भक्त झाल्यावर कर्म खाण्याचे सोडेल का?\nअशा या मृत्यूच्या मुखातील घास झालेल्या\nवेषढोंग्यांना मी काय म्हणू, हे गुहेश्वरा?","fr":"Si, par crainte du voleur, l'on entre dans la forêt, le tigre manquera-t-il de dévorer ?\nSi, par crainte du tigre, l'on entre dans une termitière, le serpent manquera-t-il de dévorer ?\nSi, par crainte du temps et du trépas, l'on devient dévot, le *karma* manquera-t-il de dévorer ?\nAinsi, de ces hypocrites déguisés,\ndevenus une bouchée dans la gueule de la mort, que puis-je dire, ô Guheshwara ?"},"m":{"en":"This Vachana exposes the futility of tur
