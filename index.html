<script>
const D=[
{"id":"s0","n":{"en":"Basavanna","hi":"बसवण्णा","mr":"बसवण्णा","fr":"Basavanna","te":"బసవణ్ణ","kn":"ಬಸವಣ್ಣ"},"v":[{"no":60,"o":"ಇನ್ನೇವೆನಿನ್ನೇವೆನಯ್ಯಾ?\n ಎನ್ನ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿ ಘನವಾಯಿತ್ತು.\n ಎನ್ನ ನಿಂದಲ್ಲಿ ನಿಲ್ಲಲೀಯದು,\n ಎನ್ನ ಕುಳಿತಲ್ಲಿ ಕುಳ್ಳಿರಲೀಯದು.\n ಕ್ಷಣದಲ್ಲಿ ಪಾತಾಳಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ಆಕಾಶಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ದಿಗ್ದೆಸೆಗೆ ಐದುತ್ತಿದೆ.\n ಕೂಡಲಸಂಗಮದೇವಾ,\n ಈ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿಯನೆಂದಿಗೆ ನೀಗಿ,\n ಎಂದು ನಿಮ್ಮನೊಡಗೂಡುವೆನಯ್ಯಾ.","t":{"en":"What else can I do, what else can I do, O Lord?\nFierce has grown the assault of this monkey called my mind.\nWhere I stand, it does not let me stand;\nwhere I sit, it does not let me sit.\nIn a moment, it reaches the netherworld;\nin a moment, it reaches the sky;\nin a moment, it reaches all directions.\nO Koodalasangamadeva,\nwhen will I ever rid myself of the assault of this monkey called the mind,\nand when will I unite with you, O Lord?","hi":"अब क्या करूँ, अब क्या करूँ, हे स्वामी?\nमेरे मन रूपी मर्कट का आक्रमण प्रबल हो गया है।\nमुझे जहाँ खड़ा हूँ वहाँ खड़े रहने नहीं देता,\nमुझे जहाँ बैठा हूँ वहाँ बैठने नहीं देता।\nक्षण में पाताल को पहुँच रहा है,\nक्षण में आकाश को पहुँच रहा है,\nक्षण में दसों दिशाओं को पहुँच रहा है।\nहे कूडलसंगमदेव,\nइस मन रूपी मर्कट के आक्रमण से कब मुक्त होकर,\nकब आपसे आ मिलूँगा, हे स्वामी?","mr":"आता मी काय करू, आता मी काय करू, हे स्वामी?\nमाझ्या मन म्हणवणाऱ्या मर्कटाचा हल्ला प्रचंड झाला आहे.\nमला उभ्या असलेल्या जागी उभे राहू देत नाही,\nमला बसलेल्या जागी बसू देत नाही.\nक्षणात पाताळात जाऊन पोहोचतो,\nक्षणात आकाशात जाऊन पोहोचतो,\nक्षणात दाही दिशांना जाऊन पोहोचतो.\nहे कूडलसंगमदेवा,\nया मन म्हणवणाऱ्या मर्कटाचा हल्ला केव्हा दूर करून,\nमी केव्हा तुमच्याशी एकरूप होईन, हे स्वामी?","fr":"Que ferai-je désormais, que ferai-je donc, ô Seigneur ?\nL'assaut du singe que l'on appelle mon esprit est devenu redoutable.\nIl ne me laisse pas rester debout là où je me tiens,\nil ne me laisse pas rester assis là où je m'assieds.\nEn un instant, il s'élance vers les mondes souterrains,\nen un instant, il s'élance vers le ciel,\nen un instant, il s'élance vers toutes les directions.\nÔ Koodalasangamadeva,\nquand donc me délivrerai-je de l'assaut de ce singe que l'on appelle l'esprit,\net quand donc m'unirai-je à vous, ô Seigneur ?","te":"ఇక ఏమి చేతును, ఇక ఏమి చేతును ఓ స్వామీ?\nనా మనసనే మర్కటపు దాడి ఘనమయ్యింది.\nనన్ను నిలిచిన చోట నిలవనీయదు,\nనన్ను కూర్చున్న చోట కూర్చోనీయదు.\nక్షణంలో పాతాళానికి చేరుతున్నది,\nక్షణంలో ఆకాశానికి చేరుతున్నది,\nక్షణంలో దిగ్దేశాలకు చేరుతున్నది.\nఓ కూడలసంగమదేవా,\nఈ మనసనే మర్కటపు దాడిని ఎన్నటికి వదిలించుకొని,\nఎన్నడు మిమ్మల్ని కూడుదునో ఓ స్వామీ.","kn":"ಇನ್ನೇವೆನಿನ್ನೇವೆನಯ್ಯಾ?\n ಎನ್ನ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿ ಘನವಾಯಿತ್ತು.\n ಎನ್ನ ನಿಂದಲ್ಲಿ ನಿಲ್ಲಲೀಯದು,\n ಎನ್ನ ಕುಳಿತಲ್ಲಿ ಕುಳ್ಳಿರಲೀಯದು.\n ಕ್ಷಣದಲ್ಲಿ ಪಾತಾಳಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ಆಕಾಶಕ್ಕೆ ಐದುತ್ತಿದೆ,\n ಕ್ಷಣದಲ್ಲಿ ದಿಗ್ದೆಸೆಗೆ ಐದುತ್ತಿದೆ.\n ಕೂಡಲಸಂಗಮದೇವಾ,\n ಈ ಮನವೆಂಬ ಮರ್ಕಟನ ದಾಳಿಯನೆಂದಿಗೆ ನೀಗಿ,\n ಎಂದು ನಿಮ್ಮನೊಡಗೂಡುವೆನಯ್ಯಾ."},"m":{"en":"This Vachana vividly captures the intense inner struggle of a spiritual seeker against the relentless restlessness of the human mind.\n\nComparing the mind to a wild monkey, the Vachana illustrates how its constant agitation prevents any stillness, darting in a single instant from the deepest underworld to the highest sky and across all directions.\n\nThis extreme mental volatility scatters awareness and makes it impossible to remain grounded or composed in the present moment.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, the seeker expresses an earnest longing to transcend this turbulent mental assault and attain complete union with the Absolute.","hi":"यह वचन मन की अत्यंत चंचल और अनियंत्रित प्रकृति का सजीव वर्णन करता है, जिसे यहाँ एक उत्पाती बंदर (मर्कट) की उपमा दी गई है।\n\nवचनकार की व्यथा यह है कि इस मन रूपी बंदर का आक्रमण इतना प्रबल हो गया है कि यह साधक को न तो एक स्थान पर स्थिरता से खड़े रहने देता है और न ही शांति से बैठने देता है।\n\nयह अस्थिर मन एक ही क्षण में पाताल की गहराइयों में उतर जाता है, अगले ही क्षण आकाश की ऊँचाइयों में उड़ने लगता है और पल भर में दसों दिशाओं में भटकता रहता है।\n\nइस वचन का आध्यात्मिक मर्म यह है कि जब तक मन की इस निरंतर भटकन और चंचलता से मुक्ति नहीं मिलती, तब तक कूडलसंगमदेव रूपी निराकार परमतत्त्व के साथ एकाकार होना संभव नहीं है।","mr":"या वचनात मानवी मनाच्या अत्यंत चंचल आणि अस्थिर वृत्तीचे मार्मिक वर्णन करण्यात आले आहे.\n\nमनाला माकडाची उपमा देऊन हे वचन स्पष्ट करते की, मनाच्या या सततच्या उड्यांमुळे साधकाला एका जागी शांतपणे उभेही राहता येत नाही आणि स्थिरपणे बसताही येत नाही.\n\nहे चंचल मन एका क्षणात पाताळात जाते, दुसऱ्या क्षणात आकाशात भरारी घेते, तर पुढच्याच क्षणी दहा दिशांना भटकत राहते.\n\nकूडलसंगमदेव या परमतत्त्वाशी एकरूप होण्यासाठी मनाचा हा चंचलपणा आणि त्याचे आक्रमण कधी संपणार, अशी तीव्र आध्यात्मिक तळमळ या वचनातून व्यक्त झाली आहे.","fr":"Ce vachana met en lumière l'extrême agitation de l'esprit humain, comparé ici aux assauts incessants et imprévisibles d'un singe.\n\nCette instabilité intérieure empêche l'être de trouver le moindre repos, que ce soit debout ou assis, en projetant la pensée d'un instant à l'autre vers les abîmes, les cieux ou les quatre points cardinaux.\n\nÀ travers cette image saisissante de la dispersion mentale, le texte exprime l'impuissance du chercheur spirituel face aux soubresauts de sa propre conscience.\n\nLa portée spirituelle de ce vachana réside dans l'aspiration profonde à surmonter cette tyrannie de l'esprit vagabond afin de réaliser l'union ultime avec la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva.","te":"ఈ వచనం మానవ మనస్సులోని తీవ్రమైన అस्थిరతను, దానిని నియంత్రించలేక సాధకుడు పడే అంతర్మథనాన్ని ఆవిష్కరిస్తోంది.\n\nమనస్సు అనేది ఒక కోతి వంటిదని, దాని నిరంతర దాడి వల్ల మనిషి నిలబడిన చోట నిలబడలేక, కూర్చున్న చోట కుదురుగా కూర్చోలేక ఎలా సతమతమవుతాడో ఇందులో స్పష్టంగా వివరించబడింది.\n\nఒక్క క్షణంలో పాతాళానికి, మరుక్షణంలో ఆకాశానికి, అంతలోనే నలుదిక్కులకూ పరుగులు తీసే ఈ చంచలమైన మనస్సు మనిషిని ఏకాగ్రతతో ఉండనివ్వదు.\n\nకూడలసంగమదేవ అనే అంకితనామంతో సూచించబడిన నిరాకార పరమతత్త్వంతో ఏకం కావాలంటే, ముందుగా ఈ కోతి వంటి మనస్సు యొక్క అలజడిని దాటడం ఎంతో అవసరమని, ఆ స్థితి తనకు ఎప్పుడు కలుగుతుందోనని తపించే సాధకుని ఆవేదన ఇందులో కనిపిస్తుంది.","kn":"ಈ ವಚನವು ಮನುಷ್ಯನ ಮನಸ್ಸು ಎಷ್ಟು ಚಂಚಲವಾಗಿದ್ದು ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಗೆ ಹೇಗೆ ಅಡ್ಡಿಯಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಕೋತಿಯ ರೂಪಕದ ಮೂಲಕ ತುಂಬಾ ಸಹಜವಾಗಿ ವಿವರಿಸುತ್ತದೆ.\n\nಕೋತಿಯಂತೆ ಕ್ಷಣಕ್ಷಣಕ್ಕೂ ಹಾರಾಡುವ ಈ ಮನಸ್ಸು ಮನುಷ್ಯನನ್ನು ನಿಂತ ಕಡೆ ನಿಲ್ಲಲು ಬಿಡದೆ, ಕುಳಿತ ಕಡೆ ಕುಳಿತುಕೊಳ್ಳಲು ಬಿಡದೆ ತನ್ನ ಅತಿಯಾದ ದಾಳಿಯಿಂದ ಇನ್ನಿಲ್ಲದಂತೆ ಕಾಡುತ್ತದೆ.\n\nಒಂದೇ ಕ್ಷಣದಲ್ಲಿ ಪಾತಾಳಕ್ಕೆ ಇಳಿಯುತ್ತಾ, ಮರುಕ್ಷಣವೇ ಆಕಾಶಕ್ಕೆ ಏರುತ್ತಾ, ಸುತ್ತಲಿನ ಹತ್ತು ದಿಕ್ಕುಗಳಿಗೂ ಓಡುತ್ತಾ ಮನಸ್ಸು ಒಂದೆಡೆ ನೆಲೆನಿಲ್ಲದೆ ಸದಾ ಅಲೆಯುತ್ತಲೇ ಇರುತ್ತದೆ.\n\nಮನಸ್ಸಿನ ಈ ಚಂಚಲತೆಯ ದಾಳಿಯಿಂದ ಯಾವಾಗ ಬಿಡುಗಡೆ ಪಡೆದು, ಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದೊಡನೆ ಯಾವಾಗ ಒಂದಾಗುತ್ತೇನೋ ಎಂಬ ಸಾಧಕನ ತೀವ್ರವಾದ ಹಂಬಲ ಮತ್ತು ತೊಳಲಾಟವೇ ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":61,"o":"ಇಬ್ಬರು ಮೂವರು ದೇವರೆಂದು ಉಬ್ಬಿ ಮಾತನಾಡಬೇಡ,\n ಒಬ್ಬನೆ ಕಾಣಿರೊ, ಇಬ್ಬರೆಂಬುದು ಹುಸಿ ನೋಡಾ!\n ಕೂಡಲಸಂಗಮದೇವನಲ್ಲದಿಲ್ಲೆಂದಿತ್ತು ವೇದ.","t":{"en":"Do not swell with pride and speak of two or three gods,\nHe is but one, behold; to say there are two is a lie, see!\nThe Veda itself declared that there is none other than Koodalasangamadeva.","hi":"दो-तीन देव हैं, ऐसा फूलकर मत बोलो,\nवे एकमात्र ही हैं, देखो, दो कहना झूठ है, देखो!\nकूडलसंगमदेव के सिवा कोई नहीं है, ऐसा वेद ने कहा।","mr":"दोन किंवा तीन देव आहेत असे फुगून बोलू नकोस,\nतो एकच आहे हे लक्षात घ्या, दोन आहेत असे म्हणणे खोटे आहे पहा!\nकूडलसंगमदेवाशिवाय दुसरा कोणीही नाही, असे वेदाने म्हटले आहे.","fr":"Ne parlez pas avec orgueil en disant qu'il y a deux ou trois dieux,\nvoyez qu'Il est l'Unique ; dire qu'il y en a deux est un mensonge, voyez !\nLe Veda a déclaré qu'il n'en est point d'autre que Koodalasangamadeva.","te":"ఇద్దరు ముగ్గురు దేవుళ్ళని ఉబ్బిపోతూ మాట్లాడవద్దు,\nఆయన ఒక్కరే సుమా, ఇద్దరు అని చెప్పడం అసత్యం చూడు!\nకూడలసంగమదేవుడు తప్ప మరొకరు లేరని చెప్పింది వేదం.","kn":"ಇಬ್ಬರು ಮೂವರು ದೇವರೆಂದು ಉಬ್ಬಿ ಮಾತನಾಡಬೇಡ,\n ಒಬ್ಬನೆ ಕಾಣಿರೊ, ಇಬ್ಬರೆಂಬುದು ಹುಸಿ ನೋಡಾ!\n ಕೂಡಲಸಂಗಮದೇವನಲ್ಲದಿಲ್ಲೆಂದಿತ್ತು ವೇದ."},"m":{"en":"The central message of this Vachana is an uncompromising assertion of the absolute oneness of the Formless Supreme Reality, firmly rejecting the belief in multiple gods.\n\nIt cautions against the boastful and misguided notion of dividing the Divine into two or three separate entities, declaring that any perception of duality is entirely false.\n\nTo reinforce this truth, the Vachana points out that even the Vedas ultimately affirm the existence of nothing other than the one Supreme Consciousness, addressed here through the ankitanama Kudalasangamadeva.","hi":"इस वचन का केंद्रीय संदेश यह है कि निराकार परमतत्त्व केवल एक है और बहुदेववाद की मान्यता पूरी तरह भ्रामक है।\n\nइसमें यह स्पष्ट किया गया है कि अहंकार या उत्साह में आकर दो या तीन देवताओं के अस्तित्व की बात करना व्यर्थ है, क्योंकि परमतत्त्व को दो या अधिक मानना कोरा झूठ है।\n\nकूडलसंगमदेव के रूप में संबोधित अद्वितीय निराकार परम सत्य के अतिरिक्त अन्य किसी का अस्तित्व नहीं है, और इस एकत्व के सिद्धांत की पुष्टि स्वयं वेद के उदाहरण से की गई है।","mr":"या वचनाचा मुख्य आशय असा आहे की, दोन किंवा तीन वेगवेगळे देव आहेत असे फुशारकीने किंवा भ्रमात राहून बोलू नये.\n\nहे वचन स्पष्ट करते की, संपूर्ण विश्वामध्ये केवळ एकच अद्वितीय परमतत्त्व अस्तित्वात आहे आणि यापेक्षा अधिक देव आहेत ही कल्पना पूर्णपणे खोटी व भ्रामक आहे.\n\nकूडलसंगमदेव या नावाने संबोधले गेलेले निराकार परमतत्त्वच एकमेव परम सत्य असून त्याशिवाय दुसरे काहीही अस्तित्वात नाही, असाच निर्वाळा वेदांनीही दिला आहे.","fr":"Ce vachana rejette fermement le polythéisme et la prétention d'affirmer avec orgueil qu'il existe deux ou trois divinités distinctes.\n\nIl met en lumière l'unicité absolue du Principe suprême, déclarant que toute notion de dualité ou de multiplicité du divin n'est qu'une pure illusion.\n\nLa portée spirituelle de ce texte réside dans le rappel que même le Veda atteste qu'il n'existe aucune autre vérité en dehors de l'unique Réalité suprême sans forme, invoquée ici sous le nom de Koodalasangamadeva.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన సందేశం ఏమిటంటే, దైవం ఇద్దరు లేదా ముగ్గురు ఉన్నారంటూ గర్వంతోనూ అజ్ఞానంతోనూ మాట్లాడటం పూర్తిగా అర్థరహితం.\n\nసృష్టిలో ఉన్న పరమతత్త్వం ఒక్కటేనని, దానికి భిన్నంగా రెండు ఉన్నాయనే భావన కేవలం అసత్యమని ఈ వచనం స్పష్టం చేస్తోంది.\n\nవేదాలు సైతం కూడలసంగమదేవ అనే నిరాకార పరమసత్యం తప్ప వేరొకటి లేదని ఏకేశ్వర తత్త్వాన్ని చాటిచెబుతున్నాయని ఇక్కడ నిరూపించబడింది.\n\nఅందువల్ల బహుదేవతారాధన అనే భ్రమను విడిచిపెట్టి, అద్వితీయమైన ఆ ఏకైక పరమచైతన్యాన్ని మాత్రమే తెలుసుకోవాలని ఈ వచనం బోధిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಇಬ್ಬರು ಅಥವಾ ಮೂವರು ಬೇರೆ ಬೇರೆ ದೇವರಿದ್ದಾರೆ ಎಂದು ಉತ್ಸಾಹದಿಂದ ಇಲ್ಲಸಲ್ಲದ ಮಾತನ್ನು ಆಡಬಾರದು.\n\nದೈವತ್ವ ಅಥವಾ ಪರಮಸತ್ಯ ಎಂಬುದು ಎರಡಲ್ಲ, ಇಬ್ಬರು ದೇವರುಗಳಿದ್ದಾರೆ ಎಂಬ ಮಾತು ಸಂಪೂರ್ಣ ಸುಳ್ಳು.\n\nಇಡೀ ಸೃಷ್ಟಿಗೆ ಮೂಲವಾಗಿರುವ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವ ಒಂದೇ ಆಗಿದ್ದು, ಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ಏಕೈಕ ಪರಮಸತ್ಯವನ್ನು ಬಿಟ್ಟರೆ ಬೇರೆ ದೈವವಿಲ್ಲ ಎಂದು ವೇದಗಳೇ ಸ್ಪಷ್ಟಪಡಿಸಿವೆ ಎಂಬುದು ಈ ವಚನದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":62,"o":"ಇರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ತರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಕೊರೆಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಜರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು.\n ಕೂಡಲಸಂಗನ ಶರಣರಿಗೆ ಮುಳಿಸ ತಾಳಿ\n ಎನ್ನ ಭಕ್ತಿ ಅರೆಯಾಯಿತ್ತು.","t":{"en":"By letting themselves be stabbed, our people became devotees,\nby letting themselves be beheaded, our people became devotees,\nby letting themselves be sawed, our people became devotees,\nby enduring scorn, our people became devotees.\nHarbouring anger towards Koodalasanga's *Sharanas*,\nmy devotion was reduced to half.","hi":"रखवाकर भक्त बने हैं हमारे लोग,\nमँगवाकर भक्त बने हैं हमारे लोग,\nकटवाकर भक्त बने हैं हमारे लोग,\nनिंदा सहकर भक्त बने हैं हमारे लोग।\nकूडलसंगम के शरणों पर रोष धारणकर\nमेरी भक्ति अधूरी रह गई।","mr":"भोसकून घेऊन भक्त झाले आमचे लोक,\nकापून घेऊन भक्त झाले आमचे लोक,\nकोरावून घेऊन भक्त झाले आमचे लोक,\nहिणवून घेऊन भक्त झाले आमचे लोक.\nकूडलसंगाच्या शरणांवर रोष धरून\nमाझी भक्ती अपुरी ठरली.","fr":"En se laissant transpercer, les nôtres sont devenus des dévots,\nen se laissant trancher, les nôtres sont devenus des dévots,\nen se laissant entailler, les nôtres sont devenus des dévots,\nen se laissant injurier, les nôtres sont devenus des dévots.\nPour avoir gardé du courroux envers les Sharanas de Koodalasanga,\nma Bhakti est demeurée incomplète.","te":"పొడిపించుకొని భక్తులయ్యారు మావారు,\nనరికించుకొని భక్తులయ్యారు మావారు,\nకోయించుకొని భక్తులయ్యారు మావారు,\nతిట్టించుకొని భక్తులయ్యారు మావారు.\nకూడలసంగని శరణులపై కోపం తెచ్చుకొని\nనా భక్తి సగమయింది.","kn":"ಇರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ತರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಕೊರೆಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು,\n ಜರಿಸಿಕೊಂಡು ಭಕ್ತರಾದರೆಮ್ಮವರು.\n ಕೂಡಲಸಂಗನ ಶರಣರಿಗೆ ಮುಳಿಸ ತಾಳಿ\n ಎನ್ನ ಭಕ್ತಿ ಅರೆಯಾಯಿತ್ತು."},"m":{"en":"This Vachana contrasts the supreme endurance and humility of true devotees with the speaker's own spiritual inadequacy.\n\nIt recalls how earlier revered devotees attained spiritual stature by willingly bearing severe trials, enduring physical affliction, and accepting public ridicule without complaint.\n\nAgainst this high benchmark of forbearance, the speaker confesses to harbouring anger or resentment toward the Sharanas of Kudalasanga.\n\nThe Vachana thus reveals that even a trace of irritation toward fellow spiritual seekers makes one's devotion incomplete and inferior to the selfless humility of true Sharanas.","hi":"इस वचन का मूल भाव यह है कि सच्चे शरण या भक्त हर प्रकार के कष्ट, परीक्षा और अपमान को सहकर ही भक्ति की उच्च अवस्था को प्राप्त करते हैं।\n\nयहाँ यह स्पष्ट किया गया है कि पूर्ववर्ती या निष्ठावान भक्त शरीर पर प्रहार सहकर, अपना सर्वस्व अर्पित कर, देह को कष्ट देकर तथा संसार की निंदा और तिरस्कार को स्वीकार करके सच्चे भक्त बने हैं।\n\nवचनकार आत्मनिरीक्षण करते हुए कहते हैं कि कूडलसंगमदेव के उन महान शरणों के प्रति तनिक भी क्रोध या रोष का भाव आने मात्र से उनकी अपनी भक्ति अधूरी रह गई।\n\nइस प्रकार यह वचन दर्शाता है कि शरणों के प्रति पूर्ण सहनशीलता, विनम्रता और क्रोधरहित भाव के बिना भक्ति की पूर्णता संभव नहीं है।","mr":"या वचनाचा मुख्य आशय असा आहे की, खऱ्या भक्तीमध्ये कितीही घोर शारीरिक वा मानसिक कष्ट आले तरी शरण विचलित होत नाहीत.\n\nकूटू अथवा शरीराचा घाव सोसणे, अवयव तोडले जाणे, शरीर करवतीने कापले जाणे तसेच कठोर निंदा आणि अपमान सहन करणे यांसारख्या सर्व कसोटींवर उतरून पुरातण शरणांनी आपली अढळ निष्ठा सिद्ध केली आहे.\n\nअशा निष्ठावंत आदर्शांच्या तुलनेत, कूडलसंगमदेवाच्या शरणांवर राग धरल्यामुळे आपली स्वतःची भक्ती मात्र अर्धवट आणि अपूर्ण राहिली आहे, अशी प्रांजळ आत्मपरीक्षणाची भावना या वचनातून व्यक्त होते.\n\nसंतांची सहनशीलता आणि स्वतःतील अहंकार व क्रोधाची जाणीव यांतील विरोधाभास मांडून, भक्तीच्या मार्गात नम्रता आणि समतेचे महत्त्व हे वचन अधोरेखित करते.","fr":"Ce vachana met en lumière la patience, l'endurance et l'humilité extraordinaires par lesquelles les véritables chercheurs spirituels deviennent des dévots accomplis.\n\nIl souligne que ceux de la communauté spirituelle ont affiné et prouvé leur dévotion en acceptant sans résistance d'être mis à l'épreuve, blessés, diminués ou sévèrement critiqués par autrui.\n\nEn contraste avec cette maîtrise de soi exemplaire, l'auteur reconnaît avec lucidité que sa propre dévotion est demeurée incomplète et imparfaite pour avoir cédé à la colère envers les Sharanas de Koodalasanga, la Réalité suprême sans forme.\n\nLa portée spirituelle de ce vachana réside ainsi dans un examen de conscience sincère, qui rappelle que l'irritation et le ressentiment envers les Sharanas altèrent la plénitude de l'engagement intérieur.","te":"ఈ వచనం నిజమైన శరణుల అపారమైన సహనశీలాన్ని, వినయాన్ని మరియు కష్టాలను ఓర్చుకునే భక్తినిష్ఠను వివరిస్తోంది.\n\nఉత్తమ శరణులు తమ శరీరాలను కత్తిపోట్లకు, గాయాలకు, కోతలకు గురిచేసుకున్నప్పటికీ, ఇతరుల నిందలను మౌనంగా భరిస్తూనే తమ భక్తిమార్గంలో స్థిరంగా నిలిచారని ఇక్కడ గుర్తుచేయబడింది.\n\nఅటువంటి మహాత్ములతో పోల్చి చూసుకున్నప్పుడు, కూడలసంగమదేవ అనే నిరాకార పరమతత్త్వపు శరణుల పట్ల అసహనాన్ని, కోపాన్ని ప్రదర్శించడం వల్ల తన భక్తి అసంపూర్ణంగా, సగంగానే మిగిలిపోయిందని వచనకారుడు ఆత్మవిమర్శ చేసుకుంటున్నాడు.\n\nఎటువంటి బాధలనైనా, అవమానాలనైనా ఓర్చుకునే సహనమే నిజమైన భక్తికి కొలమానమని, తోటి శరణుల పట్ల కోపగించుకోవడం ఆధ్యాత్మిక పరిపూర్ణతకు ఆటంకమని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ವಚನಕಾರರು ನಿಜವಾದ ಶರಣರ ಸಹನಶೀಲ ಭಕ್ತಿಗೂ ಮತ್ತು ತಮ್ಮಲ್ಲಿರುವ ಅಪೂರ್ಣ ಭಕ್ತಿಗೂ ಇರುವ ವ್ಯತ್ಯಾಸವನ್ನು ಆತ್ಮವಿಮರ್ಶೆಯ ಮೂಲಕ ಬಹಳ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಿದ್ದಾರೆ.\n\nಹಿರಿಯ ಶರಣರು ಜಗತ್ತಿನಿಂದ ಬಂದ ನೋವು, ಕಷ್ಟ, ಅವಮಾನ ಮತ್ತು ನಿಂದನೆಗಳನ್ನೆಲ್ಲಾ ಯಾವ ಕೋಪವೂ ಇಲ್ಲದೆ ಸಹಿಸಿಕೊಂಡು, ತಮ್ಮ ದೇಹ ಮತ್ತು ಮನಸ್ಸಿನ ಅಹಂಕಾರವನ್ನು ತಿದ್ದಿಸಿಕೊಂಡು ಪರಿಪೂರ್ಣ ಭಕ್ತರಾದರು.\n\nಆದರೆ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲಸಂಗಮದೇವನ ಶರಣರ ಬಗ್ಗೆ ಅಥವಾ ಅವರ ಮಾತುಗಳಿಗೆ ಕೋಪ ಮಾಡಿಕೊಂಡ ಕಾರಣದಿಂದ, ತಮ್ಮ ಭಕ್ತಿಯು ಪೂರ್ಣವಾಗದೆ ಅರ್ಧಂಬರ್ಧವಾಯಿತು ಎಂಬುದು ಇಲ್ಲಿನ ನಿಲುವಾಗಿದೆ.\n\nಅಂದರೆ, ನಿಂದನೆ ಮತ್ತು ಪರೀಕ್ಷೆಗಳನ್ನು ಸಮಚಿತ್ತದಿಂದ ಸ್ವೀಕರಿಸುವ ತಾಳ್ಮೆ ಇಲ್ಲದೆ ಕೋಪಕ್ಕೆ ಒಳಗಾದರೆ, ಸಾಧಕನ ಭಕ್ತಿಯು ಎಂದಿಗೂ ಪರಿಪೂರ್ಣವಾಗುವುದಿಲ್ಲ ಎಂಬುದೇ ಈ ವಚನದ ಆಳವಾದ ಆಶಯವಾಗಿದೆ."}},{"no":63,"o":"ಇರುಳೆಂದೇನೋ ಕುರುಡಂಗೆ,\n ಹಗಲೆಂದೇನೋ ಕುರುಡಂಗೆ!\n ತಾಳವ ಬಾರಿಸಿದಡೇನೋ,\n ಪಂಚಮಹಾಶಬುದವ ಬಾರಿಸಿದಡೇನೋ ಕಿವುಡಂಗೆ!\n ಕೂಡಲಸಂಗಮದೇವಯ್ಯನ\n ಪಥವಿನ್ನಾವುದೆಂದರಿಯದವಂಗೆ!","t":{"en":"What if it is night to a blind man,\nwhat if it is day to a blind man!\nWhat if cymbals are played,\nwhat if the five great instruments are sounded to a deaf man—\nto one who does not know\nwhich is the path of Lord Koodalasangamadeva!","hi":"अंधे के लिए रात हो तो क्या,\nअंधे के लिए दिन हो तो क्या!\nताल बजाने पर क्या,\nपंचमहाशब्द बजाने पर क्या बहरे के लिए!\nस्वामी कूडलसंगमदेव का\nपथ कौन-सा है, यह न जाननेवाले के लिए!","mr":"रात्र म्हणजे काय आंधळ्याला,\nआणि दिवस म्हणजे काय आंधळ्याला!\nटाळ वाजवला तर काय,\nआणि पंचमहाशब्द वाजवले तर काय बहिऱ्याला!\nतसेच कूडलसंगमदेवय्यांचा\nमार्ग नेमका कोणता हे न जाणणाऱ्याला!","fr":"Que dire que c'est la nuit à un aveugle,\nque dire que c'est le jour à un aveugle !\nQu'importe que l'on fasse résonner les cymbales,\nqu'importe que l'on fasse retentir les cinq grands instruments à un sourd !\nIl en est ainsi pour celui qui ignore quelle est la voie\ndu Seigneur Koodalasangamadeva !","te":"రాత్రి అయితేనేమి గుడ్డివానికి,\nపగలు అయితేనేమి గుడ్డివానికి!\nతాళం వాయించినా ఏమిటి,\nపంచమహాశబ్దాలు వాయించినా ఏమిటి చెవిటివానికి!\nకూడలసంగమదేవయ్య\nమార్గం ఇంక ఏమిటో అని ఎరుగనివానికి!","kn":"ಇರುಳೆಂದೇನೋ ಕುರುಡಂಗೆ,\n ಹಗಲೆಂದೇನೋ ಕುರುಡಂಗೆ!\n ತಾಳವ ಬಾರಿಸಿದಡೇನೋ,\n ಪಂಚಮಹಾಶಬುದವ ಬಾರಿಸಿದಡೇನೋ ಕಿವುಡಂಗೆ!\n ಕೂಡಲಸಂಗಮದೇವಯ್ಯನ\n ಪಥವಿನ್ನಾವುದೆಂದರಿಯದವಂಗೆ!"},"m":{"en":"This Vachana explains that spiritual truth and the path of awareness cannot be perceived by someone who lacks inner receptivity.\n\nJust as a blind person cannot distinguish between the darkness of night and the light of day, and a deaf person remains unaffected whether simple cymbals or the grand fivefold musical instruments (Panchamahashabda) are played, external spiritual expressions are meaningless to the unawakened mind.\n\nThrough these striking sensory metaphors, the Vachana highlights that the path towards the Formless Supreme Consciousness, addressed here as Kudalasangamadeva, remains entirely incomprehensible to one who has not cultivated inner spiritual sensibility and awareness (Arivu).","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार एक दृष्टिहीन व्यक्ति के लिए रात और दिन में कोई अंतर नहीं होता, उसी प्रकार आध्यात्मिक बोध से रहित व्यक्ति सत्य के प्रकाश को अनुभव नहीं कर पाता।\n\nजैसे किसी बधिर व्यक्ति के सामने केवल मंजीरा बजाया जाए या पाँच प्रकार के महान वाद्ययंत्रों (पंचमहाशब्द) की ध्वनि की जाए, उसके लिए दोनों ही निरर्थक होते हैं।\n\nवचन का केंद्रीय भाव यह है कि जो मनुष्य निराकार परमतत्त्व कूडलसंगमदेव के सत्य मार्ग को नहीं जानता, उसके लिए उच्चतम आध्यात्मिक ज्ञान और साधन भी उसी प्रकार निष्फल रह जाते हैं जैसे अंधे के लिए प्रकाश और बहरे के लिए संगीत।\n\nयहाँ अंधे और बहरे के रूपकों के माध्यम से यह दर्शाया गया है कि आध्यात्मिक मार्ग की पहचान और आंतरिक जागृति के बिना बाहरी परिवेश या भव्यता का कोई वास्तविक लाभ नहीं होता।","mr":"जशा अंध व्यक्तीला रात्र आणि दिवसाचा फरक जाणवत नाही, आणि बहिऱ्या व्यक्तीला साध्या टाळांचा आवाज काय किंवा पंचमहावाद्यांचा प्रचंड गजर काय, दोन्ही सारखेच निरर्थक ठरतात, तसेच अज्ञानी माणसाचे असते.\n\nया दृष्टांतांच्या माध्यमातून हे वचन स्पष्ट करते की, ज्या व्यक्तीमध्ये अंतरंगाची आध्यात्मिक जाणीव आणि संवेदनशीलता नाही, तिला बाह्य साधनांचा किंवा भव्यतेचा कोणताही उपयोग होत नाही.\n\nकूडलसंगमदेव या निराकार परमतत्त्वाचा खरा मार्ग कोणता आहे, हेच ज्याला समजलेले नाही, त्याच्यासाठी सत्याची सर्व बाह्य लक्षणे आणि शिकवण व्यर्थ ठरते.","fr":"Le message essentiel de ce vachana est que la vérité spirituelle demeure inaccessible à celui qui n'a pas la capacité intérieure de la percevoir et de la comprendre.\n\nÀ travers des images saisissantes, le texte rappelle que l'alternance du jour et de la nuit n'a aucun sens pour un aveugle, tout comme le rythme des cymbales ou le retentissement des cinq grands instruments de musique restent vains pour un sourd.\n\nDe la même manière, pour une personne dépourvue de discernement spirituel, la voie menant à la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva, demeure totalement hors de portée.\n\nCe vachana souligne ainsi que sans l'éveil de la conscience intérieure, les enseignements et les signes spirituels les plus élevés restent lettre morte.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, ఆంతరికమైన ఎరుక లేని వ్యక్తికి బాహ్యమైన ఆధ్యాత్మిక వాతావరణం గానీ, ఆచారాలు గానీ ఏమాత్రం ప్రయోజనాన్ని చేకూర్చలేవు.\n\nకంటిచూపు లేని గుడ్డివానికి రాత్రి అయినా, పగలైనా ఎలాంటి తేడా ఉండదు; అలాగే వినికిడి శక్తి లేని చెవిటివాని ముందు తాళాలు వాయించినా, ఐదు రకాల మహావాద్యాలను మోగించినా వానికి ఏమీ వినిపించదు.\n\nఅదే విధంగా, నిరాకార పరమతత్త్వమైన కూడలసంగమదేవ చూపిన సత్యమార్గం ఏమిటో తెలియని అజ్ఞానికి, ఆ పరమసత్యపు ఉనికిని గుర్తించే అంతర్దృష్టి ఉండదు.\n\nఅందువల్ల, ఆధ్యాత్మిక పథం పట్ల సరైన అవగాహన, అంతరంగంలో మేల్కొలుపు లేనివారికి బాహ్యమైన బోధనలు, సంకేతాలు నిష్ప్రయోజనంగానే మిగిలిపోతాయని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕಣ್ಣು ಕಾಣದ ಕುರುಡನಿಗೆ ಹಗಲು ಮತ್ತು ರಾತ್ರಿಗಳ ನಡುವಿನ ವ್ಯತ್ಯಾಸ ಹೇಗೆ ತಿಳಿಯುವುದಿಲ್ಲವೋ, ಹಾಗೆಯೇ ಕಿವಿ ಕೇಳದ ಕಿವುಡನಿಗೆ ಸಣ್ಣ ತಾಳ ಬಾರಿಸಿದರೂ ಅಥವಾ ಐದು ಬಗೆಯ ದೊಡ್ಡ ವಾದ್ಯಗಳ ಪಂಚಮಹಾಶಬ್ದವನ್ನು ಮೊಳಗಿಸಿದರೂ ಹೇಗೆ ಏನೂ ಕೇಳಿಸುವುದಿಲ್ಲವೋ, ಅದೇ ರೀತಿ ಆಂತರಿಕ ಅರಿವಿಲ್ಲದ ಮನುಷ್ಯನ ಸ್ಥಿತಿಯೂ ಆಗಿರುತ್ತದೆ.\n\nನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲಸಂಗಮದೇವನ ದಾರಿ ಯಾವುದು ಎಂಬುದನ್ನು ಅರಿಯುವ ಒಳಗಣ್ಣು ಮತ್ತು ಗ್ರಹಿಕೆಯೇ ಇಲ್ಲದವನಿಗೆ ಆ ಪರಮತತ್ತ್ವದ ಅರಿವಾಗುವುದಿಲ್ಲ ಎಂದು ಇಲ್ಲಿ ಮಾರ್ಮಿಕವಾಗಿ ಹೇಳಲಾಗಿದೆ.\n\nಅಂದರೆ, ಹೊರಗಿನ ಬೆಳಕು ಅಥವಾ ಶಬ್ದ ಎಷ್ಟೇ ದೊಡ್ಡದಾಗಿದ್ದರೂ ಅದನ್ನು ಗ್ರಹಿಸುವ ಶಕ್ತಿ ಇಲ್ಲದಿದ್ದರೆ ಹೇಗೆ ಪ್ರಯೋಜನವಿಲ್ಲವೋ, ಹಾಗೆಯೇ ಮನುಷ್ಯನೊಳಗೆ ಸತ್ಯದ ಮಾರ್ಗವನ್ನು ಗುರುತಿಸುವ ಆಂತರಿಕ ಎಚ್ಚರವಿಲ್ಲದಿದ್ದರೆ ಆಧ್ಯಾತ್ಮಿಕ ಸತ್ಯದ ದಾರಿ ಅವನಿಗೆ ಎಂದಿಗೂ ತಿಳಿಯುವುದಿಲ್ಲ ಎಂಬುದೇ ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":64,"o":"ಇವನಾರವ,\n ಇವನಾರವ,\n ಇವನಾರವನೆಂದೆನಿಸದಿರಯ್ಯಾ.\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವನೆಂದೆನಿಸಯ್ಯಾ.\n ಕೂಡಲಸಂಗಮದೇವಾ\n ನಿಮ್ಮ ಮನೆಯ ಮಗನೆಂದೆನಿಸಯ್ಯಾ.","t":{"en":"Who is he,\nwho is he,\ndo not let it be said, who is he, O Lord.\nHe is ours,\nhe is ours,\nlet it be said, he is ours, O Lord.\nO Koodalasangamadeva,\nlet me be called a son of your house, O Lord.","hi":"यह किसका है,\nयह किसका है,\nयह किसका है, ऐसा मत कहलवाइए, हे स्वामी।\nयह हमारा है,\nयह हमारा है,\nयह हमारा है, ऐसा कहलवाइए, हे स्वामी।\nहे कूडलसंगमदेव,\nआपके घर का पुत्र है, ऐसा कहलवाइए, हे स्वामी।","mr":"हा कोणाचा,\nहा कोणाचा,\nहा कोणाचा असे मला म्हणवू नका, हे प्रभो.\nहा आमचा,\nहा आमचा,\nहा आमचा असे मला म्हणवून घ्या, हे प्रभो.\nहे कूडलसंगमदेवा,\nआपल्या घराचा मुलगा असे मला म्हणवून घ्या.","fr":"« Qui est celui-ci,\nqui est celui-ci,\nqui est celui-ci ? » — ne fais pas dire cela, Ô Seigneur.\n« Celui-ci est des nôtres,\ncelui-ci est des nôtres,\ncelui-ci est des nôtres » — fais dire cela, Ô Seigneur.\nÔ Koodalasangamadeva,\nfais dire que je suis un fils de ta maison, Ô Seigneur.","te":"ఇతను ఎవరివాడు,\nఇతను ఎవరివాడు,\nఇతను ఎవరివాడని అనిపించవద్దు స్వామీ.\nఇతను మనవాడు,\nఇతను మనవాడు,\nఇతను మనవాడని అనిపించు స్వామీ.\nఓ కూడలసంగమదేవా,\nమీ ఇంటి కుమారుడని అనిపించు స్వామీ.","kn":"ಇವನಾರವ,\n ಇವನಾರವ,\n ಇವನಾರವನೆಂದೆನಿಸದಿರಯ್ಯಾ.\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವ,\n ಇವ ನಮ್ಮವನೆಂದೆನಿಸಯ್ಯಾ.\n ಕೂಡಲಸಂಗಮದೇವಾ\n ನಿಮ್ಮ ಮನೆಯ ಮಗನೆಂದೆನಿಸಯ್ಯಾ."},"m":{"en":"This Vachana expresses a profound aspiration for universal brotherhood and complete social inclusion, rejecting the alienation caused by divisions of caste, status, or lineage.\n\nThe plea to never be looked upon as an outsider (\"Who is he?\") and instead be embraced entirely as one's own (\"He is ours\") strikes at the very root of social discrimination and hierarchy.\n\nBy asking Kudalasangamadeva, the Formless Supreme Reality, to be recognized as a true child of the spiritual household, the Vachana envisions an egalitarian community of Sharanas bound by shared kinship and equality rather than birth.","hi":"इस वचन का केंद्रीय भाव यह है कि मनुष्य को परायेपन और अलगाव की भावना से मुक्त होकर संपूर्ण आत्मीयता और अपनेपन का अनुभव होना चाहिए।\n\nयहाँ कूडलसंगमदेव के रूप में संबोधित निराकार परमतत्त्व से यह याचना की गई है कि किसी को भी देखकर मन में यह प्रश्न न उठे कि 'यह कौन है या किसका है', जिससे दूरी या भेदभाव प्रकट होता हो।\n\nइसके विपरीत, प्रत्येक व्यक्ति को 'यह हमारा है, यह हमारा अपना है' कहकर निस्संकोच स्वीकार करने की उदात्त दृष्टि की कामना की गई है।\n\nइस वचन का आध्यात्मिक और सामाजिक महत्व यह है कि साधक स्वयं को परमतत्त्व के घर के पुत्र के रूप में देखा जाना चाहता है, जो मानवीय समानता और विश्वबंधुत्व के गहरे शरण दर्शन को दर्शाता है।","mr":"हे वचन सामाजिक आणि आध्यात्मिक एकात्मतेचा अत्यंत जिव्हाळ्याचा संदेश देते, जिथे कोणत्याही व्यक्तीला 'हा कोणाचा आहे?' असे विचारून परके किंवा वेगळे मानू नये, अशी आर्त विनवणी केली आहे.\n\nसमाजात कोणताही भेदभाव न ठेवता प्रत्येकाला 'हा आमचाच आहे' अशा आत्मीयतेने आणि आपुलकीने जवळ केले जावे, हा या वचनाचा मुख्य गाभा आहे.\n\nकूडलसंगमदेव या नावाने संबोधलेल्या निराकार परमतत्त्वाच्या विशाल परिवारातील एक सदस्य म्हणून, म्हणजेच 'तुमच्याच घरातील मुलगा' म्हणून स्वतःचा स्वीकार व्हावा, ही यामागील उदात्त भावना आहे.\n\nथोडक्यात, सर्व प्रकारचे सामाजिक दुरावे मिटवून संपूर्ण मानवजातीमध्ये आणि सत्यशोधकांच्या समुदायात एकतेची व आपलेपणाची भावना निर्माण करणे, हेच या वचनाचे आध्यात्मिक महत्त्व आहे.","fr":"Ce vachana exprime un appel profond à dépasser toutes les barrières d'exclusion sociale pour embrasser une fraternité humaine universelle.\n\nIl rejette fermement l'attitude discriminatoire qui consiste à traiter autrui comme un étranger en s'interrogeant sur son origine ou son appartenance.\n\nÀ l'inverse, le texte invite à reconnaître chaque être avec bienveillance comme un membre à part entière de sa propre communauté.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Koodalasangamadeva, le poète aspire finalement à être accepté dans une intimité spirituelle absolue, tel un enfant appartenant au foyer même du Principe suprême.","te":"మనుషుల మధ్య వేర్పాటువాదాన్ని, పరాయితనాన్ని తొలగించి సంపూర్ణ ఆత్మీయతను, మానవీయ సమానత్వాన్ని చాటిచెప్పడమే ఈ వచనం యొక్క ప్రధాన ఉద్దేశం.\n\nసమాజంలో ఎవరినీ కూడా కులం, వర్గం లేదా ఇతర భేదాలతో \"ఇతను ఎవరో, ఎవరివాడో\" అని పరాయివాడిగా చూసే పరిస్థితి రాకూడదని ఇక్కడ బలంగా వ్యక్తమవుతోంది.\n\nఅందుకు భిన్నంగా, ప్రతి మనిషినీ \"ఇతను మనవాడు, మన సొంత మనిషి\" అని ఆత్మీయంగా అక్కున చేర్చుకునే విశాల హృదయం ఉండాలని ఈ వచనం ఆకాంక్షిస్తోంది.\n\nకూడలసంగమదేవ అనే నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, సకల మానవాళిని ఒకే ఆధ్యాత్మిక కుటుంబానికి చెందిన బిడ్డలుగా భావించే సమతాభావాన్ని ఈ వచనం ఆవిష్కరిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಮನುಷ್ಯರ ನಡುವೆ ಮೇಲು-ಕೀಳು ಅಥವಾ ಪರಕೀಯ ಭಾವನೆಯನ್ನು ಹುಟ್ಟಿಸುವ 'ಇವನು ಯಾರ ಕಡೆಯವನು?' ಎಂಬ ಪ್ರತ್ಯೇಕತೆಯ ಪ್ರಶ್ನೆಗಳನ್ನು ನಿರಾಕರಿಸುವುದೇ ಆಗಿದೆ.\n\nಸಮಾಜದಲ್ಲಿ ಯಾರನ್ನೂ ಹೊರಗಿನವರೆಂದು ದೂರವಿಡದೆ, ಪ್ರತಿಯೊಬ್ಬರನ್ನೂ 'ಇವನು ನಮ್ಮವನು' ಎಂದು ತುಂಬು ಹೃದಯದಿಂದ ಒಪ್ಪಿಕೊಳ್ಳುವ ಸಮಾನತೆಯ ಮತ್ತು ಆತ್ಮೀಯತೆಯ ಮನೋಭಾವ ಇರಬೇಕು ಎಂದು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸನ್ನಿಧಿಯಲ್ಲಿ ಹಾಗೂ ಶರಣರ ಬಳಗದಲ್ಲಿ, ತನ್ನನ್ನು ಒಬ್ಬ ಪರಕೀಯನಂತೆ ಕಾಣದೆ ಆ ಮನೆಯ ಮಗನಂತೆಯೇ ಕಾಣುವಂತಾಗಲಿ ಎಂಬ ಹಂಬಲ ಇಲ್ಲಿ ವ್ಯಕ್ತವಾಗಿದೆ.\n\nಒಟ್ಟಾರೆಯಾಗಿ, ಜಾತಿ, ಕುಲ ಮತ್ತು ಅಂತಸ್ತಿನ ಭೇದಭಾವಗಳನ್ನು ಅಳಿಸಿಹಾಕಿ, ಎಲ್ಲರನ್ನೂ ಒಂದೇ ಕುಟುಂಬದವರಂತೆ ಬೆಸೆಯುವ ಮಾನವೀಯ ಏಕತೆಯೇ ಶರಣರ ನಿಜವಾದ ತತ್ತ್ವವಾಗಿದೆ ಎಂಬುದನ್ನು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ."}},{"no":65,"o":"ಉಂಬ ಬಟ್ಟಲು ಬೇರೆ ಕಂಚಲ್ಲ,\n ನೋಡುವ ದರ್ಪಣ ಬೇರೆ ಕಂಚಲ್ಲ.\n ಭಾಂಡ ಒಂದೆ ಭಾಜನ ಒಂದೆ,\n ಬೆಳಗೆ ಕನ್ನಡಿಯೆನಿಸಿತ್ತಯ್ಯಾ.\n ಅರಿದಡೆ ಶರಣ, ಮರೆದಡೆ ಮಾನವ,\n ಮರೆಯದೆ ಪೂಜಿಸು ಕೂಡಲಸಂಗನ.","t":{"en":"The plate from which one eats is not a different bronze,\nthe mirror into which one looks is not a different bronze.\nThe metal is one, the vessel is one;\nwhen polished, it comes to be called a mirror, O brother.\nIf one awakens in awareness, one is a *Sharana*; if one falls into forgetfulness, a mere mortal—\nworship Koodalasanga without forgetting.","hi":"भोजन करने की कटोरी अलग काँसा नहीं है,\nदेखने का दर्पण अलग काँसा नहीं है।\nपात्र एक ही है, भाजन एक ही है,\nमाँजने पर दर्पण कहलाया, हे स्वामी।\nजाने तो शरण, भूले तो मानव,\nभूले बिना पूजो कूडलसंग को।","mr":"जेवायचे ताट काही वेगळे कांसे नाही,\nपाहायचा दर्पण काही वेगळे कांसे नाही.\nभांडे एकच, पात्रही एकच,\nघासून उजळले की तो आरसा म्हणवला, हे स्वामी.\nजाणले तर शरण, विसरले तर मानव,\nन विसरता पूजन कर कूडलसंगाचे.","fr":"L'écuelle dans laquelle on mange n'est pas d'un autre bronze,\nle miroir dans lequel on se regarde n'est pas d'un autre bronze.\nLa matière est une, le récipient est un ;\nlorsqu'on le polit, on l'appelle miroir, mon frère.\nLorsqu'il s'éveille à la conscience, il est un Sharana ; lorsqu'il tombe dans l'oubli, il est un simple humain :\nsans jamais oublier, vénère Koodalasanga.","te":"ఉండే గిన్నె వేరే కంచు కాదు,\nచూసుకునే అద్దం వేరే కంచు కాదు.\nభాండం ఒక్కటే, భాజనం ఒక్కటే,\nతోమగానే అద్దమనిపించుకున్నది ఓ స్వామీ.\nతెలుసుకుంటే శరణుడు, మరచిపోతే మానవుడు,\nమరవక పూజించు కూడలసంగని.","kn":"ಉಂಬ ಬಟ್ಟಲು ಬೇರೆ ಕಂಚಲ್ಲ,\n ನೋಡುವ ದರ್ಪಣ ಬೇರೆ ಕಂಚಲ್ಲ.\n ಭಾಂಡ ಒಂದೆ ಭಾಜನ ಒಂದೆ,\n ಬೆಳಗೆ ಕನ್ನಡಿಯೆನಿಸಿತ್ತಯ್ಯಾ.\n ಅರಿದಡೆ ಶರಣ, ಮರೆದಡೆ ಮಾನವ,\n ಮರೆಯದೆ ಪೂಜಿಸು ಕೂಡಲಸಂಗನ."},"m":{"en":"The central message of this Vachana is that the difference between an ordinary human being and an enlightened Sharana lies not in their fundamental nature, but in the awakening of spiritual awareness (Arivu).\n\nUsing the striking metaphor of bronze, the Vachana illustrates that the metal used to make an everyday eating bowl and a reflective mirror is identical; the bronze becomes a mirror simply when it is polished and made to shine.\n\nSimilarly, all human beings share the same essential substance, yet one who remains in spiritual forgetfulness stays merely mortal, whereas one whose inner consciousness is purified and awakened to the truth becomes a Sharana.\n\nTherefore, the Vachana urges the seeker to continually cultivate this inner illumination without ever lapsing into forgetfulness, remaining steadfastly oriented towards the Formless Supreme Reality, Kudalasangama.","hi":"इस वचन का केंद्रीय भाव यह है कि सामान्य मनुष्य और प्रबुद्ध शरण के मूल तत्त्व में कोई भिन्नता नहीं है, अंतर केवल आत्म-जागृति और शुद्धता का है।\n\nभोजन करने का कटोरा और चेहरा देखने का दर्पण अलग-अलग कांसे से नहीं बने होते; दोनों की मूल धातु और पात्र एक ही हैं, किंतु जब उसी कांसे को माँजकर चमकाया जाता है, तो वह दर्पण बन जाता है।\n\nइसी प्रकार, जो अपने भीतर के परम सत्य को जान लेता है वह 'शरण' है, और जो इस बोध को भूलकर अज्ञान में रहता है वह साधारण 'मानव' ही रह जाता है।\n\nअतः यह वचन इस बात की ओर संकेत करता है कि अज्ञान की मलिनता को मिटाकर और अपनी चेतना को सदा जागृत रखते हुए, बिना भूले निराकार परमतत्त्व कूडलसंगम की उपासना करनी चाहिए।","mr":"या वचनाचा मुख्य आशय असा आहे की, सामान्य माणूस आणि आत्मज्ञानी शरण हे मूळ स्वरूपाने वेगळे नसून एकाच चैतन्याचे अंश आहेत.\n\nज्याप्रमाणे जेवणाचे ताट आणि चेहरा पाहण्याचा आरसा हे दोन्ही एकाच कांस्य धातूपासून बनलेले असतात, परंतु घासून स्वच्छ केल्यामुळे व उजळल्यामुळे त्या धातूला आरशाचे रूप प्राप्त होते, तसेच मानवी अस्तित्वाचेही आहे.\n\nया मूळ सत्यतत्त्वाची जाणीव होऊन जेव्हा अंतःकरण निर्मळ होते तेव्हा तोच जीव 'शरण' बनतो, आणि या सत्याचा विसर पडला की तो केवळ एक सामान्य 'मानव' राहतो.\n\nम्हणूनच, अज्ञानाची पुटे दूर सारून कूडलसंगमदेव या परमतत्त्वाचे स्मरण अखंड जागृत ठेवण्याचे व त्याची उपासना करण्याचे आध्यात्मिक महत्त्व हे वचन अधोरेखित करते.","fr":"Ce vachana met en lumière l’unité fondamentale de l’essence humaine à travers la métaphore du bronze : le bol dans lequel on mange et le miroir dans lequel on se regarde sont façonnés à partir de la même matière première.\n\nLa différence ne réside donc pas dans la substance, mais dans la clarté : c’est uniquement lorsqu’il est poli et brillant que le métal ordinaire devient un miroir capable de refléter la lumière.\n\nDe la même manière, l’être humain et le Sharana partagent la même nature profonde ; celui qui s’éveille à la connaissance de soi (Arivu) devient un Sharana, tandis que celui qui demeure dans l’oubli et l’ignorance reste un simple mortel.\n\nLa portée spirituelle de ce vachana réside dans l’invitation à polir sa conscience par une vigilance constante, afin de vénérer sans jamais l’oublier la Réalité suprême sans forme, invoquée ici sous le nom de Koodalasanga.","te":"ఈ వచనం వివరిస్తున్న ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, భుజించడానికి వాడే గిన్నె, ముఖం చూసుకునే అద్దం రెండూ ఒకే కంచు లోహంతో తయారైనట్లే, సాధారణ మానవుడికి మరియు శరణుడికి మూలతత్త్వం ఒక్కటే.\n\nమాలిన్యాన్ని తొలగించి తోమినప్పుడు అదే కంచు పాత్ర ప్రకాశవంతమైన అద్దంగా మారినట్లు, అంతరంగం నిర్మలమైనప్పుడే మనిషిలో ఉన్నతమైన ఆధ్యాత్మిక చైతన్యం వెలుగుచూస్తుంది.\n\nతనలోని ఈ నిజతత్త్వాన్ని ఎరిగినవాడే శరణుడు కాగా, ఆ ఎరుకను కోల్పోయి అజ్ఞానపు మరపులో ఉండిపోయినవాడు కేవలం సాధారణ మానవుడిగా మిగిలిపోతాడు.\n\nకాబట్టి ఆ ఆత్మవిస్మృతిని వీడి, నిరంతర ఎరుకతో కూడలసంగముడిగా పిలువబడే నిరాకార పరమతత్త్వాన్ని ధ్యానించాలని ఈ వచనం ప్రబోధిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಸಾಮಾನ್ಯ ಮನುಷ್ಯನಿಗೂ ಮತ್ತು ಅರಿವನ್ನು ಪಡೆದ ಶರಣನಿಗೂ ಮೂಲತಃ ಯಾವುದೇ ಬೇರೆಬೇರೆ ಸ್ವಭಾವವಿಲ್ಲ; ಇಬ್ಬರಲ್ಲೂ ಇರುವ ಚೈತನ್ಯ ಒಂದೇ ಆಗಿರುತ್ತದೆ.\n\nಊಟ ಮಾಡುವ ಕಂಚಿನ ಬಟ್ಟಲು ಮತ್ತು ಮುಖ ನೋಡುವ ಕಂಚಿನ ಕನ್ನಡಿ ಇವೆರಡೂ ಒಂದೇ ಲೋಹದಿಂದ ಮಾಡಲ್ಪಟ್ಟಿದ್ದರೂ, ಆ ಕಂಚನ್ನು ಚೆನ್ನಾಗಿ ತಿಕ್ಕಿ ಬೆಳಗಿದಾಗ ಮಾತ್ರ ಅದು ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರತಿಬಿಂಬ ತೋರಿಸುವ ಕನ್ನಡಿಯಾಗುತ್ತದೆ.\n\nಹಾಗೆಯೇ ಮನುಷ್ಯನು ತನ್ನೊಳಗಿನ ಅಜ್ಞಾನ ಅಥವಾ ಮರವೆಯನ್ನು ಕಳೆದುಕೊಂಡು ಆತ್ಮದ ಅರಿವನ್ನು ಜಾಗೃತಗೊಳಿಸಿಕೊಂಡಾಗ 'ಶರಣ' ಎನಿಸಿಕೊಳ್ಳುತ್ತಾನೆ, ಆ ಅರಿವನ್ನು ಮರೆತಾಗ ಸಾಮಾನ್ಯ 'ಮಾನವ'ನಾಗಿಯೇ ಉಳಿಯುತ್ತಾನೆ.\n\nಆದ್ದರಿಂದ ಮರವೆಯನ್ನು ಬಿಟ್ಟು, ಸದಾ ಎಚ್ಚರದ ಅರಿವಿನಿಂದ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲಸಂಗಮನನ್ನು ಅರಿತು ಪೂಜಿಸಬೇಕು ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":66,"o":"ಉಂಬಲ್ಲಿ [ಊ]ಡುವಲ್ಲಿ ಕ್ರೀಯಳಿಯಿತ್ತೆಂಬರು,\n ಕೊಂಬಲ್ಲಿ ಕೊಡುವಲ್ಲಿ ಕುಲವನರಸುವರು,\n ಎಂತಯ್ಯಾ ಅವರ ಭಕ್ತರೆಂತೆಂಬೆ?\n ಎಂತಯ್ಯಾ ಅವರ ಯುಕ್ತರೆಂತೆಂಬೆ?\n ಕೂಡಲಸಂಗಮದೇವಾ ಕೇಳಯ್ಯಾ,\n ಹೊಲತಿ ಶುದ್ಧ ನೀರ ಮಿಂದಂತಾಯಿತ್ತಯ್ಯಾ.","t":{"en":"In eating and in dressing, they say caste-distinctions have vanished;\nin taking and in giving a bride, they search for caste.\nHow, O Lord—how can I call them devotees?\nHow, O Lord—how can I call them the worthy ones?\nListen, O Koodalasangamadeva:\nit is like an impure woman bathing in pure water, O Lord.","hi":"खाने में, पहनने में कहते हैं कि जाति-भेद मिट गया,\nकन्या लेने में, देने में कुल ढूँढ़ते हैं,\nकैसे, हे स्वामी, उन्हें भक्त कैसे कहूँ?\nकैसे, हे स्वामी, उन्हें युक्त कैसे कहूँ?\nहे कूडलसंगमदेव, सुनिए,\nयह तो ऐसा हुआ जैसे रजस्वला स्त्री ने शुद्ध जल से स्नान किया हो, हे स्वामी।","mr":"जेवताना आणि नेसताना कर्माचा भेद नाहीसा झाला असे म्हणतात,\nमुलगी घेताना आणि देताना मात्र जात शोधतात,\nहे प्रभो, त्यांना भक्त कसे म्हणू?\nहे प्रभो, त्यांना युक्त कसे म्हणू?\nहे कूडलसंगमदेवा, ऐक ना,\nहे तर विटाळशीने शुद्ध पाण्याने स्नान केल्यासारखे झाले, हे प्रभो!","fr":"Lorsqu'il s'agit de manger et de se vêtir, ils disent que les distinctions d'actes rituels ont disparu,\nmais lorsqu'il s'agit de prendre ou de donner en mariage, ils cherchent la caste ;\ncomment donc, Ô Seigneur, pourrais-je les appeler des dévots ?\ncomment donc, Ô Seigneur, pourrais-je les appeler des êtres dignes ?\nÔ Koodalasangamadeva, écoute, Ô Seigneur :\nc'est comme une femme en état d'impureté menstruelle qui se baigne dans une eau pure, Ô Seigneur.","te":"తినేటప్పుడు, కట్టుకునేటప్పుడు కర్మభేదం నశించిందంటారు,\nతీసుకునేటప్పుడు, ఇచ్చేటప్పుడు కులాన్ని వెతుకుతారు,\nఓ స్వామీ, వారిని భక్తులని ఎలా అనగలను?\nఓ స్వామీ, వారిని యుక్తులని ఎలా అనగలను?\nఓ కూడలసంగమదేవా విను స్వామీ,\nఇది మైలపడిన స్త్రీ నిర్మల జలంలో స్నానం చేసినట్లయింది స్వామీ.","kn":"ಉಂಬಲ್ಲಿ [ಊ]ಡುವಲ್ಲಿ ಕ್ರೀಯಳಿಯಿತ್ತೆಂಬರು,\n ಕೊಂಬಲ್ಲಿ ಕೊಡುವಲ್ಲಿ ಕುಲವನರಸುವರು,\n ಎಂತಯ್ಯಾ ಅವರ ಭಕ್ತರೆಂತೆಂಬೆ?\n ಎಂತಯ್ಯಾ ಅವರ ಯುಕ್ತರೆಂತೆಂಬೆ?\n ಕೂಡಲಸಂಗಮದೇವಾ ಕೇಳಯ್ಯಾ,\n ಹೊಲತಿ ಶುದ್ಧ ನೀರ ಮಿಂದಂತಾಯಿತ್ತಯ್ಯಾ."},"m":{"en":"This Vachana sharply critiques the hypocrisy of those who claim to have transcended caste distinctions only in superficial matters while clinging to them in major social decisions.\n\nPeople readily declare that ritual and caste barriers have dissolved when it comes to dining together or dressing, yet they strictly scrutinize lineage and caste when arranging marriages.\n\nThe Vachana questions how such individuals with double standards can ever be considered true devotees or spiritually worthy people.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, it compares this superficial equality to an impure person bathing in pure water without any genuine inner cleansing or transformation.","hi":"यह वचन सामाजिक और आध्यात्मिक जीवन में व्याप्त जातिगत पाखंड तथा दोहरे मापदंडों की कड़ी आलोचना करता है।\n\nवचन में यह स्पष्ट किया गया है कि जो लोग खान-पान और वस्त्र पहनावे के बाहरी व्यवहार में तो यह दावा करते हैं कि उनके भीतर से जाति और कर्मकांड का भेद मिट गया है, परंतु वैवाहिक संबंध जोड़ने या लेन-देन के समय कुल और जाति की तलाश करते हैं, उन्हें सच्चा भक्त या आध्यात्मिक रूप से युक्त कदाचित नहीं कहा जा सकता।\n\nनिराकार परमतत्त्व कूडलसंगमदेव को संबोधित करते हुए इस वचन का मूल आशय यह है कि जब तक मनुष्य के अंतर्मन से कुल-जाति का अहंकार और भेदभाव पूरी तरह समाप्त नहीं होता, तब तक उसकी बाहरी शुद्धता और भक्ति का दिखावा एक अपवित्र स्त्री द्वारा शुद्ध जल में स्नान करने के समान निरर्थक है।","mr":"हे वचन सामाजिक आणि आध्यात्मिक व्यवहारातील दुटप्पीपणावर तीव्र प्रहार करते.\n\nजेवणखाण आणि वेशभूषा यांसारख्या बाह्य गोष्टींमध्ये आपली जुनी कर्मकांडे आणि जातपात नष्ट झाली आहे असा दावा काही लोक करतात, परंतु लग्नसंबंध किंवा देवाणघेवाणीच्या प्रत्यक्ष व्यवहारात मात्र ते पुन्हा मूळ कुळ आणि जातीचाच शोध घेतात.\n\nअशा दुटप्पी वागणाऱ्या लोकांना खरा भक्त किंवा आध्यात्मिकदृष्ट्या एकरूप झालेला 'युक्त' कसे म्हणता येईल, असा थेट प्रश्न येथे उपस्थित केला आहे.\n\nकूडलसंगमदेव या परमतत्त्वाला स्मरून हे वचन स्पष्ट करते की, मनातील जातीभेदाची अशुद्धता कायम ठेवून केलेले बाह्य समतेचे प्रदर्शन हे अपवित्र अवस्थेतील स्त्रीने केवळ शुद्ध पाण्याने स्नान करण्यासारखेच वरवरचे आणि निरर्थक ठरते.","fr":"Ce vachana dénonce avec vigueur l'hypocrisie sociale de ceux qui prétendent avoir dépassé les discriminations de caste lorsqu'il s'agit simplement de partager un repas ou de se vêtir, mais qui s'empressent de scruter la lignée et l'origine sociale dès qu'il est question d'alliances matrimoniales.\n\nLe texte souligne l'incohérence profonde d'un tel comportement et refuse de considérer ces individus comme de véritables dévots ou des êtres spirituellement accomplis, car leur égalitarisme ne reste qu'une façade de convenance.\n\nÀ travers l'image frappante d'une femme impure qui se baigne dans une eau pure sans que sa condition intérieure ne change, le vachana illustre l'inutilité d'une réforme superficielle qui ne déracine pas les préjugés de caste au fond de la conscience.\n\nS'adressant à la Réalité suprême sans forme sous la signature spirituelle de Koodalasangamadeva, cette réflexion rappelle que la véritable intégrité spirituelle exige une égalité absolue et sans compromis dans toutes les sphères de l'existence humaine.","te":"ఈ వచనం కులభేదాలను పాటించే కపట భక్తుల ద్వంద్వ ప్రవృత్తిని తీవ్రంగా విమర్శిస్తున్నది.\n\nసహపంక్తి భోజనాలు చేసేటప్పుడు, వస్త్రధారణ వంటి బాహ్య వ్యవహారాలలో కులభేదాలు, పూర్వాచారాలు తొలగిపోయాయని పైకి చెప్పుకుంటూనే, పెళ్లిళ్ల వంటి సంబంధ బాంధవ్యాలను కలుపుకునేటప్పుడు మాత్రం కులాన్ని వెతికేవారిని నిజమైన భక్తులని గానీ, పరమసత్యాన్ని ఎరిగిన యుక్తులని గానీ అనలేమని ఈ వచనం స్పష్టం చేస్తున్నది.\n\nకూడలసంగమదేవా అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, అటువంటి వేషధారుల ఆచరణ అశుచియైన స్త్రీ నిర్మలమైన నీటితో స్నానం చేసినట్లుగా కేవలం బాహ్యశుద్ధికి మాత్రమే పరిమితమై, అంతరంగంలో కులమనే మైలను అలాగే ఉంచుకుంటుందని ఈ వచనం వివరిస్తున్నది.","kn":"ಈ ವಚನದಲ್ಲಿ ಕೇವಲ ತೋರಿಕೆಗಾಗಿ ಸಮಾನತೆಯ ಮಾತನ್ನಾಡುವ ಡಾಂಭಿಕ ಜನರ ಇಬ್ಬಗೆಯ ನೀತಿಯನ್ನು ಬಹಳ ಸ್ಪಷ್ಟವಾಗಿ ಪ್ರಶ್ನಿಸಲಾಗಿದೆ.\n\nಜೊತೆಯಲ್ಲಿ ಕುಳಿತು ಊಟ ಮಾಡುವಾಗ ಮತ್ತು ಬಟ್ಟೆಬರೆಗಳನ್ನು ತೊಡುವಾಗ ನಮ್ಮಲ್ಲಿ ಹಿಂದಿನ ಜಾತಿ-ಕುಲದ ಭೇದವೆಲ್ಲವೂ ಅಳಿದುಹೋಗಿದೆ ಎಂದು ಕೆಲವರು ಮೇಲ್ನೋಟಕ್ಕೆ ಹೇಳಿಕೊಳ್ಳುತ್ತಾರೆ.\n\nಆದರೆ ಮದುವೆಯಂತಹ ಹೆಣ್ಣು ಕೊಡುವ ಮತ್ತು ತೆಗೆದುಕೊಳ್ಳುವ ನಿಜವಾದ ಸಂಬಂಧದ ವಿಷಯ ಬಂದಾಗ ಮಾತ್ರ ಮತ್ತೆ ಮೂಲ ಕುಲವನ್ನೇ ಹುಡುಕುವವರನ್ನು ನಿಜವಾದ ಭಕ್ತರು ಅಥವಾ ಅರಿವುಳ್ಳ ಯುಕ್ತರು ಎಂದು ಕರೆಯಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ.\n\nಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯವನ್ನು ಸಾಕ್ಷಿಯಾಗಿಟ್ಟುಕೊಂಡು ಹೇಳುವುದಾದರೆ, ಮನಸ್ಸಿನೊಳಗಿನ ಜಾತಿಭಾವನೆಯನ್ನು ಬಿಡದ ಇವರ ಹೊರಗಿನ ಆಚರಣೆಯು, ಸೂತಕದಲ್ಲಿದ್ದವಳು ಕೇವಲ ಮೇಲ್ನೋಟಕ್ಕೆ ಶುದ್ಧ ನೀರಿನಲ್ಲಿ ಸ್ನಾನ ಮಾಡಿದರೂ ಒಳಗಿನಿಂದ ಶುದ್ಧಳಾಗದ ಸ್ಥಿತಿಯಂತೆಯೇ ವ್ಯರ್ಥವಾಗಿದೆ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ಆಶಯವಾಗಿದೆ."}},{"no":67,"o":"ಉಟ್ಟು ತೊಟ್ಟು ಪೂಜ್ಯವಾಗಿ ಬಂದ ಜಂಗಮ ವಿಶೇಷವೆಂದು,\n ಕಂತೆ ಬೊಂತೆಯ ಜಂಗಮ ಬಂದಡೆ ಹೀನವೆಂದು\n ಕಂಡೆನಾದಡೆ ಪಂಚಮಹಾಪಾತಕ.\n ಇದು ಕಾರಣ, ಅನ್ನ ವಸ್ತ್ರ ಧನ ಮಾಟದಲ್ಲಿ\n ಎರಡಾಗಿ ಕಂಡೆನಾದಡೆ ನರಕದಲ್ಲಿಕ್ಕುವ,\n ಕೂಡಲಸಂಗಮದೇವ.","t":{"en":"To regard the *Jangama* who arrives richly robed, adorned, and venerable as superior,\nand to regard the *Jangama* who arrives in patched rags and tattered quilt as lowly—\nif I look upon them thus, it is the five great sins.\nTherefore, in offering food, clothing, wealth, and service,\nif I see them as two, he will cast me into hell,\nKoodalasangamadeva.","hi":"पहन-ओढ़कर पूज्य रूप में आए जंगम को विशेष मानकर,\nफटे-पुराने चिथड़ोंवाले जंगम के आने पर उसे हीन मानकर\nदेखूँ तो पंचमहापातक है।\nइस कारण, अन्न, वस्त्र, धन और सेवा में\nदो तरह से देखूँ तो नरक में डालेंगे,\nकूडलसंगमदेव।","mr":"वस्त्रे-अलंकार परिधान करून पूज्य रूपात आलेल्या जंगमाला विशेष म्हणून,\nगोधडी-वाकळ पांघरलेला जंगम आल्यास त्याला हीन म्हणून\nमी पाहिले, तर ते पंचमहापातक ठरेल.\nया कारणास्तव, अन्न, वस्त्र, धन आणि सेवेच्या कृतीत\nमी दोन प्रकारे पाहिले, तर नरकात टाकील,\nकूडलसंगमदेव.","fr":"Si je considère le Jangama venu vêtu et paré avec dignité comme supérieur,\net si, lorsqu'un Jangama arrive vêtu de haillons rapiécés, je le considère comme inférieur,\nc'est commettre les cinq grandes fautes.\nC'est pourquoi, si dans la nourriture, le vêtement, la richesse et le service,\nje fais une distinction entre les deux, il me jettera en enfer,\nKoodalasangamadeva.","te":"మంచి వస్త్రాలు ఆభరణాలు ధరించి పూజ్యంగా వచ్చిన జంగముడు విశేషమని,\nబొంతను కప్పుకొని వచ్చిన జంగముడు హీనుడని\nనేను చూసినట్లయితే అది పంచమహాపాతకం.\nఅందుచేత, అన్నం వస్త్రం ధనం పరిచర్యలలో\nఇద్దరినీ వేరుగా చూసినట్లయితే నరకంలో పడవేస్తాడు,\nకూడలసంగమదేవుడు.","kn":"ಉಟ್ಟು ತೊಟ್ಟು ಪೂಜ್ಯವಾಗಿ ಬಂದ ಜಂಗಮ ವಿಶೇಷವೆಂದು,\n ಕಂತೆ ಬೊಂತೆಯ ಜಂಗಮ ಬಂದಡೆ ಹೀನವೆಂದು\n ಕಂಡೆನಾದಡೆ ಪಂಚಮಹಾಪಾತಕ.\n ಇದು ಕಾರಣ, ಅನ್ನ ವಸ್ತ್ರ ಧನ ಮಾಟದಲ್ಲಿ\n ಎರಡಾಗಿ ಕಂಡೆನಾದಡೆ ನರಕದಲ್ಲಿಕ್ಕುವ,\n ಕೂಡಲಸಂಗಮದೇವ."},"m":{"en":"This Vachana emphasizes the uncompromising ethical principle of equality in revering and serving the Jangama, the wandering spiritual seeker and guide.\n\nIt strongly condemns the superficial tendency to judge spiritual stature by external appearances, declaring it one of the five great sins to treat a richly dressed, respectable-looking Jangama as superior while looking down upon one dressed in tattered rags.\n\nTrue service requires offering food, clothing, and wealth with complete impartiality, free from any prejudice based on outward status or attire.\n\nAddressing the Formless Supreme Consciousness as Kudalasangamadeva, the Vachana concludes that harbouring any sense of discrimination in the act of giving leads to spiritual downfall.","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक ज्ञान का प्रसार करने वाले और विरक्त जीवन जीने वाले जंगमों (प्रबुद्ध साधकों) का मूल्यांकन उनके बाहरी वेशभूषा या आर्थिक स्थिति के आधार पर नहीं किया जाना चाहिए।\n\nयदि कोई साधक सुंदर वस्त्र और आभूषण पहनकर सम्माननीय रूप में आए तो उसे विशेष मानना, और फटे-पुराने चिथड़े या गुदड़ी पहनकर आने वाले जंगम को हीन समझना पंचमहापाप के समान घोर अपराध है।\n\nयह वचन स्पष्ट करता है कि अन्न, वस्त्र, धन के अर्पण और सेवा-सत्कार के व्यवहार में किसी भी प्रकार का भेदभाव या दोहरा मापदंड नहीं होना चाहिए।\n\nनिराकार परमतत्त्व कूडलसंगमदेव के समक्ष यह दृढ़ निष्ठा व्यक्त की गई है कि बाहरी दिखावे के आधार पर जंगमों की सेवा में अंतर करना मनुष्य को सीधे पतन और नरक की ओर ले जाता है।","mr":"आध्यात्मिक ज्ञान आणि भक्तीचा प्रसार करणाऱ्या जंगम साधकांचा सन्मान करताना त्यांच्या बाह्य वेशभूषेवरून किंवा श्रीमंती-गरिबीवरून भेदभाव करणे पूर्णपणे चुकीचे आहे, हा विचार या वचनातून मांडला आहे.\n\nउत्तम वस्त्रे व अलंकार परिधान केलेल्या जंगमाला श्रेष्ठ मानणे आणि फाटकी गोधडी पांघरलेल्या साध्या जंगमाला तुच्छ लेखणे हे पंचमहापातकासारखे घोर पाप आहे.\n\nअन्न, वस्त्र, धन अर्पण करताना किंवा सेवेच्या आचरणात अशा प्रकारे दुजाभाव केल्यास कूडलसंगमदेव म्हणून संबोधले जाणारे परमतत्त्व त्याचे कठोर परिणाम भोगायला लावते, असा इशारा देत हे वचन बाह्य आडंबरापेक्षा समतेचे आणि निखळ सेवाभावाचे महत्त्व अधोरेखित करते.","fr":"Ce vachana met en lumière le principe d'égalité absolue dans l'accueil et la considération dus au Jangama, l'être spirituel réalisé qui chemine et partage la connaissance.\n\nIl dénonce fermement le préjugé superficiel qui consiste à honorer comme supérieur un Jangama vêtu avec apparat, tout en méprisant comme inférieur celui qui se présente vêtu de simples haillons rapiécés.\n\nÉtablir une telle discrimination fondée sur l'apparence extérieure est assimilé ici à la plus grave des fautes morales, qualifiée de quintuple grand péché.\n\nAinsi, en prenant à témoin la Réalité suprême sans forme invoquée sous le nom de Koodalasangamadeva, le texte affirme que faire la moindre différence entre eux lors du partage de la nourriture, des vêtements, des biens ou du service mène inévitablement à la déchéance spirituelle.","te":"బాహ్య వేషధారణను బట్టి ఆధ్యాత్మిక సాధకులైన జంగముల పట్ల వివక్ష చూపరాదనే సమతాభావాన్ని ఈ వచనం స్పష్టంగా వివరిస్తోంది.\n\nమంచి వస్త్రాలు, ఆభరణాలు ధరించి పూజ్యనీయంగా కనిపించే జంగముడిని గొప్పవాడిగా భావించి, చిరిగిన బొంతలు కప్పుకొని వచ్చే జంగముడిని తక్కువగా చూస్తే అది పంచమహాపాతకాలతో సమానమైన దోషమవుతుంది.\n\nఅందువల్ల అన్నం, వస్త్రాలు, ధనం సమర్పించే దాసోహ సేవలో జంగముల మధ్య ఎలాంటి భేదభావం చూపకూడదు.\n\nకూడలసంగమదేవ అనే అంకితనామంతో సూచించబడే నిరాకార పరమతత్త్వం సాక్షిగా, అటువంటి వివక్ష పాటిస్తే అధోగతి తప్పదని ఈ వచనం హెచ్చరిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರಾದ ಜಂಗಮರನ್ನು ಮತ್ತು ಮನುಷ್ಯರನ್ನು ಅವರ ಹೊರಗಿನ ಉಡುಗೆ-ತೊಡುಗೆ ಅಥವಾ ಆಡಂಬರದ ಆಧಾರದ ಮೇಲೆ ಅಳೆಯಬಾರದು ಎಂಬುದಾಗಿದೆ.\n\nಒಳ್ಳೆಯ ಬಟ್ಟೆ, ಆಭರಣಗಳನ್ನು ಧರಿಸಿ ಗೌರವಯುತವಾಗಿ ಕಾಣಿಸಿಕೊಳ್ಳುವ ಜಂಗಮರನ್ನು ಶ್ರೇಷ್ಠರೆಂದೂ, ಹರಿದ ಬಟ್ಟೆ ಅಥವಾ ಕೌದಿಯನ್ನು ಹೊದ್ದುಕೊಂಡು ಬರುವ ಬಡ ಜಂಗಮರನ್ನು ಕೀಳೆಂದೂ ಭಾವಿಸುವುದು ಐದು ಮಹಾಪಾಪಗಳನ್ನು ಮಾಡಿದಷ್ಟೇ ದೊಡ್ಡ ತಪ್ಪಾಗುತ್ತದೆ.\n\nಅನ್ನ, ಬಟ್ಟೆ, ಹಣವನ್ನು ನೀಡುವಾಗ ಮತ್ತು ಸೇವೆ ಅಥವಾ ಸತ್ಕಾರವನ್ನು ಮಾಡುವಾಗ ಇಂತಹ ಬಾಹ್ಯ ತೋರಿಕೆಯನ್ನು ನೋಡಿ ಭೇದಭಾವ ಮಾಡಿದರೆ, ಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯವು ಅದನ್ನು 결코 ಒಪ್ಪುವುದಿಲ್ಲ ಹಾಗೂ ಅದು ನರಕಕ್ಕೆ ಸಮಾನವಾದ ಪಾಪವಾಗುತ್ತದೆ.\n\nಜಂಗಮ ಸೇವೆಯಲ್ಲಿ ಮತ್ತು ದಾಸೋಹದಲ್ಲಿ ಬಡವ-ಬಲ್ಲಿದ ಎಂಬ ತಾರತಮ್ಯವಿಲ್ಲದೆ ಎಲ್ಲರನ್ನೂ ಸಮಾನವಾಗಿ ಕಾಣುವುದೇ ನಿಜವಾದ ಶರಣ ಧರ್ಮ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":68,"o":"ಉತ್ತಮಕುಲದಲ್ಲಿ ಹುಟ್ಟಿದೆನೆಂಬ\n ಕಷ್ಟತನದ ಹೊರೆಯ ಹೊರಿಸದಿರಯ್ಯಾ.\n ಕಕ್ಕಯ್ಯನೊಕ್ಕುದನಿಕ್ಕ ನೋಡಯ್ಯಾ,\n ದಾಸಯ್ಯ ಶಿವದಾನವನೆರೆಯ ನೋಡಯ್ಯಾ,\n ಮನ್ನಣೆಯ ಚೆನ್ನಯ್ಯನೆನ್ನುವ ಮನ್ನಿಸ.\n ಉನ್ನತ ಮಹಿಮ,\n ಕೂಡಲಸಂಗಮದೇವಾ, ಶಿವಧೋ ಶಿವಧೋ!","t":{"en":"Thenotion that I was born in a high caste—\ndo not make me bear that burden of misery, O Lord.\nLook, Kakkayya will not offer me his leftovers, O Lord;\nlook, Dasayya will not pour out Shiva's grace for me, O Lord;\nrevered Chennayya will not show me regard.\nO you of exalted glory,\nO Koodalasangamadeva, alas, Shiva, alas, Shiva!","hi":"उत्तम कुल में जन्मा हूँ—कहने की\nकठिनाई का बोझ मुझ पर मत लादिए, हे स्वामी।\nकक्कय्या उच्छिष्ट प्रसाद परोसने पर भी मेरी ओर नहीं देखते, हे स्वामी,\nदासय्या शिवदान उँड़ेलने पर भी मेरी ओर नहीं देखते, हे स्वामी,\nआदरणीय चेन्नय्या भी मुझे स्वीकार नहीं करते।\nहे उन्नत महिमावान,\nहे कूडलसंगमदेव, शिवधो शिवधो!","mr":"उत्तम कुळात जन्मलो आहे असे म्हणण्याचे\nकष्टप्रद ओझे माझ्यावर लादू नकोस, हे प्रभो!\nकक्कय्या उष्टे-उरलेले वाढतो की नाही ते पाहत नाही, हे प्रभो;\nदासय्या शिवदान ओततो की नाही ते पाहत नाही, हे प्रभो;\nसन्माननीय चेन्नय्या मला मान देत नाही.\nहे उन्नत महिमावान,\nहे कूडलसंगमदेवा, शिवधो शिवधो!","fr":"Ne me fais pas porter, ô Seigneur, le pénible fardeau\nde dire que je suis né dans une haute caste.\nVois, Kakkayya ne daigne pas même me jeter ses restes ;\nvois, Dasayya ne daigne pas me verser le don de Shiva ;\nle vénéré Chennayya ne m'accorde aucune considération.\nÔ Toi de gloire suprême,\nÔ Koodalasangamadeva, hélas, par Shiva, hélas !","te":"ఉత్తమ కులములో పుట్టాననే\nకష్టపు భారాన్ని నాపై మోపకండి ఓ స్వామీ.\nకక్కయ్య తన భుక్తశేషాన్ని పెట్టగా చూడడు,\nదాసయ్య శివదానాన్ని పోయగా చూడడు,\nమన్నన గల చెన్నయ్య నన్ను మన్నించడు.\nఉన్నత మహిమాన్వితుడా,\nఓ కూడలసంగమదేవా, శివధో శివధో!","kn":"ಉತ್ತಮಕುಲದಲ್ಲಿ ಹುಟ್ಟಿದೆನೆಂಬ\n ಕಷ್ಟತನದ ಹೊರೆಯ ಹೊರಿಸದಿರಯ್ಯಾ.\n ಕಕ್ಕಯ್ಯನೊಕ್ಕುದನಿಕ್ಕ ನೋಡಯ್ಯಾ,\n ದಾಸಯ್ಯ ಶಿವದಾನವನೆರೆಯ ನೋಡಯ್ಯಾ,\n ಮನ್ನಣೆಯ ಚೆನ್ನಯ್ಯನೆನ್ನುವ ಮನ್ನಿಸ.\n ಉನ್ನತ ಮಹಿಮ,\n ಕೂಡಲಸಂಗಮದೇವಾ, ಶಿವಧೋ ಶಿವಧೋ!"},"m":{"en":"This Vachana explains that birth into a socially privileged caste is not a blessing, but rather a heavy and painful burden that obstructs genuine spiritual communion.\n\nBy invoking revered Sharanas from marginalized backgrounds—Kakkayya, Dasayya, and the esteemed Channayya—the speaker laments that the stigma of high birth prevents them from offering sacred leftovers, sharing in spiritual grace, or extending their acceptance.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalasangamadeva, this poignant cry against caste hierarchy affirms that true spiritual nobility belongs to the realized Sharanas, while social superiority only alienates a seeker from the fellowship of the enlightened.","hi":"इस वचन का केंद्रीय भाव यह है कि उच्च कुल में जन्म लेने की सामाजिक प्रतिष्ठा वास्तव में आध्यात्मिक मार्ग में एक कष्टदायी बोझ के समान है।\n\nइसमें निराकार परमतत्त्व कूडलसंगमदेव को संबोधित करते हुए यह गहरा दुःख व्यक्त किया गया है कि कथित उच्च कुल में जन्म होने के कारण सच्चे शरणों का सान्निध्य और कृपा प्राप्त करने में बाधा आती है।\n\nयहाँ कक्कय्या, दासय्या और आदरणीय चेन्नय्या जैसे महान शरणों का उदाहरण देते हुए बताया गया है कि कुल के इस भेद के कारण वे भी प्रसादान्न, शिवदान (आध्यात्मिक कृपा) या अपना स्नेह व सम्मान प्रदान करने से संकोच करते हैं।\n\nइस प्रकार यह वचन जन्मजात जातीय श्रेष्ठता के अहंकार को नकारते हुए शरण समाज की आध्यात्मिक समता और सच्चे भक्तों की स्वीकृति को ही सर्वोच्च मानता है।","mr":"हे वचन स्पष्ट करते की, तथाकथित उच्च कुळात जन्माला येणे हा कोणताही विशेषाधिकार नसून, खऱ्या आध्यात्मिक वाटचालीत आणि शरण संगतीत येणारा तो एक कष्टदायक भार आहे.\n\nउच्च कुळाच्या अहंकारामुळे कक्कय्य आपला उरलेला प्रसाद देत नाही, दासय्य शिवदान करत नाही आणि आदरणीय चन्नय्यदेखील आपल्याला जवळ करत नाही, अशी खंत या वचनातून व्यक्त झाली आहे.\n\nम्हणूनच, महान महिमा असणाऱ्या कूडलसंगमदेव या परमतत्त्वाकडे वचनकार अत्यंत व्याकूळतेने अशी आर्त विनवणी करतात की, भक्तांपासून दूर लोटणाऱ्या या उच्च कुळाच्या जन्माचे ओझे माझ्यावर लादू नकोस.\n\nशरणांच्या आध्यात्मिक समतेच्या विचारात जन्मजात उच्चतेला कोणतेही स्थान नसून, अशा कुळाभिमानामुळे खऱ्या शिवशरणांच्या कृपेला आणि संगतीला मुकावे लागते, हेच या वचनाचे मुख्य मर्म आहे.","fr":"Ce vachana met en lumière le poids étouffant de la naissance dans une caste dite supérieure, que le poète considère comme un véritable fardeau d'affliction plutôt qu'un privilège.\n\nEn raison de ce statut social hérité, il déplore d'être tenu à l'écart par les Sharanas issus des communautés marginalisées : Kakkayya ne lui offre pas ses restes de nourriture, Dasayya ne lui verse pas le don sacré du babeurre, et le vénéré Channayya ne daigne même pas lui accorder son estime.\n\nCette douleur révèle que l'orgueil de la haute naissance crée un mur d'exclusion qui prive l'individu de la grâce, de la fraternité et de l'humilité authentique des véritables chercheurs spirituels.\n\nÀ travers un cri de détresse adressé à la Réalité suprême sans forme, invoquée sous le nom de Koodalasangamadeva, le texte rejette radicalement la hiérarchie des castes et aspire à une égalité spirituelle où seule compte la communion humaine.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన ఆంతర్యం ఏమిటంటే, సమాజంలో ఉత్తమ కులంలో పుట్టాననే భావన ఒక గొప్ప వరం కాదని, అది నిజమైన ఆధ్యాత్మిక సాంగత్యానికి అడ్డుపడే ఒక భారమైన శాపమని ఇక్కడ స్పష్టం చేయబడింది.\n\nఅగ్రకుల జన్మ అనే ఈ సామాజిక అడ్డుగోడ వల్ల కక్కయ్య తన శ్రమతో మిగిలిన ప్రసాదాన్ని పెట్టడం లేదని, దాసయ్య ఆధ్యాత్మిక జ్ఞానమనే శివదానాన్ని ప్రసాదించడం లేదని, లోకమంతా గౌరవించే చెన్నయ్య సైతం తనను దగ్గరకు తీసి మన్నించడం లేదని వచనకారుడు తీవ్రమైన ఆవేదనను వ్యక్తం చేస్తున్నాడు.\n\nనిజమైన శరణుల దృష్టిలో కులపరమైన ఆధిక్యత అనేది తోటి అనుభావుల ఆదరణను, వారి ఆధ్యాత్మిక సాన్నిహిత్యాన్ని దూరం చేసే ఒక పెద్ద ఆటంకంగా మాత్రమే పరిగణించబడుతుంది.\n\nఅందుకే, ఉన్నత మహిమ కలిగిన నిరాకార పరమతత్త్వమైన కూడలసంగమదేవ సాక్షిగా, మనుషుల మధ్య విభజనను సృష్టించే ఈ ఉన్నత కులమనే మోయలేని బరువును తనపై మోపవద్దని ఈ వచనం ఆర్తితో వేడుకుంటోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಮೇಲ್ಜಾತಿಯಲ್ಲಿ ಹುಟ್ಟಿದ್ದೇನೆ ಎಂಬ ಹಣೆಪಟ್ಟಿಯು ನಿಜವಾದ ಭಕ್ತಿ ಮತ್ತು ಶರಣರ ಒಡನಾಟಕ್ಕೆ ಒಂದು ದೊಡ್ಡ ಅಡ್ಡಿಯಾದ ಕಷ್ಟದ ಹೊರೆಯೇ ಹೊರತು ಹೆಮ್ಮೆಯ ವಿಷಯವಲ್ಲ.\n\nಈ ಮೇಲ್ಜಾತಿಯ ಗುರುತಿನಿಂದಾಗಿ ಕಕ್ಕಯ್ಯ ತಾನು ಉಳಿಸಿದ ಪ್ರಸಾದವನ್ನು ನೀಡುವುದಿಲ್ಲ, ದಾಸಯ್ಯ ಶಿವದಾನವನ್ನು ಕೊಡುವುದಿಲ್ಲ ಮತ್ತು ಎಲ್ಲರ ಗೌರವಕ್ಕೆ ಪಾತ್ರನಾದ ಚೆನ್ನಯ್ಯ ಹತ್ತಿರ ಸೇರಿಸಿ ಮನ್ನಿಸುವುದಿಲ್ಲ ಎಂಬ ತೀವ್ರವಾದ ತಳಮಳ ಇಲ್ಲಿ ವ್ಯಕ್ತವಾಗಿದೆ.\n\nಕಾಯದ ಹುಟ್ಟಿನಿಂದ ಬರುವ ಜಾತಿಯ ಶ್ರೇಷ್ಠತೆಯು ನಿಜವಾದ ಅನುಭಾವಿಗಳಾದ ಶರಣರ ಸಂಗದಿಂದ ಮನುಷ್ಯನನ್ನು ದೂರವಿಡುತ್ತದೆ ಎಂಬ ಸಾಮಾಜಿಕ ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕ ಸತ್ಯವನ್ನು ಈ ಮಾತುಗಳು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.\n\nಆದ್ದರಿಂದ, ನಿಜವಾದ ಶರಣರ ಪ್ರೀತಿ ಮತ್ತು ಒಪ್ಪಿಗೆಯನ್ನು ಪಡೆಯಲು ಅಡ್ಡಿಯಾಗಿರುವ ಈ ಉತ್ತಮ ಕುಲದ ಹೊರೆಯನ್ನು ತನ್ನ ಮೇಲಿಂದ ಇಳಿಸಿ ಕಾಪಾಡಬೇಕೆಂದು ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಕೂಡಲಸಂಗಮದೇವನಲ್ಲಿ ಅಂಗಲಾಚುವುದೇ ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":69,"o":"ಉತ್ತಮ ಮಧ್ಯಮ ಕನಿಷ್ಠವೆಂದು, ಬಂದ ಜಂಗಮವನೆಂದೆನಾದಡೆ\n ನೊಂದೆನಯ್ಯಾ, ಬೆಂದೆನಯ್ಯಾ, ಎನ್ನ ಕಿಚ್ಚು ಎನ್ನ ಸುಟ್ಟಿತ್ತು.\n ಸುಖಿಜಂಗಮ, ಸಾಮಾನ್ಯಜಂಗಮ ಉಂಟೆ,\n ಕೂಡಲಸಂಗಮದೇವಾ?","t":{"en":"If I call the *Jangama* who has come superior, middling, or inferior,\nI am pained, O Lord, I am scorched, O Lord; my own fire has burned me.\nIs there a blissful *Jangama* and an ordinary *Jangama*,\nO Koodalasangamadeva?","hi":"आए हुए जंगम को उत्तम, मध्यम, कनिष्ठ कहूँ तो,\nमैं व्यथित हुआ, हे स्वामी, मैं दग्ध हुआ, हे स्वामी, मेरी ही आग ने मुझे जला दिया।\nक्या सुखी जंगम, सामान्य जंगम भी होते हैं,\nहे कूडलसंगमदेव?","mr":"आलेल्या जंगमाला उत्तम, मध्यम आणि कनिष्ठ असे मी म्हटलो तर,\nहे प्रभो, मी दुखावलो, मी होरपळलो, माझ्याच अग्नीने मला जाळले.\nसुखीजंगम आणि सामान्यजंगम असे असतात का,\nहे कूडलसंगमदेवा?","fr":"Si je dis du Jangama qui est venu qu'il est supérieur, moyen ou inférieur,\nj'en souffre, ô Seigneur, je me consume, ô Seigneur ; mon propre feu m'a brûlé.\nExiste-t-il un Jangama bienheureux et un Jangama ordinaire,\nô Koodalasangamadeva ?","te":"ఉత్తమ, మధ్యమ, కనిష్ఠమని, వచ్చిన జంగముని నేనన్నట్లయితే\nనొచ్చుకున్నాను స్వామీ, కాలిపోయాను స్వామీ, నా చిచ్చు నన్నే కాల్చివేసింది.\nసుఖిజంగమ, సామాన్యజంగమ అని ఉన్నదా,\nఓ కూడలసంగమదేవా?","kn":"ಉತ್ತಮ ಮಧ್ಯಮ ಕನಿಷ್ಠವೆಂದು, ಬಂದ ಜಂಗಮವನೆಂದೆನಾದಡೆ\n ನೊಂದೆನಯ್ಯಾ, ಬೆಂದೆನಯ್ಯಾ, ಎನ್ನ ಕಿಚ್ಚು ಎನ್ನ ಸುಟ್ಟಿತ್ತು.\n ಸುಖಿಜಂಗಮ, ಸಾಮಾನ್ಯಜಂಗಮ ಉಂಟೆ,\n ಕೂಡಲಸಂಗಮದೇವಾ?"},"m":{"en":"The central message of this Vachana is a firm rejection of all forms of hierarchy and discrimination when receiving and serving the Jangama—the wandering spiritual seekers, enlightened Sadhakas, and embodiments of dynamic consciousness.\n\nThis Vachana explains that classifying an arriving Jangama as superior, middling, or inferior causes deep spiritual anguish, acting like an internal fire of prejudice and ego that ultimately burns and destroys the devotee's own inner peace.\n\nBy questioning whether there can ever be a distinction between a privileged, realized Jangama and an ordinary one, the Vachana highlights the Sharana principle of absolute equality among all who walk the spiritual path.\n\nAddressed to the Formless Supreme Reality through the ankitanama Kudalasangamadeva, it affirms that genuine devotion requires seeing the same undivided divine consciousness in every Jangama without judgment or gradation.","hi":"इस वचन का मूल भाव यह है कि घर पर आए हुए जंगम, अर्थात् आध्यात्मिक साधक या प्रबुद्ध जनों में उत्तम, मध्यम और कनिष्ठ जैसा कोई भी भेदभाव नहीं करना चाहिए।\n\nयदि साधक ऐसे प्रबुद्ध जंगमों को ऊंच-नीच या श्रेष्ठ-कनिष्ठ की संकुचित दृष्टि से आंकता है, तो उसके भीतर के भेदभाव की यह अग्नि स्वयं उसे ही पीड़ा पहुंचाती है और जलाकर नष्ट कर देती है।\n\nनिराकार परमतत्त्व कूडलसंगमदेव को संबोधित यह वचन स्पष्ट करता है कि जंगम स्वरूप में 'सुखी जंगम' या 'सामान्य जंगम' जैसा कोई विभाजन हो ही नहीं सकता, क्योंकि आध्यात्मिक और मानवीय दृष्टि से सभी जंगम समान हैं।","mr":"हे वचन स्पष्ट करते की, आध्यात्मिक ज्ञान पसरवणाऱ्या प्रबुद्ध साधकांमध्ये किंवा चैतन्यस्वरूप समाजामध्ये म्हणजेच जंगमांमध्ये उच्च, मध्यम किंवा कनिष्ठ असा कोणताही भेदभाव करणे अयोग्य आहे.\n\nजर मनात अशा उतरंडीचा किंवा भेदाचा विचार आला, तर ती स्वतःच्याच मनातील संकुचित भावना एखाद्या अग्नीप्रमाणे स्वतःलाच आतून पोळून काढते आणि तीव्र वेदना देते.\n\nकूडलसंगमदेव या निराकार परमतत्त्वाला उद्देशून हे वचन हा मूलभूत विचार मांडते की, जंगम हा सुखी किंवा सामान्य असा वेगवेगळा असूच शकत नाही; कारण सर्वत्र एकच शुद्ध चैतन्य समान रूपाने वास करत असते.","fr":"Ce vachana rejette catégoriquement toute forme de discrimination ou de hiérarchie à l'égard des Jangama qui se présentent.\n\nJuger ces chercheurs spirituels en les classant comme supérieurs, moyens ou inférieurs constitue une faute intérieure grave, comparée ici à un feu qui consume et tourmente celui-là même qui porte un tel jugement.\n\nS'adressant à la Réalité suprême sans forme à travers la signature spirituelle Koodalasangamadeva, le texte affirme l'égalité absolue des Jangama, en rappelant qu'il ne saurait exister de distinction entre un Jangama privilégié et un Jangama ordinaire.","te":"ఈ వచనం శరణ తత్త్వంలోని సమతాభావాన్ని, జంగమ తత్త్వం పట్ల ఉండవలసిన నిష్కల్మషమైన సమదృష్టిని ఆవిష్కరిస్తోంది.\n\nఆధ్యాత్మిక జ్ఞానాన్ని పంచే సాధకులను లేదా చైతన్యవంతమైన జీవసమాజ స్వరూపులైన జంగములను ఉత్తములు, మధ్యములు, కనిష్ఠులు అని తారతమ్యాలతో విభజించి చూస్తే, ఆ భేదభావమనే అగ్ని తననే దహించివేసి తీవ్రమైన ఆత్మవేదనకు గురిచేస్తుందని వచనకారుడు స్పష్టం చేస్తున్నాడు.\n\nనిరాకార పరమతత్త్వానికి ప్రతీక అయిన కూడలసంగమదేవ అనే అంకితనామంతో సా సాగిన ఈ ఆత్మపరిశీలనలో, జంగములలో సుఖిజంగములని, సామాన్యజంగములని వేర్వేరు వర్గాలు ఉండవని, ఆధ్యాత్మిక చైతన్య స్వరూపంలో అందరూ సమానులేననే పరమసత్యం ప్రకటితమవుతోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರಾದ ಅಥವಾ ಜೀವಂತ ಚೈತನ್ಯದ ಸ್ವರೂಪವಾದ ಜಂಗಮರಲ್ಲಿ ಉತ್ತಮ, ಮಧ್ಯಮ ಮತ್ತು ಕನಿಷ್ಠ ಎಂದು ಮೇಲು-ಕೀಳಿನ ಭೇದಭಾವ ಮಾಡುವುದು ಶರಣ ತತ್ತ್ವಕ್ಕೆ ಸಂಪೂರ್ಣವಾಗಿ ವಿರುದ್ಧವಾದದ್ದು.\n\nಮನೆಗೆ ಬಂದ ಜಂಗಮರನ್ನು ಅಂತಹ ತಾರತಮ್ಯದ ದೃಷ್ಟಿಯಿಂದ ನೋಡಿದರೆ, ಆ ಭೇದಭಾವದ ಬೆಂಕಿಯು ಬೇರೆಯವರನ್ನಲ್ಲದೆ ನಮ್ಮದೇ ಅರಿವನ್ನು ಮತ್ತು ಅಂತರಂಗವನ್ನು ಸುಟ್ಟುಹಾಕಿ ನಮಗೇ ತೀವ್ರವಾದ ನೋವನ್ನು ತರುತ್ತದೆ ಎಂದು ಇಲ್ಲಿ ಎಚ್ಚರಿಸಲಾಗಿದೆ.\n\nಜಂಗಮರಲ್ಲಿ 'ಸುಖಿಜಂಗಮ' ಅಥವಾ 'ಸಾಮಾನ್ಯಜಂಗಮ' ಎಂಬ ಯಾವುದೇ ವಿಭಾಗಗಳಿಲ್ಲ; ಏಕೆಂದರೆ ಜಂಗಮ ತತ್ತ್ವದಲ್ಲಿ ಅಂತಹ ತಾರತಮ್ಯಕ್ಕೆ ಆಸ್ಪದವೇ ಇಲ್ಲ ಎಂದು ಕೂಡಲಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಾಕ್ಷಿಯಾಗಿ ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.\n\nಜಂಗಮರೆಲ್ಲರಲ್ಲೂ ಒಂದೇ ಸಮನಾದ ಪರಮಚೈತನ್ಯವನ್ನು ಕಾಣಬೇಕೇ ಹೊರತು, ಅವರ ಸ್ಥಿತಿಗತಿಗಳ ಆಧಾರದ ಮೇಲೆ ಅಳತೆ ಮಾಡಬಾರದು ಎಂಬ ಸಮಾನತೆಯ ಆಳವಾದ ತಾತ್ಪರ್ಯ ಇಲ್ಲಿ ವ್ಯಕ್ತವಾಗಿದೆ."}}]},
{"id":"s1","n":{"en":"Allamaprabhu","hi":"अल्लमप्रभु","mr":"अल्लमप्रभू","fr":"Allamaprabhu","te":"అల్లమప్రభు","kn":"ಅಲ್ಲಮಪ್ರಭು"},"v":[{"no":490,"o":"ಕಂಗಳ ಮುಂದಣ ಕತ್ತಲೆ ಇದೇನೋ?\n ಮನದ ಮುಂದಣ ಮರವೆ ಇದೇನೊ?\n ಒಳಗಣ ರಣರಂಗ ಹೊರಗಣ ಶೃಂಗಾರ!\n ಬಳಕೆಗೆ ಬಂದ ಬಟ್ಟೆ ಇದೇನೊ ಗುಹೇಶ್ವರಾ?","t":{"en":"What is this darkness before the eyes?\nWhat is this forgetfulness before the mind?\nA battlefield within, adornment without!\nWhat is this way that has come into practice, O Guheshwara?","hi":"आँखों के आगे का अंधकार यह क्या है?\nमन के आगे का विस्मरण यह क्या है?\nभीतर का रणरंग, बाहर का शृंगार!\nप्रचलन में आया यह मार्ग क्या है, हे गुहेश्वर?","mr":"डोळ्यांपुढील हा अंधार काय आहे?\nमनापुढील ही विस्मृती काय आहे?\nआतील रणरंग, बाहेरील शृंगार!\nव्यवहारात आलेली ही वाट काय आहे, हे गुहेश्वरा?","fr":"Qu'est-ce donc que cette obscurité devant les yeux ?\nQu'est-ce donc que cet oubli devant l'esprit ?\nUn champ de bataille à l'intérieur, une parure à l'extérieur !\nQu'est-ce donc que cette voie entrée dans l'usage, ô Guheshwara ?","te":"కన్నుల ముందరి చీకటి ఇదేమిటో?\nమనసు ముందరి మరపు ఇదేమిటో?\nలోపలి రణరంగం, వెలుపలి శృంగారం!\nవాడుకలోకి వచ్చిన త్రోవ ఇదేమిటో ఓ గుహేశ్వరా?","kn":"ಕಂಗಳ ಮುಂದಣ ಕತ್ತಲೆ ಇದೇನೋ?\n ಮನದ ಮುಂದಣ ಮರವೆ ಇದೇನೊ?\n ಒಳಗಣ ರಣರಂಗ ಹೊರಗಣ ಶೃಂಗಾರ!\n ಬಳಕೆಗೆ ಬಂದ ಬಟ್ಟೆ ಇದೇನೊ ಗುಹೇಶ್ವರಾ?"},"m":{"en":"This Vachana examines the spiritual contradiction of human existence, where inner ignorance and turmoil are masked by outward adornments.\n\nThe darkness before the eyes and the forgetfulness within the mind symbolize a lack of true awareness (Arivu), which prevents one from perceiving the truth clearly.\n\nBy contrasting the \"battlefield within\" against \"external decoration,\" the Vachana exposes the hypocrisy of maintaining a pleasing worldly appearance while the inner self remains consumed by conflict and restlessness.\n\nAddressing the Formless Supreme Consciousness as Guheshwara, the Vachana questions how such a superficial and conflicted way of living has become the accepted path in the world.","hi":"इस वचन का केंद्रीय भाव मनुष्य के बाहरी आचरण और उसकी आंतरिक स्थिति के बीच के गहरे विरोधाभास तथा आत्म-विस्मृति पर प्रश्न उठाना है।\n\nयहाँ यह दर्शाया गया है कि आँखों के सामने अज्ञान का अंधकार छाया हुआ है और मन के भीतर अपने वास्तविक स्वरूप की विस्मृति घर कर गई है।\n\nअंतर्मन में निरंतर द्वंद्व और अशांति का रणक्षेत्र बना हुआ है, किंतु बाहर से मनुष्य स्वयं को सुंदर और सुसज्जित दिखाने का आडंबर करता है।\n\nनिराकार परमतत्त्व गुहेश्वर को संबोधित करते हुए यह वचन इस बात पर गहरा आश्चर्य व्यक्त करता है कि मनुष्य ने अपने दैनिक जीवन के व्यवहार में यह कैसी विसंगतिपूर्ण और कृत्रिम राह अपना ली है।","mr":"हे वचन मानवाच्या अंतर्बाह्य आयुष्यातील विरोधाभास आणि त्याची आध्यात्मिक संभ्रमावस्था अचूकपणे उलगडून दाखवते.\n\nडोळ्यांसमोर पसरलेला अज्ञानाचा अंधार आणि मनावर आलेले आत्मविस्मृतीचे सावट यामुळे मानवी जाणिवेची वाट कशी खुंटली आहे, याबद्दल येथे सखोल चिंतन व्यक्त झाले आहे.\n\nअंतर्मनात वासना व संघर्षाचे रणकंदन सुरू असताना बाह्यतः मात्र शृंगाराचा आणि सुखवस्तूपणाचा देखावा मिरवण्याच्या मानवी दुटप्पीपणावर हे वचन प्रहार करते.\n\n'गुहेश्वरा' या निराकार परमतत्त्वाला स्मरून, अशा या खोट्या आणि दिखाऊ जीवनशैलीलाच माणसाने आपली नेहमीची वहिवाट कसे बनवले आहे, असा अंतर्मुख करणारा प्रश्न या वचनातून उपस्थित केला आहे.","fr":"Ce vachana met en lumière la profonde contradiction de l'existence humaine, marquée par une cécité spirituelle qui voile le regard et un oubli qui obscurcit la conscience.\n\nIl révèle le contraste saisissant entre le tumulte intérieur, semblable à un véritable champ de bataille, et la parure séduisante que l'on affiche à l'extérieur pour masquer ce désordre.\n\nEn s'adressant à Guheshwara, la Réalité suprême sans forme, ce poème interroge avec lucidité cette voie d'illusion et de duplicité qui est pourtant devenue la norme de la vie quotidienne.","te":"ఈ వచనం మానవ జీవనంలోని అంతర్గత సంఘర్షణను, బాహ్య ఆడంబరాన్ని లోతుగా ప్రశ్నిస్తోంది.\n\nకళ్ళ ముందే ఆవరించిన అజ్ఞానపు చీకటి, మనసును కమ్మేసిన ఆధ్యాత్మిక మరపు మనిషిని సత్యం నుండి దూరం చేస్తున్నాయని ఇక్కడ వ్యక్తమవుతోంది.\n\nఅంతరంగంలో అశాంతి, అలజడులతో కూడిన రణరంగం చెలరేగుతున్నా, బయటకు మాత్రం శృంగారాన్ని, కృత్రిమమైన అందాన్ని ప్రదర్శించడం లోక సహజమైన విడ్డూరంగా మారింది.\n\nగుహేశ్వర అనే నిరాకార పరమచైతన్యాన్ని సంబోధిస్తూ, మనిషి తన నిజమైన ఎరుకను కోల్పోయి ఇలాంటి ద్వంద్వ ప్రవృత్తితో కూడిన జీవన మార్గానికి ఎలా అలవాటు పడ్డాడో అని ఈ వచనం ఆశ్చర్యాన్ని వ్యక్తం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಮನುಷ್ಯನ ಅರಿವನ್ನು ಮುಚ್ಚಿರುವ ಅಜ್ಞಾನ ಮತ್ತು ಆತನ ಒಳ-ಹೊರಗಿನ ಬದುಕಿನ ನಡುವಿನ ವಿರೋಧಾಭಾಸವನ್ನು ಪ್ರಶ್ನಿಸುವುದು.\n\nನೋಡುವ ಕಣ್ಣುಗಳ ಮುಂದೆಯೇ ಸತ್ಯವನ್ನು ಕಾಣದಂತೆ ಮಾಡುವ ಅಜ್ಞಾನದ ಕತ್ತಲೆ ಆವರಿಸಿಕೊಂಡಿದೆ ಮತ್ತು ತಿಳಿಯಬೇಕಾದ ಮನಸ್ಸಿನ ಮುಂದೆ ತನ್ನ ನಿಜವಾದ ಸ್ವರೂಪವನ್ನೇ ಮರೆಸುವ ಮರವೆ ತುಂಬಿಕೊಂಡಿದೆ.\n\nಅಂತರಂಗದಲ್ಲಿ ಆಸೆ, ತೊಳಲಾಟ ಮತ್ತು ಗೊಂದಲಗಳ ಯುದ್ಧಭೂಮಿಯೇ ಇರುವಾಗ, ಹೊರಗಡೆ ಮಾತ್ರ ಬಹಳ ಅಂದವಾಗಿ ಮತ್ತು ಆಕರ್ಷಕವಾಗಿ ಕಾಣಿಸಿಕೊಳ್ಳುವ ತೋರಿಕೆಯ ಶೃಂಗಾರವಿದೆ.\n\nಗುಹೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಾಕ್ಷಿಯಾಗಿ, ಒಳಗಿನ ಸಂಘರ್ಷವನ್ನು ಮರೆಮಾಚಿ ಕೇವಲ ಬಾಹ್ಯ ಆಡಂಬರದಲ್ಲಿ ಬದುಕುವ ಈ ಲೋಕದ ರೂಢಿಯ ದಾರಿ ಎಷ್ಟು ವಿಚಿತ್ರವಾಗಿದೆ ಎಂದು ಈ ವಚನವು ಬೆರಗು ಮತ್ತು ವಿಷಾದದಿಂದ ಕೇಳುತ್ತಿದೆ."}},{"no":491,"o":"ಕಂಡುದೆಲ್ಲ ಪಾವನ, ಕೇಳಿತ್ತೆಲ್ಲ ಪರಮಬೋಧೆ,\n ಮುಟ್ಟಿತ್ತೆಲ್ಲ ಪರುಷದ ಸೋಂಕು,\n ಒಡನೆ ನುಡಿದವರೆಲ್ಲ ಸದ್ಯೋನ್ಮುಕ್ತರು,\n ಸುಳಿದ ಸುಳುಹೆಲ್ಲ ಜಗತ್ಪಾವನ, ಮೆಟ್ಟಿದ ಧರೆಯೆಲ್ಲ ಅವಿಮುಕ್ತ ಕ್ಷೇತ್ರ,\n ಸೋಂಕಿದ ಜಲವೆಲ್ಲ ಪುಣ್ಯತೀರ್ಥಂಗಳು,\n ಶರಣೆಂದು ಭಕ್ತಿಯ ಮಾಡಿದವರೆಲ್ಲರು ಸಾಯುಜ್ಯರು.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಸುಳುಹಿನ ಸೊಗಸನುಪಮಿಸಬಾರದು.","t":{"en":"All that is seen becomes sanctified, all that is heard becomes supreme teaching,\nall that is touched becomes the touch of the philosopher's stone,\nall who speak with you are liberated at once,\nevery movement of your presence sanctifies the world, all the earth you tread becomes the realm of Avimukta,\nall the water you touch becomes sacred waters,\nall who bow in surrender and offer devotion attain union with the Divine.\nO Guheshwara, the beauty of your living presence is beyond compare.","hi":"देखा हुआ सब पावन है, सुना हुआ सब परमबोध है,\nछुआ हुआ सब पारस का स्पर्श है,\nसाथ बोलनेवाले सब सद्योन्मुक्त हैं,\nविचरने की हर आहट जगत्पावन है, पग धरने की सारी धरा अविमुक्त क्षेत्र है,\nछुआ हुआ सारा जल पुण्यतीर्थ है,\nशरण कहकर भक्ति करनेवाले सभी सायुज्य हैं।\nहे गुहेश्वर, आपके विचरण के सौंदर्य की उपमा नहीं दी जा सकती।","mr":"जे काही पाहिले ते सर्व पावन, जे काही ऐकले तो सर्व परमबोध,\nज्याला स्पर्श केला तो सर्व परिसाचा स्पर्श,\nसोबत बोलणारे सर्व सद्योन्मुक्त आहेत,\nफिरलेला प्रत्येक संचार जगत्पावन, पाय ठेवलेली सर्व धरती अविमुक्त क्षेत्र,\nस्पर्श केलेले सर्व पाणी पुण्यतीर्थे आहेत,\nशरण म्हणून भक्ती करणारे सर्वजण सायुज्य पावलेले आहेत.\nहे गुहेश्वरा, तुमच्या संचाराच्या सौंदर्याला उपमा देता येत नाही.","fr":"Tout ce qui est vu est sanctifié, tout ce qui est entendu est l'enseignement suprême,\ntout ce qui est touché est le contact de la pierre philosophale,\ntous ceux avec qui l'on s'entretient sont libérés sur-le-champ,\nchaque mouvement est la sanctification du monde, toute terre foulée est le lieu sacré d'Avimukta,\ntoutes les eaux effleurées sont des gués sacrés,\ntous ceux qui disent « Je prends refuge » et pratiquent la *Bhakti* ont atteint l'union ultime.\nÔ Guheshwara, la splendeur de votre présence en mouvement est incomparable.","te":"చూసినదంతా పావనం, విన్నదంతా పరమబోధ,\nతాకినదంతా పరుశవేది స్పర్శ,\nకలిసి మాట్లాడినవారందరూ సద్యోన్ముక్తులు,\nసంచరించిన సంచారమంతా జగత్పావనం, మెట్టిన ధరంతా అవిముక్త క్షేత్రం,\nసోకిన జలమంతా పుణ్యతీర్థాలు,\nశరణని భక్తి చేసినవారందరూ సాయుజ్యులు.\nఓ గుహేశ్వరా, మీ సంచారపు సొగసును పోల్చరాదు.","kn":"ಕಂಡುದೆಲ್ಲ ಪಾವನ, ಕೇಳಿತ್ತೆಲ್ಲ ಪರಮಬೋಧೆ,\n ಮುಟ್ಟಿತ್ತೆಲ್ಲ ಪರುಷದ ಸೋಂಕು,\n ಒಡನೆ ನುಡಿದವರೆಲ್ಲ ಸದ್ಯೋನ್ಮುಕ್ತರು,\n ಸುಳಿದ ಸುಳುಹೆಲ್ಲ ಜಗತ್ಪಾವನ, ಮೆಟ್ಟಿದ ಧರೆಯೆಲ್ಲ ಅವಿಮುಕ್ತ ಕ್ಷೇತ್ರ,\n ಸೋಂಕಿದ ಜಲವೆಲ್ಲ ಪುಣ್ಯತೀರ್ಥಂಗಳು,\n ಶರಣೆಂದು ಭಕ್ತಿಯ ಮಾಡಿದವರೆಲ್ಲರು ಸಾಯುಜ್ಯರು.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಸುಳುಹಿನ ಸೊಗಸನುಪಮಿಸಬಾರದು."},"m":{"en":"This Vachana describes the transformative presence of the Formless Supreme Consciousness, addressed here as Guheshwara, which sanctifies every aspect of existence.\n\nWhen one is attuned to this divine presence, every sight becomes pure, every sound turns into supreme wisdom, and every touch carries the alchemical power of the philosopher's stone.\n\nIn this state of awareness, the very earth one walks upon becomes a sacred realm of liberation, ordinary water becomes holy, and all who interact or offer devotion attain immediate spiritual union and freedom.\n\nUltimately, the Vachana conveys that the grace and movement of the Absolute through the living world possess an incomparable beauty that transcends all conventional notions of sacred places and rituals.","hi":"इस वचन का केंद्रीय भाव यह है कि निराकार परमतत्त्व (जिसे यहाँ 'गुहेश्वर' के रूप में संबोधित किया गया है) के साथ एकात्म होने और उसकी जीवंत अनुभूति से सृष्टि का प्रत्येक अनुभव पवित्र तथा दिव्य बन जाता है।\n\nइस अवस्था में साधक जो कुछ देखता है वह पावन हो जाता है, जो सुनता है वह परम ज्ञान बन जाता है और उसका प्रत्येक स्पर्श पारस मणि के समान रूपांतरणकारी हो जाता है।\n\nऐसे चैतन्य के सान्निध्य में संवाद करने वाले तत्काल मुक्त हो जाते हैं; जहाँ इसका संचार होता है वह संपूर्ण जगत पवित्र हो जाता है, चरणों से स्पर्श की गई भूमि अविमुक्त क्षेत्र और छुआ गया जल पुण्यतीर्थ बन जाता है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि जो साधक 'शरणु' कहकर समर्पण भाव से भक्ति करते हैं, वे परम सत्य में लीन (सायुज्य) हो जाते हैं और इस दिव्य उपस्थिति के अनुपम सौंदर्य की किसी से तुलना नहीं की जा सकती।","mr":"हे वचन गुहेश्वर या नावाने संबोधित केलेल्या निराकार परमतत्त्वाच्या चैतन्यमय अस्तित्वाची आणि अनुभूतीची अलौकिकता स्पष्ट करते.\n\nपरम सत्याचा साक्षात्कार झालेल्या या अवस्थेत पाहिलेले सर्व काही पवित्र होते, ऐकलेला प्रत्येक शब्द परमज्ञानाचा बोध ठरतो आणि ज्याला स्पर्श होतो तिथे परिसस्पर्शाप्रमाणे रूपांतर घडते.\n\nअशा चैतन्याचा वावर संपूर्ण जगाला पावन करतो; जिथे पाऊल पडते ती भूमी मुक्त क्षेत्र बनते आणि स्पर्श झालेले पाणी पुण्यतीर्थ ठरते.\n\nया जागृत चैतन्याशी संवाद साधणारे तत्काळ मुक्त होतात आणि शरण जाऊन भक्ती करणारे परमतत्त्वाशी एकरूप होतात, कारण या दिव्य अस्तित्वाचे सौंदर्य कोणत्याही उपमेपलीकडचे आहे.","fr":"Ce vachana met en lumière le rayonnement sanctifiant d’une conscience éveillée et pleinement unie à la Réalité suprême sans forme, invoquée sous le nom de Guheshwara.\n\nLorsque l’être atteint une telle plénitude spirituelle, ses perceptions et ses actes transfigurent le monde : son regard purifie tout ce qu’il voit, son écoute révèle un enseignement suprême et son toucher devient semblable à la pierre philosophale qui transforme la matière en or.\n\nPar sa seule présence, la terre qu’il foule devient un espace de libération, l’eau qu’il effleure devient sacrée, et ceux qui échangent des paroles avec lui ou s’inclinent avec dévotion connaissent immédiatement la liberté intérieure et l’union spirituelle.\n\nAinsi, la manifestation vivante du Principe absolu à travers un tel être possède une beauté et une grâce incomparables, qui dépassent toute description.","te":"ఈ వచనం వివరిస్తున్న ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, గుహేశ్వర అనే అంకితనామంతో సూచించబడిన నిరాకార పరమచైతన్యం యొక్క జాడను అనుభూతి చెందినప్పుడు, సాధకుడికి సమస్త జగత్తు పవిత్రంగా గోచరిస్తుంది.\n\nఆ దివ్య చైతన్య స్పర్శతో చూసినదంతా పావనమవుతుంది, విన్నదంతా పరమబోధగా మారుతుంది, తాకినదంతా స్పర్శవేది సోకినట్లుగా ఉత్కృష్టమవుతుంది, మాట్లాడిన వారందరూ తక్షణమే ముక్తులవుతారు.\n\nఅట్టి చైతన్యం సంచరించిన ప్రదేశమంతా జగత్పావనమై, అడుగుపెట్టిన నేలంతా అవిముక్త క్షేత్రంగా, తాకిన జలమంతా పుణ్యతీర్థంగా మారిపోతాయి.\n\nశరణు అని భక్తితో ఆ తత్త్వాన్ని ఆశ్రయించిన వారందరూ సాయుజ్యాన్ని పొందుతారు కనుక, నిరాకార పరమసత్యమైన గుహేశ్వర చైతన్యపు జాడల సొగసు ఏ ఇతర వస్తువుతోనూ పోల్చడానికి వీలుకానిది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವೇನೆಂದರೆ, ಅರಿವಿನ ತುತ್ತತುದಿಯನ್ನು ತಲುಪಿದ ಶರಣರ ಅಥವಾ ಜಂಗಮಸ್ವರೂಪಿಗಳಾದ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರ ಸಾನಿಧ್ಯವು ಇಡೀ ಜಗತ್ತನ್ನೇ ಹೇಗೆ ಪವಿತ್ರವಾಗಿಸುತ್ತದೆ ಎಂಬುದನ್ನು ಇಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಅಂತಹ ಅರಿವಿನ ಸಾಕಾರರೂಪರಾದವರ ಕಣ್ಣೋಟ ಬಿದ್ದದ್ದೆಲ್ಲವೂ ಪವಿತ್ರವಾಗುತ್ತದೆ, ಅವರು ಆಡುವ ಮಾತುಗಳೆಲ್ಲವೂ ಶ್ರೇಷ್ಠವಾದ ಜ್ಞಾನಬೋಧೆಯಾಗುತ್ತದೆ ಮತ್ತು ಕಬ್ಬಿಣವನ್ನು ಚಿನ್ನವಾಗಿಸುವ ಪರುಷಮಣಿಯಂತೆ ಅವರ ಸ್ಪರ್ಶವು ಸೋಂಕಿದ್ದನ್ನೆಲ್ಲ ಉನ್ನತವಾಗಿಸುತ್ತದೆ.\n\nಅವರೊಡನೆ ಮಾತನಾಡಿದವರು ತಕ್ಷಣವೇ ಬಂಧನಗಳಿಂದ ಮುಕ್ತರಾಗುತ್ತಾರೆ, ಅವರು ಸಂಚರಿಸುವ ಜಾಗವೇ ಜಗತ್ತನ್ನು ಪಾವನಗೊಳಿಸುವ ತಾಣವಾಗುತ್ತದೆ, ಅವರು ಕಾಲಿಟ್ಟ ಭೂಮಿಯೇ ಮುಕ್ತিক্ষೇತ್ರವಾಗುತ್ತದೆ ಮತ್ತು ಅವರು ಮುಟ್ಟಿದ ನೀರೇ ಪುಣ್ಯತೀರ್ಥವಾಗುತ್ತದೆ ಎಂಬಲ್ಲಿ ಸ್ಥಾವರ ತೀರ್ಥಕ್ಷೇತ್ರಗಳಿಗಿಂತ ಜೀವಂತ ಅರಿವಿನ ಚೈತನ್ಯವೇ ಶ್ರೇಷ್ಠ ಎಂಬ ತಾತ್ವಿಕ ಸತ್ಯವಿದೆ.\n\nಇಂತಹ ಶರಣರಿಗೆ ಭಕ್ತಿಯಿಂದ ಶರಣೆಂದವರೆಲ್ಲರೂ ಪರಮಸತ್ಯದಲ್ಲಿ ಒಂದಾಗುವ ಸಾಯುಜ್ಯ ಸ್ಥಿತಿಯನ್ನು ಪಡೆಯುತ್ತಾರೆ ಎನ್ನುವ ಮೂಲಕ, ಗುಹೇಶ್ವರ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಜೀವಂತ ಸುಳುಹಿನ ಸೊಬಗನ್ನು ಇನ್ನಾವುದಕ್ಕೂ ಹೋಲಿಸಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":492,"o":"ಕಂಡೆನೆಂಬುದು ಕಂಗಳ ಮರವೆ,\n ಕಾಣೆನೆಂಬುದು ಮನದ ಮರವೆ,\n ಕೂಡಿದೆನೆಂಬುದು ಅರುಹಿನ ಮರವೆ,\n ಅಗಲಿದೆನೆಂಬುದು ಮರಹಿನ ಮರವೆ.\n ಇಂತು ಕಂಡೆ ಕಾಣೆ ಕೂಡಿದೆ ಅಗಲಿದೆ ಎಂಬ,\n ಭ್ರಾಂತಿಸೂತಕವಳಿದು ನೋಡಲು\n ಗುಹೇಶ್ವರಲಿಂಗವನಗಲಲೆಡೆಯಿಲ್ಲ ಕೇಳಾ, ಎಲೆ ತಾಯೆ,","t":{"en":"To say \"I have seen\" is the forgetfulness of the eyes,\nto say \"I do not see\" is the forgetfulness of the mind,\nto say \"I have united\" is the forgetfulness of awareness,\nto say \"I have parted\" is the forgetfulness of forgetfulness itself.\nThus, when the taint of delusion in saying \"I saw, I do not see, I united, I parted\"\nperishes and one beholds,\nthere is no space to be parted from Guheshwaralinga—listen, O mother!","hi":"देखा है कहना आँखों की विस्मृति है,\nनहीं देखा है कहना मन की विस्मृति है,\nमिल गया हूँ कहना बोध की विस्मृति है,\nबिछुड़ गया हूँ कहना विस्मृति की विस्मृति है।\nइस प्रकार देखा, नहीं देखा, मिला, बिछुड़ा कहने के,\nभ्रांति-सूतक के मिटने पर देखने से,\nगुहेश्वरलिंग से बिछुड़ने का कोई स्थान नहीं है, सुनो, हे माँ!","mr":"पाहिले म्हणणे हे डोळ्यांचे विस्मरण आहे,\nपाहत नाही म्हणणे हे मनाचे विस्मरण आहे,\nएकत्र आलो म्हणणे हे जाणिवेचे विस्मरण आहे,\nविलग झालो म्हणणे हे विस्मरणाचे विस्मरण आहे।\nअशा प्रकारे पाहिले, पाहत नाही, एकत्र आलो, विलग झालो असे म्हणणाऱ्या\nभ्रांतीच्या सूतकाचा नाश होऊन पाहता,\nगुहेश्वरलिंगापासून विलग होण्यास जागाच नाही, ऐक हे माते।","fr":"Dire que j'ai vu est l'oubli des yeux,\nDire que je ne vois pas est l'oubli de l'esprit,\nDire que je me suis uni est l'oubli de la conscience,\nDire que je me suis séparé est l'oubli de l'oubli même.\nAinsi, dire que j'ai vu, que je ne vois pas, que je me suis uni ou que je me suis séparé —\nlorsque l'on regarde après que cette souillure rituelle (*Sutaka*) de l'égarement s'est éteinte,\nil n'y a nul lieu où se séparer du Linga Guheshwara ; écoute donc, ô mère.","te":"చూశానని చెప్పడం కన్నుల మరపు,\nచూడలేదని చెప్పడం మనసు మరపు,\nకలిశానని చెప్పడం ఎరుక మరపు,\nవిడిపోయానని చెప్పడం మరపులోని మరపు.\nఇలా చూశాను చూడలేదు కలిశాను విడిపోయాను అనే,\nభ్రాంతిసూతకం నశించి చూడగా\nగుహేశ్వరలింగాన్ని విడిపోవడానికి తావు లేదు వినుమా, ఓ తల్లీ.","kn":"ಕಂಡೆನೆಂಬುದು ಕಂಗಳ ಮರವೆ,\n ಕಾಣೆನೆಂಬುದು ಮನದ ಮರವೆ,\n ಕೂಡಿದೆನೆಂಬುದು ಅರುಹಿನ ಮರವೆ,\n ಅಗಲಿದೆನೆಂಬುದು ಮರಹಿನ ಮರವೆ.\n ಇಂತು ಕಂಡೆ ಕಾಣೆ ಕೂಡಿದೆ ಅಗಲಿದೆ ಎಂಬ,\n ಭ್ರಾಂತಿಸೂತಕವಳಿದು ನೋಡಲು\n ಗುಹೇಶ್ವರಲಿಂಗವನಗಲಲೆಡೆಯಿಲ್ಲ ಕೇಳಾ, ಎಲೆ ತಾಯೆ,"},"m":{"en":"This Vachana examines the subtle illusions of duality that persist even in spiritual inquiry, pointing out that claiming to have seen the Divine is merely a delusion of the eyes, while claiming not to have seen is a delusion of the mind.\n\nSimilarly, feeling that one has united with the Supreme Reality is a forgetfulness of true awareness (Aruhu), and feeling separated from it is a deeper ignorance born of spiritual forgetfulness (Marave), because both states falsely assume a division between the seeker and the Divine.\n\nThe spiritual significance of this Vachana lies in transcending the impure illusions of seeing and not seeing, uniting and separating.\n\nWhen these dualistic notions dissolve, one realizes that there is no space or possibility of ever being separated from the all-pervasive Formless Supreme Consciousness addressed as Guheshwaralinga.","hi":"इस वचन का केंद्रीय भाव यह है कि परमतत्त्व के संदर्भ में देखने या न देखने, तथा मिलने या बिछड़ने की भावनाएँ केवल द्वैतजनित विस्मृति और भ्रम का परिणाम हैं।\n\nयह वचन स्पष्ट करता है कि परमतत्त्व को 'मैंने देख लिया' कहना आँखों का भ्रम है और 'मैंने नहीं देखा' कहना मन की अज्ञानता है; इसी प्रकार 'मैं उससे मिल गया' कहना चेतना (अरुहु) की भूल है और 'मैं उससे अलग हो गया' कहना विस्मृति (मरहु) का ही भ्रम है।\n\nदेखने, न देखने, जुड़ने और बिछड़ने के इन द्वैतवादी भ्रम-रूपी सूतकों को मिटाकर जब शुद्ध बोध से देखा जाता है, तब यह अनुभव होता है कि सर्वव्यापी निराकार गुहेश्वरलिंग से अलग होने के लिए कहीं कोई स्थान ही नहीं है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि शुद्ध चैतन्य में न कोई मिलन है और न ही कोई वियोग, क्योंकि द्वैत का भ्रम मिटते ही साधक को परमतत्त्व के साथ अपनी शाश्वत अभिन्नता का बोध हो जाता है।","mr":"हे वचन मानवी मन आणि जाणिवांमधील द्वैतभावावर व अज्ञानावर प्रकाश टाकते.\n\nपरमतत्त्वाला बाह्य डोळ्यांनी पाहिले असे म्हणणे हा दृष्टीचा भ्रम आहे, तर ते पाहिले नाही असे मानणे हे मनाचे अज्ञान आहे.\n\nत्याच्याशी एकरूप झालो असे म्हणणे ही खऱ्या जाणिवेची विस्मृती आहे आणि त्याच्यापासून दुरावलो असे समजणे हा केवळ अज्ञानातून निर्माण झालेला समज आहे.\n\nपाहणे किंवा न पाहणे, तसेच मीलन किंवा विरह या सर्व मानसिक भ्रमांच्या पलीकडे जाऊन पाहिल्यास, गुहेश्वरलिंग हे सर्वव्यापी परमतत्त्व आपल्यापासून कधीच वेगळे नाही आणि त्याच्यापासून दूर जाण्यास कोणतीही जागा उरत नाही, हाच या वचनाचा गाभा आहे.","fr":"Ce vachana met en lumière la manière dont les notions d'expérience ou d'absence d'expérience spirituelle reposent toutes sur un oubli fondamental de notre nature véritable.\n\nAffirmer avoir vu la Réalité suprême sans forme est une illusion des yeux, croire ne pas l'avoir vue est un oubli de l'esprit, tandis que les sentiments d'union ou de séparation trahissent un voilement de la conscience pure (Aruhu) et de l'ignorance elle-même.\n\nCes états opposés — voir ou ne pas voir, s'unir ou se séparer — constituent une souillure née de l'illusion dualiste qui maintient l'être dans la division.\n\nLorsque cette confusion illusoire se dissipe, on réalise avec évidence qu'il n'existe aucun espace où l'on puisse être séparé du principe absolu désigné par Guheshwaralinga, car cette présence infinie demeure partout et en tout temps indissociable de l'être.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నిరాకార పరమతత్త్వంతో సాధకునికి ఉండే అభేద స్థితిని ద్వైత భావనలు ఎలా మరుగున పరుస్తాయో ఇక్కడ స్పష్టంగా విశ్లేషించబడింది.\n\nపరమసత్యాన్ని చూశానని అనుకోవడం కన్నుల మరపు కాగా, చూడలేదనడం మనస్సు యొక్క విস্মృతి అవుతుంది; అలాగే ఆ తత్త్వంతో కలిశానని భావించడం సహజమైన ఎరుకకు కలిగిన మరపు అయితే, దాని నుండి విడిపోయానని తలచడం అజ్ఞానం వల్ల కలిగే మరపు మాత్రమే.\n\nచూశాను, చూడలేదు, కలిశాను, విడిపోయాను అనే ఈ నాలుగు రకాల ద్వంద్వ భావనలన్నీ కేవలం మనస్సు కల్పించుకున్న భ్రాంతి అనే మైల మాత్రమే.\n\nఈ భ్రాంతితో కూడిన అజ్ఞాన మాలిన్యాన్ని పూర్తిగా తొలగించుకొని చూసినప్పుడు, గుహేశ్వరలింగం అనబడే ఆ నిర్గుణ పరమచైతన్యం నుండి విడివడి ఉండేందుకు అసలు అవకాశమే లేదనే అద్వైత సత్యం బోధపడుతుంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಗುಹೇಶ್ವರಲಿಂಗವು ನಮ್ಮಿಂದ ಬೇರೆಯಾಗಿಲ್ಲದ ಕಾರಣ, ಅದನ್ನು ನೋಡಿದೆ ಅಥವಾ ನೋಡಿಲ್ಲ, ಸೇರಿದೆ ಅಥವಾ ಅಗಲಿದೆ ಎಂದು ಹೇಳುವುದೆಲ್ಲವೂ ಬರಿಯ ಭ್ರಮೆಯಾಗಿದೆ.\n\nಪರಮಚೈತನ್ಯವನ್ನು ಕಣ್ಣಿನಿಂದ ಕಂಡೆ ಎನ್ನುವುದು ಕಣ್ಣಿನ ಮರವೆಯಾದರೆ, ಕಾಣಲಿಲ್ಲ ಎನ್ನುವುದು ಮನಸ್ಸಿನ ಮರವೆಯಾಗಿದೆ.\n\nಹಾಗೆಯೇ ಅದನ್ನು ಕೂಡಿದೆ ಎನ್ನುವುದು ನಿಜವಾದ ಅರಿವಿಗೆ ಉಂಟಾದ ಮರವೆಯಾದರೆ, ಅದರಿಂದ ಬೇರೆಯಾದೆ ಎನ್ನುವುದು ಅಜ್ಞಾನದಿಂದ ಹುಟ್ಟಿದ ಮತ್ತೊಂದು ಮರವೆಯಾಗಿದೆ.\n\nಇಂತಹ ಕಂಡೆ, ಕಾಣೆ, ಕೂಡಿದೆ, ಅಗಲಿದೆ ಎಂಬ ದ್ವಂದ್ವದ ಭ್ರಮೆ ಮತ್ತು ಮೈಲಿಗೆಯನ್ನು ಕಳೆದುಕೊಂಡು ನೋಡಿದಾಗ, ನಿರಾಕಾರವಾದ ಗುಹೇಶ್ವರಲಿಂಗದಿಂದ ನಾವು ಬೇರೆಯಾಗಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎಂಬ ಪರಮಸತ್ಯವು ಸ್ಪಷ್ಟವಾಗುತ್ತದೆ."}},{"no":493,"o":"ಕರ್ಪುರದ ಗಿರಿಯ ಉರಿ ಹಿಡಿದಡೆ ಇದ್ದಿಲುಂಟೆ?\n ಮಂಜಿನ ಶಿವಾಲಯಕ್ಕೆ ಬಿಸಿಲ ಕಳಸವುಂಟೆ?\n ಕೆಂಡದ ಗಿರಿಯನರಗಿನ ಬಾಣದಲೆಚ್ಚಡೆ,\n ಮರಳಿ ಬಾಣವನರಸಲುಂಟೆ?\n ಗುಹೇಶ್ವರನೆಂಬ ಲಿಂಗವನರಿದು\n ಮರಳಿ ನೆನೆಯಲುಂಟೆ?","t":{"en":"When fire catches a mountain of camphor, is there any charcoal left?\nCan a temple of mist bear a pinnacle of sunlight?\nWhen one shoots a mountain of glowing embers with an arrow of lac,\ncan one search for the arrow again?\nHaving realized the *Linga* called Guheshwara,\ncan one remember it again?","hi":"कर्पूर के पर्वत में आग लगने पर क्या कोयला होता है?\nहिम के शिवालय पर क्या धूप का कलश होता है?\nअंगारे के पर्वत को लाख के बाण से बेधने पर,\nक्या फिर से बाण को खोजा जा सकता है?\nगुहेश्वर नामक लिंग को जानकर,\nक्या फिर से स्मरण किया जा सकता है?","mr":"कापराच्या पर्वताने पेट घेतल्यावर कोळसा उरतो का?\nधुक्याच्या शिवालयाला उन्हाचा कळस असतो का?\nनिखाऱ्याच्या पर्वताला लाखाच्या बाणाने भेदल्यावर,\nपुन्हा तो बाण शोधता येतो का?\nगुहेश्वर नावाच्या लिंगाला जाणल्यावर\nपुन्हा त्याचे स्मरण करणे उरते का?","fr":"Si le feu s'empare d'une montagne de camphre, reste-t-il du charbon ?\nUn sanctuaire de Shiva fait de brume peut-il avoir un faîte de soleil ?\nSi l'on décoche une flèche de laque contre une montagne de braises,\npeut-on chercher à nouveau la flèche ?\nAprès avoir connu le *Linga* que l'on appelle Guheshwara,\npeut-on encore se souvenir à nouveau ?","te":"కర్పూరపు కొండను మంట పట్టుకుంటే బొగ్గు ఉంటుందా?\nమంచు శివాలయానికి ఎండ కలశం ఉంటుందా?\nనిప్పుల కొండను లక్క బాణంతో వేసినప్పుడు,\nమరల ఆ బాణాన్ని వెతకడం సాధ్యమవుతుందా?\nగుహేశ్వరుడనే లింగాన్ని ఎరిగి\nమరల స్మరించడం ఉంటుందా?","kn":"ಕರ್ಪುರದ ಗಿರಿಯ ಉರಿ ಹಿಡಿದಡೆ ಇದ್ದಿಲುಂಟೆ?\n ಮಂಜಿನ ಶಿವಾಲಯಕ್ಕೆ ಬಿಸಿಲ ಕಳಸವುಂಟೆ?\n ಕೆಂಡದ ಗಿರಿಯನರಗಿನ ಬಾಣದಲೆಚ್ಚಡೆ,\n ಮರಳಿ ಬಾಣವನರಸಲುಂಟೆ?\n ಗುಹೇಶ್ವರನೆಂಬ ಲಿಂಗವನರಿದು\n ಮರಳಿ ನೆನೆಯಲುಂಟೆ?"},"m":{"en":"This Vachana explains the state of complete dissolution of the individual self upon realizing the Formless Supreme Consciousness, addressed here through the ankitanama Guheshwara.\n\nThrough striking metaphors—such as a mountain of camphor burning without leaving charcoal, a temple of mist unable to bear a pinnacle of sunlight, and an arrow of wax vanishing into a mountain of glowing embers—the Vachana illustrates how the finite self is entirely consumed when it encounters the Absolute.\n\nJust as camphor, mist, and wax leave no trace behind upon meeting fire and heat, a seeker's separate identity and ego dissolve completely in the fire of true realization (Arivu).\n\nWhen one truly realizes the Supreme Reality, the duality between the knower and the known ceases to exist, leaving no separate mind behind to step back and remember or contemplate the Divine again as an external object.","hi":"इस वचन का केंद्रीय भाव यह है कि परम सत्य की पूर्ण अनुभूति हो जाने के बाद साधक का अपना अलग अस्तित्व या अहंकार शेष नहीं रहता।\n\nजिस प्रकार कपूर के पर्वत में आग लगने पर कोयला नहीं बचता, ओस के शिवालय पर धूप का कलश नहीं टिकता, और अंगारों के पहाड़ पर लाख का बाण चलाने पर उसे वापस नहीं खोजा जा सकता, उसी प्रकार अज्ञान और द्वैत ज्ञान की अग्नि में पूरी तरह विलीन हो जाते हैं।\n\nगुहेश्वर रूपी निराकार लिंग-तत्त्व को जानकर उसमें एकरूप हो जाने के बाद, साधक
