ning to spirituality out of mere fear and self-preservation rather than genuine inner awakening.\n\nUsing vivid imagery—such as fleeing a thief only to enter a forest where a tiger awaits, or escaping a tiger by hiding in an anthill inhabited by a venomous snake—the Vachana illustrates how running away from one peril without true understanding only leads to another.\n\nSimilarly, adopting the outward garb of a devotee simply out of the fear of death cannot free a person from the inescapable consequences of their own actions (karma).\n\nAddressed to the Formless Supreme Consciousness invoked as Guheshwara, the Vachana critiques such pretentious individuals who wear religious disguises out of fear, noting that their hollow ostentation leaves them utterly helpless inside the jaws of mortality.","hi":"इस वचन का मूल भाव यह है कि केवल भय से प्रेरित होकर अपनाया गया बाहरी भक्ति-भाव मनुष्य को उसके कर्मों के परिणाम और मृत्यु से बचा नहीं सकता।\n\nजैसे चोर के डर से जंगल में भागने वाला व्यक्ति बाघ का शिकार बन जाता है, और बाघ के डर से बांबी में छिपने वाले को सांप डस लेता है, वैसे ही संकट से केवल बाहरी पलायन करने से मुक्ति नहीं मिलती।\n\nइसी प्रकार, मृत्यु या काल के भय से यदि कोई व्यक्ति केवल ऊपरी तौर पर भक्त का रूप धारण कर लेता है, तो भी उसके अपने कर्म उसे ग्रसने से नहीं छोड़ते।\n\nअंततः गुहेश्वरा के रूप में संबोधित निराकार परमतत्त्व के समक्ष यह वचन उन पाखंडियों और दिखावटी वेशभूषा धारण करने वालों की निरर्थकता को उजागर करता है, जो आंतरिक सत्य को जाने बिना अंततः मृत्यु के मुख का ग्रास बन जाते हैं।","mr":"हे वचन केवळ मृत्यूच्या आणि काळाच्या भीतीने स्वीकारलेल्या वरवरच्या भक्तीचे आणि ढोंगीपणाचे फोलपण स्पष्ट करते.\n\nज्याप्रमाणे चोराच्या भीतीने जंगलात लपणाऱ्याला वाघ खातो आणि वाघाच्या भीतीने वारुळात शिरणाऱ्याला साप दंश करतो, त्याचप्रमाणे केवळ संकटातून किंवा मृत्यूच्या भयाने पळवाट म्हणून स्वीकारलेला भक्तीचा मार्ग माणसाला त्याच्या कर्माच्या फेऱ्यातून वाचवू शकत नाही.\n\nअशा भीतीपोटी केलेल्या बाह्य वेशभूषेमुळे आणि दांभिकपणामुळे माणसाची मृत्यूच्या जबड्यातून सुटका होत नाही.\n\nगुहेश्वरा या नावाने परमतत्त्वाला उद्देशून हे वचन सांगते की, आंतरिक जाणिवेशिवाय केवळ भयापोटी भक्ताचे सोंग घेणाऱ्या ढोंगी लोकांचे आचरण आध्यात्मिकदृष्ट्या पूर्णपणे निरर्थक ठरते.","fr":"Ce vachana met en lumière la futilité d'une dévotion née de la peur de la mort plutôt que d'une véritable conscience spirituelle.\n\nÀ travers l'image de celui qui fuit un voleur pour finir dévoré par un tigre dans la forêt, ou qui cherche refuge dans une termitière pour être mordu par un serpent, le texte montre qu'on ne peut échapper à son sort par la simple fuite.\n\nDe même, embrasser la voie de la dévotion par seule crainte du temps et du trépas ne libère nullement l'être humain de l'emprise de son karma.\n\nEn s'adressant à Guheshwara, la Réalité suprême sans forme, le vachana dénonce ainsi l'hypocrisie de ceux qui ne revêtent qu'un déguisement spirituel factice, demeurant malgré leurs apparences de simples proies dans la gueule de la mort."}},{"no":499,"o":"ಕಾಡುಗಿಚ್ಚೆದ್ದಡೆ ಅಡವಿಯೆ ಗುರಿ,\n ನೀರುಗಿಚ್ಚೆದ್ದಡೆ ಸಮುದ್ರವೆ ಗುರಿ,\n ಒಡಲುಗಿಚ್ಚೆದ್ದಡೆ ತನುವೆ ಗುರಿ,\n ಕಾಲಾಗ್ನಿಯೆದ್ದಡೆ ಲೋಕಂಗಳೆ ಗುರಿ,\n ಶಿವಶರಣರ ಮನದಲ್ಲಿ ಕೋಪಾಗ್ನಿಯೆದ್ದಡೆ ನಿಂದಕರೆ ಗುರಿ.\n ಗುಹೇಶ್ವರಾ ನಿಮ್ಮ ಮಾಯದ ಹೊಡೆಗಿಚ್ಚಿಂಗೆ\n ನಾನು ಗುರಿಯಲ್ಲ ಕೇಳಾ.","t":{"en":"When the forest fire rises, the forest itself is the target,\nwhen the submarine fire rises, the ocean itself is the target,\nwhen the fire of hunger rises, the body itself is the target,\nwhen the fire of time rises, the worlds themselves are the target,\nwhen the fire of wrath rises in the minds of Shiva's *Sharanas*, the slanderers themselves are the target.\nO Guheshwara, to the striking fire of your illusion,\nI am not the target, listen!","hi":"दावानल उठे तो वन ही लक्ष्य है,\nबड़वानल उठे तो समुद्र ही लक्ष्य है,\nजठराग्नि उठे तो तन ही लक्ष्य है,\nकालाग्नि उठे तो लोक ही लक्ष्य हैं,\nशिवशरणों के मन में क्रोधाग्नि उठे तो निंदक ही लक्ष्य हैं।\nहे गुहेश्वर, तुम्हारी माया की अंतर्दाह-अग्नि का\nमैं लक्ष्य नहीं हूँ, सुनो।","mr":"वणवा पेटला तर रानच त्याचे लक्ष्य ठरते,\nवडवानल पेटला तर समुद्रच त्याचे लक्ष्य ठरतो,\nजठराग्नी पेटला तर शरीरच त्याचे लक्ष्य ठरते,\nकालाग्नी पेटला तर सर्व लोकच त्याचे लक्ष्य ठरतात,\nशिवशरणांच्या मनात कोपाग्नी पेटला तर निंदकच त्याचे लक्ष्य ठरतात.\nहे गुहेश्वरा, तुमच्या मायेच्या पसरणाऱ्या आगीचे\nमी लक्ष्य नाही, हे ऐका.","fr":"Quand s'élève le feu des bois, c'est la forêt même qui est la cible,\nquand s'élève le feu des eaux, c'est l'océan même qui est la cible,\nquand s'élève le feu des entrailles, c'est le corps même qui est la cible,\nquand s'élève le feu du Temps, ce sont les mondes mêmes qui sont la cible,\nquand s'élève le feu de la colère dans l'esprit des Shiva-Sharanas, ce sont les détracteurs mêmes qui sont la cible.\nÔ Guheshwara, du feu foudroyant de votre Maya,\nje ne suis point la cible, écoutez !"},"m":{"en":"This Vachana uses a series of vivid metaphors to show that every type of fire has its specific target of consumption: a forest fire consumes the woods, submarine fire consumes the ocean, the fire of hunger consumes the physical body, and the cosmic fire of time consumes the worlds.\n\nExtending this principle to the spiritual realm, it notes that when the fire of righteous anger arises in the minds of Shiva Sharanas, it is directed solely against slanderers and detractors.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Guheshwara, the Vachana culminates in a declaration of absolute spiritual transcendence.\n\nHaving risen above worldly illusion, the speaker asserts complete immunity to the sudden, consuming fire of Maya, affirming that an enlightened consciousness can never become its target.","hi":"इस वचन में अग्नि के विभिन्न रूपों और उनके निश्चित लक्ष्यों का उदाहरण देते हुए प्रबुद्ध शरण की माया से अतीत अवस्था को स्पष्ट किया गया है।\n\nजिस प्रकार दावाग्नि का लक्ष्य जंगल, बड़वाग्नि का लक्ष्य समुद्र, जठराग्नि (भूख) का लक्ष्य शरीर और प्रलय की कालाग्नि का लक्ष्य समस्त लोक होते हैं, उसी प्रकार जब शिवशरणों के मन में क्रोधाग्नि जाग्रत होती है, तो उसका लक्ष्य केवल निंदक ही होते हैं।\n\nअंतिम पंक्तियों में निराकार परमतत्त्व गुहेश्वर को संबोधित करते हुए यह गहरा आध्यात्मिक सत्य प्रकट किया गया है कि हर अग्नि का अपना एक लक्ष्य होता है, किंतु आत्मज्ञानी साधक माया रूपी अदृश्य अग्नि का लक्ष्य कभी नहीं बन सकता, क्योंकि वह माया के प्रभाव से पूर्णतः मुक्त है।","mr":"या वचनाचा मुख्य आशय असा आहे की, निसर्गातील आणि जीवनातील विविध प्रकारच्या अग्नीचे एक निश्चित लक्ष्य असते; जसे की वणव्याचे लक्ष्य अरण्य, पाण्यातील बडवानलाचे लक्ष्य समुद्र, जठराग्नीचे लक्ष्य शरीर आणि प्रलयकाळातील कालाग्नीचे लक्ष्य संपूर्ण जग हे असते.\n\nत्याचप्रमाणे, शिवशरणांच्या मनात जेव्हा संतापाचा अग्नी पेटतो, तेव्हा केवळ निंदकच त्याचे लक्ष्य ठरतात.\n\nमात्र, गुहेश्वर या नावाने संबोधल्या गेलेल्या परमतत्त्वाच्या मायेच्या छुपा अग्नीला आपण कधीही बळी पडणार नाही, असा ठाम आत्मविश्वास येथे व्यक्त झाला आहे.\n\nहे वचन स्पष्ट करते की, आत्मज्ञानी शरण हा सर्वसामान्य प्रापंचिक अग्नी आणि मायेच्या प्रभावापलीकडे गेलेला असल्यामुळे कोणतीही माया त्याला भुरळ घालू शकत नाही किंवा जाळू शकत नाही.","fr":"Ce vachana s'appuie sur la métaphore puissante de divers feux destructeurs — le feu de forêt, le feu sous-marin, le feu de la faim dans les entrailles et le feu cosmique de la fin des temps — pour illustrer que chaque flamme possède une cible précise qu'elle finit par consumer, qu'il s'agisse des bois, de l'océan, du corps ou des mondes.\n\nDans cette même logique implacable, lorsque le feu de la colère s'éveille dans l'esprit des Shivasharanas, ce sont les calomniateurs et les détracteurs de la voie spirituelle qui en deviennent la cible directe.\n\nToutefois, la portée philosophique essentielle de ce poème réside dans son affirmation finale : en s'adressant à la Réalité suprême sans forme évoquée sous le nom de Guheshwara, la voix spirituelle déclare avec une absolue fermeté être totalement hors d'atteinte des flammes soudaines et insidieuses de l'illusion (Maya).\n\nCe texte met ainsi en lumière la souveraineté intérieure d'une conscience éveillée qui, ayant transcendé les pièges du monde illusoire, demeure invulnérable à ses assauts."}},{"no":500,"o":"ಕಾಯಕ್ಕೆ ಮಜ್ಜನ, ಪ್ರಾಣಕ್ಕೆ ಓಗರ\n ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಸುಳಿವ ಸುಳುಹುಳ್ಳನ್ನಕ್ಕ ಇದ ಮಾಡಲೇ ಬೇಕು.\n ಗುಹೇಶ್ವರನೆಂಬ [ಲಿಂಗಕ್ಕೆ] ಆತ್ಮವುಳ್ಳನ್ನಕ್ಕ\n ಭಕ್ತಿಯ ಮಾಡಲೇ ಬೇಕು.","t":{"en":"Bathing for the body, food for the vital breath—\nthis one must certainly do.\nAs long as the moving breath stirs, this one must certainly do.\nTo the *Linga* called Guheshwara, as long as the soul abides,\ndevotion one must certainly offer.","hi":"काया को स्नान, प्राण को भोजन,\nयह करना ही चाहिए।\nजब तक गति का स्पंदन रहे, यह करना ही चाहिए।\nगुहेश्वर नामक लिंग की, जब तक आत्मा रहे,\nभक्ति करनी ही चाहिए।","mr":"कायेला स्नान, प्राणाला नैवेद्य—\nहे केलेच पाहिजे.\nवाहणारा श्वास असेपर्यंत हे केलेच पाहिजे.\nगुहेश्वर नावाच्या लिंगाची आत्मा असेपर्यंत\nभक्ती केलीच पाहिजे.","fr":"Le bain pour le corps, la nourriture pour le souffle vital :\ncela, il faut assurément l'accomplir.\nTant que demeure le mouvement du souffle qui circule, cela, il faut assurément l'accomplir.\nEnvers le Linga que l'on appelle Guheshwara, tant que demeure l'âme,\nil faut assurément accomplir la Bhakti."},"m":{"en":"This Vachana explains the natural and unavoidable necessities of both physical existence and spiritual consciousness.\n\nJust as the physical body requires cleansing and the vital life-force needs nourishment for as long as breath and movement persist, the inner self also has an essential need.\n\nFor as long as individual consciousness endures, it must engage in devotion towards the Formless Supreme Reality, addressed here as Guheshwara.\n\nThrough this parallel, the Vachana highlights that while caring for the body and breath is an inescapable requirement of living, sustaining the inner self through devotion to the Absolute is equally indispensable.","hi":"इस वचन का मूल भाव यह है कि जिस प्रकार शरीर की स्वच्छता के लिए स्नान और प्राणों को बनाए रखने के लिए भोजन नितांत आवश्यक है, उसी प्रकार आत्मा के लिए भक्ति भी अपरिहार्य है।\n\nजब तक शरीर में श्वास और जीवन का संचार है, तब तक देह और प्राण के इन स्वाभाविक धर्मों का पालन करना ही पड़ता है।\n\nइसी प्रकार, यह वचन स्पष्ट करता है कि जब तक भीतर चैतन्य या आत्मा का अस्तित्व है, तब तक गुहेश्वर रूपी निराकार परमतत्त्व के प्रति निरंतर भक्ति का भाव बनाए रखना ही सच्ची साधना है।","mr":"हे वचन मानवी देह, प्राण आणि आत्मा यांच्यातील नैसर्गिक गरज आणि आध्यात्मिक कर्तव्य यातील परस्परसंबंध स्पष्ट करते.\n\nशरीराच्या शुद्धतेसाठी स्नान आणि प्राणाच्या पोषणासाठी अन्न घेणे, या गोष्टी देहात श्वास आणि हालचाल असेपर्यंत करणे अत्यावश्यक असते.\n\nत्याचप्रमाणे, जोपर्यंत आपल्यात आत्म्याचे अस्तित्व आणि जाणीव शिल्लक आहे, तोपर्यंत गुहेश्वर या नावाने ओळखल्या जाणाऱ्या निराकार परमतत्त्वाची भक्ती करणे तितकेच अनिवार्य आहे.\n\nदेह आणि प्राणाच्या जतनासाठी जसे बाह्य नियम पाळावे लागतात, तसेच आत्म्याच्या सार्थकतेसाठी अखंड भक्तीची नितांत गरज असते, असा सखोल विचार यातून व्यक्त होतो.","fr":"Ce vachana met en lumière le caractère indispensable des besoins fondamentaux de l'existence humaine et de la vie spirituelle.\n\nTant que le mouvement du souffle vital persiste en nous, il est tout à fait naturel et nécessaire d'accorder le bain au corps physique et la nourriture au principe vital.\n\nDe la même manière, tant que la conscience intérieure demeure présente, il est essentiel de vouer une dévotion sincère au Linga désigné sous le nom de Guheshwara, c'est-à-dire à la Réalité suprême sans forme.\n\nLa portée spirituelle de ce vachana réside ainsi dans l'équilibre lucide entre l'entretien légitime de la vie matérielle et l'engagement intérieur constant envers le principe absolu."}}]},
{"id":"s2","n":{"en":"Chennabasavanna","hi":"चेन्नबसवण्णा","mr":"चेन्नबसवण्णा","fr":"Chennabasavanna"},"v":[{"no":900,"o":"ವಾರವೇಳು ಕುಲ ಹದಿನೆಂಟು ಎಂಬರಯ್ಯಾ,\n ಅದ ನಾವು ಅಲ್ಲವೆಂಬೆವು.\n ಇರುಳೊಂದು ವಾರ, ಹಗಲೊಂದು ವಾರ,\n ಭವಿಯೊಂದು ಕುಲ, ಭಕ್ತನೊಂದು ಕುಲ,\n ನಾವು ಬಲ್ಲುದು ಕಾಣಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"They say there are seven days of the week and eighteen castes, O Lord;\nthat we declare is not so.\nNight is one day, and day is one day;\nthe worldly one is one caste, and the devotee is one caste—\nthis is what we know, you see, O Koodala Chennasangamadeva.","hi":"वार सात और कुल अठारह हैं, ऐसा कहते हैं, हे स्वामी,\nउसे हम नहीं कहते हैं।\nरात एक वार है, दिन एक वार है,\nभवि एक कुल है, भक्त एक कुल है,\nयही हम जानते हैं, देखो, हे कूडल चेन्नसंगमदेव।","mr":"हे प्रभो, वार सात आणि जाती अठरा आहेत असे लोक म्हणतात,\nत्याला आम्ही नाही म्हणतो.\nरात्र हा एक वार, दिवस हा एक वार,\nभवी ही एक जात, भक्त ही एक जात,\nहेच आम्ही जाणतो पाहून घ्या, हे कूडल चेन्नसंगमदेवा.","fr":"Ils disent qu'il y a sept jours et dix-huit castes, ô Seigneur,\nmais nous disons qu'il n'en est pas ainsi.\nLa nuit est un jour, le jour est un jour,\nle *Bhavi*, l'homme du monde, est une caste, le *Bhakta*, le dévot, est une caste :\nvoilà ce que nous savons, vois-tu, ô Koodala Chennasangamadeva."},"m":{"en":"This Vachana rejects the conventional worldly classification of time into seven days of the week and society into eighteen castes.\n\nInstead of artificial calendar divisions, the Sharana perspective recognizes only two natural phases of time: night and day.\n\nSimilarly, rather than dividing humanity by birth-based castes, it acknowledges only two spiritual states of being: the Bhavi, who remains bound to worldly ignorance, and the Bhakta, who walks the path of spiritual awareness.\n\nAddressed to the Formless Supreme Reality through the ankitanama Kudalachannasangamadeva, the Vachana affirms that true human distinction lies in one's spiritual consciousness rather than social or astrological categories.","hi":"इस वचन का मूल भाव यह है कि समाज में प्रचलित काल और जाति के कृत्रिम विभाजन, जैसे कि सप्ताह के सात वार और अठारह कुल, पूर्णतः निराधार और अस्वीकार्य हैं।\n\nयहाँ यह स्पष्ट किया गया है कि समय का वास्तविक और स्वाभाविक रूप केवल दो भागों में है—एक दिन का वार और दूसरा रात का वार।\n\nइसी प्रकार, जन्म पर आधारित अनेक जातियों को नकारते हुए मानव समाज को केवल दो ही कुलों में देखा गया है—एक 'भवि' अर्थात् सांसारिक अज्ञान में डूबा हुआ व्यक्ति, और दूसरा 'भक्त' अर्थात् सत्य के मार्ग पर चलने वाला साधक।\n\nनिराकार परमतत्त्व कूडल चन्नसंगमदेव को संबोधित यह वचन जन्मगत जातिभेद और बाह्य मान्यताओं का खंडन करते हुए मनुष्य की आध्यात्मिक चेतना को ही उसकी वास्तविक पहचान मानता है।","mr":"हे वचन काळाचे आणि मानवी समाजाचे पारंपरिक तसेच कृत्रिम विभाजन स्पष्टपणे नाकारते.\n\nजगाच्या दृष्टीने आठवड्याचे सात वार आणि समाजाची अठरा कुळे किंवा जाती मानल्या जातात, परंतु शरणांचा विवेक या रूढ समजुती अमान्य करतो.\n\nनिसर्गाच्या चक्रानुसार केवळ दिवस आणि रात्र हे दोनच मुख्य काळ आहेत, आणि मानवामध्येही केवळ अज्ञानी संसारी (भवी) आणि सत्याच्या मार्गावर चालणारा निष्ठावंत (भक्त) असे दोनच वर्ग अस्तित्वात आहेत.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाच्या साक्षीने हे वचन स्पष्ट करते की, जन्मजात जाती-कुळांच्या पलीकडे जाऊन मानवाची खरी ओळख त्याच्या आध्यात्मिक जाणीवेवरून आणि भक्तीवरूनच ठरते.","fr":"Ce vachana rejette avec fermeté les divisions conventionnelles du monde, qui séparent le temps en sept jours de la semaine et la société en dix-huit castes traditionnelles.\n\nLa philosophie des Sharanas dépasse ces classements artificiels pour ramener la réalité à une vérité beaucoup plus simple et essentielle.\n\nSur le plan du temps, il n'existe véritablement que deux cycles fondamentaux : celui du jour et celui de la nuit.\n\nDe même, au regard de la Réalité suprême sans forme invoquée sous le nom de Koodalachannasangamadeva, l'humanité ne se divise pas selon la naissance, mais uniquement selon la conscience spirituelle : d'un côté le Bhavi, l'être tourné vers la mondanité, et de l'autre le Bhakta, le dévot éveillé à la vérité."}},{"no":901,"o":"ವಾಸಿಸುವ ನಾಸಿಕ ನೀನೆಂದರಿದೆ,\n ರುಚಿಸುವ ಜಿಹ್ವೆ ನೀನೆಂದರಿದೆ,\n ನೋಡುವ ನಯನ ನೀನೆಂದರಿದೆ,\n ಮುಟ್ಟುವ ತ್ವಕ್ಕು ನೀನೆಂದರಿದೆ,\n ಕೇಳುವ ಶ್ರೋತ್ರ ನೀನೆಂದರಿದೆ.\n ಇದು ಕಾರಣ, ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ನಾ ನಿಮ್ಮ ಬೇಡಲಿಲ್ಲಾಗಿ ಕೂರ್ತು ಕೊಡಲಿಲ್ಲ.","t":{"en":"I knew that you are the nose that smells,\nI knew that you are the tongue that tastes,\nI knew that you are the eye that sees,\nI knew that you are the skin that touches,\nI knew that you are the ear that hears.\nTherefore, O Koodala Chennasangayya,\nbecause I did not beg of you, I did not lovingly give.","hi":"सूँघनेवाली नासिका आप ही हैं, यह मैंने जाना,\nचखनेवाली जिह्वा आप ही हैं, यह मैंने जाना,\nदेखनेवाले नयन आप ही हैं, यह मैंने जाना,\nछूनेवाली त्वचा आप ही हैं, यह मैंने जाना,\nसुननेवाले श्रोत्र आप ही हैं, यह मैंने जाना।\nइस कारण, हे कूडल चेन्नसंगय्या,\nमैंने आपसे माँगा नहीं, इसलिए आपने प्रेम से दिया नहीं।","mr":"गंध घेणारी नासिका तूच आहेस असे मी जाणले,\nचव घेणारी जिव्हा तूच आहेस असे मी जाणले,\nपाहणारे नयन तूच आहेस असे मी जाणले,\nस्पर्श करणारी त्वचा तूच आहेस असे मी जाणले,\nऐकणारे श्रोत्र तूच आहेस असे मी जाणले.\nयाच कारणाने, हे कूडल चेन्नसंगय्या,\nमी तुझ्याकडे मागितले नाही, म्हणून प्रीतीने दिलेही नाही.","fr":"J'ai su que la narine qui hume, c'est vous,\nj'ai su que la langue qui goûte, c'est vous,\nj'ai su que l'œil qui voit, c'est vous,\nj'ai su que la peau qui touche, c'est vous,\nj'ai su que l'oreille qui entend, c'est vous.\nC'est pourquoi, Ô Koodala Chennasangayya,\npuisque je ne vous ai rien demandé, vous n'avez rien donné avec amour."},"m":{"en":"This Vachana expresses the profound spiritual realization that the Formless Supreme Consciousness is not a distant entity, but the very animating awareness functioning through every human sense organ.\n\nThe five senses—smell, taste, sight, touch, and hearing—are recognized as nothing other than the direct presence of Kudalachannasanga operating within the body.\n\nBecause the seeker has realized this complete non-duality between personal sensory experience and the Absolute, the conventional distinction between a worshipper who asks and a divine power that grants is entirely dissolved.\n\nIn this state of unified awareness, there is no sense of separation left from which one could either beg for grace or offer something in devotion.","hi":"इस वचन का केंद्रीय भाव यह है कि जब साधक को यह बोध हो जाता है कि शरीर की समस्त ज्ञानेंद्रियाँ स्वयं उस निराकार परमतत्त्व का ही स्वरूप हैं, तब बाह्य कामनाओं का अस्तित्व समाप्त हो जाता है।\n\nयहाँ स्पष्ट किया गया है कि सूँघने वाली नासिका, स्वाद लेने वाली जिह्वा, देखने वाले नेत्र, स्पर्श करने वाली त्वचा और सुनने वाले कान—इन सभी इंद्रियों में वही शुद्ध चैतन्य सक्रिय रूप से विद्यमान है।\n\nजब प्रत्येक इंद्रिय और उसके अनुभव में कूडल चन्नसंगम के रूप में संबोधित उस परम सत्य की ही अनुभूति हो जाती है, तो साधक और परमतत्त्व के बीच का द्वैत मिट जाता है।\n\nइस वचन का आध्यात्मिक महत्व यह है कि इस पूर्ण एकत्व की स्थिति में न तो साधक को परमतत्त्व से अलग से कुछ माँगने की आवश्यकता रहती है और न ही परमतत्त्व को अलग से कुछ प्रदान करने की, क्योंकि सब कुछ पहले से ही उस चैतन्य से परिपूर्ण है।","mr":"हे वचन मानवी ज्ञानेंद्रिये आणि निराकार परमतत्त्व यांच्यातील अद्वैत संबंध स्पष्ट करते.\n\nवास घेणारे नाक, चव घेणारी जीभ, पाहणारे डोळे, स्पर्श जाणणारी त्वचा आणि ऐकणारे कान या पंचेंद्रियांच्या मुळाशी कूडलचन्नसंगम हेच शुद्ध चैतन्य कार्यरत असल्याची सखोल जाणीव येथे व्यक्त झाली आहे.\n\nज्या अर्थी अनुभव घेणारी सर्व इंद्रिये आणि त्यामागील जाणीव हे परमतत्त्वच आहे, त्या अर्थी साधक आणि परमतत्त्व यांच्यात कोणताही दुरावा किंवा वेगळेपण उरत नाही.\n\nया एकरूपतेच्या जाणिवेमुळेच साधकाने त्या परम सत्याकडे वेगळे काही मागितले नाही आणि परमतत्त्वानेही प्रीतीने काही वेगळे देण्याची गरज उरली नाही, हा या वचनाचा गहन आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière la réalisation spirituelle selon laquelle la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasangama, n'est pas extérieure à l'être, mais constitue l'essence même des cinq sens.\n\nEn reconnaissant que l'odorat, le goût, la vue, le toucher et l'ouïe sont animés par cette Conscience pure, le chercheur comprend que ses propres facultés sensorielles ne font qu'un avec le Principe suprême.\n\nEn raison de cette unité absolue, toute dualité entre l'adorateur et l'Absolu s'efface, éliminant ainsi le besoin de formuler la moindre prière ou requête.\n\nLa portée philosophique de ce vachana réside dans ce dépassement de la relation transactionnelle : là où il n'y a plus de séparation pour demander quoi que ce soit, il n'y a plus non plus d'acte extérieur de don par complaisance."}},{"no":902,"o":"ವೀರನಾದರೆ ಅಲಗಿನ ಮೊನೆಯಲ್ಲಿ ಕಾಣಬಹುದು,\n ಧೀರನಾದರೆ ತನ್ನ ಸೋಂಕಿದಲ್ಲಿ ಅರಿಯಬಹುದು,\n ಭಕ್ತನಾದರೆ ತಾಗು ನಿರೋಧದಲ್ಲಿ ಅರಿಯಬಹುದು.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ,\n ಸುಜ್ಞಾನಿಯಾದರೆ ಸುಳುಹಿನಲ್ಲಿ ಅರಿಯಬಹುದು.","t":{"en":"If one is a warrior, it can be seen at the point of a blade,\nIf one is a person of fortitude, it can be known when struck,\nIf one is a devotee, it can be known in reproof and restraint.\nO Koodala Chennasangayya,\nIf one is truly wise, it can be known in one's very bearing.","hi":"वीर हो तो तलवार की नोक पर देखा जा सकता है,\nधीर हो तो अपने पर प्रहार लगने पर जाना जा सकता है,\nभक्त हो तो अनुशासन की कसौटी में जाना जा सकता है।\nहे कूडल चेन्नसंगय्या,\nसुज्ञानी हो तो उसके आचरण के संकेत में जाना जा सकता है।","mr":"वीर असल्यास तलवारीच्या टोकावर पाहता येते,\nधीर असल्यास त्याला स्पर्श होताच जाणता येते,\nभक्त असल्यास आघात आणि रोधामध्ये जाणता येते.\nहे कूडल चेन्नसंगय्या,\nसुज्ञानी असल्यास त्याच्या खुणेवरून जाणता येते.","fr":"S'il est un vaillant guerrier, on peut le voir à la pointe de la lame,\ns'il est un homme ferme, on peut le reconnaître lorsqu'on le touche,\ns'il est un dévot, on peut le reconnaître dans le choc de l'épreuve et de l'opposition.\nÔ Koodala Chennasangayya,\ns'il est un être de vraie connaissance, on peut le reconnaître à son maintien même."},"m":{"en":"This Vachana explains that a person's true inner stature is revealed only through lived conduct and moments of testing, rather than mere outward claims.\n\nJust as a warrior's valor is proven at the sharp point of a sword and a person of fortitude is recognized when directly confronted by adversity, a true devotee is known by their steadfastness in restraining worldly impulses and enduring trials.\n\nAddressing the Formless Supreme Consciousness as Kudalachannasanga, the Vachana concludes that a person of true spiritual wisdom (Sujnani) is effortlessly recognized through their very presence, demeanor, and subtle way of life.\n\nUltimately, it emphasizes that in Sharana philosophy, both devotion and enlightened awareness must naturally manifest in one's everyday actions and character.","hi":"इस वचन का केंद्रीय भाव यह है कि किसी भी व्यक्ति के वास्तविक गुण की पहचान केवल कोरी बातों से नहीं, बल्कि प्रत्यक्ष कसौटी और आचरण से होती है।\n\nजिस प्रकार एक सच्चे वीर की परख तलवार की धार पर और एक धैर्यवान (धीर) व्यक्ति की पहचान उस पर विपत्ति या प्रहार पड़ने पर होती है, उसी प्रकार एक सच्चे भक्त की परीक्षा सांसारिक आघातों और बाधाओं का सामना करने तथा उन पर नियंत्रण रखने से होती है।\n\nकूडल चन्नसंगम (निराकार परम सत्य) को संबोधित यह वचन स्पष्ट करता है कि यदि कोई वास्तव में सुज्ञानी है, तो उसकी इस आंतरिक प्रज्ञा की पहचान उसकी सहज उपस्थिति, आचरण और व्यवहार के संकेतों से ही हो जाती है।","mr":"या वचनाचा मुख्य आशय असा आहे की, कोणत्याही व्यक्तीच्या खऱ्या स्वरूपाची ओळख केवळ बाह्य शब्दांनी होत नाही, तर प्रत्यक्ष कृतीतून आणि कसोटीच्या प्रसंगांतूनच होते.\n\nखऱ्या शूराची परीक्षा समोर आलेल्या तलवारीच्या टोकावर आणि धैर्यवान व्यक्तीची पारख तिच्यावर आघात किंवा संकट कोसळल्यावरच्या तिच्या स्थिरतेतून होते.\n\nत्याचप्रमाणे, एका सच्च्या भक्ताची निष्ठा ही तो स्वतःवर व आपल्या विकारांवर कसा संयम व नियंत्रण ठेवतो यावरून ओळखता येते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला स्मरून हे वचन स्पष्ट करते की, खऱ्या सुज्ञानी व्यक्तीची ओळख तिच्या सहज हालचाली, वागणूक आणि तिच्या अस्तित्वातूनच आपोआप पटते.","fr":"Ce vachana met en lumière l’idée que la véritable nature d’un être ne se révèle pas par de simples revendications, mais à travers l’épreuve du réel et sa manière d’être au monde.\n\nTout comme la bravoure d’un guerrier se vérifie à la pointe de l’épée et la fermeté du courageux au moment où il est directement éprouvé, l’authenticité du dévot se reconnaît à sa capacité de maîtrise intérieure face aux obstacles et aux assauts de l’existence.\n\nEn s’adressant à la Réalité suprême sans forme sous l’ankitanama Koodalachannasanga, le poème souligne que l’être éveillé à la vraie connaissance spirituelle se distingue naturellement par la justesse de sa présence, de ses gestes et de son rayonnement.\n\nLa portée philosophique de ce vachana réside ainsi dans l’unité entre l’état intérieur et l’expression vécue : la sagesse véritable (Sujnana) n’est jamais abstraite, mais se rend perceptible dans le moindre mouvement de la vie quotidienne."}},{"no":903,"o":"ವ್ರತಸ್ಥನರಿವು ಪ್ರಪಂಚಿನಲೆ ಹೋಯಿತ್ತು,\n ಭಾಷೆವಂತನರಿವು ವಂಚನೆಯಲೆ ಹೋಯಿತ್ತು,\n ನೇಮಸ್ಥನರಿವು ಸಂಕಲ್ಪದಲೆ ಹೋಯಿತ್ತು,\n ಶೀಲವಂತನರಿವು ಸೂತಕದಲೆ ಹೋಯಿತ್ತು,\n ಜಂಗಮದರಿವು ಬೇ[ಡಿದಾಗ]ಲೆ ಹೋಯಿತ್ತು,\n ಪ್ರಸಾದದರಿವು ಬೆರಕೆಯಲ್ಲಿ ಹೋಯಿತ್ತು.\n ಇಂತಿವು ಷಡುಸ್ಥಲದ ನಿರ್ಣಯಕ್ಕೆ ಸಲ್ಲದೆ ಹೋ[ದ]ವು,\n ಕೂಡಲಚೆನ್ನಸಂಗನಲ್ಲಿ.","t":{"en":"The awareness of the keeper of vows was lost in worldliness,\nthe awareness of the keeper of his word was lost in deceit,\nthe awareness of the observer of disciplines was lost in willful intent,\nthe awareness of the follower of strict conduct was lost in ritual pollution,\nthe awareness of the *Jangama* was lost the very moment he begged,\nthe awareness of *Prasada* was lost in admixture.\nThus all these proved unfit for the definitive truth of the *Shadusthala*,\nbefore Koodalachennasanga.","hi":"व्रतस्थ का बोध प्रपंच में ही चला गया,\nशपथधारी का बोध वंचना में ही चला गया,\nनियमस्थ का बोध संकल्प में ही चला गया,\nशीलवंत का बोध सूतक में ही चला गया,\nजंगम का बोध माँगते ही चला गया,\nप्रसाद का बोध मिलावट में चला गया।\nइस प्रकार ये षट्स्थल के निर्णय के योग्य न रहे,\nकूडलचेन्नसंग के आगे।","mr":"व्रतस्थाची जाणीव प्रपंचातच नाहीशी झाली,\nवचनबद्ध असलेल्याची जाणीव वंचनेतच नाहीशी झाली,\nनियमनिष्ठाची जाणीव संकल्पातच नाहीशी झाली,\nशीलवंताची जाणीव सूतकातच नाहीशी झाली,\nजंगमाची जाणीव मागताच नाहीशी झाली,\nप्रसादाची जाणीव भेसळीत नाहीशी झाली.\nअशा प्रकारे या गोष्टी षड्स्थलाच्या निर्णयास पात्र न ठरता वाया गेल्या,\nकूडलचेन्नसंगासमोर.","fr":"La conscience éveillée de celui qui observe les vœux s'est perdue dans la mondanité même,\nla conscience éveillée de celui qui tient parole s'est perdue dans la tromperie même,\nla conscience éveillée de celui qui suit la règle s'est perdue dans le désir intentionnel même,\nla conscience éveillée de l'homme de pure conduite s'est perdue dans la souillure rituelle du Sutaka même,\nla conscience éveillée du Jangama s'est perdue à l'instant même où il mendie,\nla conscience éveillée du Prasada s'est perdue dans l'adultération.\nAinsi, toutes ces choses sont devenues impropres à l'accomplissement définitif des six étapes du Shatsthala,\nen présence de Koodalachennasanga."},"m":{"en":"This Vachana examines how true spiritual awareness (Arivu) is lost when religious disciplines and noble principles are compromised by underlying worldly weaknesses and inner contradictions.\n\nThe Vachana points out that the awareness of one observing sacred vows is lost in worldly entanglement, the pledge-keeper's integrity is ruined by deceit, the practitioner of strict rules falls prey to calculated desires, and the seeker of purity becomes trapped in notions of ritual pollution.\n\nSimilarly, the spiritual stature of a Jangama—an enlightened seeker and guide—is diminished the moment they resort to begging, and the sanctity of Prasada is lost when it becomes tainted by impurity or discrimination.\n\nUltimately, the Vachana concludes that such compromised practices fail to meet the true standard of the six-fold spiritual path (Shatsthala) and have no place in the realization of the Supreme Reality, Kudalachannasanga.","hi":"इस वचन का केंद्रीय भाव यह है कि बाह्य नियमों और आचरणों में उलझकर जब आत्मिक चेतना या सजगता नष्ट हो जाती है, तब साधना का वास्तविक उद्देश्य ही समाप्त हो जाता है।\n\nयह वचन स्पष्ट करता है कि यदि व्रतधारी का बोध सांसारिक मोह में, वचनबद्ध व्यक्ति का बोध छल-कपट में, नियम का पालन करने वाले का बोध मन की कामनाओं में, और सदाचारी का बोध छूत-अछूत या सूतक के भ्रम में खो जाए, तो उनकी साधना निरर्थक हो जाती है।\n\nइसी प्रकार, आध्यात्मिक ज्ञान का प्रसार करने वाले त्यागी जंगम साधक की गरिमा याचना करने से और प्रसाद की शुद्धता सांसारिक मिलावट से नष्ट हो जाती है।\n\nकूडलचेन्नसंगम रूपी निराकार परमतत्त्व की प्राप्ति के मार्ग में ऐसे खंडित और दिखावटी आचरण षट्स्थल दर्शन की कसौटी पर कभी खरे नहीं उतर सकते।","mr":"हे वचन आध्यात्मिक साधनेतील बाह्य आचरण आणि आंतरिक शुद्ध भान (अरीवु) यांमधील विरोधाभासावर प्रकाश टाकते.\n\nव्रत करणाऱ्याची जाणीव प्रपंचाच्या गुंत्यात, वचनबद्ध साधकाची जाणीव फसवणुकीत, नियम पाळणाऱ्याची जाणीव मनातील संकल्पांत आणि शीलवंताची जाणीव सुतकाच्या भ्रमात अडकून नष्ट होते.\n\nत्याचप्रमाणे, विरक्त असायला हव्या असलेल्या जंगम साधकाची जाणीव जेव्हा तो इतरांकडे याचना करतो तेव्हा संपते आणि प्रसादाचे पवित्र भान भेसळीच्या वृत्तीमुळे लोप पावते.\n\nकूडलचन्नसंगम या निराकार परमतत्त्वाच्या सान्निध्यात, अशा दोषांनी युक्त असलेल्या या गोष्टी षट्स्थलाच्या अंतिम आध्यात्मिक कसोट्यांवर कधीच पात्र ठरू शकत नाहीत.","fr":"Ce vachana met en lumière la manière dont la conscience spirituelle véritable, l'Arivu, se perd lorsque la pratique religieuse est corrompue par des compromis intérieurs et extérieurs.\n\nIl explique que l'observance des vœux s'égare dans la mondanité, la parole donnée dans la tromperie, la discipline rituelle dans les intentions intéressées et la pureté morale dans l'obsession de la souillure.\n\nDe même, la dignité spirituelle du Jangama — le renonçant et guide spirituel éclairé — s'évanouit dès lors qu'il mendie ou sollicite autrui, tout comme la sacralité du Prasada se dissout lorsqu'il est dénaturé par le mélange et l'impureté.\n\nLa portée spirituelle de ce texte réside dans le constat que ces pratiques dégradées ne répondent plus à l'exigence véritable de la voie des six étapes spirituelles, le Shatsthala, en la Réalité suprême sans forme invoquée sous le nom de Koodalachannasanga."}},{"no":904,"o":"ಶರಣನೆನಿಸಿಕೊಂಬುದು ಕರ ಅರಿದು ನೋಡಯ್ಯಾ!\n ಸತ್ಯಸದ್ಭಕ್ತರೊಳಡಗಿ ತನ್ನ ಕುರುಹ ಲೋಕಕ್ಕೆ ತೋರದಿರಬೇಕು.\n ಸಕಲಜೀವರಾಶಿಗಳಿಗೆ ರೋಷ ಹರುಷವ ತಾಳದಿರಬೇಕು.\n ಇಂತಪ್ಪ ಶರಣನಲ್ಲಿ ಸನ್ನಿಹಿತ ನಮ್ಮ ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ.","t":{"en":"To be called a *Sharana* is exceedingly rare, behold, O Lord!\nHidden among true and virtuous devotees, one must not display one's own mark to the world.\nToward the multitude of all living beings, one must bear neither wrath nor elation.\nIn such a *Sharana*, our Koodala Chennasangamadeva abides ever near.","hi":"शरण कहलाना अत्यंत कठिन है, देखो भाई!\nसत्य-सद्भक्तों में छिपकर, अपनी पहचान संसार को न दिखानी चाहिए।\nसकल जीवराशियों के प्रति रोष और हर्ष न धारण करना चाहिए।\nऐसे शरण में सन्निहित हैं हमारे कूडल चेन्नसंगमदेव।","mr":"शरण म्हणवून घेणे अत्यंत कठीण आहे, पहा हे प्रभो!\nसत्य सद्भक्तांमध्ये लीन राहून आपली खूण जगाला दाखवू नये.\nसकल जीवराशींविषयी रोष आणि हर्ष बाळगू नये.\nअशा या शरणाच्या ठायी आमचे कूडल चेन्नसंगमदेव सन्निहित आहेत.","fr":"Le fait d'être appelé un Sharana est extrêmement difficile, vois-tu, mon frère !\nS'effaçant parmi les vrais et vertueux dévots, il ne doit point montrer sa propre marque au monde.\nEnvers la multitude de tous les êtres vivants, il ne doit éprouver ni colère ni exaltation.\nAuprès d'un tel Sharana demeure présent notre Koodala Chennasangamadeva."},"m":{"en":"This Vachana explains that earning the title of a true Sharana is an extraordinarily difficult spiritual achievement, not merely a social identity.\n\nA genuine seeker must dissolve the ego by merging quietly into the company of truthful devotees, completely concealing any personal trace or outward display of spiritual superiority from the world.\n\nFurthermore, such a person must cultivate inner balance toward all living beings, remaining free from the dual impulses of anger and elation.\n\nThe Vachana concludes that the Formless Supreme Consciousness, addressed here as Kudalachannasangamadeva, abides intimately within a Sharana who embodies this quiet humility and emotional steadiness.","hi":"इस वचन का केंद्रीय भाव यह है कि एक सच्चा 'शरण' कहलाना और उस अवस्था को जीना अत्यंत कठिन व दुर्लभ साधना है।\n\nसच्चे शरण का लक्षण यह है कि वह सत्यनिष्ठ सद्भक्तों के बीच सहज रूप से घुल-मिलकर रहता है और संसार के सामने अपनी अलग पहचान, श्रेष्ठता या बाहरी चिह्न का प्रदर्शन नहीं करता।\n\nइसके साथ ही, वह समस्त जीव-जगत के प्रति किसी भी प्रकार के क्रोध या अति-हर्ष (राग-द्वेष) के भाव से पूर्णतः मुक्त रहता है।\n\nवचन का आध्यात्मिक निष्कर्ष यह है कि जो साधक इस प्रकार अहंकारशून्य और समभाव में स्थित होता है, उसी सच्चे शरण के भीतर निराकार परमतत्त्व 'कूडल चन्नसंगमदेव' का सदैव वास होता है।","mr":"हे वचन स्पष्ट करते की स्वतःला 'शरण' म्हणवून घेणे ही अत्यंत कठीण आणि सूक्ष्म साधना आहे.\n\nखऱ्या शरणाने आपले स्वतंत्र अस्तित्व आणि अहंभाव बाजूला सारून, सद्भक्तांच्या समूहामध्ये इतके एकरूप होऊन जावे की जगाला त्याची वेगळी ओळख जाणवू नये.\n\nतसेच, प्राणिमात्रांच्या बाबतीत त्याने राग किंवा हर्ष यांसारख्या द्वंद्वांच्या पलीकडे जाऊन समभावाने वागले पाहिजे.\n\nअशा निरहंकारी आणि समदर्शी शरणाच्या ठायीच कूडलचन्नसंगमदेव या नावाने संबोधले जाणारे परमतत्त्व अखंड वास करते, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière la très haute exigence spirituelle qu'implique le fait d'être reconnu comme un véritable Sharana.\n\nIl explique qu'un tel être doit demeurer humblement immergé parmi les dévots sincères et véridiques, en effaçant toute trace de son ego ou de sa propre importance aux yeux du monde.\n\nDe plus, il lui faut cultiver une égalité d'âme parfaite envers l'ensemble des êtres vivants, en se gardant aussi bien de la colère que de l'exaltation.\n\nLa portée spirituelle de ce vachana réside dans l'affirmation que la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasangamadeva, demeure intimement présente en un Sharana d'une telle pureté intérieure."}},{"no":905,"o":"ಶರಣ ಶರಣನ ಕಂಡು,\n ‘ಶರಣು’ ಎಂದು ಕರವ ಮುಗಿವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಶರಣನ ಕಂಡು,\n ಪಾದವಿಡಿದು ವಂದಿಸುವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಚರಣವ ಪಿಡಿಯದೆ\n ಕಂಡೂ ಕಾಣದೆ ಪೋದನಾದಡೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗನ ಶರಣರು ಮನ್ನಿಸರಯ್ಯಾ.","t":{"en":"When a *Sharana* sees a *Sharana*,\nto fold one's hands and say \"*Sharanu*\" is the mark of devotion.\nWhen a *Sharana* sees a *Sharana*,\nto clasp the feet and bow in reverence is the mark of devotion.\nWithout clasping the feet of a *Sharana*,\nif one walks away as though not seeing even after seeing,\nthe *Sharanas* of Koodala Chennasanga will not forgive him, O Lord.","hi":"शरण का शरण को देखकर,\n‘शरणु’ कहकर हाथ जोड़ना ही भक्ति का लक्षण है।\nशरण का शरण को देखकर,\nचरण पकड़कर वंदना करना ही भक्ति का लक्षण है।\nशरण के चरण न पकड़कर,\nदेखते हुए भी अनदेखा कर चला जाए तो,\nकूडल चेन्नसंगम के शरण उसे स्वीकार नहीं करते, हे स्वामी।","mr":"शरणाने शरणाला पाहून,\n‘शरणु’ म्हणून कर जोडणे हेच भक्तीचे लक्षण आहे.\nशरणाने शरणाला पाहून,\nपाय धरून वंदन करणे हेच भक्तीचे लक्षण आहे.\nशरणाचे चरण न धरता,\nपाहूनही न पाहिल्यासारखे करून निघून गेल्यास,\nकूडल चेन्नसंगाचे शरण त्याला मान देणार नाहीत, हे प्रभो.","fr":"Lorsqu'un Sharana voit un autre Sharana,\ndire « Sharanu » et joindre les mains, voilà la marque de la Bhakti.\nLorsqu'un Sharana voit un autre Sharana,\ntoucher ses pieds et le saluer avec révérence, voilà la marque de la Bhakti.\nSi, sans toucher les pieds du Sharana,\nil s'en va en feignant de ne pas voir tout en ayant vu,\nles Sharanas de Koodala Chennasanga ne l'accepteront point, ô Seigneur."},"m":{"en":"The central message of this Vachana is that true devotion is expressed through mutual humility and deep reverence whenever one Sharana encounters another.\n\nFolding one's hands in the greeting of \"Sharanu\" and bowing down to touch the feet of a fellow seeker are highlighted as the authentic marks of spiritual devotion.\n\nIn contrast, seeing a fellow Sharana and walking past as if not noticing them—failing to offer humble salutation—reveals an egoistic indifference that contradicts the spirit of the collective.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalachannasangama, the Vachana concludes that true Sharanas will never accept or pardon such disregard for spiritual companionship.","hi":"इस वचन का केंद्रीय भाव यह है कि एक शरण द्वारा दूसरे शरण के प्रति विनम्रता और आदर प्रकट करना ही सच्ची भक्ति की पहचान है।\n\nजब एक शरण दूसरे शरण को देखता है, तब 'शरणु' कहकर हाथ जोड़ना और उनके चरण स्पर्श कर वंदन करना ही भक्ति का वास्तविक लक्षण है।\n\nइसके विपरीत, यदि कोई व्यक्ति किसी शरण को देखकर भी अनदेखा कर देता है और अहंकार या उदासीनता के कारण उन्हें प्रणाम किए बिना ही आगे बढ़ जाता है, तो यह आचरण भक्ति के मार्ग के विरुद्ध है।\n\nयह वचन स्पष्ट करता है कि परमतत्त्व कूडलचन्नसंगम के सच्चे शरण ऐसे अहंकारी और शिष्टाचारहीन व्यवहार को कभी स्वीकार नहीं करते।","mr":"हे वचन भक्तीच्या खऱ्या लक्षणांचे आणि शरण परंपरेतील परस्पर आदराच्या महत्त्वाचे दर्शन घडवते.\n\nएका शरणाने दुसऱ्या शरणाला पाहताच अत्यंत नम्रतेने 'शरणु' म्हणत हात जोडणे आणि त्याच्या चरणांना स्पर्श करून वंदन करणे, हेच खऱ्या भक्तीचे लक्षण आहे.\n\nयाउलट, जर एखाद्याने दुसऱ्या शरणाला पाहूनही त्याच्या चरणांचे वंदन केले नाही आणि न पाहिल्यासारखे करून तो अहंकाराने किंवा बेफिकिरीने पुढे निघून गेला, तर ते वर्तन भक्तीला धरून नाही.\n\nअशा प्रकारे शरणांचा अनादर करणाऱ्या किंवा त्यांच्याकडे दुर्लक्ष करणाऱ्या व्यक्तीला कूडलचन्नसंगमदेवाचे शरण कधीही मान्यता देत नाहीत आणि त्याचा स्वीकार करत नाहीत, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que le signe véritable de la dévotion réside dans l'humilité et le respect mutuel entre les Sharanas.\n\nLorsqu'un chercheur spirituel rencontre un autre Sharana, le saluer avec révérence les mains jointes et s'incliner à ses pieds constituent l'expression authentique de sa foi.\n\nEn revanche, ignorer la présence d'un pair par indifférence ou par orgueil, en passant son chemin sans lui témoigner de déférence, trahit l'esprit même de cette voie.\n\nUne telle attitude de mépris délibéré est jugée inacceptable par la communauté des chercheurs dévoués à la Réalité suprême sans forme, invoquée ici sous la signature spirituelle de Koodalachannasanga."}},{"no":906,"o":"ಶಬ್ದ ಸ್ಪರ್ಶ ರೂಪ ರಸ ಗಂಧ ಪಂಚೇಂದ್ರಿಯ ಮೊದಲಾಗಿ\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಬಂದ ಸುಖ ಲಿಂಗಾರ್ಪಿತವೆಂದು\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ಲಿಂಗ ನೀನಾಗಿ ಶರಣಂಗೆ.","t":{"en":"Sound, touch, form, taste, and fragrance, beginning with the five senses,\nmoved solely toward the *Linga*.\nHolding that every joy that came is an offering to the *Linga*,\nthey moved solely toward the *Linga*.\nO Koodala Chennasanga,\nas you yourself have become the *Linga* for the *Sharana*.","hi":"शब्द, स्पर्श, रूप, रस, गंध और पंचेंद्रिय आदि सब,\nलिंग की ही ओर चल पड़े।\nप्राप्त सुख को लिंगार्पित मानकर,\nवे लिंग की ही ओर चल पड़े।\nहे कूडल चेन्नसंग,\nशरण के लिए तुम्हारे ही लिंग बन जाने से।","mr":"शब्द, स्पर्श, रूप, रस, गंध आणि पंचेंद्रिये यांसह सारे काही\nवळले लिंगाच्याच दिशेने.\nप्राप्त झालेले सुख लिंगार्पित आहे असे म्हणून\nवळले लिंगाच्याच दिशेने.\nहे कूडल चेन्नसंगा,\nशरणासाठी तूच लिंग झाल्यामुळे.","fr":"Le son, le toucher, la forme, la saveur et le parfum, à commencer par les cinq organes des sens,\nse sont mis en marche, uniquement vers le Linga.\nConsidérant tout bonheur qui survient comme une offrande au Linga,\nils se sont mis en marche, uniquement vers le Linga.\nÔ Koodala Chennasanga,\npuisque tu es devenu toi-même le Linga pour le Sharana."},"m":{"en":"This Vachana explains how a true Sharana transforms all five sensory experiences—sound, touch, form, taste, and smell—by directing them entirely towards the Linga.\n\nRather than rejecting the senses or indulging in them for selfish pleasure, the Sharana treats every joy arising through these faculties as Lingarpita, a sacred offering to the Divine.\n\nThrough the practice of Linganga Yoga, the bodily senses are purified and aligned with the Ishtalinga, which serves as the sacred medium connecting the individual to the Formless Supreme Consciousness.\n\nAddressed to Kudalachannasangama, the Vachana reveals that when the Supreme Reality itself becomes the guiding awareness within the Sharana, every sensory perception naturally flows back into the Divine.","hi":"यह वचन शरण की उस उच्च आध्यात्मिक अवस्था को स्पष्ट करता है जहाँ उनकी सभी इंद्रियाँ और अनुभव परमतत्त्व में ही केंद्रित हो जाते हैं।\n\nशब्द, स्पर्श, रूप, रस और गंध रूपी पाँचों इंद्रियाँ तथा मन-प्राण बाहरी विषयों की ओर भटकने के बजाय सहज ही लिंग अर्थात् निराकार शुद्ध चैतन्य की ओर प्रवृत्त हो जाते हैं।\n\nजब इंद्रियों के माध्यम से प्राप्त होने वाले प्रत्येक सुख को लिंग को ही अर्पित मान लिया जाता है, तब संपूर्ण जीवन-प्रवाह उसी परम सत्य की ओर मुड़ जाता है।\n\nइस वचन का तात्पर्य यह है कि कूडलचेन्नसंगम के रूप में संबोधित वह निराकार परमतत्त्व जब स्वयं ही शरण के लिए लिंग-स्वरूप हो जाता है, तब साधक की सारी वृत्तियाँ उसी में लीन हो जाती हैं।","mr":"हे वचन शरण अवस्थेतील इंद्रियनिग्रह आणि लिंगसमर्पणाची उच्च आध्यात्मिक पातळी स्पष्ट करते.\n\nशब्द, स्पर्श, रूप, रस आणि गंध हे पंचमहाभूतांचे विषय अनुभवणारी सर्व पंचेंद्रिये बाह्य जगतात न भटकता केवळ लिंगाकडेच म्हणजे निराकार परमतत्त्वाच्या जाणीवेकडेच वळली आहेत, असे येथे सांगितले आहे.\n\nइंद्रियांद्वारे प्राप्त होणारा प्रत्येक आनंद हा स्वतःसाठी न भोगता तो 'लिंगार्पित' आहे या जाणिवेने स्वीकारल्यामुळे, शरणाची सर्व वृत्ती अखंडपणे लिंगाच्याच दिशेने प्रवाहित होते.\n\nकूडलचन्नसंगमदेव हे परम सत्यच शरणासाठी प्रत्यक्ष लिंगरूप झाल्यामुळे, शरणाचे संपूर्ण अस्तित्व आणि जाणीव त्या शुद्ध चैतन्याशी एकरूप झाल्याचे या वचनातून अधोरेखित होते.","fr":"Ce vachana met en lumière la transmutation spirituelle des sens chez le Sharana, où les cinq perceptions sensorielles — le son, le toucher, la forme, le goût et l'odorat — cessent de se disperser vers le monde extérieur pour s'orienter entièrement vers le Linga.\n\nAu lieu de rechercher la jouissance égoïste, chaque expérience et chaque plaisir perçus par les sens sont vécus comme une offrande consacrée au Linga (Lingarpita), réorientant ainsi toutes les facultés humaines vers le divin.\n\nLa portée spirituelle de ce vachana réside dans l'état d'unité intérieure du Sharana : lorsque la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasanga, devient elle-même le Linga pour le chercheur, toute perception sensible se transforme naturellement en communion spirituelle."}},{"no":907,"o":"ಶಾಖೆಯಿಲ್ಲದೆ ಕಪಿ ಪಿಡಿಯದು,\n ಚಿಗುರಿಲ್ಲದೆ ಪಿಕ ನುಡಿಯದು,\n ಪ್ರಭೈಸಿದಲ್ಲದೆ ಉಲಿಯದು ಕುಕ್ಕುಟ.\n ಹೂಮಿಡಿಯ ಹರಿದು ಹಣ್ಣನರಸಲುಂಟೆ?\n ತಮ್ಮ ಮರೆಯದೆ ಲಿಂಗವ ಮೆರೆವರೆಲ್ಲ\n ಅಜ್ಞಾನಿಗಳು ಅನಾಚಾರಿಗಳು ಆಚಾರಭ್ರಷô್ಠರು,\n ಗುರುಲಿಂಗಜಂಗಮ ದ್ರೋಹಿಗಳು.\n ಅಶನವರತು ವ್ಯಸನ ನಿಂತು\n ತನು ಕರಗಿ ಮನವೆರಗಿ\n ನಿಮಗೆ ಮಾಡದ ಅಜ್ಞಾನಿಗಳನೇನೆಂಬೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"Without a branch, the monkey does not grasp;\nwithout a tender shoot, the cuckoo does not sing;\nunless dawn breaks, the rooster does not crow.\nHaving plucked the blossom and tender bud, can one ever seek the fruit?\nAll those who flaunt the *Linga* without forgetting themselves\nare the ignorant, the unprincipled, the fallen from right conduct,\nand traitors to the *Guru*, *Linga*, and *Jangama*.\nWithout hunger subsiding and worldly craving ceasing,\nwithout the body melting and the mind bowing down,\nwhat shall I say of the ignorant who do not serve you,\nO Koodala Chennasangamadeva?","hi":"डाली के बिना वानर नहीं पकड़ता,\nकोंपल के बिना कोयल नहीं बोलती,\nप्रभात हुए बिना मुर्ग़ा बांग नहीं देता।\nफूल और कली को तोड़कर क्या फल खोजा जा सकता है?\nस्वयं को भूले बिना लिंग का दिखावा करनेवाले सभी\nअज्ञानी हैं, अनाचारी हैं, आचारभ्रष्ट हैं,\nगुरुलिंगजंगम के द्रोही हैं।\nभोजन की सुध खोकर, व्यसन रुककर,\nतन पिघलकर, मन झुककर\nआपकी सेवा न करनेवाले अज्ञानियों को क्या कहूँ,\nहे कूडल चेन्नसंगमदेव।","mr":"फांदीशिवाय वानर धरत नाही,\nपालवीशिवाय कोकिळा गात नाही,\nउजाडल्याशिवाय कोंबडा आरवत नाही.\nकळी-कोवळे फळ तोडून पिकलेले फळ शोधता येते का?\nस्वतःला न विसरता लिंगाचाच बडेजाव मिरवणारे सर्वजण\nअज्ञानी आहेत, अनाचारी आहेत, आचारभ्रष्ट आहेत,\nगुरुलिंगजंगम द्रोही आहेत.\nअन्नपाणी सुटून, तळमळ थांबून,\nतनु विरघळून, मन लीन होऊन\nतुमची सेवा न करणाऱ्या अज्ञानी लोकांना मी काय म्हणू,\nहे कूडल चेन्नसंगमदेवा!","fr":"Sans branche, le singe ne saisit rien,\nsans jeunes pousses, le coucou ne chante point,\nsans que l'aube ne resplendisse, le coq ne crie pas.\nAprès avoir arraché la fleur et le jeune fruit, peut-on donc chercher le fruit mûr ?\nTous ceux qui exhibent le Linga sans s'oublier eux-mêmes\nsont des ignorants, des gens sans conduite, des déchus de la juste pratique,\ndes traîtres envers le Guru, le Linga et le Jangama.\nQue dirais-je des ignorants qui ne vous servent pas,\nl'appétit tari, les tourments apaisés,\nle corps fondu et l'esprit fondu en vous,\nÔ Koodala Chennasangamadeva ?"},"m":{"en":"This Vachana illustrates through natural metaphors—such as a monkey needing a branch to leap, a cuckoo waiting for fresh shoots to sing, a rooster crowing only at dawn, and the impossibility of expecting fruit after plucking away the blossom and tender bud—that every genuine outcome depends upon a necessary foundation and natural progression.\n\nIn the same way, those who ostentatiously display the Linga without first shedding their ego and self-importance are condemned as ignorant, devoid of righteous conduct, and betrayers of the Guru, the Linga, and the Jangama (enlightened spiritual seekers and guides).\n\nTrue devotion to the Formless Supreme Reality, addressed here as Kudalachannasangamadeva, cannot exist as a mere external show while the ego remains intact.\n\nThe spiritual significance of this Vachana lies in the realization that authentic worship requires total inner absorption, where worldly cravings and bodily consciousness dissolve and the mind merges completely with the Absolute.","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार बिना डाली के बंदर पकड़ नहीं बना सकता, बिना कोंपलों के कोयल कूक नहीं सकती, बिना सूर्योदय के मुर्गा बांग नहीं देता और फूल या कच्ची कली को तोड़कर पके फल की आशा नहीं की जा सकती, उसी प्रकार हर आध्यात्मिक उपलब्धि के लिए एक स्वाभाविक आधार और परिपक्व प्रक्रिया आवश्यक है।\n\nजो लोग अपने अहंकार और निज-भाव को भुलाए बिना केवल बाहरी आडंबर से लिंग का प्रदर्शन करते हैं, वे अज्ञानी, अनाचारी तथा आचारभ्रष्ट हैं।\n\nऐसे दिखावटी लोग वास्तविकता में गुरु, लिंग और आध्यात्मिक साधकों के रूप में प्रतिष्ठित जंगम के द्रोही हैं।\n\nकूडलचेन्नसंगमदेव के रूप में संबोधित निराकार परमतत्त्व के प्रति समर्पित होते हुए यह वचन संदेश देता है कि बिना आहार-विहार की सुध भूले, बिना सांसारिक व्यसनों के थमे, तथा बिना तन के पिघले और मन के पूर्णतः लीन हुए जो लोग कोरा दिखावा करते हैं, वे परम सत्य से अनभिज्ञ हैं।","mr":"हे वचन निसर्गातील दृष्टांतांद्वारे स्पष्ट करते की, जसे फांदीशिवाय वानर आधार घेऊ शकत नाही, कोवळ्या पालवीशिवाय कोकीळ गात नाही, पहाट झाल्याशिवाय कोंबडा आरवत नाही आणि कळी किंवा कैरी तोडून टाकल्यास पक्व फळाची अपेक्षा करता येत नाही, तसेच आध्यात्मिक साधनेतही स्वतःचा अहंकार विसरल्याशिवाय परमतत्त्वाची खरी अनुभूती मिळू शकत नाही.\n\nजे लोक स्वतःची देहबुद्धी आणि मीपणा न विसरता केवळ बाह्यरूपाने लिंगाचे प्रदर्शन करतात, ते खऱ्या अर्थाने अज्ञानी, आचारहीन तसेच नित्य आध्यात्मिक ज्ञान देणारे गुरू, निराकार परमतत्त्वाचे प्रतीक असलेले इष्टलिंग आणि जंगम म्हणजेच प्रबुद्ध साधक यांचे द्रोही ठरतात.\n\nआहार-विहाराची आसक्ती सुटून, प्रापंचिक तळमळ थांबून, शरीर झिजवून आणि मन पूर्णपणे एकरूप झाल्याशिवाय केलेली भक्ती व्यर्थ आहे, असा कूडलचन्नसंगमदेव या अंकितनामातून व्यक्त होणारा या वचनाचा गहन आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière le lien indissociable entre une cause véritable et son accomplissement spirituel, à travers des images tirées de la nature : le singe ne peut s'agripper sans branche, le coucou ne chante pas sans jeunes pousses, le coq ne crie pas avant l'aube, et nul ne peut espérer récolter un fruit après avoir arraché la fleur et le bourgeon.\n\nDe la même manière, ceux qui prétendent exalter le Linga — le miroir sacré menant à la Réalité suprême sans forme — sans avoir d'abord transcendé leur propre ego versent dans l'illusion.\n\nLe texte qualifie d'ignorants, d'êtres dépourvus de droiture et de traîtres envers le Guru, le Linga et le Jangama ceux qui s'adonnent à une telle démonstration extérieure sans effacement de soi.\n\nL'adoration authentique dédiée au Principe suprême, évoqué sous le nom de Koodala Channasangamadeva, exige une dévotion totale où la faim s'oublie, les tourments s'apaisent, le corps se consume dans l'effort spirituel et l'esprit se fond entièrement dans le Divin."}},{"no":908,"o":"ಶಿವಯೋ[ಗ] ನಿಭ್ರಾಂತ ಶರಣ.\n ಕರ್ಮಕಾಯನಲ್ಲ, ಕಾಯಕಲ್ಪಿತನಲ್ಲ,\n ಸಂಕಲ್ಪ ವಿಕಲ್ಪ ವಿರಹಿತನು.\n ಅವರವರ ಕೂಡಿಕೊಂಡಿಪ್ಪ, ತನ್ನ ಪರಿಬೇರೆ.\n ಶರಣ ನಿರಂತರ ಪರಮಸುಖಿ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ, ನಿಮ್ಮ ಶರಣ ಪ್ರಪಂಚಿನೊಳಗಿಪ್ಪ, ತನ್ನ ಪರಿ ಬೇರೆ.","t":{"en":"Undeluded in *Shivayoga* is the *Sharana*.\nHe is not bound by a body of karma, nor fashioned of bodily form,\nhe is free from resolve and doubt.\nHe abides with each in their company, yet his own way is distinct.\nThe *Sharana* is ever in supreme bliss.\nO Koodala Chennasanga, your *Sharana* abides within the world, yet his own way is distinct.","hi":"शिवयोग से निर्भ्रांत है शरण।\nवह कर्मकाया नहीं है, कायाकल्पित नहीं है,\nसंकल्प-विकल्प से रहित है।\nसबके साथ घुल-मिलकर रहता है, पर उसकी रीति अलग है।\nशरण निरंतर परमसुखी है।\nहे कूडलचेन्नसंग, आपका शरण प्रपंच के भीतर रहता है, पर उसकी रीति अलग है।","mr":"शिवयोगात निभ्रांत असतो शरण.\nतो कर्मकाया नाही, कायकल्पित नाही,\nसंकल्प-विकल्परहित आहे तो.\nतो त्या-त्या लोकांत मिसळून राहतो, तरी त्याची रीत निराळी आहे.\nशरण निरंतर परमसुखी असतो.\nहे कूडलचेन्नसंगा, तुमचा शरण प्रपंचात राहतो, तरी त्याची रीत निराळी आहे.","fr":"Le Sharana demeure affranchi de tout égarement dans le Shivayoga.\nIl n'a point un corps lié au karma, il n'est point façonné par l'idée du corps,\nil est exempt de résolutions et de doutes.\nIl se mêle à chacun, mais sa manière d'être est tout autre.\nLe Sharana demeure sans cesse dans la félicité suprême.\nÔ Koodala Chennasanga, votre Sharana vit dans le monde, mais sa manière d'être est tout autre."},"m":{"en":"This Vachana describes the exalted spiritual state of a Sharana who is firmly established in Shivayoga and entirely free from delusion.\n\nSuch a realized being transcends the limitations of a body bound by karma or shaped by physical conditioning, remaining untouched by the wavering dualities of desire and doubt.\n\nAlthough the Sharana mingles naturally with people and lives right in the midst of the material world, his inner way of being remains completely distinct and unattached.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Kudalachannasanga, the Vachana highlights that a true Sharana abides in perpetual supreme bliss while engaging with the world on a wholly transcendent plane.","hi":"इस वचन का केंद्रीय भाव यह है कि शिवयोग में स्थित सच्चा शरण पूर्णतः भ्रम-रहित होता है और वह न तो कर्म-काया से बँधा होता है और न ही देह की कल्पनाओं से सीमित रहता है।\n\nऐसा शरण मन के संकल्प और विकल्पों से सर्वथा मुक्त होकर निरंतर परम सुख की अवस्था में निवास करता है।\n\nवह बाह्य रूप से संसार में सबके साथ मिलकर रहता हुआ दिखाई देता है, किंतु उसकी आंतरिक स्थिति और जीवन-दृष्टि सबसे नितांत भिन्न होती है।\n\nनिराकार परमतत्त्व कूडलचेन्नसंगम के प्रति समर्पित शरण प्रपंच के भीतर रहते हुए भी अपनी अलग और अलौकिक आध्यात्मिक सत्ता बनाए रखता है।","mr":"हे वचन शिवयोगामध्ये स्थिरावलेल्या आणि सर्व भ्रमांपासून मुक्त झालेल्या जाणीवसंपन्न शरणाच्या अलौकिक जीवनपद्धतीचे आणि अंतःस्थितीचे वर्णन करते.\n\nअसा शरण केवळ बाह्य कर्मकांडात अडकलेला नसतो किंवा देहभावनेने बांधलेला नसतो, तर मनातील संकल्प आणि विकल्प यांच्या पलीकडे जाऊन निरंतर परमसुखात रममाण झालेला असतो.\n\nतो समाजात वावरताना प्रत्येकाशी मिळून-मिसळून राहतो, तरीही त्याचे अंतरंग आणि जगण्याची रीत सामान्य जगापेक्षा पूर्णपणे वेगळी व अलिप्त असते.\n\nकूडलचन्नसंगम या परमतत्त्वाशी एकरूप झालेला शरण प्रत्यक्ष प्रपंचात राहूनही प्रपंचाच्या प्रभावापासून मुक्त आणि स्वतःच्या वेगळ्या आध्यात्मिक अवस्थेत कसा राहतो, याची जाणीव हे वचन करून देते.","fr":"Ce vachana met en lumière la nature transcendante du Sharana établi dans le Shivayoga, qui demeure libre de toute illusion, des entraves de l'action ordinaire et des limitations du corps physique.\n\nAffranchi des fluctuations de l'esprit, telles que le désir et le doute, il réside en permanence dans une béatitude suprême et inaltérable.\n\nBien qu'il vive au milieu des autres et s'associe à chacun avec naturel, sa manière d'être intérieure demeure radicalement distincte de celle du commun des mortels.\n\nS'adressant à la Réalité suprême sans forme à travers la signature spirituelle Koodalachannasanga, le poète souligne que le véritable Sharana habite pleinement le monde tout en conservant une conscience pure et détachée."}},{"no":909,"o":"ಶಿವಲಿಂಗವ ನೋಡುವ ಕಣ್ಣಲ್ಲಿ\n ಪರಸ್ತ್ರೀಯ ನೋಡಿದಡೆ ಅಲ್ಲಿ ಲಿಂಗವಿಲ್ಲ.\n ಪರಬ್ರಹ್ಮವ ನುಡಿವ ಜಿಹ್ವೆಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಅಧರಪಾನವ ಕೊಂಡಡೆ ಪ್ರಸಾದಕ್ಕೆ ದೂರ.\n ಘನಲಿಂಗವ ಪೂಜಿಸುವ ಕೈಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಕುಚವ ಮುಟ್ಟಿದಡೆ, ತಾ ಮಾಡಿದ ಪೂಜೆ ನಿಷ್ಫಲ.\n ಇದನರಿಯದಿರ್ದಡೆ ಬಳ್ಳದಲ್ಲಿ ಸುರೆಯ ತುಂಬಿ\n ಮೇಲೆ ಬೂದಿಯ ಹೂಸಿದಂತಾಯಿತ್ತು ಕಾಣಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"With the eye that beholds the *Shivalinga*,\nif one looks upon another's wife, there is no *Linga* there.\nWith the tongue that speaks of *Parabrahma*,\nif one drinks from the lips of other women, one is far from *Prasada*.\nWith the hand that worships the supreme *Linga*,\nif one touches the breasts of other women, the worship one performs is fruitless.\nIf one does not realize this, it becomes like filling a measure-pot with liquor\nand smearing ash on top of it, you see,\nO Koodala Chennasangamadeva.","hi":"शिवलिंग को देखनेवाली आँख से,\nपरस्त्री को देखने पर वहाँ लिंग नहीं है।\nपरब्रह्म का उच्चारण करनेवाली जिह्वा से,\nपरस्त्रियों का अधरपान करने पर वह प्रसाद से दूर है।\nघनलिंग की पूजा करनेवाले हाथ से,\nपरस्त्रियों के कुच को छूने पर, उसकी की हुई पूजा निष्फल है।\nइसे न जानने पर यह पात्र में सुरा भरकर,\nऊपर भस्म पोतने के समान हुआ देखो,\nहे कूडल चेन्नसंगमदेव।","mr":"शिवलिंगाचे दर्शन घेणाऱ्या डोळ्यांनी\nपरस्त्रीकडे पाहिल्यास तिथे लिंग उरत नाही.\nपरब्रह्माचा उच्चार करणाऱ्या जिभेने,\nपरस्त्रियांचे अधरपान केल्यास ती प्रसादापासून दूर होते.\nघनलिंगाची पूजा करणाऱ्या हातांनी,\nपरस्त्रियांच्या स्तनांना स्पर्श केल्यास, त्याने केलेली पूजा निष्फळ ठरते.\nहे न जाणल्यास, मापात मद्य भरून\nवरून राख फासल्यासारखे झाले पाहा,\nहे कूडल चेन्नसंगमदेवा.","fr":"Dans l'œil qui contemple le *Shivalinga*,\ndès qu'il regarde la femme d'autrui, le *Linga* n'y est plus.\nSur la langue qui énonce le *Parabrahma*,\ndès qu'elle goûte au nectar des lèvres des femmes d'autrui, elle s'éloigne du *Prasada*.\nDans la main qui vénère le sublime *Linga*,\ndès qu'elle touche le sein des femmes d'autrui, l'adoration qu'elle accomplit devient stérile.\nSi l'on ignore cela, c'est comme remplir d'alcool un boisseau\net l'enduire de cendre sacrée par-dessus, vois-tu,\nÔ Koodala Chennasangamadeva."},"m":{"en":"The central message of this Vachana is that true spiritual practice requires complete purity of the senses and absolute alignment between inner conduct and outward devotion.\n\nWhen the eyes that gaze upon the Ishtalinga—the sacred medium directing the mind toward the Formless Divine—look with lust at another's spouse, the divine presence vanishes from that vision.\n\nSimilarly, if the tongue that speaks of the Supreme Reality indulges in illicit sensuality, it becomes unworthy of sacred Prasada, and if the hands that worship the supreme Linga engage in impure touch, all their worship is rendered utterly fruitless.\n\nThrough the vivid metaphor of filling a vessel with liquor while smearing sacred ash on the outside, the Vachana exposes the hypocrisy of masking internal moral corruption with external religious symbols before the Supreme Reality, Kudalachannasangamadeva.","hi":"इस वचन का केंद्रीय संदेश यह है कि आध्यात्मिक साधना के लिए इंद्रियों का संयम और नैतिक पवित्रता अत्यंत आवश्यक है।\n\nयह वचन स्पष्ट करता है कि निराकार परमतत्त्व के प्रतीक इष्टलिंग का दर्शन करने वाली आँखों से यदि पराई स्त्री को बुरी दृष्टि से देखा जाए, तो वहाँ लिंग-तत्त्व का वास नहीं रहता।\n\nइसी प्रकार, परब्रह्म का उच्चारण करने वाली जिह्वा और घनलिंग की पूजा करने वाले हाथों से यदि परस्त्री के साथ अनैतिक आचरण किया जाए, तो साधक सच्चे प्रसाद से वंचित हो जाता है और उसकी सारी पूजा निष्फल हो जाती है।\n\nकूडल चन्नसंगमदेव को संबोधित करते हुए इस वचन में यह आध्यात्मिक अर्थ प्रकट हुआ है कि इस सत्य को समझे बिना केवल बाहरी आडंबर करना, मदिरा से भरे पात्र के ऊपर भस्म पोतने जैसा पाखंड मात्र है।","mr":"हे वचन आध्यात्मिक साधना आणि चारित्र्याची शुद्धता यांमधील अतूट संबंध स्पष्ट करते.\n\nज्या डोळ्यांनी निराकार परमतत्त्वाचे प्रतीक असलेल्या लिंगाचे दर्शन घ्यायचे, ज्या जिभेने परब्रह्माचा उच्चार करायचा आणि ज्या हातांनी त्याचे पूजन करायचे, त्याच इंद्रियांनी परस्त्रीची अभिलाषा धरली किंवा तिच्याशी अनैतिक संग केला, तर तेथे कोणतेही आध्यात्मिक तत्त्व उरत नाही.\n\nअशा अपवित्र आचरणाने केलेली पूजा आणि साधना पूर्णपणे निष्फळ ठरते आणि ती व्यक्ती खऱ्या प्रसादापासून दूर जाते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला उद्देशून वचनकार सांगतात की, या सत्याची जाणीव न ठेवता केलेली बाह्य भक्ती म्हणजे आत मद्य भरलेल्या मापावर बाहेरून केवळ भस्म फासण्यासारखा निव्वळ दांभिकपणा आहे.","fr":"Ce vachana met en lumière l'exigence d'une pureté absolue des sens et de la conduite chez celui qui s'engage sur la voie spirituelle centrée sur l'Ishtalinga, le support sacré de la Réalité suprême sans forme.\n\nIl explique que les yeux qui contemplent le Shivalinga, la langue qui prononce la vérité du Principe suprême et les mains qui vénèrent le Ghanalinga perdent toute leur sacralité s'ils s'abandonnent au désir charnel envers la femme d'autrui.\n\nUne telle contradiction entre la pratique extérieure et l'impureté des actes éloigne le pratiquant de la grâce véritable du Prasada et rend son culte totalement vain.\n\nÀ travers la signature spirituelle Koodalachannasangamadeva, le texte compare cette hypocrisie spirituelle à un récipient rempli d'alcool que l'on aurait simplement recouvert de cendre sacrée pour en masquer le contenu."}},{"no":910,"o":"ಶೀಲವಂತರು ಲಕ್ಕ ಲಕ್ಕ, ನೇಮಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ವ್ರತಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ಅರ್ಥ ಪ್ರಾಣ ಅಭಿಮಾನವನೊಪ್ಪಿಸಿದ ವೈರಾಗಿಗಳು ಲಕ್ಕ ಲಕ್ಕ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯನಲ್ಲಿ ಇವರೆಲ್ಲಾ ಫಲ ಸದರ್ಥರಲ್ಲದೆ\n ಲಿಂಗ ಸದರ್ಥರಾರೂ ಇಲ್ಲ.","t":{"en":"Keepers of conduct are in hundreds of thousands, keepers of rules are in hundreds of thousands,\nkeepers of vows are in hundreds of thousands,\nrenunciates who have surrendered wealth, life, and pride are in hundreds of thousands.\nBefore Koodala Chennasangayya, all these are seekers of reward;\nnone among them is a true seeker of the *Linga*.","hi":"शीलवंत हैं लाखों-लाख, नियमनिष्ठ हैं लाखों-लाख,\nव्रतनिष्ठ हैं लाखों-लाख,\nअर्थ, प्राण और अभिमान को अर्पित करनेवाले वैरागी हैं लाखों-लाख।\nकूडल चेन्नसंगय्या के आगे ये सभी फल-सदर्थ ही हैं,\nलिंग-सदर्थ कोई भी नहीं है।","mr":"शीलवंत लाखो-लाखो आहेत, नियमनिष्ठ लाखो-लाखो आहेत,\nव्रतस्थ लाखो-लाखो आहेत,\nअर्थ, प्राण आणि अभिमान अर्पण केलेले वैरागी लाखो-लाखो आहेत.\nकूडल चेन्नसंगय्यासमोर हे सर्व फळार्थी आहेत,\nलिंगार्थी कोणीही नाही.","fr":"Ceux qui observent la pureté de conduite se comptent par centaines de milliers, ceux qui suivent les règles prescrites se comptent par centaines de milliers,\nceux qui accomplissent les vœux se comptent par centaines de milliers,\nles renonçants qui ont offert leurs biens, leur vie et leur orgueil se comptent par centaines de milliers.\nAuprès de Koodala Chennasangayya, tous ceux-là n'ont pour but que la récompense,\net il n'en est aucun qui ait le Linga pour seul but."},"m":{"en":"This Vachana draws a sharp distinction between spiritual practices motivated by the desire for rewards and pure devotion directed solely towards the Supreme Reality.\n\nIt observes that while there are hundreds of thousands who strictly observe moral codes, religious rules, and vows, or even renounce their wealth, life, and pride as ascetics, such outward sacrifices alone do not signify the highest spiritual realization.\n\nIn the awareness of Kudalachannasanga, the Formless Supreme Consciousness, all these practitioners remain bound by an attachment to the fruits of their actions rather than being genuinely centred on Linga.\n\nThe spiritual significance of this Vachana lies in its insistence that true realization requires transcending result-oriented austerity and dedicating oneself purely to the Absolute without any expectation of return.","hi":"इस वचन का मूल भाव यह है कि आध्यात्मिक मार्ग में बाहरी सदाचार, नियम-पालन और कठोर व्रत का अभ्यास करने वाले साधक लाखों की संख्या में मिल जाते हैं।\n\nयहाँ तक कि अपना धन, प्राण और स्वाभिमान समर्पित करने वाले वैरागी भी इस संसार में अनगिनत हैं।\n\nकिंतु यह वचन स्पष्ट करता है कि ऐसे अधिकांश लोग किसी न किसी प्रतिफल, स्वार्थ या फल की आकांक्षा से ही ये साधनाएँ करते हैं।\n\nनिराकार परमतत्त्व कूडलचन्नसंगम में बिना किसी फल की कामना के, केवल विशुद्ध लिंग-तत्त्व के साक्षात्कार और एकत्व के लिए समर्पित होने वाले सच्चे साधक अत्यंत दुर्लभ हैं।","mr":"हे वचन बाह्य आचरण, व्रत-नियम आणि फळाची अपेक्षा ठेवून केलेल्या त्यागापेक्षा निष्काम लिंगनिष्ठेचे आध्यात्मिक महत्त्व स्पष्ट करते.\n\nजगात सदाचारी, कडक नियम पाळणारे, व्रतस्थ आणि स्वतःची संपत्ती, प्राण व अभिमान अर्पण करणारे वैरागी लाखोच्या संख्येने आढळतात.\n\nपरंतु कूडलचन्नसंगम या परमतत्त्वाच्या ठाई हे सर्व लोक केवळ विशिष्ट फळाची किंवा पुण्याची अपेक्षा बाळगणारे साधक ठरतात.\n\nकोणत्याही फळाची कामना न ठेवता केवळ शुद्ध चैतन्यस्वरूप लिंगाच्याच प्राप्तीसाठी समर्पित असलेले खरे साधक अत्यंत दुर्मिळ असतात, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana établit une distinction essentielle entre l'observance spirituelle motivée par l'attente d'une récompense et la quête désintéressée de la Vérité absolue.\n\nIl souligne que l'on trouve par centaines de milliers des personnes vertueuses, des pratiquants assidus aux règles et aux vœux, ainsi que des renonçants prêts à offrir leurs biens, leur vie et leur amour-propre.\n\nCependant, face à Koodalachannasanga, la Réalité suprême sans forme, tous ces chercheurs restent attachés aux fruits de leurs actes méritoires plutôt qu'à l'essence même du divin.\n\nLa portée spirituelle de ce vachana réside dans l'idée que la véritable réalisation ne consiste pas à accumuler des austérités dans l'espoir d'un gain futur, mais à s'orienter exclusivement vers le Linga comme seule finalité ultime."}},{"no":911,"o":"ಶೀಲವಂತರು ಶೀಲವಂತರೆಂದೆಂಬರು ನಾವಿದನರಿಯೆವಯ್ಯ.\n ಅಂಗನೆಯರ ಅಧರಪಾನವು\n ತನ್ನ ಉದರವ ಹೊಗುವನ್ನಕ್ಕ ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಈಷಣತ್ರಯವೆಂಬ ಸೊಣಗ ಬೆಂಬತ್ತಿ ಬರುತ್ತಿರಲು ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಹೆರಸಾರಿ ಮನವು ಮಹದಲ್ಲಿ ನಿಂದರೆ ಶೀಲ,\n ಪರಿಣಾಮ ನೆಲೆಗೊಂಡರೆ ಶೀಲ.\n ಇದು ಕಾರಣ ಕೂಡಲ ಚೆನ್ನಸಂಗನಲ್ಲಿ ಶೀಲವಂತರಪೂರ್ವ.","t":{"en":"They speak of the virtuous, the virtuous—we do not know of this, O Lord.\nSo long as the nectar of women's lips\nenters one's belly, where is there virtue?\nWhen the dog called the three worldly cravings comes hounding at one's heels, where is there virtue?\nWhen the mind steps aside from the world and abides in the Supreme, that is virtue;\nwhen inner serenity becomes firmly established, that is virtue.\nTherefore, before Koodala Chennasanga, the truly virtuous are rare indeed.","hi":"शीलवंत हैं, शीलवंत हैं, ऐसा कहते हैं; हम यह नहीं जानते, हे स्वामी।\nअंगनाओं का अधर-पान\nजब तक अपने उदर में प्रवेश करता रहे, तब तक शील कहाँ का?\nएषणात्रय कहनेवाला श्वान जब पीछे लगा आ रहा हो, तो शील कहाँ का?\nपीछे हटकर मन जब महान में स्थिर हो जाए, तभी शील है,\nपरिणाम जब टिक जाए, तभी शील है।\nइसी कारण, कूडलचेन्नसंग में शीलवंत अपूर्व हैं।","mr":"शीलवंत, शीलवंत असे लोक म्हणतात, हे आम्ही जाणत नाही, हे प्रभो.\nजोपर्यंत स्त्रियांचे अधरपान\nआपल्या उदरात जात आहे, तोपर्यंत शील कुठले?\nईषणात्रय नावाचे कुत्रे पाठीशी लागून येत असताना शील कुठले?\nमागे फिरून मन महातच स्थिरावले तर ते शील,\nप्रसन्नता स्थिरावली तर ते शील.\nया कारणास्तव, कूडल चेन्नसंगाच्या ठायी शीलवंत दुर्मीळ आहेत.","fr":"On les appelle hommes de pure observance, hommes de pure observance — nous ne comprenons pas cela, Ô Seigneur.\nTant que le nectar des lèvres des femmes\nentre dans son propre ventre, d'où viendrait la pure observance ?\nQuand le chien de ce que l'on appelle la triple convoitise le poursuit sans relâche, d'où viendrait la pure observance ?\nSi l'esprit, se retirant du monde, demeure dans l'Infini, voilà la pure observance ;\nsi la plénitude intérieure s'établit fermement, voilà la pure observance.\nC'est pourquoi, auprès de Koodala Chennasanga, rares sont ceux de pure observance."},"m":{"en":"This Vachana examines the true meaning of *Sheela*—spiritual integrity and purity of conduct—by questioning superficial claims of virtue.\n\nIt points out that genuine purity cannot exist as long as a person indulges in sensual desires or remains hounded by the three worldly cravings for wealth, progeny, and attachments, which are vividly compared to a relentless hound.\n\nTrue *Sheela* arises only when the mind steps back from these outer compulsions, rests steadily in the Supreme Reality, and achieves deep inner transformation and fulfilment.\n\nAddressing the Formless Divine as Kudalachannasanga, the Vachana concludes that because such inward mastery and spiritual serenity are so demanding, those who truly embody this authentic purity are exceedingly rare.","hi":"यह वचन स्पष्ट करता है कि जो लोग केवल बाहरी आडंबर से स्वयं को शीलवान कहते हैं, उनके इस दावे में कोई वास्तविक सत्य नहीं है।\n\nजब तक व्यक्ति स्त्री-वासना में लिप्त रहता है तथा पुत्र, धन और पत्नी की तीन सांसारिक तृष्णाओं (एषणात्रय) रूपी कुत्ते उसके पीछे पड़े रहते हैं, तब तक उसमें सच्चे शील का होना असंभव है।\n\nइस वचन का केंद्रीय संदेश यह है कि सांसारिक वासनाओं से पीछे हटकर जब मन महान परमतत्त्व में स्थिर हो जाता है और चित्त में गहन आध्यात्मिक शांति एवं तृप्ति स्थापित हो जाती है, तभी उसे सच्चा शील कहा जाता है।\n\nयही कारण है कि निराकार परमतत्त्व कूडलचन्नसंगम में ऐसे सच्चे शीलवान साधक अत्यंत दुर्लभ और अपूर्व होते हैं।","mr":"हे वचन वरवरच्या शीलपालनाचा दावा करणाऱ्या ढोंगी वृत्तीवर भाष्य करून खऱ्या शीलाचे स्वरूप स्पष्ट करते.\n\nजोवर माणूस कामवासनेच्या आहारी जाऊन स्त्रीसुखात गुंतलेला आहे आणि पुत्रैषणा, वित्तैषणा व लोकैषणा या तीन तीव्र इच्छारूपी कुत्र्यांचा पाठलाग त्याच्या मागे सुरू आहे, तोवर त्याच्याकडे खरे शील असूच शकत नाही.\n\nजेव्हा मन या सर्व बाह्य मोहातून मागे फिरून परमतत्त्वाच्या महानतेत स्थिर होते आणि अंतःकरणात आध्यात्मिक तृप्ती व पूर्णत्व नांदू लागते, तेव्हाच खरे शील प्रगट होते.\n\nम्हणूनच, कूडलचन्नसंगम या परमतत्त्वाच्या ठायी अशा प्रकारे मन पूर्णपणे एकरूप झालेले खरे शीलवंत अत्यंत दुर्मिळ असतात, हे या वचनातून अधोरेखित होते.","fr":"Ce vachana remet en question ceux qui se proclament vertueux en démontrant que la véritable pureté morale et spirituelle ne se résume pas à des apparences extérieures.\n\nTant que l'être humain demeure esclave des plaisirs charnels et qu'il est sans cesse poursuivi, tel un chien affamé, par la triple soif de la richesse, de la terre et de la chair, il ne saurait prétendre à aucune vertu authentique.\n\nLa vraie discipline spirituelle ne s'accomplit que lorsque l'esprit se détourne de ces convoitises mondaines pour s'ancrer fermement dans l'Infini et atteindre un état de plénitude intérieure immuable.\n\nC'est pourquoi, au regard de la Réalité suprême sans forme invoquée sous le nom de Koodalachannasangama, les êtres véritablement vertueux demeurent extrêmement rares."}},{"no":912,"o":"ಶೀಲವಂತರೆಲ್ಲಾ ಶೀಲವಂತರಯ್ಯಾ,\n ಭಾಷೆವಂತರೆಲ್ಲಾ ಭಾಷೆವಂತರಯ್ಯಾ,\n ವ್ರತವಂತರೆಲ್ಲಾ ವ್ರತವಂತರಯ್ಯಾ,\n ಸತ್ಯವಂತರೆಲ್ಲಾ ಸತ್ಯವಂತರಯ್ಯಾ,\n ನೇಮವಂತರೆಲ್ಲಾ ನೇಮವಂತರಯ್ಯಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಯ್ಯಾ\n ಸಂಗನಬಸವಣ್ಣನೊಬ್ಬನೆ ಲಿಂಗವಂತ.","t":{"en":"All who keep disciplines of purity are men of purity, O Lord,\nall who keep their solemn word are men of their word, O Lord,\nall who keep sacred vows are men of vows, O Lord,\nall who keep truth are men of truth, O Lord,\nall who keep strict observances are men of observance, O Lord,\nO Lord Koodala Chennasangamadeva,\nSanganabasavanna alone is the one united with *Linga*.","hi":"सभी शीलवंत शीलवंत हैं, हे स्वामी,\nसभी वचनवंत वचनवंत हैं, हे स्वामी,\nसभी व्रतवंत व्रतवंत हैं, हे स्वामी,\nसभी सत्यवंत सत्यवंत हैं, हे स्वामी,\nसभी नेमवंत नेमवंत हैं, हे स्वामी,\nहे कूडल चेन्नसंगमदेव,\nसंगनबसवराणा ही एकमात्र लिंगवंत हैं।","mr":"शीलवंत सर्व शीलवंतच आहेत, हे प्रभो,\nवचनवंत सर्व वचनवंतच आहेत, हे प्रभो,\nव्रतवंत सर्व व्रतवंतच आहेत, हे प्रभो,\nसत्यवंत सर्व सत्यवंतच आहेत, हे प्रभो,\nनेमवंत सर्व नेमवंतच आहेत, हे प्रभो,\nहे कूडल चेन्नसंगमदेवा,\nकेवळ संगनबसवण्णाच एकमेव लिंगवंत आहेत।","fr":"Tous les gens de pure conduite sont des gens de pure conduite, ô Seigneur,\nTous les gens de parole donnée sont des gens de parole donnée, ô Seigneur,\nTous les gens de vœux sont des gens de vœux, ô Seigneur,\nTous les gens de vérité sont des gens de vérité, ô Seigneur,\nTous les gens d'observance sont des gens d'observance, ô Seigneur,\nÔ Seigneur Koodala Chennasangamadeva,\nSanganabasavanna seul est Lingavanta."},"m":{"en":"This Vachana explains that many seekers may excel in specific virtues and disciplines such as moral conduct (Sheela), adherence to vows (Vrata), truthfulness (Satya), keeping one's word (Bhashe), or strict observance of rules (Nema).\n\nWhile these individuals remain defined by and confined to the particular austerity or ethical principle they practice, they do not necessarily embody the totality of the spiritual path.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalachannasanganadeva, the Vachana highlights that Sanganabasavanna alone stands out as a true Lingavanta.\n\nThe spiritual significance of this distinction is that while others master isolated virtues, Sanganabasavanna transcends rigid, fragmented observances by integrating all ethical and spiritual values into a complete, living union with the Divine (Linga).","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक साधना के व्यक्तिगत सद्गुणों और पूर्ण लिंग-चेतना के बीच एक गहरा अंतर होता है।\n\nयहाँ स्पष्ट किया गया है कि जो साधक शील, अपने वचन या प्रतिज्ञा, व्रत, सत्य अथवा विशेष नियमों का निष्ठापूर्वक पालन करते हैं, वे मुख्य रूप से अपने-अपने विशिष्ट गुणों या साधनाओं तक ही सीमित रहते हैं।\n\nअंतिम पंक्तियों में निराकार परमतत्त्व कूडल चन्नसंगमदेव को साक्षी मानकर यह रेखांकित किया गया है कि इन सभी अलग-अलग साधनाओं से ऊपर उठकर, केवल संगनबसवण्ण ही एकमात्र ऐसे सच्चे 'लिंगवंत' हैं जो स्वयं लिंगतत्त्व के साथ पूर्णतः एकरूप हो चुके हैं।\n\nइस वचन का आध्यात्मिक महत्त्व यह दर्शाने में है कि बाह्य नियमों और खंडित व्रतों के पालन से कहीं श्रेष्ठ स्थिति संगनबसवण्ण की भाँति समग्र लिंग-चेतना को अपने जीवन में आत्मसात करना है।","mr":"हे वचन विविध बाह्य आचार आणि खरा लिंगानुभव यांतील सूक्ष्म भेद स्पष्ट करते.\n\nजे लोक शील, वचनबद्धता, व्रत, सत्य किंवा नियमांचे पालन करतात, ते केवळ आपापल्या विशिष्ट नेमणुकीपुरतेच मर्यादित राहतात.\n\nअशा एखाद्या एकांगी गुणवैशिष्ट्यात अडकून राहणे म्हणजे पूर्ण आध्यात्मिक स्थिती नव्हे, तर ती केवळ त्या त्या आचरणाची ओळख ठरते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला स्मरून हे वचन अधोरेखित करते की, या सर्व बाह्य नियमांच्या पलीकडे जाऊन अखंड लिंगभावात एकरूप झालेले संगनबसवण्ण हेच एकमेव खरे 'लिंगवंत' आहेत.","fr":"Ce vachana établit une distinction essentielle entre l'observance de disciplines morales particulières et la plénitude de la réalisation spirituelle.\n\nCeux qui se consacrent à une seule vertu — qu'il s'agisse de la rectitude morale, de la fidélité à la parole donnée, de l'accomplissement des vœux, de la vérité ou des règles de conduite — demeurent définis et limités par cette pratique spécifique.\n\nAdressé à la Réalité suprême sans forme sous le nom de Koodala Channasangamadeva, le texte souligne que Sanganabasavanna est l'unique véritable Lingavanta, car il transcende ces observances partielles pour incarner dans sa totalité la conscience vivante du Linga."}},{"no":913,"o":"ಶೀಲ ಶೀಲವೆಂದು ಗರ್ವಿಸಿ ನುಡಿವುತಿಪ್ಪರು, ಶೀಲವಾವುದೆಂದರಿಯರು.\n ಇದ್ದುದ ವಂಚನೆಯ ಮಾಡದಿಪ್ಪುದೆ ಶೀಲ,\n ಇಲ್ಲದಿದ್ದುದಕ್ಕೆ ಕಡನ ಬೇಡದಿಪ್ಪ್ಪುದೆ ಶೀಲ,\n ಪರಧನ ಪರಸತಿಗೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಪರದೈವ ಪರಸಮಯಕ್ಕೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಗುರುನಿಂದೆ ಶಿವನಿಂದೆ ಜಂಗಮನಿಂದೆಯ ಕೇಳದಿಪ್ಪುದೆ ಶೀಲ,\n ಕೂಡಲಚೆನ್ನಸಂಗನ ಶರಣರ ಬರವಿಂಗೆ\n ಮುಯ್ಯಾಂತು ಪರಿಣಾಮಿಸ ಬಲ್ಲರೆ ಅಚ್ಚಶೀಲ.","t":{"en":"They boastfully speak of moral conduct, saying, \"Moral conduct, moral conduct,\" yet they do not know what moral conduct is.\nNot withholding through deceit what one possesses is moral conduct,\nNot begging for a loan for what one does not possess is moral conduct,\nNot coveting another's wealth or another's wife is moral conduct,\nNot yearning for other deities or other creeds is moral conduct,\nNot listening to the slander of the Guru, the slander of Shiva, or the slander of the *Jangama* is moral conduct,\nAt the arrival of the *Sharanas* of Koodalachennasanga,\nIf one can step forward to welcome them and rejoice, that is pure moral conduct.","hi":"शील, शील कहकर गर्व से बोलते रहते हैं, शील क्या है यह नहीं जानते।\nजो है, उसे न छिपाना ही शील है,\nजो नहीं है, उसके लिए ऋण न माँगना ही शील है,\nपरधन और परस्त्री की कामना न करना ही शील है,\nपरदैव और परमत की कामना न करना ही शील है,\nगुरु-निंदा, शिव-निंदा और जंगम-निंदा को न सुनना ही शील है,\nकूडलचेन्नसंग के शरणों के आगमन पर,\nसम्मुख होकर तृप्त हो सकें, तो वही खरा शील है।","mr":"शील, शील म्हणून गर्वाने बोलत राहतात, पण शील कोणते हे ते जाणत नाहीत.\nअसलेल्याची वंचना न करणे हेच शील,\nनसलेल्यासाठी कर्ज न मागणे हेच शील,\nपरधनाची व परस्त्रीची अभिलाषा न बाळगणे हेच शील,\nपरदैवताची व परमताची ओढ न धरणे हेच शील,\nगुरुनिंदा, शिवनिंदा आणि जंगमनिंदा न ऐकणे हेच शील,\nकूडलचेन्नसंगाच्या शरणांच्या आगमनास\nसामोरं जाऊन प्रफुल्लित होता आले, तर तेच निखळ शील.","fr":"En parlant avec orgueil de la pure conduite, toujours de la pure conduite, ils ignorent ce qu'est la pure conduite.\nNe pas dissimuler par tromperie ce que l'on possède, voilà la pure conduite ;\nNe pas demander d'emprunt pour ce que l'on ne possède pas, voilà la pure conduite ;\nNe pas convoiter le bien d'autrui ni l'épouse d'autrui, voilà la pure conduite ;\nNe pas aspirer aux divinités étrangères ni aux doctrines étrangères, voilà la pure conduite ;\nNe pas écouter le dénigrement du Guru, le dénigrement de Shiva ni le dénigrement du Jangama, voilà la pure conduite ;\nÀ la venue des Sharanas de Koodalachannasanga,\nsavoir se donner de tout son être et s'épanouir dans la joie sereine, voilà la pure conduite véritable."},"m":{"en":"This Vachana critiques those who boast about possessing spiritual discipline and moral integrity (Sheela) without truly understanding what it means in practice.\n\nIt defines genuine virtue not as rigid ritualism, but as ethical living: sharing what one has without deceit, refraining from borrowing when one lacks means, and remaining completely free from coveting another's wealth or spouse.\n\nIn the spiritual realm, true integrity requires unwavering fidelity to the Formless Supreme Reality without straying toward other deities or sects, and refusing to listen to the slander of the Guru, the Divine, or the Jangama—the enlightened spiritual seekers.\n\nUltimately, addressing the Supreme Reality as Kudalachannasanga, the Vachana concludes that the purest form of virtue lies in welcoming the arrival of the Sharanas with wholehearted devotion and experiencing deep inner joy in their presence.","hi":"इस वचन का केंद्रीय भाव यह है कि लोग अपने सदाचार या 'शील' के नाम पर व्यर्थ ही अहंकार करते हैं, किंतु वे वास्तविक शील का अर्थ नहीं जानते।\n\nयहाँ स्पष्ट किया गया है कि अपने पास उपलब्ध वस्तु या संसाधन को न छिपाना, और जो अपने पास नहीं है उसके लिए किसी से ऋण न माँगना ही सच्चा शील है।\n\nइसके साथ ही पराये धन और परायी स्त्री की कामना न करना, अन्य देवताओं व मत-पंथों के प्रति आकर्षित न होना, तथा गुरु, शिव और आध्यात्मिक साधकों (जंगम) की निंदा न सुनना ही वास्तविक सदाचार के लक्षण हैं।\n\nअंत में यह वचन इंगित करता है कि परमतत्त्व कूडलचेन्नसंग के शरणों के आगमन पर पूरी निष्ठा से उनकी सेवा करना और मन में परम संतोष व आनंद का अनुभव करना ही सबसे विशुद्ध शील (अच्चशील) है।","mr":"अनेक जण आपल्याकडे 'शील' म्हणजेच नैतिक आचार असल्याचा व्यर्थ अभिमान बाळगतात, परंतु खऱ्या अर्थाने शील म्हणजे काय, याचे नेमके भान त्यांना नसते, असे हे वचन स्पष्ट करते.\n\nआपल्याकडे जे आहे त्यात कपट किंवा फसवणूक न करणे, जे नाही त्यासाठी कर्ज न काढणे, तसेच परक्याचे धन आणि परस्त्रीची अभिलाषा न बाळगणे या नैतिक निष्ठाच खरे शील ठरतात.\n\nअन्य दैवते किंवा परमतांकडे मन वळू न देणे आणि गुरू, परमतत्त्व व प्रबोधन करणाऱ्या ज्ञानी साधकरूपी जंगमांची निंदा न ऐकणे, ही आध्यात्मिक एकनिष्ठा येथे शीलाचाच भाग मानली आहे.\n\nया सर्वांसोबतच, कूडलचन्नसंगम या निराकार परमतत्त्वाशी एकरूप झालेल्या शरणांच्या आगमनाने ज्याचे अंतःकरण कृतज्ञतेने आणि विशुद्ध आनंदाने तृप्त होते, त्याचेच आचरण खऱ्या अर्थाने निर्मळ व अस्सल शील होय.","fr":"Ce vachana met en lumière la nature véritable de la vertu morale et spirituelle (Shila), en dénonçant l’orgueil de ceux qui s’en vantent sans en saisir l’essence.\n\nLa véritable droiture consiste à partager honnêtement ce que l’on possède sans tromperie, à ne pas s’endetter pour ce que l’on n’a pas, et à ne jamais convoiter le bien ou le conjoint d’autrui.\n\nSur le plan spirituel, cette intégrité exige de ne pas se tourner vers d’autres divinités ou doctrines, et de refuser d’écouter toute médisance envers le Guru, le Principe divin ou le Jangama, c’est-à-dire les êtres réalisés et la communauté spirituelle vivante.\n\nEnfin, la pureté de conduite absolue se réalise dans l’accueil dévoué et la joie profonde éprouvée à la venue des Sharanas unis à la Réalité suprême sans forme, invoquée ici sous le nom de Koodalachannasanga."}},{"no":914,"o":"ಶೀಲಶೀಲವೆಂಬರು ಶೀಲ ಭಕ್ತಿಯೊಳಗಿಲ್ಲ.\n ಅದೇನು ಕಾರಣವೆಂದರೆಃ\n ಧಾನ್ಯ ಧರಣಿಯೆಂಜಲು,\n ಅಗ್ಘಣಿ ಮೇಘದೆಂಜಲು,\n ಪರಿಮಳ ವಾಯುವಿನೆಂಜಲು,\n ಪಾಕ ಅಗ್ನಿಯೆಂಜಲು.\n ಕೈಯ್ಯೊಳಗೆ ಸೊಡರ ಪಿಡಿದು\n ಕಣ್ಣುಕಾಣದೆ ಎಡಹಿ ಬೀಳುವ ಕುಟಿಲಶೀಲರ ಮೆಚ್ಚುವನೆ?\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ.","t":{"en":"They speak of ritual purity and strict observance, yet such observance has no place within devotion.\nIf you ask the reason why:\nGrain is the defiled leavings of the earth,\nconsecrated water is the defiled leavings of the clouds,\nfragrance is the defiled leavings of the wind,\ncooked food is the defiled leavings of fire.\nHolding a lamp in their hand,\nwill he be pleased with those of crooked observance who, unable to see, stumble and fall?\nKoodala Chennasangamadeva.","hi":"शील-शील कहते हैं, शील भक्ति में नहीं है।\nवह किस कारण से है, कहें तो:\nधान्य धरती की जूठन है,\nअर्घ्य-जल मेघ की जूठन है,\nसुगंध वायु की जूठन है,\nपाक अग्नि की जूठन है।\nहाथ में दीपक पकड़कर,\nआँखों से देखे बिना ठोकर खाकर गिरनेवाले कुटिल-शीलों को क्या पसंद करेंगे,\nकूडल चेन्नसंगमदेव?","mr":"शील, शील असे म्हणतात, पण भक्तीमध्ये शील नाही.\nत्याचे कारण काय म्हटले तर:\nधान्य हे धरणीचे उष्टे,\nअर्घ्यजळ हे मेघांचे उष्टे,\nपरिमळ हे वायूचे उष्टे,\nअन्नपाक हे अग्नीचे उष्टे.\nहातात दिवा धरूनही\nडोळ्यांना न दिसल्याने ठेचकाळून पडणाऱ्या कुटिलशील लोकांना तो पसंती देईल का?\nकूडल चेन्नसंगमदेव.","fr":"Ils disent : « la pureté des observances, la pureté des observances ! » ; mais cette observance n'a pas sa place dans la *Bhakti*.\nQuelle en est la raison ? C'est que :\nle grain est le reste impur de la terre,\nl'eau consacrée est le reste impur du nuage,\nle parfum est le reste impur du vent,\nle mets cuit est le reste impur du feu.\nTenant une lampe à la main,\nsans rien voir de leurs yeux, ils trébuchent et tombent : approuvera-t-il ces hypocrites aux observances tortueuses,\nKoodala Chennasangamadeva ?"},"m":{"en":"This Vachana critiques the superficial obsession with ritual purity and outward vows (Sheela), asserting that true devotion does not lie in rigid notions of physical untaintedness.\n\nIt dismantling the illusion of absolute material purity by pointing out that every offering is inherently touched by the elements of nature—grain is born from the earth, water falls from the clouds, fragrance is carried by the wind, and food is cooked by fire.\n\nThose who practise hypocritical and deceitful vows of purity while failing to recognize this fundamental truth are compared to blind people who stumble and fall despite holding a lit lamp in their own hands.\n\nAddressing the Supreme Reality as Kudalachannasangamadeva, the Vachana concludes that the Formless Divine never approves of such pretentious and misguided observance of rules that lack inner awareness.","hi":"यह वचन बाह्य शुद्धता, छुआछूत और झूठे सदाचार (शील) के आडंबर पर प्रहार करते हुए यह स्पष्ट करता है कि सच्ची भक्ति में ऐसे कृत्रिम नियमों का कोई स्थान नहीं है।\n\nवचन में यह तर्क दिया गया है कि प्रकृति की हर वस्तु किसी न किसी तत्व से जुड़ी या स्पर्श की हुई है—जैसे अनाज पृथ्वी का, पवित्र जल बादलों का, सुगंध वायु की और पका हुआ भोजन अग्नि का उच्छिष्ट (जूठन) है, इसलिए बाहरी तौर पर अछूती शुद्धता का दावा करना निरर्थक है।\n\nहाथ में ज्ञान का दीपक होते हुए भी जो लोग अज्ञानतावश अंधे होकर ठोकर खाते हैं, वे वास्तव में कपटी आचरण वाले हैं।\n\nइस वचन का केंद्रीय भाव यही है कि निराकार परमतत्त्व कूडलचन्नसंगमदेव ऐसे पाखंडी और कुटिल नियम-व्रत का दिखावा करने वालों को कभी स्वीकार नहीं करते।","mr":"बाह्य शुचिर्भूतपणाच्या आणि सोवळ्या-ओवळ्याच्या नावाखाली केल्या जाणाऱ्या कर्मठ नियमांना भक्तीमध्ये कोणतेही स्थान नाही, हा या वचनाचा मुख्य आशय आहे.\n\nनिसर्गातील धान्य हे पृथ्वीचे उष्टे आहे, पाणी मेघाचे उष्टे आहे, सुगंध वाऱ्याचा उष्टा आहे आणि शिजवलेले अन्न हे अग्नीचे उष्टे आहे; त
