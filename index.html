n ayant vu,\nles Sharanas de Koodala Chennasanga ne l'accepteront point, ô Seigneur.","te":"శరణుడు శరణుని చూసి,\n‘శరణు’ అని చేతులు జోడించడమే భక్తిలక్షణం.\nశరణుడు శరణుని చూసి,\nపాదాలు పట్టుకొని వందనం చేయడమే భక్తిలక్షణం.\nశరణుడు చరణాలను పట్టుకోకుండా\nచూసీ చూడనట్లు వెళ్ళిపోయినట్లయితే,\nకూడల చెన్నసంగని శరణులు మన్నించరు సుమా, ఓ స్వామీ.","kn":"ಶರಣ ಶರಣನ ಕಂಡು,\n ‘ಶರಣು’ ಎಂದು ಕರವ ಮುಗಿವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಶರಣನ ಕಂಡು,\n ಪಾದವಿಡಿದು ವಂದಿಸುವುದೆ ಭಕ್ತಿಲಕ್ಷಣ.\n ಶರಣ ಚರಣವ ಪಿಡಿಯದೆ\n ಕಂಡೂ ಕಾಣದೆ ಪೋದನಾದಡೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗನ ಶರಣರು ಮನ್ನಿಸರಯ್ಯಾ."},"m":{"en":"The central message of this Vachana is that true devotion is expressed through mutual humility and deep reverence whenever one Sharana encounters another.\n\nFolding one's hands in the greeting of \"Sharanu\" and bowing down to touch the feet of a fellow seeker are highlighted as the authentic marks of spiritual devotion.\n\nIn contrast, seeing a fellow Sharana and walking past as if not noticing them—failing to offer humble salutation—reveals an egoistic indifference that contradicts the spirit of the collective.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalachannasangama, the Vachana concludes that true Sharanas will never accept or pardon such disregard for spiritual companionship.","hi":"इस वचन का केंद्रीय भाव यह है कि एक शरण द्वारा दूसरे शरण के प्रति विनम्रता और आदर प्रकट करना ही सच्ची भक्ति की पहचान है।\n\nजब एक शरण दूसरे शरण को देखता है, तब 'शरणु' कहकर हाथ जोड़ना और उनके चरण स्पर्श कर वंदन करना ही भक्ति का वास्तविक लक्षण है।\n\nइसके विपरीत, यदि कोई व्यक्ति किसी शरण को देखकर भी अनदेखा कर देता है और अहंकार या उदासीनता के कारण उन्हें प्रणाम किए बिना ही आगे बढ़ जाता है, तो यह आचरण भक्ति के मार्ग के विरुद्ध है।\n\nयह वचन स्पष्ट करता है कि परमतत्त्व कूडलचन्नसंगम के सच्चे शरण ऐसे अहंकारी और शिष्टाचारहीन व्यवहार को कभी स्वीकार नहीं करते।","mr":"हे वचन भक्तीच्या खऱ्या लक्षणांचे आणि शरण परंपरेतील परस्पर आदराच्या महत्त्वाचे दर्शन घडवते.\n\nएका शरणाने दुसऱ्या शरणाला पाहताच अत्यंत नम्रतेने 'शरणु' म्हणत हात जोडणे आणि त्याच्या चरणांना स्पर्श करून वंदन करणे, हेच खऱ्या भक्तीचे लक्षण आहे.\n\nयाउलट, जर एखाद्याने दुसऱ्या शरणाला पाहूनही त्याच्या चरणांचे वंदन केले नाही आणि न पाहिल्यासारखे करून तो अहंकाराने किंवा बेफिकिरीने पुढे निघून गेला, तर ते वर्तन भक्तीला धरून नाही.\n\nअशा प्रकारे शरणांचा अनादर करणाऱ्या किंवा त्यांच्याकडे दुर्लक्ष करणाऱ्या व्यक्तीला कूडलचन्नसंगमदेवाचे शरण कधीही मान्यता देत नाहीत आणि त्याचा स्वीकार करत नाहीत, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que le signe véritable de la dévotion réside dans l'humilité et le respect mutuel entre les Sharanas.\n\nLorsqu'un chercheur spirituel rencontre un autre Sharana, le saluer avec révérence les mains jointes et s'incliner à ses pieds constituent l'expression authentique de sa foi.\n\nEn revanche, ignorer la présence d'un pair par indifférence ou par orgueil, en passant son chemin sans lui témoigner de déférence, trahit l'esprit même de cette voie.\n\nUne telle attitude de mépris délibéré est jugée inacceptable par la communauté des chercheurs dévoués à la Réalité suprême sans forme, invoquée ici sous la signature spirituelle de Koodalachannasanga.","te":"ఈ వచనంలోని ప్రధాన సందేశం ఏమిటంటే, ఒక శరణుడు మరొక శరణుని చూసినప్పుడు వినయంతో చేతులు జోడించి 'శరణు' అని పలకరించడం, వారి పాదాలను స్పృశించి నమస్కరించడం నిజమైన భక్తికి లక్షణం.\n\nఆధ్యాత్మిక పథంలో సాగే సాధకుల మధ్య అహంకారానికి తావులేని పరస్పర గౌరవం, వినయభావం ఉండాలని ఈ వచనం స్పష్టం చేస్తోంది.\n\nఅలా తోటి శరణుల పాదాలకు నమస్కరించకుండా, ఎదురుగా కనిపించినా చూడనట్లు నిర్లక్ష్యంగా వెళ్ళిపోయే గర్వపు ప్రవర్తన భక్తిమార్గానికి పూర్తిగా విరుద్ధం.\n\nఅటువంటి అহంకారపూరితమైన నడవడికను నిరాకార పరమతత్త్వమైన కూడలచెన్నసంగమదేవుని శరణులు ఎన్నటికీ ఆమోదించరని ఈ వచనం హెచ్చరిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಒಬ್ಬ ಶರಣನು ಇನ್ನೊಬ್ಬ ಶರಣನನ್ನು ಕಂಡಾಗ ಮನಸ್ಪೂರ್ವಕವಾಗಿ 'ಶರಣು' ಎಂದು ಹೇಳಿ ಕೈಮುಗಿಯುವುದು ಮತ್ತು ಪಾದಗಳನ್ನು ಮುಟ್ಟಿ ನಮಸ್ಕರಿಸುವುದೇ ನಿಜವಾದ ಭಕ್ತಿಯ ಲಕ್ಷಣವಾಗಿದೆ.\n\nಶರಣ ಪರಂಪರೆಯಲ್ಲಿ ಅಹಂಕಾರವನ್ನು ಬಿಟ್ಟು, ಸಹಶರಣರಲ್ಲಿ ಪರಮಚೈತನ್ಯದ ಅರಿವನ್ನು ಕಂಡು ವಿನಯದಿಂದ ಗೌರವಿಸುವುದು ಭಕ್ತಿಯ ಮುಖ್ಯ ಗುಣವಾಗಿದೆ.\n\nಒಬ್ಬ ಶರಣನು ಎದುರಿಗೆ ಬಂದಾಗ ಅವರ ಪಾದಗಳಿಗೆ ನಮಸ್ಕರಿಸದೆ, ನೋಡಿಯೂ ನೋಡದಂತೆ ನಿರ್ಲಕ್ಷಿಸಿ ಅಥವಾ ಅಹಂಕಾರದಿಂದ ಹಾಗೆಯೇ ಹೊರಟುಹೋದರೆ ಅದು ಭಕ್ತಿಯ ನಡವಳಿಕೆಯಾಗುವುದಿಲ್ಲ.\n\nಇಂತಹ ಅಹಂಕಾರದ ಹಾಗೂ ಅಗೌರವದ ವರ್ತನೆಯನ್ನು ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಕೂಡಲಚೆನ್ನಸಂಗನ ಶರಣರು ಎಂದಿಗೂ ಒಪ್ಪುವುದಿಲ್ಲ ಮತ್ತು ಕ್ಷಮಿಸುವುದಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಸ್ಪಷ್ಟ ನಿಲುವಾಗಿದೆ."}},{"no":906,"o":"ಶಬ್ದ ಸ್ಪರ್ಶ ರೂಪ ರಸ ಗಂಧ ಪಂಚೇಂದ್ರಿಯ ಮೊದಲಾಗಿ\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಬಂದ ಸುಖ ಲಿಂಗಾರ್ಪಿತವೆಂದು\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ಲಿಂಗ ನೀನಾಗಿ ಶರಣಂಗೆ.","t":{"en":"Sound, touch, form, taste, and fragrance, beginning with the five senses,\nmoved solely toward the *Linga*.\nHolding that every joy that came is an offering to the *Linga*,\nthey moved solely toward the *Linga*.\nO Koodala Chennasanga,\nas you yourself have become the *Linga* for the *Sharana*.","hi":"शब्द, स्पर्श, रूप, रस, गंध और पंचेंद्रिय आदि सब,\nलिंग की ही ओर चल पड़े।\nप्राप्त सुख को लिंगार्पित मानकर,\nवे लिंग की ही ओर चल पड़े।\nहे कूडल चेन्नसंग,\nशरण के लिए तुम्हारे ही लिंग बन जाने से।","mr":"शब्द, स्पर्श, रूप, रस, गंध आणि पंचेंद्रिये यांसह सारे काही\nवळले लिंगाच्याच दिशेने.\nप्राप्त झालेले सुख लिंगार्पित आहे असे म्हणून\nवळले लिंगाच्याच दिशेने.\nहे कूडल चेन्नसंगा,\nशरणासाठी तूच लिंग झाल्यामुळे.","fr":"Le son, le toucher, la forme, la saveur et le parfum, à commencer par les cinq organes des sens,\nse sont mis en marche, uniquement vers le Linga.\nConsidérant tout bonheur qui survient comme une offrande au Linga,\nils se sont mis en marche, uniquement vers le Linga.\nÔ Koodala Chennasanga,\npuisque tu es devenu toi-même le Linga pour le Sharana.","te":"శబ్ద స్పర్శ రూప రస గంధాలనే పంచేంద్రియాలు మొదలైనవన్నీ\nనడిచాయి లింగం వైపునకే.\nకలిగిన సుఖం లింగార్పితమని భావించి\nనడిచాయి లింగం వైపునకే.\nఓ కూడల చెన్నసంగా,\nశరణునికి లింగం నీవే అయినందున.","kn":"ಶಬ್ದ ಸ್ಪರ್ಶ ರೂಪ ರಸ ಗಂಧ ಪಂಚೇಂದ್ರಿಯ ಮೊದಲಾಗಿ\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಬಂದ ಸುಖ ಲಿಂಗಾರ್ಪಿತವೆಂದು\n ನಡೆದವು ಲಿಂಗದತ್ತತ್ತಲೆ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ಲಿಂಗ ನೀನಾಗಿ ಶರಣಂಗೆ."},"m":{"en":"This Vachana explains how a true Sharana transforms all five sensory experiences—sound, touch, form, taste, and smell—by directing them entirely towards the Linga.\n\nRather than rejecting the senses or indulging in them for selfish pleasure, the Sharana treats every joy arising through these faculties as Lingarpita, a sacred offering to the Divine.\n\nThrough the practice of Linganga Yoga, the bodily senses are purified and aligned with the Ishtalinga, which serves as the sacred medium connecting the individual to the Formless Supreme Consciousness.\n\nAddressed to Kudalachannasangama, the Vachana reveals that when the Supreme Reality itself becomes the guiding awareness within the Sharana, every sensory perception naturally flows back into the Divine.","hi":"यह वचन शरण की उस उच्च आध्यात्मिक अवस्था को स्पष्ट करता है जहाँ उनकी सभी इंद्रियाँ और अनुभव परमतत्त्व में ही केंद्रित हो जाते हैं।\n\nशब्द, स्पर्श, रूप, रस और गंध रूपी पाँचों इंद्रियाँ तथा मन-प्राण बाहरी विषयों की ओर भटकने के बजाय सहज ही लिंग अर्थात् निराकार शुद्ध चैतन्य की ओर प्रवृत्त हो जाते हैं।\n\nजब इंद्रियों के माध्यम से प्राप्त होने वाले प्रत्येक सुख को लिंग को ही अर्पित मान लिया जाता है, तब संपूर्ण जीवन-प्रवाह उसी परम सत्य की ओर मुड़ जाता है।\n\nइस वचन का तात्पर्य यह है कि कूडलचेन्नसंगम के रूप में संबोधित वह निराकार परमतत्त्व जब स्वयं ही शरण के लिए लिंग-स्वरूप हो जाता है, तब साधक की सारी वृत्तियाँ उसी में लीन हो जाती हैं।","mr":"हे वचन शरण अवस्थेतील इंद्रियनिग्रह आणि लिंगसमर्पणाची उच्च आध्यात्मिक पातळी स्पष्ट करते.\n\nशब्द, स्पर्श, रूप, रस आणि गंध हे पंचमहाभूतांचे विषय अनुभवणारी सर्व पंचेंद्रिये बाह्य जगतात न भटकता केवळ लिंगाकडेच म्हणजे निराकार परमतत्त्वाच्या जाणीवेकडेच वळली आहेत, असे येथे सांगितले आहे.\n\nइंद्रियांद्वारे प्राप्त होणारा प्रत्येक आनंद हा स्वतःसाठी न भोगता तो 'लिंगार्पित' आहे या जाणिवेने स्वीकारल्यामुळे, शरणाची सर्व वृत्ती अखंडपणे लिंगाच्याच दिशेने प्रवाहित होते.\n\nकूडलचन्नसंगमदेव हे परम सत्यच शरणासाठी प्रत्यक्ष लिंगरूप झाल्यामुळे, शरणाचे संपूर्ण अस्तित्व आणि जाणीव त्या शुद्ध चैतन्याशी एकरूप झाल्याचे या वचनातून अधोरेखित होते.","fr":"Ce vachana met en lumière la transmutation spirituelle des sens chez le Sharana, où les cinq perceptions sensorielles — le son, le toucher, la forme, le goût et l'odorat — cessent de se disperser vers le monde extérieur pour s'orienter entièrement vers le Linga.\n\nAu lieu de rechercher la jouissance égoïste, chaque expérience et chaque plaisir perçus par les sens sont vécus comme une offrande consacrée au Linga (Lingarpita), réorientant ainsi toutes les facultés humaines vers le divin.\n\nLa portée spirituelle de ce vachana réside dans l'état d'unité intérieure du Sharana : lorsque la Réalité suprême sans forme, invoquée sous le nom de Koodalachannasanga, devient elle-même le Linga pour le chercheur, toute perception sensible se transforme naturellement en communion spirituelle.","te":"ఈ వచనం వివరిస్తున్న ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నిజమైన శరణుని ఇంద్రియాలన్నీ ప్రాపంచిక భోగాల వైపు కాకుండా పరమతత్త్వం వైపే నిరంతరం సాగిపోతాయి.\n\nశబ్ద, స్పర్శ, రూప, రస, గంధాలనే ఐదు విషయాలను గ్రహించే పంచేంద్రియాలు తమకు కలిగే ప్రతి అనుభూతినీ, సుఖాన్నీ స్వార్థం కోసం కాకుండా లింగార్పితంగా భావిస్తూ ఆ లింగతత్త్వం వైపే మరలుతాయి.\n\nకూడలచెన్నసంగ అనే అంకితనామంతో సూచించబడిన నిరాకార పరమచైతన్యమే శరణునికి సర్వస్వమైన లింగంగా పరిణమించినప్పుడు, అతని సమస్త ఇంద్రియ వ్యాపారాలూ ఆ శుద్ధచైతన్యంలోనే లీనమవుతాయి.","kn":"ಈ ವಚನವು ಒಬ್ಬ ನಿಜವಾದ ಶರಣನ ಇಂದ್ರಿಯಗಳು ಮತ್ತು ಮನಸ್ಸು ಹೇಗೆ ಸಂಪೂರ್ಣವಾಗಿ ಲಿಂಗಮುಖಿಯಾಗಿರುತ್ತವೆ ಎಂಬುದನ್ನು ವಿವರಿಸುತ್ತದೆ.\n\nಶರಣನಿಗೆ ಕೇಳುವ ಶಬ್ದ, ಮುಟ್ಟುವ ಸ್ಪರ್ಶ, ಕಾಣುವ ರೂಪ, ಸವಿಯುವ ರಸ ಮತ್ತು ವಾಸನೆಯ ಗಂಧ ಎಂಬ ಐದೂ ಇಂದ್ರಿಯಗಳು ಲೌಕಿಕ ಆಕರ್ಷಣೆಗಳ ಕಡೆಗೆ ಹರಿಯದೆ, ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ಸಂಕೇತವಾದ ಲಿಂಗದ ಕಡೆಗೇ ಸಾಗುತ್ತವೆ.\n\nಈ ಇಂದ್ರಿಯಗಳ ಮೂಲಕ ಬರುವ ಪ್ರತಿಯೊಂದು ಸುಖವನ್ನೂ ಸ್ವಾರ್ಥಕ್ಕಾಗಿ ಬಯಸದೆ, ಅದೆಲ್ಲವೂ ಲಿಂಗಕ್ಕೇ ಅರ್ಪಿತ ಎಂಬ ಭಾವದಿಂದ ಸ್ವೀಕರಿಸುವುದರಿಂದ, ಅವು ಸದಾ ಲಿಂಗದ ಕಡೆಗೇ ಮುಖ ಮಾಡಿರುತ್ತವೆ.\n\nಹೀಗೆ ಶರಣನ ಪಾಲಿಗೆ ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವೇ ಲಿಂಗರೂಪವಾಗಿ ಪರಿಣಮಿಸಿರುವಾಗ, ಅವನ ಇಡೀ ಬದುಕು ಮತ್ತು ಅನುಭವಗಳೆಲ್ಲವೂ ಆ ಪರಮಸತ್ಯದಲ್ಲೇ ಒಂದಾಗಿರುತ್ತವೆ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ಆಶಯವಾಗಿದೆ."}},{"no":907,"o":"ಶಾಖೆಯಿಲ್ಲದೆ ಕಪಿ ಪಿಡಿಯದು,\n ಚಿಗುರಿಲ್ಲದೆ ಪಿಕ ನುಡಿಯದು,\n ಪ್ರಭೈಸಿದಲ್ಲದೆ ಉಲಿಯದು ಕುಕ್ಕುಟ.\n ಹೂಮಿಡಿಯ ಹರಿದು ಹಣ್ಣನರಸಲುಂಟೆ?\n ತಮ್ಮ ಮರೆಯದೆ ಲಿಂಗವ ಮೆರೆವರೆಲ್ಲ\n ಅಜ್ಞಾನಿಗಳು ಅನಾಚಾರಿಗಳು ಆಚಾರಭ್ರಷô್ಠರು,\n ಗುರುಲಿಂಗಜಂಗಮ ದ್ರೋಹಿಗಳು.\n ಅಶನವರತು ವ್ಯಸನ ನಿಂತು\n ತನು ಕರಗಿ ಮನವೆರಗಿ\n ನಿಮಗೆ ಮಾಡದ ಅಜ್ಞಾನಿಗಳನೇನೆಂಬೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"Without a branch, the monkey does not grasp;\nwithout a tender shoot, the cuckoo does not sing;\nunless dawn breaks, the rooster does not crow.\nHaving plucked the blossom and tender bud, can one ever seek the fruit?\nAll those who flaunt the *Linga* without forgetting themselves\nare the ignorant, the unprincipled, the fallen from right conduct,\nand traitors to the *Guru*, *Linga*, and *Jangama*.\nWithout hunger subsiding and worldly craving ceasing,\nwithout the body melting and the mind bowing down,\nwhat shall I say of the ignorant who do not serve you,\nO Koodala Chennasangamadeva?","hi":"डाली के बिना वानर नहीं पकड़ता,\nकोंपल के बिना कोयल नहीं बोलती,\nप्रभात हुए बिना मुर्ग़ा बांग नहीं देता।\nफूल और कली को तोड़कर क्या फल खोजा जा सकता है?\nस्वयं को भूले बिना लिंग का दिखावा करनेवाले सभी\nअज्ञानी हैं, अनाचारी हैं, आचारभ्रष्ट हैं,\nगुरुलिंगजंगम के द्रोही हैं।\nभोजन की सुध खोकर, व्यसन रुककर,\nतन पिघलकर, मन झुककर\nआपकी सेवा न करनेवाले अज्ञानियों को क्या कहूँ,\nहे कूडल चेन्नसंगमदेव।","mr":"फांदीशिवाय वानर धरत नाही,\nपालवीशिवाय कोकिळा गात नाही,\nउजाडल्याशिवाय कोंबडा आरवत नाही.\nकळी-कोवळे फळ तोडून पिकलेले फळ शोधता येते का?\nस्वतःला न विसरता लिंगाचाच बडेजाव मिरवणारे सर्वजण\nअज्ञानी आहेत, अनाचारी आहेत, आचारभ्रष्ट आहेत,\nगुरुलिंगजंगम द्रोही आहेत.\nअन्नपाणी सुटून, तळमळ थांबून,\nतनु विरघळून, मन लीन होऊन\nतुमची सेवा न करणाऱ्या अज्ञानी लोकांना मी काय म्हणू,\nहे कूडल चेन्नसंगमदेवा!","fr":"Sans branche, le singe ne saisit rien,\nsans jeunes pousses, le coucou ne chante point,\nsans que l'aube ne resplendisse, le coq ne crie pas.\nAprès avoir arraché la fleur et le jeune fruit, peut-on donc chercher le fruit mûr ?\nTous ceux qui exhibent le Linga sans s'oublier eux-mêmes\nsont des ignorants, des gens sans conduite, des déchus de la juste pratique,\ndes traîtres envers le Guru, le Linga et le Jangama.\nQue dirais-je des ignorants qui ne vous servent pas,\nl'appétit tari, les tourments apaisés,\nle corps fondu et l'esprit fondu en vous,\nÔ Koodala Chennasangamadeva ?","te":"కొమ్మ లేనిదే కోతి పట్టుకోదు,\nచిగురు లేనిదే కోకిల కూయదు,\nతెల్లవారనిదే కోడి కూయదు.\nపూతపిందెలను తెంపివేసి పండును వెతకడం సాధ్యమా?\nతమను తాము మరవకుండా లింగాన్ని ప్రదర్శించేవారందరూ\nఅజ్ఞానులు, అనాచారులు, ఆచారభ్రష్టులు,\nగురులింగజంగమ ద్రోహులు.\nఆహారకాంక్ష ఇంకిపోయి, వ్యామోహం నిలిచిపోయి,\nతనువు కరిగి, మనసు లీనమై\nమీకు అర్పించని అజ్ఞానులను ఏమనాలి\nఓ కూడల చెన్నసంగమదేవా.","kn":"ಶಾಖೆಯಿಲ್ಲದೆ ಕಪಿ ಪಿಡಿಯದು,\n ಚಿಗುರಿಲ್ಲದೆ ಪಿಕ ನುಡಿಯದು,\n ಪ್ರಭೈಸಿದಲ್ಲದೆ ಉಲಿಯದು ಕುಕ್ಕುಟ.\n ಹೂಮಿಡಿಯ ಹರಿದು ಹಣ್ಣನರಸಲುಂಟೆ?\n ತಮ್ಮ ಮರೆಯದೆ ಲಿಂಗವ ಮೆರೆವರೆಲ್ಲ\n ಅಜ್ಞಾನಿಗಳು ಅನಾಚಾರಿಗಳು ಆಚಾರಭ್ರಷô್ಠರು,\n ಗುರುಲಿಂಗಜಂಗಮ ದ್ರೋಹಿಗಳು.\n ಅಶನವರತು ವ್ಯಸನ ನಿಂತು\n ತನು ಕರಗಿ ಮನವೆರಗಿ\n ನಿಮಗೆ ಮಾಡದ ಅಜ್ಞಾನಿಗಳನೇನೆಂಬೆ\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ."},"m":{"en":"This Vachana illustrates through natural metaphors—such as a monkey needing a branch to leap, a cuckoo waiting for fresh shoots to sing, a rooster crowing only at dawn, and the impossibility of expecting fruit after plucking away the blossom and tender bud—that every genuine outcome depends upon a necessary foundation and natural progression.\n\nIn the same way, those who ostentatiously display the Linga without first shedding their ego and self-importance are condemned as ignorant, devoid of righteous conduct, and betrayers of the Guru, the Linga, and the Jangama (enlightened spiritual seekers and guides).\n\nTrue devotion to the Formless Supreme Reality, addressed here as Kudalachannasangamadeva, cannot exist as a mere external show while the ego remains intact.\n\nThe spiritual significance of this Vachana lies in the realization that authentic worship requires total inner absorption, where worldly cravings and bodily consciousness dissolve and the mind merges completely with the Absolute.","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार बिना डाली के बंदर पकड़ नहीं बना सकता, बिना कोंपलों के कोयल कूक नहीं सकती, बिना सूर्योदय के मुर्गा बांग नहीं देता और फूल या कच्ची कली को तोड़कर पके फल की आशा नहीं की जा सकती, उसी प्रकार हर आध्यात्मिक उपलब्धि के लिए एक स्वाभाविक आधार और परिपक्व प्रक्रिया आवश्यक है।\n\nजो लोग अपने अहंकार और निज-भाव को भुलाए बिना केवल बाहरी आडंबर से लिंग का प्रदर्शन करते हैं, वे अज्ञानी, अनाचारी तथा आचारभ्रष्ट हैं।\n\nऐसे दिखावटी लोग वास्तविकता में गुरु, लिंग और आध्यात्मिक साधकों के रूप में प्रतिष्ठित जंगम के द्रोही हैं।\n\nकूडलचेन्नसंगमदेव के रूप में संबोधित निराकार परमतत्त्व के प्रति समर्पित होते हुए यह वचन संदेश देता है कि बिना आहार-विहार की सुध भूले, बिना सांसारिक व्यसनों के थमे, तथा बिना तन के पिघले और मन के पूर्णतः लीन हुए जो लोग कोरा दिखावा करते हैं, वे परम सत्य से अनभिज्ञ हैं।","mr":"हे वचन निसर्गातील दृष्टांतांद्वारे स्पष्ट करते की, जसे फांदीशिवाय वानर आधार घेऊ शकत नाही, कोवळ्या पालवीशिवाय कोकीळ गात नाही, पहाट झाल्याशिवाय कोंबडा आरवत नाही आणि कळी किंवा कैरी तोडून टाकल्यास पक्व फळाची अपेक्षा करता येत नाही, तसेच आध्यात्मिक साधनेतही स्वतःचा अहंकार विसरल्याशिवाय परमतत्त्वाची खरी अनुभूती मिळू शकत नाही.\n\nजे लोक स्वतःची देहबुद्धी आणि मीपणा न विसरता केवळ बाह्यरूपाने लिंगाचे प्रदर्शन करतात, ते खऱ्या अर्थाने अज्ञानी, आचारहीन तसेच नित्य आध्यात्मिक ज्ञान देणारे गुरू, निराकार परमतत्त्वाचे प्रतीक असलेले इष्टलिंग आणि जंगम म्हणजेच प्रबुद्ध साधक यांचे द्रोही ठरतात.\n\nआहार-विहाराची आसक्ती सुटून, प्रापंचिक तळमळ थांबून, शरीर झिजवून आणि मन पूर्णपणे एकरूप झाल्याशिवाय केलेली भक्ती व्यर्थ आहे, असा कूडलचन्नसंगमदेव या अंकितनामातून व्यक्त होणारा या वचनाचा गहन आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière le lien indissociable entre une cause véritable et son accomplissement spirituel, à travers des images tirées de la nature : le singe ne peut s'agripper sans branche, le coucou ne chante pas sans jeunes pousses, le coq ne crie pas avant l'aube, et nul ne peut espérer récolter un fruit après avoir arraché la fleur et le bourgeon.\n\nDe la même manière, ceux qui prétendent exalter le Linga — le miroir sacré menant à la Réalité suprême sans forme — sans avoir d'abord transcendé leur propre ego versent dans l'illusion.\n\nLe texte qualifie d'ignorants, d'êtres dépourvus de droiture et de traîtres envers le Guru, le Linga et le Jangama ceux qui s'adonnent à une telle démonstration extérieure sans effacement de soi.\n\nL'adoration authentique dédiée au Principe suprême, évoqué sous le nom de Koodala Channasangamadeva, exige une dévotion totale où la faim s'oublie, les tourments s'apaisent, le corps se consume dans l'effort spirituel et l'esprit se fond entièrement dans le Divin.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, ప్రకృతిలోని ప్రతి క్రియకూ ఒక సహజమైన క్రమం, ఆధారం ఉన్నట్లే ఆధ్యాత్మిక సాధనకు కూడా అంతరంగ శుద్ధి, స్వయం-విస్మృతి అనే పునాది తప్పనిసరిగా ఉండాలి.\n\nకొమ్మ లేకుండా కోతి పట్టుకోలేనట్లు, చిగురు లేకుండా కోకిల కూయలేనట్లు, తెల్లవారకుండా కోడి కూయలేనట్లు, పువ్వును, పిందెను తుంచేసి పండును ఆశించడం ఎలా అసాధ్యమో, అలాగే తమ అహంకారాన్ని, దేహభావాన్ని విడిచిపెట్టకుండా కేవలం బాహ్యంగా ఇష్టలింగాన్ని ప్రదర్శించేవారందరూ అజ్ఞానులు, అనాచారులు, గురు-లింగ-జంగమ తత్త్వాలకు ద్రోహం చేసే ఆచారభ్రష్టులు అవుతారు.\n\nఇష్టలింగం అనేది నిరాకార పరమతత్త్వాన్ని చేరుకోవడానికి ఒక పవిత్రమైన మాధ్యమం మాత్రమే కాబట్టి, సాధకుడు తన అహాన్ని విস্মరించకుండా చేసే బాహ్య ఆడంబరాలకు ఎలాంటి ఆధ్యాత్మిక విలువా ఉండదు.\n\nకూడల చెన్నసంగమదేవ అనే అంకితనామంతో సంబోధించబడిన ఆ నిరాకార పరమచైతన్యానికి, ఆకలిదప్పులను సైతం మరిచి, లౌకిక వ్యామోహాలను విడిచి, తనువు కరిగి, మనస్సు సంపూర్ణంగా లయమై నిజమైన అంకితభావంతో సేవ చేయని మూర్ఖుల స్థితిని ఈ వచనం తీవ్రంగా విమర్శిస్తున్నది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕೋತಿ ಹಾರಲು ಮರದ ಕೊಂಬೆ ಹೇಗೆ ಬೇಕೋ, ಕೋಗಿಲೆ ಹಾಡಲು ಮಾವಿನ ಚಿಗುರು ಹೇಗೆ ಇರಬೇಕೋ ಮತ್ತು ಕೋಳಿ ಕೂಗಲು ಬೆಳಗು ಹೇಗೆ ಆಗಬೇಕೋ, ಹಾಗೆಯೇ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಗೂ ಒಂದು ಸರಿಯಾದ ಆಧಾರ ಮತ್ತು ಕ್ರಮಬದ್ಧವಾದ ಹಂತಗಳು ಇರಲೇಬೇಕು.\n\nಹೂವು ಮತ್ತು ಎಳೆಯ ಮಿಡಿಯನ್ನೇ ಕಿತ್ತುಹಾಕಿ ಮರದಲ್ಲಿ ಹಣ್ಣನ್ನು ಹುಡುಕುವುದು ಹೇಗೆ ಮೂರ್ಖತನವೋ, ಹಾಗೆಯೇ ತಮ್ಮೊಳಗಿನ ಅಹಂಕಾರ ಮತ್ತು ದೇಹಭಾವವನ್ನು ಮರೆಯದೆ, ಬರಿಯ ತೋರಿಕೆಗಾಗಿ ಇಷ್ಟಲಿಂಗವನ್ನು ಪ್ರದರ್ಶಿಸುವವರು ಅಜ್ಞಾನಿಗಳು ಹಾಗೂ ಸದಾಚಾರದಿಂದ ಭ್ರಷ್ಟರಾದವರು ಎಂದು ಇಲ್ಲಿ ಎಚ್ಚರಿಸಲಾಗಿದೆ.\n\nಇಂತಹ ತೋರಿಕೆಯ ಜನರು ಸತ್ಯದ ದಾರಿಯನ್ನು ತೋರುವ ಗುರು, ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಕುರುಹಾದ ಲಿಂಗ ಮತ್ತು ಜ್ಞಾನವನ್ನು ಪಸರಿಸುವ ಜಂಗಮ ತತ್ತ್ವಕ್ಕೆ ದ್ರೋಹ ಬಗೆಯುವವರಾಗುತ್ತಾರೆ.\n\nಊಟದ ಹಂಬಲವನ್ನು ಮರೆತು, ಪ್ರಾಪಂಚಿಕ ವ್ಯಸನಗಳನ್ನು ನಿಲ್ಲಿಸಿ, ದೇಹದ ಅಹಂಕಾರವನ್ನು ಕರಗಿಸಿ, ಮನಸ್ಸನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಸಮರ್ಪಿಸಿ ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ಪರಮಸತ್ಯದ ಸಾಕ್ಷಾತ್ಕಾರಕ್ಕಾಗಿ ಸಾಧನೆ ಮಾಡದವರ ಬದುಕು ಅಜ್ಞಾನದಿಂದ ಕೂಡಿದೆ ಎಂಬುದೇ ಈ ವಚನದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":908,"o":"ಶಿವಯೋ[ಗ] ನಿಭ್ರಾಂತ ಶರಣ.\n ಕರ್ಮಕಾಯನಲ್ಲ, ಕಾಯಕಲ್ಪಿತನಲ್ಲ,\n ಸಂಕಲ್ಪ ವಿಕಲ್ಪ ವಿರಹಿತನು.\n ಅವರವರ ಕೂಡಿಕೊಂಡಿಪ್ಪ, ತನ್ನ ಪರಿಬೇರೆ.\n ಶರಣ ನಿರಂತರ ಪರಮಸುಖಿ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ, ನಿಮ್ಮ ಶರಣ ಪ್ರಪಂಚಿನೊಳಗಿಪ್ಪ, ತನ್ನ ಪರಿ ಬೇರೆ.","t":{"en":"Undeluded in *Shivayoga* is the *Sharana*.\nHe is not bound by a body of karma, nor fashioned of bodily form,\nhe is free from resolve and doubt.\nHe abides with each in their company, yet his own way is distinct.\nThe *Sharana* is ever in supreme bliss.\nO Koodala Chennasanga, your *Sharana* abides within the world, yet his own way is distinct.","hi":"शिवयोग से निर्भ्रांत है शरण।\nवह कर्मकाया नहीं है, कायाकल्पित नहीं है,\nसंकल्प-विकल्प से रहित है।\nसबके साथ घुल-मिलकर रहता है, पर उसकी रीति अलग है।\nशरण निरंतर परमसुखी है।\nहे कूडलचेन्नसंग, आपका शरण प्रपंच के भीतर रहता है, पर उसकी रीति अलग है।","mr":"शिवयोगात निभ्रांत असतो शरण.\nतो कर्मकाया नाही, कायकल्पित नाही,\nसंकल्प-विकल्परहित आहे तो.\nतो त्या-त्या लोकांत मिसळून राहतो, तरी त्याची रीत निराळी आहे.\nशरण निरंतर परमसुखी असतो.\nहे कूडलचेन्नसंगा, तुमचा शरण प्रपंचात राहतो, तरी त्याची रीत निराळी आहे.","fr":"Le Sharana demeure affranchi de tout égarement dans le Shivayoga.\nIl n'a point un corps lié au karma, il n'est point façonné par l'idée du corps,\nil est exempt de résolutions et de doutes.\nIl se mêle à chacun, mais sa manière d'être est tout autre.\nLe Sharana demeure sans cesse dans la félicité suprême.\nÔ Koodala Chennasanga, votre Sharana vit dans le monde, mais sa manière d'être est tout autre.","te":"శివయోగ నిభ్రాంతుడు శరణుడు.\nకర్మకాయుడు కాడు, కాయకల్పితుడు కాడు,\nసంకల్ప వికల్ప విరహితుడు.\nఎవరెవరితోనో కూడుకొని ఉంటాడు, తన తీరు వేరు.\nశరణుడు నిరంతరం పరమసుఖి.\nఓ కూడల చెన్నసంగా, మీ శరణుడు ప్రపంచంలో ఉంటాడు, తన తీరు వేరు.","kn":"ಶಿವಯೋ[ಗ] ನಿಭ್ರಾಂತ ಶರಣ.\n ಕರ್ಮಕಾಯನಲ್ಲ, ಕಾಯಕಲ್ಪಿತನಲ್ಲ,\n ಸಂಕಲ್ಪ ವಿಕಲ್ಪ ವಿರಹಿತನು.\n ಅವರವರ ಕೂಡಿಕೊಂಡಿಪ್ಪ, ತನ್ನ ಪರಿಬೇರೆ.\n ಶರಣ ನಿರಂತರ ಪರಮಸುಖಿ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ, ನಿಮ್ಮ ಶರಣ ಪ್ರಪಂಚಿನೊಳಗಿಪ್ಪ, ತನ್ನ ಪರಿ ಬೇರೆ."},"m":{"en":"This Vachana describes the exalted spiritual state of a Sharana who is firmly established in Shivayoga and entirely free from delusion.\n\nSuch a realized being transcends the limitations of a body bound by karma or shaped by physical conditioning, remaining untouched by the wavering dualities of desire and doubt.\n\nAlthough the Sharana mingles naturally with people and lives right in the midst of the material world, his inner way of being remains completely distinct and unattached.\n\nAddressing the Formless Supreme Consciousness through the ankitanama Kudalachannasanga, the Vachana highlights that a true Sharana abides in perpetual supreme bliss while engaging with the world on a wholly transcendent plane.","hi":"इस वचन का केंद्रीय भाव यह है कि शिवयोग में स्थित सच्चा शरण पूर्णतः भ्रम-रहित होता है और वह न तो कर्म-काया से बँधा होता है और न ही देह की कल्पनाओं से सीमित रहता है।\n\nऐसा शरण मन के संकल्प और विकल्पों से सर्वथा मुक्त होकर निरंतर परम सुख की अवस्था में निवास करता है।\n\nवह बाह्य रूप से संसार में सबके साथ मिलकर रहता हुआ दिखाई देता है, किंतु उसकी आंतरिक स्थिति और जीवन-दृष्टि सबसे नितांत भिन्न होती है।\n\nनिराकार परमतत्त्व कूडलचेन्नसंगम के प्रति समर्पित शरण प्रपंच के भीतर रहते हुए भी अपनी अलग और अलौकिक आध्यात्मिक सत्ता बनाए रखता है।","mr":"हे वचन शिवयोगामध्ये स्थिरावलेल्या आणि सर्व भ्रमांपासून मुक्त झालेल्या जाणीवसंपन्न शरणाच्या अलौकिक जीवनपद्धतीचे आणि अंतःस्थितीचे वर्णन करते.\n\nअसा शरण केवळ बाह्य कर्मकांडात अडकलेला नसतो किंवा देहभावनेने बांधलेला नसतो, तर मनातील संकल्प आणि विकल्प यांच्या पलीकडे जाऊन निरंतर परमसुखात रममाण झालेला असतो.\n\nतो समाजात वावरताना प्रत्येकाशी मिळून-मिसळून राहतो, तरीही त्याचे अंतरंग आणि जगण्याची रीत सामान्य जगापेक्षा पूर्णपणे वेगळी व अलिप्त असते.\n\nकूडलचन्नसंगम या परमतत्त्वाशी एकरूप झालेला शरण प्रत्यक्ष प्रपंचात राहूनही प्रपंचाच्या प्रभावापासून मुक्त आणि स्वतःच्या वेगळ्या आध्यात्मिक अवस्थेत कसा राहतो, याची जाणीव हे वचन करून देते.","fr":"Ce vachana met en lumière la nature transcendante du Sharana établi dans le Shivayoga, qui demeure libre de toute illusion, des entraves de l'action ordinaire et des limitations du corps physique.\n\nAffranchi des fluctuations de l'esprit, telles que le désir et le doute, il réside en permanence dans une béatitude suprême et inaltérable.\n\nBien qu'il vive au milieu des autres et s'associe à chacun avec naturel, sa manière d'être intérieure demeure radicalement distincte de celle du commun des mortels.\n\nS'adressant à la Réalité suprême sans forme à travers la signature spirituelle Koodalachannasanga, le poète souligne que le véritable Sharana habite pleinement le monde tout en conservant une conscience pure et détachée.","te":"శివయోగంలో స్థిరపడి ఎలాంటి భ్రాంతులు లేని నిజమైన శరణుని ఆధ్యాత్మిక స్థితిని ఈ వచనం వివరిస్తోంది.\n\nఅట్టి శరణుడు కర్మబద్ధమైన శరీర పరిమితులకు లోబడినవాడు కాడు, దేహభ్రాంతితో కూడిన కల్పనలకు అతీతుడు మరియు మనస్సులోని సంకల్ప వికల్పాల నుండి పూర్తిగా విముక్తుడై నిరంతరం పరమసుఖంలో ఓలలాడుతుంటాడు.\n\nకూడల చెన్నసంగమదేవ అనే నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, శరణుడు పైకి అందరితో కలిసిమెలిసి ఈ ప్రపంచంలోనే జీవిస్తున్నట్లు కనిపించినప్పటికీ, ఆయన అంతరంగ ఉనికి మరియు ఆధ్యాత్మిక జీవన విధానం మాత్రం లౌకిక జనులకంటే పూర్తిగా భిన్నంగా, అతీతంగా ఉంటాయని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ಶಿವಯೋಗದಲ್ಲಿ ನೆಲೆಗೊಂಡಿರುವ ನಿಜವಾದ ಶರಣನ ಆಂತರಿಕ ಸ್ಥಿತಿ ಮತ್ತು ಜಗತ್ತಿನೊಳಗಿನ ಅವನ ವಿಶಿಷ್ಟವಾದ ಬದುಕಿನ ರೀತಿಯನ್ನು ವಿವರಿಸಲಾಗಿದೆ.\n\nನಿರಾಕಾರ ಪರಮತತ್ತ್ವದೊಡನೆ ಒಂದಾಗಿರುವ ಶರಣನು ಯಾವುದೇ ಭ್ರಮೆ ಅಥವಾ ಗೊಂದಲಗಳಿಲ್ಲದೆ ಸ್ಪಷ್ಟವಾದ ಅರಿವಿನಿಂದ ಕೂಡಿರುತ್ತಾನೆ.\n\nಅವನು ಹಿಂದಿನ ಕರ್ಮಗಳ ಬಂಧನದಿಂದ ಹುಟ್ಟಿದ ಕೇವಲ ಭೌತಿಕ ಶರೀರವಲ್ಲ, ದೇಹಭಾವದ ಕಲ್ಪನೆಗಳಿಗೆ ಸಿಲುಕಿದವನೂ ಅಲ್ಲ; ಹಾಗೆಯೇ ಮನಸ್ಸಿನ ಬಯಕೆ ಮತ್ತು ತಳಮಳಗಳಿಂದ ಸಂಪೂರ್ಣವಾಗಿ ಮುಕ್ತನಾಗಿ ಯಾವಾಗಲೂ ಪರಮಾನಂದದಲ್ಲಿ ಇರುತ್ತಾನೆ.\n\nಕೂಡಲಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ಪರಮಸತ್ಯದ ಅರಿವಿನಲ್ಲಿರುವ ಶರಣನು ಹೊರನೋಟಕ್ಕೆ ಈ ಪ್ರಪಂಚದಲ್ಲಿದ್ದುಕೊಂಡು ಎಲ್ಲರೊಡನೆ ಬೆರೆತು ಬದುಕುತ್ತಿದ್ದರೂ, ಅವನ ಆಂತರಿಕ ನೆಲೆ ಮತ್ತು ಬದುಕಿನ ರೀತಿ ಮಾತ್ರ ಲೌಕಿಕ ಜನರಿಗಿಂತ ತೀರ ಭಿನ್ನವಾಗಿರುತ್ತದೆ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":909,"o":"ಶಿವಲಿಂಗವ ನೋಡುವ ಕಣ್ಣಲ್ಲಿ\n ಪರಸ್ತ್ರೀಯ ನೋಡಿದಡೆ ಅಲ್ಲಿ ಲಿಂಗವಿಲ್ಲ.\n ಪರಬ್ರಹ್ಮವ ನುಡಿವ ಜಿಹ್ವೆಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಅಧರಪಾನವ ಕೊಂಡಡೆ ಪ್ರಸಾದಕ್ಕೆ ದೂರ.\n ಘನಲಿಂಗವ ಪೂಜಿಸುವ ಕೈಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಕುಚವ ಮುಟ್ಟಿದಡೆ, ತಾ ಮಾಡಿದ ಪೂಜೆ ನಿಷ್ಫಲ.\n ಇದನರಿಯದಿರ್ದಡೆ ಬಳ್ಳದಲ್ಲಿ ಸುರೆಯ ತುಂಬಿ\n ಮೇಲೆ ಬೂದಿಯ ಹೂಸಿದಂತಾಯಿತ್ತು ಕಾಣಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"With the eye that beholds the *Shivalinga*,\nif one looks upon another's wife, there is no *Linga* there.\nWith the tongue that speaks of *Parabrahma*,\nif one drinks from the lips of other women, one is far from *Prasada*.\nWith the hand that worships the supreme *Linga*,\nif one touches the breasts of other women, the worship one performs is fruitless.\nIf one does not realize this, it becomes like filling a measure-pot with liquor\nand smearing ash on top of it, you see,\nO Koodala Chennasangamadeva.","hi":"शिवलिंग को देखनेवाली आँख से,\nपरस्त्री को देखने पर वहाँ लिंग नहीं है।\nपरब्रह्म का उच्चारण करनेवाली जिह्वा से,\nपरस्त्रियों का अधरपान करने पर वह प्रसाद से दूर है।\nघनलिंग की पूजा करनेवाले हाथ से,\nपरस्त्रियों के कुच को छूने पर, उसकी की हुई पूजा निष्फल है।\nइसे न जानने पर यह पात्र में सुरा भरकर,\nऊपर भस्म पोतने के समान हुआ देखो,\nहे कूडल चेन्नसंगमदेव।","mr":"शिवलिंगाचे दर्शन घेणाऱ्या डोळ्यांनी\nपरस्त्रीकडे पाहिल्यास तिथे लिंग उरत नाही.\nपरब्रह्माचा उच्चार करणाऱ्या जिभेने,\nपरस्त्रियांचे अधरपान केल्यास ती प्रसादापासून दूर होते.\nघनलिंगाची पूजा करणाऱ्या हातांनी,\nपरस्त्रियांच्या स्तनांना स्पर्श केल्यास, त्याने केलेली पूजा निष्फळ ठरते.\nहे न जाणल्यास, मापात मद्य भरून\nवरून राख फासल्यासारखे झाले पाहा,\nहे कूडल चेन्नसंगमदेवा.","fr":"Dans l'œil qui contemple le *Shivalinga*,\ndès qu'il regarde la femme d'autrui, le *Linga* n'y est plus.\nSur la langue qui énonce le *Parabrahma*,\ndès qu'elle goûte au nectar des lèvres des femmes d'autrui, elle s'éloigne du *Prasada*.\nDans la main qui vénère le sublime *Linga*,\ndès qu'elle touche le sein des femmes d'autrui, l'adoration qu'elle accomplit devient stérile.\nSi l'on ignore cela, c'est comme remplir d'alcool un boisseau\net l'enduire de cendre sacrée par-dessus, vois-tu,\nÔ Koodala Chennasangamadeva.","te":"శివలింగాన్ని చూసే కంటితో\nపరస్త్రీని చూస్తే అక్కడ లింగం లేదు.\nపరబ్రహ్మాన్ని పలికే నాలుకతో,\nపరస్త్రీల అధరపానాన్ని గ్రహిస్తే ప్రసాదానికి దూరం.\nఘనలింగాన్ని పూజించే చేతితో,\nపరస్త్రీల కుచాలను తాకితే, తాను చేసిన పూజ నిష్ఫలం.\nదీనిని తెలుసుకోకపోతే తవ్వెడు పాత్రలో కల్లు నింపి\nపైన బూడిద పులిమినట్లయింది సుమా,\nఓ కూడల చెన్నసంగమదేవా.","kn":"ಶಿವಲಿಂಗವ ನೋಡುವ ಕಣ್ಣಲ್ಲಿ\n ಪರಸ್ತ್ರೀಯ ನೋಡಿದಡೆ ಅಲ್ಲಿ ಲಿಂಗವಿಲ್ಲ.\n ಪರಬ್ರಹ್ಮವ ನುಡಿವ ಜಿಹ್ವೆಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಅಧರಪಾನವ ಕೊಂಡಡೆ ಪ್ರಸಾದಕ್ಕೆ ದೂರ.\n ಘನಲಿಂಗವ ಪೂಜಿಸುವ ಕೈಯಲ್ಲಿ,\n ಪರಸ್ತ್ರೀಯರ ಕುಚವ ಮುಟ್ಟಿದಡೆ, ತಾ ಮಾಡಿದ ಪೂಜೆ ನಿಷ್ಫಲ.\n ಇದನರಿಯದಿರ್ದಡೆ ಬಳ್ಳದಲ್ಲಿ ಸುರೆಯ ತುಂಬಿ\n ಮೇಲೆ ಬೂದಿಯ ಹೂಸಿದಂತಾಯಿತ್ತು ಕಾಣಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ."},"m":{"en":"The central message of this Vachana is that true spiritual practice requires complete purity of the senses and absolute alignment between inner conduct and outward devotion.\n\nWhen the eyes that gaze upon the Ishtalinga—the sacred medium directing the mind toward the Formless Divine—look with lust at another's spouse, the divine presence vanishes from that vision.\n\nSimilarly, if the tongue that speaks of the Supreme Reality indulges in illicit sensuality, it becomes unworthy of sacred Prasada, and if the hands that worship the supreme Linga engage in impure touch, all their worship is rendered utterly fruitless.\n\nThrough the vivid metaphor of filling a vessel with liquor while smearing sacred ash on the outside, the Vachana exposes the hypocrisy of masking internal moral corruption with external religious symbols before the Supreme Reality, Kudalachannasangamadeva.","hi":"इस वचन का केंद्रीय संदेश यह है कि आध्यात्मिक साधना के लिए इंद्रियों का संयम और नैतिक पवित्रता अत्यंत आवश्यक है।\n\nयह वचन स्पष्ट करता है कि निराकार परमतत्त्व के प्रतीक इष्टलिंग का दर्शन करने वाली आँखों से यदि पराई स्त्री को बुरी दृष्टि से देखा जाए, तो वहाँ लिंग-तत्त्व का वास नहीं रहता।\n\nइसी प्रकार, परब्रह्म का उच्चारण करने वाली जिह्वा और घनलिंग की पूजा करने वाले हाथों से यदि परस्त्री के साथ अनैतिक आचरण किया जाए, तो साधक सच्चे प्रसाद से वंचित हो जाता है और उसकी सारी पूजा निष्फल हो जाती है।\n\nकूडल चन्नसंगमदेव को संबोधित करते हुए इस वचन में यह आध्यात्मिक अर्थ प्रकट हुआ है कि इस सत्य को समझे बिना केवल बाहरी आडंबर करना, मदिरा से भरे पात्र के ऊपर भस्म पोतने जैसा पाखंड मात्र है।","mr":"हे वचन आध्यात्मिक साधना आणि चारित्र्याची शुद्धता यांमधील अतूट संबंध स्पष्ट करते.\n\nज्या डोळ्यांनी निराकार परमतत्त्वाचे प्रतीक असलेल्या लिंगाचे दर्शन घ्यायचे, ज्या जिभेने परब्रह्माचा उच्चार करायचा आणि ज्या हातांनी त्याचे पूजन करायचे, त्याच इंद्रियांनी परस्त्रीची अभिलाषा धरली किंवा तिच्याशी अनैतिक संग केला, तर तेथे कोणतेही आध्यात्मिक तत्त्व उरत नाही.\n\nअशा अपवित्र आचरणाने केलेली पूजा आणि साधना पूर्णपणे निष्फळ ठरते आणि ती व्यक्ती खऱ्या प्रसादापासून दूर जाते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला उद्देशून वचनकार सांगतात की, या सत्याची जाणीव न ठेवता केलेली बाह्य भक्ती म्हणजे आत मद्य भरलेल्या मापावर बाहेरून केवळ भस्म फासण्यासारखा निव्वळ दांभिकपणा आहे.","fr":"Ce vachana met en lumière l'exigence d'une pureté absolue des sens et de la conduite chez celui qui s'engage sur la voie spirituelle centrée sur l'Ishtalinga, le support sacré de la Réalité suprême sans forme.\n\nIl explique que les yeux qui contemplent le Shivalinga, la langue qui prononce la vérité du Principe suprême et les mains qui vénèrent le Ghanalinga perdent toute leur sacralité s'ils s'abandonnent au désir charnel envers la femme d'autrui.\n\nUne telle contradiction entre la pratique extérieure et l'impureté des actes éloigne le pratiquant de la grâce véritable du Prasada et rend son culte totalement vain.\n\nÀ travers la signature spirituelle Koodalachannasangamadeva, le texte compare cette hypocrisie spirituelle à un récipient rempli d'alcool que l'on aurait simplement recouvert de cendre sacrée pour en masquer le contenu.","te":"ఆధ్యాత్మిక సాధనలో ఇంద్రియ నిగ్రహమూ, అంతరంగ-బాహ్య ఆచరణల పవిత్రతా ఎంత అవసరమో ఈ వచనం స్పష్టం చేస్తోంది.\n\nనిరాకార పరమతత్త్వానికి ప్రతీకయైన శివలింగాన్ని దర్శించే కళ్లతో పరస్త్రీని కామदృష్టితో చూస్తే అక్కడ లింగానుభూతి ఉండదని, పరబ్రహ్మ తత్త్వాన్ని పలికే నాలుకతో పరస్త్రీ అధరపానం చేస్తే అది ప్రసాదానికి దూరమవుతుందని ఈ వచనం హెచ్చరిస్తోంది.\n\nఅలాగే ఘనలింగాన్ని పూజించే చేతులతో పరస్త్రీల వక్షోజాలను తాకితే ఆ పూజ అంతా నిష్ఫలమవుతుందని వివరిస్తోంది.\n\nఈ సత్యాన్ని తెలుసుకోకుండా చేసే ఆరాధన, పాత్ర నిండా కల్లు నింపి పైన మాత్రం పవిత్రమైన విభూతిని పూసినట్లుగా కేవలం బాహ్య బూటకమే అవుతుందని కూడల చెన్నసంగమదేవ అనే అంకితనామంతో ఈ వచనం తేల్చిచెబుతోంది.","kn":"ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಸಾಕಾರ ಕುರುಹಾದ ಇಷ್ಟಲಿಂಗವನ್ನು ನೋಡುವ ಕಣ್ಣುಗಳಿಂದ ಪರಸ್ತ್ರೀಯನ್ನು ಕಾಮನೆಯಿಂದ ನೋಡಿದರೆ, ಅಲ್ಲಿ ನಿಜವಾದ ಲಿಂಗಾನುಭವ ಇರುವುದಿಲ್ಲ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.\n\nಪರಬ್ರಹ್ಮ ತತ್ತ್ವವನ್ನು ನುಡಿಯುವ ನಾಲಿಗೆಯಿಂದ ಪರಸ್ತ್ರೀಯರ ತುಟಿಯನ್ನು ಚುಂಬಿಸಿದರೆ ಅಂತಹವರು ಪ್ರಸಾದದ ಪಾವಿತ್ರ್ಯಕ್ಕೆ ದೂರವಾಗುತ್ತಾರೆ ಮತ್ತು ಘನಲಿಂಗವನ್ನು ಪೂಜಿಸುವ ಕೈಗಳಿಂದ ಪರಸ್ತ್ರೀಯರ ಎದೆಯನ್ನು ಮುಟ್ಟಿದರೆ ಅವರು ಮಾಡಿದ ಲಿಂಗಪೂಜೆಯು ಸಂಪೂರ್ಣವಾಗಿ ವ್ಯರ್ಥವಾಗುತ್ತದೆ.\n\nಅಂಗಗಳಾದ ಕಣ್ಣು, ನಾಲಿಗೆ ಮತ್ತು ಕೈಗಳು ಇಷ್ಟಲಿಂಗದ ಸಾಧನೆಯಲ್ಲಿ ತೊಡಗಿರುವಾಗ ಅವುಗಳಲ್ಲಿ ಇಂದ್ರಿಯಗಳ ಕಾಮವಿಕಾರ ಸುಳಿಯಬಾರದು; ಏಕೆಂದರೆ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಗೆ ಅಂತರಂಗ ಮತ್ತು ಬಹಿರಂಗಗಳೆರಡರ ನೈತಿಕ ಶುದ್ಧತೆಯೂ ಅತ್ಯಗತ್ಯ ಎಂಬುದು ಇಲ್ಲಿನ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ.\n\nಈ ಸತ್ಯವನ್ನು ಅರಿಯದೆ ಒಳಗೆ ಕಾಮನೆಯ ಕೊಳೆಯನ್ನು ಇಟ್ಟುಕೊಂಡು ಹೊರಗೆ ಲಿಂಗಪೂಜೆ ಮಾಡುವುದು, ಪಾತ್ರೆಯ ತುಂಬಾ ಹೆಂಡವನ್ನು ತುಂಬಿ ಅದರ ಮೇಲ್ಭಾಗಕ್ಕೆ ಮಾತ್ರ ಪವಿತ್ರವಾದ ವಿಭೂತಿಯನ್ನು ಬಳಿದಂತೆ ಕೇವಲ ಬಾಹ್ಯ ಬೂಟಾಟಿಕೆಯಾಗುತ್ತದೆ ಎಂದು ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ಅಂಕಿತದಲ್ಲಿ ಹೇಳಲಾಗಿದೆ."}},{"no":910,"o":"ಶೀಲವಂತರು ಲಕ್ಕ ಲಕ್ಕ, ನೇಮಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ವ್ರತಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ಅರ್ಥ ಪ್ರಾಣ ಅಭಿಮಾನವನೊಪ್ಪಿಸಿದ ವೈರಾಗಿಗಳು ಲಕ್ಕ ಲಕ್ಕ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯನಲ್ಲಿ ಇವರೆಲ್ಲಾ ಫಲ ಸದರ್ಥರಲ್ಲದೆ\n ಲಿಂಗ ಸದರ್ಥರಾರೂ ಇಲ್ಲ.","t":{"en":"Keepers of conduct are in hundreds of thousands, keepers of rules are in hundreds of thousands,\nkeepers of vows are in hundreds of thousands,\nrenunciates who have surrendered wealth, life, and pride are in hundreds of thousands.\nBefore Koodala Chennasangayya, all these are seekers of reward;\nnone among them is a true seeker of the *Linga*.","hi":"शीलवंत हैं लाखों-लाख, नियमनिष्ठ हैं लाखों-लाख,\nव्रतनिष्ठ हैं लाखों-लाख,\nअर्थ, प्राण और अभिमान को अर्पित करनेवाले वैरागी हैं लाखों-लाख।\nकूडल चेन्नसंगय्या के आगे ये सभी फल-सदर्थ ही हैं,\nलिंग-सदर्थ कोई भी नहीं है।","mr":"शीलवंत लाखो-लाखो आहेत, नियमनिष्ठ लाखो-लाखो आहेत,\nव्रतस्थ लाखो-लाखो आहेत,\nअर्थ, प्राण आणि अभिमान अर्पण केलेले वैरागी लाखो-लाखो आहेत.\nकूडल चेन्नसंगय्यासमोर हे सर्व फळार्थी आहेत,\nलिंगार्थी कोणीही नाही.","fr":"Ceux qui observent la pureté de conduite se comptent par centaines de milliers, ceux qui suivent les règles prescrites se comptent par centaines de milliers,\nceux qui accomplissent les vœux se comptent par centaines de milliers,\nles renonçants qui ont offert leurs biens, leur vie et leur orgueil se comptent par centaines de milliers.\nAuprès de Koodala Chennasangayya, tous ceux-là n'ont pour but que la récompense,\net il n'en est aucun qui ait le Linga pour seul but.","te":"శీలవంతులు లక్షలు లక్షలు, నియమస్థులు లక్షలు లక్షలు,\nవ్రతస్థులు లక్షలు లక్షలు,\nఅర్థ ప్రాణాభిమానములను అర్పించిన వైరాగులు లక్షలు లక్షలు.\nకూడల చెన్నసంగయ్య సన్నిధిలో వీరందరూ ఫల సదర్థులే గాని\nలింగ సదర్థులెవరూ లేరు.","kn":"ಶೀಲವಂತರು ಲಕ್ಕ ಲಕ್ಕ, ನೇಮಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ವ್ರತಸ್ಥರು ಲಕ್ಕ ಲಕ್ಕ,\n ಅರ್ಥ ಪ್ರಾಣ ಅಭಿಮಾನವನೊಪ್ಪಿಸಿದ ವೈರಾಗಿಗಳು ಲಕ್ಕ ಲಕ್ಕ.\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯನಲ್ಲಿ ಇವರೆಲ್ಲಾ ಫಲ ಸದರ್ಥರಲ್ಲದೆ\n ಲಿಂಗ ಸದರ್ಥರಾರೂ ಇಲ್ಲ."},"m":{"en":"This Vachana draws a sharp distinction between spiritual practices motivated by the desire for rewards and pure devotion directed solely towards the Supreme Reality.\n\nIt observes that while there are hundreds of thousands who strictly observe moral codes, religious rules, and vows, or even renounce their wealth, life, and pride as ascetics, such outward sacrifices alone do not signify the highest spiritual realization.\n\nIn the awareness of Kudalachannasanga, the Formless Supreme Consciousness, all these practitioners remain bound by an attachment to the fruits of their actions rather than being genuinely centred on Linga.\n\nThe spiritual significance of this Vachana lies in its insistence that true realization requires transcending result-oriented austerity and dedicating oneself purely to the Absolute without any expectation of return.","hi":"इस वचन का मूल भाव यह है कि आध्यात्मिक मार्ग में बाहरी सदाचार, नियम-पालन और कठोर व्रत का अभ्यास करने वाले साधक लाखों की संख्या में मिल जाते हैं।\n\nयहाँ तक कि अपना धन, प्राण और स्वाभिमान समर्पित करने वाले वैरागी भी इस संसार में अनगिनत हैं।\n\nकिंतु यह वचन स्पष्ट करता है कि ऐसे अधिकांश लोग किसी न किसी प्रतिफल, स्वार्थ या फल की आकांक्षा से ही ये साधनाएँ करते हैं।\n\nनिराकार परमतत्त्व कूडलचन्नसंगम में बिना किसी फल की कामना के, केवल विशुद्ध लिंग-तत्त्व के साक्षात्कार और एकत्व के लिए समर्पित होने वाले सच्चे साधक अत्यंत दुर्लभ हैं।","mr":"हे वचन बाह्य आचरण, व्रत-नियम आणि फळाची अपेक्षा ठेवून केलेल्या त्यागापेक्षा निष्काम लिंगनिष्ठेचे आध्यात्मिक महत्त्व स्पष्ट करते.\n\nजगात सदाचारी, कडक नियम पाळणारे, व्रतस्थ आणि स्वतःची संपत्ती, प्राण व अभिमान अर्पण करणारे वैरागी लाखोच्या संख्येने आढळतात.\n\nपरंतु कूडलचन्नसंगम या परमतत्त्वाच्या ठाई हे सर्व लोक केवळ विशिष्ट फळाची किंवा पुण्याची अपेक्षा बाळगणारे साधक ठरतात.\n\nकोणत्याही फळाची कामना न ठेवता केवळ शुद्ध चैतन्यस्वरूप लिंगाच्याच प्राप्तीसाठी समर्पित असलेले खरे साधक अत्यंत दुर्मिळ असतात, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana établit une distinction essentielle entre l'observance spirituelle motivée par l'attente d'une récompense et la quête désintéressée de la Vérité absolue.\n\nIl souligne que l'on trouve par centaines de milliers des personnes vertueuses, des pratiquants assidus aux règles et aux vœux, ainsi que des renonçants prêts à offrir leurs biens, leur vie et leur amour-propre.\n\nCependant, face à Koodalachannasanga, la Réalité suprême sans forme, tous ces chercheurs restent attachés aux fruits de leurs actes méritoires plutôt qu'à l'essence même du divin.\n\nLa portée spirituelle de ce vachana réside dans l'idée que la véritable réalisation ne consiste pas à accumuler des austérités dans l'espoir d'un gain futur, mais à s'orienter exclusivement vers le Linga comme seule finalité ultime.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, బాహ్యమైన ఆచార నియమాలు, వ్రతాలు, త్యాగాలకు, నిష్కామమైన పరమతత్త్వ నిష్ఠకు మధ్య ఉన్న మౌలికమైన భేదాన్ని ఇది స్పష్టం చేస్తోంది.\n\nలోకంలో శీలవంతులు, నియమనిష్ఠలు పాటించేవారు, వ్రతాలు ఆచరించేవారు, చివరకు తమ ధనాన్ని, ప్రాణాన్ని, అభిమానాన్ని సైతం త్యాగం చేసిన వైరాగులు లక్షల సంఖ్యలో కనిపిస్తారు.\n\nఅయితే కూడలచెన్నసంగమ అనే నిరాకార పరమతత్త్వ దృష్టితో పరిశీలిస్తే, వీరందరూ తమ సాధనల ద్వారా ఏదో ఒక ప్రతిఫలాన్ని ఆశించేవారే తప్ప, నిర్గుణ పరమచైతన్యాన్ని మాత్రమే పరమార్థంగా భావించే నిజమైన సాధకులు కారు.\n\nఏ ప్రతిఫలాపేక్ష లేకుండా కేవలం లింగతత్త్వ సాక్షాత్కారాన్నే ఏకైక లక్ష్యంగా పెట్టుకున్న నిస్వార్థ సాధకులు అత్యంత అరుదు అని ఈ వచనం తెలియజేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಲೋಕದಲ್ಲಿ ಕಟ್ಟುನಿಟ್ಟಾದ ಶೀಲ, ನೇಮ, ವ್ರತಗಳನ್ನು ಆಚರಿಸುವವರು ಮತ್ತು ತಮ್ಮ ಆಸ್ತಿ, ಪ್ರಾಣ, ಅಭಿಮಾನಗಳನ್ನೆಲ್ಲಾ ತ್ಯಾಗ ಮಾಡಿದ ವೈರಾಗಿಗಳು ಲಕ್ಷಾಂತರ ಜನ ಸಿಗುತ್ತಾರೆ.\n\nಆದರೆ ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ನೆಲೆಯಲ್ಲಿ ನೋಡಿದಾಗ, ಇವರೆಲ್ಲರೂ ತಮ್ಮ ಆಚರಣೆಗಳಿಂದ ಏನಾದರೊಂದು ಪ್ರತಿಫಲವನ್ನು ಅಥವಾ ಪುಣ್ಯವನ್ನು ಬಯಸುವವರೇ ಆಗಿದ್ದಾರೆ ಎಂಬುದನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಯಾವುದೇ ಫಲಾಪೇಕ್ಷೆಯಿಲ್ಲದೆ ಕೇವಲ ಆ ಪರಮಚೈತನ್ಯದ ಅರಿವು ಮತ್ತು ಐಕ್ಯವನ್ನೇ ತಮ್ಮ ಏಕೈಕ ಗುರಿಯನ್ನಾಗಿ ಮಾಡಿಕೊಂಡ 'ಲಿಂಗಸದರ್ಥರು' ಯಾರೂ ಇಲ್ಲ ಎಂಬ ಆಳವಾದ ತಾತ್ವಿಕ ಸತ್ಯವನ್ನು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ."}},{"no":911,"o":"ಶೀಲವಂತರು ಶೀಲವಂತರೆಂದೆಂಬರು ನಾವಿದನರಿಯೆವಯ್ಯ.\n ಅಂಗನೆಯರ ಅಧರಪಾನವು\n ತನ್ನ ಉದರವ ಹೊಗುವನ್ನಕ್ಕ ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಈಷಣತ್ರಯವೆಂಬ ಸೊಣಗ ಬೆಂಬತ್ತಿ ಬರುತ್ತಿರಲು ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಹೆರಸಾರಿ ಮನವು ಮಹದಲ್ಲಿ ನಿಂದರೆ ಶೀಲ,\n ಪರಿಣಾಮ ನೆಲೆಗೊಂಡರೆ ಶೀಲ.\n ಇದು ಕಾರಣ ಕೂಡಲ ಚೆನ್ನಸಂಗನಲ್ಲಿ ಶೀಲವಂತರಪೂರ್ವ.","t":{"en":"They speak of the virtuous, the virtuous—we do not know of this, O Lord.\nSo long as the nectar of women's lips\nenters one's belly, where is there virtue?\nWhen the dog called the three worldly cravings comes hounding at one's heels, where is there virtue?\nWhen the mind steps aside from the world and abides in the Supreme, that is virtue;\nwhen inner serenity becomes firmly established, that is virtue.\nTherefore, before Koodala Chennasanga, the truly virtuous are rare indeed.","hi":"शीलवंत हैं, शीलवंत हैं, ऐसा कहते हैं; हम यह नहीं जानते, हे स्वामी।\nअंगनाओं का अधर-पान\nजब तक अपने उदर में प्रवेश करता रहे, तब तक शील कहाँ का?\nएषणात्रय कहनेवाला श्वान जब पीछे लगा आ रहा हो, तो शील कहाँ का?\nपीछे हटकर मन जब महान में स्थिर हो जाए, तभी शील है,\nपरिणाम जब टिक जाए, तभी शील है।\nइसी कारण, कूडलचेन्नसंग में शीलवंत अपूर्व हैं।","mr":"शीलवंत, शीलवंत असे लोक म्हणतात, हे आम्ही जाणत नाही, हे प्रभो.\nजोपर्यंत स्त्रियांचे अधरपान\nआपल्या उदरात जात आहे, तोपर्यंत शील कुठले?\nईषणात्रय नावाचे कुत्रे पाठीशी लागून येत असताना शील कुठले?\nमागे फिरून मन महातच स्थिरावले तर ते शील,\nप्रसन्नता स्थिरावली तर ते शील.\nया कारणास्तव, कूडल चेन्नसंगाच्या ठायी शीलवंत दुर्मीळ आहेत.","fr":"On les appelle hommes de pure observance, hommes de pure observance — nous ne comprenons pas cela, Ô Seigneur.\nTant que le nectar des lèvres des femmes\nentre dans son propre ventre, d'où viendrait la pure observance ?\nQuand le chien de ce que l'on appelle la triple convoitise le poursuit sans relâche, d'où viendrait la pure observance ?\nSi l'esprit, se retirant du monde, demeure dans l'Infini, voilà la pure observance ;\nsi la plénitude intérieure s'établit fermement, voilà la pure observance.\nC'est pourquoi, auprès de Koodala Chennasanga, rares sont ceux de pure observance.","te":"శీలవంతులు శీలవంతులని అంటారు, మేము దీనిని ఎరుగమయ్యా.\nఅంగనల అధరపానం\nతన ఉదరంలోకి ప్రవేశించేంతవరకు శీలమెక్కడిదో?\nఈషణత్రయమనే కుక్క వెంటబడి వస్తుండగా శీలమెక్కడిదో?\nవెనుదిరిగి మనసు మహత్తులో నిలిస్తే అది శీలం,\nపరిణామం నెలకొంటే అది శీలం.\nఇందువలన కూడల చెన్నసంగని సన్నిధిలో శీలవంతులు అరుదు.","kn":"ಶೀಲವಂತರು ಶೀಲವಂತರೆಂದೆಂಬರು ನಾವಿದನರಿಯೆವಯ್ಯ.\n ಅಂಗನೆಯರ ಅಧರಪಾನವು\n ತನ್ನ ಉದರವ ಹೊಗುವನ್ನಕ್ಕ ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಈಷಣತ್ರಯವೆಂಬ ಸೊಣಗ ಬೆಂಬತ್ತಿ ಬರುತ್ತಿರಲು ಶೀಲವೆಲ್ಲಿಯದೊ?\n ಹೆರಸಾರಿ ಮನವು ಮಹದಲ್ಲಿ ನಿಂದರೆ ಶೀಲ,\n ಪರಿಣಾಮ ನೆಲೆಗೊಂಡರೆ ಶೀಲ.\n ಇದು ಕಾರಣ ಕೂಡಲ ಚೆನ್ನಸಂಗನಲ್ಲಿ ಶೀಲವಂತರಪೂರ್ವ."},"m":{"en":"This Vachana examines the true meaning of *Sheela*—spiritual integrity and purity of conduct—by questioning superficial claims of virtue.\n\nIt points out that genuine purity cannot exist as long as a person indulges in sensual desires or remains hounded by the three worldly cravings for wealth, progeny, and attachments, which are vividly compared to a relentless hound.\n\nTrue *Sheela* arises only when the mind steps back from these outer compulsions, rests steadily in the Supreme Reality, and achieves deep inner transformation and fulfilment.\n\nAddressing the Formless Divine as Kudalachannasanga, the Vachana concludes that because such inward mastery and spiritual serenity are so demanding, those who truly embody this authentic purity are exceedingly rare.","hi":"यह वचन स्पष्ट करता है कि जो लोग केवल बाहरी आडंबर से स्वयं को शीलवान कहते हैं, उनके इस दावे में कोई वास्तविक सत्य नहीं है।\n\nजब तक व्यक्ति स्त्री-वासना में लिप्त रहता है तथा पुत्र, धन और पत्नी की तीन सांसारिक तृष्णाओं (एषणात्रय) रूपी कुत्ते उसके पीछे पड़े रहते हैं, तब तक उसमें सच्चे शील का होना असंभव है।\n\nइस वचन का केंद्रीय संदेश यह है कि सांसारिक वासनाओं से पीछे हटकर जब मन महान परमतत्त्व में स्थिर हो जाता है और चित्त में गहन आध्यात्मिक शांति एवं तृप्ति स्थापित हो जाती है, तभी उसे सच्चा शील कहा जाता है।\n\nयही कारण है कि निराकार परमतत्त्व कूडलचन्नसंगम में ऐसे सच्चे शीलवान साधक अत्यंत दुर्लभ और अपूर्व होते हैं।","mr":"हे वचन वरवरच्या शीलपालनाचा दावा करणाऱ्या ढोंगी वृत्तीवर भाष्य करून खऱ्या शीलाचे स्वरूप स्पष्ट करते.\n\nजोवर माणूस कामवासनेच्या आहारी जाऊन स्त्रीसुखात गुंतलेला आहे आणि पुत्रैषणा, वित्तैषणा व लोकैषणा या तीन तीव्र इच्छारूपी कुत्र्यांचा पाठलाग त्याच्या मागे सुरू आहे, तोवर त्याच्याकडे खरे शील असूच शकत नाही.\n\nजेव्हा मन या सर्व बाह्य मोहातून मागे फिरून परमतत्त्वाच्या महानतेत स्थिर होते आणि अंतःकरणात आध्यात्मिक तृप्ती व पूर्णत्व नांदू लागते, तेव्हाच खरे शील प्रगट होते.\n\nम्हणूनच, कूडलचन्नसंगम या परमतत्त्वाच्या ठायी अशा प्रकारे मन पूर्णपणे एकरूप झालेले खरे शीलवंत अत्यंत दुर्मिळ असतात, हे या वचनातून अधोरेखित होते.","fr":"Ce vachana remet en question ceux qui se proclament vertueux en démontrant que la véritable pureté morale et spirituelle ne se résume pas à des apparences extérieures.\n\nTant que l'être humain demeure esclave des plaisirs charnels et qu'il est sans cesse poursuivi, tel un chien affamé, par la triple soif de la richesse, de la terre et de la chair, il ne saurait prétendre à aucune vertu authentique.\n\nLa vraie discipline spirituelle ne s'accomplit que lorsque l'esprit se détourne de ces convoitises mondaines pour s'ancrer fermement dans l'Infini et atteindre un état de plénitude intérieure immuable.\n\nC'est pourquoi, au regard de la Réalité suprême sans forme invoquée sous le nom de Koodalachannasangama, les êtres véritablement vertueux demeurent extrêmement rares.","te":"ఈ వచనం నిజమైన శీలానికి, బాహ్యమైన శీలాచారాల ప్రదర్శనకు మధ్య ఉన్న మౌలికమైన వ్యత్యాసాన్ని స్పష్టంగా వివరిస్తోంది.\n\nలోకంలో చాలామంది తమను తాము శీలవంతులమని చెప్పుకుంటారు గానీ, స్త్రీల అధరపానమనే కామవాంఛలు మరియు ధన, దార, పుత్రులనే మూడు విధాలైన ప్రాపంచిక ఆశలు (ఈషణత్రయం) కుక్కలా వెంటాడుతున్నంత కాలం మనిషికి నిజమైన శీలం ఉండజాలదు.\n\nమనస్సు ప్రాపంచిక విషయవాంఛల నుండి పూర్తిగా వెనుదిరిగి ఆ మహత్తరమైన నిరాకార పరమతత్త్వంలో నిలిచినప్పుడే, ఆ ఆధ్యాత్మిక పరిణామంలో పరమ ప్రశాంతత కుదురుకున్నప్పుడే అది నిజమైన శీలమవుతుంది.\n\nఅందువల్ల, కూడల చెన్నసంగ అనే నిర్గుణ పరమచైతన్యంలో అటువంటి ఆంతరిక విశుద్ధిని సాధించిన నిజమైన శీలవంతులు చాలా అరుదుగా ఉంటారని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನವು ನಿಜವಾದ 'ಶೀಲ' ಎಂದರೆ ಏನು ಎಂಬುದನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತಾ, ಬರೀ ಬಾಹ್ಯ ಆಚರಣೆಗಳಿಂದ ತಮ್ಮನ್ನು ಶೀಲವಂತರು ಎಂದು ಕರೆದುಕೊಳ್ಳುವವರ ಡಾಂಭಿಕತೆಯನ್ನು ಪ್ರಶ್ನಿಸುತ್ತದೆ.\n\nಹೆಣ್ಣಿನ ತುಟಿಯ ಎಂಜಲನ್ನು ನುಂಗುವ ದೇಹದ ಬಯಕೆ ಇರುವವರೆಗೆ ಮತ್ತು ಹೆಣ್ಣು, ಹೊನ್ನು, ಮಣ್ಣು ಎಂಬ ಮೂರು ಆಸೆಗಳು ನಾಯಿಯಂತೆ ಬೆನ್ನುಹತ್ತಿ ಬರುತ್ತಿರುವವರೆಗೆ ಮನುಷ್ಯನಲ್ಲಿ ನಿಜವಾದ ಶೀಲ ಇರಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\nಪ್ರಾಪಂಚಿಕ ಆಸೆಗಳಿಂದ ಹಿಂದೆ ಸರಿದು, ಮನಸ್ಸು ಪರಮತತ್ತ್ವವಾದ 'ಮಹತ್ತು'ವಿನಲ್ಲಿ ನೆಲೆಗೊಂಡು, ಅಂತರಂಗದಲ್ಲಿ ಪೂರ್ಣವಾದ ತೃಪ್ತಿ ಹಾಗೂ ಸಮಾಧಾನ ನೆಲೆಯೂರಿದಾಗ ಮಾತ್ರ ಅದು ನಿಜವಾದ ಶೀಲವಾಗುತ್ತದೆ.\n\nಹೀಗೆ ಬಾಹ್ಯ ನಿಯಮಗಳಿಗಿಂತ ಮನಸ್ಸಿನ ಪರಿವರ್ತನೆ ಮತ್ತು ಅರಿವಿನ ಸ್ಥಿತಿಯೇ ನಿಜವಾದ ಶೀಲವಾಗಿರುವುದರಿಂದ, ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದಲ್ಲಿ ಇಂತಹ ನಿಜವಾದ ಶೀಲವಂತರು ಸಿಗುವುದು ಬಹಳ ಅಪರೂಪ ಎಂದು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ."}},{"no":912,"o":"ಶೀಲವಂತರೆಲ್ಲಾ ಶೀಲವಂತರಯ್ಯಾ,\n ಭಾಷೆವಂತರೆಲ್ಲಾ ಭಾಷೆವಂತರಯ್ಯಾ,\n ವ್ರತವಂತರೆಲ್ಲಾ ವ್ರತವಂತರಯ್ಯಾ,\n ಸತ್ಯವಂತರೆಲ್ಲಾ ಸತ್ಯವಂತರಯ್ಯಾ,\n ನೇಮವಂತರೆಲ್ಲಾ ನೇಮವಂತರಯ್ಯಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಯ್ಯಾ\n ಸಂಗನಬಸವಣ್ಣನೊಬ್ಬನೆ ಲಿಂಗವಂತ.","t":{"en":"All who keep disciplines of purity are men of purity, O Lord,\nall who keep their solemn word are men of their word, O Lord,\nall who keep sacred vows are men of vows, O Lord,\nall who keep truth are men of truth, O Lord,\nall who keep strict observances are men of observance, O Lord,\nO Lord Koodala Chennasangamadeva,\nSanganabasavanna alone is the one united with *Linga*.","hi":"सभी शीलवंत शीलवंत हैं, हे स्वामी,\nसभी वचनवंत वचनवंत हैं, हे स्वामी,\nसभी व्रतवंत व्रतवंत हैं, हे स्वामी,\nसभी सत्यवंत सत्यवंत हैं, हे स्वामी,\nसभी नेमवंत नेमवंत हैं, हे स्वामी,\nहे कूडल चेन्नसंगमदेव,\nसंगनबसवराणा ही एकमात्र लिंगवंत हैं।","mr":"शीलवंत सर्व शीलवंतच आहेत, हे प्रभो,\nवचनवंत सर्व वचनवंतच आहेत, हे प्रभो,\nव्रतवंत सर्व व्रतवंतच आहेत, हे प्रभो,\nसत्यवंत सर्व सत्यवंतच आहेत, हे प्रभो,\nनेमवंत सर्व नेमवंतच आहेत, हे प्रभो,\nहे कूडल चेन्नसंगमदेवा,\nकेवळ संगनबसवण्णाच एकमेव लिंगवंत आहेत।","fr":"Tous les gens de pure conduite sont des gens de pure conduite, ô Seigneur,\nTous les gens de parole donnée sont des gens de parole donnée, ô Seigneur,\nTous les gens de vœux sont des gens de vœux, ô Seigneur,\nTous les gens de vérité sont des gens de vérité, ô Seigneur,\nTous les gens d'observance sont des gens d'observance, ô Seigneur,\nÔ Seigneur Koodala Chennasangamadeva,\nSanganabasavanna seul est Lingavanta.","te":"శీలవంతులందరూ శీలవంతులే ఓ స్వామీ,\nభాషావంతులందరూ భాషావంతులే ఓ స్వామీ,\nవ్రతవంతులందరూ వ్రతవంతులే ఓ స్వామీ,\nసత్యవంతులందరూ సత్యవంతులే ఓ స్వామీ,\nనియమవంతులందరూ నియమవంతులే ఓ స్వామీ,\nఓ కూడల చెన్నసంగమదేవా\nసంగనబసవన్న ఒక్కరే లింగవంతులు.","kn":"ಶೀಲವಂತರೆಲ್ಲಾ ಶೀಲವಂತರಯ್ಯಾ,\n ಭಾಷೆವಂತರೆಲ್ಲಾ ಭಾಷೆವಂತರಯ್ಯಾ,\n ವ್ರತವಂತರೆಲ್ಲಾ ವ್ರತವಂತರಯ್ಯಾ,\n ಸತ್ಯವಂತರೆಲ್ಲಾ ಸತ್ಯವಂತರಯ್ಯಾ,\n ನೇಮವಂತರೆಲ್ಲಾ ನೇಮವಂತರಯ್ಯಾ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಯ್ಯಾ\n ಸಂಗನಬಸವಣ್ಣನೊಬ್ಬನೆ ಲಿಂಗವಂತ."},"m":{"en":"This Vachana explains that many seekers may excel in specific virtues and disciplines such as moral conduct (Sheela), adherence to vows (Vrata), truthfulness (Satya), keeping one's word (Bhashe), or strict observance of rules (Nema).\n\nWhile these individuals remain defined by and confined to the particular austerity or ethical principle they practice, they do not necessarily embody the totality of the spiritual path.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kudalachannasanganadeva, the Vachana highlights that Sanganabasavanna alone stands out as a true Lingavanta.\n\nThe spiritual significance of this distinction is that while others master isolated virtues, Sanganabasavanna transcends rigid, fragmented observances by integrating all ethical and spiritual values into a complete, living union with the Divine (Linga).","hi":"इस वचन का केंद्रीय भाव यह है कि आध्यात्मिक साधना के व्यक्तिगत सद्गुणों और पूर्ण लिंग-चेतना के बीच एक गहरा अंतर होता है।\n\nयहाँ स्पष्ट किया गया है कि जो साधक शील, अपने वचन या प्रतिज्ञा, व्रत, सत्य अथवा विशेष नियमों का निष्ठापूर्वक पालन करते हैं, वे मुख्य रूप से अपने-अपने विशिष्ट गुणों या साधनाओं तक ही सीमित रहते हैं।\n\nअंतिम पंक्तियों में निराकार परमतत्त्व कूडल चन्नसंगमदेव को साक्षी मानकर यह रेखांकित किया गया है कि इन सभी अलग-अलग साधनाओं से ऊपर उठकर, केवल संगनबसवण्ण ही एकमात्र ऐसे सच्चे 'लिंगवंत' हैं जो स्वयं लिंगतत्त्व के साथ पूर्णतः एकरूप हो चुके हैं।\n\nइस वचन का आध्यात्मिक महत्त्व यह दर्शाने में है कि बाह्य नियमों और खंडित व्रतों के पालन से कहीं श्रेष्ठ स्थिति संगनबसवण्ण की भाँति समग्र लिंग-चेतना को अपने जीवन में आत्मसात करना है।","mr":"हे वचन विविध बाह्य आचार आणि खरा लिंगानुभव यांतील सूक्ष्म भेद स्पष्ट करते.\n\nजे लोक शील, वचनबद्धता, व्रत, सत्य किंवा नियमांचे पालन करतात, ते केवळ आपापल्या विशिष्ट नेमणुकीपुरतेच मर्यादित राहतात.\n\nअशा एखाद्या एकांगी गुणवैशिष्ट्यात अडकून राहणे म्हणजे पूर्ण आध्यात्मिक स्थिती नव्हे, तर ती केवळ त्या त्या आचरणाची ओळख ठरते.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला स्मरून हे वचन अधोरेखित करते की, या सर्व बाह्य नियमांच्या पलीकडे जाऊन अखंड लिंगभावात एकरूप झालेले संगनबसवण्ण हेच एकमेव खरे 'लिंगवंत' आहेत.","fr":"Ce vachana établit une distinction essentielle entre l'observance de disciplines morales particulières et la plénitude de la réalisation spirituelle.\n\nCeux qui se consacrent à une seule vertu — qu'il s'agisse de la rectitude morale, de la fidélité à la parole donnée, de l'accomplissement des vœux, de la vérité ou des règles de conduite — demeurent définis et limités par cette pratique spécifique.\n\nAdressé à la Réalité suprême sans forme sous le nom de Koodala Channasangamadeva, le texte souligne que Sanganabasavanna est l'unique véritable Lingavanta, car il transcende ces observances partielles pour incarner dans sa totalité la conscience vivante du Linga.","te":"ఈ వచనం బాహ్యమైన నియమనిষ্ঠలకూ, నిజమైన లింగతత్త్వ అనుభూతికీ మధ్య ఉన్న ఉన్నతమైన భేదాన్ని స్పష్టం చేస్తోంది.\n\nలోకంలో ఆచారశీలురు తమ శీలనిষ্ঠకే, ఆడిన మాటకు కట్టుబడేవారు తమ బాసకే, వ్రతాలు ఆచరించేవారు తమ వ్రతాలకే, సత్యవంతులు సత్యానికే, నియమబద్ధులు తమ నియమాలకే పరిమితమై ఉంటారు.\n\nఅలాంటి విడివిడి గుణాలు లేదా ఆచారాలకే పరిమితం కాకుండా, నిరాకార పరమతత్త్వమైన కూడల చెన్నసంగమదేవ సాక్షిగా సంగనబసవణ్ణ ఒక్కడే సమగ్రమైన లింగైక్య స్థితిని పొందిన నిజమైన 'లింగవంతుడు' అని ఈ వచనం చాటుతోంది.","kn":"ಈ ವಚನವು ನಿರ್ದಿಷ್ಟವಾದ ಒಂದೊಂದು ಆಚರಣೆಯನ್ನು ಮಾಡುವವರಿಗೂ ಮತ್ತು ನಿಜವಾದ ಅರ್ಥದಲ್ಲಿ ಲಿಂಗತತ್ತ್ವದಲ್ಲಿ ಒಂದಾಗಿ ಬದುಕುವವನಿಗೂ ಇರುವ ಆಳವಾದ ವ್ಯತ್ಯಾಸವನ್ನು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ.\n\nಶೀಲವನ್ನು ಕಾಪಾಡಿಕೊಳ್ಳುವವರು ಶೀಲವಂತರೆನಿಸಿಕೊಳ್ಳುತ್ತಾರೆ, ಕೊಟ್ಟ ಮಾತಿಗೆ ತಪ್ಪದೆ ನಡೆಯುವವರು ಭಾಷೆವಂತರಾಗುತ್ತಾರೆ, ಹಾಗೆಯೇ ವ್ರತ, ಸತ್ಯ ಮತ್ತು ನೇಮಗಳನ್ನು ಪಾಲಿಸುವವರು ಆ ನಿರ್ದಿಷ್ಟ ಗುಣ ಅಥವಾ ಆಚರಣೆಗಳಿಗೆ ಮಾತ್ರ ಸೀಮಿತರಾದವರಾಗಿರುತ್ತಾರೆ.\n\nಆದರೆ ಇಂತಹ ಬೇರೆ ಬೇರೆ ನಿಯಮಗಳ ಚೌಕಟ್ಟನ್ನು ಮೀರಿ, ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವನ ಅರಿವಿನಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ಬೆರೆತು ಬದುಕಿದ ಸಂಗನಬಸವಣ್ಣನೊಬ್ಬನೇ ನಿಜವಾದ ಲಿಂಗವಂತನಾಗಿದ್ದಾನೆ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":913,"o":"ಶೀಲ ಶೀಲವೆಂದು ಗರ್ವಿಸಿ ನುಡಿವುತಿಪ್ಪರು, ಶೀಲವಾವುದೆಂದರಿಯರು.\n ಇದ್ದುದ ವಂಚನೆಯ ಮಾಡದಿಪ್ಪುದೆ ಶೀಲ,\n ಇಲ್ಲದಿದ್ದುದಕ್ಕೆ ಕಡನ ಬೇಡದಿಪ್ಪ್ಪುದೆ ಶೀಲ,\n ಪರಧನ ಪರಸತಿಗೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಪರದೈವ ಪರಸಮಯಕ್ಕೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಗುರುನಿಂದೆ ಶಿವನಿಂದೆ ಜಂಗಮನಿಂದೆಯ ಕೇಳದಿಪ್ಪುದೆ ಶೀಲ,\n ಕೂಡಲಚೆನ್ನಸಂಗನ ಶರಣರ ಬರವಿಂಗೆ\n ಮುಯ್ಯಾಂತು ಪರಿಣಾಮಿಸ ಬಲ್ಲರೆ ಅಚ್ಚಶೀಲ.","t":{"en":"They boastfully speak of moral conduct, saying, \"Moral conduct, moral conduct,\" yet they do not know what moral conduct is.\nNot withholding through deceit what one possesses is moral conduct,\nNot begging for a loan for what one does not possess is moral conduct,\nNot coveting another's wealth or another's wife is moral conduct,\nNot yearning for other deities or other creeds is moral conduct,\nNot listening to the slander of the Guru, the slander of Shiva, or the slander of the *Jangama* is moral conduct,\nAt the arrival of the *Sharanas* of Koodalachennasanga,\nIf one can step forward to welcome them and rejoice, that is pure moral conduct.","hi":"शील, शील कहकर गर्व से बोलते रहते हैं, शील क्या है यह नहीं जानते।\nजो है, उसे न छिपाना ही शील है,\nजो नहीं है, उसके लिए ऋण न माँगना ही शील है,\nपरधन और परस्त्री की कामना न करना ही शील है,\nपरदैव और परमत की कामना न करना ही शील है,\nगुरु-निंदा, शिव-निंदा और जंगम-निंदा को न सुनना ही शील है,\nकूडलचेन्नसंग के शरणों के आगमन पर,\nसम्मुख होकर तृप्त हो सकें, तो वही खरा शील है।","mr":"शील, शील म्हणून गर्वाने बोलत राहतात, पण शील कोणते हे ते जाणत नाहीत.\nअसलेल्याची वंचना न करणे हेच शील,\nनसलेल्यासाठी कर्ज न मागणे हेच शील,\nपरधनाची व परस्त्रीची अभिलाषा न बाळगणे हेच शील,\nपरदैवताची व परमताची ओढ न धरणे हेच शील,\nगुरुनिंदा, शिवनिंदा आणि जंगमनिंदा न ऐकणे हेच शील,\nकूडलचेन्नसंगाच्या शरणांच्या आगमनास\nसामोरं जाऊन प्रफुल्लित होता आले, तर तेच निखळ शील.","fr":"En parlant avec orgueil de la pure conduite, toujours de la pure conduite, ils ignorent ce qu'est la pure conduite.\nNe pas dissimuler par tromperie ce que l'on possède, voilà la pure conduite ;\nNe pas demander d'emprunt pour ce que l'on ne possède pas, voilà la pure conduite ;\nNe pas convoiter le bien d'autrui ni l'épouse d'autrui, voilà la pure conduite ;\nNe pas aspirer aux divinités étrangères ni aux doctrines étrangères, voilà la pure conduite ;\nNe pas écouter le dénigrement du Guru, le dénigrement de Shiva ni le dénigrement du Jangama, voilà la pure conduite ;\nÀ la venue des Sharanas de Koodalachannasanga,\nsavoir se donner de tout son être et s'épanouir dans la joie sereine, voilà la pure conduite véritable.","te":"శీలం శీలమని గర్వించి పలుకుతుంటారు, శీలం ఏమిటో ఎరుగరు.\nఉన్నదానిని వంచన చేయకుండుటే శీలం,\nలేనిదానికై అప్పు అడగకుండుటే శీలం,\nపరధనానికి పరసతికి ఆశపడకుండుటే శీలం,\nపరదైవానికి పరసమయానికి ఆశపడకుండుటే శీలం,\nగురునిందను శివనిందను జంగమనిందను వినకుండుటే శీలం,\nకూడలచెన్నసంగని శరణుల రాకకు\nఎదురేగి నమస్కరించి ఆనందించగలిగితే అదే స్వచ్ఛమైన శీలం.","kn":"ಶೀಲ ಶೀಲವೆಂದು ಗರ್ವಿಸಿ ನುಡಿವುತಿಪ್ಪರು, ಶೀಲವಾವುದೆಂದರಿಯರು.\n ಇದ್ದುದ ವಂಚನೆಯ ಮಾಡದಿಪ್ಪುದೆ ಶೀಲ,\n ಇಲ್ಲದಿದ್ದುದಕ್ಕೆ ಕಡನ ಬೇಡದಿಪ್ಪ್ಪುದೆ ಶೀಲ,\n ಪರಧನ ಪರಸತಿಗೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಪರದೈವ ಪರಸಮಯಕ್ಕೆಳಸದಿಪ್ಪುದೆ ಶೀಲ,\n ಗುರುನಿಂದೆ ಶಿವನಿಂದೆ ಜಂಗಮನಿಂದೆಯ ಕೇಳದಿಪ್ಪುದೆ ಶೀಲ,\n ಕೂಡಲಚೆನ್ನಸಂಗನ ಶರಣರ ಬರವಿಂಗೆ\n ಮುಯ್ಯಾಂತು ಪರಿಣಾಮಿಸ ಬಲ್ಲರೆ ಅಚ್ಚಶೀಲ."},"m":{"en":"This Vachana critiques those who boast about possessing spiritual discipline and moral integrity (Sheela) without truly understanding what it means in practice.\n\nIt defines genuine virtue not as rigid ritualism, but as ethical living: sharing what one has without deceit, refraining from borrowing when one lacks means, and remaining completely free from coveting another's wealth or spouse.\n\nIn the spiritual realm, true integrity requires unwavering fidelity to the Formless Supreme Reality without straying toward other deities or sects, and refusing to listen to the slander of the Guru, the Divine, or the Jangama—the enlightened spiritual seekers.\n\nUltimately, addressing the Supreme Reality as Kudalachannasanga, the Vachana concludes that the purest form of virtue lies in welcoming the arrival of the Sharanas with wholehearted devotion and experiencing deep inner joy in their presence.","hi":"इस वचन का केंद्रीय भाव यह है कि लोग अपने सदाचार या 'शील' के नाम पर व्यर्थ ही अहंकार करते हैं, किंतु वे वास्तविक शील का अर्थ नहीं जानते।\n\nयहाँ स्पष्ट किया गया है कि अपने पास उपलब्ध वस्तु या संसाधन को न छिपाना, और जो अपने पास नहीं है उसके लिए किसी से ऋण न माँगना ही सच्चा शील है।\n\nइसके साथ ही पराये धन और परायी स्त्री की कामना न करना, अन्य देवताओं व मत-पंथों के प्रति आकर्षित न होना, तथा गुरु, शिव और आध्यात्मिक साधकों (जंगम) की निंदा न सुनना ही वास्तविक सदाचार के लक्षण हैं।\n\nअंत में यह वचन इंगित करता है कि परमतत्त्व कूडलचेन्नसंग के शरणों के आगमन पर पूरी निष्ठा से उनकी सेवा करना और मन में परम संतोष व आनंद का अनुभव करना ही सबसे विशुद्ध शील (अच्चशील) है।","mr":"अनेक जण आपल्याकडे 'शील' म्हणजेच नैतिक आचार असल्याचा व्यर्थ अभिमान बाळगतात, परंतु खऱ्या अर्थाने शील म्हणजे काय, याचे नेमके भान त्यांना नसते, असे हे वचन स्पष्ट करते.\n\nआपल्याकडे जे आहे त्यात कपट किंवा फसवणूक न करणे, जे नाही त्यासाठी कर्ज न काढणे, तसेच परक्याचे धन आणि परस्त्रीची अभिलाषा न बाळगणे या नैतिक निष्ठाच खरे शील ठरतात.\n\nअन्य दैवते किंवा परमतांकडे मन वळू न देणे आणि गुरू, परमतत्त्व व प्रबोधन करणाऱ्या ज्ञानी साधकरूपी जंगमांची निंदा न ऐकणे, ही आध्यात्मिक एकनिष्ठा येथे शीलाचाच भाग मानली आहे.\n\nया सर्वांसोबतच, कूडलचन्नसंगम या निराकार परमतत्त्वाशी एकरूप झालेल्या शरणांच्या आगमनाने ज्याचे अंतःकरण कृतज्ञतेने आणि विशुद्ध आनंदाने तृप्त होते, त्याचेच आचरण खऱ्या अर्थाने निर्मळ व अस्सल शील होय.","fr":"Ce vachana met en lumière la nature véritable de la vertu morale et spirituelle (Shila), en dénonçant l’orgueil de ceux qui s’en vantent sans en saisir l’essence.\n\nLa véritable droiture consiste à partager honnêtement ce que l’on possède sans tromperie, à ne pas s’endetter pour ce que l’on n’a pas, et à ne jamais convoiter le bien ou le conjoint d’autrui.\n\nSur le plan spirituel, cette intégrité exige de ne pas se tourner vers d’autres divinités ou doctrines, et de refuser d’écouter toute médisance envers le Guru, le Principe divin ou le Jangama, c’est-à-dire les êtres réalisés et la communauté spirituelle vivante.\n\nEnfin, la pureté de conduite absolue se réalise dans l’accueil dévoué et la joie profonde éprouvée à la venue des Sharanas unis à la Réalité suprême sans forme, invoquée ici sous le nom de Koodalachannasanga.","te":"ఈ వచనం వివరిస్తున్నది ఏమిటంటే, చాలామంది తాము శీలవంతులమని గర్వంగా చెప్పుకుంటారే తప్ప అసలైన శీలం అంటే ఏమిటో వారికి తెలియదు.\n\nతమ వద్ద ఉన్నదానిని దాచిపెట్టి వంచన చేయకపోవడం, లేనిదాని కోసం అప్పులు అడగకపోవడం, అలాగే పరధనాన్ని గానీ పరస్త్రీని గానీ ఆశించకపోవడమే నిజమైన శీలం.\n\nఇతర దైవాలను, అన్య మత సిద్ధాంతాలను కోరుకోకపోవడం, గురువు, శివతత్త్వం, జంగముల పట్ల చేసే నిందలను వినకుండా ఉండటం శీలవంతుల లక్షణం.\n\nకూడలచెన్నసంగమదేవ అనే నిరాకార పరమతత్త్వాన్ని అనుభూతి చెందిన శరణుల రాకకు ఎదురువెళ్లి, వారి సాంగత్యంలో ఆత్మానందం పొందగలగడమే అత్యంత స్వచ్ఛమైన శీలమని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ತಾವು ದೊಡ್ಡ ಶೀಲವಂತರು ಎಂದು ಹೆಮ್ಮೆಯಿಂದ ಬಡಾಯಿ ಕೊಚ್ಚಿಕೊಳ್ಳುವವರಿಗೆ ನಿಜವಾದ ಶೀಲ ಅಂದರೆ ಏನು ಎನ್ನುವುದೇ ಗೊತ್ತಿರುವುದಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ.\n\nತಮ್ಮ ಹತ್ತಿರ ಇರುವುದನ್ನು ಮುಚ್ಚಿಟ್ಟು ವಂಚನೆ ಮಾಡದಿರುವುದು, ಇಲ್ಲದಿರುವುದಕ್ಕಾಗಿ ಇನ್ನೊಬ್ಬರ ಬಳಿ ಸಾಲ ಬೇಡದಿರುವುದು ಮತ್ತು ಬೇರೆಯವರ ಹಣ ಹಾಗೂ ಪರಸ್ತ್ರೀಯರನ್ನು ಬಯಸದೆ ಇರುವುದೇ ನಿಜವಾದ ನೈತಿಕ ಶೀಲವಾಗಿದೆ.\n\nಇದರ ಜೊತೆಗೆ, ಅನ್ಯ ದೈವಗಳನ್ನಾಗಲಿ ಅಥವಾ ಇತರ ಮತ-ಪಂಥಗಳನ್ನಾಗಲಿ ಹಂಬಲಿಸದೆ ತಮ್ಮ ತಾತ್ವಿಕ ನಿಷ್ಠೆಯಲ್ಲಿ ದೃಢವಾಗಿರುವುದು ಹಾಗೂ ಗುರು, ಅರಿವಿನ ಸ್ವರೂಪವಾದ ಶಿವತತ್ತ್ವ ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರಾದ ಜಂಗಮರ ನಿಂದನೆಯನ್ನು ಕಿವಿಗೊಟ್ಟು ಕೇಳದಿರುವುದೇ ನಿಜವಾದ ಶೀಲವೆನಿಸಿಕೊಳ್ಳುತ್ತದೆ.\n\nಎಲ್ಲಕ್ಕಿಂತ ಮುಖ್ಯವಾಗಿ, ಪರಮಸತ್ಯವಾದ ಕೂಡಲಚೆನ್ನಸಂಗನ ಶರಣರು ಬಂದಾಗ ಅವರನ್ನು ಮನದುಂಬಿ ಸತ್ಕರಿಸಿ, ಅವರ ಸತ್ಸಂಗದಲ್ಲಿ ಪರಮ ಸಂತೋಷವನ್ನು ಪಡೆಯುವುದೇ ಅತ್ಯಂತ ಪರಿಶುದ್ಧವಾದ ‘ಅಚ್ಚಶೀಲ’ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":914,"o":"ಶೀಲಶೀಲವೆಂಬರು ಶೀಲ ಭಕ್ತಿಯೊಳಗಿಲ್ಲ.\n ಅದೇನು ಕಾರಣವೆಂದರೆಃ\n ಧಾನ್ಯ ಧರಣಿಯೆಂಜಲು,\n ಅಗ್ಘಣಿ ಮೇಘದೆಂಜಲು,\n ಪರಿಮಳ ವಾಯುವಿನೆಂಜಲು,\n ಪಾಕ ಅಗ್ನಿಯೆಂಜಲು.\n ಕೈಯ್ಯೊಳಗೆ ಸೊಡರ ಪಿಡಿದು\n ಕಣ್ಣುಕಾಣದೆ ಎಡಹಿ ಬೀಳುವ ಕುಟಿಲಶೀಲರ ಮೆಚ್ಚುವನೆ?\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ.","t":{"en":"They speak of ritual purity and strict observance, yet such observance has no place within devotion.\nIf you ask the reason why:\nGrain is the defiled leavings of the earth,\nconsecrated water is the defiled leavings of the clouds,\nfragrance is the defiled leavings of the wind,\ncooked food is the defiled leavings of fire.\nHolding a lamp in their hand,\nwill he be pleased with those of crooked observance who, unable to see, stumble and fall?\nKoodala Chennasangamadeva.","hi":"शील-शील कहते हैं, शील भक्ति में नहीं है।\nवह किस कारण से है, कहें तो:\nधान्य धरती की जूठन है,\nअर्घ्य-जल मेघ की जूठन है,\nसुगंध वायु की जूठन है,\nपाक अग्नि की जूठन है।\nहाथ में दीपक पकड़कर,\nआँखों से देखे बिना ठोकर खाकर गिरनेवाले कुटिल-शीलों को क्या पसंद करेंगे,\nकूडल चेन्नसंगमदेव?","mr":"शील, शील असे म्हणतात, पण भक्तीमध्ये शील नाही.\nत्याचे कारण काय म्हटले तर:\nधान्य हे धरणीचे उष्टे,\nअर्घ्यजळ हे मेघांचे उष्टे,\nपरिमळ हे वायूचे उष्टे,\nअन्नपाक हे अग्नीचे उष्टे.\nहातात दिवा धरूनही\nडोळ्यांना न दिसल्याने ठेचकाळून पडणाऱ्या कुटिलशील लोकांना तो पसंती देईल का?\nकूडल चेन्नसंगमदेव.","fr":"Ils disent : « la pureté des observances, la pureté des observances ! » ; mais cette observance n'a pas sa place dans la *Bhakti*.\nQuelle en est la raison ? C'est que :\nle grain est le reste impur de la terre,\nl'eau consacrée est le reste impur du nuage,\nle parfum est le reste impur du vent,\nle mets cuit est le reste impur du feu.\nTenant une lampe à la main,\nsans rien voir de leurs yeux, ils trébuchent et tombent : approuvera-t-il ces hypocrites aux observances tortueuses,\nKoodala Chennasangamadeva ?","te":"శీలం శీలం అని అంటారు, ఆ శీలం భక్తిలో లేదు.\nదానికి కారణమేమిటంటే:\nధాన్యం ధరణి ఎంగిలి,\nఅర్ఘ్యజలం మేఘపు ఎంగిలి,\nపరిమళం వాయువు ఎంగిలి,\nపాకం అగ్ని ఎంగిలి.\nచేతిలో దీపం పట్టుకొని\nకన్ను కానక తడబడి పడే కుటిలశీలురను మెచ్చుకుంటాడా?\nకూడల చెన్నసంగమదేవుడు.","kn":"ಶೀಲಶೀಲವೆಂಬರು ಶೀಲ ಭಕ್ತಿಯೊಳಗಿಲ್ಲ.\n ಅದೇನು ಕಾರಣವೆಂದರೆಃ\n ಧಾನ್ಯ ಧರಣಿಯೆಂಜಲು,\n ಅಗ್ಘಣಿ ಮೇಘದೆಂಜಲು,\n ಪರಿಮಳ ವಾಯುವಿನೆಂಜಲು,\n ಪಾಕ ಅಗ್ನಿಯೆಂಜಲು.\n ಕೈಯ್ಯೊಳಗೆ ಸೊಡರ ಪಿಡಿದು\n ಕಣ್ಣುಕಾಣದೆ ಎಡಹಿ ಬೀಳುವ ಕುಟಿಲಶೀಲರ ಮೆಚ್ಚುವನೆ?\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವ."},"m":{"en":"This Vachana critiques the superficial obsession with ritual purity and outward vows (Sheela), asserting that true devotion does not lie in rigid notions of physical untaintedness.\n\nIt dismantling the illusion of absolute material purity by pointing out that every offering is inherently touched by the elements of nature—grain is born from the earth, water falls from the clouds, fragrance is carried by the wind, and food is cooked by fire.\n\nThose who practise hypocritical and deceitful vows of purity while failing to recognize this fundamental truth are compared to blind people who stumble and fall despite holding a lit lamp in their own hands.\n\nAddressing the Supreme Reality as Kudalachannasangamadeva, the Vachana concludes that the Formless Divine never approves of such pretentious and misguided observance of rules that lack inner awareness.","hi":"यह वचन बाह्य शुद्धता, छुआछूत और झूठे सदाचार (शील) के आडंबर पर प्रहार करते हुए यह स्पष्ट करता है कि सच्ची भक्ति में ऐसे कृत्रिम नियमों का कोई स्थान नहीं है।\n\nवचन में यह तर्क दिया गया है कि प्रकृति की हर वस्तु किसी न किसी तत्व से जुड़ी या स्पर्श की हुई है—जैसे अनाज पृथ्वी का, पवित्र जल बादलों का, सुगंध वायु की और पका हुआ भोजन अग्नि का उच्छिष्ट (जूठन) है, इसलिए बाहरी तौर पर अछूती शुद्धता का दावा करना निरर्थक है।\n\nहाथ में ज्ञान का दीपक होते हुए भी जो लोग अज्ञानतावश अंधे होकर ठोकर खाते हैं, वे वास्तव में कपटी आचरण वाले हैं।\n\nइस वचन का केंद्रीय भाव यही है कि निराकार परमतत्त्व कूडलचन्नसंगमदेव ऐसे पाखंडी और कुटिल नियम-व्रत का दिखावा करने वालों को कभी स्वीकार नहीं करते।","mr":"बाह्य शुचिर्भूतपणाच्या आणि सोवळ्या-ओवळ्याच्या नावाखाली केल्या जाणाऱ्या कर्मठ नियमांना भक्तीमध्ये कोणतेही स्थान नाही, हा या वचनाचा मुख्य आशय आहे.\n\nनिसर्गातील धान्य हे पृथ्वीचे उष्टे आहे, पाणी मेघाचे उष्टे आहे, सुगंध वाऱ्याचा उष्टा आहे आणि शिजवलेले अन्न हे अग्नीचे उष्टे आहे; त्यामुळे बाह्य पदार्थांमध्ये निरपेक्ष शुद्धता शोधणे हा केवळ भ्रम आहे.\n\nहातात ज्ञानाचा दिवा असूनही आंधळ्याप्रमाणे ठेचाळत पडणाऱ्या आणि कपटीपणाने बाह्य नियम पाळणाऱ्या दांभिक आचरणाचा हे वचन तीव्र नकार करते.\n\nअशा वरवरच्या आणि कृत्रिम नियमांमध्ये अडकलेल्या वृत्तीला कूडलचन्नसंगमदेव हे परमतत्त्व कधीही स्वीकारत नाही, असा आध्यात्मिक विचार येथे स्पष्ट होतो.","fr":"Ce vachana dénonce l’hypocrisie de ceux qui réduisent la discipline morale et spirituelle (Shila) à une obsession rigide de la pureté rituelle extérieure, en démontrant qu’une telle préoccupation est étrangère à la véritable dévotion.\n\nIl illustre l’absurdité de cette quête d’intouchabilité matérielle en rappelant que les offrandes mêmes du culte sont déjà mêlées aux éléments naturels : le grain provient de la terre, l’eau sacrée des nuages, le parfum du vent et la nourriture cuite du feu.\n\nCeux qui s’attachent aveuglément à ces règles superficielles sont comparés à des personnes qui trébuchent dans l’obscurité tout en tenant une lampe allumée à la main, car ils possèdent l’outil de la connaissance sans en percevoir la lumière intérieure.\n\nLa portée spirituelle de ce texte réside dans l’affirmation que la Réalité suprême sans forme, invoquée sous le nom de Koodala Channasangamadeva, ne saurait agréer une telle piété artificielle et dépourvue de discernement.","te":"ఈ వచనం వివరిస్తున్న ప్రధాన సందేశం ఏమిటంటే, మడి, ఆచారాలు మరియు బాహ్య పవిత్రతనే 'శీలం' అని భ్రమపడే కపట నియమాలకు నిజమైన భక్తిలో ఎలాంటి స్థానం లేదు.\n\nప్రకృతిలోని ధాన్యం భూమి ఎంగిలి, జలం మేఘాల ఎంగిలి, సుগంధం వాయువు ఎంగిలి, వండిన ఆహారం అగ్ని ఎంగిలి అయినప్పుడు, బాహ్య వస్తువులలో స్వచ్ఛతను వెతుకుతూ ఆచారాల పేరిట గర్వించడం అర్థరహితమని ఈ వచనం స్పష్టం చేస్తోంది.\n\nచేతిలో దీపం పట్టుకుని కూడా కళ్లు కనిపించక తడబడి పడిపోయే గుడ్డివారిలా, అంతరంగంలో నిజమైన ఎరుక లేకుండా కేవలం బాహ్య నియమాలనే పట్టుకుని వేలాడే కుటిల స్వభావులను నిరాకార పరమతత్త్వమైన కూడలచెన్నసంగమదేవ ఎన్నటికీ మెచ్చదు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿಜವಾದ ಭಕ್ತಿ ಅಥವಾ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧನೆಯಲ್ಲಿ ಹೊರಗಿನ ವಸ್ತುಗಳ ಮಡಿವಂತಿಕೆಯ ಹೆಸರಿನಲ್ಲಿ ಆಚರಿಸುವ ಕಟ್ಟುಪಾಡುಗಳಿಗೆ ಮತ್ತು ಎಂಜಲು ಎಂಬ ಭೇದಭಾವಕ್ಕೆ ಯಾವುದೇ ಅರ್ಥವಿಲ್ಲ ಎಂಬುದಾಗಿದೆ.\n\nನಾವು ಬಳಸುವ ಧಾನ್ಯವು ಭೂಮಿಯಿಂದ ಹುಟ್ಟಿರುವುದರಿಂದ ಭೂಮಿಯ ಎಂಜಲು, ನೀರು ಮೋಡದಿಂದ ಸುರಿಯುವುದರಿಂದ ಮೋಡದ ಎಂಜಲು, ಸುಗಂಧವು ಗಾಳಿಯಲ್ಲಿ ಬೆರೆತು ಬರುವುದರಿಂದ ಗಾಳಿಯ ಎಂಜಲು ಹಾಗೂ ಆಹಾರವು ಬೆಂಕಿಯಿಂದ ಬೇಯುವುದರಿಂದ ಬೆಂಕಿಯ ಎಂಜಲೇ ಆಗಿದೆ; ಹೀಗೆ ಪ್ರಕೃತಿಯ ಪ್ರತಿಯೊಂದು ವಸ್ತುವೂ ಒಂದಲ್ಲ ಒಂದು ಮೂಲದ ಸಂಪರ್ಕದಿಂದಲೇ ಬರುವಾಗ ಹೊರಗಿನ ಶುದ್ಧತೆಯ ಹೆಸರಿನಲ್ಲಿ ಶೀಲವನ್ನು ಹುಡುಕುವುದು ಅರ್ಥಹೀನ.\n\nಕೈಯಲ್ಲಿ ಉರಿಯುವ ದೀಪವನ್ನು ಹಿಡಿದುಕೊಂಡಿದ್ದರೂ, ಕಣ್ಣು ಕಾಣದವರಂತೆ ಕಲ್ಲು ಎಡವಿ ಬೀಳುವ ಕುರುಡರ ಹಾಗೆ, ಅರಿವಿನ ಬೆಳಕು ಹತ್ತಿರದಲ್ಲೇ ಇದ್ದರೂ ಸತ್ಯವನ್ನು ಗುರುತಿಸದೆ ಕೇವಲ ಬಾಹ್ಯ ಆಚರಣೆಗಳ ಕಪಟ ಶೀಲದಲ್ಲಿ ತೊಡಗಿರುವವರನ್ನು ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವನು ಎಂದಿಗೂ ಒಪ್ಪುವುದಿಲ್ಲ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":915,"o":"ಷೋಡಶಕಳೆಯುಳ್ಳ ಜಂಗಮವ\n ರಾಜರುಗಳು ಪೂಜೆಯ ಮಾಡುವರು.\n ವಿಷಯವುಳ್ಳ ಜಂಗಮವ\n ವೇಸಿ ಪೂಜೆಯ ಮಾಡುವಳು.\n ರಸವಿದ್ಯೆಯುಳ್ಳ ಜಂಗಮವ\n ಅಕ್ಕಸಾಲೆ ಪೂಜೆಯ ಮಾಡುವನು.\n ವೇಷವುಳ್ಳ ಜಂಗಮವ\n ಭಕ್ತರು ಪೂಜೆಯ ಮಾಡುವರು.\n ಜ್ಞಾನವುಳ್ಳ ಜಂಗಮವ ಆರಿಗೂ ಕಾಣಬಾರದು,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"A *Jangama* possessed of the sixteen arts,\nkings will worship.\nA *Jangama* given to sensual pleasures,\na courtesan will worship.\nA *Jangama* skilled in alchemy,\na goldsmith will worship.\nA *Jangama* wearing the outward garb,\ndevotees will worship.\nA *Jangama* possessed of true knowledge cannot be seen by anyone,\nO Koodala Chennasangamadeva.","hi":"षोडश-कलाओंवाले जंगम की\nराजा लोग पूजा करते हैं।\nविषयवाले जंगम की\nवेश्या पूजा करती है।\nरसविद्यावाले जंगम की\nसुनार पूजा करता है।\nवेषवाले जंगम की\nभक्त पूजा करते हैं।\nज्ञानवाले जंगम को कोई भी देख नहीं सकता,\nहे कूडल चेन्नसंगमदेव।","mr":"षोडश कला असलेल्या जंगमाची\nराजे लोक पूजा करतात.\nविषयभोग असलेल्या जंगमाची\nवेश्या पूजा करते.\nरसविद्या असलेल्या जंगमाची\nसोनार पूजा करतो.\nवेषधारी जंगमाची\nभक्त लोक पूजा करतात.\nज्ञान असलेल्या जंगमाला कोणीही ओळखू शकत नाही,\nहे कूडल चेन्नसंगमदेवा.","fr":"Le Jangama qui possède les seize arts,\nles rois le vénèrent.\nLe Jangama qui possède les plaisirs des sens,\nla courtisane le vénère.\nLe Jangama qui possède la science de l'alchimie,\nl'orfèvre le vénère.\nLe Jangama qui porte l'habit extérieur,\nles dévots le vénèrent.\nMais le Jangama qui possède la vraie connaissance, personne ne peut le percevoir,\nÔ Koodala Chennasangamadeva.","te":"షోడశకళలు గల జంగముని\nరాజులు పూజ చేస్తారు.\nవిషయము గల జంగముని\nవేశ్య పూజ చేస్తుంది.\nరసవిద్య గల జంగముని\nకంసాలి పూజ చేస్తాడు.\nవేషము గల జంగముని\nభక్తులు పూజ చేస్తారు.\nజ్ఞానము గల జంగముని ఎవ్వరికీ చూడ సాధ్యం కాదు,\nఓ కూడల చెన్నసంగమదేవా.","kn":"ಷೋಡಶಕಳೆಯುಳ್ಳ ಜಂಗಮವ\n ರಾಜರುಗಳು ಪೂಜೆಯ ಮಾಡುವರು.\n ವಿಷಯವುಳ್ಳ ಜಂಗಮವ\n ವೇಸಿ ಪೂಜೆಯ ಮಾಡುವಳು.\n ರಸವಿದ್ಯೆಯುಳ್ಳ ಜಂಗಮವ\n ಅಕ್ಕಸಾಲೆ ಪೂಜೆಯ ಮಾಡುವನು.\n ವೇಷವುಳ್ಳ ಜಂಗಮವ\n ಭಕ್ತರು ಪೂಜೆಯ ಮಾಡುವರು.\n ಜ್ಞಾನವುಳ್ಳ ಜಂಗಮವ ಆರಿಗೂ ಕಾಣಬಾರದು,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ."},"m":{"en":"This Vachana highlights how people in the world venerate a Jangama—a spiritual seeker or renunciate—based entirely on their own worldly desires and external perceptions.\n\nKings revere a Jangama who possesses mastery over the sixteen worldly arts, a courtesan seeks one inclined toward sensory pleasures, and a goldsmith honours one skilled in alchemy, as each values only what serves their own interest.\n\nSimilarly, ordinary devotees are often drawn merely to the outward garb and appearance of a Jangama, mistaking external attire for true spiritual stature.\n\nAddressing the Formless Supreme Consciousness as Kudalachannasangamadeva, the Vachana concludes that a truly enlightened Jangama embodied in pure spiritual knowledge (Jnana) remains invisible and unrecognizable to those whose vision is bound by superficiality and self-interest.","hi":"इस वचन का केंद्रीय भाव यह है कि सांसारिक लोग प्रायः अपने स्वार्थ, रुचि या केवल बाहरी आकर्षण के आधार पर ही आध्यात्मिक साधकों और संन्यासियों (जंगम) का आदर-सत्कार करते हैं।\n\nइसमें स्पष्ट किया गया है कि राजा सोलह कलाओं में निपुण जंगम को पूजते हैं, वेश्या विषय-भोगों में लिप्त जंगम को, सुनार रसायन विद्या (धातु को सोना बनाने की कला) जानने वाले जंगम को, और सामान्य भक्त केवल बाहरी वेशभूषा धारण करने वाले जंगम की पूजा करते हैं।\n\nकूडल चन्नसंगमदेव के रूप में निराकार परमतत्त्व को संबोधित करते हुए यह वचन इस गहन सत्य की ओर संकेत करता है कि बाहरी दिखावे और सांसारिक गुणों से परे, आत्मज्ञान से युक्त सच्चे जंगम को पहचान पाना किसी के लिए भी संभव नहीं होता।","mr":"या वचनाचा मुख्य आशय असा आहे की, समाजातील विविध लोक आपल्या स्वतःच्या व्यावहारिक गरजेनुसार किंवा बाह्य गुणांवरूनच जंगमाचा म्हणजेच आध्यात्मिक साधकाचा आदर करतात.\n\nउदाहरणार्थ, सोळा कलांनी युक्त असणाऱ्याला राजे पूजतात, विषयवासना असणाऱ्याकडे वेश्या आकर्षित होते, किमया (रसविद्या) जाणणाऱ्याला सोनार मान देतो, तर केवळ बाह्य वेषभूषा धारण करणाऱ्या जंगमाची सामान्य भक्त पूजा करतात.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला उद्देशून हे वचन स्पष्ट करते की, लोक केवळ बाह्य रूप आणि कौशल्यांवर भाळतात, परंतु ज्याच्याकडे खऱ्या आत्मज्ञानाची खोली आहे असा ज्ञानी जंगम मात्र कोणाच्याही सहज दृष्टीस पडत नाही किंवा कोणालाही ओळखता येत नाही.","fr":"Ce vachana met en lumière la tendance humaine à ne valoriser chez un maître spirituel ou un chercheur itinérant, appelé Jangama, que ce qui correspond à ses propres intérêts mondains ou aux apparences extérieures.\n\nAinsi, les rois vénèrent le Jangama doté des seize arts et de prestance, la courtisane recherche celui qui est tourné vers les plaisirs des sens, et l'orfèvre honore celui qui maîtrise l'alchimie.\n\nDe même, les dévots ordinaires se contentent souvent d'adorer le Jangama qui en porte simplement l'habit et les attributs extérieurs, s'arrêtant ainsi à la forme superficielle de la spiritualité.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Koodala Channasangamadeva, le texte souligne avec lucidité que le véritable Jangama, porteur de la connaissance pure et de l'éveil intérieur, demeure invisible et incompris aux yeux du monde.","te":"ఈ వచనంలోని ప్రధాన ఆంతర్యం ఏమిటంటే, లోకంలోని మనుషులు జంగముడిలోని ఆధ్యాత్మిక సత్యాన్ని కాకుండా, తమ స్వార్థ ప్రయోజనాలకు లేదా బాహ్య ఆకర్షణలకు తగిన లక్షణాలనే చూసి ఆరాధిస్తారు.\n\nపదహారు కళలలో ప్రావీణ్యం ఉన్న జంగముడిని రాజులు, భోగలాలసత కలిగినవాడిని వేశ్యలు, రసవాద విద్య తెలిసినవాడిని కంసాలులు తమ తమ లౌకిక అవసరాల కోసమే పూజిస్తారు.\n\nఅంతేకాక, సాధారణ భక్తులు సైతం జంగముడి ఆంతరంగిక తత్త్వాన్ని గుర్తించలేక కేవలం అతని బాహ్య వేషధారణను చూసే గౌరవిస్తారు.\n\nకూడల చెన్నసంగమదేవా అనే నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, బాహ్య ప్రదర్శనలకు అతీతంగా నిజమైన ఆత్మజ్ఞానం కలిగిన జంగముడిని ఈ లోకంలో ఎవరూ గుర్తించలేకపోతున్నారనే సత్యాన్ని ఈ వచనం ఆవిష్కరిస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಲೋಕದ ಜನರು ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರಾದ ಜಂಗಮರಲ್ಲಿರುವ ನಿಜವಾದ ಅರಿವನ್ನು ಗುರುತಿಸುವ ಬದಲು, ತಮ್ಮದೇ ಆದ ಲೌಕಿಕ ಆಸಕ್ತಿ, ಬಯಕೆ ಅಥವಾ ಹೊರಗಿನ ತೋರಿಕೆಯನ್ನು ನೋಡಿ ಮಾತ್ರ ಅವರನ್ನು ಗೌರವಿಸುತ್ತಾರೆ.\n\nರಾಜರು ಹದಿನಾರು ಕಲೆಗಳ ಪಾಂಡಿತ್ಯವಿರುವ ಜಂಗಮನನ್ನು, ವೇಶ್ಯೆಯು ಭೋಗಾಸಕ್ತಿಯುಳ್ಳವನನ್ನು, ಮತ್ತು ಅಕ್ಕಸಾಲಿಗನು ಲೋಹಗಳನ್ನು ಚಿನ್ನವಾಗಿಸುವ ರಸವಿದ್ಯೆ ಬಲ್ಲವನನ್ನು ತಮ್ಮ ಸ್ವಾರ್ಥಕ್ಕಾಗಿ ಪೂಜಿಸುತ್ತಾರೆ.\n\nಹಾಗೆಯೇ ಸಾಮಾನ್ಯ ಭಕ್ತರು ಕೂಡ ಕೇವಲ ಹೊರಗಿನ ವೇಷಭೂಷಣಗಳನ್ನು ನೋಡಿ ಮರುಳಾಗಿ ಜಂಗಮರನ್ನು ಪೂಜಿಸುತ್ತಾರೆಯೇ ಹೊರತು, ಅವರ ಆಂತರಿಕ ಸತ್ಯವನ್ನು ಗಮನಿಸುವುದಿಲ್ಲ.\n\nಆದರೆ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವನ ಅರಿವನ್ನು ತನ್ನೊಳಗೆ ಸಾಕ್ಷಾತ್ಕರಿಸಿಕೊಂಡಿರುವ ನಿಜವಾದ ಜ್ಞಾನಿಯಾದ ಜಂಗಮನನ್ನು ಗುರುತಿಸುವ ಯೋಗ್ಯತೆ ಇಂತಹ ಬಾಹ್ಯ ನೋಟವುಳ್ಳ ಯಾರಿಗೂ ಇರುವುದಿಲ್ಲ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":916,"o":"ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಪಂಚಮಹಾಪಾತಕ, ಏಳನೆಯ ನರಕ.\n ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಬ್ರಹ್ಮೇತಿಗೆ ಅದು ಮೊದಲು.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಲಿಂಗಾಂಗಣ, ಅವರಂಗವು ಲಿಂಗ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣವೆ ವಾರಣಾಸಿಯಿಂದಧಿಕ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಅಮೃತ ದಿವ್ಯಕ್ಷೇತ್ರದಿಂದಧಿಕ.\n ಸಂಗಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ನಿಮ್ಮ ಶರಣರ ಸಂಗ ಸುಸಂಗವೆನಗೆ.","t":{"en":"O Sanga, the courtyard of those without you is the five great sins, the seventh hell.\nO Sanga, the courtyard of those without you is the very root of Brahmanicide.\nO Sanga, the courtyard of those in whom you dwell is the courtyard of *Linga*, and their body itself is *Linga*.\nO Sanga, the courtyard of those in whom you dwell is greater than Varanasi.\nO Sanga, the courtyard of those in whom you dwell is greater than the immortal divine realms.\nO Sanga, O Koodala Chennasanga,\nthe fellowship of your *Sharanas* is true fellowship for me.","hi":"हे संग, जहाँ तुम नहीं हो उनका आँगन पंचमहापातक है, सातवाँ नरक है।\nहे संग, जहाँ तुम नहीं हो उनका आँगन ही ब्रह्महत्या का मूल है।\nहे संग, जहाँ तुम हो उनका आँगन लिंगांगण है, उनका अंग लिंग है।\nहे संग, जहाँ तुम हो उनका आँगन ही वाराणसी से भी बढ़कर है।\nहे संग, जहाँ तुम हो उनका आँगन अमृत दिव्यक्षेत्र से भी बढ़कर है।\nहे संग, हे कूडल चेन्नसंग,\nतुम्हारे शरणों का संग ही मेरे लिए सुसंग है।","mr":"हे संगा, जिथे तू नाहीस त्यांच्या अंगणात पंचमहापातक आणि सातवा नरक आहे.\nहे संगा, जिथे तू नाहीस त्यांचे अंगण म्हणजे ब्रह्महत्येचे मूळ आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण हे लिंगांगण आहे, आणि त्यांचे अंग हेच लिंग आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण हेच वाराणसीपेक्षा श्रेष्ठ आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण अमृत दिव्यक्षेत्रापेक्षा श्रेष्ठ आहे.\nहे संगा, हे कूडल चेन्नसंगा,\nतुझ्या शरणांचा संग हाच माझ्यासाठी सुसंग आहे.","fr":"Ô Sanga, la cour de ceux chez qui tu n'es pas est les cinq grands crimes, elle est le septième enfer.\nÔ Sanga, la cour de ceux chez qui tu n'es pas est la source même du meurtre d'un brahmane.\nÔ Sanga, la cour de ceux chez qui tu demeures est la cour du Linga, et leur corps même est le Linga.\nÔ Sanga, la cour de ceux chez qui tu demeures est supérieure à Varanasi.\nÔ Sanga, la cour de ceux chez qui tu demeures est supérieure au lieu sacré divin et immortel.\nÔ Sanga, Ô Koodala Chennasanga,\nla compagnie de tes Sharanas est pour moi la noble compagnie.","te":"ఓ సంగా, మీరు లేనివారి ప్రాంగణం పంచమహాపాతకం, ఏడవ నరకం.\nఓ సంగా, మీరు లేనివారి ప్రాంగణం బ్రహ్మహత్యకు అదే మూలం.\nఓ సంగా, మీరు ఉన్నవారి ప్రాంగణం లింగప్రాంగణం, వారి అంగమే లింగం.\nఓ సంగా, మీరు ఉన్నవారి ప్రాంగణమే వారణాసి కంటే అధికం.\nఓ సంగా, మీరు ఉన్నవారి ప్రాంగణం అమృత దివ్యక్షేత్రం కంటే అధికం.\nఓ సంగా, ఓ కూడల చెన్నసంగా,\nమీ శరణుల సంగమే నాకు సుసంగం.","kn":"ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಪಂಚಮಹಾಪಾತಕ, ಏಳನೆಯ ನರಕ.\n ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಬ್ರಹ್ಮೇತಿಗೆ ಅದು ಮೊದಲು.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಲಿಂಗಾಂಗಣ, ಅವರಂಗವು ಲಿಂಗ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣವೆ ವಾರಣಾಸಿಯಿಂದಧಿಕ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಅಮೃತ ದಿವ್ಯಕ್ಷೇತ್ರದಿಂದಧಿಕ.\n ಸಂಗಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ನಿಮ್ಮ ಶರಣರ ಸಂಗ ಸುಸಂಗವೆನಗೆ."},"m":{"en":"This Vachana contrasts a life devoid of the Formless Supreme Consciousness with one deeply rooted in divine awareness.\n\nThe text explains that the dwelling of those who lack the presence of Kudalachannasanga is spiritually desolate, comparing it to the five great sins, the seventh hell, and the gravest of transgressions.\n\nIn contrast, where the Supreme Reality abides, the very bodies of the devotees become identified with Linga, transforming their courtyard into a sacred space that surpasses even revered pilgrimage centres like Varanasi and other divine realms.\n\nUltimately, the Vachana affirms that true spiritual fulfilment lies not in external holy places, but in the noble fellowship (Susanga) of the Sharanas who embody this living consciousness.","hi":"इस वचन का केंद्रीय भाव यह है कि कूडल चन्नसंग अर्थात निराकार परमतत्त्व की उपस्थिति ही किसी स्थान और जीवन को वास्तविक पवित्रता प्रदान करती है।\n\nजिन लोगों के जीवन और आँगन में इस परम चैतन्य का वास नहीं है, उनका स्थान पंचमहापातक, सातवें नरक और ब्रह्महत्या जैसे घोर पापों के मूल कारण के समान अपवित्र माना गया है।\n\nइसके विपरीत, जिनके भीतर यह परमतत्त्व विद्यमान है, उनका आँगन स्वयं 'लिंगांगण' बन जाता है, उनकी देह ही लिंगस्वरूप हो जाती है, और वह स्थान वाराणसी या किसी भी अन्य दिव्य तीर्थक्षेत्र से कहीं अधिक श्रेष्ठ हो जाता है।\n\nयह वचन स्पष्ट करता है कि किसी बाहरी तीर्थ की अपेक्षा परमतत्त्व से युक्त शरणों का सान्निध्य और सत्संग ही साधक के लिए सर्वोच्च तथा कल्याणकारी संगति है।","mr":"ज्यांच्या जीवनात आणि निवासात निराकार परमतत्त्वाचे अधिष्ठान नसते, त्यांचे अंगण पंचमहापातकांसारखे, ब्रह्महत्येच्या पातकाचे मूळ आणि सातव्या नरकासमान अपवित्र ठरते, असे हे वचन स्पष्ट करते.\n\nयाउलट, जिथे या परमचैतन्याचे अस्तित्व असते, ते अंगणच पावन लिंगांगण बनते आणि तिथे राहणाऱ्यांचे शरीरही चैतन्यस्वरूप होऊन जाते.\n\nअशा जागेचे पावित्र्य वाराणसी किंवा इतर कोणत्याही बाह्य दिव्य तीर्थक्षेत्रापेक्षाही अधिक श्रेष्ठ असते.\n\nम्हणूनच, कूडलचन्नसंग या परमतत्त्वाच्या जाणिवेत जगणाऱ्या शरणांचा सहवास हाच खरा आणि सर्वोच्च सुसंग आहे, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le contraste absolu entre un espace dépourvu de la conscience du Principe suprême et la demeure de ceux qui vivent en présence de Koodala Channasanga.\n\nLa cour de ceux qui sont étrangers à cette Réalité suprême sans forme est décrite comme la source même des cinq grands péchés, du crime de brahmanicide et du septième enfer, illustrant le vide spirituel d'une existence coupée de la vérité.\n\nÀ l'inverse, là où réside cette présence intérieure, le corps humain devient lui-même Linga et l'espace quotidien se transforme en un sanctuaire vivant, surpassant la sacralité de lieux de pèlerinage traditionnels comme Varanasi ou les domaines divins immortels.\n\nLa portée spirituelle de ce vachana réside ainsi dans la reconnaissance que la véritable grâce et la plus haute compagnie spirituelle se trouvent uniquement dans la fraternité éveillée des Sharanas.","te":"ఈ వచనంలోని ప్రధాన సందేశం ఏమిటంటే, నిరాకార పరమచైతన్యానికి ప్రతీక అయిన కూడల చన్నసంగ సాన్నిధ్యం లేనివారి ప్రాంగణం పంచమహాపాతకాలతోను, ఏడవ నరకంతోను, బ్రహ్మహత్యా పాతకంతోను సమానమని వచనకారుడు స్పష్టం చేస్తున్నారు.\n\nఅదే పరమసత్యపు అస్తిత్వం నిండి ఉన్న శరణుల ముంగిలి సాక్షాత్తు లింగక్షేత్రంగా మారుతుందని, వారి దేహమే లింగస్వరూపమవుతుందని ఈ వచనం వివరిస్తున్నది.\n\nఅటువంటి శరణుల ఇల్లు వారణాసి కంటే, అమృతతుల్యమైన ఇతర దివ్యక్షేత్రాల కంటే ఎంతో శ్రేష్ఠమైనదని చెప్పడం ద్వారా బాహ్య తీర్థక్షేత్రాల కంటే అనుభావ సంపన్నులైన శరణుల నివాసమే పవిత్రమైనదని ఇక్కడ తెలియజేయబడింది.\n\nఅందుకే కూడల చన్నసంగ అనే పరమతత్త్వాన్ని తమలో నిలుపుకున్న శరణుల సహవాసమే తనకు నిజమైన సత్సంగమని వచనకారుడు ప్రకటిస్తున్నారు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಕೂಡಲಚೆನ್ನಸಂಗನ ಅರಿವು ಮತ್ತು ಸಾನ್ನಿಧ್ಯವಿಲ್ಲದವರ ಮನೆಯ ಅಂಗಳವು ಪಂಚಮಹಾಪಾತಕ, ಬ್ರಹ್ಮಹತ್ಯೆಯಂತಹ ಘೋರ ಪಾಪ ಹಾಗೂ ಏಳನೆಯ ನರಕಕ್ಕೆ ಸಮನಾಗಿರುತ್ತದೆ.\n\nಇದಕ್ಕೆ ವಿರುದ್ಧವಾಗಿ, ಪರಮಚೈತನ್ಯದ ಅರಿವಿನಿಂದ ಬದುಕುವ ಶರಣರ ಮನೆಯ ಅಂಗಳವೇ ಪವಿತ್ರವಾದ ಲಿಂಗಾಂಗಣವಾಗಿದ್ದು, ಅಂತಹವರ ದೇಹವೇ ಸಾಕ್ಷಾತ್ ಲಿಂಗವಾಗಿರುತ್ತದೆ.\n\nಹೊರಗಿನ ಸ್ಥಾವರ ತೀರ್ಥಕ್ಷೇತ್ರಗಳಿಗಿಂತ ಶರಣರ ಬದುಕೇ ಶ್ರೇಷ್ಠ ಎಂಬ ತತ್ತ್ವದಂತೆ, ಅರಿವುಳ್ಳವರ ಮನೆಯಂಗಳವು ವಾರಣಾಸಿ ಅಥವಾ ಬೇರೆ ಯಾವುದೇ ದಿವ್ಯಕ್ಷೇತ್ರಗಳಿಗಿಂತಲೂ ಮಿಗಿಲಾದುದು ಎಂದು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಆದ್ದರಿಂದ ಅಂತಹ ಎಚ್ಚರದ ಬದುಕನ್ನು ನಡೆಸುವ ಶರಣರ ಒಡನಾಟವೇ ತನಗೆ ನಿಜವಾದ ಸತ್ಸಂಗ ಎಂಬುದು ಈ ವಚನದ ಒಟ್ಟಾರೆ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":917,"o":"ಸಜ್ಜನ ಸದ್ಭಾವಿ ಅನ್ಯರಲ್ಲಿ ಕೈಯ್ಯಾಂತು ಬೇಡ,\n ಲಿಂಗವ ಮುಟ್ಟಿದ ಕೈ ಮೀಸಲು.\n ಕಂಗಳಲ್ಲಿ ಒಸೆದು ನೋಡ ಪರವಧುವ.\n ಮನದಲ್ಲಿ ನೆನೆಯನನ್ಯವ, ಮಾನವ ಸೇವೆಯ ಮಾಡ,\n ಲಿಂಗವ ಬೇಡ, ಲಿಂಗದ ಹಂಗನೊಲ್ಲ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ ನಿಮ್ಮ ಶರಣ.","t":{"en":"The virtuous one of pure devotion does not stretch out his hand to beg from others,\nfor the hand that has touched the *Linga* is consecrated.\nWith his eyes, he does not look with desire upon another's wife.\nIn his mind, he does not think of another, nor does he serve mortals;\nhe does not beg of the *Linga*, nor does he accept obligation even to the *Linga*—\nO Koodala Chennasanga, such is your *Sharana*.","hi":"सज्जन सद्भावी परायों के आगे हाथ फैलाकर नहीं माँगता,\nलिंग को छूनेवाला हाथ समर्पित है।\nआँखों से रीझकर पराई स्त्री को नहीं देखता।\nमन में पराये का स्मरण नहीं करता, मनुष्य की चाकरी नहीं करता,\nलिंग से नहीं माँगता, लिंग का एहसान नहीं चाहता,\nहे कूडल चेन्नसंग, आपका शरण।","mr":"सज्जन आणि सद्भावी भक्त इतरांपुढे हात पसरून मागत नाही,\nलिंगाला स्पर्श केलेला हात राखून ठेवलेला असतो।\nडोळ्यांनी परस्त्रीकडे मोहित होऊन पाहत नाही।\nमनात अन्याचे स्मरण करत नाही, मानवाची सेवा करत नाही,\nलिंगाकडेही मागत नाही, लिंगाचे मिंधेपणही स्वीकारत नाही,\nहे कूडल चेन्नसंगा, तुमचा शरण।","fr":"L'être vertueux aux sentiments purs ne tend pas la main pour mendier auprès d'autrui,\nla main qui a touché le Linga est consacrée.\nDe ses yeux, il ne regarde point avec désir la femme d'autrui.\nDans son esprit, il ne pense à nul autre, il ne se met point au service des mortels,\nil n'implore rien du Linga, il ne veut même pas être redevable au Linga,\nÔ Koodala Chennasanga, votre Sharana.","te":"సజ్జనుడైన సద్భావి అన్యుల వద్ద చేయి చాచి యాచించడు,\nలింగాన్ని తాకిన చేయి పవిత్రంగా అంకితమైనది.\nకన్నులతో మోహించి పరస్త్రీని చూడడు.\nమనసులో అన్యాన్ని తలచడు, మానవ సేవ చేయడు,\nలింగాన్ని యాచించడు, లింగపు దాక్షిణ్యాన్ని కోరడు,\nఓ కూడల చెన్నసంగా, మీ శరణుడు.","kn":"ಸಜ್ಜನ ಸದ್ಭಾವಿ ಅನ್ಯರಲ್ಲಿ ಕೈಯ್ಯಾಂತು ಬೇಡ,\n ಲಿಂಗವ ಮುಟ್ಟಿದ ಕೈ ಮೀಸಲು.\n ಕಂಗಳಲ್ಲಿ ಒಸೆದು ನೋಡ ಪರವಧುವ.\n ಮನದಲ್ಲಿ ನೆನೆಯನನ್ಯವ, ಮಾನವ ಸೇವೆಯ ಮಾಡ,\n ಲಿಂಗವ ಬೇಡ, ಲಿಂಗದ ಹಂಗನೊಲ್ಲ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ ನಿಮ್ಮ ಶರಣ."},"m":{"en":"This Vachana defines the profound self-respect and spiritual autonomy of a true Sharana, whose hands, having touched the Ishtaling
