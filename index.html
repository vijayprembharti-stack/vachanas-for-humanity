्यामुळे बाह्य पदार्थांमध्ये निरपेक्ष शुद्धता शोधणे हा केवळ भ्रम आहे.\n\nहातात ज्ञानाचा दिवा असूनही आंधळ्याप्रमाणे ठेचाळत पडणाऱ्या आणि कपटीपणाने बाह्य नियम पाळणाऱ्या दांभिक आचरणाचा हे वचन तीव्र नकार करते.\n\nअशा वरवरच्या आणि कृत्रिम नियमांमध्ये अडकलेल्या वृत्तीला कूडलचन्नसंगमदेव हे परमतत्त्व कधीही स्वीकारत नाही, असा आध्यात्मिक विचार येथे स्पष्ट होतो.","fr":"Ce vachana dénonce l’hypocrisie de ceux qui réduisent la discipline morale et spirituelle (Shila) à une obsession rigide de la pureté rituelle extérieure, en démontrant qu’une telle préoccupation est étrangère à la véritable dévotion.\n\nIl illustre l’absurdité de cette quête d’intouchabilité matérielle en rappelant que les offrandes mêmes du culte sont déjà mêlées aux éléments naturels : le grain provient de la terre, l’eau sacrée des nuages, le parfum du vent et la nourriture cuite du feu.\n\nCeux qui s’attachent aveuglément à ces règles superficielles sont comparés à des personnes qui trébuchent dans l’obscurité tout en tenant une lampe allumée à la main, car ils possèdent l’outil de la connaissance sans en percevoir la lumière intérieure.\n\nLa portée spirituelle de ce texte réside dans l’affirmation que la Réalité suprême sans forme, invoquée sous le nom de Koodala Channasangamadeva, ne saurait agréer une telle piété artificielle et dépourvue de discernement."}},{"no":915,"o":"ಷೋಡಶಕಳೆಯುಳ್ಳ ಜಂಗಮವ\n ರಾಜರುಗಳು ಪೂಜೆಯ ಮಾಡುವರು.\n ವಿಷಯವುಳ್ಳ ಜಂಗಮವ\n ವೇಸಿ ಪೂಜೆಯ ಮಾಡುವಳು.\n ರಸವಿದ್ಯೆಯುಳ್ಳ ಜಂಗಮವ\n ಅಕ್ಕಸಾಲೆ ಪೂಜೆಯ ಮಾಡುವನು.\n ವೇಷವುಳ್ಳ ಜಂಗಮವ\n ಭಕ್ತರು ಪೂಜೆಯ ಮಾಡುವರು.\n ಜ್ಞಾನವುಳ್ಳ ಜಂಗಮವ ಆರಿಗೂ ಕಾಣಬಾರದು,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"A *Jangama* possessed of the sixteen arts,\nkings will worship.\nA *Jangama* given to sensual pleasures,\na courtesan will worship.\nA *Jangama* skilled in alchemy,\na goldsmith will worship.\nA *Jangama* wearing the outward garb,\ndevotees will worship.\nA *Jangama* possessed of true knowledge cannot be seen by anyone,\nO Koodala Chennasangamadeva.","hi":"षोडश-कलाओंवाले जंगम की\nराजा लोग पूजा करते हैं।\nविषयवाले जंगम की\nवेश्या पूजा करती है।\nरसविद्यावाले जंगम की\nसुनार पूजा करता है।\nवेषवाले जंगम की\nभक्त पूजा करते हैं।\nज्ञानवाले जंगम को कोई भी देख नहीं सकता,\nहे कूडल चेन्नसंगमदेव।","mr":"षोडश कला असलेल्या जंगमाची\nराजे लोक पूजा करतात.\nविषयभोग असलेल्या जंगमाची\nवेश्या पूजा करते.\nरसविद्या असलेल्या जंगमाची\nसोनार पूजा करतो.\nवेषधारी जंगमाची\nभक्त लोक पूजा करतात.\nज्ञान असलेल्या जंगमाला कोणीही ओळखू शकत नाही,\nहे कूडल चेन्नसंगमदेवा.","fr":"Le Jangama qui possède les seize arts,\nles rois le vénèrent.\nLe Jangama qui possède les plaisirs des sens,\nla courtisane le vénère.\nLe Jangama qui possède la science de l'alchimie,\nl'orfèvre le vénère.\nLe Jangama qui porte l'habit extérieur,\nles dévots le vénèrent.\nMais le Jangama qui possède la vraie connaissance, personne ne peut le percevoir,\nÔ Koodala Chennasangamadeva."},"m":{"en":"This Vachana highlights how people in the world venerate a Jangama—a spiritual seeker or renunciate—based entirely on their own worldly desires and external perceptions.\n\nKings revere a Jangama who possesses mastery over the sixteen worldly arts, a courtesan seeks one inclined toward sensory pleasures, and a goldsmith honours one skilled in alchemy, as each values only what serves their own interest.\n\nSimilarly, ordinary devotees are often drawn merely to the outward garb and appearance of a Jangama, mistaking external attire for true spiritual stature.\n\nAddressing the Formless Supreme Consciousness as Kudalachannasangamadeva, the Vachana concludes that a truly enlightened Jangama embodied in pure spiritual knowledge (Jnana) remains invisible and unrecognizable to those whose vision is bound by superficiality and self-interest.","hi":"इस वचन का केंद्रीय भाव यह है कि सांसारिक लोग प्रायः अपने स्वार्थ, रुचि या केवल बाहरी आकर्षण के आधार पर ही आध्यात्मिक साधकों और संन्यासियों (जंगम) का आदर-सत्कार करते हैं।\n\nइसमें स्पष्ट किया गया है कि राजा सोलह कलाओं में निपुण जंगम को पूजते हैं, वेश्या विषय-भोगों में लिप्त जंगम को, सुनार रसायन विद्या (धातु को सोना बनाने की कला) जानने वाले जंगम को, और सामान्य भक्त केवल बाहरी वेशभूषा धारण करने वाले जंगम की पूजा करते हैं।\n\nकूडल चन्नसंगमदेव के रूप में निराकार परमतत्त्व को संबोधित करते हुए यह वचन इस गहन सत्य की ओर संकेत करता है कि बाहरी दिखावे और सांसारिक गुणों से परे, आत्मज्ञान से युक्त सच्चे जंगम को पहचान पाना किसी के लिए भी संभव नहीं होता।","mr":"या वचनाचा मुख्य आशय असा आहे की, समाजातील विविध लोक आपल्या स्वतःच्या व्यावहारिक गरजेनुसार किंवा बाह्य गुणांवरूनच जंगमाचा म्हणजेच आध्यात्मिक साधकाचा आदर करतात.\n\nउदाहरणार्थ, सोळा कलांनी युक्त असणाऱ्याला राजे पूजतात, विषयवासना असणाऱ्याकडे वेश्या आकर्षित होते, किमया (रसविद्या) जाणणाऱ्याला सोनार मान देतो, तर केवळ बाह्य वेषभूषा धारण करणाऱ्या जंगमाची सामान्य भक्त पूजा करतात.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाला उद्देशून हे वचन स्पष्ट करते की, लोक केवळ बाह्य रूप आणि कौशल्यांवर भाळतात, परंतु ज्याच्याकडे खऱ्या आत्मज्ञानाची खोली आहे असा ज्ञानी जंगम मात्र कोणाच्याही सहज दृष्टीस पडत नाही किंवा कोणालाही ओळखता येत नाही.","fr":"Ce vachana met en lumière la tendance humaine à ne valoriser chez un maître spirituel ou un chercheur itinérant, appelé Jangama, que ce qui correspond à ses propres intérêts mondains ou aux apparences extérieures.\n\nAinsi, les rois vénèrent le Jangama doté des seize arts et de prestance, la courtisane recherche celui qui est tourné vers les plaisirs des sens, et l'orfèvre honore celui qui maîtrise l'alchimie.\n\nDe même, les dévots ordinaires se contentent souvent d'adorer le Jangama qui en porte simplement l'habit et les attributs extérieurs, s'arrêtant ainsi à la forme superficielle de la spiritualité.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Koodala Channasangamadeva, le texte souligne avec lucidité que le véritable Jangama, porteur de la connaissance pure et de l'éveil intérieur, demeure invisible et incompris aux yeux du monde."}},{"no":916,"o":"ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಪಂಚಮಹಾಪಾತಕ, ಏಳನೆಯ ನರಕ.\n ಸಂಗಾ, ನೀನಿಲ್ಲದವರಂಗಣ ಬ್ರಹ್ಮೇತಿಗೆ ಅದು ಮೊದಲು.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಲಿಂಗಾಂಗಣ, ಅವರಂಗವು ಲಿಂಗ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣವೆ ವಾರಣಾಸಿಯಿಂದಧಿಕ.\n ಸಂಗಾ, ನೀನಿದ್ದವರಂಗಣ ಅಮೃತ ದಿವ್ಯಕ್ಷೇತ್ರದಿಂದಧಿಕ.\n ಸಂಗಾ, ಕೂಡಲ ಚೆನ್ನಸಂಗಾ,\n ನಿಮ್ಮ ಶರಣರ ಸಂಗ ಸುಸಂಗವೆನಗೆ.","t":{"en":"O Sanga, the courtyard of those without you is the five great sins, the seventh hell.\nO Sanga, the courtyard of those without you is the very root of Brahmanicide.\nO Sanga, the courtyard of those in whom you dwell is the courtyard of *Linga*, and their body itself is *Linga*.\nO Sanga, the courtyard of those in whom you dwell is greater than Varanasi.\nO Sanga, the courtyard of those in whom you dwell is greater than the immortal divine realms.\nO Sanga, O Koodala Chennasanga,\nthe fellowship of your *Sharanas* is true fellowship for me.","hi":"हे संग, जहाँ तुम नहीं हो उनका आँगन पंचमहापातक है, सातवाँ नरक है।\nहे संग, जहाँ तुम नहीं हो उनका आँगन ही ब्रह्महत्या का मूल है।\nहे संग, जहाँ तुम हो उनका आँगन लिंगांगण है, उनका अंग लिंग है।\nहे संग, जहाँ तुम हो उनका आँगन ही वाराणसी से भी बढ़कर है।\nहे संग, जहाँ तुम हो उनका आँगन अमृत दिव्यक्षेत्र से भी बढ़कर है।\nहे संग, हे कूडल चेन्नसंग,\nतुम्हारे शरणों का संग ही मेरे लिए सुसंग है।","mr":"हे संगा, जिथे तू नाहीस त्यांच्या अंगणात पंचमहापातक आणि सातवा नरक आहे.\nहे संगा, जिथे तू नाहीस त्यांचे अंगण म्हणजे ब्रह्महत्येचे मूळ आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण हे लिंगांगण आहे, आणि त्यांचे अंग हेच लिंग आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण हेच वाराणसीपेक्षा श्रेष्ठ आहे.\nहे संगा, जिथे तू आहेस त्यांचे अंगण अमृत दिव्यक्षेत्रापेक्षा श्रेष्ठ आहे.\nहे संगा, हे कूडल चेन्नसंगा,\nतुझ्या शरणांचा संग हाच माझ्यासाठी सुसंग आहे.","fr":"Ô Sanga, la cour de ceux chez qui tu n'es pas est les cinq grands crimes, elle est le septième enfer.\nÔ Sanga, la cour de ceux chez qui tu n'es pas est la source même du meurtre d'un brahmane.\nÔ Sanga, la cour de ceux chez qui tu demeures est la cour du Linga, et leur corps même est le Linga.\nÔ Sanga, la cour de ceux chez qui tu demeures est supérieure à Varanasi.\nÔ Sanga, la cour de ceux chez qui tu demeures est supérieure au lieu sacré divin et immortel.\nÔ Sanga, Ô Koodala Chennasanga,\nla compagnie de tes Sharanas est pour moi la noble compagnie."},"m":{"en":"This Vachana contrasts a life devoid of the Formless Supreme Consciousness with one deeply rooted in divine awareness.\n\nThe text explains that the dwelling of those who lack the presence of Kudalachannasanga is spiritually desolate, comparing it to the five great sins, the seventh hell, and the gravest of transgressions.\n\nIn contrast, where the Supreme Reality abides, the very bodies of the devotees become identified with Linga, transforming their courtyard into a sacred space that surpasses even revered pilgrimage centres like Varanasi and other divine realms.\n\nUltimately, the Vachana affirms that true spiritual fulfilment lies not in external holy places, but in the noble fellowship (Susanga) of the Sharanas who embody this living consciousness.","hi":"इस वचन का केंद्रीय भाव यह है कि कूडल चन्नसंग अर्थात निराकार परमतत्त्व की उपस्थिति ही किसी स्थान और जीवन को वास्तविक पवित्रता प्रदान करती है।\n\nजिन लोगों के जीवन और आँगन में इस परम चैतन्य का वास नहीं है, उनका स्थान पंचमहापातक, सातवें नरक और ब्रह्महत्या जैसे घोर पापों के मूल कारण के समान अपवित्र माना गया है।\n\nइसके विपरीत, जिनके भीतर यह परमतत्त्व विद्यमान है, उनका आँगन स्वयं 'लिंगांगण' बन जाता है, उनकी देह ही लिंगस्वरूप हो जाती है, और वह स्थान वाराणसी या किसी भी अन्य दिव्य तीर्थक्षेत्र से कहीं अधिक श्रेष्ठ हो जाता है।\n\nयह वचन स्पष्ट करता है कि किसी बाहरी तीर्थ की अपेक्षा परमतत्त्व से युक्त शरणों का सान्निध्य और सत्संग ही साधक के लिए सर्वोच्च तथा कल्याणकारी संगति है।","mr":"ज्यांच्या जीवनात आणि निवासात निराकार परमतत्त्वाचे अधिष्ठान नसते, त्यांचे अंगण पंचमहापातकांसारखे, ब्रह्महत्येच्या पातकाचे मूळ आणि सातव्या नरकासमान अपवित्र ठरते, असे हे वचन स्पष्ट करते.\n\nयाउलट, जिथे या परमचैतन्याचे अस्तित्व असते, ते अंगणच पावन लिंगांगण बनते आणि तिथे राहणाऱ्यांचे शरीरही चैतन्यस्वरूप होऊन जाते.\n\nअशा जागेचे पावित्र्य वाराणसी किंवा इतर कोणत्याही बाह्य दिव्य तीर्थक्षेत्रापेक्षाही अधिक श्रेष्ठ असते.\n\nम्हणूनच, कूडलचन्नसंग या परमतत्त्वाच्या जाणिवेत जगणाऱ्या शरणांचा सहवास हाच खरा आणि सर्वोच्च सुसंग आहे, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le contraste absolu entre un espace dépourvu de la conscience du Principe suprême et la demeure de ceux qui vivent en présence de Koodala Channasanga.\n\nLa cour de ceux qui sont étrangers à cette Réalité suprême sans forme est décrite comme la source même des cinq grands péchés, du crime de brahmanicide et du septième enfer, illustrant le vide spirituel d'une existence coupée de la vérité.\n\nÀ l'inverse, là où réside cette présence intérieure, le corps humain devient lui-même Linga et l'espace quotidien se transforme en un sanctuaire vivant, surpassant la sacralité de lieux de pèlerinage traditionnels comme Varanasi ou les domaines divins immortels.\n\nLa portée spirituelle de ce vachana réside ainsi dans la reconnaissance que la véritable grâce et la plus haute compagnie spirituelle se trouvent uniquement dans la fraternité éveillée des Sharanas."}},{"no":917,"o":"ಸಜ್ಜನ ಸದ್ಭಾವಿ ಅನ್ಯರಲ್ಲಿ ಕೈಯ್ಯಾಂತು ಬೇಡ,\n ಲಿಂಗವ ಮುಟ್ಟಿದ ಕೈ ಮೀಸಲು.\n ಕಂಗಳಲ್ಲಿ ಒಸೆದು ನೋಡ ಪರವಧುವ.\n ಮನದಲ್ಲಿ ನೆನೆಯನನ್ಯವ, ಮಾನವ ಸೇವೆಯ ಮಾಡ,\n ಲಿಂಗವ ಬೇಡ, ಲಿಂಗದ ಹಂಗನೊಲ್ಲ,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಾ ನಿಮ್ಮ ಶರಣ.","t":{"en":"The virtuous one of pure devotion does not stretch out his hand to beg from others,\nfor the hand that has touched the *Linga* is consecrated.\nWith his eyes, he does not look with desire upon another's wife.\nIn his mind, he does not think of another, nor does he serve mortals;\nhe does not beg of the *Linga*, nor does he accept obligation even to the *Linga*—\nO Koodala Chennasanga, such is your *Sharana*.","hi":"सज्जन सद्भावी परायों के आगे हाथ फैलाकर नहीं माँगता,\nलिंग को छूनेवाला हाथ समर्पित है।\nआँखों से रीझकर पराई स्त्री को नहीं देखता।\nमन में पराये का स्मरण नहीं करता, मनुष्य की चाकरी नहीं करता,\nलिंग से नहीं माँगता, लिंग का एहसान नहीं चाहता,\nहे कूडल चेन्नसंग, आपका शरण।","mr":"सज्जन आणि सद्भावी भक्त इतरांपुढे हात पसरून मागत नाही,\nलिंगाला स्पर्श केलेला हात राखून ठेवलेला असतो।\nडोळ्यांनी परस्त्रीकडे मोहित होऊन पाहत नाही।\nमनात अन्याचे स्मरण करत नाही, मानवाची सेवा करत नाही,\nलिंगाकडेही मागत नाही, लिंगाचे मिंधेपणही स्वीकारत नाही,\nहे कूडल चेन्नसंगा, तुमचा शरण।","fr":"L'être vertueux aux sentiments purs ne tend pas la main pour mendier auprès d'autrui,\nla main qui a touché le Linga est consacrée.\nDe ses yeux, il ne regarde point avec désir la femme d'autrui.\nDans son esprit, il ne pense à nul autre, il ne se met point au service des mortels,\nil n'implore rien du Linga, il ne veut même pas être redevable au Linga,\nÔ Koodala Chennasanga, votre Sharana."},"m":{"en":"This Vachana defines the profound self-respect and spiritual autonomy of a true Sharana, whose hands, having touched the Ishtalinga—the sacred medium directing the mind toward the Formless Divine—are consecrated and therefore never stretched out to beg from others.\n\nAnchored in pure intention, such a practitioner maintains complete mastery over the senses and mind, refusing to look upon another's spouse with desire, harbor extraneous thoughts, or submit to the servitude of mortal beings.\n\nEven in relation to Kudalachannasanga, the Formless Supreme Consciousness, the Sharana transcends transactional devotion, neither pleading with the Linga for favors nor living under any sense of spiritual obligation.","hi":"यह वचन एक सच्चे और सद्भावी शरण के स्वाभिमान, नैतिक पवित्रता तथा पूर्ण निष्काम भाव को स्पष्ट करता है।\n\nनिराकार परमतत्त्व के प्रतीक इष्टलिंग का स्पर्श करने वाले हाथ पूर्णतः पवित्र और समर्पित होते हैं, इसलिए एक शरण कभी किसी अन्य के आगे हाथ फैलाकर याचना नहीं करता और न ही किसी पराए स्त्री-धन को कामना की दृष्टि से देखता है।\n\nवह अपने मन में परम सत्य के अतिरिक्त किसी अन्य का चिंतन नहीं करता और न ही स्वार्थवश साधारण मनुष्यों की चाटुकारिता या गुलामी करता है।\n\nइस वचन का आध्यात्मिक मर्म यह है कि कूडल चन्नसंग का शरण इतना स्वाभिमानी और कामना-मुक्त होता है कि वह स्वयं लिंग से भी कुछ नहीं मांगता और न ही किसी प्रकार के आश्रय या एहसान के बंधन को स्वीकार करता है।","mr":"हे वचन कूडलचन्नसंग या निराकार परमतत्त्वाशी एकरूप झालेल्या एका खऱ्या, सज्जन आणि सद्भावी शरणाच्या स्वाभिमानी व नैतिक आचरणाचे दर्शन घडवते.\n\nआपल्या हातांनी ज्याने परम सत्याचे प्रतीक असलेले इष्टलिंग स्पर्शले आहे, त्या पवित्र हातांना तो स्वतःसाठी पूर्णपणे राखून ठेवतो आणि अलिप्त राहून इतर कोणासमोरही भिक्षा किंवा याचना करण्यासाठी कधीही हात पसरत नाही.\n\nत्याच्या इंद्रियांवर व मनावर त्याचे पूर्ण नियंत्रण असते; तो परस्त्रीकडे कधीही वासनेच्या किंवा मोहाच्या नजरेने पाहत नाही, आपल्या मनात परमतत्त्वाशिवाय इतर कोणत्याही गोष्टीचे चिंतन करत नाही आणि कोणत्याही सामान्य मानवाची लाचारी किंवा चाकरी पत्करत नाही.\n\nविशेष म्हणजे, असा शरण केवळ संसारातील लोकांकडेच नव्हे, तर खुद्द लिंगाकडेही कशाचीही मागणी करत नाही आणि लिंगाच्या कोणत्याही उपकाराचे किंवा मिंधेपणाचे ओझे स्वतःवर घेत नाही, कारण त्याची भक्ती पूर्णपणे निष्काम आणि स्वतंत्र असते.","fr":"Ce vachana met en lumière la noblesse morale et l'intégrité absolue du véritable Sharana, un être vertueux et animé d'une intention pure qui ne tend jamais la main pour mendier auprès d'autrui.\n\nAyant touché l'Ishtalinga, le miroir symbolique de la Réalité suprême sans forme, ses mains demeurent consacrées, tout comme ses yeux ne portent aucun regard de désir sur la femme d'autrui et son esprit reste détaché de toute pensée étrangère à la vérité.\n\nUne telle personne refuse de s'asservir aux mortels et transcende même toute démarche intéressée envers le Linga, ne lui adressant aucune requête personnelle et ne se sentant liée par aucune dette ou dépendance.\n\nÀ travers la signature spirituelle Koodalachannasanga, le poème affirme que l'accomplissement du chercheur réside dans une autonomie intérieure totale et une union libre de toute attente envers le Principe absolu."}},{"no":918,"o":"ಸತಿಯ ಕೈಯಲ್ಲಿ ಕೊಟ್ಟುದು ಪ್ರಾಣಲಿಂಗವಲ್ಲ,\n ಸುತನ ಕೈಯಲ್ಲಿ ಕೊಟ್ಟುದು ಪ್ರಾಣಲಿಂಗವಲ್ಲ,\n ಅಲಸಿ ನಾಗವತ್ತಿಗೆಯಲಿರಿಸಿದುದು ಪ್ರಾಣಲಿಂಗವಲ್ಲ,\n ತನುವ ಸೋಂಕಿ ವಜ್ರಲೇಪದಂತಿರಬೇಕು.\n ಮನ-ಕರದಲ್ಲಿ ಕೊಟ್ಟ ಪ್ರಾಣಲಿಂಗ ಹಿಂಗಿದರೆ\n ಅವನಂದೇ ವ್ರತಗೇಡಿ, ಕೂಡಲಚೆನ್ನಸಂಗಮದೇವಾ.","t":{"en":"That which is handed over into the hands of one's wife is not the *Pranalinga*,\nthat which is handed over into the hands of one's son is not the *Pranalinga*,\nthat which, out of weariness, is placed upon a wall-peg is not the *Pranalinga*;\ntouching the body, it must remain like diamond-cement.\nIf the *Pranalinga* given into the mind and palm ever parts from one,\nthat very day he is a breaker of his vow, O Koodalachennasangamadeva.","hi":"सती के हाथ में दिया गया प्राणलिंग नहीं है,\nसुत के हाथ में दिया गया प्राणलिंग नहीं है,\nथककर खूँटी पर रखा गया प्राणलिंग नहीं है,\nतनु को छूकर वज्रलेप के समान रहना चाहिए।\nमन-कर में दिया गया प्राणलिंग यदि अलग हो जाए,\nतो वह उसी दिन व्रतभ्रष्ट है, हे कूडलचेन्नसंगमदेव।","mr":"पत्नीच्या हाती दिलेले प्राणलिंग नव्हे,\nपुत्राच्या हाती दिलेले प्राणलिंग नव्हे,\nकंटाळून खुंटीवर ठेवलेले प्राणलिंग नव्हे,\nते तनूला स्पर्शून वज्रलेपासारखे असले पाहिजे।\nमन-करांत दिलेले प्राणलिंग विलग झाले तर\nतो त्याच क्षणी व्रतभ्रष्ट ठरतो, हे कूडलचेन्नसंगमदेवा।","fr":"Ce qui est remis entre les mains de l'épouse n'est pas le Pranalinga,\nce qui est remis entre les mains du fils n'est pas le Pranalinga,\nce qui, par lassitude, est déposé sur la patère murale n'est pas le Pranalinga ;\nen touchant le corps, il doit y adhérer comme un ciment de diamant.\nSi le Pranalinga confié à l'esprit et à la main vient à s'en séparer,\ncelui-là, dès ce jour même, a rompu son vœu, Ô Koodalachannasangamadeva."},"m":{"en":"This Vachana explains that the Linga worn on the body—the sacred medium toward the Formless Supreme Consciousness—can only be called Pranalinga when it remains inseparable from one's very life-breath and consciousness.\n\nIf a seeker casually hands the Ishtalinga over to a spouse or a son, or sets it aside on a pedestal out of weariness, it reduces this sacred symbol to a mere external object devoid of vital spiritual connection.\n\nInstead, the Vachana emphasizes that the Linga must remain fused with the body like an unbreakable diamond bond, constantly held in both the palm and the mind.\n\nAddressing the Supreme Reality as Kudalachannasangamadeva, the Vachana declares that the moment a seeker separates from the Pranalinga entrusted to the hand and mind, they immediately forfeit their spiritual vow and integrity.","hi":"इस वचन का मूल भाव यह है कि निराकार परमतत्त्व की अनुभूति के पवित्र माध्यम रूपी इष्टलिंग (प्राणलिंग) को कभी भी अपने शरीर और चेतना से अलग नहीं करना चाहिए।\n\nजिसे अपनी पत्नी या पुत्र के हाथों में सौंप दिया जाए, या आलस्यवश उतारकर खूँटी या ताक पर रख दिया जाए, वह सच्चे अर्थों में प्राणलिंग नहीं हो सकता।\n\nसाधक के लिए आवश्यक है कि इष्टलिंग उसके शरीर के साथ वज्रलेप की भाँति अटूट रूप से जुड़ा रहे।\n\nकूडलचेन्नसंगमदेव के प्रति समर्पित यह वचन स्पष्ट करता है कि मन और कर में धारण किया गया प्राणलिंग यदि एक क्षण के लिए भी शरीर से अलग होता है, तो वह व्यक्ति उसी दिन अपने आध्यात्मिक व्रत से च्युत (व्रतभ्रष्ट) हो जाता है।","mr":"हे वचन प्राणलिंगाच्या निष्ठावान धारणेचे आणि अखंड आध्यात्मिक जाणीवेचे महत्त्व स्पष्ट करते.\n\nजे इष्टलिंग स्वतःजवळ न ठेवता पत्नीच्या किंवा पुत्राच्या हाती सोपवले जाते, अथवा आळसामुळे खुंटीवर किंवा पेटीत काढून ठेवले जाते, ते खऱ्या अर्थाने प्राणलिंग ठरू शकत नाही.\n\nनिराकार परमतत्त्वाशी एकरूप होण्याचे पवित्र माध्यम असलेले लिंग हे शरीराशी आणि प्राणाशी वज्रलेपाप्रमाणे अढळपणे जोडलेले असले पाहिजे.\n\nकूडलचन्नसंगमदेव या परमतत्त्वाच्या साक्षीने हे वचन सांगते की, गुरूंनी मन आणि तळहातावर दिलेले हे प्राणलिंग ज्या क्षणी साधकापासून दूर होते, त्याच दिवशी तो साधक आपल्या आध्यात्मिक व्रतापासून भ्रष्ट होतो.","fr":"Ce vachana met en lumière le caractère indissociable du Pranalinga — l'Ishtalinga intériorisé comme le souffle vital même — de la personne qui le porte.\n\nUn Linga que l'on confie par négligence aux mains de son épouse ou de son fils, ou que l'on dépose sur un support par lassitude, perd toute sa valeur de Pranalinga, lequel sert de médium sacré pour orienter la conscience vers la Réalité suprême sans forme.\n\nAu contraire, il doit demeurer en contact permanent avec le corps, uni à lui avec la solidité d'un ciment de diamant, tout en habitant pleinement la main et l'esprit du chercheur spirituel.\n\nÀ travers la signature spirituelle Koodalachannasangamadeva, le texte affirme avec rigueur que quiconque se sépare de ce Pranalinga reçu dans la paume et dans la conscience rompt à cet instant même son engagement spirituel (vrata)."}},{"no":919,"o":"ಸತಿಯ ಸಂಗವತಿಸುಖವೆಂದರಿದಡೇನು,\n ಗಣಸಾಕ್ಷಿಯಾಗಿ ವಿವಾಹವಾಗದನ್ನಕ್ಕರ?\n ಕಣ್ಣು ಕಾಂಬುದೆಂದಡೆ,\n ಕತ್ತಲೆಯಲ್ಲಿ ಕಾಂಬುದೆ ದೀಪವಿಲ್ಲದನ್ನಕ್ಕರ?\n ಸೂರ್ಯನ ಪ್ರಕಾಶದಿಂದ ಕಂಡು\n ತಾನೆ, ಕಂಡೆನೆಂಬ ಜಗದ ನಾಣ್ಣುಡಿಯಂತಾಯಿತ್ತು.\n ಅಂಗವ ಬಿಟ್ಟು ಆತ್ಮನುಂಟೆ? ಶಕ್ತಿಯ ಬಿಟ್ಟು ಶಿವನುಂಟೆ?\n ಇದು ಕಾರಣ, ಸ್ಥೂಲ ಸೂಕ್ಷ್ಯ್ಮ ಕಾರಣ ತನುತ್ರಯವಿರಲು,\n ಇಷ್ಟ ಪ್ರಾಣ ಭಾವವೆಂಬ ತ್ರಿವಿಧಲಿಂಗಸಂಬಂಧ ಬೇಡವೆಂದಡೆ\n ಅಸಂಖ್ಯಾತ ಪ್ರಮಥಗಣಂಗಳೊಪ್ಪುವರೆ?\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯನಲ್ಲಿ\n ಇಷ್ಟಲಿಂಗಸಂಬಂಧವಿಲ್ಲದವರ ಮುಖವ\n ನೋಡಲಾಗದು ಪ್ರಭುವೆ.","t":{"en":"What good is it to know that union with a wife is supreme bliss,\nunless one is wedded with the *Ganas* as witness?\nThough one says the eye can see,\ncan it see in the darkness unless there is a lamp?\nSeeing by the light of the sun,\nto say, \"I saw by myself,\" is like the proverb of the world.\nIs there a soul apart from the body? Is there Shiva apart from *Shakti*?\nTherefore, while the threefold body—the gross, the subtle, and the causal—exists,\nif one says there is no need for the bond with the threefold *Linga*—*Ishta*, *Prana*, and *Bhava*—\nwill the countless *Pramatha Ganas* approve?\nBefore Koodala Chennasangayya,\none must not look upon the face of those\nwho have no bond with the *Ishtalinga*, O Lord.","hi":"सती का संग अति सुखकारी है, यह जान लेने से क्या,\nजब तक गणों की साक्षी में विवाह न हो?\nआँख देखती है कहने पर,\nक्या अँधेरे में देख सकती है जब तक दीप न हो?\nसूर्य के प्रकाश से देखकर,\nस्वयं ही देखा, कहनेवाली जगत की कहावत के समान हुआ।\nअंग को छोड़कर क्या आत्मा होती है? शक्ति को छोड़कर क्या शिव होते हैं?\nइस कारण, स्थूल, सूक्ष्म और कारण इन तनुत्रय के रहते,\nइष्ट, प्राण और भाव कहनेवाले त्रिविध लिंग-संबंध नहीं चाहिए कहने पर,\nक्या असंख्यात प्रमथगण मानेंगे?\nकूडलचेन्नसंगय्या में\nइष्टलिंग-संबंध से रहित लोगों का मुख\nनहीं देखना चाहिए, हे प्रभु।","mr":"सतीचा संग अतिसुखाचा आहे असे जाणून काय लाभ,\nजोवर गणांच्या साक्षीने विवाह होत नाही?\nडोळा पाहतो असे म्हटले तरी,\nजोवर दिवा नसतो तोवर अंधारात पाहू शकेल का?\nसूर्याच्या प्रकाशाने पाहूनही\nस्वतःच पाहिले, असे म्हणणाऱ्या जगाच्या म्हणीसारखे हे झाले.\nअंग सोडून आत्मा असतो का? शक्ती सोडून शिव असतो का?\nया कारणास्तव, स्थूल, सूक्ष्म आणि कारण हे तनुत्रय असताना,\nइष्ट, प्राण आणि भाव असे म्हणवले जाणारे त्रिविध लिंगसंबंध नको म्हटल्यास\nअसंख्यात प्रमथगण ते मान्य करतील का?\nकूडलचेन्नसंगय्यांच्या ठायी\nइष्टलिंगसंबंध नसलेल्यांचे मुख\nपाहू नये, हे प्रभो.","fr":"Que sert-il de savoir que la compagnie de l'épouse est d'un bonheur suprême,\ntant que l'on ne s'est pas marié avec les Gana pour témoins ?\nSi l'on dit que l'œil voit,\npeut-il voir dans l'obscurité tant qu'il n'y a pas de lampe ?\nAyant vu par la lumière du soleil,\nc'est devenu semblable au dicton du monde disant que l'on a vu par soi-même.\nSans le corps, y a-t-il un Atman ? Sans la Shakti, y a-t-il un Shiva ?\nC'est pourquoi, alors qu'existent les trois corps — grossier, subtil et causal —,\nsi l'on dit qu'il n'est pas besoin du lien au triple Linga que l'on appelle Ishta, Prana et Bhava,\nles innombrables Pramathagana l'accepteront-ils ?\nAuprès de Koodala Chennasangayya,\nle visage de ceux qui n'ont pas de lien avec l'Ishtalinga,\nil ne faut point le regarder, ô Prabhu."},"m":{"en":"This Vachana explains the indispensable role of the Ishtalinga as the sacred visual medium (Kuruhu) required to realize the Formless Supreme Consciousness (Aruhu).\n\nJust as marital union is meaningful only when witnessed by the community, and just as the eye requires the light of a lamp or the sun to see rather than seeing by itself in darkness, inner spiritual realization cannot occur in isolation from its tangible medium.\n\nBecause the soul cannot exist without the body and Shiva is inseparable from Shakti, a seeker possessing the three bodies—gross, subtle, and causal—must necessarily unite with the threefold Linga of Ishta, Prana, and Bhava to earn the acceptance of the innumerable Pramathaganas.\n\nAddressing Prabhu in the witness of Kudalachannasanga, the Vachana concludes that one should not even look upon the faces of those who reject this essential relationship with the Ishtalinga.","hi":"यह वचन निराकार परमतत्त्व की अनुभूति के लिए 'इष्टलिंग' रूपी पवित्र माध्यम की अनिवार्यता और तीन शरीरों के साथ त्रिविध लिंग के संबंध के महत्त्व को स्पष्ट करता है।\n\nजिस प्रकार समाज और गणों को साक्षी मानकर विवाह किए बिना स्त्री के संग के सुख को जानना निरर्थक है, और जिस प्रकार दीपक या सूर्य के प्रकाश के बिना आँखें होने पर भी अंधकार में कुछ नहीं देखा जा सकता, उसी प्रकार इष्टलिंग रूपी माध्यम के बिना केवल आत्मज्ञान का दावा करना व्यर्थ है।\n\nजैसे शरीर के बिना आत्मा और शक्ति के बिना शिव का अस्तित्व संभव नहीं है, वैसे ही जब तक मनुष्य के पास स्थूल, सूक्ष्म और कारण रूपी तीन शरीर हैं, तब तक इष्टलिंग, प्राणलिंग और भावलिंग के त्रिविध संबंध को नकारना असंख्य प्रमथगणों को भी स्वीकार्य नहीं है।\n\nअंततः यह वचन स्पष्ट करता है कि कूडलचेन्नसंगमदेव के पथ में जो लोग इष्टलिंग के इस पवित्र संबंध से रहित हैं, उनका मुख भी देखने योग्य नहीं है, क्योंकि इष्टलिंग ही निराकार शुद्ध चैतन्य में प्रवेश करने का वास्तविक आधार है।","mr":"हे वचन निराकार परमतत्त्वाच्या प्राप्तीसाठी इष्टलिंग या पवित्र माध्यमाची आणि शरीर व लिंग यांच्यातील अद्वैत संबंधाची अनिवार्यता स्पष्ट करते.\n\nज्याप्रमाणे गणसाक्षीने विवाह झाल्याशिवाय सहजीवनाला पूर्णत्व येत नाही किंवा अंधारात दिव्याशिवाय आणि सूर्याच्या प्रकाशाशिवाय डोळ्यांना दिसू शकत नाही, त्याचप्रमाणे बाह्य साधनाशिवाय केवळ बौद्धिक जाणिवेच्या बळावर सत्याचा साक्षात्कार झाल्याचा दावा करणे निरर्थक ठरते.\n\nशरीराशिवाय आत्मा आणि शक्तीशिवाय शिव यांचे अस्तित्व असू शकत नाही; म्हणूनच जोपर्यंत साधकाजवळ स्थूल, सूक्ष्म आणि कारण ही तीन शरीरे आहेत, तोपर्यंत त्यांना अनुसरून अनुक्रमे इष्टलिंग, प्राणलिंग आणि भावलिंग या त्रिविध लिंगांचा संबंध असणे अत्यंत आवश्यक आहे.\n\nकूडलचन्नसंगमदेव या नावाने संबोधल्या गेलेल्या शुद्ध चैतन्याशी एकरूप होण्यासाठी इष्टलिंग हेच मूळ प्रवेशद्वार असून, जो या साकार प्रतिकाचा (कुरुहू) संबंध नाकारतो तो खऱ्या शरण परंपरेला आणि असंख्य प्रमथगणांना कधीही मान्य होऊ शकत नाही, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le caractère indispensable du lien sacré avec l'Ishtalinga sur la voie de la réalisation spirituelle.\n\nDe même que l'union conjugale n'est légitime qu'avec le mariage devant les Ganas, ou que l'œil ne peut percevoir dans l'obscurité sans la lumière d'une lampe ou du soleil, l'âme ne saurait exister sans le corps, ni Shiva sans Shakti.\n\nAinsi, tant que l'être demeure revêtu des trois corps — grossier, subtil et causal —, l'union avec le triple Linga (Ishtalinga, Pranalinga et Bhavalinga) demeure une nécessité absolue que les innombrables Pramathaganas ne sauraient voir rejetée.\n\nS'adressant à Prabhu dans la conscience de la Réalité suprême sans forme invoquée sous le nom de Koodalachannasanga, le poète affirme avec fermeté qu'il ne faut pas même poser le regard sur ceux qui sont dépourvus de cette relation vivante avec l'Ishtalinga, le support sacré permettant d'accéder à l'Absolu."}},{"no":920,"o":"ಸತ್ಯವಿಲ್ಲದ ಭಕ್ತಿಯ ಸಾವಿರ ವರುಷ ಮಾಡಿದರೇನು?\n ನಿಷ್ಠೆಯಿಲ್ಲದ ಪೂಜೆಯನೇಸುಕಾಲ ಮಾಡಿದರೇನು?\n ಭಾವ ನೆಲೆಗೊಳ್ಳದ ಪ್ರಸಾದವನೇಸುಕಾಲ ಕೊಂಡಲ್ಲಿ ಫಲವೇನು?\n ಅಭ್ಯಾಸವಾಯಿತ್ತಲ್ಲದೆ,\n ಒಬ್ಬರೊಬ್ಬರ ಕಂಡು ಮಾಡುವರಲ್ಲದೆ,\n ಸಹಜವಿಲ್ಲ, ಸಮ್ಯಕ್ಕಿಲ್ಲ, ನಿಜವಿಲ್ಲ.\n ಇದು ಕಾರಣ, ಇಂತಪ್ಪವರ ಭಕ್ತರೆಂದೆನಲಾಗದು,\n ಕೂಡಲ ಚೆನ್ನಸಂಗಯ್ಯಾ ನೀ ಸಾಕ್ಷಿಯಾಗಿ ಛೀಯೆಂಬೆನು.","t":{"en":"What if one practises devotion without truth for a thousand years?\nWhat if one performs worship without steadfastness for ever so long?\nWhat is the fruit of receiving *Prasada* for ever so long when inner feeling has not settled?\nIt has only become mere habit,\nand they do it only by watching one another;\nthere is no spontaneity, no rightness, no reality.\nTherefore, such people cannot be called devotees;\nO Koodala Chennasangayya, with you as witness, I cry shame upon them.","hi":"सत्यरहित भक्ति को हज़ार वर्ष करने पर क्या?\nनिष्ठारहित पूजा को कितना भी काल करने पर क्या?\nभाव के स्थिर हुए बिना प्रसाद को कितना भी काल ग्रहण करने पर फल क्या?\nअभ्यास हो गया है सिवाय इसके,\nएक-दूसरे को देखकर करते हैं सिवाय इसके,\nसहज नहीं है, सम्यक नहीं है, निज नहीं है।\nइस कारण, ऐसे लोगों को भक्त नहीं कहा जा सकता,\nहे कूडल चेन्नसंगय्या, तुम्हें साक्षी मानकर मैं धिक्कार कहता हूँ!","mr":"सत्य नसलेली भक्ती हजार वर्षे केली तरी काय उपयोग?\nनिष्ठा नसलेली पूजा कितीही काळ केली तरी काय उपयोग?\nभाव स्थिर न होता प्रसाद कितीही काळ ग्रहण केला तरी त्याचे फळ काय?\nही केवळ सवय झाली आहे,\nआणि एकमेकांना पाहून लोक असे करतात, यापलीकडे काही नाही;\nयात सहजता नाही, सम्यक भाव नाही, सत्यता नाही.\nयास्तव, अशा लोकांना भक्त म्हणता येणार नाही;\nहे कूडल चेन्नसंगय्या, तुला साक्षी ठेवून मी त्यांना 'छी!' म्हणतो.","fr":"À quoi bon pratiquer pendant mille ans une dévotion sans vérité ?\nÀ quoi bon accomplir aussi longtemps que ce soit une adoration sans fermeté intérieure ?\nQuel fruit y a-t-il à recevoir aussi longtemps que ce soit le Prasada sans que la ferveur intime n'y ait pris demeure ?\nCela n'est devenu qu'une habitude,\net ils ne font qu'agir en se regardant les uns les autres ;\nil n'y a là ni spontanéité naturelle, ni justesse parfaite, ni réalité authentique.\nC'est pourquoi de telles gens ne sauraient être appelés des dévots ;\nÔ Koodala Chennasangayya, te prenant à témoin, je leur dis : Fi !"},"m":{"en":"This Vachana emphasizes that devotion practiced without truth, worship performed without steadfast commitment, and the partaking of Prasada without an anchored inner feeling remain entirely fruitless, even if carried on for a thousand years.\n\nWhen spiritual practices are reduced to mere habit or blind imitation of others, they lack natural spontaneity, right understanding, and genuine authenticity.\n\nIn Sharana philosophy, external rituals hold no value unless they are rooted in inner awareness and sincere conviction.\n\nAddressing the Supreme Reality as Kudalachannasangama as a witness, the Vachana firmly rejects such mechanical practitioners, declaring that they cannot truly be called devotees.","hi":"इस वचन का केंद्रीय संदेश यह है कि सत्य से रहित भक्ति चाहे हजार वर्षों तक की जाए, निष्ठा के बिना पूजा कितने ही काल तक चले, और आंतरिक भाव की स्थिरता के बिना प्रसाद कितने ही समय तक ग्रहण किया जाए, उसका कोई आध्यात्मिक फल नहीं होता।\n\nयह वचन स्पष्ट करता है कि जब साधना केवल एक यांत्रिक आदत या दूसरों की देखा-देखी की जाने वाली नकल बन जाती है, तो उसमें सहजता, सम्यक बोध और यथार्थ सत्य का पूर्ण अभाव रहता है।\n\nइस वचन का तात्त्विक आशय यह है कि दिखावटी आचरण करने वाले ऐसे लोगों को सच्चा भक्त नहीं कहा जा सकता, और परम सत्य के प्रतीक कूडल चन्नसंगम को साक्षी मानकर ऐसे पाखंडपूर्ण व्यवहार का पूर्णतः तिरस्कार किया गया है।","mr":"हे वचन बाह्य आचरणापेक्षा अंतःकरणातील सत्य, निष्ठा आणि शुद्ध भाव यांना आध्यात्मिक जीवनात सर्वोच्च महत्त्व देते.\n\nज्या भक्तीत सत्याचा आधार नाही, ज्या पूजेत आंतरिक निष्ठा नाही आणि ज्या प्रसादाच्या स्वीकारामागे मनाची एकाग्रता व भाव नाही, ती सर्व कृत्ये हजारो वर्षे केली तरी पूर्णपणे निष्फळ ठरतात.\n\nअशा प्रकारची साधना ही केवळ एक यांत्रिक सवय किंवा इतरांचे पाहून केलेले अंधानुकरण बनून जाते; तिच्यात कोणतीही सहजता, सम्यक जाणीव किंवा आत्मिक खरेपणा उरत नाही.\n\nम्हणूनच, कूडलचन्नसंगम या परमतत्त्वाला साक्षी ठेवून या वचनात अशा दांभिक आणि वरवरच्या आचरणाचा तीव्र निषेध केला आहे, कारण अशा लोकांना खऱ्या अर्थाने भक्त म्हणता येत नाही.","fr":"Ce vachana met en lumière la futilité des pratiques spirituelles dépourvues de vérité, de dévouement sincère et d'intériorité véritable, même lorsqu'elles sont accomplies durant un millier d'années.\n\nIl souligne que le culte sans intégrité et la réception du Prasada sans l'ancrage d'un sentiment intérieur profond ne portent aucun fruit, se réduisant à une simple habitude mécanique ou à une imitation superficielle d'autrui.\n\nEn l'absence de spontanéité naturelle, de justesse et d'authenticité, ceux qui s'adonnent à de tels gestes extérieurs ne sauraient être considérés comme de véritables dévots.\n\nPrenant à témoin la Réalité suprême sans forme, invoquée sous la signature spirituelle de Koodala Channasangama, le texte rejette avec vigueur cette religiosité factice et dénuée de conscience véritable."}}]},
{"id":"s3","n":{"en":"Siddharameshwara","hi":"सिद्धरामेश्वर","mr":"सिद्धरामेश्वर","fr":"Siddharameshwara"},"v":[{"no":1001,"o":"ಗಿರಿಗಹ್ವರದೊಳಗರಸಿ ತೊಳಲಿ ಬಳಲಿದೆನವ್ವಾ.\n ನೋಡಿ ನೋಡಿ ಕಣ್ಣು ನಟ್ಟಾಲಿ ಬಿದ್ದವವ್ವಾ.\n ನೀನು ಗುರುವಾಗಿ ಬಂದು ಎನ್ನ ಭವವ ಹರಿದೆ.\n ನೀನು ಭಕ್ತಕಾರಣ ಪರಶಿವಮೂರ್ತಿಯೆಂದರಿದೆ ಕಾಣಾ,\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಯ್ಯಾ.","t":{"en":"Searching in mountain caves, I wandered and grew weary, O Mother.\nGazing and gazing, my eyes grew fixed and sunken, O Mother.\nYou came as the Guru and tore away my cycle of worldly existence.\nI came to know truly that you are the Supreme Shiva-form manifest for the sake of devotees,\nO Lord Kapilasiddha Mallikarjuna.","hi":"गिरि-गुफाओं में खोजकर, भटककर मैं थक गया, हे माँ।\nदेख-देखकर आँखें पथरा गईं, हे माँ।\nतुमने गुरु बनकर आकर मेरा भव हर लिया।\nमैंने जान लिया कि तुम भक्तों के लिए परशिवमूर्ति हो, देखो,\nहे कपिलसिद्ध मल्लिकार्जुन!","mr":"डोंगर-कपारींत शोधत, भटकत मी थकून गेलो, हे माते.\nपाहून पाहून माझे डोळे स्थिरावून गेले, हे माते.\nतू गुरू होऊन आलास आणि माझा भव हरण केलास.\nतू भक्तांसाठीच असलेली परशिवमूर्ती आहेस हे मी जाणले पहा,\nहे कपिलसिद्ध मल्लिकार्जुना.","fr":"En cherchant et en errant dans les montagnes et les cavernes, je me suis épuisé, ô Mère.\nÀ force de regarder et de regarder encore, mes yeux se sont figés, ô Mère.\nEn venant en tant que Gourou, tu as brisé le cycle de mes renaissances.\nVois, j'ai compris que tu es la forme même de Parashiva manifestée pour le dévot,\nÔ Seigneur Kapilasiddha Mallikarjuna."},"m":{"en":"This Vachana portrays the exhausting futility of searching for the Supreme Reality in external places like mountains and caves.\n\nAfter wandering endlessly and straining the eyes in a vain physical pursuit, true spiritual awakening occurs only when the Divine manifests in the form of the Guru to sever the cycle of worldly existence.\n\nAddressed to the Formless Supreme Consciousness through the ankitanama Kapilasiddha Mallikarjuna, the verse reveals that the Absolute assumes a perceptible presence solely out of compassion for the seeker, guiding the devotee toward inner realization.","hi":"इस वचन का केंद्रीय भाव यह है कि बाह्य पर्वतों और गुफाओं में भटकते हुए परम सत्य को खोजना केवल थकान और निराशा ही देता है।\n\nसाधक का अनुभव यह स्पष्ट करता है कि बाहरी स्थानों में निरंतर तलाश करने से आँखें भले ही पथरा जाएँ, किंतु केवल बाह्य भटकाव से आत्मिक तृप्ति प्राप्त नहीं होती।\n\nजब निराकार परमतत्त्व स्वयं गुरु के रूप में प्रकट होकर मार्गदर्शन करता है, तभी साधक के जन्म-मरण रूपी भव-बंधन कटते हैं और अज्ञान का अंत होता है।\n\nकपिलसिद्ध मल्लिकार्जुन को संबोधित यह वचन इसी आध्यात्मिक समझ को रेखांकित करता है कि शुद्ध चैतन्य ही भक्तों के उद्धार के लिए गुरु-रूप धारण कर प्रत्यक्ष होता है।","mr":"हे वचन परमतत्त्वाचा बाह्य जगात घेतला जाणारा व्यर्थ शोध आणि सद्गुरूंच्या कृपेने होणारा आध्यात्मिक साक्षात्कार स्पष्ट करते.\n\nडोंगर-गुहांमध्ये व भौतिक जागी परम सत्याचा शोध घेत भटकल्याने केवळ थकवा येतो आणि डोळे शिणून जातात, कारण ते तत्त्व अशा बाह्य भटकंतीने सापडत नाही.\n\nजेव्हा निराकार परमात्मा स्वतः गुरूच्या रूपाने साधकाच्या जीवनात प्रवेश करतो, तेव्हाच साधकाचे जन्म-मरणरूपी भवबंधन नष्ट होते.\n\nकपिलसिद्ध मल्लिकार्जुन हे परमतत्त्व भक्तांच्या कल्याणासाठीच गुरुरूपाने साकार झालेले परम चैतन्य आहे, या सत्याची प्रचिती या वचनातून व्यक्त होते.","fr":"Ce vachana met en lumière la futilité de rechercher la Vérité absolue dans des lieux extérieurs tels que les montagnes et les cavernes, une quête physique qui ne mène qu'à l'épuisement et à la lassitude du regard.\n\nL'errance spirituelle prend fin lorsque la Réalité suprême sans forme se manifeste sous les traits du Guru, dissipant ainsi le cycle de l'existence mondaine et de l'ignorance.\n\nLa portée spirituelle de ce vachana réside dans la prise de conscience que le Principe suprême, invoqué sous le nom de Kapilasiddha Mallikarjuna, prend la forme manifeste de Parashivamurti uniquement par compassion pour le dévot afin de le guider vers l'éveil."}},{"no":1002,"o":"ಗುರುವಿಡಿದು ತನುವಾಯಿತ್ತು,\n ಲಿಂಗವಿಡಿದು ಮನವಾಯಿತ್ತು,\n ಜಂಗಮವಿಡಿದು ಧನವಾಯಿತ್ತು,\n ಬಸವಣ್ಣವಿಡಿದು ಭಕ್ತಿಯಾಯಿತ್ತು,\n ಕಪಿಲಸಿದ್ಧಮಲ್ಲಿನಾಥಯ್ಯಾ.","t":{"en":"Holding to the Guru, the body came to be,\nholding to the *Linga*, the mind came to be,\nholding to the *Jangama*, wealth came to be,\nholding to Basavanna, devotion came to be,\nO Lord Kapilasiddha Mallinatha.","hi":"गुरु का आश्रय लेकर तन हुआ,\nलिंग का आश्रय लेकर मन हुआ,\nजंगम का आश्रय लेकर धन हुआ,\nबसवय्या का आश्रय लेकर भक्ति हुई,\nहे कपिलसिद्ध मल्लिनाथ।","mr":"गुरूला धरून तनू झाली,\nलिंगाला धरून मन झाले,\nजंगमाला धरून धन झाले,\nबसवण्णांना धरून भक्ती झाली,\nहे स्वामी कपिलसिद्धमल्लिनाथा।","fr":"En m'attachant au Guru, le corps est advenu,\nen m'attachant au Linga, l'esprit est advenu,\nen m'attachant au Jangama, la richesse est advenue,\nen m'attachant à Basavanna, la Bhakti est advenue,\nÔ Seigneur Kapilasiddhamallinatha."},"m":{"en":"This Vachana explains how a seeker's physical existence, mind, wealth, and devotion acquire true purpose through the core principles of the Sharana path.\n\nThrough the grace and guidance of the Guru, the physical body gains its higher spiritual direction, while focusing on the Ishtalinga—the sacred medium toward Formless Divinity—purifies and gives true meaning to the mind.\n\nSimilarly, material wealth becomes meaningful only when dedicated to the service of the Jangama, representing enlightened spiritual seekers and living society at large.\n\nAddressing the Supreme Reality as Kapilasiddhamallinatha, the Vachana concludes that the very essence of devotion comes alive through the spiritual ideal and example of Basavanna.","hi":"इस वचन का केंद्रीय भाव यह है कि एक साधक का संपूर्ण अस्तित्व—उसका तन, मन, धन और भक्ति—शरण पथ के आधारभूत तत्त्वों से जुड़कर ही सार्थक और पवित्र होता है।\n\nगुरु के मार्गदर्शन और संगति से यह शरीर सार्थक बना है, और निराकार परमतत्त्व के साकार प्रतीक इष्टलिंग में ध्यान केंद्रित करने से मन को अपनी वास्तविक दिशा और निर्मलता प्राप्त हुई है।\n\nआध्यात्मिक ज्ञान का प्रसार करने वाले जंगम (प्रबुद्ध साधकों और त्यागी ज्ञानियों) की सेवा में समर्पित होने से धन की सार्थकता सिद्ध हुई है।\n\nकपिलसिद्धमल्लिनाथ के रूप में संबोधित परम चैतन्य के प्रति यह वचन स्पष्ट करता है कि बसवण्ण के आदर्शों और मार्ग को अपनाने से ही साधक के जीवन में सच्ची भक्ति का उदय हुआ है।","mr":"हे वचन शरण तत्त्वज्ञानातील गुरु, लिंग, जंगम आणि बसवण्ण यांच्या माध्यमातून मानवी जीवनाला प्राप्त होणाऱ्या आध्यात्मिक सार्थकतेचे वर्णन करते.\n\nया वचनाचा आशय असा आहे की, सद्गुरूंच्या आश्रयाने मानवी देहाला योग्य दिशा व सार्थकता लाभते आणि निराकार परमतत्त्वाचे प्रतीकात्मक माध्यम असलेल्या इष्टलिंगाच्या एकाग्रतेमुळे मन शुद्ध व स्थिर होते.\n\nत्याचप्रमाणे, आध्यात्मिक ज्ञान पसरवणाऱ्या त्यागी साधकरूपी जंगमांच्या सेवेने धनसंपत्तीचा खरा सदुपयोग होतो आणि बसवण्णांच्या आदर्श आचरणाचा स्वीकार केल्यामुळेच जीवनात खऱ्या भक्तीचा उदय होतो.\n\nकपिलसिद्धमल्लिनाथाच्या साक्षीने व्यक्त झालेला हा विचार स्पष्ट करतो की, मानवाचे तन, मन, धन आणि भक्ती या चारही गोष्टी गुरु, लिंग, जंगम आणि बसवण्ण यांच्याशी जोडल्या गेल्यानेच पूर्णत्व पावतात.","fr":"Ce vachana met en lumière comment l'existence humaine et ses biens trouvent leur véritable sens lorsqu'ils sont entièrement dédiés à la voie spirituelle des Sharanas.\n\nIl explique que le corps acquiert sa vraie valeur par la grâce du Guru, et que l'esprit s'éveille en se concentrant sur le Linga, support sacré menant à la conscience pure.\n\nDe même, la richesse ne prend tout son sens que lorsqu'elle est mise au service du Jangama, qui incarne ici les chercheurs spirituels éclairés et la société vivante.\n\nEnfin, s'adressant à la Réalité suprême sans forme sous la signature spirituelle de Kapilasiddhamallinatha, le poète affirme que c'est par l'inspiration et l'exemple de Basavanna que la véritable dévotion est née."}},{"no":1003,"o":"ಗೋಪ ಭೂಪನ ನೆನೆದಡೆ ಭೂಪನಾಗಬಲ್ಲನೆ?\n ಅಂದಿನ ಗಣಂಗಳ ಕಂಡು, ಇಂದಿನ ಜೀವಿಗಳು ನೆನೆನೆನೆದು\n ಧನ್ಯರಾದೆವೆಂಬ ಪರಿಯ ನೋಡಾ, ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"If a cowherd thinks of a king, can he become a king?\nLooking upon the *Ganas* of old, today's beings think of them again and again;\nlook at the way they say they have become blessed, O Kapilasiddha Mallikarjuna.","hi":"ग्वाला राजा का स्मरण करने से क्या राजा बन सकता है?\nतब के गणों को देखकर, आज के जीव स्मरण कर-करके,\n'हम धन्य हो गए' कहने की रीति तो देखो, हे कपिलसिद्ध मल्लिकार्जुन।","mr":"गवळ्याने राजाचे स्मरण केल्याने तो राजा होऊ शकतो का?\nत्या काळच्या गणांना पाहून, आजचे जीव त्यांचे वारंवार स्मरण करून\nआपण धन्य झालो असे म्हणण्याची रीत तर पाहा, हे कपिलसिद्ध मल्लिकार्जुना।","fr":"Si un bouvier pense à un roi, peut-il devenir roi ?\nEn voyant les Ganas d'autrefois, les êtres d'aujourd'hui y pensent sans cesse ;\nvois la manière dont ils disent être devenus comblés, ô Kapilasiddha Mallikarjuna."},"m":{"en":"The central message of this Vachana is that mere admiration or remembrance of past spiritual greats cannot bring about genuine self-transformation.\n\nThrough the striking comparison of a cowherd who cannot become a king simply by thinking about one, the Vachana highlights the difference between passive reverence and actual lived attainment.\n\nIt critiques those in the present who look back at the ancient Sharanas and Ganas and mistakenly believe they have become blessed merely by recalling their names and deeds.\n\nAddressed to the Formless Supreme Reality through the ankitanama Kapilasiddha Mallikarjuna, this verse emphasizes that spiritual fulfillment requires embodying the truth in one's own life rather than basking in the borrowed glory of past masters.","hi":"इस वचन का मूल भाव यह है कि केवल अतीत के महान शरणों या गणों का स्मरण मात्र कर लेने से कोई व्यक्ति स्वयं धन्य या आध्यात्मिक रूप से उन्नत नहीं हो जाता।\n\nवचनकार एक सरल दृष्टांत देते हुए स्पष्ट करते हैं कि जिस प्रकार कोई ग्वाला केवल राजा के बारे में सोचने या उसे याद करने भर से स्वयं राजा नहीं बन सकता, उसी प्रकार आध्यात्मिक स्थिति भी केवल कोरी कल्पना से प्राप्त नहीं होती।\n\nकपिलसिद्ध मल्लिकार्जुन के रूप में संबोधित निराकार परमतत्त्व को साक्षी मानकर यह वचन आज के उन लोगों की मानसिकता पर प्रश्न उठाता है, जो स्वयं आचरण किए बिना केवल प्राचीन गणों को याद करके ही खुद को कृतार्थ समझ लेते हैं।","mr":"केवळ गतकाळातील आदर्शांचे स्मरण करून स्वतःला कृतार्थ समजण्याच्या मानवी प्रवृत्तीवर या वचनात भाष्य केले आहे.\n\nएखाद्या गुराख्याने केवळ राजाचे स्मरण किंवा चिंतन केले म्हणून तो स्वतः राजा होऊ शकत नाही, हे व्यावहारिक सत्य या वचनातून मांडले आहे.\n\nत्याचप्रमाणे, केवळ पूर्वीच्या महान शरणांचे व शिवगणांचे दर्शन घेऊन आणि त्यांचे वारंवार स्मरण करूनच आपण धन्य झालो, असा भ्रम बाळगणे व्यर्थ आहे.\n\nकपिलसिद्ध मल्लिकार्जुन या परमतत्त्वाला उद्देशून हे वचन स्पष्ट करते की, प्रत्यक्ष आचरणाशिवाय केवळ पूर्वसुरींच्या स्मरणाने आध्यात्मिक उन्नती साध्य होत नाही.","fr":"Ce vachana met en lumière la distinction essentielle entre la simple évocation de la grandeur d'autrui et la réalisation spirituelle personnelle.\n\nÀ travers l'image frappante du berger qui ne peut devenir roi par la seule pensée d'un souverain, le texte illustre que la contemplation passive d'un état supérieur ne suffit pas à transformer la condition d'un individu.\n\nDe la même manière, ceux qui aujourd'hui se contentent de commémorer et de vénérer les grands êtres accomplis du passé s'illusionnent s'ils croient atteindre la plénitude spirituelle sans incarner eux-mêmes cette démarche.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Kapilasiddha Mallikarjuna, ce vachana invite ainsi à dépasser la simple admiration nostalgique pour s'engager dans une expérience intérieure authentique et directe."}},{"no":1004,"o":"ಘಾತವಪ್ಪ ಶರಧಿ,\n ಪ್ರೇತವಪ್ಪ ಅಡವಿ,\n ಘಾತಕ ಭವಕೆ ಬಹ ಕೂಪದೊಳಗೆ ನೂಕಿದರೆ ಬೀಳೆ,\n ನಿನ್ನಾಧಾರವುಂಟು.\n ಅನಾದಿ ಸಂಸಿದ್ಧ ಯೋಗಮೂರ್ತಿ\n ನಿನ್ನ ಒಡನಾಡಿ ನಾ ನಿನ್ನ ಠಕ್ಕನರಿಯೆನೆ\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"A perilous ocean,\na haunted forest—\neven if pushed into the pit that leads to ruinous worldly existence, I will not fall,\nfor I have your support.\nO beginningless, ever-perfected embodiment of Yoga,\nbeing your companion, would I not know your guile,\nO Kapilasiddha Mallikarjuna?","hi":"घातक होनेवाले सागर,\nप्रेतमय होनेवाले वन,\nघातक भव में ले जानेवाले कूप में धकेलने पर भी मैं नहीं गिरूँगा,\nमुझे तुम्हारा आधार है।\nहे अनादि संसिद्ध योगमूर्ति,\nतुम्हारा संगी मैं, क्या तुम्हारे छल को न जानूँगा,\nहे कपिलसिद्ध मल्लिकार्जुन?","mr":"घात करणारा सागर,\nप्रेतांचे अरण्य,\nआणि घातकी भवात नेणाऱ्या विहिरीत लोटले तरी मी पडणार नाही,\nमला तुझा आधार आहे.\nहे अनादि संसिद्ध योगमूर्ती,\nतुझा सोबती असून मी तुझा कावा ओळखणार नाही का,\nहे कपिलसिद्ध मल्लिकार्जुना?","fr":"Un océan qui apporte la ruine,\nune forêt qui réduit en cadavre :\nsi l'on me pousse dans le puits qui mène au cycle meurtrier des existences, je n'y tomberai pas,\ncar il y a ton soutien.\nÔ forme accomplie du yoga sans commencement,\nmoi qui suis ton compagnon, ne connais-je donc pas ta ruse,\nô Kapilasiddha Mallikarjuna ?"},"m":{"en":"This Vachana expresses the fearless confidence of a spiritual seeker who remains unshaken even when confronted with the most terrifying trials of worldly existence.\n\nThrough vivid metaphors of a treacherous ocean, a forest haunted by ghosts, and the perilous pit of worldly bondage, the Vachana portrays the traps and illusions of material life.\n\nYet the seeker refuses to fall into despair, declaring that the unwavering support of the Supreme Reality, addressed through the ankitanama Kapilasiddha Mallikarjuna, provides complete protection against such dangers.\n\nHaving lived in intimate companionship with the timeless, eternally realized Formless Supreme Consciousness, the seeker sees through the illusory testing of worldly existence and remains anchored in spiritual awareness.","hi":"इस वचन का केंद्रीय भाव यह है कि परम सत्य की जागृत चेतना से जुड़ा साधक संसार के किसी भी भय या परीक्षा से विचलित नहीं होता।\n\nचाहे विनाशकारी सागर हो, भयावह वन हो या घातक संसार रूपी अंधकूप में ही क्यों न धकेल दिया जाए, साधक का पतन नहीं हो सकता क्योंकि उसे निराकार परमतत्त्व का अटूट आधार प्राप्त है।\n\nकपिलसिद्ध मल्लिकार्जुन के रूप में संबोधित अनादि सिद्ध योगस्वरूप चेतना के साथ अपने निरंतर सान्निध्य के कारण, साधक उस परम सत्ता की परीक्षात्मक लीलाओं और छलावों को भली-भांति पहचानता है।\n\nइस प्रकार यह वचन स्पष्ट करता है कि शुद्ध चैतन्य के साथ एकाकार हो चुके व्यक्ति को सांसारिक संकटों के भ्रम से डराया या डिगाया नहीं जा सकता।","mr":"हे वचन साधकाच्या अढळ आत्मविश्वासाची आणि परमतत्त्वाशी असलेल्या त्याच्या गाढ एकरूपतेची जाणीव करून देते.\n\nविनाशकारी समुद्र, भयानक अरण्य किंवा घातक अशा भवसागराच्या विहिरीत कोणी ढकलले तरी आपण त्यात पडणार नाही, कारण आपल्याला कपिलसिद्ध मल्लिकार्जुन या निराकार परमतत्त्वाचा भक्कम आधार आहे, असा ठाम विश्वास येथे व्यक्त झाला आहे.\n\nअनादि आणि स्वयंसिद्ध अशा या परमतत्त्वाच्या नित्य सान्निध्यात राहिल्यामुळे, साधकाला या सर्व वरवरच्या संकटांचे आणि मायेच्या फसव्या खेळांचे स्वरूप पूर्णपणे उमगले आहे.\n\nजेव्हा साधक शुद्ध चैतन्याशी एकरूप होतो, तेव्हा सांसारिक भीती किंवा संकटांचे फसवे रूप त्याला विचलित करू शकत नाही, हाच या वचनाचा मुख्य आध्यात्मिक आशय आहे.","fr":"Ce vachana exprime l'assurance inébranlable de l'être éveillé qui ne redoute aucun des périls de l'existence, qu'il soit précipité dans un océan dévastateur, une forêt hantée ou le puits funeste du cycle des renaissances.\n\nIl affirme que l'âme demeure invincible face à ces épreuves grâce au soutien permanent de la Réalité suprême sans forme, invoquée sous la signature spirituelle de Kapilasiddha Mallikarjuna.\n\nS'adressant à ce Principe absolu, éternellement accompli et sans commencement, le poète souligne avec une complicité lucide son intimité spirituelle avec l'Absolu.\n\nÉtant le compagnon constant de cette Conscience pure, il déclare connaître parfaitement ses ruses et ses mises à l'épreuve illusoires, refusant ainsi de se laisser ébranler ou tromper par les apparences terrifiantes du monde."}},{"no":1005,"o":"ಚರಿಸಿ ಜಂಗಮವೆನಿಸಿತ್ತಯ್ಯಾ ಲಿಂಗವು.\n ನೆಲಸಿ ಲಿಂಗವೆನಿಸಿತ್ತಯ್ಯಾ ಲಿಂಗವು.\n ಇದರಿರವ ಅರುಹಿದಲ್ಲಿ ಗುರುವೆನಿಸಿತ್ತಯ್ಯಾ ಲಿಂಗವು.\n ಗುರು - ಲಿಂಗ - ಜಂಗಮಕ್ಕೆ ತಿಲಾಂಶ ಭೇದವಿಲ್ಲ\n ನೋಡಾ, ಎಲೆ ದೇವಾ.\n ಭೇದಿಸಿದವಗೆ ಭವಬಾಧೆ ತಪ್ಪುವುದೆ,\n ದೇವರ ದೇವ ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನದೇವಾ?","t":{"en":"Moving about, the *Linga* came to be called the *Jangama*, O Lord.\nAbiding still, the *Linga* came to be called the *Linga*, O Lord.\nIn revealing the nature of its being, the *Linga* came to be called the Guru, O Lord.\nBetween the Guru, the *Linga*, and the *Jangama*, there is not a sesame seed's breadth of difference;\nbehold, O Lord.\nFor one who divides them, can the torment of worldly existence ever cease,\nO God of gods, O Kapilasiddha Mallikarjunadeva?","hi":"विचरकर जंगम कहलाया, हे स्वामी, लिंग।\nस्थिर होकर लिंग कहलाया, हे स्वामी, लिंग।\nइसकी स्थिति का बोध कराने पर गुरु कहलाया, हे स्वामी, लिंग।\nगुरु-लिंग-जंगम में तिल-भर भी भेद नहीं है,\nदेखो, हे देव।\nभेद करनेवाले की भव-बाधा क्या मिटेगी,\nहे देवों के देव कपिलसिद्ध मल्लिकार्जुनदेव?","mr":"संचार करून जंगम म्हणवले, हे प्रभो, लिंगाने।\nस्थिरावून लिंग म्हणवले, हे प्रभो, लिंगाने।\nयाचे अस्तित्व जाणवून दिले तेव्हा गुरू म्हणवले, हे प्रभो, लिंगाने।\nगुरू - लिंग - जंगम यांत तिळमात्रही भेद नाही,\nपाहा, हे देवा।\nभेद करणाऱ्याला भवबाधा चुकेल का,\nदेवाधिदेवा हे कपिलसिद्ध मल्लिकार्जुनदेवा?","fr":"En se mouvant, le Linga s'est appelé Jangama, Ô Seigneur.\nEn demeurant établi, le Linga s'est appelé Linga, Ô Seigneur.\nEn révélant la nature de cet état, le Linga s'est appelé Guru, Ô Seigneur.\nEntre le Guru, le Linga et le Jangama, il n'y a pas la moindre différence, fût-ce de la taille d'un grain de sésame,\nvois donc, Ô Dieu.\nPour celui qui les divise, le tourment du cycle de l'existence mondaine peut-il être évité,\nÔ Dieu des dieux, Kapilasiddha Mallikarjunadeva ?"},"m":{"en":"This Vachana explains the essential oneness of Guru, Linga, and Jangama as three interrelated expressions of the same Formless Supreme Reality.\n\nWhen that Supreme Principle moves dynamically as living consciousness and spiritual presence in the world, it is known as Jangama; when it abides steadily as a sacred focus of contemplation, it is known as Linga; and when it reveals the true nature of this reality through spiritual awakening, it is known as Guru.\n\nBecause Guru, Linga, and Jangama are not separate entities but three modes of the one indivisible Truth, there is not even the slightest difference among them.\n\nAddressing the Supreme Reality as Kapilasiddha Mallikarjunadeva, the Vachana cautions that anyone who perceives division among these three remains bound to the suffering of worldly existence.","hi":"यह वचन गुरु, लिंग और जंगम की तात्त्विक एकता को स्पष्ट करता है।\n\nइसमें बताया गया है कि वह एक ही निराकार परमतत्त्व जब गतिशील चेतना या प्रबुद्ध साधक के रूप में विचरण करता है तो 'जंगम' कहलाता है, जब स्थिर रूप में प्रतिष्ठित होता है तो 'लिंग' कहलाता है, और जब इस परम सत्य के स्वरूप का बोध कराता है तो 'गुरु' कहलाता है।\n\nइस प्रकार गुरु, लिंग और जंगम एक ही शुद्ध चैतन्य के तीन आयाम हैं और इनमें तिल मात्र भी भेद नहीं है।\n\nनिराकार परमतत्त्व कपिलसिद्ध मल्लिकार्जुनदेव को संबोधित करते हुए यह वचन चेतावनी देता है कि जो व्यक्ति इन तीनों में भेद करता है, वह कभी भी सांसारिक बंधनों और भव-बाधा के कष्टों से मुक्त नहीं हो सकता।","mr":"हे वचन गुरू, लिंग आणि जंगम या तीनही संकल्पनांमधील मूलभूत अद्वैत आणि एकरूपता स्पष्ट करते.\n\nतेच एकमेव निराकार परमतत्त्व जेव्हा गतिशील होऊन समाजात विचरते तेव्हा त्याला 'जंगम' म्हटले जाते, जेव्हा ते स्थिर स्वरूपात अधिष्ठित होते तेव्हा त्याला 'लिंग' मानले जाते आणि जेव्हा ते या सत्याची जाणीव करून देते तेव्हा तेच 'गुरू' बनते.\n\nयावरून हे स्पष्ट होते की गुरू, लिंग आणि जंगम ही एकाच शुद्ध चैतन्याची तीन रूपे असून त्यांच्यात तिळमात्रही भेद नाही.\n\nकपिलसिद्ध मल्लिकार्जुनदेव या परमतत्त्वाच्या साक्षीने वचनकार सांगतात की, या तिन्हीमध्ये जो कोणी भेद मानतो त्याची जन्म-मृत्यूच्या फेऱ्यातून म्हणजेच भवबाधेतून कधीही सुटका होऊ शकत नाही.","fr":"Ce vachana met en lumière l'unité absolue qui relie le Guru, le Linga et le Jangama au sein de la philosophie Sharana, en expliquant qu'il s'agit de trois expressions d'une seule et même Réalité suprême sans forme.\n\nLorsque ce principe absolu se met en mouvement dans le monde sous la forme d'une conscience dynamique et de chercheurs spirituels accomplis qui diffusent la connaissance, il est appelé Jangama ; lorsqu'il demeure établi comme un point d'ancrage sacré pour la contemplation intérieure, il est reconnu comme Linga ; et lorsqu'il révèle la véritable nature de cette réalité fondamentale, il devient le Guru.\n\nIl n'existe donc pas la moindre différence, pas même de la taille d'une graine de sésame, entre le Guru, le Linga et le Jangama.\n\nÀ travers la signature spirituelle Kapilasiddha Mallikarjunadeva, le texte avertit que quiconque introduit une division ou une hiérarchie entre ces trois manifestations de la Conscience pure ne pourra échapper aux tourments du cycle de l'existence mondaine."}},{"no":1006,"o":"ಚರಿಸುವ ಚರನಿಗೆ ಚ[ರ್ಯೆ]ಯೆ ಭೂಷಣ.\n ಸುಂದರ ನಾರಿಗೆ ಗಂಭೀರ ಪುರುಷನೆ ಭೂಷಣ.\n ಕೊಳನಲ್ಲಿಯ ನೀರಿಗೆ ಕಲಹಂಸೆಯೆ ಭೂಷಣ.\n ವನದಲ್ಲಿಯ ವಸಂತಕ್ಕೆ ಕೋಕಿಲನಾದವೆ ಭೂಷಣ.\n ನಮ್ಮ ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನನ ಶರಣರಿಗೆ\n ನಿರ್ಮಲ ನಿಜಾನಂದವೆ ಭೂಷಣ.","t":{"en":"For the wandering ascetic, righteous conduct itself is the ornament.\nFor a beautiful woman, a dignified man himself is the ornament.\nFor the water in the pond, the royal swan itself is the ornament.\nFor the spring in the forest, the call of the cuckoo itself is the ornament.\nFor the *Sharanas* of our Kapilasiddha Mallikarjuna,\npure, true bliss itself is the ornament.","hi":"विचरण करनेवाले चर के लिए चर्या ही आभूषण है।\nसुंदर नारी के लिए गंभीर पुरुष ही आभूषण है।\nसरोवर के जल के लिए कलहंस ही आभूषण है।\nवन के वसंत के लिए कोकिल-नाद ही आभूषण है।\nहमारे कपिलसिद्ध मल्लिकार्जुन के शरणों के लिए\nनिर्मल निजानंद ही आभूषण है।","mr":"विचरण करणाऱ्या जंगमासाठी सदाचरण हेच भूषण आहे.\nसुंदर नारीसाठी गंभीर पुरुष हेच भूषण आहे.\nतळ्यातील पाण्यासाठी राजहंस हेच भूषण आहे.\nवनातील वसंतासाठी कोकिळनाद हेच भूषण आहे.\nआमच्या कपिलसिद्ध मल्लिकार्जुनाच्या शरणांसाठी\nनिर्मळ निजानंद हेच भूषण आहे.","fr":"Pour l'ascète qui chemine, la droite conduite même est la parure.\nPour une belle femme, un homme digne même est la parure.\nPour l'eau de l'étang, le cygne royal même est la parure.\nPour le printemps dans la forêt, le chant du coucou même est la parure.\nPour les Sharanas de notre Kapilasiddha Mallikarjuna,\nla félicité véritable et pure même est la parure."},"m":{"en":"This Vachana illustrates that the true beauty and dignity of any being or phenomenon lie not in external ornaments, but in the intrinsic quality that gives it meaning and fulfillment.\n\nThrough a series of vivid comparisons—righteous conduct gracing a wandering ascetic, a dignified companion complementing a graceful woman, swans adorning a pond, and the cuckoo's song bringing life to spring—the Vachana establishes that every state of existence has its own natural perfection.\n\nCulminating in the spiritual realm, it declares that for the Sharanas devoted to the Formless Supreme Reality, Kapilasiddha Mallikarjuna, the ultimate ornament is pure, unblemished, and authentic inner bliss (Nijananda).\n\nThe spiritual significance of this Vachana lies in recognizing that a Sharana's true distinction is found not in outward appearances, but in the serene joy of genuine spiritual realization.","hi":"यह वचन स्पष्ट करता है कि लोक-जीवन और प्रकृति में प्रत्येक तत्व की वास्तविक शोभा उसके स्वाभाविक और सार्थक स्वरूप से ही प्रकट होती है।\n\nजिस प्रकार विचरण करने वाले जंगम साधक के लिए उसका सदाचार ही आभूषण है, एक सुंदर स्त्री के लिए गंभीर पुरुष, सरोवर के जल के लिए राजहंस और वन के वसंत के लिए कोयल का मधुर स्वर ही वास्तविक अलंकार है।\n\nउसी प्रकार, कपिलसिद्ध मल्लिकार्जुन के रूप में संबोधित परमतत्त्व के शरणों के लिए कोई बाहरी वस्तु नहीं, अपितु उनके अंतर का निर्मल और आत्मानंद (निजानंद) ही उनका सर्वोच्च आभूषण है।\n\nइस वचन का आध्यात्मिक मर्म यह है कि एक सच्चे शरण की वास्तविक गरिमा और पहचान किसी बाह्य आडंबर में नहीं, बल्कि उसकी शुद्ध चैतन्य स्थिति और असीम आंतरिक आनंद में निहित होती है।","mr":"हे वचन आपल्याला या जाणिवेकडे घेऊन जाते की प्रत्येक घटकाची खरी शोभा आणि ओळख त्याच्या मूळ अंतरंग गुणधर्मात दडलेली असते.\n\nजंगम वृत्तीने संचार करणाऱ्या साधकासाठी त्याचे उत्तम आचरण, सुंदर स्त्रीसाठी भारदस्त पुरुष, तळ्यातील पाण्यासाठी राजहंस आणि वनातील वसंत ऋतूसाठी कोकिळेचे मधुर कूजन हेच खरे अलंकार असतात.\n\nया नैसर्गिक व सामाजिक दृष्टान्तांच्या माध्यमातून हे वचन स्पष्ट करते की बाह्य आभूषणांपेक्षा अंतर्गत औचित्य आणि स्वभावधर्म अधिक महत्त्वाचा असतो.\n\nत्याचप्रमाणे, कपिलसिद्ध मल्लिकार्जुन या परमतत्त्वाशी एकरूप झालेल्या शरणांसाठी कोणत्याही बाह्य गोष्टींपेक्षा त्यांचा निर्मळ आणि शाश्वत आत्मिक आनंद हाच खरा दागिना असतो.","fr":"Ce vachana met en lumière ce qui constitue le véritable ornement de chaque être et de chaque élément de l'existence, en s'appuyant sur des images poétiques et naturelles.\n\nTout comme une conduite droite honore l'ascète itinérant, qu'un époux digne embellit une femme gracieuse, que le cygne pare l'eau de l'étang et que le chant du coucou magnifie le printemps dans la forêt, chaque réalité trouve sa plénitude dans ce qui lui correspond profondément.\n\nDe la même manière, pour les Sharanas unis à la Réalité suprême sans forme invoquée sous le nom de Kapilasiddha Mallikarjuna, la parure suprême ne réside dans aucun artifice extérieur.\n\nLeur unique et véritable ornement est la félicité pure, authentique et immaculée qui naît de l'expérience intérieure de la vérité."}},{"no":1007,"o":"ಜಗವನಾಡಿಸುವನು, ಜಗವನೇಡಿಸುವನು.\n ಜಗದ ನಟನಾಟಕನ ಪರಿಯ ನೋಡಯ್ಯಾಅ\n ಜಗವ ರಂಜಿಸುವನು, ಜಗವ ಭುಂಜಿಸುವನು,\n ಜಗದೊಳಗಿಪ್ಪನು, ಜಗದ ಹೊರಗಿಪ್ಪನು.\n ಜಗಕೆ ತೋರಿಯೂ ತೋರದಂತಿಪ್ಪನು.\n ದರ್ಪಣದೊಳಗಣ ಪ್ರತಿಬಿಂಬದಂತಿಪ್ಪನು.\n ಉದಕ-ಪದ್ಮಪತ್ರದಂತಿಪ್ಪನು.\n ನಿಜಗುರುವೆ, ಸ್ವತಂತ್ರ ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲೇಶ್ವರ[ನದಿ\n ನೋಟ ತೀರಲೊಡನೆ ಜಗದಾಟ ತೀರಿತು.","t":{"en":"He makes the world play, he mocks the world.\nBehold the way of the player of the world's drama, O brother!\nHe delights the world, he consumes the world,\nhe abides within the world, he abides outside the world.\nThough appearing to the world, he abides as though unseen.\nHe abides like a reflection within a mirror.\nHe abides like water and the lotus leaf.\nThe true Guru himself, the sovereign Kapilasiddha Malleshwara—\nthe moment his gaze ends, the play of the world comes to an end.","hi":"जग को नचाता है, जग को चिढ़ाता है।\nजग के नट-नाटककार की रीति देखो, हे भाई!\nजग को रंजित करता है, जग को भोगता है,\nजग के भीतर रहता है, जग के बाहर रहता है।\nजग को दिखकर भी न दिखने जैसा रहता है।\nदर्पण के भीतर के प्रतिबिंब के समान रहता है।\nजल और कमल-पत्र के समान रहता है।\nनिजगुरु, स्वतंत्र कपिलसिद्ध मल्लेश्वर की\nदृष्टि समाप्त होते ही जग का खेल समाप्त हो गया।","mr":"जगाला नाचवतो, जगाची चेष्टा करतो.\nजगाच्या या नट-नाटकाच्या सूत्रधाराची रीत पाहा.\nजगाला रिझवतो, जगाचा उपभोग घेतो,\nजगाच्या आत असतो, जगाच्या बाहेर असतो.\nजगाला दिसूनही न दिसल्यासारखा असतो.\nआरशातील प्रतिबिंबासारखा असतो.\nपाणी आणि कमळाच्या पानासारखा असतो.\nनिजगुरू जो स्वतंत्र कपिलसिद्ध मल्लेश्वर, त्याच्या\nपाहण्याचा खेळ संपताच जगाचा खेळ संपला.","fr":"Il fait jouer le monde, il se joue du monde.\nVois la manière de ce maître du théâtre du monde, ô Seigneur !\nIl ravit le monde, il savoure le monde,\nIl demeure au-dedans du monde, il demeure au-dehors du monde.\nTout en se montrant au monde, il demeure comme s'il ne se montrait pas.\nIl demeure tel le reflet au sein d'un miroir.\nIl demeure tels l'eau et la feuille de lotus.\nDès que cesse le regard du vrai Guru, le souverain Kapilasiddha Malleshwara,\nle jeu du monde prend fin."},"m":{"en":"This Vachana contemplates the paradoxical nature of the Formless Supreme Consciousness, addressed here through the ankitanama Kapilasiddha Malleshwara, as both the active orchestrator of the cosmos and the detached reality beyond it.\n\nThe Absolute animates, delights, and sustains the entire universe like a cosmic dramatist, remaining simultaneously immanent within the world and transcendent outside of it, appearing visible yet remaining elusive to ordinary perception.\n\nThrough the metaphors of a reflection in a mirror and water resting on a lotus leaf, the Vachana illustrates how the Supreme Reality pervades physical existence while remaining completely untouched and unblemished by it.\n\nUltimately, the entire cosmic play depends solely on the sustaining gaze of this sovereign True Guru, and the moment that divine attention is withdrawn, the drama of the phenomenal world comes to an end.","hi":"यह वचन इस सत्य को स्पष्ट करता है कि निराकार परमतत्त्व ही संपूर्ण संसार के नाटक का संचालन करने वाला सूत्रधार है, जो जगत् को गतिमान रखता है, उसे आनंदित करता है और अंततः स्वयं में समेट लेता है।\n\nवह परम चैतन्य संसार के भीतर रहते हुए भी उससे बाहर है और प्रकट होकर भी अप्रकट रहता है।\n\nदर्पण में दिखने वाले प्रतिबिंब तथा जल में रहकर भी जल से अछूते रहने वाले कमल के पत्ते की भांति, वह संसार में व्याप्त होते हुए भी पूर्णतः निर्लिप्त रहता है।\n\nइस वचन का आध्यात्मिक मर्म यह है कि स्वतंत्र कपिलसिद्ध मल्लेश्वर के रूप में संबोधित वह परम सत्य और निजगुरु जब अपनी दृष्टि समेट लेता है, तब संसार का यह संपूर्ण खेल भी समाप्त हो जाता है।","mr":"या वचनाचा मुख्य आशय असा आहे की, निराकार परमतत्त्व हे संपूर्ण विश्वाला चालवणारे आणि त्याच्या सर्व घडामोडींचे सूत्रधार असणारे अद्वितीय चैतन्य आहे.\n\nकपिलसिद्ध मल्लेश्वर म्हणून संबोधले गेलेले हे स्वतंत्र परम सत्य जगाच्या आत आणि बाहेरही व्यापून आहे, परंतु जगामध्ये दिसूनही ते न दिसल्यासारखे अव्यक्त राहते.\n\nआरशातील प्रतिबिंब आरशात दिसूनही जसे त्यापासून वेगळे असते आणि कमळाचे पान पाण्यात राहूनही जसे पाण्याने भिजत नाही, तसेच हे शुद्ध चैतन्य संसारात असूनही त्यापासून पूर्णपणे अलिप्त आणि निर्लेप राहते.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, हे संपूर्ण जगत् त्या परमतत्त्वाच्या चैतन्यदृष्टीवरच टिकून आहे आणि ती दृष्टी बाजूला होताच जगाचा हा सर्व खेळ क्षणार्धात संपुष्टात येतो.","fr":"Ce vachana met en lumière la nature paradoxale de la Réalité suprême sans forme, qui anime, orchestre, enchante et absorbe la pièce cosmique de l'univers tout entier.\n\nBien qu'immanent au cœur du monde, le Principe absolu demeure simultanément au-delà de lui, se manifestant à la création tout en restant insaisissable et invisible à la perception ordinaire.\n\nÀ l'image d'un reflet dans un miroir ou d'une feuille de lotus reposant sur l'eau sans jamais être mouillée, la Conscience pure traverse l'existence manifestée tout en préservant un détachement total et une liberté inaltérable.\n\nLa portée spirituelle du texte culmine dans l'idée que dès l'instant où la vision de cette Réalité souveraine, désignée ici par l'ankitanama Kapilasiddha Malleshwara et reconnue comme le véritable Guru intérieur, détourne son regard, le jeu tout entier du monde prend aussitôt fin."}},{"no":1008,"o":"ಜಲದಲ್ಲಿಯ ಚಂದ್ರನ ಚಲನೆ ಜಲದಲಲ್ಲದೆ,\n ನಿಜಚಂದ್ರನಲ್ಲಿಲ್ಲವಯ್ಯಾ.\n ಘಟದಲ್ಲಿಯ ಪ್ರತಿಬಿಂಬಗಳು ಘಟದಲ್ಲಲ್ಲದೆ,\n ಬಿಂಬದಲ್ಲಿಲ್ಲ ನೋಡಯ್ಯಾ.\n ಜಲದಲ್ಲಿಯ ಚಂದ್ರನ ಚಲನೆ\n ಘಟದಲ್ಲಿಯ ಪ್ರತಿಬಿಂಬ ನಿಜವಲ್ಲ ನೋಡಾ,\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"The movement of the moon in the water is only in the water,\nnot in the real moon, O Lord.\nThe reflections in the pot are only in the pot,\nnot in the original form, see, O Lord.\nThe movement of the moon in the water\nand the reflection in the pot are not real, see,\nO Kapilasiddha Mallikarjuna.","hi":"जल में स्थित चंद्रमा की हलचल जल में ही है,\nनिज चंद्रमा में नहीं है, हे स्वामी।\nघट में स्थित प्रतिबिंब घट में ही हैं,\nमूल बिंब में नहीं हैं, देखो हे स्वामी।\nजल में स्थित चंद्रमा की हलचल,\nघट में स्थित प्रतिबिंब सत्य नहीं हैं, देखो,\nहे कपिलसिद्ध मल्लिकार्जुन।","mr":"पाण्यातील चंद्राचे चलन पाण्यातच असते,\nमूळ चंद्रात नसते, हे प्रभो.\nघटातील प्रतिबिंबे घटातच असतात,\nबिंबात नसतात, पाहा हे प्रभो.\nपाण्यातील चंद्राचे चलन\nआणि घटातील प्रतिबिंब सत्य नाही, पाहा,\nहे कपिलसिद्ध मल्लिकार्जुना.","fr":"Le mouvement de la lune dans l'eau n'est que dans l'eau,\nil n'est point dans la vraie lune, ô Seigneur.\nLes reflets dans la jarre ne sont que dans la jarre,\nils ne sont point dans l'original, vois-le, ô Seigneur.\nLe mouvement de la lune dans l'eau\net le reflet dans la jarre ne sont point réels, vois-le,\nô Kapilasiddha Mallikarjuna."},"m":{"en":"This Vachana explains the difference between the unchanging nature of the Supreme Reality and the fluctuating appearances within the material world.\n\nUsing the imagery of the moon reflected in water and an object reflected in a pot, the Vachana illustrates that movement, multiplicity, and distortion belong entirely to the reflecting medium, not to the original source.\n\nJust as the real moon remains still even when its watery reflection ripples, the Formless Supreme Consciousness, addressed as Kapilasiddha Mallikarjuna, remains untouched by the transient changes of the physical body and mind.\n\nThe spiritual significance of this Vachana lies in recognizing that these temporary reflections are not the ultimate truth, urging the seeker to look beyond worldly appearances to perceive the unmoving Absolute.","hi":"यह वचन स्पष्ट करता है कि जिस प्रकार जल में दिखाई देने वाले चंद्रमा की हलचल केवल जल तक सीमित है, वास्तविक चंद्रमा में कोई हलचल नहीं होती।\n\nउसी प्रकार, किसी घट (पात्र) में पड़ने वाले प्रतिबिंब केवल उस घट के कारण ही दिखते हैं, जबकि मूल बिंब उन प्रतिबिंबों के विकारों से सर्वथा मुक्त होता है।\n\nअतः जल के चंद्रमा की चंचलता और घट के प्रतिबिंब की भांति ही बाह्य उपाधियों में दिखने वाले परिवर्तन वास्तविक सत्य नहीं हैं।\n\nइस वचन का आध्यात्मिक मर्म यह है कि कपिलसिद्ध मल्लिकार्जुन रूपी परम तत्त्व (शुद्ध चैतन्य) सभी बाह्य उपाधियों, प्रतिबिंबों और विकारों से परे एकमात्र अचल और शाश्वत सत्य है।","mr":"हे वचन मूळ सत्य आणि त्याचे भासमान प्रतिबिंब यांतील भेद अत्यंत समर्पक रूपकांच्या माध्यमातून स्पष्ट करते.\n\nपाण्यात दिसणाऱ्या चंद्राची हालचाल ही केवळ पाण्याच्या लहरींमुळे असते, आकाशातील मूळ चंद्रात कोणतीही हालचाल नसते; तसेच घटातील पाण्यात दिसणारी अनेक प्रतिबिंबे ही केवळ त्या घटापुरतीच मर्यादित असतात, मूळ बिंबात तसा कोणताही भेद नसतो.\n\nपाण्यातील चंद्राची हालचाल आणि घटातील प्रतिबिंबे ही जशी अंतिम सत्य नाहीत, तसेच उपाधींमुळे भासणारे बाह्य विकार किंवा भेद हेदेखील मिथ्या आहेत.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, कपिलसिद्ध मल्लिकार्जुन या नावाने संबोधले जाणारे निराकार परमतत्त्व हे सर्व बाह्य उपाधी, हालचाली आणि भासमान भेदांच्या पलीकडे पूर्णपणे अचल, एकमेव आणि शाश्वत आहे.","fr":"Ce vachana met en lumière la distinction fondamentale entre la vérité immuable et les apparences trompeuses à travers deux images poétiques saisissantes.\n\nLe mouvement de la lune reflétée dans l'eau n'appartient qu'aux ondulations de l'eau, et non à la lune véritable qui demeure immobile dans le ciel.\n\nDe même, les multiples reflets perceptibles à l'intérieur des vases dépendent uniquement de ces récipients et n'altèrent en rien la source originelle qui s'y projette.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Kapilasiddha Mallikarjuna, le poète nous invite à comprendre que ces reflets mouvants et fragmentés sont illusoires au regard de l'unique Vérité absolue."}},{"no":1009,"o":"ಜಲದೊಳಗೆ ಮತ್ಸ ಜಲವ ತನ್ನ ನಾಸಿಕದತ್ತ\n ಹೊದ್ದಲೀಯದ ಪರಿಯ ನೋಡಾ ಅಯ್ಯಾ.\n ಶರಣ ಸರ್ವಪ್ರಪಂಚಿನೊಳಗಿದ್ದು\n ಆ ಪ್ರಪಂಚು ತನ್ನತ್ತ ಹೊದ್ದಲೀಯದ ಪರಿಯ ನೋಡಾ ಅಯ್ಯಾ.\n ಮತ್ಸõ್ಯಂಗಾ ಬುದ್ಧಿಯ, ಶರಣಂಗೀ ಬುದ್ಧಿಯ ಕರುಣಿಸಿದೆಯಲ್ಲಾ,\n ಎನ್ನ ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿನಾಥಯ್ಯಾ.","t":{"en":"Within the water, the fish does not let the water draw near its nostrils—\nbehold the manner of it, O Lord.\nAbiding within the entire world, the *Sharana*\ndoes not let that world draw near to him—behold the manner of it, O Lord.\nTruly, you have graciously bestowed that wisdom upon the fish, and this wisdom upon the *Sharana*,\nO my Kapilasiddha Mallinatha!","hi":"जल के भीतर मत्स्य द्वारा जल को अपनी नासिका के पास\nभी फटकने न देने की रीति तो देखिए, हे स्वामी।\nशरण द्वारा समस्त प्रपंच के भीतर रहकर भी\nउस प्रपंच को अपने पास फटकने न देने की रीति तो देखिए, हे स्वामी।\nमत्स्य को वह बुद्धि और शरण को यह बुद्धि आपने ही तो कृपापूर्वक प्रदान की है,\nमेरे स्वामी कपिलसिद्ध मल्लिनाथ।","mr":"जलामध्ये मत्स्य जलाला आपल्या नासिकेजवळ\nभिडू देत नाही, ती रीती पहा, हे स्वामी.\nशरण सर्व प्रपंचाच्या आत राहूनही\nत्या प्रपंचाला आपल्याजवळ भिडू देत नाही, ती रीती पहा, हे स्वामी.\nमत्स्याला ती बुद्धी आणि शरणाला ही बुद्धी आपणच कृपा करून दिली आहे ना,\nहे माझ्या कपिलसिद्ध मल्लिनाथ प्रभो.","fr":"Dans l'eau, le poisson, jusqu'à ses narines,\nne laisse pas l'eau s'approcher : vois cela, ô Seigneur.\nDemeurant au sein du monde tout entier, le Sharana\nne laisse pas ce monde s'approcher de lui : vois cela, ô Seigneur.\nAu poisson ce discernement, au Sharana ce discernement, c'est bien toi qui les as accordés par grâce,\nô mon Seigneur Kapilasiddha Mallinatha."},"m":{"en":"This Vachana explains the nature of a Sharana's active yet unentangled engagement with the material world through the striking metaphor of a fish living in water.\n\nJust as a fish dwells entirely immersed in water without allowing the water to enter its nostrils and drown it, a Sharana lives fully amidst all worldly realities while remaining inwardly untouched by worldly attachments and influences.\n\nThrough this comparison, the Vachana highlights that true spiritual awareness does not require escaping society, but rather possessing the inner discernment to remain unaffected while participating in the world.\n\nAddressing the Formless Supreme Consciousness as Kapilasiddha Mallinatha, the Vachana recognizes that both the natural instinct that protects the fish and the spiritual wisdom (Arivu) that keeps the Sharana inwardly free are expressions of the same grace of the Supreme Reality.","hi":"यह वचन इस केंद्रीय भाव को स्पष्ट करता है कि जिस प्रकार मछली जल के भीतर रहते हुए भी उस जल को अपने नासिका रंध्रों में प्रवेश नहीं करने देती, उसी प्रकार एक शरण भी संसार में जीवन बिताता है।\n\nयह दृष्टांत इस गहन समझ की ओर संकेत करता है कि एक शरण संपूर्ण सांसारिक प्रपंच के बीच रहकर भी उसके प्रभाव और लिप्तता को अपने भीतर स्पर्श तक नहीं करने देता।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि निराकार परमतत्त्व कपिलसिद्ध मल्लिनाथ की करुणा से ही मछली को जल में सुरक्षित रहने का सहज बोध और शरण को संसार में रहकर भी निर्लिप्त रहने का विवेक प्राप्त हुआ है।","mr":"या वचनाचा मुख्य आशय असा आहे की, शरण हा या संपूर्ण प्रपंचात राहूनही प्रपंचाच्या मोहापासून पूर्णपणे अलिप्त कसा राहतो, हे एका सुंदर नैसर्गिक दृष्टांतातून स्पष्ट केले आहे.\n\nज्याप्रमाणे मासा सतत पाण्यात राहतो, परंतु त्या पाण्याला आपल्या नाकावाटे आत शिरू देत नाही आणि स्वतःचे अस्तित्व सुरक्षित ठेवतो.\n\nअगदी त्याचप्रमाणे, शरण हा सर्व सांसारिक व्यवहारांमध्ये वावरत असतानाही, त्या प्रपंचाला स्वतःवर किंवा आपल्या अंतरंगावर कोणताही ताबा मिळवू देत नाही.\n\nमाशाला पाण्यात राहूनही त्यापासून अलिप्त राहण्याची सहज जाणीव आणि शरणाला प्रपंचात राहूनही त्यापासून मुक्त राहण्याची ही विवेकबुद्धी कपिलसिद्ध मल्लिनाथानेच म्हणजेच परमतत्त्वानेच कृपापूर्वक प्रदान केली आहे, हे सत्य या वचनातून अधोरेखित होते.","fr":"Ce vachana met en lumière la manière dont un Sharana demeure au cœur de l'existence terrestre tout en préservant son être intérieur de toute emprise mondaine.\n\nIl emploie l'image éloquente du poisson qui, bien qu'immergé en permanence dans l'eau, empêche naturellement celle-ci de pénétrer par ses narines.\n\nDe la même façon, le Sharana vit pleinement engagé au sein de l'univers sans jamais laisser les illusions ou les attachements du monde l'envahir ni altérer sa conscience.\n\nS'adressant à la Réalité suprême sans forme sous le nom de Kapilasiddha Mallinatha, le poème célèbre la grâce divine qui a doté le poisson de cet instinct vital et accordé au Sharana cette haute sagesse du discernement spirituel."}},{"no":1010,"o":"ಜಲದೊಳಗೆ ಹುಟ್ಟಿದ ಬುದ್ಬುದಂಗಳು ಜಲದೊಳಗಡಗುವಂತೆ\n ನಿನ್ನೊಳಗಡಗಿಪ್ಪುದನಾರು ಬಲ್ಲರಯ್ಯ?\n ಶರಣದೇಹಿಕ ದೇವ ಮಹವನೊಡಗೂಡಿಪ್ಪ ಭೇದವ ಬಲ್ಲವರಾರಯ್ಯ?\n ಕೊಡನೊಳಗಣ ಚಂದ್ರ ಹಲವರೊಳಗೆ ವರ್ತಿಸುವಂತೆ\n ನೀನವರೊಳಗೆ ಹೊದ್ದದಿಪ್ಪುದನು ನಿನ್ನವರಲ್ಲದರಿವರಾರೈ,\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"Just as bubbles born within water subside within water,\nwho knows this abiding within you, O Lord?\nWho knows the mystery of the Divine embodied in the *Sharana* being united with the Great Light, O Lord?\nJust as the moon within a pot appears to move among many,\nwho other than your own could know how you abide among them yet remain untouched,\nO Kapilasiddha Mallikarjuna?","hi":"जल में उत्पन्न बुदबुदों के जल में ही समा जाने के समान,\nतुममें समाए रहने को कौन जानता है, हे स्वामी?\nशरण-देहधारी देव के महातत्त्व के साथ युक्त रहने के भेद को जाननेवाले कौन हैं, हे स्वामी?\nघड़ों के भीतर के चंद्रमा के अनेकों में विचरने के समान,\nतुम्हारे उनमें निर्लिप्त रहने को तुम्हारे अपनों के सिवा और कौन जाने,\nहे कपिलसिद्ध मल्लिकार्जुन!","mr":"पाण्यात उत्पन्न झालेले बुडबुडे पाण्यातच विरून जातात, त्याप्रमाणे\nतुझ्यात विरून राहण्याचे मर्म कोण जाणतो, हे प्रभो?\nशरणदेहधारी देव महानतेशी एकरूप होऊन राहण्याचे रहस्य जाणणारे कोण आहेत, हे प्रभो?\nघडातील चंद्र अनेकांमध्ये भासतो त्याप्रमाणे,\nतू त्यांच्यात लिप्त न होता राहतोस हे तुझ्या माणसांशिवाय कोण जाणेल,\nहे कपिलसिद्ध मल्लिकार्जुना?","fr":"Comme les bulles nées dans l'eau se résorbent dans l'eau,\nqui sait ce qui demeure résorbé en toi, Ô Seigneur ?\nQui sont ceux qui connaissent le mystère du Dieu incarné en Sharana, uni à la Grande Lumière, Ô Seigneur ?\nComme la lune reflétée dans une cruche se manifeste en plusieurs,\nqui d'autre que les tiens saurait que tu demeures parmi eux sans y être attaché,\nÔ Kapilasiddha Mallikarjuna ?"},"m":{"en":"This Vachana explores the subtle and inseparable union between an enlightened Sharana and the Formless Supreme Consciousness, addressed here through the ankitanama Kapilasiddha Mallikarjuna.\n\nUsing the metaphor of bubbles rising from water and dissolving back into it, the Vachana illustrates how individual existence originates from and ultimately merges back into the Absolute, noting how rare it is to truly comprehend the mystery of the Divine residing within the physical body of a Sharana.\n\nJust as the single moon appears reflected in numerous pots of water without ever being physically bound or tainted by them, the Supreme Reality dwells within all beings while remaining completely unattached and transcendent.\n\nUltimately, the Vachana emphasizes that this profound truth—of the Absolute being immanent within everyone yet remaining untouched—can only be realized by those who have attained true spiritual oneness with the Divine.","hi":"यह वचन परमतत्त्व और शरण के बीच के गहन तथा अद्वैत संबंध को स्पष्ट करता है।\n\nजिस प्रकार जल में उत्पन्न होने वाले बुलबुले अंततः उसी जल में विलीन हो जाते हैं, उसी प्रकार देहधारी होते हुए भी शरण का परमतत्त्व की महान चेतना में समाहित हो जाना और उसके साथ एकरूप होकर रहने का गूढ़ रहस्य सामान्य जन नहीं जान सकते।\n\nजैसे अनेक घड़ों के जल में एक ही चंद्रमा का प्रतिबिंब दिखाई देता है किंतु चंद्रमा उनसे निर्लिप्त रहता है, ठीक वैसे ही कपिलसिद्ध मल्लिकार्जुन के रूप में संबोधित निराकार परमात्मा भी सबके भीतर व्याप्त होते हुए भी सबसे अछूता रहता है।\n\nइस वचन का आध्यात्मिक मर्म यही है कि परमतत्त्व की इस सर्वव्यापक किंतु निर्लिप्त स्थिति और शरण के साथ उसके तादात्म्य को केवल सच्चे अनुभवी साधक ही समझ सकते हैं, अन्य कोई नहीं।","mr":"पाण्यात निर्माण झालेले बुडबुडे ज्याप्रमाणे पुन्हा पाण्यातच विरून जातात, त्याचप्रमाणे सर्व विश्व आणि शरण हे परमतत्त्वामध्येच सामावलेले आहेत, हे गूढ सर्वसामान्यांना समजणे कठीण आहे, असे हे वचन स्पष्ट करते.\n\nदेहधारी असलेला शरण आणि महान असे निराकार परमतत्त्व हे वरवर पाहता भिन्न वाटले, तरी ते प्रत्यक्षात एकरूपच असतात, या सूक्ष्म तत्वाची जाणीव केवळ अनुभवी व्यक्तीलाच होऊ शकते.\n\nपाण्याने भरलेल्या अनेक घड्यांमध्ये एकाच चंद्राचे प्रतिबिंब दिसते, पण चंद्र मात्र त्या घड्यांमध्ये अडकून न राहता अलिप्त असतो; तसेच शुद्ध चैतन्य हे सर्वांच्या ठायी व्यापूनही स्वतः पूर्णपणे अलिप्त राहते.\n\nकपिलसिद्ध मल्लिकार्जुन या नावाने संबोधलेल्या या परम सत्याचे सर्वांमधील अस्तित्व आणि त्याची अलिप्तता, हे केवळ त्याच्याशी एकरूप झालेल्या खऱ्या शरणांनाच आकळू शकते, असा या वचनाचा आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière le mystère profond de l'immanence et de la transcendance de la Réalité suprême sans forme, invoquée ici sous le nom de Kapilasiddha Mallikarjuna.\n\nÀ l'image des bulles qui naissent de l'eau et se résorbent en elle, toute l'existence demeure fondamentalement contenue au sein du Principe absolu, tandis que le Sharana accompli vit dans le corps tout en restant uni à cette conscience infinie.\n\nDe même que l'unique lune se reflète simultanément dans l'eau de multiples jarres sans jamais s'y attacher, la Vérité absolue réside au cœur des êtres tout en demeurant parfaitement libre et inaltérée.\n\nLe poème souligne enfin que ce paradoxe subtil d'une présence à la fois intime et détachée échappe au regard ordinaire et ne peut être saisi que par ceux qui ont réalisé leur unité spirituelle avec l'Absolu."}}]},
{"id":"s4","n":{"en":"Akkamahadevi","hi":"अक्कमहादेवी","mr":"अक्कमहादेवी","fr":"Akkamahadevi"},"v":[{"no":1170,"o":"ಕೆಂಡದ ಶವದಂತೆ, ಸೂತ್ರ ತಪ್ಪಿದ ಬೊಂಬೆಯಂತೆ,\n ಜಲವರತ ತಟಾಕದಂತೆ, ಬೆಂದ ನುಲಿಯಂತೆ-\n ಮತ್ತೆ ಹಿಂದಣಂಗವುಂಟೆ ಅಣ್ಣಾ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನಂಗವೆ ಆಶ್ರಯವಾದವಳಿಗೆ?","t":{"en":"Like a corpse on embers, like a puppet whose string has snapped,\nlike a tank whose water has dried up, like a burnt rope—\ndoes the former body still remain, O brother,\nfor her to whom the body of Chennamallikarjuna itself has become the refuge?","hi":"अंगारों में पड़े शव के समान, डोर टूटी कठपुतली के समान,\nजल सूखे सरोवर के समान, जली हुई रस्सी के समान—\nफिर क्या पहले का शरीर रह भी सकता है, हे भाई,\nजिसके लिए चेन्नमल्लिकार्जुन का अंग ही आश्रय हो गया हो?","mr":"निखाऱ्यांवरील प्रेताप्रमाणे, सूत्र तुटलेल्या बाहुलीप्रमाणे,\nपाणी आटलेल्या तलावाप्रमाणे, जळालेल्या दोरीप्रमाणे—\nपुन्हा पूर्वीचे अंग उरेल का, अरे भाऊ,\nचेन्नमल्लिकार्जुनाचे अंगच जिचा आश्रय झाले आहे तिला?","fr":"Comme un cadavre dans les braises, comme une marionnette qui a perdu son fil,\ncomme un étang dont l'eau s'est tarie, comme une corde brûlée —\npeut-il encore subsister le corps d'autrefois, mon frère,\npour celle à qui le corps même de Chennamallikarjuna est devenu le refuge ?"},"m":{"en":"This Vachana explains the complete and irreversible transformation of a seeker who has found ultimate refuge in Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nThrough vivid metaphors—a corpse on burning embers, a puppet with severed strings, a dried-up lake, and a burnt rope—the Vachana illustrates how worldly desires, ego, and mundane impulses lose all their vitality and power to bind once the self merges with the Absolute.\n\nJust as a burnt rope may retain its outward appearance for a moment but can no longer tie anything, the seeker's physical body continues to exist while their former worldly nature is entirely consumed.\n\nThe spiritual significance of this Vachana lies in the realization that once one's very being becomes united with the Supreme Reality, a return to one's previous, limited state of material existence becomes wholly impossible.","hi":"यह वचन परमतत्त्व में पूर्णतः लीन हो चुकी साधिका के सांसारिक और शारीरिक रूप से निष्प्रभ हो जाने की आध्यात्मिक स्थिति को स्पष्ट करता है।\n\nअंगारों में भस्म हुए शव, डोर टूट चुकी कठपुतली, सूख चुके सरोवर और जली हुई रस्सी के रूपकों के माध्यम से यह दर्शाया गया है कि ये सभी अपनी मूल शक्ति, गति और स्वरूप खो चुके हैं।\n\nइसी प्रकार, जिसने निराकार परमतत्त्व चन्नमल्लिकार्जुन के दिव्य स्वरूप को ही अपना एकमात्र आश्रय बना लिया है, उसके भीतर का पूर्व लौकिक देह-भाव और सांसारिक अस्मिता पूरी तरह समाप्त हो जाती है।\n\nइस वचन का केंद्रीय भाव यह है कि शुद्ध चैतन्य में एकाकार होने के पश्चात साधक का अपना पुराना पार्थिव अस्तित्व और अहंकार पुनः शेष नहीं रह सकता।","mr":"हे वचन परमतत्त्वाशी पूर्णपणे एकरूप झालेल्या साधकाच्या अंतर्बाह्य परिवर्तनाचे आणि देहभान विसरल्याच्या अवस्थेचे वर्णन करते.\n\nनिखाऱ्यावर जळालेले प्रेत, दोरी तुटलेली कळसूत्री बाहुली, पाणी आटलेला तलाव किंवा जळालेली दोरी ज्याप्रमाणे आपले मूळ अस्तित्व व कार्यक्षमता गमावून बसतात, तसेच आध्यात्मिक जागृतीनंतर साधकाच्या भौतिक देहाचे आणि अहंकाराचे होते.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाचे स्वरूपच ज्याचा आश्रय बनले आहे, त्याच्यासाठी जुने लौकिक देहभान आणि प्रापंचिक विकार कायमचे नष्ट होतात.\n\nपरम सत्याशी तादात्म्य पावल्यावर साधकाला पुन्हा आपल्या पूर्वीच्या मर्यादित आणि नश्वर शारीरिक अवस्थेकडे परतणे शक्य नसते, हेच या दृष्टांतांमधून स्पष्ट होते.","fr":"Ce vachana met en lumière la transformation radicale et irréversible de l'être lorsque la conscience fusionne pleinement avec la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna.\n\nÀ travers les images frappantes d'un cadavre consumé par les braises, d'une marionnette aux fils rompus, d'un étang asséché et d'une corde brûlée, le texte illustre l'extinction totale de l'ego et des conditionnements profanes.\n\nUne telle personne, ayant trouvé son unique refuge dans le Principe absolu et étant devenue son prolongeme
