नाही, त्या प्रपंचाला स्वतःवर किंवा आपल्या अंतरंगावर कोणताही ताबा मिळवू देत नाही.\n\nमाशाला पाण्यात राहूनही त्यापासून अलिप्त राहण्याची सहज जाणीव आणि शरणाला प्रपंचात राहूनही त्यापासून मुक्त राहण्याची ही विवेकबुद्धी कपिलसिद्ध मल्लिनाथानेच म्हणजेच परमतत्त्वानेच कृपापूर्वक प्रदान केली आहे, हे सत्य या वचनातून अधोरेखित होते.","fr":"Ce vachana met en lumière la manière dont un Sharana demeure au cœur de l'existence terrestre tout en préservant son être intérieur de toute emprise mondaine.\n\nIl emploie l'image éloquente du poisson qui, bien qu'immergé en permanence dans l'eau, empêche naturellement celle-ci de pénétrer par ses narines.\n\nDe la même façon, le Sharana vit pleinement engagé au sein de l'univers sans jamais laisser les illusions ou les attachements du monde l'envahir ni altérer sa conscience.\n\nS'adressant à la Réalité suprême sans forme sous le nom de Kapilasiddha Mallinatha, le poème célèbre la grâce divine qui a doté le poisson de cet instinct vital et accordé au Sharana cette haute sagesse du discernement spirituel.","te":"ఈ వచనం శరణుడు ప్రాపంచిక జీవనంలో ఉంటూనే దాని ప్రభావానికి లోనుకాకుండా ఎలా నిర్లిప్తంగా ఉంటాడో ఒక చక్కని ఉపమానంతో వివరిస్తున్నది.\n\nచేప నిరంతరం నీటిలోనే జీవించినప్పటికీ, ఆ నీటిని తన ముక్కు రంధ్రాలలోనికి ప్రవేశించకుండా ఎలా సహజమైన జాగ్రత్తతో ఉంటుందో ఇక్కడ ఉదాహరణగా చూపబడింది.\n\nఅదే విధంగా, శరణుడు కూడా ఈ సమస్త ప్రపంచం మధ్యలోనే జీవిస్తూ ఉన్నప్పటికీ, ఆ ప్రాపంచిక బంధాలు లేదా వాసనలు తన అంతరంగాన్ని తాకకుండా అంటీముట్టనట్లు ఉంటాడు.\n\nచేపకు నీటిలో బ్రతికే ఆ సహజ బుద్ధిని, శరణుడికి ప్రపంచంలో ఉంటూనే దానికి అతీతంగా నిలిచే ఈ వివేక బుద్ధిని కపిలసిద్ధ మల్లినాథ అనే నిరాకార పరమచైతన్యమే అనుగ్రహించిందని ఈ వచనంలోని అంతరార్థం.","kn":"ಈ ವಚನದಲ್ಲಿ, ಒಂದು ಮೀನು ಯಾವಾಗಲೂ ನೀರಿನ ಒಳಗೇ ಬದುಕುತ್ತಿದ್ದರೂ, ಆ ನೀರನ್ನು ತನ್ನ ಮೂಗಿನೊಳಗೆ ಬಿಟ್ಟುಕೊಳ್ಳದೆ ಹೇಗೆ ಎಚ್ಚರದಿಂದ ಇರುತ್ತದೆಯೋ ಆ ವಿಶೇಷತೆಯನ್ನು ಉದಾಹರಣೆಯಾಗಿ ನೀಡಲಾಗಿದೆ.\n\nಮೀನು ನೀರಿನಲ್ಲಿದ್ದರೂ ನೀರಿನಿಂದ ತನ್ನನ್ನು ಹೇಗೆ ರಕ್ಷಿಸಿಕೊಳ್ಳುತ್ತದೆಯೋ, ಹಾಗೆಯೇ ಒಬ್ಬ ಶರಣನು ಈ ಇಡೀ ಪ್ರಪಂಚದ ನಡುವೆಯೇ ಬದುಕುತ್ತಿದ್ದರೂ, ಪ್ರಾಪಂಚಿಕ ವಾಸನೆ ಅಥವಾ ಮಾಯೆಯನ್ನು ತನ್ನ ಹತ್ತಿರಕ್ಕೂ ಸುಳಿಯಲು ಬಿಡದೆ ನಿರ್ಲಿಪ್ತನಾಗಿರುತ್ತಾನೆ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ.\n\nಜಗತ್ತಿನಿಂದ ದೂರ ಓಡಿಹೋಗದೆ, ಸಂಸಾರದ ಒಳಗೇ ಇದ್ದುಕೊಂಡು ಪ್ರಪಂಚದ ಅಂಟನ್ನು ತನ್ನ ಮನಸ್ಸಿಗೆ ಹತ್ತಿಸಿಕೊಳ್ಳದೆ ಬದುಕುವ ಶರಣನ ಅರಿವಿನ ಸ್ಥಿತಿಯನ್ನು ಇಲ್ಲಿ ತುಂಬಾ ಮಾರ್ಮಿಕವಾಗಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿನಾಥ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಚೈತನ್ಯವೇ ಮೀನಿಗೆ ನೀರಿನಿಂದ ತನ್ನನ್ನು ಉಳಿಸಿಕೊಳ್ಳುವ ಸಹಜ ಬುದ್ಧಿಯನ್ನೂ, ಶರಣನಿಗೆ ಪ್ರಪಂಚದಲ್ಲಿದ್ದರೂ ಪ್ರಾಪಂಚಿಕ ಮೋಹಕ್ಕೆ ಒಳಗಾಗದೆ ಎಚ್ಚರದಿಂದ ಬದುಕುವ ಈ ಅರಿವನ್ನೂ ಕರುಣಿಸಿದೆ ಎಂದು ಈ ವಚನವು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತದೆ."}},{"no":1010,"o":"ಜಲದೊಳಗೆ ಹುಟ್ಟಿದ ಬುದ್ಬುದಂಗಳು ಜಲದೊಳಗಡಗುವಂತೆ\n ನಿನ್ನೊಳಗಡಗಿಪ್ಪುದನಾರು ಬಲ್ಲರಯ್ಯ?\n ಶರಣದೇಹಿಕ ದೇವ ಮಹವನೊಡಗೂಡಿಪ್ಪ ಭೇದವ ಬಲ್ಲವರಾರಯ್ಯ?\n ಕೊಡನೊಳಗಣ ಚಂದ್ರ ಹಲವರೊಳಗೆ ವರ್ತಿಸುವಂತೆ\n ನೀನವರೊಳಗೆ ಹೊದ್ದದಿಪ್ಪುದನು ನಿನ್ನವರಲ್ಲದರಿವರಾರೈ,\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"Just as bubbles born within water subside within water,\nwho knows this abiding within you, O Lord?\nWho knows the mystery of the Divine embodied in the *Sharana* being united with the Great Light, O Lord?\nJust as the moon within a pot appears to move among many,\nwho other than your own could know how you abide among them yet remain untouched,\nO Kapilasiddha Mallikarjuna?","hi":"जल में उत्पन्न बुदबुदों के जल में ही समा जाने के समान,\nतुममें समाए रहने को कौन जानता है, हे स्वामी?\nशरण-देहधारी देव के महातत्त्व के साथ युक्त रहने के भेद को जाननेवाले कौन हैं, हे स्वामी?\nघड़ों के भीतर के चंद्रमा के अनेकों में विचरने के समान,\nतुम्हारे उनमें निर्लिप्त रहने को तुम्हारे अपनों के सिवा और कौन जाने,\nहे कपिलसिद्ध मल्लिकार्जुन!","mr":"पाण्यात उत्पन्न झालेले बुडबुडे पाण्यातच विरून जातात, त्याप्रमाणे\nतुझ्यात विरून राहण्याचे मर्म कोण जाणतो, हे प्रभो?\nशरणदेहधारी देव महानतेशी एकरूप होऊन राहण्याचे रहस्य जाणणारे कोण आहेत, हे प्रभो?\nघडातील चंद्र अनेकांमध्ये भासतो त्याप्रमाणे,\nतू त्यांच्यात लिप्त न होता राहतोस हे तुझ्या माणसांशिवाय कोण जाणेल,\nहे कपिलसिद्ध मल्लिकार्जुना?","fr":"Comme les bulles nées dans l'eau se résorbent dans l'eau,\nqui sait ce qui demeure résorbé en toi, Ô Seigneur ?\nQui sont ceux qui connaissent le mystère du Dieu incarné en Sharana, uni à la Grande Lumière, Ô Seigneur ?\nComme la lune reflétée dans une cruche se manifeste en plusieurs,\nqui d'autre que les tiens saurait que tu demeures parmi eux sans y être attaché,\nÔ Kapilasiddha Mallikarjuna ?","te":"జలములో పుట్టిన బుద్బుదములు జలములోనే అణగిపోయే విధంగా\nనీలో అణగి ఉండుటను ఎవరు ఎరుగుదురు ఓ స్వామీ?\nశరణదేహిక దేవుడు మహత్తుతో కూడి ఉండే ఆ మర్మమును ఎరిగినవారెవరు ఓ స్వామీ?\nకుండలోని చంద్రుడు అనేకులలో సంచరించే విధంగా\nనీవు వారిలో అంటక ఉండుటను నీవారు కాక ఇతరులెవరు ఎరుగుదురు,\nఓ కపిలసిద్ధ మల్లికార్జునా.","kn":"ಜಲದೊಳಗೆ ಹುಟ್ಟಿದ ಬುದ್ಬುದಂಗಳು ಜಲದೊಳಗಡಗುವಂತೆ\n ನಿನ್ನೊಳಗಡಗಿಪ್ಪುದನಾರು ಬಲ್ಲರಯ್ಯ?\n ಶರಣದೇಹಿಕ ದೇವ ಮಹವನೊಡಗೂಡಿಪ್ಪ ಭೇದವ ಬಲ್ಲವರಾರಯ್ಯ?\n ಕೊಡನೊಳಗಣ ಚಂದ್ರ ಹಲವರೊಳಗೆ ವರ್ತಿಸುವಂತೆ\n ನೀನವರೊಳಗೆ ಹೊದ್ದದಿಪ್ಪುದನು ನಿನ್ನವರಲ್ಲದರಿವರಾರೈ,\n ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನಾ."},"m":{"en":"This Vachana explores the subtle and inseparable union between an enlightened Sharana and the Formless Supreme Consciousness, addressed here through the ankitanama Kapilasiddha Mallikarjuna.\n\nUsing the metaphor of bubbles rising from water and dissolving back into it, the Vachana illustrates how individual existence originates from and ultimately merges back into the Absolute, noting how rare it is to truly comprehend the mystery of the Divine residing within the physical body of a Sharana.\n\nJust as the single moon appears reflected in numerous pots of water without ever being physically bound or tainted by them, the Supreme Reality dwells within all beings while remaining completely unattached and transcendent.\n\nUltimately, the Vachana emphasizes that this profound truth—of the Absolute being immanent within everyone yet remaining untouched—can only be realized by those who have attained true spiritual oneness with the Divine.","hi":"यह वचन परमतत्त्व और शरण के बीच के गहन तथा अद्वैत संबंध को स्पष्ट करता है।\n\nजिस प्रकार जल में उत्पन्न होने वाले बुलबुले अंततः उसी जल में विलीन हो जाते हैं, उसी प्रकार देहधारी होते हुए भी शरण का परमतत्त्व की महान चेतना में समाहित हो जाना और उसके साथ एकरूप होकर रहने का गूढ़ रहस्य सामान्य जन नहीं जान सकते।\n\nजैसे अनेक घड़ों के जल में एक ही चंद्रमा का प्रतिबिंब दिखाई देता है किंतु चंद्रमा उनसे निर्लिप्त रहता है, ठीक वैसे ही कपिलसिद्ध मल्लिकार्जुन के रूप में संबोधित निराकार परमात्मा भी सबके भीतर व्याप्त होते हुए भी सबसे अछूता रहता है।\n\nइस वचन का आध्यात्मिक मर्म यही है कि परमतत्त्व की इस सर्वव्यापक किंतु निर्लिप्त स्थिति और शरण के साथ उसके तादात्म्य को केवल सच्चे अनुभवी साधक ही समझ सकते हैं, अन्य कोई नहीं।","mr":"पाण्यात निर्माण झालेले बुडबुडे ज्याप्रमाणे पुन्हा पाण्यातच विरून जातात, त्याचप्रमाणे सर्व विश्व आणि शरण हे परमतत्त्वामध्येच सामावलेले आहेत, हे गूढ सर्वसामान्यांना समजणे कठीण आहे, असे हे वचन स्पष्ट करते.\n\nदेहधारी असलेला शरण आणि महान असे निराकार परमतत्त्व हे वरवर पाहता भिन्न वाटले, तरी ते प्रत्यक्षात एकरूपच असतात, या सूक्ष्म तत्वाची जाणीव केवळ अनुभवी व्यक्तीलाच होऊ शकते.\n\nपाण्याने भरलेल्या अनेक घड्यांमध्ये एकाच चंद्राचे प्रतिबिंब दिसते, पण चंद्र मात्र त्या घड्यांमध्ये अडकून न राहता अलिप्त असतो; तसेच शुद्ध चैतन्य हे सर्वांच्या ठायी व्यापूनही स्वतः पूर्णपणे अलिप्त राहते.\n\nकपिलसिद्ध मल्लिकार्जुन या नावाने संबोधलेल्या या परम सत्याचे सर्वांमधील अस्तित्व आणि त्याची अलिप्तता, हे केवळ त्याच्याशी एकरूप झालेल्या खऱ्या शरणांनाच आकळू शकते, असा या वचनाचा आध्यात्मिक आशय आहे.","fr":"Ce vachana met en lumière le mystère profond de l'immanence et de la transcendance de la Réalité suprême sans forme, invoquée ici sous le nom de Kapilasiddha Mallikarjuna.\n\nÀ l'image des bulles qui naissent de l'eau et se résorbent en elle, toute l'existence demeure fondamentalement contenue au sein du Principe absolu, tandis que le Sharana accompli vit dans le corps tout en restant uni à cette conscience infinie.\n\nDe même que l'unique lune se reflète simultanément dans l'eau de multiples jarres sans jamais s'y attacher, la Vérité absolue réside au cœur des êtres tout en demeurant parfaitement libre et inaltérée.\n\nLe poème souligne enfin que ce paradoxe subtil d'une présence à la fois intime et détachée échappe au regard ordinaire et ne peut être saisi que par ceux qui ont réalisé leur unité spirituelle avec l'Absolu.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, నీటిలో పుట్టిన బుడగలు తిరిగి ఆ నీటిలోనే లయమైపోయినట్లుగా, సకల చరాచర జగత్తు నిరాకార పరమతత్త్వమైన కపిలసిద్ధ మల్లికార్జునునిలోనే లీనమై ఉండే రహస్యాన్ని సామాన్యులు తెలుసుకోలేరు.\n\nభౌతిక శరీరాన్ని ధరించి ఉన్నప్పటికీ, శరణుడు ఆ అనంతమైన పరమచైతన్యపు మహావెలుగుతో ఏకమై ఉండే సూక్ష్మమైన స్థితిని ఎవరు మాత్రం గ్రహించగలరు అని ఈ వచనం ప్రశ్నిస్తోంది.\n\nఅనేక కుండలలో ఉన్న నీటిలో ఒకే చంద్రుని ప్రతిబింబం కనిపించినప్పటికీ ఆ చంద్రుడు వాటికి అంటకుండా ఉన్నట్లే, నిర్గుణ పరమసత్యం అందరిలోనూ సంచరిస్తున్నా దేనికీ అంటకుండా ఉండే తత్త్వాన్ని నిజమైన శరణులు తప్ప ఇతరులు ఎవరూ అర్థం చేసుకోలేరు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನೀರಿನಲ್ಲಿ ಹುಟ್ಟಿದ ನೀರ್ಗುಳ್ಳೆಗಳು ಮತ್ತೆ ಅದೇ ನೀರಿನಲ್ಲಿ ಕರಗಿ ಒಂದಾಗುವಂತೆ, ಶರಣರು ಕೂಡ ಕಪಿಲಸಿದ್ಧ ಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದೊಳಗೆ ಬೆರೆತು ಹೋಗಿರುವ ಆಳವಾದ ಸ್ಥಿತಿಯನ್ನು ಸಾಮಾನ್ಯ ಜನರು ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಿಲ್ಲ.\n\nಭೌತಿಕ ದೇಹವನ್ನು ಹೊಂದಿರುವ ಶರಣರು ಆ ಮಹಾಚೈತನ್ಯದ ಜೊತೆಗೆ ಒಂದಾಗಿರುವ ಸೂಕ್ಷ್ಮವಾದ ರಹಸ್ಯವನ್ನಾಗಲಿ, ಅಥವಾ ಅವರ ಬಾಹ್ಯ ಬದುಕಿನ ಒಳಗಿರುವ ಆ ತಾತ್ವಿಕ ಸತ್ಯವನ್ನಾಗಲಿ ಹೊರಗಿನವರು ಗುರುತಿಸಲಾರರು.\n\nಬೇರೆ ಬೇರೆ ಕೊಡಗಳ ನೀರಿನಲ್ಲಿ ಒಂದೇ ಚಂದ್ರನ ಪ್ರತಿಬಿಂಬ ಕಾಣಿಸಿಕೊಂಡರೂ, ಆ ಚಂದ್ರ ಮಾತ್ರ ನೀರಿಗೆ ಅಂಟಿಕೊಳ್ಳದೆ ಹೇಗೆ ಬೇರೆಯಾಗಿಯೇ ಇರುತ್ತಾನೋ, ಹಾಗೆಯೇ ಪರಮಸತ್ಯವು ಎಲ್ಲರೊಳಗೆ ಇದ್ದರೂ ಯಾವುದಕ್ಕೂ ಅಂಟಿಕೊಳ್ಳದೆ ನಿರ್ಲಿಪ್ತವಾಗಿರುತ್ತದೆ.\n\nಹೀಗೆ ಎಲ್ಲರೊಳಗೂ ಇದ್ದು ಎಲ್ಲವನ್ನೂ ಮೀರಿ ನಿಂತಿರುವ ಆ ಶುದ್ಧ ಚೈತನ್ಯದ ಸ್ವರೂಪವನ್ನು ಮತ್ತು ಅದರೊಡನೆ ಶರಣರು ಹೊಂದಿರುವ ಅವಿನಾಭಾವ ಸಂಬಂಧವನ್ನು, ಆ ಅರಿವಿನ ಅನುಭಾವ ಪಡೆದವರೇ ಹೊರತು ಬೇರೆಯವರು ಅರಿಯಲು ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}}]},
{"id":"s4","n":{"en":"Akkamahadevi","hi":"अक्कमहादेवी","mr":"अक्कमहादेवी","fr":"Akkamahadevi","te":"అక్కమహాదేవి","kn":"ಅಕ್ಕಮಹಾದೇವಿ"},"v":[{"no":1170,"o":"ಕೆಂಡದ ಶವದಂತೆ, ಸೂತ್ರ ತಪ್ಪಿದ ಬೊಂಬೆಯಂತೆ,\n ಜಲವರತ ತಟಾಕದಂತೆ, ಬೆಂದ ನುಲಿಯಂತೆ-\n ಮತ್ತೆ ಹಿಂದಣಂಗವುಂಟೆ ಅಣ್ಣಾ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನಂಗವೆ ಆಶ್ರಯವಾದವಳಿಗೆ?","t":{"en":"Like a corpse on embers, like a puppet whose string has snapped,\nlike a tank whose water has dried up, like a burnt rope—\ndoes the former body still remain, O brother,\nfor her to whom the body of Chennamallikarjuna itself has become the refuge?","hi":"अंगारों में पड़े शव के समान, डोर टूटी कठपुतली के समान,\nजल सूखे सरोवर के समान, जली हुई रस्सी के समान—\nफिर क्या पहले का शरीर रह भी सकता है, हे भाई,\nजिसके लिए चेन्नमल्लिकार्जुन का अंग ही आश्रय हो गया हो?","mr":"निखाऱ्यांवरील प्रेताप्रमाणे, सूत्र तुटलेल्या बाहुलीप्रमाणे,\nपाणी आटलेल्या तलावाप्रमाणे, जळालेल्या दोरीप्रमाणे—\nपुन्हा पूर्वीचे अंग उरेल का, अरे भाऊ,\nचेन्नमल्लिकार्जुनाचे अंगच जिचा आश्रय झाले आहे तिला?","fr":"Comme un cadavre dans les braises, comme une marionnette qui a perdu son fil,\ncomme un étang dont l'eau s'est tarie, comme une corde brûlée —\npeut-il encore subsister le corps d'autrefois, mon frère,\npour celle à qui le corps même de Chennamallikarjuna est devenu le refuge ?","te":"నిప్పులపై కాలిపోయిన శవం వలె, సూత్రం తెగిన బొమ్మ వలె,\nనీరు ఇంకిపోయిన చెరువు వలె, కాలిన తాడు వలె-\nమరల మునుపటి అంగం ఉంటుందా ఓ అన్నా,\nచెన్నమల్లికార్జునుని అంగమే ఆశ్రయమైన ఆమెకు?","kn":"ಕೆಂಡದ ಶವದಂತೆ, ಸೂತ್ರ ತಪ್ಪಿದ ಬೊಂಬೆಯಂತೆ,\n ಜಲವರತ ತಟಾಕದಂತೆ, ಬೆಂದ ನುಲಿಯಂತೆ-\n ಮತ್ತೆ ಹಿಂದಣಂಗವುಂಟೆ ಅಣ್ಣಾ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನಂಗವೆ ಆಶ್ರಯವಾದವಳಿಗೆ?"},"m":{"en":"This Vachana explains the complete and irreversible transformation of a seeker who has found ultimate refuge in Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nThrough vivid metaphors—a corpse on burning embers, a puppet with severed strings, a dried-up lake, and a burnt rope—the Vachana illustrates how worldly desires, ego, and mundane impulses lose all their vitality and power to bind once the self merges with the Absolute.\n\nJust as a burnt rope may retain its outward appearance for a moment but can no longer tie anything, the seeker's physical body continues to exist while their former worldly nature is entirely consumed.\n\nThe spiritual significance of this Vachana lies in the realization that once one's very being becomes united with the Supreme Reality, a return to one's previous, limited state of material existence becomes wholly impossible.","hi":"यह वचन परमतत्त्व में पूर्णतः लीन हो चुकी साधिका के सांसारिक और शारीरिक रूप से निष्प्रभ हो जाने की आध्यात्मिक स्थिति को स्पष्ट करता है।\n\nअंगारों में भस्म हुए शव, डोर टूट चुकी कठपुतली, सूख चुके सरोवर और जली हुई रस्सी के रूपकों के माध्यम से यह दर्शाया गया है कि ये सभी अपनी मूल शक्ति, गति और स्वरूप खो चुके हैं।\n\nइसी प्रकार, जिसने निराकार परमतत्त्व चन्नमल्लिकार्जुन के दिव्य स्वरूप को ही अपना एकमात्र आश्रय बना लिया है, उसके भीतर का पूर्व लौकिक देह-भाव और सांसारिक अस्मिता पूरी तरह समाप्त हो जाती है।\n\nइस वचन का केंद्रीय भाव यह है कि शुद्ध चैतन्य में एकाकार होने के पश्चात साधक का अपना पुराना पार्थिव अस्तित्व और अहंकार पुनः शेष नहीं रह सकता।","mr":"हे वचन परमतत्त्वाशी पूर्णपणे एकरूप झालेल्या साधकाच्या अंतर्बाह्य परिवर्तनाचे आणि देहभान विसरल्याच्या अवस्थेचे वर्णन करते.\n\nनिखाऱ्यावर जळालेले प्रेत, दोरी तुटलेली कळसूत्री बाहुली, पाणी आटलेला तलाव किंवा जळालेली दोरी ज्याप्रमाणे आपले मूळ अस्तित्व व कार्यक्षमता गमावून बसतात, तसेच आध्यात्मिक जागृतीनंतर साधकाच्या भौतिक देहाचे आणि अहंकाराचे होते.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाचे स्वरूपच ज्याचा आश्रय बनले आहे, त्याच्यासाठी जुने लौकिक देहभान आणि प्रापंचिक विकार कायमचे नष्ट होतात.\n\nपरम सत्याशी तादात्म्य पावल्यावर साधकाला पुन्हा आपल्या पूर्वीच्या मर्यादित आणि नश्वर शारीरिक अवस्थेकडे परतणे शक्य नसते, हेच या दृष्टांतांमधून स्पष्ट होते.","fr":"Ce vachana met en lumière la transformation radicale et irréversible de l'être lorsque la conscience fusionne pleinement avec la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna.\n\nÀ travers les images frappantes d'un cadavre consumé par les braises, d'une marionnette aux fils rompus, d'un étang asséché et d'une corde brûlée, le texte illustre l'extinction totale de l'ego et des conditionnements profanes.\n\nUne telle personne, ayant trouvé son unique refuge dans le Principe absolu et étant devenue son prolongement même, a définitivement aboli la vitalité de son existence passée.\n\nLa portée spirituelle de ce poème réside dans l'affirmation que l'union avec la Conscience pure dissout à jamais l'identité ancienne, rendant tout retour à l'état antérieur d'attachement et d'illusion impossible.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, నిరాకార పరమచైతన్యమైన చెన్నమల్లికార్జున తత్త్వపు అంగమే తనకు ఏకైక ఆశ్రయంగా మారినప్పుడు, సాధకురాలి పూర్వపు లౌకిక దేహభావన పూర్తిగా నశించిపోతుంది.\n\nనిప్పులలో కాలిపోయిన శవంలాగా, ఆడించే తాడు తెగిపోయిన బొమ్మలాగా, నీరు పూర్తిగా ఇంకిపోయిన చెరువులాగా, కాలి బూడిదైన తాడులాగా ప్రాపంచికమైన అహంకారం, దేహస్పృహ తమ సహజ శక్తిని కోల్పోయి నిర్జీవమవుతాయి.\n\nఈ నాలుగు ప్రతీకలూ పూర్వపు భౌతిక వాసనలు, కర్మబంధాలు మళ్ళీ చిగురించే అవకాశం లేకుండా సమూలంగా దగ్ధమైపోయిన స్థితిని స్పష్టం చేస్తున్నాయి.\n\nఅలా పరమసత్యంలో సంపూర్ణంగా లీనమై, తత్త్వమే తన ఉనికిగా మారిన వారికి తిరిగి వెనుకటి ప్రాపంచిక స్వరూపం గానీ, భౌతిక దేహభ్రాంతి గానీ ఎప్పటికీ ఉండబోవని ఈ వచనం నిరూపిస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದಲ್ಲಿ ಸಂಪೂರ್ಣವಾಗಿ ಒಂದಾದ ಸಾಧಕಿಯ ಸ್ಥಿತಿಯನ್ನು ಬಹಳ ಸ್ಪಷ್ಟವಾಗಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಬೆಂಕಿಯಲ್ಲಿ ಸುಟ್ಟುಹೋದ ಶವ, ದಾರ ಕಡಿದುಹೋದ ಗೊಂಬೆ, ನೀರು ಬತ್ತಿಹೋದ ಕೆರೆ ಮತ್ತು ಸುಟ್ಟು ಬೂದಿಯಾದ ಹಗ್ಗವು ಹೇಗೆ ತಮ್ಮ ಮೊದಲಿನ ರೂಪ ಮತ್ತು ಚಲನೆಯನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತವೆಯೋ, ಹಾಗೆಯೇ ಪರಮಚೈತನ್ಯದ ಅರಿವಿನಲ್ಲಿ ಬೆರೆತವರ ಲೌಕಿಕ ದೇಹಭಾವವು ಸಂಪೂರ್ಣವಾಗಿ ಅಳಿದುಹೋಗಿರುತ್ತದೆ.\n\nಇಲ್ಲಿ ಹೇಳಿರುವ ರೂಪಕಗಳು ಕೇವಲ ದೇಹದ ಬಾಹ್ಯ ಸ್ಥಿತಿಯನ್ನಲ್ಲದೆ, ಸಾಧಕರ ಒಳಗಿನ ಅಹಂಕಾರ, ಲೌಕಿಕ ಆಸೆ-ಆಕಾಂಕ್ಷೆಗಳು ಮತ್ತು ದೇಹಾಭಿಮಾನವು ಸಂಪೂರ್ಣವಾಗಿ ಸುಟ್ಟುಹೋಗಿರುವುದನ್ನು ಸೂಚಿಸುತ್ತವೆ.\n\nಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನ ಅಸ್ತಿತ್ವವನ್ನೇ ತನ್ನ ನಿಜವಾದ ನೆಲೆಯನ್ನಾಗಿ ಮಾಡಿಕೊಂಡ ಮೇಲೆ, ಅಂತಹವರಿಗೆ ಮತ್ತೆ ಹಿಂದಿನ ಪ್ರಾಪಂಚಿಕ ದೇಹಭಾವಕ್ಕೆ ಮರಳಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎಂಬುದೇ ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1171,"o":"ಕೆಚ್ಚಿಲ್ಲದ ಮರನ ಕ್ರಿಮಿ ಇಂಬುಗೊಂಬಂತೆ,\n ಒಡೆಯನಿಲ್ಲದ ಮನೆಯ ಶುನಕ ಸಂಚುಗೊಂಬಂತೆ,\n ನೃಪತಿಯಿಲ್ಲದ ದೇಶವ ಮನ್ನೆಯರಿಂಬುಗೊಂಬಂತೆ,\n ನಿಮ್ಮ ನೆನಹಿಲ್ಲದ ಶರೀರ[ವು]\n ಭೂತ ಪ್ರೇತ ಪಿಶಾಚಿಗಳಿಂಬುಗೊಂಬಂತೆ\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"Like worms making their abode in a tree without heartwood,\nlike a dog prowling into a house without a master,\nlike chieftains seizing a land without a king,\na body devoid of your remembrance\nis like an abode taken over by ghosts, spirits, and demons,\nO Chennamallikarjuna.","hi":"सारहीन वृक्ष में जैसे कीड़े आश्रय लेते हैं,\nस्वामीहीन घर में जैसे कुत्ते घात लगाते हैं,\nराजाहीन देश को जैसे सामंत अपने वश में कर लेते हैं,\nआपके स्मरण से रहित शरीर\nभूत, प्रेत और पिशाचों के आश्रय लेने के समान है,\nहे चेन्नमल्लिकार्जुन।","mr":"गाभा नसलेल्या झाडाला किड्यांनी थारा करावा त्याप्रमाणे,\nमालक नसलेल्या घरात कुत्र्याने दबा धरावा त्याप्रमाणे,\nराजा नसलेला देश सरदारांनी बळकावावा त्याप्रमाणे,\nतुमचे स्मरण नसलेले शरीर\nभूत, प्रेत, पिशाच्चांनी व्यापून टाकावे त्याप्रमाणे असते,\nहे चेन्नमल्लिकार्जुना.","fr":"Comme les vers prennent demeure dans un arbre sans cœur,\ncomme un chien rôde dans une maison sans maître,\ncomme les seigneurs vassaux prennent demeure dans un pays sans roi,\nle corps privé de votre souvenir\nest tel celui où prennent demeure les esprits, les revenants et les démons,\nÔ Chennamallikarjuna.","te":"చేవలేని చెట్టును పురుగులు ఆక్రమించుకున్నట్లు,\nయజమాని లేని ఇంటిని శునకం చొరబడి ఆక్రమించుకున్నట్లు,\nనృపతి లేని దేశాన్ని మన్నెదొరలు ఆక్రమించుకున్నట్లు,\nమీ తలపు లేని శరీరము\nభూత ప్రేత పిశాచాలు ఆక్రమించుకున్నట్లుంటుంది\nఓ చెన్నమల్లికార్జునా.","kn":"ಕೆಚ್ಚಿಲ್ಲದ ಮರನ ಕ್ರಿಮಿ ಇಂಬುಗೊಂಬಂತೆ,\n ಒಡೆಯನಿಲ್ಲದ ಮನೆಯ ಶುನಕ ಸಂಚುಗೊಂಬಂತೆ,\n ನೃಪತಿಯಿಲ್ಲದ ದೇಶವ ಮನ್ನೆಯರಿಂಬುಗೊಂಬಂತೆ,\n ನಿಮ್ಮ ನೆನಹಿಲ್ಲದ ಶರೀರ[ವು]\n ಭೂತ ಪ್ರೇತ ಪಿಶಾಚಿಗಳಿಂಬುಗೊಂಬಂತೆ\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ."},"m":{"en":"This Vachana illustrates the spiritual vulnerability of a human life that lacks constant remembrance of the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nThrough vivid metaphors, it observes how anything devoid of its core strength or rightful master is quickly overrun by destructive forces—just as insects hollow out a tree lacking solid heartwood, stray dogs take over an abandoned house, and petty chieftains seize a kingdom without a sovereign.\n\nSimilarly, when the human body and mind are devoid of divine awareness, they lose their inner anchor and vitality.\n\nSuch an unguarded existence easily falls prey to base instincts, restless desires, and negative tendencies, which the Vachana symbolically compares to ghosts, spirits, and demons taking possession of an empty vessel.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस शरीर और मन में परमतत्त्व का निरंतर स्मरण नहीं होता, वह अपनी आंतरिक शक्ति और सार्थकता खोकर अवांछित विकारों का निवास बन जाता है।\n\nयहाँ तीन सटीक दृष्टांतों के माध्यम से यह समझाया गया है कि जैसे सारहीन वृक्ष में कीड़े लग जाते हैं, स्वामी के बिना घर में कुत्ते डेरा डाल लेते हैं और राजा विहीन देश पर सामंत या उपद्रवी लोग अधिकार कर लेते हैं।\n\nउसी प्रकार, चन्नमल्लिकार्जुन रूपी निराकार परम सत्य की स्मृति से रहित मानव देह भी भूत, प्रेत और पिशाच जैसी तामसिक वृत्तियों और निकृष्ट भावों के अधीन हो जाती है।\n\nइस वचन का आध्यात्मिक महत्त्व यह स्पष्ट करना है कि मनुष्य के भीतर शुद्ध चैतन्य की जागृत स्मृति ही वह मूल तत्व है, जो उसके जीवन को नकारात्मक और आसुरी वृत्तियों के प्रभाव से सुरक्षित रखती है।","mr":"चन्नमल्लिकार्जुन या नावाने संबोधल्या जाणाऱ्या परमतत्त्वाचे स्मरण नसलेल्या मानवी जीवनाची व शरीराची अवस्था कशी होते, हे या वचनातून प्रभावी उदाहरणांनी स्पष्ट केले आहे.\n\nज्याप्रमाणे आतील गाभा नसलेल्या पोकळ झाडामध्ये कीटक घर करतात, मालक नसलेल्या रिकाम्या घरात कुत्री शिरतात आणि राजा नसलेल्या देशाचा ताबा सामंत किंवा इतर अधिकारी घेतात, तशीच अवस्था परमतत्त्वाच्या स्मरणाशिवाय जगणाऱ्या माणसाची होते.\n\nअशा चैतन्यहीन आणि जागृती नसलेल्या शरीरावर भूत, प्रेत व पिशाच्च यांसारख्या अनिष्ट प्रवृत्ती ताबा मिळवतात, असे सांगून हे वचन आंतरिक आध्यात्मिक स्मरणाचे महत्त्व अधोरेखित करते.","fr":"Ce vachana met en lumière la vulnérabilité de l'être humain lorsque son esprit est dépourvu de la conscience constante de la Réalité suprême sans forme, invoquée ici sous le nom de Channamallikarjuna.\n\nPour illustrer cette vérité, le texte recourt à trois images frappantes : un arbre sans cœur de bois solide devient la proie des insectes, une demeure sans maître est envahie par les chiens errants, et un royaume sans souverain tombe sous l'emprise de chefs rivaux.\n\nDe la même manière, un corps privé du souvenir vivant du Principe absolu perd sa force intérieure et devient le refuge d'influences négatives et tourmentées, comparées symboliquement aux spectres et aux esprits malfaisants (Bhuta, Preta et Pishachi).\n\nLa portée spirituelle de ce vachana réside ainsi dans l'affirmation que seule la présence intérieure de la Conscience pure constitue le véritable cœur, le maître et le souverain capables de préserver l'intégrité de l'être.","te":"అంతర్గత సత్తువ లేని చెట్టును పురుగులు తొలిచివేసినట్లు, యజమాని లేని ఇంట్లో కుక్కలు యథేచ్ఛగా తిష్టవేసినట్లు, రాజు లేని దేశాన్ని సామంతులు ఆక్రమించుకున్నట్లుగా ఆధారం లేని వ్యవస్థలు అస్తవ్యస్తమవుతాయని ఈ వచనం లోకరీతిని దృష్టాంతంగా చూపుతోంది.\n\nఅదే విధంగా, చెన్నమల్లికార్జున అనే అంకితనామంతో సంబోధించబడే నిరాకార పరమచైతన్యపు స్మరణ లేని మానవ శరీరం తన ఆధ్యాత్మిక సారాన్ని కోల్పోతుందని ఇక్కడి అంతరార్థం.\n\nపరమతత్త్వం పట్ల నిరంతర ఎరుక లేని అటువంటి దేహం, భూతప్రేత పిశాచాలకు నిలయమైనట్లుగా అజ్ఞానానికి మరియు నీచమైన ప్రవృత్తులకు ఆవాసంగా మారుతుందని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನವು ನಮಗೆ ಅರ್ಥ ಮಾಡಿಸುವುದು ಏನೆಂದರೆ, ಒಂದು ವಸ್ತುವಿನಲ್ಲಿ ತನ್ನದೇ ಆದ ಆಂತರಿಕ ಗಟ್ಟಿತನ ಅಥವಾ ಎಚ್ಚರದ ಹಿಡಿತವಿಲ್ಲದಿದ್ದಾಗ, ಅದು ಬೇಡದ ಬಾಹ್ಯ ಶಕ್ತಿಗಳ ವಶವಾಗಿ ತನ್ನ ಮೌಲ್ಯವನ್ನು ಕಳೆದುಕೊಳ್ಳುತ್ತದೆ.\n\nಒಳಗಿನ ತಿರುಳಿಲ್ಲದ ಮರಕ್ಕೆ ಹುಳುಗಳು ಮುತ್ತಿಕೊಳ್ಳುವಂತೆ, ಯಜಮಾನನಿಲ್ಲದ ಮನೆಗೆ ನಾಯಿಗಳು ನುಗ್ಗುವಂತೆ ಮತ್ತು ರಾಜನಿಲ್ಲದ ದೇಶವನ್ನು ಸಾಮಂತರು ಆಕ್ರಮಿಸಿಕೊಳ್ಳುವಂತೆ, ಅರಿವಿನ ಬಲವಿಲ್ಲದ ಸ್ಥಿತಿಯು ಸುಲಭವಾಗಿ ಹಾಳಾಗುತ್ತದೆ ಎಂಬುದನ್ನು ಇಲ್ಲಿನ ಉದಾಹರಣೆಗಳು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.\n\nಅದೇ ರೀತಿ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದ ನೆನಪು ಮತ್ತು ಎಚ್ಚರವಿಲ್ಲದ ಮನುಷ್ಯನ ದೇಹವು, ಭೂತ-ಪ್ರೇತ-ಪಿಶಾಚಿಗಳಂತಹ ಕೆಟ್ಟ ಬಯಕೆಗಳು, ಅಜ್ಞಾನ ಮತ್ತು ತಾಮಸ ಗುಣಗಳ ವಾಸಸ್ಥಾನವಾಗುತ್ತದೆ.\n\nಒಟ್ಟಾರೆಯಾಗಿ, ಶುದ್ಧ ಚೈತನ್ಯದ ನಿರಂತರ ಸ್ಮರಣೆಯೇ ಮನುಷ್ಯನ ಅಂತರಂಗದ ನಿಜವಾದ ತಿರುಳು ಮತ್ತು ಯಜಮಾನನಾಗಿದ್ದು, ಆ ಎಚ್ಚರವಿಲ್ಲದ ದೇಹವು ಅರಿವಿಲ್ಲದ ನಕಾರಾತ್ಮಕ ವಿಕಾರಗಳಿಗೆ ಬಲಿಯಾಗುತ್ತದೆ ಎಂಬುದೇ ಈ ವಚನದ ಆಳವಾದ ಆಶಯವಾಗಿದೆ."}},{"no":1172,"o":"ಕೆಡದಿರೇ ಕೆಡದಿರೇ, ಮೃಡನಡಿಯ ಹಿಡಿಯಿರೇ.\n ದೃಢವಲ್ಲ ನೋಡಿರೆ ಸಂಸಾರಸುಖವು.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಬರೆದ ಅಕ್ಷರವು ತೊಡೆಯದ ಮುನ್ನ\n ಬೇಗ ಬೇಗ ಶಿವಶರಣೆನ್ನಿ.","t":{"en":"Do not be ruined, do not be ruined; take hold of the feet of Mrida.\nLook, the pleasures of worldly life are not lasting.\nBefore the letters written by Chennamallikarjuna are wiped away,\nquickly, quickly say \"Shiva Sharana\".","hi":"नष्ट मत होओ, नष्ट मत होओ, मृड के चरण पकड़ो।\nदेखो, संसार का सुख दृढ़ नहीं है।\nचेन्नमल्लिकार्जुन के लिखे अक्षर के मिटने से पहले,\nशीघ्र-शीघ्र 'शिवशरण' कहो।","mr":"नाश पावू नका, नाश पावू नका; मृडाचे चरण धरा.\nपाहा, संसारसुख शाश्वत नाही.\nचेन्नमल्लिकार्जुनाने लिहिलेली अक्षरे पुसून जाण्यापूर्वी,\nलवकर लवकर शिवशरण म्हणा.","fr":"Ne vous perdez pas, ne vous perdez pas, saisissez les pieds de Mrida.\nVoyez, le bonheur de l'existence mondaine n'est point durable.\nAvant que les lettres inscrites par Chennamallikarjuna ne s'effacent,\nhâtez-vous, hâtez-vous de dire « Shiva Sharana ».","te":"చెడిపోకండి చెడిపోకండి, మృడుని పాదాలను పట్టుకోండి.\nదృఢమైనది కాదు చూడండి సంసారసుఖం.\nచెన్నమల్లికార్జునుడు వ్రాసిన అక్షరం చెరిగిపోకముందే\nత్వరగా త్వరగా శివశరణు అనండి.","kn":"ಕೆಡದಿರೇ ಕೆಡದಿರೇ, ಮೃಡನಡಿಯ ಹಿಡಿಯಿರೇ.\n ದೃಢವಲ್ಲ ನೋಡಿರೆ ಸಂಸಾರಸುಖವು.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಬರೆದ ಅಕ್ಷರವು ತೊಡೆಯದ ಮುನ್ನ\n ಬೇಗ ಬೇಗ ಶಿವಶರಣೆನ್ನಿ."},"m":{"en":"This Vachana sounds an urgent call against wasting human life in the pursuit of fleeting worldly pleasures.\n\nIt reminds us that material happiness is inherently unstable and impermanent, urging seekers instead to take refuge in the compassionate Supreme Reality.\n\nUsing the metaphor of an inscription written by Channamallikarjuna that will eventually be erased, the Vachana highlights the finite nature of our allotted lifespan.\n\nBefore the inevitable end arrives and time runs out, it calls upon individuals to awaken immediately and dedicate themselves to the path of Shiva-consciousness.","hi":"इस वचन का केंद्रीय संदेश यह है कि मनुष्य को अज्ञानता में भटककर अपना जीवन नष्ट नहीं करना चाहिए, बल्कि कल्याणकारी परमतत्त्व के मार्ग को अपनाना चाहिए।\n\nयह वचन स्पष्ट करता है कि सांसारिक सुख स्थायी या सुदृढ़ नहीं हैं, इसलिए उनके भ्रम में उलझे रहना व्यर्थ है।\n\nनिराकार परमतत्त्व चन्नमल्लिकार्जुन द्वारा निर्धारित जीवन की अवधि समाप्त होने से पहले ही, मनुष्य को बिना किसी विलंब के शिव-तत्त्व की शरण में चले जाना चाहिए।\n\nअतः इस वचन का आध्यात्मिक महत्त्व यह है कि नश्वर जीवन के समाप्त होने से पूर्व ही मनुष्य को सचेत होकर परम सत्य के प्रति समर्पित हो जाना चाहिए।","mr":"हे वचन आपल्याला या जाणिवेकडे घेऊन जाते की मानवाने आपले मौल्यवान जीवन वाया न घालवता वेळीच शिवतत्त्वाचा आश्रय घेतला पाहिजे.\n\nसंसारातील सर्व सुखे ही तात्पुरती, क्षणभंगुर आणि अस्थिर आहेत, हे वास्तव यात स्पष्टपणे मांडले आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाने ललाटावर लिहिलेले आयुष्याचे अक्षर पुसले जाण्यापूर्वीच म्हणजेच मृत्यू येण्यापूर्वी आपण सावध झाले पाहिजे.\n\nआयुष्य संपण्याआधीच कोणताही विलंब न लावता तत्काळ शिवशरणांच्या मार्गाचा स्वीकार करून परम सत्याशी एकरूप व्हावे, असा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana lance un appel pressant à ne pas se perdre dans l'illusion et à chercher refuge auprès de la Réalité suprême.\n\nIl met en lumière le caractère éphémère et instable des plaisirs de l'existence mondaine, sur lesquels nul ne peut véritablement s'appuyer.\n\nAvant que le temps imparti à la vie humaine — évoqué par les lettres du destin inscrites par Channamallikarjuna, la Conscience absolue — ne s'efface, il est essentiel de s'éveiller.\n\nLe texte exhorte ainsi à se tourner sans tarder vers la voie spirituelle en prenant immédiatement refuge dans le Principe divin.","te":"లౌకికమైన సంసార భ్రమలలో పడి ఆధ్యాత్మికంగా పతనం కాకుండా, శాశ్వతమైన శివతత్త్వాన్ని ఆశ్రయించాలని ఈ వచనం పిలుపునిస్తోంది.\n\nప్రాపంచికమైన సంసార సుఖాలు ఏమాత్రం స్థిరమైనవి కావని, అవి క్షణికమైనవని ఇక్కడ స్పష్టంగా హెచ్చరించబడింది.\n\nనిరాకార పరమచైతన్యమైన చెన్నమల్లికార్జున రాసిన ఆయువు అనే అక్షరాలు తుడిచిపెట్టుకుపోకముందే, అనగా జీవితకాలం ముగియకముందే మేల్కొనాలని ఈ వచనం సూచిస్తోంది.\n\nఅందువల్ల కాలాన్ని వృథా చేయకుండా, ఆయువు ఉండగానే త్వరత్వరగా శివశరణు అంటూ పరమసత్యాన్ని ధ్యానించడమే మానవుని కర్తవ్యమని దీని అంతరార్థం.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಲೌಕಿಕ ಬದುಕಿನ ಭ್ರಮೆಯಲ್ಲಿ ಸಿಲುಕಿ ಜೀವನವನ್ನು ವ್ಯರ್ಥ ಮಾಡಿಕೊಳ್ಳದೆ ಪರಮಸತ್ಯದ ಕಡೆಗೆ ಸಾಗಬೇಕು ಎಂಬುದಾಗಿದೆ.\n\nನಾವು ಶಾಶ್ವತವೆಂದು ನಂಬಿರುವ ಈ ಸಂಸಾರದ ಸುಖ-ಭೋಗಗಳು ಎಂದಿಗೂ ಸ್ಥಿರವಾದವುಗಳಲ್ಲ, ಅವು ಕ್ಷಣಿಕವಾದವು ಎಂಬ ಸತ್ಯವನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಚೈತನ್ಯದ ನಿಯಮದಂತೆ ನಮಗೆ ದೊರೆತಿರುವ ಈ ಜೀವನದ ಆಯುಷ್ಯವು ಮುಗಿದುಹೋಗುವ ಮುನ್ನವೇ ಎಚ್ಚೆತ್ತುಕೊಳ್ಳಬೇಕು.\n\nಕಾಲ ಮೀರುವ ಮೊದಲು ಮೃಡನ ಅಂದರೆ ಆ ಶುದ್ಧ ಶಿವತತ್ತ್ವದ ನೆಲೆಯನ್ನು ಅರಿತು, ಕೂಡಲೇ ಶರಣು ಭಾವದಿಂದ ಪರಮಸತ್ಯವನ್ನು ಅಪ್ಪಿಕೊಳ್ಳಬೇಕು ಎಂಬುದೇ ಈ ವಚನದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1173,"o":"ಕೊಳಲ ದನಿಗೆ ಸರ್ಪ ತಲೆದೂಗಿದಡೇನು,\n ಒಳಗಣ ವಿಷದ ಬಯಕೆ ಬಿಡದನ್ನಕ್ಕ?\n ಹಾಡಿದಡೇನು, ಕೇಳಿದಡೇನು,\n ತನ್ನಲುಳ್ಳ ಅವಗುಣ ಬಿಡದನ್ನಕ್ಕ?\n ಒಳಗನರಿದು ಹೊರಗೆ ಮರೆದವರ\n ನೀ ಎನಗೆ ತೋರಯ್ಯಾ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ.","t":{"en":"What if a serpent sways its head to the sound of the flute,\nso long as it does not give up the craving of the venom within?\nWhat if one sings, what if one listens,\nso long as one does not give up the faults within oneself?\nThose who have realized the within and forgotten the without—\nshow them to me, O Chennamallikarjuna.","hi":"बाँसुरी की धुन पर सर्प सिर हिलाए तो क्या,\nजब तक भीतर के विष की लालसा न छोड़े?\nगाने से क्या, सुनने से क्या,\nजब तक अपने भीतर का अवगुण न छोड़े?\nभीतर को जानकर बाहर को भूलनेवालों को,\nतुम मुझे दिखाओ, हे चेन्नमल्लिकार्जुन।","mr":"बासरीच्या सुरावर सर्पाने मान डोलवली म्हणून काय झाले,\nआतल्या विषाची लालसा जोवर सुटत नाही तोवर?\nगायले म्हणून काय झाले, ऐकले म्हणून काय झाले,\nआपल्यात असलेले अवगुण जोवर सुटत नाहीत तोवर?\nआतले जाणून बाह्य जग विसरलेल्यांना\nतू मला दाखव रे, हे चेन्नमल्लिकार्जुना।","fr":"Qu'importe si le serpent balance la tête au son de la flûte,\ntant qu'il ne quitte pas le désir du venin qui est en lui ?\nQu'importe que l'on chante, qu'importe que l'on écoute,\ntant que l'on ne quitte pas les défauts qui sont en soi ?\nCeux qui ont pris conscience de l'intérieur et oublié l'extérieur,\nmontre-les-moi, Ô Seigneur, Ô Chennamallikarjuna.","te":"పిల్లనగ్రోవి నాదానికి పాము తల ఊపితే ఏమి లాభం,\nలోపలి విషపు కోరికను విడిచిపెట్టనంతవరకు?\nపాడితే ఏమి లాభం, వింటే ఏమి లాభం,\nతనలో ఉన్న అవగుణాన్ని విడిచిపెట్టనంతవరకు?\nఅంతరంగాన్ని ఎరిగి బాహ్యాన్ని మరచినవారిని\nనీవు నాకు చూపు స్వామీ, ఓ చెన్నమల్లికార్జునా.","kn":"ಕೊಳಲ ದನಿಗೆ ಸರ್ಪ ತಲೆದೂಗಿದಡೇನು,\n ಒಳಗಣ ವಿಷದ ಬಯಕೆ ಬಿಡದನ್ನಕ್ಕ?\n ಹಾಡಿದಡೇನು, ಕೇಳಿದಡೇನು,\n ತನ್ನಲುಳ್ಳ ಅವಗುಣ ಬಿಡದನ್ನಕ್ಕ?\n ಒಳಗನರಿದು ಹೊರಗೆ ಮರೆದವರ\n ನೀ ಎನಗೆ ತೋರಯ್ಯಾ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ."},"m":{"en":"This Vachana highlights the futility of outward spiritual expressions when they are not accompanied by genuine inner transformation.\n\nUsing the vivid image of a cobra swaying to the melody of a flute while still retaining its inner craving for venom, the Vachana points out that external appreciation of beauty or spirituality means nothing if one's underlying toxic tendencies remain unchanged.\n\nSimilarly, merely singing devotional songs or listening to spiritual discourses is pointless until a person consciously sheds their own inner flaws and vices.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana expresses a deep longing to encounter truly realized souls who have awakened to their inner truth (Arivu) and transcended mere external appearances and worldly distractions.","hi":"इस वचन का केंद्रीय भाव यह है कि जब तक मनुष्य अपने भीतर के दोषों और अवगुणों का त्याग नहीं करता, तब तक केवल बाहरी रूप से भक्ति के गीत गाना या सुनना निरर्थक है।\n\nजिस प्रकार बांसुरी की मधुर धुन पर साँप अपना फन तो हिलाता है, किंतु अपने भीतर के विष और डसने की प्रवृत्ति को नहीं छोड़ता, उसी प्रकार आंतरिक शुद्धि के बिना बाहरी आध्यात्मिक आचरण निष्फल होता है।\n\nयहाँ परमतत्त्व चन्नमल्लिकार्जुन को संबोधित करते हुए ऐसे सच्चे साधकों के दर्शन की आकांक्षा व्यक्त की गई है, जिन्होंने अपने अंतर्मन के सत्य को जानकर बाहरी आडंबरों और सांसारिक विस्मृतियों को पूरी तरह त्याग दिया है।","mr":"हे वचन बाह्य भक्तीचा दिखावा आणि आंतरिक शुद्धी यातील महत्त्वाचा भेद स्पष्ट करते.\n\nज्याप्रमाणे पुंगीच्या स्वरावर नाग कितीही डोलला तरी त्याच्या आतील विष टाकण्याची वृत्ती सुटत नाही, त्याचप्रमाणे स्वतःमधील दोष आणि अवगुण सोडल्याशिवाय केवळ भक्तीगीते गाणे किंवा ती ऐकणे निरर्थक ठरते.\n\nआध्यात्मिक प्रगतीसाठी केवळ बाह्य आचरण पुरेसे नसून, मनातील विकार आणि वाईट प्रवृत्तींचा त्याग करणे आवश्यक आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाला स्मरून, ज्यांनी स्वतःचे अंतरंग पूर्णपणे जाणले आहे आणि बाह्य जगाचा विसर पाडला आहे, अशा खऱ्या आत्मज्ञानी साधकांचे दर्शन घडवण्याची आर्तता या वचनातून व्यक्त होते.","fr":"Ce vachana met en lumière la futilité d'une dévotion purement extérieure lorsqu'elle ne s'accompagne pas d'une véritable transformation intérieure.\n\nÀ travers la métaphore du serpent qui ondule au son de la flûte sans jamais renoncer à son venin, le texte rappelle que chanter des hymnes ou écouter des enseignements spirituels reste vain tant que l'on ne se libère pas de ses propres défauts.\n\nEn s'adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce poème exprime l'aspiration profonde à rencontrer les êtres éveillés qui ont connu la vérité intérieure et se sont détachés des apparences du monde extérieur.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, పిల్లనగ్రోవి నాదానికి పాము తల ఊపినంత మాత్రాన దాని లోపల దాగి ఉన్న విషపు స్వభావం మారదు.\n\nఅదేవిధంగా, మనిషి తనలోని అవగుణాలను, అంతర్గత దోషాలను విడిచిపెట్టనంత వరకు ఆధ్యాత్మిక గీతాలు పాడినా లేదా విన్నా ఎటువంటి ప్రయోజనం ఉండదు.\n\nకేవలం బాహ్యమైన ప్రదర్శనలతో కాకుండా, అంతరంగ శుద్ధితో కూడిన నిజమైన మార్పు ఉండాలని ఈ వచనం స్పష్టం చేస్తోంది.\n\nచెన్నమల్లికార్జున అనే అంకితనామంతో నిరాకార పరమతత్త్వాన్ని సంబోధిస్తూ, తమ అంతరంగ సత్యాన్ని సంపూర్ణంగా తెలుసుకుని, బాహ్య ప్రపంచపు ప్రలోభాలను మరిచిపోయిన నిజమైన సాధకులను చూపమని వచనకారుడు కోరుతున్నారు.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕೊಳಲಿನ ನಾದಕ್ಕೆ ಹಾವು ಹೊರಗಿನಿಂದ ತಲೆದೂಗಿದರೂ ತನ್ನ ಒಳಗಿನ ವಿಷದ ಬಯಕೆಯನ್ನು ಬಿಡದಿದ್ದರೆ ಹೇಗೆ ಅದರಿಂದ ಏನೂ ಪ್ರಯೋಜನವಿಲ್ಲವೋ, ಹಾಗೆಯೇ ಮನುಷ್ಯನ ಬಾಹ್ಯ ಭಕ್ತಿಯ ವರ್ತನೆಗಳೂ ಅರ್ಥಹೀನವಾಗುತ್ತವೆ.\n\nಒಬ್ಬ ವ್ಯಕ್ತಿ ತನ್ನ ಒಳಗಿರುವ ಕೆಟ್ಟ ಗುಣಗಳನ್ನು ಕಳೆದುಕೊಳ್ಳುವವರೆಗೆ, ಆತ ಹೊರಗಿನಿಂದ ಎಷ್ಟೇ ವಚನಗಳನ್ನು ಅಥವಾ ಭಕ್ತಿಯ ಹಾಡುಗಳನ್ನು ಹಾಡಿದರೂ, ಒಳ್ಳೆಯ ಮಾತುಗಳನ್ನು ಕೇಳಿದರೂ ಅದಕ್ಕೆ ಯಾವುದೇ ಬೆಲೆಯಿರುವುದಿಲ್ಲ.\n\nಅಂತರಂಗದ ಶುದ್ಧತೆಯಿಲ್ಲದೆ ಕೇವಲ ತೋರಿಕೆಗಾಗಿ ಮಾಡುವ ಆಧ್ಯಾತ್ಮಿಕ ಚಟುವಟಿಕೆಗಳು ಮನುಷ್ಯನ ಒಳಗಿನ ಕಲ್ಮಶವನ್ನು ತೊಳೆಯಲಾರವು ಎಂಬುದು ಇಲ್ಲಿನ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ.\n\nಹಾಗಾಗಿ, ತಮ್ಮ ಅಂತರಂಗದ ನಿಜವಾದ ಅರಿವನ್ನು ಕಂಡುಕೊಂಡು, ಹೊರಗಿನ ಪ್ರಾಪಂಚಿಕ ತೋರಿಕೆ ಮತ್ತು ಭ್ರಮೆಗಳನ್ನು ಮರೆತು ಬದುಕುವ ನಿಜವಾದ ಸಾಧಕರನ್ನು ನನಗೆ ತೋರಿಸು ಎಂದು ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದಲ್ಲಿ ಈ ವಚನವು ನಿವೇದಿಸಿಕೊಳ್ಳುತ್ತದೆ."}},{"no":1174,"o":"ಕೋಲ ತುದಿಯ ಕೋಡಗದಂತೆ,\n ನೇಣ ತುದಿಯ ಬೊಂಬೆಯಂತೆ,\n ಆಡಿದೆನಯ್ಯಾ ನೀನಾಡಿಸಿದಂತೆ,\n ಆನು ನುಡಿದೆನಯ್ಯಾ ನೀ ನುಡಿಸಿದಂತೆ,\n ಆನು ಇದ್ದೆನಯ್ಯಾ ನೀನು ಇರಿಸಿದಂತೆ,\n ಜಗದ ಯಂತ್ರವಾಹಕ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಸಾಕೆಂಬನ್ನಕ್ಕ.","t":{"en":"Like a monkey at the tip of a pole,\nlike a puppet at the end of a string,\nI danced, O Lord, just as you made me dance,\nI spoke, O Lord, just as you made me speak,\nI remained, O Lord, just as you made me remain,\nuntil Chennamallikarjuna, the mover of the machine of the world, says, \"Enough.\"","hi":"डंडे के सिरे के बंदर के समान,\nडोरी के सिरे की कठपुतली के समान,\nमैं नाची हे स्वामी, जैसे तुमने नचाया,\nमैं बोली हे स्वामी, जैसे तुमने बुलवाया,\nमैं रही हे स्वामी, जैसे तुमने रखा,\nजग के यंत्रवाहक चेन्नमल्लिकार्जुन के 'बस' कहने तक।","mr":"काठीच्या टोकावरील माकडाप्रमाणे,\nदोरीच्या टोकावरील बाहुलीप्रमाणे,\nमी नाचले हे प्रभो, तू नाचवलेस तसे,\nमी बोलले हे प्रभो, तू बोलवलेस तसे,\nमी राहिले हे प्रभो, तू ठेवलेस तसे,\nजगाचा यंत्रवाहक चेन्नमल्लिकार्जुन 'पुरे' म्हणेल तोपर्यंत।","fr":"Comme un singe au bout d'un bâton,\ncomme une marionnette au bout d'une corde,\nj'ai dansé, ô Seigneur, comme tu m'as fait danser ;\nj'ai parlé, ô Seigneur, comme tu m'as fait parler ;\nj'ai demeuré, ô Seigneur, comme tu m'as fait demeurer,\njusqu'à ce que Chennamallikarjuna, le moteur de la mécanique du monde, dise : « C'est assez. »","te":"కర్ర చివరి కోతి వలె,\nత్రాడు చివరి బొమ్మ వలె,\nఆడాను స్వామీ నీవు ఆడించినట్లు,\nనేను పలికాను స్వామీ నీవు పలికించినట్లు,\nనేను ఉన్నాను స్వామీ నీవు ఉంచినట్లు,\nజగత్తు యంత్రవాహకుడైన చెన్నమల్లికార్జునుడు చాలు అనేవరకు.","kn":"ಕೋಲ ತುದಿಯ ಕೋಡಗದಂತೆ,\n ನೇಣ ತುದಿಯ ಬೊಂಬೆಯಂತೆ,\n ಆಡಿದೆನಯ್ಯಾ ನೀನಾಡಿಸಿದಂತೆ,\n ಆನು ನುಡಿದೆನಯ್ಯಾ ನೀ ನುಡಿಸಿದಂತೆ,\n ಆನು ಇದ್ದೆನಯ್ಯಾ ನೀನು ಇರಿಸಿದಂತೆ,\n ಜಗದ ಯಂತ್ರವಾಹಕ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಸಾಕೆಂಬನ್ನಕ್ಕ."},"m":{"en":"This Vachana expresses a state of complete ego-dissolution, where the seeker realizes that individual actions, speech, and existence are entirely governed by the Formless Supreme Consciousness.\n\nThrough the vivid metaphors of a monkey dancing at the end of a stick and a puppet moving at the end of a string, the Vachana illustrates how human agency is ultimately an instrument directed by a higher cosmic rhythm.\n\nAddressing the Supreme Reality as Channamallikarjuna, the prime mover of the universe's mechanism, the seeker relinquishes all sense of personal doership and abides in total alignment with the Absolute until it deems the journey complete.","hi":"इस वचन का केंद्रीय भाव यह है कि मनुष्य का संपूर्ण अस्तित्व और उसकी सभी क्रियाएँ निराकार परमतत्त्व के संचालन के अधीन हैं।\n\nजिस प्रकार लाठी के सिरे पर बंधा हुआ बंदर या डोरी के सिरे से बंधी हुई कठपुतली नचाने वाले के इशारे पर ही नाचती है, उसी प्रकार साधक भी स्वयं को उस परम चैतन्य के हाथों का एक माध्यम मात्र मानता है।\n\nसाधक का बोलना, चलना और किसी भी स्थिति में रहना सब कुछ उसी परम सत्य की प्रेरणा से होता है, जिसमें व्यक्तिगत अहंकार या कर्तापन का कोई स्थान नहीं है।\n\nइस वचन का आध्यात्मिक महत्त्व यह है कि जब तक संपूर्ण जगत् के सूत्रधार चन्नमल्लिकार्जुन स्वयं 'बस' नहीं कह देते, तब तक साधक उनकी इच्छा के अनुसार ही अपने जीवन की प्रत्येक भूमिका का निर्वहन करता रहता है।","mr":"या वचनाचा मुख्य आशय असा आहे की, मानवी जीवनातील प्रत्येक हालचाल, वाणी आणि अस्तित्व हे सर्वस्वी विश्वाचे नियमन करणाऱ्या परमतत्त्वाच्या प्रेरणेवर अवलंबून आहे.\n\nकाठीच्या टोकावर नाचणाऱ्या माकडाप्रमाणे किंवा दोरीच्या टोकावर हालणाऱ्या कळसूत्री बाहुलीप्रमाणे, साधक स्वतःला चन्नमल्लिकार्जुन या निराकार परमतत्त्वाच्या हातातील एक माध्यम मानतो.\n\nजगाचा यंत्रचालक असलेले हे परम चैतन्य जसे नाचवते, जसे बोलवते आणि ज्या स्थितीत ठेवते, अगदी तसेच आणि तोवरच आपले जीवन चालते, ही संपूर्ण अहंकारशून्यतेची व शरणागतीची जाणीव या वचनातून व्यक्त होते.","fr":"Ce vachana exprime un effacement complet de l'ego individuel devant la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna.\n\nÀ travers les images saisissantes du singe au bout d'un bâton et de la marionnette au bout d'un fil, le texte illustre que chaque mouvement, chaque parole et chaque état de l'existence dépendent entièrement de ce principe absolu qui anime l'univers.\n\nL'être humain reconnaît ainsi n'avoir aucune autonomie propre dans ses actes ou dans sa demeure, vivant exactement selon l'impulsion qui lui est donnée par le moteur cosmique du monde.\n\nLa portée spirituelle de ce poème réside dans l'acceptation sereine de cette dynamique universelle, qui se poursuit jusqu'à l'instant où la Conscience suprême elle-même décide que le jeu de l'existence touche à sa fin.","te":"ఈ వచనం మానవ అస్తిత్వం నిరాకార పరమచైతన్యానికి పూర్తిగా లోబడి ఉండే స్థితిని అత్యంత సహజమైన ఉపమానాలతో ఆవిష్కరిస్తోంది.\n\nకర్ర చివరన ఆడే కోతిలాగా, తాడు చివరన కదిలే తోలుబొమ్మలాగా తన కదలికలు, మాటలు, ఉనికి అన్నీ ఆ పరమతత్త్వం నడిపించినట్లే జరుగుతున్నాయని సాధకుని అనుభవ పూర్వకమైన సమర్పణ ఇందులో కనిపిస్తుంది.\n\nసమస్త జగత్తును నడిపించే యంత్రవాహక శక్తిగా చెన్నమల్లికార్జున అనే అంకితనామంతో సూచించబడిన నిర్గుణ పరమచైతన్యాన్ని సంబోధిస్తూ, వ్యక్తిగత అహంకారాన్ని పూర్తిగా వదులుకున్న స్థితిని ఈ వచనం వ్యక్తపరుస్తోంది.\n\nఆ పరమసత్యం 'ఇక చాలు' అని నిర్ణయించేంత వరకు, జీవి తన సొంత ఇచ్చతో కాక ఆ మహాచైతన్యపు సంకల్పానికి అనుగుణంగానే జీవిస్తాడనే లోతైన తాత్త్విక అంతరార్థం ఇందులో ఇమిడి ఉంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ಕೋಲಿನ ತುದಿಯಲ್ಲಿರುವ ಮಂಗ ಮತ್ತು ದಾರದ ತುದಿಯಲ್ಲಿರುವ ಬೊಂಬೆ ಹೇಗೆ ಆಡಿಸುವವರ ಇಚ್ಛೆಯಂತೆ ಮಾತ್ರ ಚಲಿಸುತ್ತವೆಯೋ, ಹಾಗೆಯೇ ಸಾಧಕನು ತನ್ನ ಸ್ವಂತ ಅಹಂಕಾರವನ್ನು ಸಂಪೂರ್ಣವಾಗಿ ಕಳೆದುಕೊಂಡು ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಇಚ್ಛೆಗೆ ತಕ್ಕಂತೆ ಬದುಕುವ ಸ್ಥಿತಿಯನ್ನು ಇಲ್ಲಿ ವಿವರಿಸಲಾಗಿದೆ.\n\n'ನಾನು' ಎಂಬ ಸ್ವಂತ ಬಯಕೆ ಅಥವಾ ಹಮ್ಮನ್ನು ಬಿಟ್ಟು, ಆ ಪರಮಸತ್ಯವು ಆಡಿಸಿದಂತೆ ಆಡುತ್ತಾ, ನುಡಿಸಿದಂತೆ ನುಡಿಯುತ್ತಾ, ಇರಿಸಿದ ಸ್ಥಿತಿಯಲ್ಲೇ ತೃಪ್ತಿಯಿಂದ ಇರುವುದು ಸಂಪೂರ್ಣ ಶರಣಾಗತಿಯ ನಿಜವಾದ ಲಕ್ಷಣವಾಗಿದೆ.\n\nಇಡೀ ಜಗತ್ತಿನ ಚಲನೆಗೆ ಮೂಲ ಕಾರಣವಾಗಿರುವ 'ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ' ಎಂಬ ಪರಮ ಚೈತನ್ಯವು 'ಇನ್ನು ಸಾಕು' ಎಂದು ತಾನೇ ನಿಲ್ಲಿಸುವವರೆಗೂ, ಜೀವವು ತನ್ನ ಸ್ವಂತಿಕೆಯನ್ನು ಮರೆತು ಆ ಮಹಾ ಅರಿವಿನ ಸೂತ್ರಕ್ಕೆ ಒಳಪಟ್ಟು ಬದುಕುವುದೇ ಇಲ್ಲಿನ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1175,"o":"ಗಂಗೆಯೊಡನಾಡಿದ ಘಟ್ಟ ಬೆಟ್ಟಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಅಗ್ನಿಯೊಡನಾಡಿದ ಕಾಷô್ಠಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಯೋತಿಯೊಡನಾಡಿದ ಕತ್ತಲೆ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಞಾನಿಯೊಡನಾಡಿದ ಅಜ್ಞಾನಿ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಎಲೆ ಪರಶಿವಮೂರ್ತಿ ಹರನೆ, ನಿಮ್ಮ ಜಂಗಮಲಿಂಗದೊಡನಾಡಿ\n ಎನ್ನ ಭವಾದಿ ಭವಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಾ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ","t":{"en":"Behold the undoing of the ridges and hills that kept company with the Ganga, O brothers.\nBehold the undoing of the logs of wood that kept company with the fire, O brothers.\nBehold the undoing of the darkness that kept company with the light, O brothers.\nBehold the undoing of the ignorant one who kept company with the wise, O brothers.\nO Hara, embodiment of Supreme Shiva, having kept company with your *Jangamalinga*,\nbehold the undoing of all my births and cycles of birth, O Chennamallikarjuna.","hi":"गंगा के संग रमण करनेवाले घाटों और पर्वतों के नष्ट होने की दशा तो देखिए, हे भाई!\nअग्नि के संग रमण करनेवाली लकड़ियों के नष्ट होने की दशा तो देखिए, हे भाई!\nज्योति के संग रमण करनेवाले अंधकार के नष्ट होने की दशा तो देखिए, हे भाई!\nज्ञानी के संग रमण करनेवाले अज्ञानी के नष्ट होने की दशा तो देखिए, हे भाई!\nहे परशिवमूर्ति हर, आपके जंगमलिंग के संग रमण करके,\nमेरे भवादि भवों के नष्ट होने की दशा तो देखिए, हे चेन्नमल्लिकार्जुन!","mr":"गंगेशी संगत केलेल्या घाट आणि डोंगरांचा झालेला नाश पहा हो!\nअग्नीशी संगत केलेल्या काष्ठांचा झालेला नाश पहा हो!\nज्योतीशी संगत केलेल्या अंधाराचा झालेला नाश पहा हो!\nज्ञानी पुरुषाशी संगत केलेल्या अज्ञानी जीवाचा झालेला नाश पहा हो!\nहे परशिवमूर्ती हरा, तुमच्या जंगमलिंगाशी संगत करून\nमाझ्या जन्मोजन्मीच्या भवांचा झालेला नाश पहा, हे चेन्नमल्लिकार्जुना!","fr":"Voyez, mes frères, la ruine qu'ont subie les berges et les collines qui se sont mêlées au Gange.\nVoyez, mes frères, la ruine qu'a subie le bois qui s'est mêlé au feu.\nVoyez, mes frères, la ruine qu'ont subie les ténèbres qui se sont mêlées à la lumière.\nVoyez, mes frères, la ruine qu'a subie l'ignorant qui s'est mêlé au sage.\nÔ Hara, incarnation de Parashiva, après m'être mêlée à votre *Jangamalinga*,\nvoyez la ruine qu'ont subie le cycle de mes existences et toutes mes renaissances, Ô Chennamallikarjuna !","te":"గంగతో సహవాసం చేసిన కొండలు గట్టులు నశించిపోయిన నాశనాన్ని చూడండి సోదరులారా.\nఅగ్నితో సహవాసం చేసిన కట్టెలు నశించిపోయిన నాశనాన్ని చూడండి సోదరులారా.\nజ్యోతితో సహవాసం చేసిన చీకటి నశించిపోయిన నాశనాన్ని చూడండి సోదరులారా.\nజ్ఞానితో సహవాసం చేసిన అజ్ఞాని నశించిపోయిన నాశనాన్ని చూడండి సోదరులారా.\nఓ పరశివమూర్తీ హరుడా, మీ జంగమలింగంతో సహవాసం చేసి\nనా భవాది భవములన్నీ నశించిపోయిన నాశనాన్ని చూడండి, ఓ చెన్నమల్లికార్జునా.","kn":"ಗಂಗೆಯೊಡನಾಡಿದ ಘಟ್ಟ ಬೆಟ್ಟಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಅಗ್ನಿಯೊಡನಾಡಿದ ಕಾಷô್ಠಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಯೋತಿಯೊಡನಾಡಿದ ಕತ್ತಲೆ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಜ್ಞಾನಿಯೊಡನಾಡಿದ ಅಜ್ಞಾನಿ ಕೆಟ್ಟ ಕೇಡ ನೋಡಿರಯ್ಯಾ.\n ಎಲೆ ಪರಶಿವಮೂರ್ತಿ ಹರನೆ, ನಿಮ್ಮ ಜಂಗಮಲಿಂಗದೊಡನಾಡಿ\n ಎನ್ನ ಭವಾದಿ ಭವಂಗಳು ಕೆಟ್ಟ ಕೇಡ ನೋಡಾ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಾ"},"m":{"en":"This Vachana illustrates the profound transformative power of spiritual association through a series of striking metaphors, showing how contact with a higher force completely dissolves the lower state.\n\nJust as rocks and hills are worn away by the flowing Ganga, dry wood is consumed by fire, darkness vanishes in the presence of light, and an ignorant person loses their ignorance in the company of the wise, this seeming \"ruin\" is actually a total transformation into something higher.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana culminates in the realization that through intimate communion with the Jangamalinga—the enlightened spiritual seekers who embody dynamic divine consciousness—the seeker's own cycle of worldly existence and inner limitations has been completely eradicated.","hi":"इस वचन का केंद्रीय भाव यह है कि श्रेष्ठ और पावन सत्ता के संपर्क में आने से जड़ता, अंधकार और अज्ञान के पुराने अस्तित्व का पूर्णतः रूपांतरण हो जाता है।\n\nजिस प्रकार गंगा के प्रवाह के संपर्क में आने से विशाल पहाड़ और चट्टानें कटकर अपना कठोर रूप खो देती हैं, अग्नि के स्पर्श से लकड़ी का अस्तित्व मिटकर स्वयं अग्निमय हो जाता है, और ज्योति के संग से अंधकार समाप्त हो जाता है।\n\nउसी प्रकार, एक ज्ञानी के सान्निध्य में रहने से अज्ञानी व्यक्ति का अज्ञान नष्ट हो जाता है और वह स्वयं ज्ञानस्वरूप बन जाता है।\n\nचन्नमल्लिकार्जुन के रूप में संबोधित निराकार परमतत्त्व के प्रति यह वचन स्पष्ट करता है कि जागृत चेतना और आध्यात्मिक ज्ञान के जीवंत स्वरूप 'जंगमलिंग' के संग में रहने से साधक के जन्म-मरण (भव) के सारे बंधन सदा के लिए मिट जाते हैं।","mr":"हे वचन स्पष्ट करते की, सत्य आणि चैतन्याच्या संपर्कात आल्याने मूळचे जड व मर्यादित अस्तित्व कसे पूर्णपणे बदलून जाते.\n\nज्याप्रमाणे गंगेच्या प्रवाहाशी संगत केल्याने घाट आणि पर्वत झिजून जातात, अग्नीच्या संपर्काने लाकूड भस्म होते आणि प्रकाशाच्या सान्निध्यात अंधार नाहीसा होतो, त्याचप्रमाणे ज्ञानी व्यक्तीच्या सहवासात अज्ञानाचा नाश होतो.\n\nया वचनाचे आध्यात्मिक महत्त्व असे आहे की, वरवर पाहता हा विनाश वाटत असला, तरी प्रत्यक्षात तो अज्ञान आणि जडत्वाचा अंत असून उच्च पातळीवरील रूपांतरण आहे.\n\nचन्नमल्लिकार्जुन या परमतत्त्वाच्या अनुभूतीमध्ये, जंगमरूपी जागृत आणि गतिशील चैतन्यतत्त्वाच्या सहवासाने साधकाचे जन्म-मरणरूपी सर्व भवबंधने कायमची नष्ट होतात, हाच या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le pouvoir de transformation radicale qu’exerce le contact avec la sagesse spirituelle, illustré par une série de métaphores naturelles saisissantes.\n\nTout comme les montagnes s’érodent au passage impétueux du fleuve, le bois se consume dans le feu et l’obscurité se dissipe devant la lumière, l’ignorance s’anéantit entièrement en présence d’un être éveillé.\n\nLe texte qualifie paradoxalement cette dissolution de « ruine », soulignant ainsi que la perte de sa forme première au contact d’une force supérieure est en réalité une transmutation libératrice.\n\nEn s’adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce poème montre que la communion avec le Jangamalinga, c’est-à-dire le guide spirituel incarnant la conscience dynamique, détruit définitivement le cycle des existences mondaines.","te":"ఈ వచనం సత్యస్వరూపులైన జ్ఞానుల సాంగత్యం వల్ల కలిగే ఆధ్యాత్మిక పరివర్తనను ప్రకృతిలోని చక్కని ఉపమానాలతో వివరిస్తోంది.\n\nవేగంగా ప్రవహించే గంగానది తాకిడికి కొండలు, గట్లు కరిగిపోయినట్లు, అగ్నితో కలిసిన కట్టెలు కాలి బూడిదైనట్లు, జ్యోతి ముందు చీకటి పటాపంచలైనట్లు, జ్ఞాని సాంగత్యంతో అజ్ఞానిలోని అజ్ఞానం పూర్తిగా నశించిపోతుంది.\n\nఇక్కడ 'చెడిపోవడం' (కెట్ట కేడు) అనే మాటను నష్టపోవడం అనే అర్థంలో కాకుండా, తన పాత జడ స్వభావాన్ని కోల్పోయి ఉన్నతమైన స్థితిలో లీనమవడం అనే తాత్విక అర్థంలో ప్రయోగించారు.\n\nనిరాకార పరమచైతన్యానికి ప్రతీక అయిన చెన్నమల్లికార్జునా అని సంబోధిస్తూ, చైతన్యస్వరూపులైన జంగమలింగ సాంగత్యం వల్ల తన జన్మజన్మల భవబంధాలన్నీ సమూలంగా నశించిపోయాయని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿಜವಾದ ಅರಿವು ಮತ್ತು ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರ ಒಡನಾಟದಿಂದ ಮನುಷ್ಯನ ಅಜ್ಞಾನ ಹಾಗೂ ಲೌಕಿಕ ಬಂಧನಗಳು ಹೇಗೆ ಸಂಪೂರ್ಣವಾಗಿ ಅಳಿದುಹೋಗುತ್ತವೆ ಎಂಬುದನ್ನು ಇಲ್ಲಿ ತುಂಬಾ ಮಾರ್ಮಿಕವಾಗಿ ವಿವರಿಸಲಾಗಿದೆ.\n\nಗಂಗೆಯ ಪ್ರವಾಹಕ್ಕೆ ಸಿಕ್ಕ ಬೆಟ್ಟ-ಗುಡ್ಡಗಳು ಕರಗಿಹೋಗುವಂತೆ, ಬೆಂಕಿಯ ಸಂಪರ್ಕಕ್ಕೆ ಬಂದ ಕಟ್ಟಿಗೆಯು ಸುಟ್ಟು ಬೂದಿಯಾಗುವಂತೆ ಮತ್ತು ಬೆಳಕಿನ ಮುಂದೆ ಕತ್ತಲೆಯು ಇಲ್ಲವಾಗುವಂತೆ, ಜ್ಞಾನಿಯ ಒಡನಾಟಕ್ಕೆ ಬಂದ ಅಜ್ಞಾನಿಯ ಅಜ್ಞಾನವು ನಾಶವಾಗುತ್ತದೆ. ಇಲ್ಲಿ 'ಕೆಟ್ಟ ಕೇಡು' ಎಂದರೆ ನಾಶವಾಗುವುದು ಎಂದರ್ಥವೇ ಹೊರತು ಕೆಟ್ಟದ್ದಾಗುವುದು ಎಂದಲ್ಲ; ಅಂದರೆ ಕಟ್ಟಿಗೆಯು ಬೆಂಕಿಯಾದಂತೆ ಅಜ್ಞಾನಿಯು ತನ್ನ ಹಿಂದಿನ ಅಜ್ಞಾನದ ಸ್ಥಿತಿಯನ್ನು ಕಳೆದುಕೊಂಡು ಜ್ಞಾನಿಯೇ ಆಗಿಬಿಡುತ್ತಾನೆ ಎಂಬುದನ್ನು ಈ ರೂಪಕಗಳು ಸ್ಪಷ್ಟಪಡಿಸುತ್ತವೆ.\n\nಇದೇ ರೀತಿ, ನಿರಾಕಾರ ಪರಮತತ್ತ್ವವಾದ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನ ಚಲನಶೀಲ ಅರಿವಿನ ಸ್ವರೂಪರಾದ ಜಂಗಮಲಿಂಗದ, ಅಂದರೆ ಅರಿವನ್ನು ಮೈಗೂಡಿಸಿಕೊಂಡ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರ ಒಡನಾಟದಿಂದ ತನಗಿದ್ದ ಹುಟ್ಟು-ಸಾವುಗಳೆಂಬ ಭವಬಂಧನಗಳೆಲ್ಲವೂ ಸಂಪೂರ್ಣವಾಗಿ ಅಳಿದುಹೋದವು ಎಂಬ ಆಳವಾದ ಅನುಭಾವವನ್ನು ಈ ವಚನವು ತಿಳಿಸುತ್ತದೆ."}},{"no":1176,"o":"ಗಗನದ ಗುಂಪ ಚಂದ್ರಮ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ಹದ್ದು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ನದಿಯ ಗುಂಪ ತಾವರೆ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದ ಹೊನ್ನಾವರಿಕೆ ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಪುಷ್ಪದ ಪರಿಮಳವ ತುಂಬಿ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ನೊರಜು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಯ್ಯಾ, ನಿಮ್ಮ ಶರಣರ ನಿಲವ ನೀವೆ ಬಲ್ಲಿರಲ್ಲದೆ\n ಈ ಕೋಣನ ಮೈಮೇಲಣ ಸೊಳ್ಳೆಗಳೆತ್ತ ಬಲ್ಲವಯ್ಯಾ?","t":{"en":"Only the moon knows the depth of the sky;\nhow could the vulture hovering on the fringes know it, O Lord?\nOnly the lotus knows the depth of the river;\nhow could the golden-cassia growing on the bank know it, O Lord?\nOnly the bee knows the fragrance of the flower;\nhow could the gnat flitting around its edge know it, O Lord?\nO Lord Chennamallikarjuna, only you know the stature of your *Sharanas*;\nhow could these mosquitoes upon the body of a buffalo ever know it, O Lord?","hi":"गगन की गहराई चंद्रमा ही जानता है,\nकिंतु किनारे पर मँडरानेवाली चील क्या जाने, हे स्वामी?\nनदी की गहराई कमल ही जानता है,\nकिंतु किनारे पर उगनेवाली जंगली घास क्या जाने, हे स्वामी?\nपुष्प की सुगंध भँवरा ही जानता है,\nकिंतु बाहर भिनभिनानेवाला भुनगा क्या जाने, हे स्वामी?\nहे चेन्नमल्लिकार्जुन स्वामी, आपके शरणों की स्थिति आप ही जानते हैं,\nभैंसे के शरीर पर बैठे ये मच्छर भला कहाँ जान सकते हैं, हे स्वामी?","mr":"गगनाची खोली चंद्रच जाणतो,\nकडेला भटकणारी घार जाणेल का, हे स्वामी?\nनदीची खोली कमळच जाणते,\nकाठावर उगवलेले तरवडाचे झुडूप जाणेल का, हे स्वामी?\nपुष्पाचा परिमळ भ्रमरच जाणतो,\nआसपास भिरभिरणारे चिलट जाणेल का, हे स्वामी?\nहे प्रभो चेन्नमल्लिकार्जुना, तुमच्या शरणांची स्थिती तुम्हीच जाणता,\nया रेड्याच्या अंगावरील डास ती कोठून जाणतील, हे स्वामी?","fr":"Seule la lune connaît la profondeur du ciel ;\nle milan qui plane à la lisière pourrait-il la connaître, ô Seigneur ?\nSeul le lotus connaît la profondeur du fleuve ;\nl'herbe sauvage qui croît sur la rive pourrait-elle la connaître, ô Seigneur ?\nSeul le bourdon connaît le parfum de la fleur ;\nle moucheron qui rôde tout autour pourrait-il le connaître, ô Seigneur ?\nÔ Seigneur Chennamallikarjuna, vous seul connaissez la haute stature de vos *Sharanas* ;\ncomment ces moustiques sur le dos d'un buffle pourraient-ils donc la connaître, ô Seigneur ?","te":"గగనపు లోతును చంద్రుడు ఎరుగునే గాని,\nఅంచున ఉండి తిరుగాడే గ్రద్ద ఎరుగునా ఓ ప్రభూ?\nనది లోతును తామర ఎరుగునే గాని,\nఒడ్డున ఉండే తంగేడు మొక్క ఎరుగునా ఓ ప్రభూ?\nపుష్పపు పరిమళాన్ని తుమ్మెద ఎరుగునే గాని,\nబయట ఉండి తిరుగాడే నల్లదోమ ఎరుగునా ఓ ప్రభూ?\nఓ చెన్నమల్లికార్జున ప్రభూ, మీ శరణుల నిలుకడను మీరే ఎరుగుదురు గాని\nఈ దున్నపోతు శరీరం మీది దోమలు ఎలా ఎరుగును ఓ ప్రభూ?","kn":"ಗಗನದ ಗುಂಪ ಚಂದ್ರಮ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ಹದ್ದು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ನದಿಯ ಗುಂಪ ತಾವರೆ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದ ಹೊನ್ನಾವರಿಕೆ ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಪುಷ್ಪದ ಪರಿಮಳವ ತುಂಬಿ ಬಲ್ಲುದಲ್ಲದೆ,\n ಕಡೆಯಲಿದ್ದಾಡುವ ನೊರಜು ಬಲ್ಲುದೆ ಅಯ್ಯಾ?\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಯ್ಯಾ, ನಿಮ್ಮ ಶರಣರ ನಿಲವ ನೀವೆ ಬಲ್ಲಿರಲ್ಲದೆ\n ಈ ಕೋಣನ ಮೈಮೇಲಣ ಸೊಳ್ಳೆಗಳೆತ್ತ ಬಲ್ಲವಯ್ಯಾ?"},"m":{"en":"This Vachana explains that the profound inner stature of true Sharanas can only be recognized by those who possess deep spiritual intimacy and elevated consciousness, rather than by those who remain on the periphery of existence.\n\nThrough vivid contrasts from nature, the Vachana illustrates that just as only the moon truly experiences the vastness of the sky rather than a vulture hovering at its edge, only the lotus knows the depth of the river rather than a weed growing on the bank, and only the bee savors the fragrance of a flower rather than a gnat buzzing nearby, superficial minds cannot grasp higher truths.\n\nAddressing the Formless Supreme Consciousness as Channamallikarjuna, the Vachana emphasizes that only the Absolute itself truly comprehends the exalted spiritual state of the Sharanas.\n\nIn contrast, ordinary people who remain immersed in gross, worldly attachments—likened to mosquitoes clinging to the body of a buffalo—are entirely incapable of recognizing or understanding the transcendent nature of the enlightened ones.","hi":"यह वचन स्पष्ट करता है कि उच्च आध्यात्मिक सत्य और शरणों की अंतःस्थिति को केवल वही समझ सकता है जो स्वयं उस गहराई से जुड़ा हो, न कि बाहरी और सतही दृष्टि रखने वाले लोग।\n\nजिस प्रकार आकाश की गहराई को चंद्रमा, नदी की थाह को कमल और फूल की सुगंध को भँवरा ही जान सकता है, किंतु किनारे पर मंडराने वाली चील, तट की घास या साधारण मक्खी उस मर्म को नहीं समझ सकती।\n\nउसी प्रकार, भैंसे के शरीर पर भिनभिनाने वाले मच्छरों के समान तुच्छ और सांसारिक वृत्तियों में उलझे हुए अज्ञानी लोग शरणों की आध्यात्मिक ऊँचाई को जानने में सर्वथा असमर्थ हैं।\n\nइस वचन का मूल भाव यह है कि सच्चे शरणों की आंतरिक अवस्था और उनके आध्यात्मिक गौरव को केवल चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व ही पूर्ण रूप से जान सकता है।","mr":"हे वचन स्पष्ट करते की, उच्च आध्यात्मिक सत्य आणि अंतर्मुख अनुभवाची खोली समजण्यासाठी तशीच उच्च पातळीची पात्रता व सूक्ष्म जाणीव असणे आवश्यक असते.\n\nज्याप्रमाणे आकाशाचा अथांग विस्तार चंद्रालाच ठाऊक असतो पण खाली भटकणाऱ्या गिधाडाला नाही, नदीची खोली कमळाला कळते पण काठावरच्या तणाला नाही, आणि फुलाचा सुगंध भ्रमरालाच समजतो पण आजूबाजूच्या चिलटांना नाही, त्याप्रमाणे बाह्य व उथळ वृत्तीच्या लोकांना आध्यात्मिक गाभ्याचे आकलन होऊ शकत नाही.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाशी एकरूप झालेल्या आणि त्याच्याशी थेट आंतरिक नाते जोडलेल्या शरणांनाच परमतत्त्व खऱ्या अर्थाने जाणू शकते.\n\nसंसारातील अज्ञानात आणि अत्यंत खालच्या पातळीवरच्या विकारांत गुरफटलेल्या संकुचित वृत्तीच्या माणसांना शरणांच्या या उदात्त आध्यात्मिक स्थितीची ओळख कधीच पटू शकत नाही, हा या वचनाचा मुख्य आशय आहे.","fr":"Ce vachana met en lumière le fait que l'état spirituel élevé et la profondeur intérieure des Sharanas ne peuvent être compris par les esprits superficiels ou attachés aux basses préoccupations du monde.\n\nÀ travers une série d'images poétiques issues de la nature, le texte montre que seule la lune connaît l'immensité du ciel, non le vautour qui plane à la lisière ; seul le lotus connaît la profondeur du fleuve, non la mauvaise herbe poussant sur la rive ; et seul le bourdon apprécie le parfum de la fleur, non le moucheron qui vole aux alentours.\n\nCes contrastes illustrent qu'il faut partager l'essence et l'élévation d'une réalité pour en saisir véritablement la profondeur et la valeur.\n\nAinsi, en s'adressant à la Réalité suprême sans forme sous le nom de Channamallikarjuna, ce vachana affirme que seule la Conscience pure connaît véritablement la stature spirituelle des Sharanas, tandis que les êtres absorbés par la grossièreté matérielle, comparés aux moustiques posés sur le dos d'un buffle, demeurent incapables de la percevoir.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, ఒక ఉన్నతమైన తత్త్వం యొక్క లోతును దానికి సన్నిహితమైన, సమర్థమైన చైతన్యమే గుర్తించగలదు కానీ, కేవలం ఉపరితలంపై సంచరించే అల్పబుద్ధి దాన్ని గ్రహించలేదు.\n\nఆకాశపు అగాధాన్ని అందులో విహరించే చంద్రుడు మాత్రమే ఎరుగును గానీ అంచులలో ఎగిరే గద్ద తెలుసుకోలేనట్లు, నది లోతును తామరపువ్వు మాత్రమే ఎరుగును గానీ ఒడ్డున ఉండే తంగేడు మొక్క గ్రహించలేనట్లు, పువ్వులోని సుবাসను తుమ్మెద మాత్రమే ఆస్వాదించగలదు గానీ దాని చుట్టూ తిరిగే దోమ తెలుసుకోలేదు.\n\nఅదేవిధంగా, చెన్నమల్లికార్జున అని సంబోధించబడే నిరాకార పరమతత్త్వానికి మాత్రమే శరణుల ఆధ్యాత్మిక ఔన్నత్యం మరియు వారి అంతరంగ స్థితి పూర్తిగా తెలుస్తాయి.\n\nదున్నపోతు శరీరంపై వాలే దోమల వంటి లౌకిక, అజ్ఞాన స్వభావం కలిగిన సామాన్య జనులు ఆ శరణుల పారమార్థిక స్థితిని ఎన్నటికీ అర్థం చేసుకోలేరని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿಜವಾದ ಶರಣರ ಆಧ್ಯಾತ್ಮಿಕ ಎತ್ತರ ಮತ್ತು ಅವರ ಅರಿವಿನ ಆಳವನ್ನು ಆ ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ತತ್ತ್ವವೊಂದೇ ಅರಿಯಬಲ್ಲದು ಹೊರತು, ಸಾಮಾನ್ಯ ಪ್ರಾಪಂಚಿಕ ಮನಸ್ಸುಗಳಿಗೆ ಅದು ಅರ್ಥವಾಗುವುದಿಲ್ಲ.\n\nಆಕಾಶದ ವೈಶಾಲ್ಯ ಮತ್ತು ಗಾಂಭೀರ್ಯವನ್ನು ಚಂದ್ರ ಮಾತ್ರ ಬಲ್ಲನೇ ಹೊರತು ಕೆಳಮಟ್ಟದಲ್ಲಿ ಹಾರಾಡುವ ಹದ್ದಿಗೆ ಅದು ತಿಳಿಯುವುದಿಲ್ಲ; ಹಾಗೆಯೇ ನದಿಯ ಆಳವನ್ನು ಅದರ ಒಳಗಿರುವ ತಾವರೆ ಬಲ್ಲದೇ ಹೊರತು ದಡದಲ್ಲಿ ಬೆಳೆದ ಹೊನ್ನಾವರಿಕೆ ಗಿಡಕ್ಕೆ ಅದರ ಅರಿವು ಇರುವುದಿಲ್ಲ.\n\nಹೂವಿನ ನಿಜವಾದ ಪರಿಮಳದ ಸವಿಯನ್ನು ದುಂಬಿ ಮಾತ್ರ ಸವಿಯಬಲ್ಲದೇ ಹೊರತು, ಸುತ್ತಲೂ ಸುಮ್ಮನೆ ಹಾರಾಡುವ ಸಣ್ಣ ನೊರಜು ಹುಳುವಿಗೆ ಆ ಸುಗಂಧದ ಬೆಲೆ ಗೊತ್ತಾಗುವುದಿಲ್ಲ ಎಂಬ ಹೋಲಿಕೆಗಳ ಮೂಲಕ, ಒಂದು ತತ್ತ್ವದ ಆಳವನ್ನು ತಿಳಿಯಲು ಅದರೊಂದಿಗೆ ಒಂದಾಗುವ ಯೋಗ್ಯತೆ ಇರಬೇಕು ಎಂಬುದನ್ನು ಇಲ್ಲಿ ಸ್ಪಷ್ಟಪಡಿಸಲಾಗಿದೆ.\n\nಕೋಣನ ಮೈಮೇಲೆ ಕುಳಿತು ಕೇವಲ ಹೊಟ್ಟೆಪಾಡಿಗಾಗಿ ರಕ್ತ ಹೀರುವ ಸೊಳ್ಳೆಗಳಂತೆ ಪ್ರಾಪಂಚಿಕ ಭೋಗ ಮತ್ತು ಅಜ್ಞಾನದಲ್ಲಿ ಮುಳುಗಿರುವ ಸಾಮಾನ್ಯ ಜನರಿಗೆ, ಪರಮಚೈತನ್ಯದಲ್ಲೇ ನೆಲೆನಿಂತ ಶರಣರ ಉನ್ನತ ಅನುಭಾವದ ಸ್ಥಿತಿಯನ್ನು ಅಳೆಯಲು ಅಥವಾ ಅರ್ಥಮಾಡಿಕೊಳ್ಳಲು ಎಂದಿಗೂ ಸಾಧ್ಯವಿಲ್ಲ ಎಂಬುದು ಈ ವಚನದ ಆಳವಾದ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1177,"o":"ಗಿರಿಯಲಲ್ಲದೆ ಹುಲ್ಲುಮೊರಡಿಯಲ್ಲಾಡುವುದೆ ನವಿಲು?\n ಕೊಳಕ್ಕಲ್ಲದೆ ಕಿರುವಳ್ಳಕ್ಕೆಳಸುವುದೆ ಹಂಸೆ?\n ಮಾಮರ ತಳಿತಲ್ಲದೆ ಸರಗೈವುದೆ ಕೋಗಿಲೆ?\n ಪರಿಮಳವಿಲ್ಲದ ಪುಷ್ಪಕ್ಕೆಳಸುವುದೆ ಭ್ರಮರ?\n ಎನ್ನ ದೇವ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಂಗಲ್ಲದೆ\n ಅನ್ಯಕ್ಕೆಳಸುವುದೆ ಎನ್ನ ಮನ?\n ಪೇಳಿರೆ, ಕೆಳದಿಯರಿರಾ!","t":{"en":"Would a peacock dance on a grassy mound rather than on a mountain?\nWould a swan yearn for a shallow brook rather than for a lake?\nWould a cuckoo sing unless the mango tree has sprouted fresh leaves?\nWould a bee yearn for a flower without fragrance?\nWould my mind yearn for any other\nthan my Lord Chennamallikarjuna?\nTell me, O my companions!","hi":"पर्वत के बिना, क्या घास के टीले पर नाचता है मोर?\nसरोवर के बिना, क्या छोटे नाले की कामना करता है हंस?\nआम के वृक्ष में कोंपलें फूटे बिना, क्या स्वर छेड़ती है कोयल?\nसुगंधहीन पुष्प की क्या कामना करता है भँवरा?\nमेरे देव चेन्नमल्लिकार्जुन के बिना,\nक्या किसी अन्य की कामना करेगा मेरा मन?\nबताओ री, सखियो!","mr":"गिरीवर सोडून गवताच्या टेकाडावर नाचेल का मोर?\nसरोवर सोडून लहानशा ओढ्याची ओढ धरील का हंस?\nआंब्याचे झाड बहरल्याशिवाय स्वर काढील का कोकीळ?\nसुगंध नसलेल्या फुलाकडे ओढ घेईल का भ्रमर?\nमाझा देव चेन्नमल्लिकार्जुनाशिवाय\nअन्याची ओढ धरील का माझे मन?\nसांगा ना, हे सख्यांनो!","fr":"Sinon sur la montagne, le paon danserait-il sur un tertre herbeux ?\nSinon vers l'étang, le cygne aspirerait-il à un mince ruisseau ?\nSans que le manguier ne bourgeonne, le coucou élèverait-il la voix ?\nL'abeille désirerait-elle une fleur sans parfum ?\nSinon vers mon Seigneur Chennamallikarjuna,\nmon esprit aspirerait-il à un autre ?\nDites-le-moi, ô mes compagnes !","te":"కొండపైన కాక గడ్డితిప్పపై నెమలి ఆడుతుందా?\nకొలనుకు కాక చిరువాగుకు హంస ఆశపడుతుందా?\nమామిడిచెట్టు చిగురిస్తే కాక కోయిల స్వరమెత్తుతుందా?\nపరిమళం లేని పువ్వుకు తుమ్మెద ఆశపడుతుందా?\nనా దేవుడైన చెన్నమల్లికార్జునునికే కాక\nఅన్యానికి నా మనసు ఆశపడుతుందా?\nచెప్పండి, ఓ చెలికత్తెలారా!","kn":"ಗಿರಿಯಲಲ್ಲದೆ ಹುಲ್ಲುಮೊರಡಿಯಲ್ಲಾಡುವುದೆ ನವಿಲು?\n ಕೊಳಕ್ಕಲ್ಲದೆ ಕಿರುವಳ್ಳಕ್ಕೆಳಸುವುದೆ ಹಂಸೆ?\n ಮಾಮರ ತಳಿತಲ್ಲದೆ ಸರಗೈವುದೆ ಕೋಗಿಲೆ?\n ಪರಿಮಳವಿಲ್ಲದ ಪುಷ್ಪಕ್ಕೆಳಸುವುದೆ ಭ್ರಮರ?\n ಎನ್ನ ದೇವ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಂಗಲ್ಲದೆ\n ಅನ್ಯಕ್ಕೆಳಸುವುದೆ ಎನ್ನ ಮನ?\n ಪೇಳಿರೆ, ಕೆಳದಿಯರಿರಾ!"},"m":{"en":"This Vachana uses four vivid images from nature to illustrate the unwavering focus of a seeker’s consciousness on the Supreme Reality.\n\nJust as a peacock naturally dances on a lofty mountain rather than a grassy mound, a swan seeks a clear lake over a shallow stream, a cuckoo sings only when the mango tree blossoms, and a bee is drawn only to a fragrant flower, true spiritual awareness cannot settle for anything inferior or transient.\n\nThrough these comparisons, the Vachana highlights that a mind awakened to the highest truth possesses an innate discernment that rejects worldly distractions and lesser pursuits.\n\nAddressing her companions, the Vachanakara affirms that her consciousness is exclusively drawn to the Formless Supreme Consciousness, Channamallikarjuna, incapable of desiring anything other than the Absolute.","hi":"इस वचन का केंद्रीय भाव यह है कि जिस प्रकार प्रकृति का प्रत्येक जीव केवल अपने श्रेष्ठ और स्वाभाविक आधार की ओर ही आकर्षित होता है, उसी प्रकार एक सच्चे साधक का मन भी केवल परमतत्त्व में ही रमता है।\n\nवचन में यह स्पष्ट किया गया है कि जैसे मोर ऊँचे पर्वत को छोड़कर छोटी घास की टेकरी पर नहीं नाचता, हंस सरोवर को छोड़कर छोटे नाले की कामना नहीं करता, कोयल आम के वृक्ष में कोंपलें फूटे बिना मधुर गान नहीं करती और भँवरा सुगंधहीन फूल के पास नहीं जाता।\n\nइन प्राकृतिक रूपकों के माध्यम से यह आध्यात्मिक सत्य प्रकट होता है कि चेतना सदैव क्षुद्र या सारहीन वस्तुओं को नकार कर सर्वोच्च सत्य की ओर ही उन्मुख होती है।\n\nइसी प्रकार, साधक का मन चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व को छोड़कर किसी अन्य सांसारिक विषय या नश्वर आकर्षण की ओर कदापि झुक नहीं सकता।","mr":"या वचनाचा मुख्य आशय असा आहे की, सत्याची जाणीव झालेले मन क्षुद्र आणि नश्वर सांसारिक आकर्षणांच्या मागे कधीही धावत नाही, तर ते केवळ सर्वोच्च परमतत्त्वातच रममाण होते.\n\nमोर जसा गवताच्या छोट्या टेकाडावर न नाचता उंच डोंगरावरच विहार करतो, हंस लहान ओढ्याकडे न वळता मोठ्या सरोवराचीच ओढ धरतो, कोकिळा आम्रवृक्षाला पालवी फुटल्याशिवाय गात नाही आणि भुंगा सुगंधाशिवाय असलेल्या फुलाकडे आकर्षित होत नाही, या निसर्गातील दृष्टांतांमधून हेच श्रेष्ठतेचे तत्त्व स्पष्ट केले आहे.\n\nत्याचप्रमाणे, साक्षात्कारी जीव आपल्या सख्यांना उद्देशून अत्यंत ठामपणे सांगतो की, त्याचे मन 'चन्नमल्लिकार्जुन' या निराकार परम चैतन्याशिवाय इतर कोणत्याही दुय्यम किंवा लौकिक गोष्टीची अभिलाषा बाळगूच शकत नाही.\n\nपरम सत्याची एकदा ओळख पटली की साधकाची वृत्ती केवळ त्या अनंत आणि शुद्ध चैतन्याशीच एकनिष्ठ राहते, हे या वचनाचे आध्यात्मिक महत्त्व आहे.","fr":"Ce vachana illustre la fidélité spirituelle absolue d'une conscience entièrement tournée vers la Réalité suprême sans forme, invoquée ici sous la signature de Channamallikarjuna.\n\nÀ travers d'élégantes métaphores tirées de la nature, le texte rappelle que chaque être aspire naturellement à ce qu'il y a de plus noble : le paon danse sur les hautes montagnes et non sur les buttes stériles, le cygne recherche les lacs limpides plutôt que les petits ruisseaux, le coucou ne chante que lorsque le manguier bourgeonne, et l'abeille délaisse les fleurs sans parfum.\n\nDe la même manière, un esprit éveillé à la Vérité absolue ne saurait se tourner vers des attraits secondaires ou superficiels.\n\nEn interpellant ses compagnes, la voix poétique affirme avec conviction que son cœur, ayant reconnu l'excellence du Principe suprême, ne peut plus désirer autre chose.","te":"ఈ వచనం వివరిస్తున్న అంతరార్థం ఏమిటంటే, సహజంగానే ఉన్నతమైన వాటి పట్ల ఆకర్షితమయ్యే ప్రకృతి జీవుల వలె, పరిపక్వత చెందిన సాధకుని మనస్సు కూడా కేవలం పరమసత్యం వైపు మాత్రమే మళ్లుతుంది.\n\nనెమలి ఎత్తైన కొండలపైనే తప్ప గడ్డితో నిండిన చిన్న గుట్టలపై నాట్యం చేయకపోవడం, హంస నిర్మలమైన సరస్సునే గాని చిన్ని నీటి కాలువను కోరుకోకపోవడం, మామిడి చెట్టు చిగురిస్తేనే కోకిల పాడటం, తుమ్మెద సువాసన లేని పువ్వును ఆశించకపోవడం వంటి సహజమైన దృష్టాంతాలను ఇక్కడ ప్రస్తావించారు.\n\nఈ ప్రకృతి దృశ్యాలన్నింటినీ ప్రతీకలుగా తీసుకుంటూ, శ్రేష్ఠమైన వాటిని విడిచి అల్పమైన వాటిని ఏ ప్రాణీ కోరుకోదనే సత్యాన్ని ఈ వచనం స్పష్టం చేస్తోంది.\n\nఅదే విధంగా, చెన్నమల్లికార్జున అనే అంకితనామంతో సంబోధించబడిన ఆ నిరాకార పరమచైతన్యానికి తప్ప, తన మనస్సు అల్పమైన అన్య విషయాలకు ఆకర్షితమవడం సాధ్యం కాదని చెలికత్తెలను ప్రశ్నించే రూపంలో ఈ వచనం ఆధ్యాత్మిక ఏకాగ్రతను వ్యక్తపరుస్తోంది.","kn":"ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯ ಏನೆಂದರೆ, ನಿಜವಾದ ಅರಿವು ಮತ್ತು ಉನ್ನತ ಆಧ್ಯಾತ್ಮಿಕ ಎತ್ತರವನ್ನು ಕಂಡುಕೊಂಡ ಮನಸ್ಸು ಎಂದಿಗೂ ಕ್ಷುಲ್ಲಕವಾದ ಲೌಕಿಕ ಆಕರ್ಷಣೆಗಳಿಗೆ ಸೋಲುವುದಿಲ್ಲ.\n\nನವಿಲು ಎತ್ತರದ ಬೆಟ್ಟವನ್ನು ಬಿಟ್ಟು ಸಣ್ಣ ಹುಲ್ಲುಗಾವಲಿನಲ್ಲಿ ಕುಣಿಯದಿರುವಂತೆ, ಹಂಸವು ದೊಡ್ಡ ಸರೋವರವನ್ನಲ್ಲದೆ ಸಣ್ಣ ಹಳ್ಳವನ್ನು ಬಯಸದಿರುವಂತೆ, ಕೋಗಿಲೆಯು ಮಾವಿನ ಮರ ಚಿಗುರಿದಾಗ ಮಾತ್ರ ಹಾಡುವಂತೆ ಮತ್ತು ದುಂಬಿಯು ಸುವಾಸನೆಯಿಲ್ಲದ ಹೂವಿನ ಹತ್ತಿರ ಸುಳಿಯದಿರುವಂತೆ, ಶರಣರ ಮನಸ್ಸು ಕೂಡ ಉನ್ನತವಾದ ಸತ್ಯಕ್ಕೆ ಮಾತ್ರ ಹಂಬಲಿಸುತ್ತದೆ.\n\nಇಲ್ಲಿ ತನ್ನ ಸಖಿಯರನ್ನು ಕುರಿತು ಕೇಳುವ ಮೂಲಕ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯವನ್ನಲ್ಲದೆ ತನ್ನ ಮನಸ್ಸು ಬೇರೆ ಯಾವ ಸಾಮಾನ್ಯ ಅಥವಾ ನಶ್ವರವಾದ ಸಂಗತಿಗಳ ಕಡೆಗೂ ವಾಲಲು ಸಾಧ್ಯವೇ ಇಲ್ಲ ಎಂಬ ದೃಢವಾದ ನಿಲುವನ್ನು ವ್ಯಕ್ತಪಡಿಸಲಾಗಿದೆ.\n\nಒಮ್ಮೆ ಪರಮಚೈತನ್ಯದ ಅರಿವಿನ ಸವಿಯನ್ನು ಕಂಡ ಜೀವವು, ಅಂತಹ ಶ್ರೇಷ್ಠತೆಯನ್ನಲ್ಲದೆ ಬೇರೆ ಯಾವ ಕೀಳುಮಟ್ಟದ ಆಸೆಗಳಿಗೂ ಒಪ್ಪಿಕೊಳ್ಳುವುದಿಲ್ಲ ಎಂಬ ಏಕನಿಷ್ಠೆಯ ತಾತ್ವಿಕ ಸತ್ಯವನ್ನು ಈ ವಚನವು ಬಹಳ ಸಹಜವಾಗಿ ತಿಳಿಸುತ್ತದೆ."}},{"no":1178,"o":"ಗುರುಪಾದತೀರ್ಥವೆ ಮಂಗಳ ಮಜ್ಜನವೆನಗೆ.\n ವಿಭೂತಿಯೆ ಒಳಗುಂದದರಿಷಿಣವೆನಗೆ.\n ದಿಗಂಬರವೆ ದಿವ್ಯಾಂಬರವೆನಗೆ.\n ಶಿವಭಕ್ತರ ಪಾದರೇಣುವೆ ಅನುಲೇಪನವೆನಗೆ.\n ರುದ್ರಾಕ್ಷಿಯೆ ಮೈದೊಡಿಗೆಯೆನಗೆ.\n ಶರಣರ ಪಾದರಕ್ಷೆಯೆ ಶಿರದಲ್ಲಿ ತೊಂಡಿಲು ಬಾಸಿಗವೆನಗೆ.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನ ಮದವಳಿಗೆಗೆ\n ಬೇರೆ ಶೃಂಗಾರವೇಕೆ ಹೇಳಿರೆ ಅವ್ವಗಳಿರಾ!","t":{"en":"The holy water from the Guru's feet alone is the auspicious bath for me.\nSacred ash alone is the unfading turmeric for me.\nSky-clad nakedness alone is the divine garment for me.\nThe dust from the feet of Shiva's devotees alone is the fragrant ointment for me.\nThe *Rudraksha* alone is the bodily ornament for me.\nThe sandals of the *Sharanas* alone are the bridal chaplet and coronet upon my head for me.\nFor the bride of Chennamallikarjuna,\nwhat need is there for any other adornment? Tell me, O mothers!","hi":"गुरुपादतीर्थ ही मेरे लिए मंगल स्नान है।\nविभूति ही मेरे लिए ओलगुंद की हल्दी है।\nदिगंबर ही मेरे लिए दिव्यांबर है।\nशिवभक्तों की चरण-धूलि ही मेरे लिए अनुलेपन है।\nरुद्राक्ष ही मेरे लिए देह का आभूषण है।\nशरणों की पादुकाएँ ही मेरे सिर पर बासिंग और मुकुट हैं।\nचेन्नमल्लिकार्जुन की दुल्हन को\nअन्य शृंगार क्यों, बताओ हे सखियो!","mr":"गुरुपादतीर्थ हेच माझ्यासाठी मंगल स्नान आहे.\nविभूती हीच माझ्यासाठी अस्सल हळद आहे.\nदिगंबर हेच माझ्यासाठी दिव्यांबर आहे.\nशिवभक्तांची चरणधूळ हेच माझ्यासाठी अनुलेपन आहे.\nरुद्राक्ष हेच माझ्या अंगावरील दागिने आहेत.\nशरणांच्या पादुका हेच माझ्या मस्तकावरील मुकुट आणि बाशिंग आहे.\nचेन्नमल्लिकार्जुनाच्या या नवरीला\nदुसरा शृंगार कशासाठी, सांगा ग बायांनो!","fr":"L'eau consacrée des pieds du Gourou est pour moi le bain de bon augure.\nLa cendre sacrée est pour moi le curcuma dont l'éclat ne pâlit jamais.\nAvoir l'espace pour vêtement est pour moi le vêtement divin.\nLa poussière des pieds des dévots de Shiva est pour moi l'onguent parfumé.\nLe *Rudrakshi* est pour moi la parure du corps.\nLes sandales des *Sharanas* sont pour moi la couronne et le diadème nuptial sur ma tête.\nPour la mariée de Chennamallikarjuna,\npourquoi faudrait-il d'autres ornements, dites-moi, ô mères !","te":"గురుపాదతీర్థమే మంగళ స్నానం నాకు.\nవిభూతియే వన్నె తరగని పసుపు నాకు.\nదిగంబరమే దివ్యాంబరం నాకు.\nశివభక్తుల పాదధూళియే అనులేపనం నాకు.\nరుద్రాక్షయే మేని ఆభరణం నాకు.\nశరణుల పాదరక్షయే శిరస్సున వివాహ కిరీటం, బాసికం నాకు.\nచెన్నమల్లికార్జునుని పెళ్ళికూతురుకు\nవేరే శృంగారమెందుకు చెప్పండరమ్మా ఓ తల్లులారా!","kn":"ಗುರುಪಾದತೀರ್ಥವೆ ಮಂಗಳ ಮಜ್ಜನವೆನಗೆ.\n ವಿಭೂತಿಯೆ ಒಳಗುಂದದರಿಷಿಣವೆನಗೆ.\n ದಿಗಂಬರವೆ ದಿವ್ಯಾಂಬರವೆನಗೆ.\n ಶಿವಭಕ್ತರ ಪಾದರೇಣುವೆ ಅನುಲೇಪನವೆನಗೆ.\n ರುದ್ರಾಕ್ಷಿಯೆ ಮೈದೊಡಿಗೆಯೆನಗೆ.\n ಶರಣರ ಪಾದರಕ್ಷೆಯೆ ಶಿರದಲ್ಲಿ ತೊಂಡಿಲು ಬಾಸಿಗವೆನಗೆ.\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನ ಮದವಳಿಗೆಗೆ\n ಬೇರೆ ಶೃಂಗಾರವೇಕೆ ಹೇಳಿರೆ ಅವ್ವಗಳಿರಾ!"},"m":{"en":"This Vachana redefines conventional bridal adornment from the perspective of a seeker dedicated to union with the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nRather than relying on worldly ornaments and marriage rituals, the speaker embraces sacred spiritual practices as her true bridal preparation—treating the sanctified water from the Guru's feet as her auspicious bath, sacred ash (Vibhuti) as her turmeric, sky-clad nakedness (Digambara) as her divine garment, the dust from the feet of devotees as her cosmetic paste, Rudrakshi beads as her jewellery, and the footwear of the Sharanas as her bridal crown.\n\nThrough this powerful reversal of imagery, the Vachana highlights how complete humility before the Guru and the community of Sharanas replaces material vanity with authentic spiritual beauty.\n\nAddressing the women who ask her to dress like a conventional bride, the speaker asserts that one who seeks mystical union with the Absolute needs no external decoration beyond these sacred emblems of devotion and detachment.","hi":"यह वचन सांसारिक श्रृंगार और बाहरी वैभव को नकारते हुए आध्यात्मिक प्रतीकों को ही वास्तविक सौंदर्य और अलंकरण के रूप में प्रस्तुत करता है।\n\nयहाँ साधक के लिए गुरु का पादतीर्थ ही मंगल-स्नान है, विभूति ही कभी फीकी न पड़ने वाली हल्दी है, और दिगंबर अवस्था ही दिव्य वस्त्र है।\n\nशिवभक्तों के चरणों की धूल शरीर पर लगाया जाने वाला सुगंधित लेप है, रुद्राक्ष ही आभूषण हैं और शरणों की पादुकाएँ ही सिर पर धारण किया जाने वाला वैवाहिक मुकुट हैं।\n\nइस प्रकार, चन्नमल्लिकार्जुन रूपी निराकार परमतत्त्व से एकाकार होने वाली साधिका को किसी भी अन्य सांसारिक या भौतिक श्रृंगार की कोई आवश्यकता नहीं होती।","mr":"या वचनाचा मुख्य आशय असा आहे की, परमतत्त्वाशी एकरूप होऊ पाहणाऱ्या साधकासाठी बाह्य आणि नश्वर आभूषणांपेक्षा आध्यात्मिक मूल्ये हाच खरा शृंगार असतो.\n\nगुरूचे पादतीर्थ हेच मंगल स्नान, विभूती हीच कधीही न उजळणारी हळद, दिगंबरत्व हेच दिव्य वस्त्र आणि रुद्राक्ष हाच अंगावरील दागिना मानून येथे भौतिक अलंकारांचा त्याग मांडला आहे.\n\nतसेच, शिवभक्तांच्या चरणांची धूळ हेच सुगंधी उटणे आणि शरणांच्या पादत्राणांनाच मस्तकावरील बाशिंग मानून शरणांच्या प्रती असलेली सर्वोच्च निष्ठा व नम्रता व्यक्त केली आहे.\n\nचन्नमल्लिकार्जुन या निराकार परमतत्त्वाची वधू बनलेल्या जिवात्म्याला या अलौकिक आध्यात्मिक वैभवापुढे इतर कोणत्याही सांसारिक शृंगाराची गरज उरत नाही, हेच या वचनातून स्पष्ट होते.","fr":"Ce vachana met en lumière la transfiguration des rites nuptiaux traditionnels en une quête spirituelle absolue, où chaque parure mondaine est remplacée par un symbole de dévotion et de détachement.\n\nL'eau consacrée par les pieds du Guru devient le bain rituel de bon augure, la cendre sacrée remplace le curcuma, le dépouillement total fait office de vêtement divin et les graines de rudraksha tiennent lieu de joyaux.\n\nDe même, la poussière des pieds des dévots devient un onguent précieux, tandis que les sandales des Sharanas sont élevées au rang de couronne nuptiale portée avec humilité sur la tête.\n\nPour l'âme ainsi parée qui s'unit à la Réalité suprême sans forme, invoquée sous le nom de Channamallikarjuna, tout autre ornement extérieur ou artifice matériel perd entièrement sa raison d'être.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, నిరాకార పరమతత్త్వమైన చెన్నమల్లికార్జునతో ఆధ్యాత్మికంగా ఏకమయ్యే సాధకురాలికి లৌకికమైన పెళ్లి అలంకారాల కంటే ఆధ్యాత్మిక నిష్ఠలే అసలైన ఆభరణాలు.\n\nసాంప్రదాయిక వివాహంలో వధువుకు చేసే మంగళస్నానం, పసుపు, పట్టువస్త్రాలు, సుగంధ లేపనాలు, ఆభరణాలు మరియు బాసికాలకు బదులుగా; ఇక్కడ గురుపాదతీర్థమే మంగళస్నానంగా, విభూతియే వాడిపోని పసుపుగా, దిగంబరత్వమే దివ్యవస్త్రంగా, శివభక్తుల పాదধూళియే సుగంధ లేపనంగా, రుద్రాక్షలే ఆభరణాలుగా, శరణుల పాదరక్షలే శిరస్సున ధరించే బాసికంగా వర్ణించబడ్డాయి.\n\nబాహ్యమైన శారీరక శృంగారాన్ని పూర్తిగా నిరాకరించి, గురు-లింగ-జంగమ తత్త్వాల పట్ల ఉండే నిరహంకార భక్తిని, శరణాగతిని పరమ అలంకారంగా స్వీకరించడమే ఈ రూపకాలలోని ప్రధాన ఉద్దేశం.\n\nఅందువల్ల, నిర్గుణ పరమచైతన్యమైన చెన్నమల్లికార్జుననే తన వరునిగా భావించే పెళ్లికూతురుకు ఈ ఆధ్యాత్మిక చిహ్నాలు, శరణుల సేవ తప్ప వేరే బాహ్య శృంగారం అవసరం లేదని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ನೈಜ ಆಧ್ಯಾತ್ಮಿಕ ಸಾಧಕರ ಪಾಲಿಗೆ ಲೌಕಿಕ ಆಡಂಬರಗಳಿಗಿಂತ ಶರಣ ತತ್ತ್ವದ ಕುರುಹುಗಳು ಮತ್ತು ಭಕ್ತಿಭಾವವೇ ನಿಜವಾದ ಅಲಂಕಾರ ಎಂಬುದನ್ನು ಮದುವಣಗಿತ್ತಿಯ ರೂಪಕದ ಮೂಲಕ ವಿವರಿಸಲಾಗಿದೆ.\n\nಲೌಕಿಕ ಮದುವೆಯ ಹೆಣ್ಣಿಗೆ ಮಂಗಳಸ್ನಾನ, ಅರಿಶಿನ, ರೇಷ್ಮೆ ಸೀರೆ, ಸುಗಂಧದ ಲೇಪನ, ಆಭರಣಗಳು ಮತ್ತು ತಲೆಯ ಬಾಸಿಗಗಳು ಶೃಂಗಾರವಾದರೆ, ಅರಿವಿನ ಹಾದಿಯಲ್ಲಿರುವ ಸಾಧಕಿಗೆ ಗುರುವಿನ ಪಾದೋದಕವೇ ಮಂಗಳಸ್ನಾನ, ವಿಭೂತಿಯೇ ಕಾಂತಿ ಕುಂದದ ಅರಿಶಿನ ಮತ್ತು ದಿಗಂಬರ ಸ್ಥಿತಿಯೇ ಅಂದರೆ ಬಯಲನ್ನೇ ಹೊದ್ದುಕೊಂಡಿರುವ ನಿರ್ಮಲ ಭಾವವೇ ದಿವ್ಯವಾದ ಉಡುಗೆಯಾಗಿದೆ.\n\nಹಾಗೆಯೇ ಶಿವಭಕ್ತರ ಪಾದಧೂಳಿಯೇ ಮೈಗೆ ಹಚ್ಚುವ ಸುಗಂಧದ ಲೇಪನ, ರುದ್ರಾಕ್ಷಿಯೇ ಮೈಮೇಲಿನ ಆಭರಣ ಮತ್ತು ಶರಣರ ಪಾದರಕ್ಷೆಯೇ ತಲೆಯ ಮೇಲಿನ ಬಾಸಿಗದ ಕಿರೀಟವಾಗಿದ್ದು, ಇದು ಶರಣರ ಬಗೆಗಿನ ಅತ್ಯಂತ ಆಳವಾದ ವಿನಯ ಮತ್ತು ಭಕ್ತಿಯನ್ನು ತೋರಿಸುತ್ತದೆ.\n\nಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನ ಎಂಬ ನಿರಾಕಾರ ಪರಮಸತ್ಯದೊಡನೆ ಒಂದಾಗಲು ಹೊರಟ ಸಾಧಕಿಗೆ ಈ ಆಧ್ಯಾತ್ಮಿಕ ಮೌಲ್ಯಗಳೇ ನಿಜವಾದ ಶೃಂಗಾರವಾಗಿರುವಾಗ, ಹೊರಗಿನ ಬೇರೆ ಲೌಕಿಕ ಸಿಂಗಾರಗಳ ಅಗತ್ಯವಾದರೂ ಏನಿದೆ ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ಆಶಯವಾಗಿದೆ."}},{"no":1179,"o":"ಗುರುವೆಂಬ ತೆತ್ತಿಗನು\n ಲಿಂಗವೆಂಬಲಗನು ಮನನಿಷ್ಠೆಯೆಂಬ ಕೈಯಲ್ಲಿ ಕೊಡಲು,\n ಕಾದಿದೆ ಗೆಲಿದೆ ಕಾಮನೆಂಬವನ.\n ಕ್ರೋಧಾದಿಗಳು ಕೆಟ್ಟು, ವಿಷಯಂಗಳೋಡಿದವು.\n ಅಲಗು ಎನ್ನೊಳು ನಟ್ಟು ಆನಳಿದ ಕಾರಣ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಲಿಂಗವ ಕರದಲ್ಲಿ ಹಿಡಿದೆ.","t":{"en":"When the sword-bearer called the Guru\nplaced the blade called *Linga* into the hand called steadfastness of mind,\nI fought and conquered the one called Kama.\nWrath and the rest were ruined, and the sense-pleasures fled.\nBecause that blade pierced into me and my 'I' perished,\nI held the *Linga* Chennamallikarjuna in my hand.","hi":"गुरु नामक आत्मीय रक्षक ने\nलिंग नामक खड्ग को मनोनिष्ठा नामक हाथ में देने पर,\nमैं लड़ी और जीत लिया काम नामक शत्रु को।\nक्रोधादि नष्ट हो गए, विषय भाग खड़े हुए।\nवह खड्ग मुझमें धँसकर मेरा अहं मिट जाने के कारण,\nमैंने चेन्नमल्लिकार्जुनलिंग को हाथ में धारण कर लिया।","mr":"गुरू नावाच्या शस्त्रधारकाने\nलिंग नावाची तलवार मनोनिष्ठा नावाच्या हाती दिल्यावर,\nमी काम नावाच्या शत्रूशी झुंजले आणि जिंकले.\nक्रोधादी विकार नष्ट झाले, आणि विषयवासना पळून गेल्या.\nती तलवार माझ्यात रुतून माझा 'मी'पणा मिटल्यामुळे,\nचेन्नमल्लिकार्जुनलिंगाला मी करांमध्ये धारण केले.","fr":"Lorsque ce gardien fidèle que l'on appelle le Guru\nremit cette lame que l'on appelle le Linga dans cette main que l'on appelle la fermeté de l'esprit,\nje combattis et je vainquis celui que l'on appelle le Désir.\nLa colère et les autres passions périrent, les objets des sens s'enfuirent.\nParce que la lame s'est enfoncée en moi et que le moi a été anéanti,\nj'ai tenu dans ma paume le Linga Chennamallikarjuna.","te":"గురువనే ఆప్తరక్షకుడు\nలింగమనే కత్తిని మనోనిష్ఠ అనే చేతిలో ఇవ్వగా,\nకాముడనేవానితో పోరాడాను, గెలిచాను.\nక్రోధాదులు నశించి, విషయవాంఛలు పారిపోయాయి.\nఆ కత్తి నాలో నాటుకొని నేను నశించిన కారణంగా,\nచెన్నమల్లికార్జునలింగాన్ని చేతిలో ధరించాను.","kn":"ಗುರುವೆಂಬ ತೆತ್ತಿಗನು\n ಲಿಂಗವೆಂಬಲಗನು ಮನನಿಷ್ಠೆಯೆಂಬ ಕೈಯಲ್ಲಿ ಕೊಡಲು,\n ಕಾದಿದೆ ಗೆಲಿದೆ ಕಾಮನೆಂಬವನ.\n ಕ್ರೋಧಾದಿಗಳು ಕೆಟ್ಟು, ವಿಷಯಂಗಳೋಡಿದವು.\n ಅಲಗು ಎನ್ನೊಳು ನಟ್ಟು ಆನಳಿದ ಕಾರಣ,\n ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಲಿಂಗವ ಕರದಲ್ಲಿ ಹಿಡಿದೆ."},"m":{"en":"This Vachana uses the metaphor of a spiritual battlefield to illustrate how the grace of the Guru and unwavering mental devotion overcome inner passions and ego.\n\nHere, the Guru is portrayed as a trusted attendant who places the sword of the Ishtalinga—the sacred symbolic medium of Formless Supreme Consciousness—into the hand of steadfast devotion, enabling the seeker to fight and conquer desire, anger, and sensory temptations.\n\nTrue spiritual victory occurs when this blade of awareness pierces inward to dissolve the personal ego (\"I\"), rather than merely fighting external battles.\n\nWith the complete dissolution of the ego, the seeker attains direct realization of the Supreme Reality, invoked as Channamallikarjuna, holding the Linga on the palm in a state of unified consciousness.","hi":"यह वचन एक युद्ध के रूपक के माध्यम से आंतरिक विकारों पर विजय पाने और अहं के विलय से होने वाले आध्यात्मिक रूपांतरण को स्पष्ट करता है।\n\nजब गुरु रूपी शस्त्र-प्रदाता साधक के मन की एकाग्रता और निष्ठा रूपी हाथ में इष्टलिंग रूपी तलवार सौंपते हैं, तब साधक उस आध्यात्मिक शस्त्र के बल से कामनाओं से युद्ध करके उन पर विजय प्राप्त कर लेता है।\n\nइस आंतरिक संघर्ष के परिणामस्वरूप क्रोध आदि विकार नष्ट हो जाते हैं और समस्त सांसारिक विषय-वासनाएं पलायन कर जाती हैं।\n\nजब वह लिंग-रूपी ज्ञान की धार साधक के भीतर गहराई से उतरती है और उसका व्यक्तिगत अहंकार ('मैं'-पन) पूरी तरह मिट जाता है, तभी वह अपने कर-कमल में चन्नमल्लिकार्जुनलिंग रूपी परम सत्य को वास्तविक अर्थों में धारण कर पाता है।","mr":"हे वचन आध्यात्मिक संघर्षावर विजय मिळवून आत्मसाक्षात्कार साधण्याचा मार्ग अत्यंत प्रभावी रूपकातून स्पष्ट करते.\n\nसद्गुरूंनी एक विश्वासू साहाय्यक बनून, इष्टलिंगाचे पवित्र शस्त्र मननिष्ठेच्या हाती दिल्यामुळे साधकाला कामवासनेशी लढून त्यावर विजय मिळवणे शक्य होते.\n\nया आंतरिक लढाईत क्रोध आणि इतर सर्व विकार नष्ट होऊन इंद्रियसुखाची सर्व प्रलोभने पळून जातात.\n\nजेव्हा हे लिंगरूपी शस्त्र अंतःकरणात खोलवर रुजून 'मी'पणाचा अर्थात अहंकाराचा पूर्णपणे नाश होतो, तेव्हाच साधकाच्या हाती चन्नमल्लिकार्जुन या निराकार परमतत्त्वाचे प्रतीक असलेले लिंग खऱ्या अर्थाने स्थिरावते.","fr":"Ce vachana illustre par une puissante métaphore guerrière la victoire intérieure sur les passions humaines grâce à l'initiation spirituelle.\n\nLorsque le Guru, décrit ici comme un fidèle écuyer, remet le Linga telle une lame tranchante entre les mains d'un esprit résolu et pleinement dévoué, le chercheur spirituel peut livrer bataille contre le désir charnel, le vaincre, et mettre en déroute la colère ainsi que l'attrait des plaisirs sensoriels.\n\nCette lame symbolique de la conscience s'enfonce au plus profond de l'être jusqu'à dissoudre entièrement l'ego et le sentiment du « moi ».\n\nLa portée spirituelle de ce poème réside dans l'idée que ce n'est qu'après l'anéantissement de l'individualité limitée que l'on peut véritablement tenir dans sa paume l'Ishtalinga, miroir sacré de la Réalité suprême sans forme invoquée sous le nom de Channamallikarjunalinga.","te":"ఈ వచనం సూచిస్తున్న అంతరార్థం ఏమిటంటే, అంతరంగ శత్రువులను జయించి అహంకారాన్ని నిర్మూలించుకునే ఆధ్యాత్మిక సాధనను ఇక్కడ ఒక అంతర్గత యుద్ధ రూపకంగా ఆవిష్కరించడం జరిగింది.\n\nనమ్మకమైన సహాయకుడి వంటి గురువు, మనోనిష్ఠ అనే చేతికి ఇష్టలింగమనే పదునైన ఖడ్గాన్ని అందించినప్పుడు, సాధకుడు దానితో పోరాడి కామాన్ని జయిస్తాడు.\n\nఆ ఆధ్యాత్మిక పోరాటంలో క్రోధం మొదలైన అరిషడ్వర్గాలు నశించిపోయి, ఇంద్రియ విషయ వాసనలన్నీ పారిపోతాయి.\n\nచివరకు ఆ లింగమనే ఖడ్గం తనలోనే నాటుకుని 'నేను' అనే అహంకారం పూర్తిగా అంతరించడం వల్లనే, సాధకుడు నిరాకార పరమచైతన్యానికి ప్రతీకయైన చెన్నమల్లికార్జునలింగాన్ని తన అరచేతిలో నిలుపుకోగలిగాడు.","kn":"ಈ ವಚನದಲ್ಲಿ ಗುರುಕೃಪೆಯಿಂದ ದೊರೆಯುವ ಇಷ್ಟಲಿಂಗ ಸಾಧನೆಯು ಮನುಷ್ಯನ ಒಳಗಿನ ಬಯಕೆಗಳನ್ನು ಹಾಗೂ ಅಹಂಕಾರವನ್ನು ಹೇಗೆ ಗೆಲ್ಲುತ್ತದೆ ಎಂಬ ಆಳವಾದ ಆಧ್ಯಾತ್ಮಿಕ ಅನುಭವವನ್ನು ಯುದ್ಧದ ರೂಪಕದ ಮೂಲಕ ವಿವರಿಸಲಾಗಿದೆ.\n\nಜೀವಕ್ಕೆ ನಿಷ್ಠಾವಂತ ರಕ್ಷಕನಂತಿರುವ ಗುರುವು, ನಿರಾಕಾರ ಪರಮತತ್ತ್ವದ ಕುರುಹಾದ ಇಷ್ಟಲಿಂಗವೆಂಬ ಕತ್ತಿಯನ್ನು ಮನಸ್ಸಿನ ಏಕಾಗ್ರತೆ ಮತ್ತು ದೃಢನಿಷ್ಠೆಯೆಂಬ ಕೈಗೆ ನೀಡುತ್ತಾನೆ.\n\nಈ ಲಿಂಗನಿಷ್ಠೆಯ ಬಲದಿಂದ ಹೋರಾಡಿದಾಗ, ಬಯಕೆಗಳ ರೂಪವಾದ ಕಾಮವು ಸೋತುಹೋಗುತ್ತದೆ ಹಾಗೂ ಕೋಪ ಮುಂತಾದ ಅರಿಷಡ್ವರ್ಗಗಳು ಮತ್ತು ಇಂದ್ರಿಯಗಳ ಲೌಕಿಕ ಆಕರ್ಷಣೆಗಳು ನಾಶವಾಗಿ ಓಡಿಹೋಗುತ್ತವೆ.\n\nಲಿಂಗವೆಂಬ ಅರಿವಿನ ಅಲಗು ಸಾಧಕನ ಅಂತರಂಗದಲ್ಲೇ ಆಳವಾಗಿ ನೆಟ್ಟು 'ನಾನು' ಎಂಬ ಅಹಂಕಾರವು ಸಂಪೂರ್ಣವಾಗಿ ಅಳಿದುಹೋದಾಗ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನಲಿಂಗ ಎಂಬ ಪರಮಸತ್ಯವನ್ನು ಅಂಗೈಯಲ್ಲಿ ಹಿಡಿದು ಸಾಕ್ಷಾತ್ಕರಿಸಿಕೊಳ್ಳಲು ಸಾಧ್ಯವಾಯಿತು ಎಂಬುದು ಈ ವಚನದ ಮುಖ್ಯ ತಾತ್ಪರ್ಯವಾಗಿದೆ."}},{"no":1180,"o":"ಗುರುವೆ ತೆತ್ತಿಗನಾದ,\n ಲಿಂಗವೆ ಮದುವಣಿಗನಾದ,\n ನಾನೆ ಮದುವಳಿಗೆಯಾದೆನು.\n ಈ ಭುವನವೆಲ್ಲರಿಯಲು ಅಸಂಖ್ಯಾತರೆನಗೆ ತಾಯಿತಂದೆಗಳು.\n ಕೊಟ್ಟರು ಸಾದೃಶ್ಯವಪ್ಪ ವರನ ನೋಡಿ.\n ಇದು ಕಾರಣ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನೆ ಗಂಡನೆನಗೆ.\n ಮಿಕ್ಕಿನ ಲೋಕದವರೆನಗೆ ಸಂಬಂಧವಿಲ್ಲವಯ್ಯಾ ಪ್ರಭುವೆ.","t":{"en":"The Guru himself became the kinsman who gave me away,\nthe *Linga* itself became the bridegroom,\nand I myself became the bride.\nFor all this world to know, the countless *Sharanas* are my mother and father.\nSeeing a groom who is my true match, they gave me in marriage.\nTherefore, Chennamallikarjuna alone is my husband;\nI have no bond with any other men of this world, O Lord, O Master.","hi":"गुरु ही आत्मीय संगी बने,\nलिंग ही दूल्हा बना,\nमैं ही दुल्हन बनी।\nयह सारा भुवन जानता है कि असंख्य शरण ही मेरे माता-पिता हैं।\nउन्होंने अनुरूप वर देखकर मुझे ब्याह दिया।\nइस कारण, चेन्नमल्लिकार्जुन ही मेरे पति हैं।\nशेष संसारवालों से मेरा कोई संबंध नहीं है, हे प्रभु।","mr":"गुरूच सोयरा झाला,\nलिंगच वर झाला,\nआणि मीच वधू झाले.\nहे संबंध जग जाणे, असंख्य शरणच माझे आई-वडील आहेत.\nत्यांनी अनुरूप असा वर पाहून मला दिले.\nयाच कारणाने, चेन्नमल्लिकार्जुनच माझा पती आहे.\nहे प्रभो, उरलेल्या जगातील लोकांशी माझा काहीही संबंध नाही.","fr":"Le Guru lui-même est devenu le garant des noces,\nle Linga lui-même est devenu le marié,\net moi-même, je suis devenue la mariée.\nAu su de tout cet univers, les Innombrables sont pour moi mère et père.\nAprès avoir trouvé un époux sans pareil, ils m'ont donnée en mariage.\nPour cette raison, Chennamallikarjuna seul est mon époux.\nLes autres gens de ce monde n'ont aucun lien avec moi, ô Seigneur, ô Maître.","te":"గురువే కన్యాదాత ఆయెను,\nలింగమే పెళ్లికొడుకాయెను,\nనేనే పెళ్లికూతురునైతిని.\nఈ భువనమంతా తెలియునట్లు అసంఖ్యాకులే నాకు తల్లిదండ్రులు.\nఅనురూపుడైన వరుని చూసి నన్ను ఇచ్చిరి.\nఇందువలన, చెన్నమల్లికార్జునుడే నాకు భర్త.\nమిగిలిన లోకంలోని వారితో నాకు సంబంధం లేదయ్యా, ఓ ప్రభూ.","kn":"ಗುರುವೆ ತೆತ್ತಿಗನಾದ,\n ಲಿಂಗವೆ ಮದುವಣಿಗನಾದ,\n ನಾನೆ ಮದುವಳಿಗೆಯಾದೆನು.\n ಈ ಭುವನವೆಲ್ಲರಿಯಲು ಅಸಂಖ್ಯಾತರೆನಗೆ ತಾಯಿತಂದೆಗಳು.\n ಕೊಟ್ಟರು ಸಾದೃಶ್ಯವಪ್ಪ ವರನ ನೋಡಿ.\n ಇದು ಕಾರಣ, ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನೆ ಗಂಡನೆನಗೆ.\n ಮಿಕ್ಕಿನ ಲೋಕದವರೆನಗೆ ಸಂಬಂಧವಿಲ್ಲವಯ್ಯಾ ಪ್ರಭುವೆ."},"m":{"en":"This Vachana uses the metaphor of marriage to express a profound spiritual union with the Formless Supreme Consciousness, addressed here through the ankitanama Channamallikarjuna.\n\nIn this sacred union, the Guru acts as the matchmaker who initiates the seeker into the path of Linga, the symbolic medium leading to the Absolute, while the innumerable Sharanas serve as spiritual parents who witness and bless the bond with a truly worthy partner.\n\nBy claiming Channamallikarjuna alone as the eternal spouse, the speaker rejects conventional, perishable human marriage and declares complete freedom from all worldly relationships and societal ties.","hi":"यह वचन आत्मा और निराकार परमतत्त्व के साथ हुए आध्यात्मिक मिलन को एक विवाह के रूपक के माध्यम से स्पष्ट करता है।\n\nइसमें गुरु को इस दिव्य संबंध को जोड़ने वाला मध्यस्थ, लिंग को वर और स्वयं साधक को वधू के रूप में चित्रित किया गया है।\n\nपूरे संसार के साक्षी रूप में असंख्य शरण समुदाय ने माता-पिता की भूमिका निभाते हुए साधक का हाथ सर्वथा अनुरूप परम सत्य रूपी वर के हाथों में सौंपा है।\n\nइस वचन का मूल भाव यह है कि जब चन्नमल्लिकार्जुन रूपी निराकार चैतन्य ही एकमात्र पति बन जाता है, तब साधक का सांसारिक लोगों और लौकिक बंधनों से कोई संबंध शेष नहीं रह जाता।","mr":"या वचनात साधक आणि निराकार परमतत्त्व यांच्यातील अद्वैत मीलन विवाहाच्या सुंदर रूपकातून स्पष्ट केले आहे.\n\nयेथे गुरूने मध्यस्थाची भूमिका बजावून, अखंड चैतन्याचे प्रतीक असलेल्या लिंगरूपी वराशी साधकरूपी वधूचा आध्यात्मिक विवाह जुळवून आणला आहे.\n\nअसंख्य पुरातन शरणांनी आई-वडिलांच्या मायेने साऱ्या विश्वाच्या साक्षीने साधकाला अनुरूप असा हा अलौकिक वर निवडून दिला आहे.\n\nया शाश्वत मीलनामुळे आता केवळ चन्नमल्लिकार्जुन हे परमतत्त्वच आपले एकमेव सर्वस्व असून, उरलेल्या नश्वर जगाशी व लौकिक पाशांशी आपला कोणताही संबंध उरलेला नाही, हा ठाम आध्यात्मिक निश्चय यातून व्यक्त होतो.","fr":"Ce vachana utilise la métaphore du mariage pour exprimer l'union spirituelle entre la conscience individuelle et la Réalité suprême sans forme, désignée ici sous le nom de Channamallikarjuna.\n\nDans cette alliance sacrée, le Guru agit comme l'intermédiaire qui unit l'être au Linga, tandis que la communauté des innombrables Sharanas (Asankhyata) joue le rôle des parents ayant choisi cet époux idéal au vu du monde entier.\n\nCette consécration intérieure établit une appartenance exclusive au Principe absolu, rendant désormais caduc et sans objet tout lien conjugal ou attachement aux relations conventionnelles de ce monde.","te":"ఈ వచనంలోని ఆధ్యాత్మిక అంతరార్థం ఏమిటంటే, సాధకురాలు పరమసత్యంతో పొందిన ఐక్యతను ఒక అలౌకిక వివాహ బంధంగా అభివర్ణించడం జరిగింది.\n\nఇందులో ఆధ్యాత్మిక మార్గదర్శి అయిన గురువే సంబంధం కుదిర్చే మధ్యవర్తిగా నిలవగా, నిరాకార తత్త్వానికి ప్రతీకయైన లింగమే వరునిగా, సాధకురాలు వధువుగా మారారు.\n\nసమస్త లోకమూ ఎరిగేలా అసంఖ్యాక శరణుల సమూహమే తల్లిదండ్రులై, తమకు తగిన వరుని చూసి ఈ ఆధ్యాత్మిక వివాహాన్ని జరిపించారు.\n\nఅందువల్ల, నిరాకార పరమచైతన్యమైన చెన్నమల్లికార్జున తత్త్వమే తనకు నిజమైన భర్త అని, ఇక మిగిలిన లౌకిక ప్రపంచంలోని వారితో తనకు ఎలాంటి బంధమూ లేదని ఈ వచనం స్పష్టం చేస్తోంది.","kn":"ಈ ವಚನದಲ್ಲಿ ಸಾಧಕಿಯ ಜೀವವು ನಿರಾಕಾರ ಪರಮಸತ್ಯವಾದ ಚೆನ್ನಮಲ್ಲಿಕಾರ್ಜುನನೊಂದಿಗೆ ಶಾಶ್ವತವಾಗಿ ಒಂದಾಗುವ ಅನುಭಾವದ ಸ್ಥಿ
